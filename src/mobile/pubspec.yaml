name: korean_math_app
description: 한국 중·고 수학 메타인지 코칭 앱
publish_to: 'none'
version: 0.1.0+1

environment:
  # 하한 = 검증 바닥선: CI(3.41.9)=Kiki 머신(Dart 3.11) 정합(MOB-01·2026-07-20). 3.9(구 CI
  # 3.35)에선 test_api 0.7.6 고정→analyzer<8 강제로 freezed3/retrofit_generator10 격자가 불충족
  # (실측) — 하한이 곧 해석 가능 바닥선이다. 빌드 재현성 정본은 커밋된 pubspec.lock.
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 상태관리
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  # 라우팅
  go_router: ^14.0.0
  # 모델·직렬화
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  # 네트워크
  dio: ^5.4.0
  # retrofit — *기능 확장 시* 재도입한다(현재 lib/test 사용처 0·선언만 있던 상태, MOB-09).
  # 제거 이유: coach_api.dart·problems_api.dart 둘 다 "retrofit 코드젠 대신 명시적 메서드를
  # 둔다(보수적·디버깅 용이)"를 이미 명시적으로 선택했고 @RestApi 실사용 0. dev_dependencies의
  # retrofit_generator도 짝으로 함께 제거(생성 대상이 없어 무의미).
  # 보안
  flutter_secure_storage: ^9.2.0
  # localization — 앱 코드에서 직접 쓰지 않고 flutter_localizations가 전이 의존한다. SDK 버전이
  # 요구하는 intl을 그대로 따르도록 범위를 넓힌다(Flutter 3.24.x=0.19·최신=0.20.2 모두 해소).
  intl: ">=0.19.0 <0.21.0"
  # 미디어 — cached_network_image·video_player는 *기능 착수 시* 재도입한다(현재 lib/test
  # 사용처 0·선언만 있던 상태, MOB-09). image_picker는 OCR 사진 업로드에 실사용 중이라 유지.
  image_picker: ^1.0.7
  # 수식 렌더 — S3-39로 재도입(기능 착수). MOB-09가 "사용처 0"으로 제거했던 이유가 바로 이
  # 렌더 기능(원 S3-21)이 미병합 브랜치에 고립돼 있었기 때문임이 확인돼, 회수와 함께 되살린다.
  # 현재 실사용처: lib/shared/widgets/math_text.dart(MathText·KaTeX 조판·fail-closed 원문 폴백)와
  # 그것을 쓰는 chat_screen·coach_emphasis_text·problem_screen. 수식 *입력*은 여전히 MathLive
  # WebView 임베드가 담당하고, 이 패키지는 *표시*(순수 Dart 렌더러·WebView 불요)만 맡는다.
  flutter_math_fork: ^0.7.4
  # 웹뷰 (Desmos·GeoGebra)
  webview_flutter: ^4.7.0
  # 음성 — 클라 TTS/STT는 *기능 착수 시* 재도입한다(현재 lib/test 사용처 0·선언만 있던 상태).
  # 제거 이유: speech_to_text 7.4.0은 자기 gradle에서 flutter.compileSdkVersion을 참조해
  # (Flutter 3.27+ 전용 주입) 고정판 3.24.5의 안드로이드 빌드를 치명 실패시키고, flutter_tts
  # 4.2.5는 compileSdk 36 하드코딩. 재도입 시 고정 Flutter와의 Gradle 호환을 실기기 빌드로 검증할 것.
  # 차트 — fl_chart는 *기능 착수 시* 재도입한다(현재 lib/test 사용처 0·선언만 있던 상태, MOB-09).
  # 푸시 — 클라 FCM 연동은 *기능 착수 시* 재도입한다(현재 firebase_messaging·firebase_core
  # lib/test 사용처 0·선언만 있던 상태 — MOB-08, TTS/STT 제거에 이은 2회차 반복실수).
  # 제거 이유: google-services.json 파일 자체가 저장소에 없고, android/ Gradle(build.gradle·
  # settings.gradle·app/build.gradle) 어디에도 Firebase 플러그인이 적용돼 있지 않으며, ios/
  # 디렉터리 자체가 존재하지 않는다 — 두 패키지 모두 플랫폼 설정이 전혀 안 걸려 선언만 존재했다.
  # 재도입 시 FCM을 실제 기능으로 구현하며(디바이스 토큰 발급·백엔드 저장·google-services.json·
  # Gradle 플러그인 적용) 함께 진행할 것.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.7.0
  # riverpod 3 = build 4.x 트랙 — freezed 3와 동일 트랙(2026-07-20 MOB-01). retrofit_generator는
  # retrofit(dependencies) 제거와 짝으로 함께 제거했다(MOB-09 — 생성 대상이 없어 무의미).
  riverpod_generator: ^3.0.0
  mocktail: ^1.0.3
  golden_toolkit: ^0.15.0


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/animations/
    # 그래프 계산기 웹 번들(vendored·오프라인 WebView 임베드) — tool/sync_graphing_calculator.sh로 동기화.
    # Flutter 자산은 비재귀라 하위 디렉터리를 명시 등록한다(index.html·런타임 js·KaTeX 폰트).
    - assets/graphing_calculator/
    - assets/graphing_calculator/assets/
    - assets/graphing_calculator/mathlive/fonts/
    # MathLive 수식 입력기(vendored·오프라인 WebView 임베드) — 풀이 수식 입력(S1).
    # Flutter 자산은 비재귀라 하위 디렉터리(index.html·mathlive.min.js·KaTeX 폰트)를 명시 등록한다.
    - assets/mathlive_input/
    - assets/mathlive_input/fonts/
