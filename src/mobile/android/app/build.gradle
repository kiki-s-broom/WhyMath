plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "app.whymath.korean_math_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Java 17 — Flutter 3.41 템플릿 정합(MOB-01). Kotlin 2.2에서 jvmTarget 1.8은 deprecated.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // 잠정 applicationId — 앱 ID 등 코드 식별자 일괄 rename은 별도 작업(MEMORY 결정 로그
        // 2026-06 "코드 식별자 마이그레이션 영향 검토 후 일괄 변경"). 스토어 배포 전까지 변경 자유.
        applicationId = "app.whymath.korean_math_app"
        // minSdk 23 — flutter 기본(21)보다 올림: firebase 계열(BoM 상향 대비)·플러그인 여유·
        // 시연 기기(API 31)와 실사용층(중·고생 최신 기기) 기준 손실 없음.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // MOB-15: 스토어 배포 전 release 서명키 생성·keystore 배선이 필수다 — 현재는
            // debug 키로 서명해 `flutter run --release`가 동작하게만 해 둔 사전 릴리스 상태다.
            // 이 상태를 인지하지 못한 채 스토어에 배포하면 서명 위조·업데이트 하이재킹 위험이다.
            // 실제 keystore 생성·서명키 등록은 Kiki 소유 비밀/계정이 필요해 기계 대체가 불가하다
            // — 추적: 사람 게이트 G-android-release-store-signing(backlog/gates.yaml).
            // 이 주석이 삭제된 채 debug 서명이 남으면 test/android_release_signing_gate_test.dart가 감지한다.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
