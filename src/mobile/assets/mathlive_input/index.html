<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수식 입력 — WhyMath</title>
    <style>
      /* 정서 안전·중립 톤: 정오 강조·빨강 경고·게임화 없음(절대 금기). */
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #host {
        padding: 12px;
        box-sizing: border-box;
      }
      math-field,
      #fallback {
        width: 100%;
        min-height: 64px;
        font-size: 22px;
        box-sizing: border-box;
        border: 1px solid #c9c9d4;
        border-radius: 10px;
        padding: 10px;
      }
      #fallback {
        resize: vertical;
      }
      /* 햄버거(컨텍스트 메뉴 토글) 정적 숨김 — JS의 menuItems=[]가 인라인으로도 숨기지만
         (아래 주석 참조), JS 순서가 바뀌어도 노출되지 않게 CSS 가드를 이중으로 둔다.
         part=menu-toggle는 번들 v0.110.0 실측(shadow DOM part 속성) — 고3 UX 소음 제거. */
      math-field::part(menu-toggle) {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <!-- IIFE 번들(1순위) — Android WebView는 file://(origin null)에서 ES 모듈 import를 CORS로
         차단하므로(실기기 실측), CORS가 적용되지 않는 클래식 스크립트로 같은 라이브러리를 싣는다.
         esbuild --format=iife --global-name=MathLiveBundle 산출물(mathlive.min.js와 동일 소스). -->
    <script src="./mathlive.iife.js"></script>
    <script type="module">
      // 학생 수식 입력을 LaTeX로 Flutter에 흘린다(단방향 web→Flutter). 수학 판정·검증은 하지
      // 않는다 — LaTeX 원문만 넘기고 백엔드(L3 verify)가 검증한다(CLAUDE.md 표현≠의미).
      const host = document.getElementById("host");

      function emit(latex) {
        if (window.WhymathMathInput) {
          window.WhymathMathInput.postMessage(latex == null ? "" : latex);
        }
      }

      // 명령 훅(whymathFocus 등) 준비 완료를 Flutter에 한 번 알린다(S3-50·원 S3-19). Flutter는
      // 이 신호를 받고 자동 포커스를 요청해 진입 즉시 수식 키보드를 띄운다(키보드 아이콘 재탭
      // 불요). 이 모듈 스크립트는 top-level await로 비동기 실행되므로 onPageFinished 시점엔 훅이
      // 아직 미정의일 수 있다 — ready 시점 통지가 자동 포커스 성립의 유일하게 확실한 기준점이다.
      function emitReady() {
        if (window.WhymathMathReady) {
          window.WhymathMathReady.postMessage("ready");
        }
      }

      // MathLive 로드 실패(자산 누락·구버전 WebView) 시에도 입력이 끊기지 않도록 textarea 폴백.
      function useFallback() {
        const ta = document.createElement("textarea");
        ta.id = "fallback";
        ta.setAttribute("aria-label", "풀이 수식 입력");
        ta.placeholder = "풀이를 입력하세요";
        ta.addEventListener("input", () => emit(ta.value));
        host.appendChild(ta);
        window.whymathSetLatex = (v) => {
          ta.value = v == null ? "" : v;
        };
        window.whymathClear = () => {
          ta.value = "";
          emit("");
        };
        window.whymathFocus = () => ta.focus();
        emitReady(); // 폴백(textarea)도 훅이 준비됐음을 알린다(자동 포커스 대상).
      }

      // 3단 폴백: ①IIFE 전역(실기기 file:// 안전) → ②동적 import(개발·http 서빙 환경) →
      // ③textarea(둘 다 실패 시 — 입력 자체는 절대 끊기지 않는다).
      async function loadMathLive() {
        if (window.MathLiveBundle && window.MathLiveBundle.MathfieldElement) {
          return window.MathLiveBundle;
        }
        return await import("./mathlive.min.js");
      }

      try {
        const mod = await loadMathLive();
        const MathfieldElement = mod.MathfieldElement;
        // 폰트는 같은 번들에 vendored(KaTeX_*.woff2). 소리 자산은 없으므로 끈다.
        MathfieldElement.fontsDirectory = "./fonts";
        MathfieldElement.soundsDirectory = null;
        if (!customElements.get("math-field")) {
          customElements.define("math-field", MathfieldElement);
        }
        const mf = new MathfieldElement();
        mf.id = "mf";
        mf.setAttribute("aria-label", "풀이 수식 입력");
        // 가상 키보드는 수동 정책 — 필드 우측 키보드 토글(part=virtual-keyboard-toggle)이
        // 유일한 진입점이므로 토글은 유지한다. 플랫폼(시스템) 키보드는 MathLive 입력 싱크가
        // inputmode=none이라 뜨지 않는다(번들 실측).
        //
        // 키보드 도킹 메커니즘(번들 v0.110.0 실측): container 기본값 = document.body →
        // `body > .ML__keyboard { position: fixed }` + `.ML__keyboard { top:0; height:100% }`가
        // WebView *뷰포트 전체*를 덮고, `.MLK__backdrop`이 그 하단으로 슬라이드해 도킹한다.
        // 즉 키보드는 항상 "WebView 뷰포트의 하단"에 붙는다 — WebView가 화면을 충분히
        // 채워야(키보드 자연 높이 약 300 CSS px 이상) 잘림이 없다. Flutter 쪽에서 이 화면의
        // WebView를 Expanded(전체 높이)로 배치하는 이유(mathlive_input_screen.dart 참조).
        // container를 커스텀 요소로 바꾸면 position:relative 모드로 전환돼 배치를 직접
        // 관리해야 하므로 기본(body)을 유지한다.
        mf.mathVirtualKeyboardPolicy = "manual";
        mf.addEventListener("input", () => emit(mf.getValue("latex")));
        // MathLive 자체 컨텍스트 메뉴가 못 열려도 브라우저 기본 메뉴가 새지 않게 억제(폴백).
        // contextmenu는 composed 이벤트라 shadow DOM 경계를 넘어 여기서 잡힌다.
        mf.addEventListener("contextmenu", (e) => e.preventDefault());
        host.appendChild(mf);
        // 컨텍스트 메뉴 비활성(행렬 삽입·Insert·모드·글꼴 등 — 고3 UX 소음 제거).
        // 번들 v0.110.0 실측: menuItems setter는 ①빈 배열이면 햄버거 토글에 display:none
        // 인라인 적용 ②메뉴가 비면 Menu.visible=false → show()가 즉시 no-op(롱프레스·
        // 우클릭·토글 전부 차단). 주의: 마운트 전 호출은 "Mathfield not mounted" throw →
        // 반드시 appendChild *이후*에 설정한다(순서 변경 금지 — 정적 테스트가 순서를 동결).
        // 국소 try: 메뉴 비활성은 코스메틱이라 실패해도 필드를 유지한다 — 바깥 catch로
        // 새면 이미 붙은 math-field 위에 textarea까지 이중 부착되는 강등 사고가 된다.
        try {
          mf.menuItems = [];
        } catch (menuErr) {
          // 침묵 실패 금지(CLAUDE.md): 예외 타입명을 로그에 남긴다(값·시크릿 없음).
          console.warn(
            "[whymath] menuItems 비활성 실패 — 메뉴 노출 열화로 계속: " +
              (menuErr && menuErr.name)
          );
        }
        window.whymathSetLatex = (v) => mf.setValue(v == null ? "" : v);
        window.whymathClear = () => {
          mf.setValue("");
          emit("");
        };
        // 포커스 + 수식 키보드 표시(S3-50·원 S3-19). 정책이 manual이라 focus()만으로는 키보드가
        // 뜨지 않으므로 전역 mathVirtualKeyboard.show()로 명시적으로 띄운다(manual 정책 유지 —
        // 앱이 표시 시점 제어·토글은 그대로 수동 진입점으로 공존). 전역 훅이 없거나 show가 없으면
        // (구버전) 최소한 필드 포커스는 성립한다(방어).
        window.whymathFocus = () => {
          mf.focus();
          if (window.mathVirtualKeyboard && window.mathVirtualKeyboard.show) {
            window.mathVirtualKeyboard.show();
          }
        };
        emitReady(); // 훅 준비 완료 통지 — Flutter가 자동 포커스를 요청한다(진입 즉시 키보드).
      } catch (e) {
        useFallback();
      }
    </script>
  </body>
</html>
