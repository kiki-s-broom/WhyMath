    # EOS-89(slot_generator·render.adapters push 전환)와 별개로 남는 간선이다 — EOS-89는
    # 이 간선을 몰랐고(병행 개발), 이후 push 전환 여부는 별도 판단 대상이다.
    "whymath_backend.l4.solution_coaching -> whymath_backend.composition",
]

