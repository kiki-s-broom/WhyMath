[project]
name = "korean-math-backend"
version = "0.1.0"
description = "WhyMath 백엔드"
requires-python = ">=3.12"
dependencies = [
    # 웹 프레임워크
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # 데이터베이스
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    # psycopg(sync) — 슬105 PgVectorIndex 전용(벡터 store 좌석에 한정된 sync 드라이버).
    # 앱 본체는 async(asyncpg)이고, 이 sync 드라이버는 VectorIndex Protocol이 sync라 *영속
    # 벡터 인덱스 좌석에만* 도입한다. import는 PgVectorIndex 내부 lazy — 기본(memory) 경로는
    # psycopg 불요. async 앱 엔진은 무변경 (MEMORY 2026-06-10 슬105 결정 로그).
    "psycopg[binary]>=3.1",
    "alembic>=1.13.3",
    # 캐시·큐
    "redis[hiredis]>=5.1.0",
    "celery>=5.4.0",
    # 외부 통신
    "httpx>=0.27.2",
    # LLM — 상한: 우리가 실제 호출하는 표면(anthropic AsyncAnthropic.messages.create·models.list /
    # openai OpenAI().embeddings.create / ollama AsyncClient.generate·list)을 2026-07-21 실물 설치로
    # 실측 검증한 메이저까지만 허용(anthropic 0.117·openai 2.46·ollama 0.6에서 표면 확인). 무상한
    # pin이 v2/v4 혼재를 낳았던 langfuse 교훈(아래)과 동일 규칙 — 차기 메이저는 표면 재검증 후 승격.
    "anthropic>=0.40.0,<1",
    "openai>=1.50.0,<3",
    "ollama>=0.4.0,<1",
    # 벡터 DB(pgvector·Postgres 통합) — 마이그레이션·ORM이 top-level import라 메인 의존성 유지.
    "pgvector>=0.3.0",
    # 임베딩(sentence-transformers·bge-m3→torch 수 GB)은 [embedding] extra로 분리(슬110 #6) —
    # 기본(memory·게이트 off) 경로는 lazy import라 미사용. provider.py가 함수내 lazy import하고
    # mypy는 ignore_missing_imports=true라, extra 미설치 환경에서도 collection·hermetic·mypy green.
    # 인증·보안 — passlib[bcrypt]는 2026-07-30 SEC-07 D1로 제거(비밀번호 인증 미채택·
    # SSO 전용이라 src/ 실사용 0건 — account_security_gap_review.md §2-③).
    "python-jose[cryptography]>=3.3.0",
    # 관측성 — 상한 <5: 쓰기/읽기 표면을 v2.60·v3.15·v4.14에서 실측 검증(2026-07-16,
    # sink record는 create_event/event 적응·cost_report는 fetch_observations/api 적응).
    # 미검증 차기 메이저의 무단 유입을 차단한다(무상한 pin이 v2/v4 혼재를 낳았던 교훈).
    "langfuse>=2.50.0,<5",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "structlog>=24.4.0",
    # 데이터
    "pandas>=2.2.3",
    "polars>=1.10.0",
    "great-expectations>=1.0.0",
    # YAML — 교수법 팩 시더(l1/pedagogy)가 packs YAML을 파싱한다. data-pipeline 핀(pyyaml>=6.0.1)과
    # 동일 floor. `yaml.safe_load`만 쓴다(임의 객체 역직렬화 금지·안전 로더).
    "pyyaml>=6.0.1",
    # PDF·OCR·시각화
    "pdfplumber>=0.11.4",
    "sympy>=1.13.3",
]

[project.optional-dependencies]
# 임베딩(로컬 bge-m3) — sentence-transformers→torch(수 GB). 의미 매칭(슬104~)·라이브 통합
# 측정에 필요. 기본 배포·hermetic CI는 불요(lazy import·FakeEmbeddingProvider). 설치:
# `pip install -e ".[dev,embedding]"`. (OpenAI 임베딩은 openai 메인 의존성으로 별도.)
embedding = [
    "sentence-transformers>=3.1.0",
]
# L5 OCR(Phase A) — 손글씨 풀이 인식 경량 백엔드. rapidocr(검출·한글 텍스트)·rapid_latex_ocr
# (수식→LaTeX)는 ONNX 런타임 기반(torch 불요). pillow·numpy는 이미지 디코드/크롭(파이프라인
# `_decode_image` lazy import). 기본 배포·hermetic CI는 불요 — `ocr_enabled=False` + 함수내
# lazy import라 미설치 환경에서도 collection·import·mypy(ignore_missing_imports) green. 설치:
# `pip install -e ".[dev,ocr]"`. 미설치 시 부품은 명확한 RuntimeError(조용한 폴백 없음).
ocr = [
    "rapidocr-onnxruntime>=1.3.0",
    "rapid-latex-ocr>=0.0.9",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]
# L5 OCR(Phase B) — MFD(수식 영역 검출). rapid-layout는 RapidAI의 레이아웃 분석으로
# **Apache-2.0**·순수 ONNXRuntime(torch/ultralytics 불요)다. PP 계열 모델만 쓴다 —
# ultralytics 기반(yolov8*/doclayout*)은 AGPL-3.0이라 코드에서 거부한다(결정 우선순위 #2).
# lazy import라 미설치 CI에서도 green. 설치: `pip install -e ".[dev,ocr,ocr-layout]"`.
ocr-layout = [
    "rapid-layout>=1.2.0",
]
# L5 OCR(Phase C) — 무거운 백엔드(torch 수 GB). TexTeller·Qwen3-VL(transformers). Phase A/B
# 미사용(스텁 좌석)이라 분리한다. 실제 모델 배선은 후속 슬라이스. ultralytics(AGPL)는
# 제외한다 — MFD는 rapid-layout(Apache-2.0)으로 대체했다(우선순위 #2 법적 준수).
ocr-heavy = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
]
dev = [
    # 상한 핀 — data-pipeline에서 검증된 상한을 동일 적용 (2026-05-14).
    # 백엔드 CI 4스텝(ruff·black·mypy·pytest)을 동일 floor·동일 도구로 핀해
    # data-pipeline과 재현성을 일치시킨다. 다음 메이저는 재검증 후 상한을 올린다.
    "pytest>=8.3.3,<10",
    # 상한은 미검증 차기 메이저(2.x) 드리프트 예방 목적으로 유지한다(langfuse>=2.50,<5 동형).
    #
    # ⚠ 원인 정정 2026-09-06(OPS-61 — ARCH-22 관측의 2회차): ARCH-22(2026-07-30)는 명시 테스트
    # 경로 invocation에서 asyncio_mode가 미적용(strict 폴백)되는 현상을 **"무상한 pin"** 탓으로
    # 적었다. **그 진단은 틀렸다 — 실제 원인은 pin이 아니라 `rootdir` 해석이다.**
    #
    # `src/backend`에서 `pytest ../../tests/backend/...`처럼 **명시 경로**를 주면 pytest가 인자의
    # 공통조상을 상향 탐색해 **저장소 루트의 `pyproject.toml`을 rootdir 앵커로 잡는다**. 루트
    # `pyproject.toml`에는 `[tool.pytest.ini_options]`가 없으므로 이 파일의 `asyncio_mode = "auto"`
    # 가 **읽히지 않고** strict로 폴백하며, 그 결과 `async def` 테스트가 전부 실패한다.
    #
    # 실측(2026-09-06·pytest-asyncio 1.x):
    #     bare     → rootdir=src/backend        · inifile=src/backend/pyproject.toml · mode='auto'
    #     명시 경로 → rootdir=<저장소 루트>       · inifile=<루트>/pyproject.toml       · mode='strict'
    # 즉 **pin 버전과 무관**하며 상한을 올려도 내려도 재현된다. 2026-09-05 전체 스위트 730 실패 중
    # 718건(98.4%)이 이 형태였고, CI(bare `pytest`)는 같은 커밋에서 11,727 passed·0 failed였다.
    #
    # 함정 자체는 `tests/backend/conftest.py`의 `pytest_configure` 가드가 **1건의 즉시 실패**로
    # 바꾼다 — 718건의 혼란 대신 원인을 지목하는 UsageError 하나. 이 주석은 *왜 그 가드가 있는지*의
    # 근거이며, 가드를 지우려면 이 문단도 함께 지워야 한다(둘 중 하나만 남으면 다음 사람이 또 밟는다).
    "pytest-asyncio>=0.24.0,<2",
    "pytest-cov>=5.0.0",
    # pytest-randomly — 매 실행 테스트 순서를 섞어 *순서 의존*을 조기·반복 노출한다(OPS-09).
    # OPS-07 가드가 `db.session` 전역 오염의 *원인을 지목*한다면, 이쪽은 종류를 가리지 않고
    # 순서 의존의 *존재를 발견*한다 — 둘은 대체가 아니라 상보다. 도입 근거는 추정이 아니라
    # 실측이다: 2026-07-27 무작위 순서 전수에서 backend 6768 · infra 204 · harness 153 전건
    # 통과(유일 실패 1건은 신규 테스트의 실험조건 미통제였고 수정됨). 즉 이 도구 도입이 보통
    # 막히는 이유(숨은 순서 의존의 일괄 폭발)가 이 저장소에는 없다.
    # 실패 재현: 실행 헤더의 `Using --randomly-seed=N`을 그대로 `-p randomly --randomly-seed=N`
    # 으로 되먹이면 같은 순서가 재현된다(재현 불가능한 빨강을 만들지 않는 것이 도입 전제).
    # 상한: 메이저 재검증 관행(위 pytest 핀과 동일 정책).
    "pytest-randomly>=3.15,<4",
    # pytest-xdist — 테스트를 워커 프로세스로 분배해 CI 벽시계를 줄인다(OPS-58).
    # 도입 근거는 추정이 아니라 실측이다: `backend — lint·type·test` 잡 29분 41초 중
    # pytest 한 스텝이 26분 53초(90%)였고(run 33387572394 스텝 타임스탬프), 다른 스텝을
    # 다 합쳐도 3분이 안 돼 여기 말고는 줄일 곳이 없다.
    # 효과는 **실 CI A/B**로 쟀다(이 변경은 런타임 코드를 0줄 바꾸므로 base 커밋과 측정
    # 대상이 같다 — 통제 대조군이 성립한다): 직렬 main 1e2e341d 1585.46s → 병렬 855.75s
    # (1.85배), 테스트 결과는 양쪽 11268 passed·323 skipped·1 xfailed로 동일.
    # **계층별 커버리지가 수치까지 완전 일치**함이 도입의 선결 조건이었다(계층 게이트가
    # coverage.xml을 읽으므로 어긋나면 통과하면서도 틀린 판정을 낸다): api 3972/4122 ·
    # l1 3777/4334 · l2 1348/1376 · l3 9100/9747 · l4 3984/4170 — 다섯 계층 전부 동일.
    # 분배는 `--dist loadfile`(같은 파일 = 같은 워커)을 쓴다. 이 저장소는 순서 의존
    # 전역 오염 이력이 있고(OPS-06/07/09 — `db.session._engine`), 파일 단위로 묶으면
    # 모듈 스코프 픽스처 의미가 보존된다. 게다가 실측상 더 빠르다(32.0s vs 41.4s) —
    # 안전한 쪽이 동시에 빠른 쪽이라 트레이드오프가 없었다.
    # 상한: 메이저 재검증 관행(위 pytest 핀과 동일 정책).
    "pytest-xdist>=3.6,<4",
    "mypy>=1.13.0,<3",
    "ruff>=0.7.0,<0.16",
    "black>=24.10.0,<27",
    # import-linter — 7계층 단방향(L_n→L_{n-1}) 정적 강제(감사 I4). `lint-imports`가 CI lint
    # 잡에서 계약 위반(예: L1이 L4를 위로 import)을 차단한다. 순수 정적 그래프 분석이라 런타임·
    # 라이브 의존 0(hermetic).
    "import-linter>=2.0,<3",
    # PyYAML 타입 스텁 — l1/pedagogy 시더가 pyyaml을 쓰므로 mypy --strict용 스텁 동반
    # (data-pipeline dev 핀과 동일: types-PyYAML>=6.0.12).
    "types-PyYAML>=6.0.12",
    # 메모(M1.2): 기존 dev 핀에 있던 `mocktail>=1.0.0`은 *배포된 버전이 없어*
    # (PyPI 최신 0.0.4) `pip install -e .[dev]`를 실패시켜 CI를 깨뜨린다. M1.2
    # 라우터 단위테스트는 외부 모킹 라이브러리가 필요 없으므로(순수 결정 로직 +
    # interfaces.py 인메모리 스텁) 해당 핀을 제거한다. 모킹 라이브러리가 실제로
    # 필요해지면 (예: 라이브 LLM 연동 시) data-pipeline처럼 검증된 라이브러리를
    # 재도입한다.
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whymath_backend"]
# 패키지 데이터(라벨 프로브셋 JSONL) — 설치된 wheel에서도 `importlib.resources`로 로드 가능하게
# 명시 포함한다(WH-1 ② 오프라인 진단정확도·semantic_eval 프로브 단일 source of truth).
artifacts = ["whymath_backend/l4/misconception/probes_v1.jsonl"]

[tool.hatch.build.targets.wheel.force-include]
"whymath_backend/l4/misconception/probes_v1.jsonl" = "whymath_backend/l4/misconception/probes_v1.jsonl"

# ──────────────────────────────────────────────────────────────────────
# 린터·포맷
# ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "W"]
# 한국어 식별자 사용 금지 (N) 비활성 안 함: docstring·문자열만 한국어, 식별자는 영어
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]   # 테스트 픽스처에 긴 한국어 문자열 허용

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
# 외부 라이브러리(langfuse·ollama 등)는 타입 스텁 미제공 가능
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ──────────────────────────────────────────────────────────────────────
# import-linter — 7계층 단방향 의존 강제 (감사 I4·CLAUDE.md "L_n→L_{n-1}, 역방향 금지")
# ──────────────────────────────────────────────────────────────────────
# 수학 코어(L1~L4)를 UI 밖 독립 플랫폼으로 지키는 핵심 invariant를 *정적*으로 못 박는다.
# layers 계약: 위 레이어는 아래를 import할 수 있으나(호출), 아래는 위를 import할 수 없다(역방향
# 금지). schema는 최하위(순수 타입·어느 계층도 import 안 함). 미열거 패키지(config·db·privacy·
# harness·whs)는 계약 밖(무제약) — harness/whs는 L3/L4 하네스라 상위 호출이 정상이고, config·db·
# privacy는 횡단 인프라다. `lint-imports`(CI lint 잡)가 위반을 차단한다.
[tool.importlinter]
root_package = "whymath_backend"
# ARCH-48: 외부 패키지(`sqlalchemy`)를 forbidden 대상으로 쓰려면 필수다. 기존 3계약의 판정은
# 바뀌지 않는다(전부 whymath_backend 내부 간선만 본다 — 도입 전후 KEPT 동일, 실측 2026-09-16).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "7계층 단방향 (L_n → L_{n-1}, 역방향 금지)"
type = "layers"
layers = [
    "whymath_backend.api",
    "whymath_backend.l6",
    "whymath_backend.l5",
    "whymath_backend.l4",
    "whymath_backend.l3",
    "whymath_backend.l2",
    "whymath_backend.l1",
    "whymath_backend.schema",
]
# 합성 루트(`whymath_backend.composition`) 경유 면제 — EOS-89가 기존 2건을 0으로 줄였으나
# **EOS-86이 병행 개발로 신규 1건을 추가해 현재 1건이다** (merge 시 실측 정정 — 두 태스크가
# 서로를 모르는 채로 같은 구간을 건드렸다).
#
# 히스토리(지우지 않는 이유): EOS-69는 `l3.pedagogy.slot_generator`·`l3.render.adapters`가
# 합성 루트를 경유해 어댑터에 닿는 간선 2건을 여기 **간선 단위로** 적어 두고 "호출부가 능력을
# 상류에서 받아 내리면 이 줄도 사라진다"고 남겼다. EOS-89가 그 상류를 만들었다 —
# 능력은 `create_app`이 `app.state`에 등록하고, 렌더는 어댑터 **생성자 주입**으로, 슬롯 검증은
# 호출부 파라미터로 내려온다. 그래서 두 간선이 실제로 사라졌고
# `unmatched_ignore_imports_alerting`(기본 ERROR)이 "이 줄을 지워라"라고 말했다 —
# 만료가 날짜가 아니라 기계였다는 것의 실증이다.
#
# 다시 열지 말 것: `-> whymath_backend.composition`을 통째로 면제하면 합성 루트가 **세탁 통로**가
# 된다(어느 Core 모듈이든 이 경유로 어댑터에 닿아도 계약이 침묵). 새 간선이 필요하면 간선
# 단위로 한 줄씩 적고, `tests/infra/test_eos_dependency_direction.py`의 CORE_PULL_BASELINE도
# 함께 갱신해야 한다(그 테스트가 면제 줄과 실제 간선의 **정확한 일치**를 양방향으로 잰다).
ignore_imports = [
