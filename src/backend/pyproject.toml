    "whymath_backend.l4.speech -> whymath_backend.l3.speech",
    #   INFRA 출발 (EOS-69 2차 상환에서 재배정 — 아래 그룹② 주석 참조):
    "whymath_backend.api._ocr_state -> whymath_backend.l5.ocr.factory",

    # ── 그룹 ②: baseline — CORE 진성 위반 ──
    #
    # **현재 0줄이다.** 이 구역은 비어 있는 채로 남겨 둔다(지우지 않는다) — 다음에 진성 위반이
    # 생겼을 때 "여기가 빚을 적는 자리"임을 알리는 표지가 필요하기 때문이다.
    #
    # **만료는 날짜가 아니라 기계다**: `unmatched_ignore_imports_alerting`이 기본 ERROR라,
    # 어떤 간선이 사라지면 그에 대응하는 줄이 *매치되지 않아* lint-imports가 실패한다.
    # 즉 빚을 갚으면 CI가 "이 줄을 지워라"라고 말한다 — 유예가 조용히 눌러앉을 수 없다
    # ("만료 없는 유예 금지"의 코드 집행). 이 장치가 아래 상환 기록을 실제로 강제했다:
    # 3회 모두 "줄을 지워라"는 CI 실패가 먼저 왔고 그 다음에 목록이 줄었다.
    #
    # [EOS-69 1차 상환 2026-08-31] 9줄 → **8줄**. `l3.render.adapters -> l3.equivalent.josa`
    # 를 지웠다 — 경계 문서 §4 **B분류**(오배치 유틸)로, 조사 판별은 과목과 무관하므로
    # `whymath_backend.lang.josa`로 물리 이동해 위반 자체를 소멸시켰다(스캔 15 → 12건).
    # 분류표만 고치지 않고 파일을 옮긴 이유: import-linter는 **모듈 경로**로 판정하므로
    # `l3.equivalent.*` 접두가 남는 한 계약은 그대로 걸린다.
    #
    # [EOS-69 2차 상환 2026-08-31] 8줄 → **0줄**(스캔 12 → 0건). 세 축으로 갚았다:
    #   ① **타입 축** — Core가 어댑터를 import한 이유가 *상태 enum 하나* 뿐이던 간선들.
    #      `VerifyStepState`·`FinalAnswerState`·`IdentityVerdict`를 과목 중립 계약
    #      (`schema/verification_capabilities.py`)의 `VerificationOutcome`·
    #      `EquivalenceOutcome`으로 올리고 어댑터 쪽은 별칭으로 남겼다(값 보존·동작 무변경).
    #   ② **배선 축** — Core가 기본 구현을 스스로 골라 오던 간선(slot_generator·coach·
    #      render.adapters). 능력별 좁은 Protocol을 주입받게 하고, 기본 구현 선택은 합성 루트
    #      `whymath_backend.composition`(INFRA) 한 곳으로 옮겼다. 함수 안 지연 import로
    #      숨기지 **않은** 이유: 경계 스캔·import-linter는 지연 import도 그대로 보므로,
    #      숨기면 위반이 사라진 게 아니라 안 보이게 될 뿐이다.
    #   ③ **분류 축(코드 변경 0)** — `api._ocr_state -> l5.ocr.factory` 1건.
    #      이 모듈은 `OcrComponents`를 **타입 주석으로만** 쓰고 필드를 한 번도 읽지 않는
    #      app.state 배관이다(`_l3_state`와 동형). 배관은 경계 계약 대상이 아니므로 INFRA로
    #      재배정했고, 그래서 위 그룹①(구조적 제외)로 옮겼다. **이 1건만은 코드가 아니라
    #      판정이 바뀐 것**이며, 그 사실을 숨기지 않기 위해 여기 별항으로 적는다.
    #
    # 재확인 지점: **G1(2026-09-27)** — 그때 이 목록이 0줄인지 다시 확인한다. 0이 유지되는
    # 것이 EOS-67 차단 조건("Core→Math 정적 의존 0")의 성립 근거이고, 줄이 늘어 있으면
    # 그 사이에 새 빚이 생겼다는 뜻이다(만료 없는 유예 금지 — 0도 재확인 대상이다).
    #
    # ⚠️ **0은 "아무도 막지 않는 0"이 아니다** — 위 세 계약이 지금 이 목록을 강제한다.
    #    다만 스캔(`eos_core_adapter_boundary_scan.py`)의 0과 이 계약의 0은 *다른 측정*이다:
    #    스캔은 AST 직접 import를, 계약은 체인을 본다. 둘이 어긋나면 스캔이 정본이다.
]

# ──────────────────────────────────────────────────────────────────────
# 데이터 접근 계층 (ARCH-48) — 7계층 축·EOS 경계 축과 **또 다른 축**이다.
#
# 처분 정본: `docs/architecture/data_access_layer_disposition.md`
# 계측·baseline: `scripts/analysis/data_access_layer_audit.py` (`CLEAN_LAYERS`가 아래 목록의 정본)
# 정합 동결:    `tests/infra/test_data_access_layer_contract.py`
#
# 왜 앞의 두 축으로 부족한가: 7계층 계약은 `l6 -> l1` 같은 *계층 간 방향*을 보고, EOS 계약은
# Core가 수학 어댑터를 아는지를 본다. 둘 다 "이 모듈이 DB를 직접 잡는가"를 표현하지 못한다.
#
# **한계(명시)**: import-linter는 import 그래프 도구라 `session.execute(...)` 같은 **메서드 호출**
# 을 볼 수 없다. 그래서 이 계약이 막는 것은 *아직 sqlalchemy를 한 줄도 안 쓴* 4계층이 그것을
# 끌어오기 시작하는 순간뿐이다. 이미 잡고 있는 118파일(호출 축)은
# `tests/infra/test_data_access_layer_contract.py`가 집합으로 동결한다 — 두 장치는 상보다.
# ──────────────────────────────────────────────────────────────────────

[[tool.importlinter.contracts]]
name = "데이터 접근 금지 (baseline 0 — 아직 DB를 모르는 구역)"
type = "forbidden"
# 2026-09-16 실측(main 0f12e76a): 이 넷은 sqlalchemy import 0건 · `whymath_backend.db` import
# 0건 · 세션 호출 0건이다(74파일). 유예 없이 그 상태를 동결한다 — 새로 DB를 끌어오면 즉시 적색.
# `schema`는 Pydantic 계약, `lang`은 한국어 처리, `l5`는 상호작용, `l6`은 응용 모드다.
source_modules = [
    "whymath_backend.schema",
    "whymath_backend.lang",
    "whymath_backend.l5",
    "whymath_backend.l6",
]
# 직접 import만 판정한다 — EOS 계약과 같은 이유다(스캔이 AST 직접 import를 세므로 계약과
# 문서가 서로 다른 숫자를 말하지 않게 한다). 경유 의존(`l6 -> l4 -> session`)은 잡지 않으며,
# 그 축은 호출 축 가드가 파일 단위로 본다.
allow_indirect_imports = true
forbidden_modules = [
    "sqlalchemy",
    "whymath_backend.db",
]

# ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/backend"]
# importlib 모드 — 테스트 디렉토리(tests/backend)와 패키지(whymath_backend)
# 동명 충돌 없음. data-pipeline과 동일 레이아웃.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--rootdir=../..",
]
markers = [
    "integration: 통합 테스트 (실 네트워크·라이브 서비스 호출 가능 — 기본 skip)",
    "corpus_authoring: 결정론 저작 도구 회귀 (l3/equivalent 스켈레톤 생성기 · harness 적재 배치). PB-13 회수로 60파일 9분12초가 되어 backend 잡의 35분 상한을 넘겼다(28.5분 + 9.2분 = 37.5분). PR 상시 경로에서 분리하되 **비활성화가 아니다** — 전용 잡 corpus-authoring이 ⑴야간 schedule ⑵생성기·배치·그 테스트를 건드리는 PR 양쪽에서 돌린다(ci.yml authoring 플래그). 즉 이 테스트가 지키는 코드를 바꾸면 그 PR에서 반드시 실행된다.",
]

[tool.coverage.run]
source = ["whymath_backend"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
