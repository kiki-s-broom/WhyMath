[project]
name = "whymath-data-pipeline"
version = "0.1.0"
description = "WhyMath L1 데이터 파이프라인 — NCIC 성취기준·학교알리미·검정교과서·평가원 기출·OER 수집·정제·검증"
requires-python = ">=3.12"
authors = [
    { name = "WhyMath", email = "contact@whymath.example" },
]

dependencies = [
    # HTTP·크롤링
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    # 정형화·검증
    "pydantic>=2.9.0",
    # PDF 파싱 (NCIC 폴백 경로)
    "pdfplumber>=0.11.4",
    # CLI
    "typer>=0.12.5",
    # Canonical ID Registry(ids.yaml) 직렬화·재검증 (P2d·Part 9). 플레이북이 registry
    # 형식을 YAML로 명시 — 코퍼스 산출 ids.yaml 생성/파싱 단일 원천. 2026-07-02 P2d 결정.
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    # 상한 핀 — 2026-05-14 검증된 최신까지 허용 (black 26·mypy 2.1·pytest 9·ruff 0.15
    # 전부 CI 4스텝 통과 확인). 다음 메이저(black 27·mypy 3·pytest 10·ruff 0.16)는
    # 재검증 후 상한을 올린다. 핀의 목적은 CI 재현성 — 도구 자동 업그레이드로 인한
    # 예고 없는 빌드 깨짐 방지.
    "pytest>=8.3.3,<10",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",            # httpx 모킹
    "mypy>=1.13.0,<3",
    "ruff>=0.7.0,<0.16",
    "black>=24.10.0,<27",
    "types-beautifulsoup4>=4.12.0.20240907",
    "types-PyYAML>=6.0.12",
]
# JS 렌더가 필요한 NCIC 페이지에 대한 폴백. 기본 의존성은 아님.
playwright = [
    "playwright>=1.48.0",
]
# Phase 2+ PostgreSQL 적재용. Phase 1 (현재) 미배포 상태 → optional.
postgres = [
    "sqlalchemy[asyncio]>=2.0.35,<2.1",  # OPS-91: 2.1.0에서 mypy --strict 34건 실패(2026-09-25) — 이행 전 상한
    "asyncpg>=0.30.0",
]
# 개념 그래프 Neo4j 멱등 적재용(concept_graph load). 메인 deps 오염 금지 → optional extra.
# [postgres] 선례처럼 드라이버는 지연 import — extra 없이도 모듈 import 가능해야 한다.
neo4j = [
    "neo4j>=5,<6",
]
# File A(성취기준 마스터 xlsx) 추출용. extract_xlsx의 openpyxl import는 지연 — extra 없이도
# 순수 row 파서(parse_standard_row/parse_link_row)는 import·사용 가능해야 한다([postgres] 선례).
xlsx = [
    "openpyxl>=3.1.5",
]

[project.scripts]
whymath-ncic = "data_pipeline.ncic.__main__:app"
whymath-misconception = "data_pipeline.misconception.__main__:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline"]

# ──────────────────────────────────────────────────────────────────────
# 린터·포맷
# ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "W"]
# 한국어 식별자 사용 금지 (N) 비활성: 한국어 docstring·문자열만 쓰고 식별자는 영어
ignore = []

# per-file-ignores `"tests/**" = ["E501"]`은 OPS-14에서 제거 — 이 패키지의 테스트는
# 레포 루트 `tests/data_pipeline`에 살고, config-상대 패턴은 config 디렉터리 *밖* 파일에
# 매치되지 않는다(ruff absolute_matcher가 여기 하위로 앵커됨 — 2026-07-28 --show-settings
# 실측). 즉 죽은 설정이었다. 긴 한국어 픽스처가 정말 필요하면 해당 줄 `# noqa: E501`.

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
# 외부 라이브러리(pdfplumber 등)는 타입 스텁 미제공 가능
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ──────────────────────────────────────────────────────────────────────
# 테스트
# ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/data_pipeline"]
# importlib 모드 — 테스트 디렉토리가 `data_pipeline`과 동명이라도 충돌 없음
# (전통 'prepend' 모드는 tests/data_pipeline을 sys.path에 추가하여 실패)
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--rootdir=../..",
]
markers = [
    "integration: 통합 테스트 (실 네트워크 호출 가능 — 기본 skip)",
]

[tool.coverage.run]
source = ["data_pipeline"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
