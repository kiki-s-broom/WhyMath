# =============================================================================
# hint.schema.yaml — graded 힌트 (Hint)
# =============================================================================
# 엔티티 목적:
#   학생이 막혔을 때 제공하는 *graded(등급화된)* 힌트. 3단계로 — 1=가장 은근,
#   3=거의 정답 — 나뉘며, 각 힌트가 *얼마나 노출하는지*를 reveals 필드로 정량화한다.
#   "바로 정답 제공 금지, 가능한 가장 빠른 단계에서 멈춤"의 데이터 표현.
#
# 소유 7계층:
#   L4 교수학 엔진 (보유). L3 SolutionStep.hint 의 원천 텍스트를 받아 graded
#   척도로 구조화하는 것이 L4 의 책임. L3 는 생성, L4 는 결정·등급화.
#
# 관련 아키텍처:
#   docs/architecture/04_pedagogy_engine.md  "답 미루기 4단계 / PRD Hint 엔티티 정렬"
#
# WhyMath "답 미루기 4단계" 와의 정렬 (경계 명시):
#   PRD 는 힌트를 graded 3단계로 정의했고, WhyMath 답 미루기는 *4단계*로 그것을
#   상위 호환한다. PRD 3단계가 WhyMath 4단계의 1~3단계와 1:1 정렬되고,
#   WhyMath 4단계(전체 풀이)는 PRD 척도 밖의 WhyMath 고유 안전망이다:
#     Hint.level 1 (가장 은근)  ↔  답 미루기 1.방향      — 주목할 대상만 가리킴
#     Hint.level 2 (중간)       ↔  답 미루기 2.의사코드  — 단계 흐름 노출, 계산 미노출
#     Hint.level 3 (거의 정답)  ↔  답 미루기 3.부분 풀이 — 일부 단계 실제 시연
#     (Hint 엔티티 없음)        ↔  답 미루기 4.전체 풀이 — 마지막 수단, 학습 곡선 분석과 함께만
#
# 상태: **명세 단계 — 좌석 미실체화**(ARCH-39 실측). graded 힌트는 Phase 1 성공 기준
#       (답 미루기 4단계 + 도달 깊이 2.5+)이며, 그 KPI는 **현재 본문 저장 없이도 측정된다**
#       (`wh1_evaluation ⑧` = `attempt_event.hint_level` 평균·최대). 즉 아래 `reveal_score`는
#       KPI 성립의 전제가 아니라 **정밀화**이며, 지금은 **미구현**이다.
#       런타임 정본: `l4/hint_deferral.py`(HintLevel 1~4 · REVEALS 라벨) · 정서 안전은
#       `l4/tone_filter.filter_tone`. 본문 생산 경로는 `l3/dsl`의 `HintSpec.text` →
#       `CompiledContent.hint_texts`에 있으나 **dsl 밖 소비자가 0건**이다(S4-11의 "coach 서빙
#       reader"가 그 끊긴 지점).
# =============================================================================

entity: Hint
layer: L4
# storage 정정 (ARCH-39 · 2026-09-06 · 판정 기준 main 3f2b39c1):
#   종전 선언 "PostgreSQL 16 (hints)"는 *이미 있는* 저장소를 가리키는 것처럼 읽혔으나
#   `hints` 테이블은 **존재한 적이 없다**(ORM 0건·alembic 0건). 이 줄은 그래서 **계획**임을
#   명시하도록 고쳤다 — 좌석 신설 자체는 `S4-11-hint-content-generation`(P0·todo)이 소유한다
#   (canonical_entity_model_v1.md §3-B).
#   [정정 2026-09-07] 이 자리에 한때 "영구 부재 판정"이라고 적혔다. **틀렸다** — S4-11이
#   acceptance로 "hints 테이블 실체화"를 약속하고 있다. 실측(힌트가 턴마다 동적 생성된다·
#   KPI는 hint_level로 이미 측정된다)은 유효하지만, 그것으로 P0 태스크를 무효화할 수는 없다.
storage: "계획 — `hints` 미실체화(2026-09-06 실측: ORM·마이그레이션 0건). 좌석 신설은 `S4-11-hint-content-generation`(P0)이 소유하며 선행 `S4-09`·`S3-01` 대기 중. 현재 힌트는 L4 코치가 턴마다 동적 생성하고, 사용 *기록*만 `hint_usage` 테이블에 남는다(본문 아님·hint_id는 FK 없는 느슨참조)."
primary_key: "hint_id (좌석 실체화 시 PK — 현재는 서빙 응답 내 식별자로만 유효)"
phase_scope: "Phase 1 — 답 미루기 4단계 엔진, 평균 도달 깊이 2.5+ (KPI 측정은 hint_level 기반·본문 불요)"

fields:

  # --- 식별 ---------------------------------------------------------------
  hint_id:
    type: string
    required: true
    description: PK. 힌트 식별자.

  solution_step_ref:
    type: SolutionStepRef
    required: true
    description: >-
      이 힌트가 속한 풀이 단계의 참조. SolutionPath 와 그 안의 단계 order 로 식별.
      아래 구조. SolutionStep.hint(원천 텍스트)를 graded 척도로 구조화한 것이 이 엔티티.
    element_schema: SolutionStepRef

  # --- graded 레벨 (3단계) ------------------------------------------------
  level:
    type: enum<integer>
    required: true
    description: >-
      힌트 등급. 1=가장 은근, 3=거의 정답. 숫자가 클수록 더 많이 노출한다.
      L4 는 학생 상태·막힌 횟수에 따라 *가능한 낮은 level* 부터 제공한다.
    enum:
      1: "가장 은근 — 다음에 *주목할 대상*만 가리킴 (개념·도구 이름). 답 미루기 1.방향."
      2: "중간 — 풀이의 *단계 흐름*을 노출, 계산은 미노출. 답 미루기 2.의사코드."
      3: "거의 정답 — 일부 단계를 *실제로 시연*. 답 미루기 3.부분 풀이."
    note: >-
      WhyMath 답 미루기 4단계(전체 풀이)는 이 enum 에 *없다* — PRD graded 척도 밖의
      WhyMath 고유 안전망으로, 별도 경로(학습 곡선 분석 동반)로만 제공된다.

  # --- 노출량 (reveals) — graded 의 핵심 ----------------------------------
  reveals:
    type: HintReveals
    required: true
    description: >-
      이 힌트가 *무엇을 얼마나* 노출하는지. graded 힌트의 정량화 핵심.
      세션당 reveals 합산이 KPI(답 미루기 도달 깊이)의 측정 기반. 아래 구조.
    element_schema: HintReveals

  # --- 힌트 본문 ----------------------------------------------------------
  content:
    type: string
    required: true
    description: >-
      학생에게 보여줄 힌트 텍스트. 정서 안전 톤 필터 통과 필수 — 금지 패턴
      ("틀렸"·"못 하"·"실수" 등) 없이, 권장 표현("흥미로운 시도네"·"다른 각도로
      봐볼까") 지향 (04_pedagogy_engine.md 정서 안전).

  socratic_category:
    type: enum | null
    required: false
    description: >-
      이 힌트가 어떤 소크라테스 질문 카테고리로 전달되는지. L4 6카테고리.
      힌트는 "답"이 아니라 "질문"으로 줄 때 가장 강력 (MEMORY.md 핵심 인사이트 1).
    enum:
      clarification: "명료화 — 어디까지 이해됐어?"
      assumption:    "가정 탐색 — 왜 그렇게 가정했어?"
      evidence:      "근거·증거 — 어떻게 알아?"
      perspective:   "관점 — 다른 방법은?"
      implication:   "함의 — 그러면 다음은?"
      meta:          "메타인지 — 어떻게 도달했어?"

  # --- 운영 메타 ----------------------------------------------------------
  generated_by_tier:
    type: enum | null
    required: false
    description: 이 힌트를 생성한 LLM 티어 (L3 라우터 경유). 비용 추적용.
    enum: [LOCAL, MID, HIGH]

  verified:
    type: boolean
    required: true
    default: false
    description: >-
      검증 통과 여부. 학생에게 제공되는 모든 콘텐츠는 PRM 또는 도구 검증을 거친다
      (CLAUDE.md — LLM 응답을 검증 없이 학생에게 제공 금지).

  created_at:
    type: datetime
    required: true
    description: 힌트 생성 시각.

# =============================================================================
# SolutionStepRef — 풀이 단계 참조
# =============================================================================
SolutionStepRef:
  description: 힌트가 어느 풀이 단계에 속하는지를 가리키는 참조.
  fields:
    solution_path_id:
      type: string
      required: true
      description: 풀이 경로 ID.
      relation:
        references: "SolutionPath.solution_path_id  (solution_path.schema.yaml)"
    step_order:
      type: integer
      required: true
      description: 그 풀이 경로 안의 SolutionStep.order 값.
    problem_id:
      type: string
      required: false
      description: 편의용 문제 ID (solution_path 를 통해 도출 가능하나 조회 편의로 중복 저장).
      relation:
        references: "Problem.problem_id  (problem.schema.yaml)"

# =============================================================================
# HintReveals — 노출량 정량화
# =============================================================================
HintReveals:
  description: >-
    힌트가 무엇을 얼마나 노출하는지. graded 힌트의 핵심 — level 과 짝을 이뤄
    "이 힌트로 학생이 얼마나 답에 가까워졌나"를 측정 가능하게 한다.
  fields:
    reveals_concept_names:
      type: boolean
      required: true
      default: false
      description: 다음에 쓸 개념·도구의 *이름*을 노출하는가 (level 1 의 전형).
    reveals_step_flow:
      type: boolean
      required: true
      default: false
      description: 풀이의 *단계 흐름*(순서·구조)을 노출하는가 (level 2 의 전형).
    reveals_partial_computation:
      type: boolean
      required: true
      default: false
      description: 일부 단계의 *실제 계산·시연*을 노출하는가 (level 3 의 전형).
    revealed_concept_ids:
      type: list<string>
      required: false
      default: []
      description: >-
        이 힌트가 구체적으로 노출한 개념 노드 ID 목록. 개념 점화 지도·MasteryState
        갱신 입력의 일부로 쓰일 수 있음.
      relation:
        references: concept.concept_id
    reveal_score:
      type: float
      required: true
      range: [0.0, 1.0]
      description: >-
        종합 노출 점수 0~1 (0=거의 안 노출, 1=거의 정답). 세션당 평균 reveal_score
        가 KPI "세션당 답 미루기 단계 평균 도달 깊이"의 측정 신호.

# -----------------------------------------------------------------------------
# 엔티티 간 관계 요약
# -----------------------------------------------------------------------------
relationships:
  - target: "SolutionStep (solution_path.schema.yaml 내 구조)"
    via: "solution_step_ref (solution_path_id + step_order)"
    kind: >-
      N:1 — 한 풀이 단계에 여러 Hint(level 1·2·3). SolutionStep.hint(원천 텍스트)를
      L4 가 graded 3단계로 펼친 결과가 이 Hint 들.
  - target: "SolutionPath (solution_path.schema.yaml)"
    via: "solution_step_ref.solution_path_id"
    kind: "N:1 — 힌트는 특정 풀이 경로의 특정 단계에 종속"
  - target: "Problem (problem.schema.yaml)"
    via: "solution_step_ref.problem_id"
    kind: "N:1 — 조회 편의용 중복 참조"
  - target: "Concept (concept.schema.yaml)"
    via: "reveals.revealed_concept_ids"
    kind: "N:M — 힌트가 노출한 개념 노드들 (개념 점화 지도 입력 가능)"

# -----------------------------------------------------------------------------
# 검증 invariant (명세 — 테스트 미구현)
# -----------------------------------------------------------------------------
validation_invariants:
  - "level 이 {1,2,3} 밖이면 거부 (4=전체 풀이는 Hint 엔티티가 아님)"
  - "reveals.reveal_score ∈ [0.0, 1.0]"
  - "level 과 reveals 의 정합: level 1 은 보통 reveals_concept_names=true 이고 partial_computation=false"
  - "content 가 정서 안전 톤 필터 통과 (금지 패턴 0건 — 04_pedagogy_engine.md)"
  - "verified=false 인 Hint 는 학생에게 제공 불가 (CLAUDE.md — 검증 없이 제공 금지)"
  - "solution_step_ref 가 실재하는 SolutionPath·SolutionStep 을 가리킴"
