# electron-builder 설정 (HARN-206 · HARN-208 Windows 프로그램 실행 형식).
# 산출 3종: 설치 EXE(바탕화면·시작 메뉴 바로가기 · 설치 끝에 바로 실행) · 무설치 단일 EXE(portable) · zip.
# 아이콘 assets/icon.ico는 scripts/make_icon.py가 만든다. EXE에 아이콘·버전 정보를 심으려면
# signAndEditExecutable이 켜져 있어야 한다(rcedit — 리눅스에서는 wine 경유).
# 코드서명 없음 — 인증서 미제공. 첫 실행의 SmartScreen 경고는 README·런북에 대처를 적는다.
appId: kr.whymath.workgraph
productName: WhyMath 작업 지도
copyright: WhyMath
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - fixtures/sample.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - nsis
    - portable
    - zip
  icon: assets/icon.ico
  executableName: WhyMathWorkGraph
  artifactName: "${name}-${version}-${os}-${arch}.${ext}"
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: WhyMath 작업 지도
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: "${name}-${version}-setup.${ext}"
portable:
  artifactName: "${name}-${version}-portable.${ext}"
publish: null
