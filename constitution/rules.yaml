# constitution/rules.yaml — WhyMath 법률: 규칙 등록부 (v1.0)
# ─────────────────────────────────────────────────────────────
# 이 파일은 사람만 수정한다 (헌법 제9조·제11조).
# 표준북 각 장의 ⑥칸(자동 검사)을 기계가 읽는 형태로 옮긴 것이다.
#
# 필드 설명
#   id        : R[표준북 장]-[번호]. R0은 헌법 자체를 지키는 규칙
#   article   : 근거 조문
#   chapter   : 해설서(표준북) 장 번호
#   axis      : 결함 6축 (흐름·진실·경계·변경·확신·회복)
#   statement : 규칙 한 문장
#   level     : 목표 통제 강도 (L1~L5)
#   check     : 집행 장치 파일 경로 (저장소 최상위 기준). 이 파일이 없으면 '집행 장치 없음'
#   run       : 검사 실행 명령. 성공 = 종료 코드 0. L5 규칙은 위헌 심사 때 실제로 실행됨
#   stage     : 이식 단계 (1~6). 해당 단계 전까지는 '집행 장치 없음'이 정상
#   precedent : (선택) 이 규칙을 만든 판례 번호
#
# ⚠ check·run의 경로는 '제안 경로'다. 실제 저장소 구조에 맞게 사람이 조정한다.
# ─────────────────────────────────────────────────────────────

version: "1.0.1"

rules:

  # ── R0: 헌법 자체의 보호 ─────────────────────────────
  - id: R0-01
    article: 제9조
    chapter: 0
    axis: 경계
    statement: AI는 constitution/ 폴더를 수정·삭제·이동할 수 없다
    level: L5
    check: .claude/hooks/guard_constitution.py
    run: python scripts/constitution/selftest_guard.py
    stage: 2

  - id: R0-02
    article: 제11조
    chapter: 0
    axis: 변경
    statement: constitution/ 이 바뀐 커밋에는 amendments/ 의 새 개정 기록이 함께 있어야 한다
    level: L5
    check: scripts/constitution/check_amendment.py
    run: python scripts/constitution/check_amendment.py
    stage: 3

  # ── 1장 의존성 그래프 (헌법 제4조) ──────────────────────
  - id: R1-01
    article: 제4조
    chapter: 1
    axis: 흐름
    statement: 파이프라인 실행 순서는 pipeline.yaml 한 곳에만 선언하며, 누락·순환·섬 노드가 없어야 한다
    level: L5
    check: scripts/constitution/pipeline_check.py
    run: python scripts/constitution/pipeline_check.py
    stage: 3

  - id: R1-02
    article: 제4조
    chapter: 1
    axis: 흐름
    statement: 어떤 노드를 바꿨을 때 다시 실행할 하류 노드를 명령 한 줄로 구할 수 있어야 한다
    level: L4
    check: scripts/constitution/pipeline_check.py
    run: python scripts/constitution/pipeline_check.py --downstream standards
    stage: 3

  - id: R1-03
    article: 제4조
    chapter: 1
    axis: 흐름
    statement: 저작권 판정·백업·교육과정 정합성 검토는 pipeline.yaml의 노드이며, 저작권 판정은 게시의 상류에 있어야 한다
    level: L5
    check: scripts/constitution/pipeline_check.py
    run: python scripts/constitution/pipeline_check.py --require copyright,backup,curriculum_review --upstream-of publish:copyright
    stage: 3

  # ── 2장 게이트는 노드다 (헌법 제5조·제8조) ──────────────
  - id: R2-01
    article: 제5조
    chapter: 2
    axis: 흐름
    statement: 게시 테이블은 중복·품질·저작권 게이트 통과 기록이 없는 문항을 DB 수준에서 거부한다
    level: L5
    check: db/constraints/publish_gate_trigger.sql
    run: pytest -q tests/constitution/test_publish_gate.py
    stage: 5

  - id: R2-02
    article: 제5조
    chapter: 2
    axis: 확신
    statement: 중복 게이트 판정과 무관하게 모든 후보 문항은 사람 품질 판정(F1~F8)을 받는다
    level: L5
    check: tests/constitution/test_gate_independence.py
    run: pytest -q tests/constitution/test_gate_independence.py
    stage: 3
    precedent: P0001

  - id: R2-03
    article: 제5조
    chapter: 2
    axis: 확신
    statement: 게이트 기록에는 판정자·일시·근거·우회 여부 필드가 있어야 한다
    level: L4
    check: tests/constitution/test_gate_schema.py
    run: pytest -q tests/constitution/test_gate_schema.py
    stage: 3

  - id: R2-04
    article: 제9조
    chapter: 19
    axis: 확신
    statement: 사람 검토 세션의 검토 소요 시간 중앙값이 10초 미만이거나 반려율이 0%이면 경고한다 (도장 찍기 조기 경보)
    level: L4
    check: scripts/constitution/review_health.py
    run: python scripts/constitution/review_health.py
    stage: 4
    precedent: P0001

  # ── 3장 멱등성 (헌법 제6조) ────────────────────────────
  - id: R3-01
    article: 제6조
    chapter: 3
    axis: 흐름
    statement: 모든 배치 스크립트는 두 번 실행해도 행 수와 결과가 같아야 한다 ('두 번 실행 테스트' 필수)
    level: L5
    check: tests/test_idempotency.py
    run: pytest -q tests/test_idempotency.py
    stage: 3

  - id: R3-02
    article: 제6조
    chapter: 3
    axis: 흐름
    statement: AI 문항 생성은 출력이 아니라 생성 자리(slot_key) 기준으로 중복을 막으며, items.slot_key에 UNIQUE 제약이 있다
    level: L5
    check: tests/constitution/test_slot_key_unique.py
    run: pytest -q tests/constitution/test_slot_key_unique.py
    stage: 5

  # ── 4장 단일 진실 원천 (헌법 제7조) ────────────────────
  - id: R4-01
    article: 제7조
    chapter: 4
    axis: 진실
    statement: 저장소 안의 원본은 모두 아래 sources에 등록되어 있고 실제로 존재한다
    level: L5
    check: scripts/constitution/audit.py        # 위헌 심사가 원본 등록부를 직접 검사함
    run: python scripts/constitution/audit.py --sources-only
    stage: 1

  - id: R4-02
    article: 제7조
    chapter: 4
    axis: 진실
    statement: Python·Dart 데이터 모델은 schemas/ 의 JSON Schema에서 자동 생성되며, 재생성 결과가 커밋된 것과 같아야 한다
    level: L5
    check: scripts/check_generated.sh
    run: bash scripts/check_generated.sh
    stage: 3

  - id: R4-03
    article: 제7조
    chapter: 4
    axis: 진실
    statement: 문서에 적힌 핵심 숫자(개념 노드 수·오개념 수·시그니처 패턴 수)는 원본에서 센 실제 값과 같아야 한다
    level: L5
    check: tests/test_docs_numbers.py
    run: pytest -q tests/test_docs_numbers.py
    stage: 3


  # ── 파트 II ──
  - id: R5-01
    article: "제7조의2"
    chapter: 5
    axis: "경계"
    statement: "모듈 의존 방향은 api → infra → subject_* → eos_core 이며 역방향 import를 금지한다"
    level: L5
    check: ".importlinter"
    run: "lint-imports"
    stage: 3
    precedent: null
  - id: R5-02
    article: "제7조의2"
    chapter: 5
    axis: "경계"
    statement: "eos_core는 DB 드라이버·AI SDK를 직접 import하지 않는다"
    level: L5
    check: ".importlinter"
    run: "lint-imports"
    stage: 3
    precedent: null
  - id: R6-01
    article: "제7조의2"
    chapter: 6
    axis: "진실"
    statement: "AI 출력과 외부 입력은 경계에서 스키마로 파싱하며, 실패하면 재시도 후 격리한다"
    level: L5
    check: "tests/constitution/test_ai_output_parsing.py"
    run: "pytest -q tests/constitution/test_ai_output_parsing.py"
    stage: 3
    precedent: null
  - id: R6-02
    article: "제7조의2"
    chapter: 6
    axis: "변경"
    statement: "스키마 변경은 과거 실제 데이터 표본으로 호환성 테스트를 통과해야 한다"
    level: L5
    check: "tests/constitution/test_schema_compat.py"
    run: "pytest -q tests/constitution/test_schema_compat.py"
    stage: 3
    precedent: null
  - id: R6-03
    article: "제7조의2"
    chapter: 6
    axis: "진실"
    statement: "경계를 넘는 모든 데이터 스키마에는 schema_version 필드가 있다"
    level: L5
    check: "scripts/constitution/check_schema_version.py"
    run: "python scripts/constitution/check_schema_version.py"
    stage: 3
    precedent: null
  - id: R7-01
    article: "제7조의2"
    chapter: 7
    axis: "진실"
    statement: "문항 상태는 status 한 컬럼으로만 표현하며 상태를 뜻하는 불리언 플래그 컬럼을 두지 않는다"
    level: L5
    check: "tests/constitution/test_no_state_flags.py"
    run: "pytest -q tests/constitution/test_no_state_flags.py"
    stage: 5
    precedent: null
  - id: R7-02
    article: "제7조의2"
    chapter: 7
    axis: "흐름"
    statement: "상태 전이는 전이표(item_transitions)에 있는 것만 DB가 허용한다"
    level: L5
    check: "db/constraints/item_transition_trigger.sql"
    run: "pytest -q tests/constitution/test_item_transitions.py"
    stage: 5
    precedent: null
  - id: R8-01
    article: "제7조의2"
    chapter: 8
    axis: "경계"
    statement: "비밀값(API 키·비밀번호·암호화 키)은 저장소에 커밋될 수 없다"
    level: L5
    check: ".pre-commit-config.yaml"
    run: "pre-commit run gitleaks --all-files"
    stage: 3
    precedent: null
  - id: R8-02
    article: "제8조"
    chapter: 8
    axis: "경계"
    statement: "앱 빌드 산출물에 서버용 비밀 키 패턴이 없어야 한다"
    level: L5
    check: "scripts/constitution/scan_app_bundle.py"
    run: "python scripts/constitution/scan_app_bundle.py"
    stage: 4
    precedent: null
  - id: R8-03
    article: "제7조의2"
    chapter: 8
    axis: "회복"
    statement: "서버는 필수 설정이 빠지면 시작하지 않고 즉시 종료한다"
    level: L5
    check: "tests/constitution/test_settings_failfast.py"
    run: "pytest -q tests/constitution/test_settings_failfast.py"
    stage: 3
    precedent: null
  - id: R8-04
    article: "제7조의5"
    chapter: 8
    axis: "회복"
    statement: "백업 암호화 비밀키는 백업과 다른 곳 2곳 이상에 보관하고 위치를 기록한다"
    level: L2
    check: "docs/ops/KEYS.md"
    stage: 1
    precedent: null

  # ── 파트 III ──
  - id: R9-01
    article: "제7조의3"
    chapter: 9
    axis: "변경"
    statement: "커밋 메시지는 Conventional Commits 형식(content 타입 포함)을 따른다"
    level: L5
    check: "scripts/constitution/check_commit_msg.py"
    run: "python scripts/constitution/check_commit_msg.py --last"
    stage: 3
    precedent: null
  - id: R9-02
    article: "제7조의3"
    chapter: 9
    axis: "변경"
    statement: "한 커밋의 변경 파일이 25개를 넘으면 경고한다"
    level: L4
    check: "scripts/constitution/check_commit_msg.py"
    run: "python scripts/constitution/check_commit_msg.py --last --size"
    stage: 3
    precedent: null
  - id: R9-03
    article: "제7조의3"
    chapter: 9
    axis: "변경"
    statement: "코드 변경과 콘텐츠 변경을 한 커밋에 섞으면 경고한다"
    level: L4
    check: "scripts/constitution/check_commit_msg.py"
    run: "python scripts/constitution/check_commit_msg.py --last --mixed"
    stage: 3
    precedent: null
  - id: R10-01
    article: "제7조의3"
    chapter: 10
    axis: "변경"
    statement: "DB 스키마는 migrations/ 파일로만 바꾸며, 적용된 마이그레이션 파일은 수정하지 않는다"
    level: L5
    check: "scripts/constitution/check_migrations.py"
    run: "python scripts/constitution/check_migrations.py"
    stage: 3
    precedent: null
  - id: R10-02
    article: "제7조의3"
    chapter: 10
    axis: "변경"
    statement: "DROP·RENAME이 든 마이그레이션은 contract 표식과 선행 expand 번호가 있어야 한다"
    level: L5
    check: "scripts/constitution/check_migrations.py"
    run: "python scripts/constitution/check_migrations.py"
    stage: 3
    precedent: null
  - id: R10-03
    article: "제7조의5"
    chapter: 10
    axis: "회복"
    statement: "마이그레이션은 자동 백업을 만들고 확인한 뒤에만 적용된다"
    level: L5
    check: "scripts/db/migrate.py"
    run: "pytest -q tests/constitution/test_migrate_backup_first.py"
    stage: 5
    precedent: null
  - id: R11-01
    article: "제7조의3"
    chapter: 11
    axis: "변경"
    statement: "린트 위반 수는 파일별 기준선보다 늘어날 수 없다 (래칫)"
    level: L5
    check: "scripts/constitution/ratchet.py"
    run: "python scripts/constitution/ratchet.py"
    stage: 3
    precedent: null
  - id: R11-02
    article: "제11조"
    chapter: 11
    axis: "변경"
    statement: "기준선은 줄어드는 방향으로만 갱신되며, 늘리려면 개정 기록이 필요하다"
    level: L5
    check: "scripts/constitution/ratchet.py"
    run: "python scripts/constitution/ratchet.py --verify-monotonic"
    stage: 3
    precedent: null

  # ── 파트 IV ──
  - id: R12-01
    article: "제7조의4"
    chapter: 12
    axis: "확신"
    statement: "단위 테스트는 네트워크에 접속하지 않는다"
    level: L5
    check: "tests/conftest.py"
    run: "pytest -q -m unit --disable-socket"
    stage: 3
    precedent: null
  - id: R12-02
    article: "제7조의4"
    chapter: 12
    axis: "확신"
    statement: "fix: 커밋에는 재현 테스트 변경이 함께 있어야 한다"
    level: L4
    check: "scripts/constitution/check_commit_msg.py"
    run: "python scripts/constitution/check_commit_msg.py --last --fix-has-test"
    stage: 3
    precedent: null
  - id: R12-03
    article: "제7조의4"
    chapter: 12
    axis: "확신"
    statement: "단위 테스트 전체 실행 시간은 60초 이내여야 한다"
    level: L4
    check: "scripts/constitution/test_budget.py"
    run: "python scripts/constitution/test_budget.py"
    stage: 4
    precedent: null
  - id: R13-01
    article: "제7조의4"
    chapter: 13
    axis: "확신"
    statement: "정답 재도출 검증은 생성 단계의 정답을 입력으로 받지 않는다 (블라인드)"
    level: L5
    check: "tests/constitution/test_derive_verify_blind.py"
    run: "pytest -q tests/constitution/test_derive_verify_blind.py"
    stage: 3
    precedent: null
  - id: R13-02
    article: "제7조의4"
    chapter: 13
    axis: "확신"
    statement: "재도출 검증은 생성과 다른 방법(CAS) 또는 다른 모델 계열을 쓴다"
    level: L5
    check: "tests/constitution/test_verifier_diversity.py"
    run: "pytest -q tests/constitution/test_verifier_diversity.py"
    stage: 3
    precedent: null
  - id: R13-03
    article: "제7조의4"
    chapter: 13
    axis: "확신"
    statement: "검증 층 간 일치율이 4주 연속 100%이면 경고한다 (복사 의심)"
    level: L4
    check: "scripts/constitution/layer_agreement.py"
    run: "python scripts/constitution/layer_agreement.py"
    stage: 6
    precedent: null
  - id: R14-01
    article: "제7조의4"
    chapter: 14
    axis: "확신"
    statement: "저장소의 모든 .py 파일은 린트 검사 범위 안에 있어야 한다"
    level: L5
    check: "scripts/constitution/lint_scope.py"
    run: "python scripts/constitution/lint_scope.py"
    stage: 3
    precedent: null
  - id: R14-02
    article: "제7조의4"
    chapter: 14
    axis: "확신"
    statement: "검사 도구(ruff·mypy·pytest 등) 버전은 잠금 파일로 고정한다"
    level: L5
    check: "requirements-dev.lock"
    run: "python scripts/constitution/check_tool_pins.py"
    stage: 3
    precedent: null
  - id: R14-03
    article: "제7조의4"
    chapter: 14
    axis: "확신"
    statement: "Dart 분석은 info 수준까지 실패로 처리한다"
    level: L5
    check: "app/analysis_options.yaml"
    run: "flutter analyze --fatal-infos"
    stage: 3
    precedent: null

  # ── 파트 V ──
  - id: R15-01
    article: "제7조의5"
    chapter: 15
    axis: "회복"
    statement: "백엔드 코드는 print() 대신 구조화 로그를 쓴다"
    level: L5
    check: "pyproject.toml"
    run: "ruff check --select T20 backend"
    stage: 3
    precedent: null
  - id: R15-02
    article: "제7조의5"
    chapter: 15
    axis: "회복"
    statement: "모든 배치는 run_id와 created·skip·failed 요약을 구조화 로그로 남긴다"
    level: L4
    check: "tests/constitution/test_batch_summary_log.py"
    run: "pytest -q tests/constitution/test_batch_summary_log.py"
    stage: 4
    precedent: null
  - id: R15-03
    article: "제8조"
    chapter: 15
    axis: "경계"
    statement: "로그에 개인정보가 평문으로 남지 않는다"
    level: L5
    check: "tests/constitution/test_log_pii_mask.py"
    run: "pytest -q tests/constitution/test_log_pii_mask.py"
    stage: 3
