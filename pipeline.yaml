# pipeline.yaml — WhyMath 콘텐츠 파이프라인 (코딩 헌법 제4조: 실행 순서의 유일한 원본)
# ─────────────────────────────────────────────────────────────────────────────
# version: 1.0 (2026-09-27 · CONST-02) · 판정 기준: main b8af6f26 (조사) · 반영 정정 6건(독립 검증)
# 조사 방식 = 저장소 코드·CI·문서 실측 (E3=실행 출력 / E2=파일·줄 직접 확인 / E1=정황 추정 / E0=문서 주장뿐)
# 형식: nodes: <이름>: { source: true } | { needs: [<선행 노드>...] }
# 검사: python3 scripts/constitution/pipeline_check.py --require copyright,backup,curriculum_review \
#         --upstream-of publish:copyright   (CI harness-integrity 잡이 상시 실행)
# 필수 이름(constitution/rules.yaml R1-02·R1-03 run 명령에 박혀 있다 — 개명 금지):
#   standards · copyright · backup · curriculum_review · publish
# 규칙: DAG · 섬 없음 · copyright → publish 직접 상류 · backup 은 publish 하류 ·
#       사람 검수(human_review)를 건너뛰는 publish 경로 없음(promotion_gate 경유)
#
# 범위 한계(명시): 이 그래프는 '콘텐츠 생산·검증·게시' 파이프라인만 담는다. 개인정보(privacy)·
#   임베딩(pgvector)·학습자 모델(BKT·learner_state)·관측(Langfuse)·LLM 라우팅·모바일 릴리스는
#   노드가 아니다 — 그 축의 규칙(파트 V·VII)이 매달릴 노드는 CONST-07·CONST-08이 추가 여부를 정한다.
# 실행 순서의 다른 원천과의 경계: 작업 일정은 backlog/(태스크·게이트 그래프), CI 잡 순서는
#   .github/workflows/ci.yml 이 정본이다. 이 파일은 '데이터가 어느 단계를 거쳐 학생에게 가는가'만 선언한다.
#
# 표기 규약
#   [집행] = 이 노드를 실제로 도는 코드·CLI·CI 스텝이 있다   [부분] = 일부 축만 기계 집행
#   [미구현] = 집행 장치 없음(이름만 노드로 예약)   경로는 저장소 상대경로:줄번호 · CI = .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────────────────────────
nodes:

