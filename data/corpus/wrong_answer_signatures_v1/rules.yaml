# 오답 서명 규칙표 — P3-56 후보 구현. 계약: schema/wrong_answer_signature.py (SignatureSpec).
# 읽는 곳: l1/misconception/wrong_answer_signature_table.py → l4/misconception/derivative_signature.py.
# 이 파일이 소유하는 것: 어느 오개념(M-id)이 어떤 질문에서 어떤 변환의 값으로 드러나는지,
#   신뢰도·근거 종류·픽스처. 오답 값을 만드는 수학(변환)과 질문 읽기(추출기)는 코드가 이름으로 소유한다.
# 픽스처는 문항은행(problem_id)에서 질문·정답을 읽는다 — 정답을 여기 다시 적지 않는다.
# 오답 값의 출처: 문항은행 distractor_map 보기(독립 오라클) 또는 엔진과 무관한 단순 계산(note에 근거).
schema_version: 1.0.0
spec_id: wrong_answer_signatures_v1
rules:
- rule_id: sig.power-rule.omit-step.derivative-at
  mis_ids:
  - M0671
  ask: derivative_at
  wrong_transform: power_rule_step_omitted
  confidence: 0.9
  evidence: direct
  note: x^n의 f'(a)를 묻는데 지수를 내리거나 1을 줄이는 두 단계 중 하나를 빠뜨리면 나오는 값이다.
  fixtures:
    wrong:
    - problem_id: 3ad4f5fd-be93-50eb-8afb-1c115d07aa62
      answer: '524288'
      note: 지수 8을 내리지 않고 1만 줄인 값이 아니라, 1을 줄이지 않고 8만 곱한 8·4^8. 문항은행 보기 오라클과 일치.
    - problem_id: 3ad4f5fd-be93-50eb-8afb-1c115d07aa62
      answer: '16384'
      note: 지수를 내리지 않고 1만 줄인 4^7. 문항은행 보기 오라클과 일치.
    - problem_id: 44cdbe25-3dd2-52d3-ae34-81a0be5fe210
      answer: '8'
      note: 접선의 기울기 3x^2-1에서 x^2의 지수를 내리지 않은 값 — 문항은행 보기 오라클과 일치.
    not_wrong:
    - problem_id: 3ad4f5fd-be93-50eb-8afb-1c115d07aa62
      answer: '131072'
      note: 정답 — 오개념의 증거가 아니다.
    - problem_id: 3ad4f5fd-be93-50eb-8afb-1c115d07aa62
      answer: '65536'
      note: 4^8 — 도함수가 아니라 함수값 f(4)를 답한 다른 종류의 실수.
    - problem_id: 44cdbe25-3dd2-52d3-ae34-81a0be5fe210
      answer: '26'
      note: 정답 — 오개념의 증거가 아니다.
- rule_id: sig.power-rule.omit-step.monomial-params
  mis_ids:
  - M0671
  ask: monomial_params
  wrong_transform: power_rule_step_omitted
  confidence: 0.9
  evidence: direct
  note: f'(x)=cx^m 꼴의 c+m을 묻는데 지수 하강 또는 1 감소를 빠뜨린 값이다.
  fixtures:
    wrong:
    - problem_id: 0f510e63-cae5-587d-881a-7b0e8798ef15
      answer: '8'
      note: 'x^4: c=4·m=4(1을 줄이지 않음) → 8. 단순 계산 2n.'
    - problem_id: 0f510e63-cae5-587d-881a-7b0e8798ef15
      answer: '4'
      note: 'x^4: c=1·m=3(지수를 내리지 않음) → 4. 단순 계산 n.'
    not_wrong:
    - problem_id: 0f510e63-cae5-587d-881a-7b0e8798ef15
      answer: '7'
      note: 정답 — 오개념의 증거가 아니다.
    - problem_id: 0f510e63-cae5-587d-881a-7b0e8798ef15
      answer: '12'
      note: c·m — 다른 양을 계산한 값(합이 아니라 곱).
- rule_id: sig.product-rule.factor-derivatives
  mis_ids:
  - M0075
  - M0672
  ask: derivative_at
  wrong_transform: product_of_factor_derivatives
  confidence: 0.9
  evidence: direct
  note: 두 함수의 곱의 미분을 각 함수의 도함수의 곱 f'g'로 처리하면 나오는 값이다.
  fixtures:
    wrong:
    - problem_id: 01656862-99cb-51cb-bc50-18d2751f0bd3
      answer: '75'
      note: 'f=x, g=x^3, x=5: f''g''=1·75. 문항은행 보기 오라클과 일치.'
    - problem_id: 0929b2fe-2b56-54b3-8bde-6dc8afd70881
      answer: '12'
      note: 'f=x, g=x^2, x=6: f''g''=1·12. 문항은행 보기 오라클과 일치.'
    not_wrong:
    - problem_id: 01656862-99cb-51cb-bc50-18d2751f0bd3
      answer: '500'
      note: 정답 — 오개념의 증거가 아니다.
    - problem_id: 01656862-99cb-51cb-bc50-18d2751f0bd3
      answer: '375'
      note: 5^3·3 — 곱의 미분이 아닌 다른 실수.
    - problem_id: 0929b2fe-2b56-54b3-8bde-6dc8afd70881
      answer: '108'
      note: 정답 — 오개념의 증거가 아니다.
- rule_id: sig.extremum.swap.point
