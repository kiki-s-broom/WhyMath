      note: 'f''=-6(x+3)(x-1): 극대는 x=1, 극소는 x=-3. 극대를 물었는데 극소의 x를 답함.'
    - problem_id: 973fb6e5-3278-5d30-8f02-29204810b486
      answer: '2'
      note: 'f''=-3x(x-2): 극소는 x=0, 극대는 x=2. 극소를 물었는데 극대의 x를 답함.'
    not_wrong:
    - problem_id: 5fdd21a6-0dfd-531a-a070-68439149f545
      answer: '1'
      note: 정답 — 오개념의 증거가 아니다.
    - problem_id: 973fb6e5-3278-5d30-8f02-29204810b486
      answer: '0'
      note: 정답 — 오개념의 증거가 아니다.
    - problem_id: 5fdd21a6-0dfd-531a-a070-68439149f545
      answer: '0'
      note: 극값이 아닌 점 — 맞바꿈이 아니다.
