# 오개념 → 교정 전략표 — P3-06. 계약: schema/wrong_answer_remediation.py (RemediationSpec).
# 읽는 곳: l1/misconception/wrong_answer_tables.py → l4/misconception/remediation_advice.py.
#
# 이 표가 소유하는 것: 오개념(M-id)마다 반복 오류 사다리(l2/remediation_policy.py)의 세 칸에서
#   무엇을 내놓을지 — 2회 교정 설명 · 3회 쉬운 문항의 선택 조건 · 4회 선수 개념의 기준 개념.
# 이 표가 소유하지 않는 것: "어느 교수전략으로 가르칠까"(런타임 셀렉터 04d 소유 — 필드 없음),
#   사다리 임계값(l2/remediation_policy.py 소유), 선수 간선(atom_graph_v1 소유).
# 쉬운 문항·선수 개념은 문항 id·원자 id를 박지 않고 선택 조건만 둔다 — 코퍼스가 바뀌어도 어긋나지 않게.
#
# 저작 상태: 교정 설명은 AI 초안(draft)이다. 사람 검수 전이며, 학생 노출 경로는 reviewed 행만 써야 한다.
# 교정 설명의 어조: 정답을 먼저 주지 않는다 — 반례를 보여 주고 학생이 직접 확인하도록 되묻는다
#   (CLAUDE.md 교수학 금기: 막혔을 때 바로 정답 제공 금지 · 부정적 피드백 강화 금지).
# 수치 반례는 SymPy로 직접 검산했다(작성 시점 2026-10-16).
schema_version: "1.0.0"
spec_id: misconception_remediation_v1
rows:
  # ── M0671 거듭제곱 미분의 두 단계 중 하나를 빠뜨림 (미분법: y=xⁿ의 도함수) ──
  - mis_id: M0671
    corrective_explanation:
      rule_statement: "x^n을 미분하면 지수 n을 앞으로 내려 곱하고, 지수는 1만 줄여서 n·x^(n-1)이 됩니다. 내리기와 줄이기는 한 번에 함께 일어납니다."
      counterexample: "f(x)=x^3의 x=2에서의 미분계수는 12입니다. 지수를 내리지 않고 1만 줄이면 x^2이라 4가 되고, 1을 줄이지 않고 내리기만 하면 3x^3이라 24가 되어 12와 모두 달라요."
      guiding_question: "h=0.01로 (f(2.01)-f(2))/0.01을 계산하면 4, 12, 24 중 어느 값에 가장 가까운가요?"
    easier_problem:
      concept_code: "[12미적Ⅰ-02-03]"
      max_difficulty: 2.0
    prerequisite_concept:
      concept_code: "[12미적Ⅰ-02-03]"
    authoring_status: draft

  # ── M0075 곱의 미분을 각 도함수의 곱으로 처리 (corpus 귀속은 02-01이나 문항은 02-04에 있다) ──
  - mis_id: M0075
    corrective_explanation:
      rule_statement: "두 함수의 곱 f·g를 미분하면 f'·g'가 아니라 f'g + fg'입니다. 곱은 각 인수가 함께 변하는 효과를 모두 더해야 합니다."
      counterexample: "f(x)=x, g(x)=x이면 곱은 x^2이고 x=3에서의 미분계수는 6입니다. 그런데 f'(3)·g'(3)=1·1=1로 서로 달라요."
      guiding_question: "f(x)=x, g(x)=x일 때 곱 x^2을 직접 미분한 값과 f'(3)·g'(3)의 값을 비교하면 같은가요?"
    easier_problem:
      concept_code: "[12미적Ⅰ-02-04]"
      max_difficulty: 2.5
    prerequisite_concept:
      concept_code: "[12미적Ⅰ-02-04]"
    authoring_status: draft

  # ── M0672 곱의 미분을 '각각 미분한 곱'으로 처리 (M0075와 같은 kebab — 같은 교정을 가리킨다) ──
  - mis_id: M0672
    corrective_explanation:
      rule_statement: "두 함수의 곱 f·g를 미분하면 f'·g'가 아니라 f'g + fg'입니다. 상수배가 붙어 있어도 곱의 미분법의 구조는 같습니다."
      counterexample: "f(x)=x, g(x)=x이면 곱은 x^2이고 x=3에서의 미분계수는 6입니다. f'(3)·g'(3)=1·1=1과 달라요."
      guiding_question: "곱 x·x를 x^2으로 고쳐 쓴 뒤 직접 미분한 값은 f'·g'의 값과 같은가요?"
    easier_problem:
      concept_code: "[12미적Ⅰ-02-04]"
      max_difficulty: 2.5
    prerequisite_concept:
      concept_code: "[12미적Ⅰ-02-04]"
    authoring_status: draft

  # ── M0080 f'(a)=0이면 무조건 극값 ──
  - mis_id: M0080
    corrective_explanation:
      rule_statement: "f'(a)=0은 극값이 될 수 있는 후보일 뿐입니다. a의 좌우에서 f'의 부호가 바뀔 때만 극값입니다."
      counterexample: "f(x)=x^3은 f'(0)=0이지만 f'(x)=3x^2은 x=-1, 0, 1에서 3, 0, 3으로 부호가 같아 계속 증가합니다. x=0은 극값이 아니에요."
      guiding_question: "f(x)=x^3에서 x=0의 바로 왼쪽과 오른쪽에서 f'의 부호를 비교하면 바뀌나요?"
    easier_problem:
      concept_code: "[12미적Ⅰ-02-07]"
      max_difficulty: 3.0
    prerequisite_concept:
      concept_code: "[12미적Ⅰ-02-07]"
    authoring_status: draft

  # ── M0670 연속이면 미분가능으로 단정 ──
  - mis_id: M0670
    corrective_explanation:
      rule_statement: "미분가능하면 연속이지만, 연속이라고 해서 항상 미분가능한 것은 아닙니다. 그래프가 꺾이는 점에서는 우미분계수와 좌미분계수가 서로 다릅니다."
      counterexample: "f(x)=|x|는 x=0에서 이어져 있지만 오른쪽 기울기는 1, 왼쪽 기울기는 -1로 달라서 x=0에서 미분가능하지 않습니다."
      guiding_question: "f(x)=|x|의 그래프에서 x=0 바로 오른쪽과 바로 왼쪽의 기울기는 각각 얼마인가요?"
    easier_problem:
      concept_code: "[12미적Ⅰ-02-02]"
      max_difficulty: 2.5
    prerequisite_concept:
      concept_code: "[12미적Ⅰ-02-02]"
    authoring_status: draft

  # ── M0864 극대와 극소를 서로 바꿔 답함 ──
  - mis_id: M0864
    corrective_explanation:
      rule_statement: "f'의 부호가 +에서 -로 바뀌는 점이 극대이고, -에서 +로 바뀌는 점이 극소입니다. 임계점을 찾은 뒤 어느 쪽이 극대인지는 부호 변화로 먼저 판정합니다."
      counterexample: "f(x)=x^3-3x는 f'(x)=3(x+1)(x-1)이라 x=-1에서 증가에서 감소로 바뀌어 극대(극댓값 2), x=1에서 감소에서 증가로 바뀌어 극소(극솟값 -2)입니다."
      guiding_question: "f'의 부호가 +에서 -로 바뀌는 임계점과 -에서 +로 바뀌는 임계점 중 극대는 어느 쪽인가요?"
    easier_problem:
      concept_code: "[12미적Ⅰ-02-07]"
      max_difficulty: 3.0
    prerequisite_concept:
      concept_code: "[12미적Ⅰ-02-07]"
    authoring_status: draft

  # ── M0865 극값(함숫값)과 극점의 x좌표를 혼동 ──
  - mis_id: M0865
    corrective_explanation:
      rule_statement: "극댓값·극솟값은 함숫값 f(x)이고, 극대·극소가 일어나는 점의 위치는 x좌표입니다. x좌표를 구한 뒤 f에 대입해야 극값이 나옵니다."
      counterexample: "f(x)=x^3-3x는 x=-1에서 극대가 일어나지만 극댓값은 f(-1)=2입니다. -1은 점의 위치이고 2가 값이에요."
      guiding_question: "문제가 묻는 것은 x의 값인가요, f(x)의 값인가요? x=-1을 f에 대입하면 얼마가 되나요?"
    easier_problem:
      concept_code: "[12미적Ⅰ-02-07]"
      max_difficulty: 3.0
    prerequisite_concept:
      concept_code: "[12미적Ⅰ-02-07]"
    authoring_status: draft
