# Phase 3 — 기존 문항의 6슬롯 배정 규칙 (P3-05 3단계 · Kiki 결정 2026-10-15)
#
# 이 파일이 정본이고, 코퍼스 문항의 `p3-slot:<id>` 태그는 이 규칙을 `harness/problem_slot_backfill`이
# 적용한 산출물이다(결정론·LLM 0·tags 키만 변경). 설계 근거와 대안 비교: docs/reviews/p3_05_slot_assignment_draft_2026-10-15.md
#
# 읽는 법
#   · 위에서 아래로 처음 맞는 규칙 하나가 이긴다.
#   · slot 이 null 이면 "배정 보류"다 — 태그를 달지 않고, 이유(reason)를 리포트에 남긴다.
#   · 어떤 규칙에도 안 맞으면 태그를 달지 않는다(억지로 채우지 않는다).
#   · 한 문항은 슬롯 1개만 받는다. 같은 문면이 두 칸을 채워 수치를 부풀리지 않게 하기 위해서다.
#   · 이미 p3-slot 태그가 달린 문항(신규 504건 등)은 건드리지 않는다.
#
# when 조건 (모두 만족해야 맞는다)
#   concept                  문항의 PRIMARY 개념(source_id)이 이것일 것
#   folded_stem_contains     숫자를 #로 접은 문면에 이 문자열이 들어 있을 것 (문면을 못 읽은 문항은 맞지 않는다)
#   has_own_misconception    오답 보기가 크로스링크로 오개념에 닿는지(문항 자체 오개념 연결) — 계측기와 같은 판정
version: 1

# 이 규칙이 읽는 코퍼스. 슬롯 태그가 없던 **기존** 은행 4종뿐이다. 새로 만드는 문항(4단계 생성)은 생성기가
# 태어날 때 슬롯을 달므로 이 규칙으로 배정하지 않는다 — 새 은행을 여기 넣지 말 것(슬롯 없는 새 문항이
# 거친 규칙으로 조용히 배정되는 길이 열린다).
banks:
  - problem_bank_conceptual_v0
  - problem_bank_generated_v0
  - problem_bank_misconception_mc_v0
  - problem_bank_rephrased_v0

# 이 규칙이 닿는 개념. 슬롯이 비어 있던 핵심 개념 3개뿐이다 — 다른 개념의 문항은 읽지도 않는다.
scope_concepts:
  - "H:12미적Ⅰ02-01"   # 미분계수
  - "H:12미적Ⅰ02-02"   # 미분가능성과 연속성
  - "H:12미적Ⅰ02-07"   # 증가·감소, 극대·극소

rules:
  # (폐기 2026-10-18 · P3-49) 극값의 개수 24건을 02-01 에서 02-07 로 옮겼다(Kiki 승인
  # G-p3-49-extremum-retag-approval). 보류 규칙 hold-extremum-count-under-02-01 은 가리키는 문항이
  # 0건인 죽은 규칙이 되어 지웠다. 24건은 아래 misconception-trigger-by-own-distractor 로 02-07
  # 오개념 유발 칸에 들어간다.

  # 오답 보기마다 특정 오개념이 걸린 객관식. 계측기가 오개념 유발 칸에서 세는 기준과 같다.
  - id: misconception-trigger-by-own-distractor
    when:
      has_own_misconception: true
    slot: misconception_trigger

  # 02-01 가족 D — 접선의 기울기가 k인 점의 x좌표를 구한다: 미분계수의 의미를 거꾸로 쓴다.
  - id: tangent-slope-inverse-is-applied-under-02-01
    when:
      concept: "H:12미적Ⅰ02-01"
      has_own_misconception: false
    slot: applied

  # 02-07 단답 — 극값·극점을 구한다: 이 개념의 핵심 행동 그 자체다.
  - id: extremum-finding-is-representative-under-02-07
    when:
      concept: "H:12미적Ⅰ02-07"
      has_own_misconception: false
    slot: representative
