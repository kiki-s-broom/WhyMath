# ── 항 6. 핵심 오개념 목록 (M-id) ──────────────────────────────────────────
# selection_rule — 기계적 규칙(세션 제안, Kiki 확인 대상):
#   (1) 그 개념의 성취기준에 귀속된 M-id(ATOM 유래 제외) 중, 이미 문항의 오답 보기(distractor)에
#       L4 kebab 크로스링크를 거쳐 닿는 것을 우선한다.
#   (2) 그런 M-id 가 없는 개념은 귀속 M-id 전부를 핵심으로 한다(이 대단원에서는 개념당 1개).
# 귀속 M-id 총 46개 중 12개가 핵심이다. 나머지(02-01 의 33개 등)는 DB 에 남지만 분모에 넣지 않는다.
# 이후 P3-06 이 핵심 오개념마다 signature·픽스처를 확보한다. 오개념 kebab 신설·크로스링크 서명
# (G-misc40-new-crosslink-signature)의 결과로 목록이 바뀌면 PR 로 변경한다.
core_misconceptions:
  selection_rule: "개념에 귀속된 M-id 중 문항 오답 보기에 이미 연결된 것 우선, 없으면 귀속 M-id 전부"
  items:
    - {mis_id: M0075, concept_code: "[12미적Ⅰ-02-01]"}
    - {mis_id: M0080, concept_code: "[12미적Ⅰ-02-01]"}
    - {mis_id: M0670, concept_code: "[12미적Ⅰ-02-02]"}
