# ── 항 8. 문제 수량 목표 ───────────────────────────────────────────────────
# 6슬롯 원문(지시문 [07] P3-04 ②): 대표 / 기본 / 응용 / 오개념 유발 / 진단 / 숙련도 확인.
# 합계 = 핵심 개념 수 × 슬롯 수 × 슬롯당 최소 고유 문항 수 (로더가 산술을 대조한다).
quantity_targets:
  slots:
    - {id: representative, name_ko: "대표"}
    - {id: basic, name_ko: "기본"}
    - {id: applied, name_ko: "응용"}
    - {id: misconception_trigger, name_ko: "오개념 유발"}
    - {id: diagnostic, name_ko: "진단"}
    - {id: mastery_check, name_ko: "숙련도 확인"}
  min_distinct_problems_per_slot: 1
  total_min_distinct_problems: 60
  distinct_basis: "문면 골격(숫자를 #로 접은 문면)의 고유 수 — 후보 문서 §2.1 의 실측 기준. P3-05 가 근사 중복 기준을 정하면 그 정의로 교체한다(PR)."
  counting_rules:
    - "오개념 유발 슬롯의 문제는 연결된 misconception signature 가 있을 때만 센다(지시문 [08] ③)."
    - "새 문제의 정답은 SymPy 로 검증된 것만 연결 완료로 센다(지시문 [08] ⑤)."

# ── 항 9. 콘텐츠 completeness 기준 ─────────────────────────────────────────
# 지시문 [04](P3-02)·[07](P3-04)이 정의한 목표 수치와 연결 종류를 그대로 옮긴 입력이다.
# '완전 연결'의 측정 정의는 P3-02 가 코드 한 곳에 둔다 — 이 절은 측정 정의가 아니다.
completeness:
  targets:
    content_coverage_rate: {value: 0.95}
    curriculum_coverage: {value: 0.98}
    concept_completeness: {value: 0.95}
    problem_coverage_by_skill: {value: 0.95}
    graph_connectivity_coverage:
      value: null
      reason: "지시문 원문에 목표 수치가 없다 — P3-02 가 기준선을 실측한 뒤 제안한다."
  concept_required_links: [prerequisite, misconception, solution, hint, pedagogy]
  graph_path: [concept, skill, problem, misconception, pedagogy]
  curriculum_path: [curriculum, concept, skill, problem]
  problem_required_fields:
    - difficulty
    - skill
    - concept
    - solution
    - answer
    - misconception_signature
    - hint_strategy
  empty_denominator: fail
