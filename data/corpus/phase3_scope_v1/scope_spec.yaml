    - {mis_id: M0673, concept_code: "[12미적Ⅰ-02-05]"}
    - {mis_id: M0674, concept_code: "[12미적Ⅰ-02-06]"}
    - {mis_id: M0864, concept_code: "[12미적Ⅰ-02-07]"}
    - {mis_id: M0865, concept_code: "[12미적Ⅰ-02-07]"}
