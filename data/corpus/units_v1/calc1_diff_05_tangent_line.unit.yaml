  - suffix: "OBJ-01"
    statement: "곡선 위의 한 점에서 그은 접선의 기울기가 그 접점에서의 미분계수임을 이해한다"
    standard_code: "[12미적Ⅰ-02-05]"
    source_verb: "이해한다"
    k_type: CONCEPT
    concept_nodes: ["12미적Ⅰ-02-05-2"]
  # OBJ-02 절차형 — 원자 -1(절차·primary). 조건(접점·기울기·곡선 밖의 점)별 접선 방정식 산출 절차다.
  - suffix: "OBJ-02"
    statement: "접점, 기울기, 곡선 밖의 한 점 가운데 주어진 조건으로 곡선의 접선의 방정식을 구한다"
    standard_code: "[12미적Ⅰ-02-05]"
    source_verb: "구한다"
    k_type: PROCEDURE
    concept_nodes: ["12미적Ⅰ-02-05-1"]
  # OBJ-03 표상형 — 원자 -3(표상). 접선 식의 접점 좌표·기울기와 그래프 위 직선을 양방향으로 잇는다.
  - suffix: "OBJ-03"
    statement: "접선의 방정식에 들어간 접점의 좌표와 기울기를 그래프 위의 직선과 연결하여 해석한다"
    standard_code: "[12미적Ⅰ-02-05]"
    source_verb: "해석한다"
    k_type: REPRESENT
