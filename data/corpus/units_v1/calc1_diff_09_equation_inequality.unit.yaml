unit_id: "12미적Ⅰ-미분-방정식부등식활용"
unit_version: 1
api_version: "unit/0.1"
title: "방정식과 부등식에의 활용"
curriculum_rev: "2022"
standard_codes: ["[12미적Ⅰ-02-09]"]
concept_nodes: ["12미적Ⅰ-02-09-1", "12미적Ⅰ-02-09-2", "12미적Ⅰ-02-09-3"]
objectives:
  # OBJ-01 개념형 — 원자 -2(개념). 오개념이 '실근 개수를 대수적으로만 보려 함'이라, 방정식을 두 그래프의
  # 교점 문제로 바꾸는 개념적 전환을 예·비예로 세우는 CONCEPT 팩이 맞다.
  - suffix: "OBJ-01"
    statement: "방정식 f(x)=k의 서로 다른 실근의 개수가 곡선 y=f(x)와 직선 y=k의 교점의 개수와 같음을 이해한다"
    standard_code: "[12미적Ⅰ-02-09]"
    source_verb: "이해한다"
    k_type: CONCEPT
    concept_nodes: ["12미적Ⅰ-02-09-2"]
  # OBJ-02 절차형 — 원자 -1(절차·primary). 극값 계산 → 극값의 부호·크기 비교 → 실근 개수의 절차다.
  - suffix: "OBJ-02"
    statement: "도함수로 극값을 구하고 그 값을 이용하여 다항방정식의 서로 다른 실근의 개수를 구한다"
    standard_code: "[12미적Ⅰ-02-09]"
    source_verb: "구한다"
    k_type: PROCEDURE
    concept_nodes: ["12미적Ⅰ-02-09-1"]
  # OBJ-03 표상형 — 원자 -3(표상). 부등식(식)을 최솟값과 그래프의 위치(그림)로 옮긴다. 부등식이
  # '성립함을 보이는' 정당화 측면이 있으나 핵심 인지 행동은 식→그래프 번역이라 REPRESENT로 둔다.
  - suffix: "OBJ-03"
    statement: "주어진 범위의 모든 x에 대하여 부등식 f(x)≥0이 성립하는지를 그 범위에서의 최솟값과 그래프의 위치로 바꾸어 해석한다"
    standard_code: "[12미적Ⅰ-02-09]"
    source_verb: "해석한다"
    k_type: REPRESENT
    concept_nodes: ["12미적Ⅰ-02-09-3"]
