#   + 성취기준의 '유용성 인식' 축을 MODELING 목표 1개로 둔다(이차함수 파일럿 OBJ-04 선례).
#   MODELING 팩은 stub이라 OBJ-04만으로는 교수 경로 연결로 세지 않는다 — 이 개념의 연결은 OBJ-01~03이 만든다.
# 인용 코드 실측 확인:
#   원자 12미적Ⅰ-02-10-1/2/3 ∈ data/corpus/atom_graph_v1/graph.json
