objectives:
  # OBJ-01 개념형 — 원자 -1(개념·primary). 오개념이 'f′(a)=0이면 무조건 극값'이라 변곡점형 반례
  # (예: x³의 x=0)로 경계를 시험하는 CONCEPT 팩이 맞다.
  - suffix: "OBJ-01"
    statement: "미분가능한 함수에서 f′(a)=0이어도 x=a의 좌우에서 f′(x)의 부호가 바뀌지 않으면 극값이 아님을 설명한다"
    standard_code: "[12미적Ⅰ-02-07]"
    source_verb: "설명한다"
    k_type: CONCEPT
    concept_nodes: ["12미적Ⅰ-02-07-1"]
  # OBJ-02 절차형 — 원자 -2(절차). 도함수 부호 조사 → 증감표 → 판정의 정해진 절차다.
  - suffix: "OBJ-02"
    statement: "도함수의 부호를 조사해 증감표를 만들고 함수의 증가와 감소, 극대와 극소를 판정한다"
    standard_code: "[12미적Ⅰ-02-07]"
    source_verb: "판정한다"
    k_type: PROCEDURE
    concept_nodes: ["12미적Ⅰ-02-07-2"]
  # OBJ-03 표상형 — 원자 -3(표상). 증감표(부호)와 그래프 모양을 양방향으로 옮긴다 — 그래프에서
  # 부호표를 복원하는 역방향 번역을 더 자주 시키는 REPRESENT 팩의 방침과 맞는다.
  - suffix: "OBJ-03"
    statement: "증감표에 적힌 도함수의 부호와 함수의 그래프 모양을 서로 옮겨 해석한다"
    standard_code: "[12미적Ⅰ-02-07]"
    source_verb: "해석한다"
    k_type: REPRESENT
    concept_nodes: ["12미적Ⅰ-02-07-3"]
