  # 생성(꺾인 점)으로 경계를 시험하는 CONCEPT 팩이 주 축이다. '미분가능하면 연속'을 정당화하는 부분은
  # 논증이므로 부 유형 PROOF로 기록만 한다(PROOF 팩은 stub — 기록용이며 연결 판정에 쓰이지 않는다).
  - suffix: "OBJ-01"
    statement: "어떤 점에서 미분가능한 함수는 그 점에서 연속이지만 연속인 함수가 항상 미분가능하지는 않음을 설명한다"
    standard_code: "[12미적Ⅰ-02-02]"
    source_verb: "설명한다"
    k_type: CONCEPT
    k_type_secondary: PROOF
    concept_nodes: ["12미적Ⅰ-02-02-1"]
  # OBJ-02 절차형 — 원자 -2(절차). 좌·우 미분계수를 구해 비교하는 정해진 판정 절차다.
  - suffix: "OBJ-02"
    statement: "좌미분계수와 우미분계수를 구해 비교하여 한 점에서의 미분가능성을 판정한다"
    standard_code: "[12미적Ⅰ-02-02]"
    source_verb: "판정한다"
    k_type: PROCEDURE
    concept_nodes: ["12미적Ⅰ-02-02-2"]
  # OBJ-03 표상형 — 원자 -3(표상). 그래프의 꺾인 점과 식의 좌·우 미분계수 불일치를 잇는 번역이다.
  - suffix: "OBJ-03"
    statement: "연속이지만 미분가능하지 않은 점을 그래프에서 찾고 그 까닭을 좌우 기울기의 차이로 해석한다"
    standard_code: "[12미적Ⅰ-02-02]"
    source_verb: "해석한다"
