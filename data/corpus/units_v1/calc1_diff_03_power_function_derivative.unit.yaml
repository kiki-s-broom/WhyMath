objectives:
  # OBJ-01 개념형 — 원자 -2(개념). 오개념이 'f′(x)를 한 점의 수(미분계수)와 혼동'이라, 한 점의 값과
  # 함수의 대비(예·비예)로 '함수에서 함수로'를 세우는 CONCEPT 팩이 맞다.
  - suffix: "OBJ-01"
    statement: "도함수가 각 x에 그 점에서의 미분계수를 대응시키는 새로운 함수임을 이해한다"
    standard_code: "[12미적Ⅰ-02-03]"
    source_verb: "이해한다"
    k_type: CONCEPT
    concept_nodes: ["12미적Ⅰ-02-03-2"]
  # OBJ-02 절차형 — 원자 -1(절차·primary). 계수 n 누락 오개념을 단계 짚기로 다루는 PROCEDURE 팩.
  - suffix: "OBJ-02"
    statement: "도함수의 정의로부터 y=xⁿ(n은 양의 정수)의 도함수를 구한다"
    standard_code: "[12미적Ⅰ-02-03]"
    source_verb: "구한다"
    k_type: PROCEDURE
    concept_nodes: ["12미적Ⅰ-02-03-1"]
  # OBJ-03 표상형 — 원자 -3(표상). f와 f′의 그래프를 오가며 '접선 기울기 = 도함수의 함숫값'을 읽는다.
  - suffix: "OBJ-03"
    statement: "y=xⁿ과 그 도함수의 그래프를 비교하여 각 점의 접선의 기울기가 도함수의 함숫값이 됨을 해석한다"
    standard_code: "[12미적Ⅰ-02-03]"
    source_verb: "해석한다"
    k_type: REPRESENT
    concept_nodes: ["12미적Ⅰ-02-03-3"]
