  # 깨진 반례(꺾인 점·끊긴 점)로 경계를 시험하는 CONCEPT 팩이 맞다. 정리의 증명은 목표에 두지 않았다.
  - suffix: "OBJ-01"
    statement: "평균값 정리가 성립하기 위한 조건인 닫힌구간에서의 연속과 열린구간에서의 미분가능, 그리고 그 결론을 설명한다"
    standard_code: "[12미적Ⅰ-02-06]"
    source_verb: "설명한다"
    k_type: CONCEPT
    concept_nodes: ["12미적Ⅰ-02-06-1"]
  # OBJ-02 절차형 — 원자 -2(절차). c가 열린구간 안에 있어야 함을 목표 문장에 명시했다 — 구간 밖 근이
  # 정답으로 통과하던 검산 결함(P3-19 소관)과 같은 지점이 학생의 절차 단계에서도 빠지기 쉽다.
  - suffix: "OBJ-02"
    statement: "조건을 먼저 확인한 뒤 열린구간 안에서 평균값 정리를 만족시키는 c의 값을 구한다"
    standard_code: "[12미적Ⅰ-02-06]"
    source_verb: "구한다"
    k_type: PROCEDURE
    concept_nodes: ["12미적Ⅰ-02-06-2"]
  # OBJ-03 표상형 — 원자 -3(표상). 식(평균변화율 = 미분계수)과 그래프(할선과 평행한 접선)를 잇는다.
  - suffix: "OBJ-03"
    statement: "평균값 정리를 할선과 평행한 접선이 구간 안에 적어도 하나 있다는 그래프의 성질로 해석한다"
