# 교수전략 카탈로그 — ANALOGY(비유). 정본: docs/architecture/04g_pedagogy_strategy_catalog.md §3.
# 내부 서술 자산(학생 대면 텍스트 아님) — 서술·매핑은 후속 사람 검토 전제.
# ⚠️ 용어 3축 주의(04g §1): 여기의 ANALOGY는 교수전략 "비유"다 — 학생의 문제 공략 전략
# strategy.analogy(유추·비슷한 문제로 치환)와 같은 영단어·다른 개념.
strategy: ANALOGY
name_ko: 비유
description: 친숙한 상황의 관계 구조에 빗대어 새 개념의 직관을 만든다.
research_basis:
  - Gentner (1983) 구조 매핑 이론(structure-mapping theory)
target_grade_bands: [초등, 중학, 고등, 대학]
difficulty_range: [상, 중, 하]
target_k_types: [CONCEPT]
suitable_error_types: [개념혼동, 직관오류]
usage_notes: |
  형식 정의로 바로 진입하기 어려운 개념에 친숙한 상황을 빗대어 직관의 발판을 만들 때
  쓴다 — 표면 유사성이 아니라 관계 구조의 대응(구조 매핑)이 좋은 비유의 기준이다. 어긋난
  직관·개념 혼동의 교정에 유효하다.
  기대 효과: 개념 이해 부족·어긋난 직관의 교정, 새 개념의 진입 장벽 완화.
  금지·주의: 비유는 정의를 대신하지 않는다 — 렌더 계층의 reflection 세그먼트가 이 원칙을
  강제하며(04g §6.3), 비유가 어디서 깨지는지 반드시 함께 짚는다. 잘못 고른 비유는 오히려
  오개념을 심을 수 있다(예: "함수=자판기" 비유의 일대일대응 오개념 위험).
