신화 + venv·DB URL 고정\ncd C:\\Users\\kiki\\Desktop\\__AI\\WhyMath\ngit fetch origin main\ngit checkout -B main origin/main\n$Py = \"C:\\Users\\kiki\\Desktop\\__AI\\WhyMath\\.venv\\Scripts\\python.exe\"\n$env:WHYMATH_DATABASE_URL = \"postgresql+asyncpg://whymath@127.0.0.1:5433/whymath\"\ncd src\\backend\n\n# 1) stamp — 3단계 A=0행으로 확정된 실태 리비전\n& $Py -m alembic stamp a9b8c7d6e5f4\necho \"STAMP_EXIT=$LASTEXITCODE\"\n& $Py -m alembic current\n\n# 2) 밀린 마이그레이션 전체 적용 (사전 전수 스캔: 파괴 연산 0·백업 확보됨)\n& $Py -m alembic upgrade head\necho \"UPGRADE_EXIT=$LASTEXITCODE\"\n& $Py -m alembic current\n\n# 3) 직접 신호 검증 — role 컬럼 실재(버전 문자열 아님) + 데이터 무손상(2683/2210/841/895)\ndocker exec whymath-pg psql -U whymath -d whymath -c \"SELECT column_name FROM information_schema.columns WHERE table_name='user_profile' AND column_name='role';\"\ndocker exec whymath-pg psql -U whymath -d whymath -c \"SELECT (SELECT count(*) FROM concept) AS concepts, (SELECT count(*) FROM concept_edge) AS edges, (SELECT count(*) FROM misconception_catalog) AS misconceptions, (SELECT count(*) FROM achievement_standard) AS standards;\"\n\n# 4) 운영자 계정 부트스트랩 — 앱 로그인과 동일 해시(sha256 소문자)·rollrock.ki@gmail.com\n#    (OAuth 미가동·user_profile 0행 실측 근거의 1회성. 페르소나는 enum 1번값 — 한글 인코딩 회피)\ndocker exec whymath-pg psql -U whymath -d whymath -c \"INSERT INTO user_profile (user_id, email_hash, persona_primary) VALUES (gen_random_uuid(), '26727c7b2e4acb35dbb468ab84a47fff1242b5248e5c67e7c9458f7a7557bb46', (enum_range(NULL::persona_enum))[1]);\"\n$uid = (docker exec whymath-pg psql -U whymath -d whymath -t -A -c \"SELECT user_id FROM user_profile WHERE email_hash='26727c7b2e4acb35dbb468ab84a47fff1242b5248e5c67e7c9458f7a7557bb46';\").Trim()\necho \"UID=$uid\"\n\n# 5) 좌석 1호 grant + list 검증 (list JSON = clear 증적)\n& $Py -m whymath_backend.ops.role_grant_cli grant $uid content_admin\necho \"GRANT_EXIT=$LASTEXITCODE\"\n& $Py -m whymath_backend.ops.role_grant_cli list\necho \"LIST_EXIT=$LASTEXITCODE\"\n\n[성공 기준] STAMP_EXIT=0 → current=a9b8c7d6e5f4 →