    evidence: "2026-09-08 Kiki 실행 완료 — fine-grained PAT 발급 + 저장소 시크릿 PR_AUTO_RESYNC_TOKEN 등록 + 수동 실행 검증.\n\n판정 기준: main a3b5cdc1b905a1e64d74ff1847c391e8b575efcf (run #3의 head_sha).\n\n[성공 실측] workflow_dispatch run #3 (id 34188745979 · 2026-09-08 04:56:02Z · dry_run=0) conclusion=success. 로그 실측 3줄:\n  - 헤더 `── PR 자동 재동기화 (repo=doldori7/WhyMath · dry_run=0 · token=pat)` — RESYNC_TOKEN_KIND=pat 즉 시크릿이 비어 있지 않고 이름이 정확하다\n  - `── 요약: 스캔 17건 · BEHIND+auto-merge 0건 · 최신화 0건 · 충돌 0건 · 미판정 4건 · 기타실패 0건`\n  - 미판정 4건(#1059·#1051·#1010·#1007)은 GitHub이 mergeStateStatus를 아직 계산하지 않은 PR로, 설계대로 \"모른다 != 아니다\"에 따라 건너뛰었다.\n스캔 17건은 그 시점 열린 PR 수와 일치하며, 이 값이 나왔다는 것은 GraphQL 조회(gh pr list)가 PAT로 성공했다는 뜻이다.\n\n[검증의 변별력과 그 한계 — 명시] dry_run=0으로 돌린 것이 핵심이다. dry_run=1은 쓰기 자격 검사를 건너뛰도록 일부러 열어 둔 경로라 PAT 없이도 통과하므로 변별력이 0이다. 다만 이번 실행에서 BEHIND+auto-merge가 0건이었으므로 update-branch 쓰기는 한 번도 호출되지 않았다 — 즉 이 게이트가 실증한 것은 (a)시크릿 실재 (b)토큰 값의 유효성(읽기 API 성공)까지이고, (c)Contents/Pull requests 쓰기 권한이 실제로 충분한지는 아직 미실증이다. 그 축은 승계 태스크 HARN-87 acceptance ①②가 가진다.\n\n[중간 실패 1건과 근본원인 — 재발 방지용 기록] 첫 수동 실행(run #1 · 04:31:07Z)은 실패했다. 실패 메시지는 `PR 목록 조회 실패(exit=1)`이고 스크립트가 남긴 응답 본문이 `Post \"https://api.github.com/graphql\": net/http: invalid header field value for \"Authorization\"` 였다. 이것은 권한 거부가 아니라 Authorization 헤더에 넣을 수 없는 문자가 토큰 값에 들어 있다는 뜻이다.\n  결정적 증거: 같은 로그의 env 출력에서 `GH_TOKEN: ***` 다음 줄에 타임스탬프 접두가 없는 빈 줄이 있었다. GitHub Actions 로그는 모든 줄에 타임스탬프를 붙이므로, 타임스탬프 없는 줄은 앞 줄의 연속 = 시크릿 값 자체가 개행을 포함한다.\n  처치: 토큰 재생성 후 PowerShell로 클립보드 값을 검사(길이·앞뒤 공백·github_pat_ 접두·비ASCII — 값은 미출력)하고 Set-Clipboard로 Trim한 뒤 시크릿을 갱신. run #3에서 해소 확인.\n  이 진단은 스크립트가 실패 응답 본문을 로그에 남기도록 설계돼 있었기에 1분 만에 가능했다(CLAUDE.md \"실패 원인이 남는가\"). 다만 사람 운영자에게는 여전히 해독 불가한 메시지이므로, 토큰 사전 검사(앞뒤 공백 제거 + 개행·비ASCII·길이 이상을 값 노출 없이 이름 붙여 보고)를 태스크 HARN-89로 등재했다.\n\n[부수 실측 — HARN-87 ⑤⑦에 넘긴다] run #2(id 34187637864)가 event=schedule로 2026-09-08 04:37:17Z에 발화했다. 이는 pr-auto-resync 자신의 첫 예약 실행 표본이며, 04:30 슬롯 기준 약 7분 지연이다(표본 1건 — 중앙값·최대 간격 판정에는 부족하므로 일반화하지 않는다). run #2는 시크릿 수정 전이라 같은 헤더 