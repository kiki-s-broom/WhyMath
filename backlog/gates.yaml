    title: "PR 자동 재동기화용 PAT 발급 — 저장소 시크릿 PR_AUTO_RESYNC_TOKEN (fine-grained PAT · Repository access=doldori7/WhyMath · 권한 Contents:Read and write + Pull requests:Read and write). 없으면 pr-auto-resync 워크플로가 fail-closed로 exit 1(아무것도 바꾸지 않음) — GITHUB_TOKEN이 만든 push는 CI를 재발화시키지 않아 새 head에 체크 0건이 되고 strict 하에서 PR이 영구히 막히기 때문(PR #1040 Codex P1). 발급 경로 = GitHub Settings→Developer settings→Personal access tokens→Fine-grained tokens→Generate new token, 등록 경로 = 저장소 Settings→Secrets and variables→Actions→New repository secret. 자가검증 = Actions 탭 pr-auto-resync를 dry_run=0으로 1회 수동 실행해 '쓰기 자격 없음'이 사라지고 요약 줄(스캔 N건)이 나오는지 확인"
    kind: human
