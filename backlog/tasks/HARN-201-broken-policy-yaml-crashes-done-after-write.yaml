# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-201-broken-policy-yaml-crashes-done-after-write
title: "YAML 문법이 깨진 policy.yaml에서 done이 대장을 쓴 뒤 정책 재읽기 예외로 죽는다 — 게이트를 타지 않는 면제 경로(--no-pr·사람 소유)가 밟는다"
track: infra-debt
stage: S3
subject: cross
