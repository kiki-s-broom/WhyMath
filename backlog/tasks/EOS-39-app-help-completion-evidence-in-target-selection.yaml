acceptance:
  - "① 실측 고정(2026-09-29 · 판정 기준 `EOS-147-all-correct-theta-upper-pin` 판정문 `docs/reviews/eos147_all_correct_theta_pin_judgment_2026-09-29.md` §10 · 독립 교수학 비판이 시뮬레이션하고 이 세션이 그 스크립트를 재실행해 같은 수치를 얻었다): 앱 학생의 추천열은 **학생 행동과 무관한 개루프**다. 앱이 `is_correct=True`만 기록하므로(EOS-146) 서로 다른 학생 행동 3종(항상 독립 성공·항상 도움 필요·무작위)의 30문항 추천열이 바이트 동일했다. EOS-147의 선택 θ는 API 클라이언트의 초기 연속 정답 도약(첫 정답 뒤 난이도 4.8 · 3.9)은 완화하지만, 앱 학생에게는 수정 전 열에 칸을 끼울 뿐이다(8문항 픽스처 단계 0.5: 수정 전 `2.9 → 4.8 → 4.4 → …` 이 `2.9 → 3.4 → 3.9 → 4.4 → 4.8 → 2.4 → …`) — 5번째 추천부터는 수정 전과 같은 \"남은 가장 어려운 문항\" 하강열이다. 합성 학생 모델(가정: 독립 성공확률 σ(θ_true−b)·아니면 코치 도움 완료·앱은 둘 다 정답으로 기록 · 방향의 증거이며 운영 수치가 아니다)에서 첫 30개 추천의 독립 성공확률 평균은 θ_true=−1/0/+1에서 수정 전 0.061/0.147/0.312 → 단계 0.5 수정 뒤 0.068/0.160/0.330에 그쳤고 P<0.25 문항 비율은 0.97/0.90/0.00이었다. 즉 EOS-147 제목의 \"앱 학생은 영구\"는 이 태스크 없이는 해소되지 않는다."
  - "② 소유 공백(대장 전수 검색 — 이 검색 방법 기준): `api/coach.py::_complete_problem`은 `is_correct=True`를 무조건 적재하고 `used_hint`(3상태 — 힌트 2단계 이상이 첫 정답 턴 전에 공급되면 True)는 `EOS-133-coach-hint-usage-attribution`(done)이 귀속시켰다. 그러나 `l2/next_problem_selection.py::load_attempt_history_state`의 응답 조회는 `used_hint`를 읽지 않아, 도움 완료가 독립 성공과 똑같이 추천 표적을 올린다(양의 되먹임). 대장에서 `used_hint`를 다루는 태스크는 `EOS-133`(done)·`EOS-29-assessment-evidence-hint-axis-producer`(숙달 추정기의 힌트 축 — 추천 표적이 아니다)·`EOS-45`뿐이고, 추천 표적에서의 소비는 소유자가 없다. `EOS-146-app-wrong-answer-event-source`는 오답·포기 이벤트의 원천만 소유한다."
  - "③ 처분 판정(교수학 독립 비판 1회를 받는다 — 판정문이 먼저이고 코드는 그다음이다): 후보를 실제로 돌려 센다. ⓐ 선택용 응답에서 도움 완료를 **오답으로 센다**(기존 `estimate_ability`를 그대로 재사용하고 혼합 이력이면 MLE가 유한해진다 — 독립 비판의 합성 모델에서 θ_true=−1/0/+1의 라벨이 30번째 추천에서 1.98/2.99/3.97로 수렴하고 독립 성공확률 평균이 0.50 근방, P<0.25 문항 비율이 0.05였다. BKT에서 힌트 요청을 오류로 세는 관례가 있다는 것은 독립 비판의 배경지식이고 문헌 확인은 하지 않았다) ⓑ 최고 난이도 앵커에서 도움 완료만 **제외**한다(하강 채널이 없어 꼭대기 고정이 남는다 — 같은 합성 모델에서 θ_true=0의 라벨이 10번째 4.83·30번째 4.77) ⓒ 꼭대기에 닿은 뒤 표적을 더 어려운 문항이 아니라 LTHC 확장 경로(일반화·역명제·변형)와 Polya 4단계 검토로 바꾼다 ⓓ 이월. 반드시 정한다: `used_hint=None`(미상)을 어느 쪽으로 세는가(모른다는 아니다와 같지 않다) · 도움 완료를 \"실패\"로 부르는 것이 학생 대면 표현·게임화 금기와 충돌하지 않게 계측 전용으로 남기는가 · EOS-133 귀속의 오귀속률. 판정 근거에는 앱 사각도 넣는다: 화면의 \"건너뛰기\"(`problem_screen.dart`)는 attempt를 기록하지 않아 미시도 최고난도 문항이 다음 호출에 다시 나온다(결정론 argmax — 코드를 읽은 결과이고 실기기 실측이 아니다)."
  - "④ 상수 `ALL_CORRECT_STEP_LOGIT`(EOS-147 시점 0.5)의 실측 보정: 그 값은 측정이 아니라 설계 논리(의사결정 우선순위 — 측정이 없으면 학생 웰빙을 우선해 덜 가파른 쪽)다. 운영 응답·이탈 데이터가 생기면 S4-15류 실측으로 정한다. 데이터가 없으면 없다고 판정문에 적는다."
  - "⑤ 집행 지점(정본화와 별항)과 변별력: 판정이 정한 규칙이 `load_attempt_history_state` → 두 정책(`CatRecommendationPolicy`·`SuneungRecommendationPolicy`)을 실제로 지나는지 배선 테스트로 동결한다. 실 PG HTTP 통합에서 \"도움 완료 이력\"과 \"독립 성공 이력\"의 추천열이 갈라지는 픽스처를 두고(수정 전에는 같다), 규칙을 끄는 뮤테이션이 RED여야 한다. 정책 버전 문자열(`cat_v3`·`suneung_v2` 이후)을 올려 소급 평가가 두 규칙을 섞지 않게 한다."
  - "⑥ 측정 재료·리포트 편입(EOS-147 연동 2026-09-29): 처치 기록의 `selection_theta`(선택 θ가 추정 θ와 다를 때만)·`theta_boundary`(경계일 때만) 키로 경계 규칙의 **발동률**(전체 `recommendation_render` 처치 중 `selection_theta` 키가 있는 비율)과 `theta_boundary` 값별 분포를 산출해 추천 도달 리포트(`ops/recommendation_reach_report.py`)에 축으로 싣는다 — CLAUDE.md \"작동한 비율\" 원칙(응답과 처치 기록은 요청 단위로 말하지만 집계 리포트는 아직 말하지 않는다). 분모(처치 0건)는 None으로 표기하고 0/0을 0.0으로 지어내지 않는다(그 모듈의 기존 규율). ④의 실측 보정은 이 발동률과 앱 학생 완료 수 분포를 재료로 삼는다. 정정: ⑤의 정책 버전 표기 `cat_v3`은 EOS-147의 실제 판 `cat_v4`(병렬 태스크 EOS-33이 `cat_v3`을 쓰므로 건너뜀)로 읽는다 — 이 태스크가 규칙을 바꾸면 그 판보다 위의 새 번호를 쓴다."
  - "⑦ 하한(전부 오답 → 추정 θ −4.0) 재판정 — EOS-146 착지로 트리거됨(2026-09-30 · 판정 기준 main `b6a41dee`): PR 1397이 코치 서버가 판정한 명확한 오답의 '문제당 최초 1건'을 학습 원장에 적재하고 그 스위치 `l4_coach_wrong_submission_enabled`의 기본값이 True라서, 앱 학생의 이력에 오답이 처음 들어간다. 전부 오답인 이력은 `estimate_ability`가 하한 −4.0으로 클램프하고(측정값이 아니라 경계 — EOS-147이 상한에서 잡은 것과 대칭) 추천 표적이 그 값을 그대로 쓴다. 이 태스크가 소유하는 사유: EOS-146 acceptance의 'EOS-147 연동' 항이 이 재판정을 EOS-146에 붙였으나 그 항은 EOS-147 브랜치에만 있어 PR 1397 구현이 볼 수 없었고 EOS-146은 done이 됐다 — 미이행분을 여기로 승계한다. 판정 전에 먼저 재현해 센다(전부 오답 이력 → 추천 표적·난이도 열, 경계 표지 `theta_boundary`가 하한으로 기록되는지). 결함 단정이 아니라 재판정이다 — 쉬운 문항으로 내려가는 것이 교수학적으로 옳을 수도 있다."
  - "[2026-10-02 정정 — 정책 번호 기준] ⑤의 \"정책 버전 문자열(`cat_v3`·`suneung_v2` 이후)\"은 병합 뒤 현행 값 기준으로 읽는다: 기본 CAT은 `cat_v4`(`cat_v3`은 EOS-33이 예약한 번호) · 수능은 `suneung_v3`(`suneung_v2`는 EOS-31, `suneung_v3`은 EOS-147)이다. 이 태스크가 선택 규칙을 바꾸면 번호를 이 문서에서 가져오지 말고 착수 시점 main의 `POLICY_VERSION_CAT`·`POLICY_VERSION_SUNEUNG`을 읽어 그 다음 번호를 쓴다 — 같은 번호를 두 변경이 쓰면 소급 평가가 섞이는 충돌이 이미 한 번 났다(EOS-147 대 EOS-31)."
  - "[2026-10-06 처분 결과 — 항별 이행·이월 대조 · 판정문 `docs/reviews/eos39_app_help_completion_selection_judgment_2026-10-06.md`] ①실측 고정=이행(EOS-146 이후 개루프가 부분적으로만 닫혔음을 재측정해 정정 — §1). ②소유 공백=이행(로더가 `used_hint`를 읽지 않던 것을 6열 조회로 읽는다 — 단위가 쿼리 문장의 컬럼을 직접 단언). ③처분 판정=이행(후보 6종 실측 + 교수학 독립 비판 1회 · 차단 2건을 판정문에서 먼저 고친 뒤 구현 — 처분표 §9). ④상수 0.5 보정=**의도적 이월**(운영 응답·이탈 데이터 없음 · 값 불변 — `EOS-176-selection-theta-after-the-top-and-target-probability`). ⑤집행 지점=이행(`selection_evidence`→로더→두 정책→처치 기록 결선을 단위·실 PG HTTP 통합으로 동결 · 도움 완료/독립 성공의 추천열이 갈라지는 픽스처 · 정책 버전 4종 · 결함 주입 하네스). ⑥측정 재료·리포트=이행(처치 기록 `selection_help_count`·`selection_hint_unknown_count` + 도달 리포트 §6 \"선택 θ 규칙 발동률\"이 선택 θ 키·경계 값별·도움 접기·미상 비율을 싣는다). ⑦하한 재판정=**부분 이행**(도움 접기가 만든 전부 실패에만 사다리 `max(-4.0, min(0.0, 실패한 최저 b - 0.5))` · 실제 오답만 있는 이력의 −4.0은 R3·R6 학습 밴드 가중이 선택 θ를 읽어 유지 — 남은 반쪽은 `EOS-175-selection-theta-real-wrong-lower-bound-r3-r6`). 이월 소유: 꼭대기 이후·목표 정답확률=`EOS-176` · WH-1 ⑤ 도움 감소 곡선=`EOS-177` · EOS-146 ⑩ 숙달 라벨 '초보'·라벨 정확도 실측=`EOS-178`."
