id: EOS-39-app-help-completion-evidence-in-target-selection
title: "추천 표적이 코치 도움 완료를 어떻게 세는가 — 앱 학생의 개루프(정답 완료만 기록)와 꼭대기 이후 하강 채널 판정 (EOS-147 이월)"
