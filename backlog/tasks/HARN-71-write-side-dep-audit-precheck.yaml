notes: "사고 경위(2026-09-06 PR #994·같은 세션 2회): ⓐ EOS-50 amend --reason 문장에 어구와 태스크 ID가 같이 들어가 CI harness-integrity red → 정정 push ⓑ 그 사각을 등재하는 HARN-70의 --notes가 원문을 인용해 같은 감사에 다시 걸림 — 게다가 로컬 체인이 ;라 감사 exit 1인데도 커밋·push가 진행됐다(두 번째 정정 push). 공통 원인: 감사는 CI(읽기측)에만 있고 대장을 쓰는 CLI(쓰기측)에는 없다 — 사람이 쓴 문장이 규칙을 어겼는지 쓰기 시점에 아무도 보지 않는다. HARN-52 등재 당시 '이 모듈은 의존을 자동으로 채우지 않는다'는 원칙은 유지하되, 위반 문장을 대장에 넣는 것은 막는다. CLAUDE.md 실수 관리(동일 유형 2회 이상은 대책 등재 의무)의 코드 형태 대책. 세션측 규율은 별도: 대장 조작 체인은 audit-deps && validate && commit && push로 게이트한다"
