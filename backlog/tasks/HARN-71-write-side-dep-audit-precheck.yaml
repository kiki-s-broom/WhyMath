  - "③ 변별력 양방향: tests/harness/test_cli.py에 (가) 위반 문장을 --reason으로 주면 exit 1 + 파일 바이트 동일 (나) 같은 문장에 --depends를 함께 주면 exit 0 (다) 어구 없는 문장은 exit 0 을 고정하고, 선검사 호출을 제거하는 뮤테이션에서 (가)가 RED임을 실측해 기록한다"
  - "④ 배선 실재성: CI harness-integrity의 audit-deps 스텝은 그대로 둔다(읽기측 이중 회계). 쓰기측 선검사가 CI 스텝을 대체한다고 선언하지 않는다"
