  - "① 집행 지점: backlog.py의 notes 기록 경로 3종(amend --reason·add --notes·block --reason, cancel --reason 포함 여부 실측)에서 파일을 쓰기 전에 dep_declaration.find_undeclared_dependencies를 결과 태스크 1건에 적용한다. 위반이면 exit 1로 거부하고 감사 메시지(어구·창·정정 명령)를 그대로 낸다 — 대장은 무변경이어야 한다(부분 쓰기 금지)"
