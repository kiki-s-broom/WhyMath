notes: "출처: 계획서 300 §6(Mastery Engine v1) — Phase 2 EOS 지시문 세트 P-06. 대조표 §11.2가 P-06을 EOS-13에 매핑했으나, EOS-13은 acceptance ④에서 \"계약만 바꾸고 숙달 수치는 바뀌지 않아야 한다 — 값이 바뀌면 정책 변경이므로 별건으로 분리한다\"로 값 축을 의도적으로 제외했다. 즉 P-06 지시문 6항목 중 EOS-13이 이행한 것은 1번(인터페이스)뿐이고 2~7번(v1 규칙 값·클램프·멱등·변경 이벤트·단일 경로 가드·주입 3종)은 소유자가 없었다. 이 태스크가 그 잔여를 소유한다.\n분류(§14): LOOP."
