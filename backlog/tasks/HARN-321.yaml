acceptance:
  - "① UserPromptSubmit 훅에 `backlog.py check-prompt`를 배선한다 — 매 요청마다 이 세션(현재 브랜치)이 claim한 in_progress 태스크의 ID·제목·paths를 한 덩어리(최대 6줄)로 주입하고, 요청이 그 범위 밖이면 착수 전에 사용자에게 대장 등록(add/amend) 여부를 먼저 확인하라고 안내한다. claim이 없으면 \"코드·문서 변경 요청이면 start가 첫 행위\"(착수 순서 규칙)를 안내한다. ② 결정적 신호: 요청 본문에 태스크 ID가 있으면 대조해 (a) 다른 세션이 claim 중 (b) done/cancelled (c) 대장에 없음 (d) 내 claim과 다른 todo 를 구분해 표기한다. ③ 절대 차단하지 않는다 — 어떤 입력·예외에서도 exit 0(관측 실패가 작업 실패가 되면 안 된다). 예외를 삼킬 때는 예외 타입명을 출력한다(침묵 실패 금지). ④ 지연: 대장 전체 로드(실측 3.1초)를 하지 않고 session 줄 텍스트 스캔 + 해당 파일만 파싱한다 — 1,302건 기준 0.5초 이내를 테스트로 동결. ⑤ 실패 주입: 각 분기(claim 있음/없음·ID 4상태·깨진 stdin·대장 부재)를 픽스처로 밟고, 핵심 분기를 뮤테이션해 RED를 확인한다."
