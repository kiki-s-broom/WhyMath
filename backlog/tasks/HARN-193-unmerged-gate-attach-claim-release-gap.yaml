  - "① 실측 고정(2026-09-28 · 판정 기준 main `ed3d14da`): `EOS-129-irt-discrimination-calibration`이 하루에 세 세션에서 착수됐다. 앞의 두 세션은 같은 순서를 밟았다 — `start` → `gates add`(각자 다른 게이트) → `amend`(requires_gates 추가) → `unblock`(원격 claim 해제 `release_status: ok`). ⓐ `claude/magical-maxwell-hja5kh-eos129`: start 07:14:50Z · 게이트 `G-eos129-item-response-census` · unblock 08:43:03Z · PR #1346 ⓑ `claude/focused-ramanujan-2p5q8w`: start 11:25:20Z(ⓐ 해제 2시간 42분 뒤) · 게이트 `G-eos129-prod-response-distribution` · unblock 11:28:46Z · PR #1352 ⓒ `claude/gallant-euler-blngpj`: start 12:11:37Z(ⓑ 해제 43분 뒤) · in_progress. 세 시점 모두 origin/main의 EOS-129는 `status: todo` · `session: None` · `requires_gates: []`였다(근거: 각 브랜치의 `backlog/events/*.ndjson` 전이 이벤트).\n② 원인 축(실측): 태스크 착수 차단은 세 겹이다 — ⑴ 원격 claim(refs/claims) ⑵ 트렁크 사본의 requires_gates·depends_on(HARN-91이 origin/main을 fetch해 본다) ⑶ 미머지 done(HARN-11 `scan_remote_done`). 게이트를 붙인 뒤의 `unblock`은 ⑴을 즉시 걷는데, 그 자리를 대신할 ⑵는 브랜치에만 있어 PR이 머지되기 전까지 어느 세션에도 보이지 않는다. 즉 보호를 교대하는 순간에 공백이 생긴다. HARN-11이 \"미머지 done\"에서 막은 노출과 같은 형태인데 게이트 축에는 대칭 검사가 없다.\n③ 설계 판정: 후보를 비용과 함께 판정한다 — ⓐ 쓰기측: `unblock`(과 → todo 전이 전반)이 트렁크에 없는 게이트를 requires_gates로 가진 태스크의 원격 claim을 걷지 않고 게이트 대기 홀드로 바꾼다(차단 홀드 `kind: block`과 같은 방식 · HARN-134). 트렁크 사본에 그 게이트가 실린 뒤에는 누구나 홀드를 걷을 수 있다. ⓑ 읽기측: `next`·`start`가 원격 브랜치 사본에서 트렁크에 없는 requires_gates 추가를 찾아(`scan_remote_done`과 같은 스캔) 착수 후보에서 빼고 착수를 거부한다. ⓒ 둘 다. 판정 근거에는 refs/claims push가 CCR 프록시에서 상시 실패하던 이력(HARN-07)처럼 쓰기측이 무력한 환경을 반드시 넣는다 — 쓰기측만 두면 그 환경에서 같은 공백이 다시 열린다.\n④ 실패 주입 검증: 픽스처가 세 상태를 모두 밟는다 — 게이트가 트렁크에 있음(정상 차단) / 게이트가 원격 브랜치에만 있음(이번 사고) / 게이트 없음(착수 가능 대조군). 이번 사고 상태를 주입해 `start` 거부(또는 `next` 제외)가 실제로 나는지 RED/GREEN을 가르고, 대조군에서 착수가 막히지 않는지도 함께 확인한다(과잉 차단 방지). 뮤테이션은 매 회 앵커 1건·주입 실재·원복 바이트 동일을 단언한다.\n⑤ 표시 정직성: 원격 스캔 상태가 ok가 아니면(offline·shallow·error) \"미머지 게이트 없음\"이 아니라 판정 불가로 표시한다(HARN-11·HARN-182와 같은 규약).\n⑥ 범위 밖: 이미 벌어진 EOS-129 3중 착수의 정리(#1346·#1352 중 택일, `claude/gallant-euler-blngpj` 산출물 처리)는 Kiki 판단이며 이 태스크가 아니다. 사람 게이트의 중복 안내는 HARN-105가 소유한다."
