  - "[추가 실측 2026-09-28 13:35Z · 판정 기준 main `6c880b67`] 같은 공백이 다른 태스크에서 지금 열려 있다 — `claude/focused-ramanujan-2p5q8w`가 `EOS-137-qa-per-item-verdict-adapter`에 대해 12:38Z에 같은 순서(`start` → `gates add G-eos137-first-eval` → `amend` requires_gates → `unblock` `release_status: ok`)를 밟았고, 작업은 PR #1352 브랜치에 있으나 main의 EOS-137은 `requires_gates: []` · 무주 todo라 `next` 1순위 후보로 노출되고 있다. 즉 이 공백은 한 세션의 실수가 아니라 게이트 부착 뒤 `unblock`이라는 **표준 작업 흐름 자체**가 만든다 — 하루에 세 세션이 두 태스크에서 같은 순서를 밟았다."
