acceptance:
  - "① 부재 실측 — gates 서브커맨드가 list/add/clear/waive/show 5종뿐이고 amend가 없다. 게이트의 판정 날짜와 판정 대상 문면은 title 문자열 안에만 있고, 그것을 고치는 CLI 경로가 없다. 실측 근거를 태스크에 적는다.\n\n② 실사례 기록 — 2026-09-23 EOS-128 4회차의 P3-G3·P3-G4 통합(Kiki 결정 ⓐ)이 이 공백에 부딪혔다. 판정일 11/22가 저장소 G3와 충돌해 Release 판정을 11/15로 옮겨 Week 3 게이트와 합쳐야 했는데, 정정 경로가 없어 gates waive 2건 + gates add 1건으로 우회했다. 그 결과 요건은 이동인데 대장에는 면제 2건 + 신규 1건으로 보이고 게이트 ID가 3개로 늘어 이력이 분산됐다. 정정 경로가 있었다면 제목 1건 정정으로 끝났다.\n\n③ 구현 — gates amend <G-id>가 --title·--kind·--assignee·--remind-after-days를 받고 --reason을 필수로 요구한다. append-only 규율을 따른다: 원 문면·원 값은 이벤트 대장에 보존하고 YAML에는 신값만 쓴다(정정 이력은 이벤트로 추적). cleared·waived 게이트에 대해서는 status를 건드리지 않고 문면·메타만 정정한다 — status 전이는 clear·waive의 몫이다.\n\n④ 변별력 주입 — 정상 입력 GREEN은 증거가 아니다. 미존재 게이트 지정 · --reason 누락 · 동일값(무변화) 정정 · 다른 태스크가 requires_gates로 건 게이트의 ID 변경 시도(=참조를 끊는다) 각각이 거부 또는 RED임을 주입으로 확인한다.\n\n⑤ 배선 확인 — 새 경로가 실제로 도는지 확인한다(validate·audit에 도달하는지, 이벤트에 gate_amend가 남는지). HARN-52 선례: 정정 경로 자체가 없는 위반을 지적하는 게이트는 사람이 게이트를 끄게 만든다 — 경로를 만들고 배선을 확인한 것까지가 이 태스크다.\n\n⑥ 완료 판정 — 게이트의 판정 날짜·문면을 YAML 손편집 0건으로 CLI만으로 옮길 수 있고, 정정 전후 값이 이벤트 대장에 남는다."
