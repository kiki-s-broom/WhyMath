notes: "출처: 2026-09-23 EOS-128 4회차. Kiki 결정 ⓐ(P3-G3·P3-G4 통합)를 집행하며 게이트 정정 CLI가 없음을 실측했다 — gates -h의 서브커맨드는 list/add/clear/waive/show 5종이고 amend가 없다. 게이트 날짜는 title 문자열에만 있다.\n\n[선례] HARN-52-dependency-declaration-enforcement와 같은 형태다 — 그때는 \"amend에 --depends가 없어 정정 경로 자체가 없던 것\"이 문제였고(미완료 태스크 6건이 notes에만 선행을 적은 상태로 방치), 대책은 amend에 --depends·--priority를 여는 것이었다. 이 태스크는 그 형제 축이다: 태스크 대장에는 정정 경로가 있는데 게이트 대장에는 없다.\n\n[2026-09-23 우회 기록] 이번 집행에서 쓴 우회는 waive + add였다(손편집 금지 규율 준수). 요건 폐기가 아니라 이동이므로 waive 사유에 \"요건은 통합 게이트로 승계\" 를 적어 보존했다. 다만 이 우회는 게이트가 3개로 보이게 만들어 \"요건이 사라진 것인지 이동한 것인지\" 를 대장만 보고 판정할 수 없다 — 정정 경로가 필요한 실질 이유다.\n\n[범위 밖] 게이트 clear의 판정 기준(base) 규율(HARN-68)·게이트 status 전이는 건드리지 않는다. 이 태스크는 문면·메타 정정 경로만 다룬다.\n\n판정 기준 main 1671b9d4\n\n[취소 2026-09-23] 중복 등재 취소 — 같은 기능이 이미 HARN-124-gate-title-correction-path로 등재돼 있다(2026-09-21 등재 · gates 문면 정정 경로 부재 · acceptance ①이 gates에 정정 경로를 여는 것을 확정). 나는 gates 서브커맨드에 amend가 없음을 실측하고 \"기능이 없다\"로 결론했는데, 그것은 부재 주장의 검색 방법 오류였다 — CLI 표면(도구)을 확인하고 태스크 대장(소유자)을 확인하지 않았다. 등재 직후 harness의 의미 중복 고지가 HARN-124를 similarity 0.15로 지목해 발각됐다.\n\n계보: 이 형태는 3대째다. HARN-133 → HARN-135 → HARN-160(gate-remind-reschedule-path)이 등재됐다가 HARN-124에 편입·취소됐고, 그 태스크의 notes가 \"두 태스크가 각각 경로를 열면 HARN-88 형태의 중복이 된다\"고 적어 둔 바로 그 중복을 내가 재생산했다. 그 태스크 notes가 남긴 교훈(\"부재 주장의 재확인은 검색 방법을 바꿔야 한다\")을 같은 형태로 다시 밟았다.\n\n새 증거는 취소로 버리지 않고 HARN-124 acceptance ⑧로 편입했다 — 2026-09-23 P3-G3·P3-G4 통합 집행이 같은 벽에 부딪힌 두 번째 실측 트리거다. 판정 기준 main 1671b9d4"
