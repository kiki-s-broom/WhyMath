notes: "등재 경위: 2026-09-22 WEB-01 착지 중 G-web01-landing-legal-review를 remind 30d로 등재한 직후, Kiki께서 12/31까지 내부 앱 완성 기간으로 설정하고 변호사 검토를 그 이후로 미루셨다. 그러면 이 게이트는 2026-10-22부터 2027-01까지 두 달 넘게 매 세션 브리핑에 '독촉 초과'로 뜨는데, 그 기간 동안 사람이 할 수 있는 조치가 없다 — CLAUDE.md '상시 실패하는 fail-open 보호를 보호 있음으로 신뢰 금지'가 경계하는 상태(경고가 습관화돼 소음이 되는 것)를 새로 만드는 셈이다. 고치려 했으나 gates CLI에 경로가 없고(list/add/clear/waive/show), 대장 손편집은 금지이며, waive는 의미가 다르다(요건 면제 = 대기 태스크 해금). 그래서 우회하지 않고 태스크로 등재한다(CLAUDE.md '거부의 우회 금지' ③ CLI 경로 자체가 없는 설계 공백이면 태스크로 등재 — HARN-06 선례).\n\n실측(2026-09-22): pending 게이트 15건 중 12건이 미완료 태스크를 막고 있고, 독촉일이 이미 지난 것이 2건이다. 판정 시점이 독촉일보다 훨씬 뒤인 건은 현재 확인된 것이 G-web01-landing-legal-review 1건이며, 반대로 G-not-now-v1-release-recheck는 remind 100d로 올바르게 조정돼 있다 — 즉 관례는 이미 있고 정정 경로만 없다.\n\n범위 주의: 이 태스크는 독촉 주기의 정정 경로를 만드는 것이고, 게이트를 끄거나 리마인드 자체를 약화하는 것이 아니다. 전건 일괄 연장은 acceptance ⑤가 금지한다.\n\n[취소 2026-09-22] 중복 등재 취소 — HARN-124-gate-title-correction-path가 같은 축을 이미 소유한다. 등재 직후 CLI의 의미 중복 후보 고지(유사도 0.15 · 공유 희소어 '리마인드·손편집은·브리핑이')를 읽고 HARN-124 전문을 확인한 결과, 그 태스크의 acceptance ①이 'gates 서브커맨드에 등재 후 정정 경로를 연다'는 설계(덮어쓰기 아닌 추가 기록 형태·HARN-76 append 전용 근거 승계)를 이미 확정하고 있고, ②가 '정정이 SessionStart 브리핑·gates list까지 닿는지 실측'이라는 집행 별항까지 두고 있다. remind_after_days 재조정은 그 정정 기제에 얹히는 필드 하나이므로 별도 태스크가 아니다. 같은 서브커맨드에 두 태스크가 각각 정정 경로를 여는 것은 2026-09-08 HARN-88(정정 경로를 HARN-76이 이미 소유한 것을 모르고 중복 등재) 형태의 재발이다. 내용은 HARN-124 acceptance에 축으로 편입한다(amend)."
