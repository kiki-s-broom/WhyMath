  - "① backlog.py gates에 리마인드 주기·독촉 기준일 정정 경로 신설 — 예: gates reschedule <G-id> --remind-after-days N --reason <사유>. amend와 같은 규약: 사유 필수, 대장과 이벤트 양쪽에 정정 이력 append(HARN-76 append 전용 설계 승계). waive 재사용 금지 — waive는 status를 waived로 바꿔 대기 태스크를 해금하므로 '요건은 살아 있고 시점만 미뤘다'를 표현할 수 없고, 죽은 면제를 대장에 남긴다\n② 집행 지점(정본화와 별항): 정정이 실제로 SessionStart 브리핑의 독촉 판정을 바꾸는지 확인한다 — 파일에 값이 들어간 것과 브리핑이 그 값을 읽는 것은 다르다. 회귀 테스트로 동결(정정 전 독촉 초과 → 정정 후 미도달)\n③ 변별력: 정정 없이도 같은 화면이 나오면 이 기능은 위장이다. 뮤테이션으로 확인 — 정정 로직을 무력화하면 독촉 판정이 변하지 않는 것을 RED로 잡는다\n④ 실측 트리거 정정: G-web01-landing-legal-review(2026-09-22 등재·remind 30d → 독촉 2026-10-22)를 실제 판정 시점(12/31 내부 앱 완성 이후, 2027-01 초)에 맞춰 조정한다. 선례 = G-not-now-v1-release-recheck의 remind 100d(독촉 2026-12-29)\n⑤ 같은 형태의 미조정 게이트 전수 점검 — pending 게이트의 독촉일과 그 게이트가 막는 태스크의 실제 판정 시점이 어긋난 건을 열거하고, 어긋난 건만 조정한다(전건 일괄 연장 금지 — 그건 독촉 자체를 끄는 것과 같다)"
