  - "①결함 A — 대화형 블록이 붙여넣기 잔여분을 입력으로 먹는다(실측 2026-09-22 라이브). 검수 런북 §4의 `review_session` 호출을 여러 줄 묶음의 **마지막 줄**에 두었더니, 붙여넣기 버퍼에 남은 빈 줄들이 판정 프롬프트에 입력으로 들어가 「a/e/r/s/q 중 하나여야 합니다」가 **10회 연속 출력**됐다. 무효 입력이라 판정 자체는 기록되지 않았으나 **1번 항목의 HIT 타이머에 그 시간이 포함된다** — 이 검수의 산출 지표(F-Ⅰ HIT 중앙값)를 오염시키는 경로다. CLAUDE.md 「서버 점유 창에 후속 명령 혼입 금지」의 대화형 축이며, 그 규칙이 *서버*만 말하고 *대화형 CLI*를 말하지 않아 사각이었다. 처분: 대화형 명령은 **그 한 줄만** 단독 블록으로 주고, 환경 설정·가드는 앞 블록에서 끝낸다.\n②결함 B — 런북이 회차 산출물 경로를 리터럴로 박고 있다(실측 2026-09-22 라이브). §2~§5가 `data\\corpus\\problem_bank_mp02_first_run_v0\\`를 상수로 쓰는데, 검수 대상 회차(`run_id c0854e382b50415eb11829d991c93820` · attempted 30 · accepted 8 · canary_blocked)의 산출물은 **`C:\\Users\\kiki\\Desktop\\__AI\\mp02-out`** 에 있었다. 런북이 가리키는 폴더에는 회차 3건이 있으나 전부 `accepted 0`이고 `problems.jsonl`이 아예 없다. 즉 런북대로 실행하면 **입력 부재로 멈추거나(이번 경우) 엉뚱한 회차를 검수한다**. 회차 출력 위치는 실행자가 그때그때 정하는 값이라 문서에 박을 수 있는 종류가 아니다. 처분: 경로를 상수로 두지 말고 **`run_id`로 찾게** 한다 — §1에 회차 대장 전수 스캔 블록을 두어 대상 폴더를 확정하고, 이후 절은 그 변수를 쓴다.\n③집행 지점(정본화와 별항) — ⓐ 결함 A는 `scripts/ops/check_runbook_blocks.py`(HARN-106 · CI 잡 `infra-contracts`)가 이미 런북 쓰기 블록의 자가거부를 검사하므로 **같은 도구에 「대화형 명령이 다중 명령 블록의 마지막 줄에 온다」를 위반으로 추가**한다 ⓑ 결함 B는 문서 축이라 `tests/infra/test_mp02_runbook_sidecar_paths.py`에 「검수 런북의 데이터 경로가 리터럴 코퍼스 폴더명이 아니라 변수를 경유한다」를 동결한다.\n④변별력(실패 주입) — ⓐ 대화형 명령을 블록 끝에 둔 픽스처 → RED ⓑ 대화형 명령만 단독으로 둔 픽스처 → GREEN(**대조군** — 이것이 없으면 「대화형 명령 자체를 금지」하는 과잉 수정이 통과한다) ⓒ 런북에 리터럴 `problem_bank_mp02_first_run_v0` 경로를 되돌리는 뮤테이션 → RED ⓓ 대상 런북을 하나도 못 찾으면 RED(스캔 0건은 실패).\n⑤한계(명시) — 붙여넣기 잔여분이 실행 중 프로세스의 stdin으로 들어가는 것은 **터미널 동작**이라 저장소 코드로 막을 수 없다. 이 태스크가 막는 것은 런북이 그 상황을 *만들지 않게* 하는 것뿐이며, 사람이 대화형 블록 뒤에 다른 것을 붙여넣는 경우는 여전히 열려 있다.\n⑥경위 — 이 두 결함은 게이트 `G-eos-first-run-canary-review` 실행 중에 드러났고, 검수 자체는 15건 분모로 정상 진행됐다. 런북 축 결함 4회차다(사이드카 경로·인코딩·완주 판정 분모에 이어)."
