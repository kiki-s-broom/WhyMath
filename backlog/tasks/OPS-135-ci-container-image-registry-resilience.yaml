notes: |-
  [배경 실측 — 2026-10-09 UTC, 판정 기준 main 62243f2b7] 머지 queue 실행 3회(run 37989891118 · 37990209063 · 37992321577)가 서비스 컨테이너를 띄우는 Initialize containers 단계에서 docker pull을 3회 연속 실패했다. 로그: toomanyrequests: You have reached your unauthenticated pull rate limit. 이 때문에 PR #1529가 20:53:27Z · 20:56:23Z · 21:16:17Z에 CI_FAILURE로 dequeue됐다(그 앞서 19:38Z 탈락은 별개 원인 — 시간 단언 테스트). 같은 시간대 다른 PR의 pull_request 실행(run 37990987788 · 21:03Z)도 data-pipeline 실 PG · 실 Neo4j · backend-migrations가 같은 단계에서 실패했고, docker-build 잡은 21:10Z 이미지 빌드에서 429 Too Many Requests(registry-1.docker.io 의 library/python:3.12-slim 매니페스트 HEAD 요청)로 실패했다. 한도는 20:53Z부터 21:16Z까지 최소 23분 지속됐다. 러너는 이미 pull을 약 13초 동안 3회 재시도했으므로(run 37989891118 로그: 20:52:57 · 20:53:05 · 20:53:09) 재시도를 조금 늘려서는 해소되지 않는다.

  [해소 관측] 10-12 07:02Z 이후 머지 queue 실행 7건 중 6건 성공했다. 실패 1건(PR #1565, 12:32~13:04Z)은 32분이 걸렸으므로 컨테이너 초기화 단계의 수십 초 실패와는 다른 모양이다 — 원인은 로그로 확인하지 않았다. 10-09 21:16Z ~ 10-12 07:02Z 사이에 한도가 언제 풀렸는지는 조사하지 않았다.

  [미확인 — 구현 전에 확인] Docker Hub 익명·인증 한도 수치(정책이 바뀌므로 문서로 재확인) · ghcr 공개 패키지로 neo4j / pgvector 이미지를 재배포해도 되는지(라이선스) · 비공개 패키지로 둘 때 플랜별 저장 용량 상한 · mirror.gcr.io / public.ecr.aws에 두 이미지가 실제로 있는지.

  [기각한 대안] ①서비스 컨테이너 pull 재시도 확대: 러너 재시도가 이미 있고 한도 지속이 23분 이상이라 무효. ②공개 풀스루 미러(mirror.gcr.io 등) 직접 참조: 우리가 통제하지 못하는 캐시이고 이미지 존재도 미확인. ③잡 단위 재실행: 머지 queue 한 칸이 약 30분이라 한 번의 한도 실패가 곧 30분 손실이다.

  [관련] OPS-121(CI 의존 해석 고정 — 외부 공급원 변동이 CI 재현성을 흔드는 같은 계열) · OPS-100 / OPS-120(CI 잡 시간 예산). 이 태스크는 시간 예산이 아니라 공급원 안정성 축이다.

  [사람 행동 구분] 게이트 G-ops135-ci-image-source-decision 이 선택지를 정한다. ②를 고르면 Docker Hub 계정 · 액세스 토큰 발급과 GitHub Actions Secrets 등록은 Kiki가 직접 해야 한다(세션이 대신할 수 없다). ①을 고르면 조직의 패키지 권한 확인이 필요하다.

  [사고 기록] 같은 사건은 사고 대장(incident add)에 등재했고 대책 참조가 이 태스크다.
  [진행 — 2026-10-14] 게이트 G-ops135-ci-image-source-decision을 Kiki가 ①ghcr 미러로 판정했다(채팅 지정). 1단계 PR #1626 머지(a11a1320): 미러 목록·도구·워크플로·런북. 머지 직후 mirror-ci-images 첫 실행 성공(run 38602523083 · 49초 · 3/3건) — 사본 digest 3종이 업스트림 실측과 일치한다(pgvector 7b822b0a · neo4j f1e52d4d · python a6e34c59). **사본 패키지는 비공개다**(로그인 없는 imagetools inspect가 3종 모두 401) → 소비처는 credentials·docker login·packages 읽기 권한이 필요하다. 2단계(CI 참조 전환 + 계약 테스트 tests/infra/test_ci_image_sources.py)는 커밋 b81f41fd이며 로컬 CI 미러 상시 잡 5종이 40스텝 전부 통과했다 — PR 대기. 남은 일: ⑤ 실물 검증(2단계 PR CI·머지 큐 로그에서 사본 pull 줄을 인용 — 익명 폴백과 구분) → 그 뒤에 done. ⑥ 관측 판정은 런북 §5 ⑥에 기록했다(컨테이너 초기화 실패 잡은 뒤 스텝이 안 돌아 CI 안에서 원인을 따로 표시할 수 없다 — 미실측 추론). ⑦ 잔여 위험은 런북 §5로 충족. 미확인으로 남은 것: 사본 공개 전환 여부·neo4j/pgvector 재배포 라이선스·Docker Hub 현행 한도 수치.
