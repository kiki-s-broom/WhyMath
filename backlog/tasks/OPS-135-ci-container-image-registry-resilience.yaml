acceptance:
  - "① 결정(착수 조건 — 게이트로 집행): 게이트 G-ops135-ci-image-source-decision이 통과해 공급원 선택지(ghcr 미러 / Docker Hub 로그인 pull / 감수)가 정해져 있다. ③(감수)이 선택되면 이 태스크는 구현 없이 cancel하고(사유 = 게이트 evidence) 재판정 트리거(다음 탈락 시점)만 notes에 남긴다.\n\n② 범위 전수(착수 시 코드로 재산출 — 아래 목록은 2026-10-09 실측이며 정본이 아니다): Docker Hub를 익명으로 부르는 지점 전부. 실측 목록 = ci.yml의 backend-migrations(pgvector/pgvector:pg16) · data-pipeline-integration(pgvector/pgvector:pg16) · data-pipeline-neo4j(neo4j:5) · e2e-nightly(pgvector/pgvector:pg16) 서비스 컨테이너, docker-build 잡의 Dockerfile(FROM python:3.12-slim 2곳 + 첫 줄 syntax=docker/dockerfile:1 프런트엔드 이미지), weekly-metrics.yml의 pgvector/pgvector:pg16. 재산출은 grep 한 이름이 아니라 워크플로 YAML을 파싱해 services.*.image·container·docker pull/run 인자를, Dockerfile에서 FROM·syntax를 읽어 낸다(부재 판정은 검색 방법 자체가 옳아야 성립한다). 범위 밖으로 명시: 운영 docker-compose의 이미지 참조(CI 아님).\n\n③ 구현(선택지별): ①이면 미러 워크플로 신설(수동 + 주기 실행 · digest 고정 · pull 재시도) 후 서비스 이미지·Dockerfile FROM·프런트엔드 이미지를 미러 참조로 전환한다. ②이면 services.*.credentials와 docker-build 잡의 로그인 스텝을 추가하고, 시크릿 부재(포크 PR) 시 동작을 명시하며, 시크릿 등록은 사람 게이트로 분리한다. 어느 쪽이든 변경 대상은 ②의 재산출 목록 전부이고, 일부만 바꾼 상태를 완료로 치지 않는다.\n\n④ 집행(정본화와 별항): tests/infra에 거버넌스 테스트를 신설해 ②의 재산출 로직으로 모든 이미지 참조가 선택된 공급원(또는 credentials 보유)인지 단언한다. 새 익명 Docker Hub 참조가 추가되면 RED다. 스캔 대상 0건이면 실패한다(공허 통과 금지). 실패 주입은 순수 Python 하네스로 적용 단언(변이본 != 원본)과 바이트 동일 원복을 넣고, 최소 4종 — 서비스 이미지를 옛 참조로 되돌림 / credentials 키 삭제 / Dockerfile FROM을 옛 참조로 되돌림 / 새 잡에 익명 참조 추가 — 이 각각 RED이고 정상 입력(대조군)은 GREEN이어야 한다. 테스트가 CI에서 실제로 도는 잡(infra-contracts)을 실측으로 적는다.\n\n⑤ 실물 검증(초록만으로 판정 금지): 변경 후 PR CI 1회와 머지 queue 실행 1회에서 컨테이너 단계가 성공하고, 로그에 새 공급원 pull 줄(ghcr 참조 또는 인증 pull)이 실제로 찍힌 것을 인용한다. 익명 pull로 폴백했는데 마침 한도가 안 걸려 통과한 경우와 구분하려는 것이다.\n\n⑥ 관측 판정(구현이 아니라 판정 기록): 한도 실패(toomanyrequests · 429)가 코드 실패로 읽히지 않도록 CI에서 원인을 구분해 보이게 할 수 있는지 판정하고, 불가능하면 그 이유를 notes에 기록한다. 서비스 컨테이너 초기화가 실패한 잡은 뒤 스텝이 실행되지 않을 수 있어 가능 여부부터 실측해야 한다.\n\n⑦ 잔여 위험 기록: 미러를 택했다면 미러 이미지가 낡는 문제(보안 패치 지연)의 갱신 주기와 책임을, 로그인 pull을 택했다면 계정 한도가 CI 전체에서 공유되는 문제를 정본 문서 한 곳에 적는다."
