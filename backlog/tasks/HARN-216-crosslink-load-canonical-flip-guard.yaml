acceptance:
  - "① 적재 후 canonical 시뮬(순수 함수) — 적재 직전에 라이브 행 + 적재 예정 행을 합친 집합으로 kebab별 `select_canonical`을 계산하고, 그 결과가 코퍼스 자신의 선택(코퍼스 행만으로 계산한 canonical)과 다른 kebab을 전건 열거한다. 구분: 다른 M-id가 이김(wrong_winner) · 동률로 미선정(tie) · 일치(ok).\n② 집행 — `load_crosslinks`(및 `promote --load`)는 ①이 wrong_winner·tie를 1건이라도 내면 아무것도 쓰지 않고 거부한다(전용 종료 코드·kebab·라이브 M-id·신뢰도 열거). 우회 인자는 두지 않는다 — 해소는 라이브 행 삭제(사람 확인 경로)로만 한다.\n③ 변별력 — 실제 PostgreSQL에서 2026-10-07 실측 4건을 픽스처로 재현한다: `angle-sum-non-triangle`(라이브 M0863 0.95 + 코퍼스 M0493 0.85 → wrong_winner), `period-of-scaled-sine`(M0862 0.95 + M0152 0.85 → wrong_winner), `division-by-zero`(M0146 0.85 + M0003 0.85 → tie), `circle-radius-squared`(M0630 0.93 + M0848 0.93 → tie). 대조군 = 라이브 행이 코퍼스와 같은 kebab은 통과. 뮤테이션으로 거부 분기·동률 분기 각각 RED 확인(주입 적용 단언·원복 바이트 동일).\n④ 집행 지점 분리 — 계약(①의 판정)과 집행(적재 CLI가 실제로 ①을 경유하는지)을 별항 테스트로 둔다."
