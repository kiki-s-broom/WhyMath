eout · (10^9)!는 5경로 timeout · (x+y+z+w+v)^60은 verify_step·최종답·scan_attempt timeout · 조건 y=2^x에 답 x=10^100은 timeout · x^99+x+1=0은 최종답·verify_step timeout · 2^1000000000은 6.6~11.9초. ⓑ 더 심각한 발견 — 원격 코드 실행: exec(chr(..)+..) 형태(영숫자·괄호·+만)의 학생 입력이 verify_answer·verify_step·최종답·scan_attempt·OCR 경로에서 실제로 실행됐다. SymPy 파서가 eval을 쓰고 전역 이름공간에 파이썬 내장 함수를 싣기 때문이다. 메인 세션이 origin/main 사본에서 독립 재현했다(무해 페이로드로 표시 파일 생성 확인 · 결과는 unverifiable로 조용히 끝나 화면상 무증상). 해당 API는 ConsentedUser 인증이 필요하다 — 로그인한 학생 계정이면 누구나 가능했다. ⓒ 수정 후: 위 입력 전부 0.1~12ms 안에 unverifiable·OCR ok=False·RAN_NO_CANDIDATE로 끝나고 코드 실행 0건. 예외 2건 — x^99+x+1=0의 최종답 판정은 incorrect(좌변 거부 후 기존 폴백이 우변 0을 기대값과 비교), x^20+x+1=0(차수 상한과 같음)은 하류 solve로 약 1.5초. [범위 정정] 학생 입력이 닿는 호출부 51곳을 안전 진입점으로 옮기며 선언 paths 밖 파일이 바뀌었다(dsl·pregenerate·symbolic_equivalence·verify_answer_form·equivalent/llm_generator·counterexample_fuzz·l4 wrong_form_match·l5 ocr/verify·harness tier1_rejection_classifier·ops declared_unwired_audit·분석 스크립트 2종·API 테스트). [오기 정정] acceptance ④의 'CONST-07(R22-03 좌석)'은 CONST-08이다 — R22-03은 파트 VII(22장) 소관이고 대조표 배정도 CONST-08이다."
