acceptance:
  - "① 구간 실측 — 격리 워커의 첫 계산과 두 번째 계산을 같은 입력·같은 워커에서 나눠 재고(콜드/웜), 첫 계산이 계산 상한(started 이후 poll 창) 안에서 치르는 지연 import가 무엇이고 몇 ms인지 단독 10회 이상 + 코어 초과 구독(방해 프로세스 4~6개) 조건에서 수치로 적는다. 가설을 사실로 쓰지 않는다 — 기각되면 기각을 그대로 기록한다.\n② 제품 영향 판정 — 계산 상한 초과로 워커를 kill하면 교체 워커(_prewarm_replacement)도 콜드라서 같은 비용이 다음 정상 요청에 반복되는지, 그 결과 부하 중 정상 식이 판정 불가로 새는 빈도를 재현 실험으로 보인다. 판정 불가는 통과·오답이 아니므로 안전 방향이지만 학생 가용성 문제인지 여부를 적는다.\n③ 해법 — ①②의 실측을 따르되 판정 의미(상한 초과 = 판정 불가, 통과·오답 아님, 계산이 끊김)는 바꾸지 않는다. 후보: 워커 preload에 해당 모듈 추가 / 교체 워커에 더미 계산으로 웜업 / 계산 상한의 정의 조정. 변별력 보존 — 상한을 없앤 뮤테이션에서 반드시 RED. 뮤테이션 주입은 cp 백업 · mutated != original 단언 · 원복 sha256 일치로만 하며 git checkout/restore/stash로 원복하지 않는다.\n④ 테스트 정합 — tests/backend/api/test_verify_isolation.py 의 _warm_worker 가 워커 기동만 치르고 첫 계산의 지연 import는 안 치른다. 수정 전 파일을 방해 프로세스 4~6개 아래 4병렬로 32회 돌렸을 때 test_normal_step_is_unaffected_by_isolation 이 3회 'unverifiable' == 'correct' 로 실패했다. ③ 이후 같은 반복에서 실패 0건을 보인다."
