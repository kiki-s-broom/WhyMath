notes: "발견 경위: 2026-10-02 OPS-94 착수 시 acceptance 범위(pyproject·워크플로) 밖으로 의도적으로 남긴 표면 3종이다. 검사기 독스트링의 \"보지 않는 것\" 절이 이 태스크를 가리킨다(docstring 속 계획은 백로그를 대신하지 못하므로 등재). 루트 Dockerfile 의 pip 부트스트랩이 지금 무상한이라 docker-build 잡의 이미지 빌드는 pip 메이저 변경에 노출돼 있다. docker-build 잡은 로컬 재현 불가라 Dockerfile 편집의 최종 판정은 CI다."
