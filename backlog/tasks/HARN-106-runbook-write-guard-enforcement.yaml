acceptance:
  - "① 런북 마크다운의 PowerShell 블록 중 *쓰기·적재·파괴* 명령을 담은 블록은 자기 선행 판정값을 재검사해 미충족 시 실행을 거부하는 가드를 갖는다 — 가드 형태는 단일 최상위 if와 같은 줄 `} else {`(2026-09-15 실측: 대화형 붙여넣기에서 정상 파싱됨)이며, else 가지는 왜 건너뛰었는지를 출력한다(침묵 금지).\n② 기계 집행: scripts/ops/ 에 런북 스캐너를 신설해 docs/ops/*runbook*.md 의 powershell 펜스를 파싱하고, 쓰기 동사(populate·upgrade·grant·delete·insert·backfill 등)를 포함한 블록에 가드가 없으면 exit 1. CI 차단 스텝으로 배선한다.\n③ 변별력 검증: 가드 없는 블록·가드가 있으나 else 가지가 없는 블록·판정 변수를 참조하지 않는 위장 가드 3종을 주입해 전건 RED를 확인한다. 정상 런북(본 SKB-03 런북 정정본)에서는 GREEN.\n④ 스캔 0건은 실패로 처리한다(대상 런북을 하나도 못 찾으면 공허한 통과가 된다).\n⑤ 기존 런북 소급 적용 범위를 명시한다 — 전건 즉시 정정이 아니면 만료 지점을 동반한 그랜드파더로 적는다(만료 없는 유예 금지)."
  - "⑥ 입력 여부를 확인할 수 없는 프롬프트를 쓰지 않는다 (근거 2026-09-17 · ARCH-49 키 등록 런북) — 시크릿 입력에 `Read-Host -AsSecureString`을 썼더니 **별표조차 표시되지 않아** 붙여넣기가 실패한 것을 사람이 알 수 없었고, 빈 값이 그대로 `[Environment]::SetEnvironmentVariable`로 등록돼 자가검증이 `KEY_LENGTH=0`을 낼 때까지 무증상이었다. 스캐너는 런북의 대화형 입력 프롬프트가 **입력 사실을 관측 가능하게** 하는지 검사한다: `-AsSecureString`을 쓰는 블록은 입력 직후 길이·접두 검증(값 미출력)을 **같은 블록 안에서** 동반해야 하고, 그 검증이 없으면 exit 1. 기존 「시크릿 입력 안내 규칙」②(등록 직후 자가검증)의 *등록* 축을 **입력** 축으로 확장한 것이다 — 그쪽은 등록된 값을 검사하고 이쪽은 애초에 값이 들어왔는지를 묻는다.\n⑦ 쓰기 블록은 쓴 결과를 되읽어 확인하는 것까지가 한 동작이다 (근거 2026-09-17 · 같은 런북) — Machine 스코프 환경변수 정리 블록이 성공·실패 양쪽에서 똑같이 \"Machine 스코프 정리 완료\"를 출력했다. 무엇이 지워졌는지도, 지워지긴 했는지도 말하지 않는 **위장 검증**이며, CLAUDE.md 「변별력 없는 검증 스텝 금지」(2026-07-17)의 *쓰기* 축이다. 스캐너는 쓰기 블록이 **쓴 대상을 되읽는 문장**(`[Environment]::GetEnvironmentVariable`·`Get-ItemProperty`·조회 CLI 등)을 동반하고 그 결과를 출력하는지 검사하며, 고정 문자열만 출력하고 끝나는 블록은 exit 1. ①의 *사전* 가드(선행 판정 재검사)와 쌍을 이루는 *사후* 축이다 — ①이 \"돌아도 되는가\"를 묻는다면 ⑦은 \"돌고 나서 실제로 바뀌었는가\"를 묻는다."
