notes: "사고 경위(2026-09-15 · 동일 유형 2회차): 게이트 G-skb03-atom-node-populate 실행에서 런북의 [B]가 PATHS_MATCH_MAIN=False를, [C]가 HAS_SKIP_FLAG=False를 정확히 출력했는데도 후속 [D](적재)가 그대로 붙여넣어져, SKB-03 배선 이전의 옛 CLI가 돌고 atom_node 적재가 0건으로 끝났다(출력에 atom_nodes 필드 부재·AFTER_TOTAL=0). 원인은 Kiki 클론이 타 세션 브랜치 claude/adoring-mccarthy-sle0uj(HEAD 0367fce4)에 있었던 것이고, 런북은 그것을 검출했으나 멈추지는 못했다. DB 손상은 없었다(전부 멱등 upsert) — 왕복 1회 손실.\n1회차는 2026-09-14 G-skb01(REACH_EXIT=2인데 적재 단계가 그대로 실행)이며, 그때의 대책이 CLAUDE.md 2026-09-14 규칙 ③ '블록 간 선행 조건은 자동 가드로 잇지 말고 사람 판정 지점으로 끊는다'는 산문이었다. 이번 런북은 그 규칙을 충실히 따랐고(판정값 출력 + 눈으로 확인 안내) 그럼에도 실패했다 — 즉 사람 판정 지점만으로는 붙여넣기 흐름을 못 막는다는 것이 2회 실측됐다. CLAUDE.md '동일 유형 텍스트 규칙 2회 실패 후 코드 착지' 선례에 따라 이 태스크는 기계 집행을 담당한다.\n정정 실행에서 확인된 설계: ⓐ 쓰기 블록 자신이 재검사하는 가드(단일 if + 같은 줄 } else {)는 대화형 붙여넣기에서 정상 동작한다 ⓑ 실행 코드의 출처는 MODULE_FROM(import 후 __file__)으로 동결할 수 있다 ⓒ 공유 작업 사본을 건드리지 않는 실행은 git worktree --detach origin/main 으로 성립한다. 셋 다 런북 템플릿 후보다.\n행동 규칙 축(CLAUDE.md)은 같은 PR에서 함께 등재한다 — 이 태스크는 기계 집행 축만 소유한다.\n\n[개명 2026-09-16] HARN-103 → HARN-106-runbook-write-guard-enforcement: 번호 충돌 해소 — 등재 시점(2026-09-15)에 HARN-103-feature-code-freeze-rules가 미머지라 번호 검사에 보이지 않았고, 그쪽이 PR #1171로 먼저 main에 착지하면서 'HARN-103' 참조가 결정 불가가 됐다(머지 큐 harness-integrity가 exit 1로 검출). 미머지인 이쪽을 개명한다. 슬러그도 함께 부여한다 — 원 등재가 bare id였다.\n\n[정정 2026-09-17] ARCH-49 세션에서 같은 유형의 런북 결함 2건 실측 — 관측 불가 입력 프롬프트(KEY_LENGTH=0 무증상)와 성공/실패 동일 출력 위장 검증. 기계 집행 범위에 편입"
