  - "① 페르소나 3종 학습자 여정 완주 하네스 정본화 — 계획서 300 §11 / 집행 지시문 P-15. A 정상 학습자(진단 → 학습 → 문제 → 대부분 정답 → mastery 상승 → 다음 concept) · B 선수학습 결손(진단 → 문제 → 반복 오답 → prerequisite gap → 하위 concept → 보정 → **원래 concept 복귀**) · C 특정 오개념(진단 → 문제 → 특정 오답 패턴 → misconception detection → corrective explanation → targeted problem → misconception confidence **감소**). 각 단계의 LearnerState 변화를 기록·단언한다.\n\n② 판정 포인트 2종을 수치로 동결 — (가) Persona C는 confidence가 실제로 *내려가야* 통과다(단조 증가만 나오면 보정 미작동) (나) Persona B는 하위 concept 보정에서 멈추지 않고 원래 concept으로 복귀해야 통과다. 두 축 모두 결함 주입(뮤테이션)으로 RED를 확인한 뒤에만 보호로 친다 — 정상 입력에서 초록인 것은 증거가 아니다.\n\n③ 집행 지점 별항(정본화≠집행) — 이 하네스가 실제로 실행되는 CI 잡을 명시하고 배선을 확인한다. 저장소에 존재함 != 돌아감. 현행 관통 테스트 2종은 e2e-nightly(.github/workflows/ci.yml · if github.event_name == schedule) 전용이라 PR·push에서 돌지 않는다는 점을 판정에 반영한다.\n\n④ 승계 표기 — 이 태스크는 PED-36 acceptance ⑪(페르소나 3인 완주)을 승계한다. PED-36은 이 축을 더 이상 소유하지 않는다(폐기 표시는 amend append로 PED-36 쪽에 남긴다 — HARN-76 ④ 삭제 불가). 근거: EOS-120 ③이 제시한 해소 3택 중 (다) 축 분리, 2026-09-19 Kiki 판정.\n\n⑤ 범위 밖 명문 — PED-36 ⑧(SCENARIO-001~010 정형화)·⑩(CI 상시)은 EOS-119가, ⑨(코드갭/테스트갭 분류)·⑫(연속 3루프)는 PED-36이 계속 소유한다. 이 태스크는 그것들을 승계하지 않으며 구현하지도 않는다. 원 문서 §15 10월 동결 목록(신규 EOS 기능번호·Digital Twin·성장 경로 예측 등)은 production code로 구현하지 않는다 — 새 엔진을 추가하지 않고 안정화만 한다.\n\n⑥ 발견 결함의 처분 분리 — 3경로 실행 중 발견한 결함은 고친 것과 태스크로 등재만 한 것을 구분해 보고한다. 범위를 넓히지 않는다."
