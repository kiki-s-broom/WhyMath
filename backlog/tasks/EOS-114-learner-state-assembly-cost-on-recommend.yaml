acceptance:
  - "① 실측이 먼저다 — `GET /v1/me/next-problem`의 쿼리 수·지연을 전환 전후로 비교해 `get_state` 조립분(execute 5 + get 1)이 실제로 유의한 비용인지 판정한다. 유의하지 않으면 **아무것도 바꾸지 않고** 그 판정을 근거와 함께 적고 닫는다(추측 최적화 금지).\n② 유의하면 계약을 깨지 않는 방법만 쓴다 — `RecommendationPolicy.__call__(learner_state, learning_context)` 시그니처는 불변이다. 지연 조립(필요한 필드만 실제 접근 시 조회)·요청 스코프 캐시 중에서 고르되, 그 선택이 `LearnerState`의 `origins` 정직 표기를 훼손하지 않는지 확인한다(측정 안 한 필드를 `no_data`로 적으면 안 된다).\n③ 정책이 실제로 읽는 필드를 실측으로 열거한다 — EOS-19 시점에는 `mastery`·`student_id` 둘뿐이다. 나중에 정책이 더 읽게 되면 이 태스크의 전제가 바뀌므로, 판정문에 기준 커밋 해시를 박는다.\n④ 변별력 — 최적화를 넣었으면 그것이 *꺼진* 상태에서 쿼리 수가 늘어나는지 주입으로 확인한다. 정상 경로만 재고 \"줄었다\"고 적지 않는다."
