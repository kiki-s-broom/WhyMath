notes: "출처: EOS-19(추천 핸들러의 정책 함수 전환) PR #1204 본문의 '정직한 공백' 중 후속 후보로 남긴 축.\n\n배경: EOS-19 acceptance ①이 \"핸들러가 LearnerState를 입력으로 받는다\"를 요구해 핸들러가 매 호출 `l2.learner_state.get_state`를 부른다. 그 조립은 execute 5회 + session.get 1회를 쓰는데(2026-09-18 계수 대역 실측), 정책이 실제로 읽는 것은 `mastery`와 `student_id`뿐이다. 즉 계약을 지키느라 생긴 과조회이며, 계약 자체는 옳다(정책의 입력은 학습자 상태다 — 그래야 BKT를 DKT로 갈 때 시그니처가 안 바뀐다).\n\n정직 표기: 실 트래픽 지연은 측정하지 않았다. 이 태스크는 \"최적화를 하라\"가 아니라 \"잴 만한 비용인지 먼저 재라\"다 — 측정 없이 캐시를 넣으면 `LearnerState`의 origins 정직 표기와 캐시 무효화라는 두 축의 위험만 새로 생긴다.\n\n판정 기준: main e5d80a8e(PR #1204 머지 시점)."
