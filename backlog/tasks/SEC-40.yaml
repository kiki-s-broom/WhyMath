acceptance:
  - "① 계정 삭제(`privacy/erasure.py`의 `erase_user`)가 그 학생 세션의 `evidence_event` 행을 함께 삭제한다. 세션 행을 지우기 **전에** `session_id` 목록을 모은다(세션이 먼저 지워지면 조인 근거가 사라진다)."
  - "② 개별 세션 삭제(`api/me.py`의 `_delete_owned_resource` · `DELETE /v1/me/sessions/{id}`)도 그 세션의 `evidence_event` 행을 같은 트랜잭션에서 삭제한다. 같은 경로에서 고아로 남는 `attempt_event`(docstring \"설계 한계\")의 처분도 여기서 판정하고 근거를 적는다."
  - "③ 재연결 불가 동결 — 실 PG 통합 테스트로 두 경로 각각: 삭제 뒤 `deletion_audit`의 (user_id, resource_id)로 조인되는 `evidence_event` 0건 · 잔존 user_id로 계산한 HMAC 바인딩(`l2/pedagogy_evidence.session_user_binding`)과 일치하는 행 0건."
  - "④ SEC-39의 임시 허용목록 항목(`evidence_event`)을 제거한다(SEC-39의 만료 장치가 이것을 강제한다)."
  - "⑤ 선행: 결정 게이트 `G-eos37-erasure-kpi-disposition`. (나)를 고르면 이 태스크가 파기 배선을 소유하고 EOS-37은 KPI 수집기 쪽만 한다. (가)를 고르면 `evidence_event` 보존이 전제되므로 이 태스크는 변호사 회신(`docs/legal/pipa_data_matrix.md` §5 질문 2건) 전까지 구현하지 않는다."
  - "⑥ 삭제 증빙 로그(`deletion_audit`)의 user_id·resource_id 보존 연한은 이 태스크가 정하지 않는다 — MGMT-02 변호사 회신이 선행한다(`privacy/retention.py` ADMIN-03 문단)."
