notes: "발견 경위(2026-09-28 · 게이트 G-not-now-v1-release-recheck 전제 재점검 · 판정 기준 main 919865d4): 게이트 등재(09-20) 뒤 ARCH-66 ⑥(09-24)이 학생 참여 과정 전부를 12/31 이후로 미뤄, 이 게이트의 재개(②) 분기가 요구하는 'v1.0 운영 실측(학생 표본·KPI·비용)'(NOTNOW 11건 acceptance ③)이 연말 판정 회차에 존재할 수 없게 됐다. ARCH-66 세션은 EOS G4('학생 표본 ≥20명') 충돌은 찾았으나 이 게이트는 찾지 못했다 — 전제가 게이트 문면이 아니라 부착 태스크 acceptance에 있었다. 같은 형태의 다른 사례(사고 대장 계열 gate-premise-drift-after-decision · 발생일 순으로 이 건이 1회차 09-24, 아래 건이 2회차 09-25)는 2026-09-25 G-kg02-review-promotion-llm-session이다: S4-16 기각이 그 게이트 문면이 인용한 재개 경로를 닫았는데 기각 세션은 그 게이트를 갱신하지 않았고, 별도 전제 재점검(PR #1332)이 같은 날 발견했다. 두 번 모두 피해는 0(판정 전에 발견)이었고, 발견은 사람이 그 게이트를 꺼냈을 때의 우연이었다 — 장치가 아니라 순서가 막았다.\n\n중복 실측(trunk 기준): 역할 검색 '영향 게이트|영향 범위|impact|인용하는 게이트|게이트 문면.*인용|취소.*게이트.*경고' — 해당 축 태스크 0건(적중한 HARN-104는 PR 템플릿의 impact 칸 · 다른 축). 인접: HARN-174(입력 간선의 막다른 길 — 취소된 입력은 쓰는 순간 거부하지만 문면 인용은 보지 않는다) · HARN-84(사람 게이트 실행 절차 부재 탐지 — 다른 축) · HARN-177(판정 인계 — 다른 축).\n\n[정정 2026-09-28] notes 치환 — 회차 표기를 사고 대장(발생일 순)과 일치시킴 — 발견 순서(09-25 G-kg02 → 09-28 이 건)로 적었던 '1회차'를 정정"
