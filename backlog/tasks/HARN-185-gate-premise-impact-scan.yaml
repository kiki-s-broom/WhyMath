  - "② 전제 영향 조회(수동): backlog.py gates impact <패턴> [<패턴>...] — 결정 세션이 전제 변경(예: '학생 표본'·'12월 출시')의 영향 범위를 찾을 때 쓴다. pending 게이트 문면 + 그 게이트가 막는 태스크(requires_gates)와 입력 태스크(depends_on)의 acceptance·notes까지 한 번에 훑고, 적중마다 어느 게이트를 거쳐 걸렸는지(경로)를 출력한다. 2026-09-28 사례는 전제가 게이트 문면이 아니라 부착 태스크 acceptance ③에 있어 게이트만 보면 안 걸렸다 — 그 한 홉이 이 조회의 존재 이유다"
  - "③ 변별력(주입): 두 실사례를 픽스처로 재현한다 — ⓐ S4-16 취소 ↔ G-kg02-review-promotion-llm-session 문면 인용(①이 경고해야 한다) ⓑ '학생 표본' ↔ NOTNOW acceptance ③ 경유 G-not-now-v1-release-recheck(②가 적중해야 한다). 인용이 없는 대조군에서는 경고·적중이 0건이어야 한다. 스캔 함수를 무력화하는 뮤테이션에서 두 픽스처가 RED가 되는 것을 확인하고, 주입이 실제로 적용됐는지(변경 전후 다름)와 원복이 바이트 동일한지를 각각 단언한다"
  - "④ 한계 명시(과장 금지): ID 인용이 없는 의미 수준의 전제 변경 — ARCH-66처럼 새 방침이 조건을 바꾸는 경우 — 은 ①이 잡지 못하고 ②를 결정 세션이 돌려야 한다. 이 한계를 CLI 도움말과 docs/standards/build_harness.md 게이트 절에 적는다"
