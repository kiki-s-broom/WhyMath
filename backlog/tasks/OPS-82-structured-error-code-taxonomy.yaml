acceptance:
  - "① 실측 전제 (판정 기준 main 4b33d243 · 2026-09-15): `src/backend`에 예외 클래스 **34종** 실재, `error_code` 식별자 **0건**(`grep -rn \"error_code\" src/backend --include=*.py` → 0). 예외는 20+ 모듈에 흩어져 있다."
  - "② **`GenerationFailureCode`(F1~F8)와 합치지 않는다** — 그쪽은 *콘텐츠* 생성 실패 분류이고 이쪽은 *시스템* 에러코드다. 두 축을 한 이름으로 묶으면 검증설계서가 동결한 실패코드 의미가 오염된다(EOS-51 동결 대상)."
  - "③ 목적은 12월 판정 시 **장애 분석의 변별력**이다 — 서로 다른 8개의 실패가 같은 글자로 보이면 실패가 정보가 되지 못한다(2026-08-22 '측정·수집 도구를 성공 경로만 보고 설계 금지' ②: 예외 타입명만으로는 원인이 구분되지 않는다)."
  - "④ 침묵 실패 금지와의 접점 — never-break 경로가 예외를 삼킬 때 **예외 타입명을 로그에 포함**하는 현행 계약은 유지된다. 코드 축이 생기면 그 식별자가 타입명에서 코드로 승격될 수 있으나, **시크릿·필드값은 여전히 제외**한다(2026-07-16 langfuse 8일 전멸 교훈)."
  - "⑤ 정본화≠집행 별항 — 코드 체계를 *정의*하는 것과 API 응답·로그가 그 코드를 *싣는* 것은 다르다. 소비 지점(응답 스키마 필드·로그 포맷·관측 대시보드)을 별항으로 명시하고, 경유 배선이 0인 채로 완료하지 않는다."
  - "⑥ 범위 경계 — 34종 **전건 소급 부여가 아니다**. 부여 규칙(네이밍·계열·안정성 보증)과 적용 범위(신규 예외 + 학생 대면 경로)를 먼저 정하고, 전건 소급은 별도 후속으로 분리한다. 범위를 먼저 접지 않으면 이 태스크는 끝나지 않는다."
