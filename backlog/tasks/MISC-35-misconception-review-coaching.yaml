notes: "MISC-02 옵션 B 분리 등재 — Kiki 판정 2026-09-22(\"B를 별도 태스크로 등재 후 MISC-02 cancel\").\n\n[왜 MISC-02가 아니라 새 태스크인가] MISC-02는 \"선수학습 복습 ↔ 오개념 연동\"이고 이것은 \"오개념 복습 코칭 신설\"이다. 연동이 아니라 신규 기능이므로 MISC-02 id로 수행하면 스코프 치환이다. MISC-02는 같은 판정으로 cancel한다.\n\n[MISC-02 A·C가 불가능한 이유 승계 · 판정 기준 main b81a9909] 세 옵션이 전부 kebab-id → 개념 링크를 필요로 하는데 그 링크가 사람 게이트 뒤에 의도적으로 비어 있다. ⑴런타임 카탈로그 l4/misconception/models.py::Misconception에 개념 링크 필드 0건(domain은 영역 enum) ⑵개념 링크를 가진 유일한 자산 MisconceptionCatalog.concept_src_id는 PK가 mis_id(M-id)이고 ORM docstring이 \"kebab-id 체계와는 별개라 FK가 전혀 없다\"고 명문화 ⑶사이의 crosswalk는 docs/standards/crosswalk_gate_contract.md가 사람 승인 전용으로 묶어 비워 둠 ⑷misconception_crosslink_mode는 off|shadow 2값뿐이라 서빙 값이 없고 shadow는 반환 None이 불변(crosslink_shadow.py 모듈 docstring).\n\n[B가 성립하는 이유] 이 코칭의 대상은 개념이 아니라 오개념 자체다 — \"이 오개념을 다시 보자\". 따라서 kebab-id만으로 성립하고 개념 링크를 요구하지 않는다. MISC-02 차단 사유 ③(오라벨: '오개념이 관한 개념' != '선수')도 발생하지 않는다 — recommend_prerequisite_coaching을 건드리지 않으므로 무엇도 \"선수\"로 라벨되지 않는다.\n\n[선례 패턴] l4/calibration_coaching.py(recommend_calibration_coaching)·l4/prerequisite_coaching.py(recommend_prerequisite_coaching)가 이미 같은 형태다 — CoachingFocus에 포커스를 추가하고, recommend_coaching은 그 포커스를 반환하지 않으며(BKT/IRT만으로 결정 불가), 별도 순수 결정 함수가 전용 입력에서 빌드한다. 이 태스크는 그 세 번째 사례다.\n\n[승계 제약 — MISC-02 2026-08-11 차단 문면에서] 오개념 reactive retrieval만(preload 금지) · 오답을 오개념으로 단정 금지(가설은 후보일 뿐) · 기존 misconception_hypothesis 좌석으로 흘리고 별도 판정 경로 신설 금지(이중 진실원천) · 점수/오답률 노출 금지.\n\n[고립 브랜치 취급] 7n9n72(43e5d6d8)의 prerequisite_link.py는 이 태스크의 참고 자료가 아니다 — 그것은 옵션 C 계열이고 서빙 게이트 표현(misconception_crosslink_mode != \"off\")이 참이 되는 유일한 값이 shadow라 그대로 옮기면 비노출 측정 모드가 학생 대면 보충을 서빙하게 된다. 그 게이트 표현의 채택을 금지한다.\n\n[정정 2026-09-22] paths ['src/backend/whymath_backend/l4/misconception_review_coaching.py', 'src/backend/whymath_backend/l4/metacognitive_trigger.py', 'tests/backend/l4/test_misconception_review_coaching.py'] → ['src/backend/whymath_backend/l4/misconception_review_coaching.py', 'src/backend/whymath_backend/l4/metacognitive_trigger.py', 'src/backend/whymath_backend/api/me.py', 'tests/backend/l4/test_misconception_review_coaching.py', 'tests/backend/l4/test_prerequisite_coaching.py', 'tests/backend/api/test_me.py']: paths 실확장 — 집행 지점(api/me.py)과 그 E2E(tests/backend/api/test_me.py), exhaustiveness 동결(tests/backend/l4/test_prerequisite_coaching.py)이 실제 변경 대상인데 등재 시 paths에서 빠져 있었다. 누락 경로는 병렬 세션 충돌 탐지를 그만큼 비워 둔다(ASM-06 2026-09-21 정정과 같은 축·HARN-57 취지). 넓은 glob 대신 파일 단위로 좁혀 선언"
