acceptance:
  - "① 정본화 — l4/misconception_review_coaching.py에 순수·결정론 함수 recommend_misconception_review_coaching(hypotheses)를 신설한다. 입력은 활성 MisconceptionHypothesis 시퀀스(kebab id·confidence)이고 출력은 CoachingTrigger | None. DB·async·fetch 없음(데이터 fetch는 호출자 책임 — prerequisite_coaching.py·calibration_coaching.py 동형). 비면 None을 돌려준다."
  - "② 집행 지점(①과 별항 — \"정본화를 집행으로 착각한 완료 선언 금지\") — 이 함수를 실제로 부르는 서빙 코드 경로를 명시하고 배선한다. 현행 선수 코칭의 두 소비자 api/coach.py·api/me.py 중 어디에 어떤 우선순위로 끼우는지를 착수 시 실측으로 정하고 근거를 notes에 남긴다. 선수 차단이 있으면 그쪽이 우선이라는 기존 순서를 깨지 않는다(선수 결손이 더 근본적 장애물). 배선 후 \"이 함수가 실제로 호출됐다\"를 E2E로 증명한다 — 정상 200 응답은 알고리즘이 일했다는 증거가 아니다(\"작동한 비율\" 원칙)."
  - "③ 기존 계약 불변 — recommend_prerequisite_coaching의 시그니처·동작을 건드리지 않는다(회귀 0). recommend_coaching은 새 포커스를 반환하지 않는다(BKT/IRT만으로 결정 불가·선례 2건과 동형). CoachingFocus에 포커스를 추가하면 _RATIONALE·_PROMPT·_SOCRATIC_BY_FOCUS 세 dict의 exhaustiveness(키 집합 == CoachingFocus)를 함께 유지한다."
  - "④ 노출 안전 — 학생 노출 prompt·rationale에 오개념 *본문*(canonical_statement 등 \"네가 이렇게 잘못 생각했다\"는 진술)을 그대로 싣지 않는다. 가설은 확정 라벨이 아니라 후보이므로(MisconceptionHypothesis docstring) 단정 어투를 쓰지 않고, 비난·우열·정답 제공 0을 지킨다(CLAUDE.md 교수학 금기). 노출 가능한 안전 표시 필드가 무엇인지를 착수 시 실측으로 확정한다(name_kr 등) — 그 판정 자체를 acceptance 정정으로 남긴다."
  - "⑤ 변별력 — 뮤테이션 주입으로 전건 RED를 확인한다. 각 조건절마다 \"이 절이 없으면 무엇이 통과하는가\"를 적고 그 반례를 픽스처에 넣는다(픽스처가 그 절을 실제로 밟는지까지 확인 — 절을 지웠는데 GREEN이면 가드가 관대한 게 아니라 픽스처가 그 자리를 안 지나간 것이다). 신뢰도 임계·빈 입력·정렬 가정 각각에 성공 방향 대조군을 둔다."
artifacts:
  - "PR #1265 · https://github.com/kiki-s-broom/WhyMath/pull/1265 · 판정 기준 main `b81a9909` · 세션 `claude/busy-maxwell-360hyu` · 착지 커밋 `f8c66ab9`(구현) + `1e980a69`·`0d5570cc`·`6dab5cbd`(CI red 3건 수습)\n\n**① 정본화** — `src/backend/whymath_backend/l4/misconception_review_coaching.py` 신설. 순수·결정론 `recommend_misconception_review_coaching(hypotheses, *, min_confidence)` → `CoachingTrigger | None`. DB·async·fetch 0(`prerequisite_coaching.py`·`calibration_coaching.py` 동형 3번째 사례). None 3종: 빈 세트 / 초점 신뢰도 < 바닥 / 카탈로그 미해소(느슨 id — 날조 금지). 초점 선택은 `select_focus(rng=None)` 재사용(재구현 0·개입 채널과 같은 가설을 보게 함). 보류 바닥은 `intervene._LOW_CONFIDENCE`를 **복제하지 않고 참조**해 드리프트를 구조적으로 제거. `CoachingFocus`에 `misconception_review` 추가 + `_RATIONALE`/`_PROMPT`/`_SOCRATIC_BY_FOCUS` 3종 exhaustiveness 유지(ASSUMPTION).\n\n**② 집행 지점**(①과 별항) — `api/me.py::submit_attempt`. `apply_candidates`가 **반환한** 갱신 세트(감쇠·강화·가지치기 후 confidence 내림차순)로 결정해 응답 `misconception_review_coaching`에 싣는다(`calibration_coaching`과 나란한 별개 신호·신규 엔드포인트 0). **훑은 회차 안**에 둔다 — 밖이면 이번에 관측하지도 않은 과거 가설로 코칭이 나간다. E2E가 호출 횟수 카운터로 그 분기 위치를 고정(정답 회차 0·훑은 회차 1). **coach 경로는 의도적으로 쓰지 않았다**: `api/coach.py`가 이미 `select_intervention_from_hypotheses`로 같은 세트에서 개입 발화를 만들고 있어 거기 덧붙이면 MISC-02가 금지한 이중 진실원천이 된다.\n\n**③ 기존 계약 불변** — `recommend_prerequisite_coaching` 시그니처·동작 무변경(회귀 0). `recommend_coaching`은 새 포커스를 반환하지 않는다. 기존 exhaustiveness 동결 테스트를 9종→10종으로 갱신.\n\n**④ 노출 안전 실측 확정** — 학생 노출 필드는 `Misconception.name_kr`(짧은 주제 라벨) **하나뿐**. `canonical_statement`(학생이 가정한 잘못된 진술)·`counterexample`(반례)은 싣지 않는다 — 전자는 \"너는 이렇게 잘못 생각했다\"는 단정이고 후자는 답 미루기 위반이다. 발화는 가정형(\"혹시…\")·비난 0·신뢰도 수치 0. 교사용 근거에 \"확정 진단 아님\"을 문면으로 남긴다. 각 축을 전용 테스트가 동결.\n\n**⑤ 변별력** — 뮤테이션 **16종 전건 RED · 생존 0**. 하네스는 셸을 배제한 순수 Python이며 매 회차 주입 실재(앵커 1건·mutated != original·디스크 sha256 변화)와 원복 바이트 동일을 단언한다. 절마다 반례 픽스처 + 성공 방향 대조군(빈 세트↔비지 않음 / 바닥 미만↔정확히 바닥↔초과 / 느슨 id↔실재 id / 1건↔2건).\n\n**검증(로컬 CI 미러 — 판정 커밋 `6dab5cbd` = HEAD)**: 잡 7종 **스텝 50건 전건 passed · skipped 0건**. backend 전체 스위트 13,976 passed·377 skipped·1 xfailed · 계층 커버리지 게이트 PASS(l4 96.0%/floor 90%) · tests/infra 1,657 passed · ruff·black·mypy --strict(700 files)·lint-imports(4 kept, 0 broken) 전건 exit 0.\n\n**정직한 기록 — CI red 3회를 냈다**: ⓐ `1e980a69` 중복 임포트(F811)+정렬 — ruff를 돌리지 않고 푸시 ⓑ `0d5570cc` 신규 모듈이 EOS 기능 인벤토리에 미귀속 — CLAUDE.md v0.2.27이 명시한 `infra-contracts` 잡 축을 읽고도 잡 목록을 맞추지 않음(`WM-E-405`에 편입·주입 실측으로 그 한 줄이 통과 원인임을 고정) ⓒ `6dab5cbd` 불필요한 `get_active_hypotheses` 재조회가 테스트 대역의 위치 기반 질의 큐를 밀어 프라이버시 경계 테스트 1건 파손 — `apply_candidates` 반환값 사용으로 질의 순서를 변경 이전과 동일하게 복원(DB 왕복도 1회 감소)."
