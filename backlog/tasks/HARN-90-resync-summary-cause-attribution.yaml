notes: "[경위] 2026-09-08 게이트 G-pr-auto-resync-token 집행으로 pr-auto-resync가 처음 성공 실행됐고(run #3 · id 34188745979), 그 요약 줄 `BEHIND+auto-merge 0건`을 읽다가 0의 의미가 복원 불가함을 발견했다. CLAUDE.md 2026-08-03 \"작동한 비율\" 원칙(알고리즘을 붙였으면 그것이 작동한 비율을 리포트가 말해야 한다)의 이 워크플로 축이며, 스크립트가 스스로 \"분모를 항상 낸다\"고 선언해 둔 설계 원칙을 auto-merge·BEHIND 두 축에서만 지키지 않고 있었다.\n\n[의존 방향 — 주의] 이 태스크는 어떤 태스크에도 의존하지 않는다(depends_on 없음). 반대로 이 축이 없으면 \"1주 뒤 재동기화 발생 건수를 세어 주기를 조정하거나 유지한다\"는 라이브 측정 축이 판정 불능이 된다 — 최신화 0건이 나와도 ⓐ대상 집합이 비었음과 ⓑ경합이 없었음이 갈리지 않으므로 조정할 근거도 유지할 근거도 없다. 즉 방향은 이 태스크 → 그 측정 축이다.\n\n[분리 사유] 원래 HARN-87 acceptance ⑧로 등재하려 했으나 구현 도중 다른 세션(PR #1059 · main 05:11Z 머지)이 그 태스크에 새 의존을 붙여 착수 자격이 소멸했고 ⑧ 번호도 그쪽이 먼저 썼다. 거부를 우회하지 않고 별도 태스크로 분리한다(CLAUDE.md \"거부의 우회 금지\"). 관측 결과는 그쪽 acceptance ⑨로 따로 남겼다.\n\n[정직한 고지] 코드가 먼저 쓰이고 태스크가 나중에 등재됐다 — 착수 순서 규칙의 이상형이 아니다. 작성 시점에는 claim이 유효했고(로컬 트리 기준 의존 없음) 그 자격이 병합 시점에 소급 소멸했다. 그 소급 소멸을 하네스가 경고하지 못하는 축은 별도 태스크로 등재했다."
