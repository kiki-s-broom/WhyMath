acceptance:
  - "① 분모 3층을 요약에 낸다 — 스캔 → 판정(mergeStateStatus를 아는 것) → 각 축(auto-merge 켜짐·BEHIND) → 교집합(실제 대상). 기존 요약은 교집합만 내서 0의 의미를 복원할 수 없었다: 분류 루프가 `[ \"$automerge\" != \"on\" ] && continue` · `[ \"$state\" != \"BEHIND\" ] && continue` 두 줄에서 카운터 없이 버렸다."
  - "② 대상이 0건이면 **왜** 0인지 이름을 붙인다 — 네 분기: ⓐauto-merge를 켠 PR이 아예 없다(자동화가 구조적으로 발화 불가) ⓑBEHIND가 없다(정상 대기) ⓒ둘 다 있으나 교집합이 없다 ⓓ판정된 PR이 0건이다(대상 집합을 모른다). ⓐ만 `::notice::`로 annotation에 올린다 — ⓐ는 주기 조정으로 해결되지 않고 운용 관행·설계 변경을 요구하므로 로그 안쪽에 묻히면 안 된다. 나머지는 평문이다."
  - "③ 대조군 — 대상이 있으면 진단 줄은 **나오지 않는다**. 모든 실행에서 나오는 줄은 상태를 가르는 신호가 아니라 배경이고, 배경은 습관화돼 읽히지 않는다. 계약 테스트가 이 부재를 단언한다."
