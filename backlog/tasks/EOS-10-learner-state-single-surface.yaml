  - "① 단일 조회 표면 신설 — LearnerState를 한 번에 돌려주는 학생 표면을 만든다. 현행은 조각 3개(`GET /v1/me/mastery/current`·`/v1/me/ability`·`/v1/me/diagnosis/summary`)로 분산돼 있고 합성 표면이 0건이다(계획서 §12 12종 중 유일한 미대응).\n② 결손 3필드 보강 — `l2/learner_state.py:53` LearnerState v0는 8필드이나 `curriculum_id`·`current_objective_id`·`skill_mastery{}`가 없다. 스킬 축은 `l2/skill_mastery_tracking.py`에 분리돼 있으므로 **재계산이 아니라 조립**으로 합친다(두 번째 진실 원천 금지).\n③ 좌석 판정 별항(정본화≠집행) — 정본이 배정한 좌석 테이블 `user_state_snapshot`(`db/models/user.py:294`)은 **writer 0**이다. 이 표면이 그 좌석을 쓰는지, 아니면 조립 즉시 계산인지 명시한다. 안 쓸 거면 좌석을 폐기 판정한다(EOS-72 \"배선 또는 폐기\" 선례 동형).\n④ 소비처 확장 실측 — 현재 `get_state()` 소비처는 `api/study.py:173` 1곳뿐이다. 이 태스크 후 소비처가 몇 곳이 되는지 적는다. \"표면을 만들었다\"와 \"무언가가 그것을 쓴다\"는 다르다.\n⑤ 교체 가능성을 타입으로 — 반환 스키마는 나중에 BKT/DKT/IRT가 채워도 형태가 유지되도록 **증거·추정치를 필드로 분리**한다. 주석이 아니라 타입으로 표현한다(계획서 §2)."
