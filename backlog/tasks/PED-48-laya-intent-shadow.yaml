  - "② 섀도 어댑터 — 학생 발화를 laya-serve(/v1/systemone)에 보내 6종 의도·개인정보 확률을 받는 비차단 관측 모듈. 본류(코칭 결정·응답·DB 적재)를 어떤 경우에도 바꾸지 않는다(반환 None·예외 흡수). 흡수한 예외는 예외 타입명을 로그에 남긴다(침묵 실패 금지). 타임아웃 필수. 학생 원문은 로그·레코드 어디에도 남기지 않는다(미성년자 채팅 평문 저장 금지)"
  - "③ 구조화 관측 레코드 — 별도 record 로거로 1턴 1레코드: 규칙 분류기 의도(classify_student_intent 결과)·Laya 의도·answer_confidence·개인정보 확률·라우팅 모델명·지연 ms·실패 시 실패 타입. 세션·턴 식별자는 기존 관측 선례(step_shadow)의 범위를 따른다. 원문·원문 해시 미포함을 테스트로 동결"
  - "④ 집행 지점(정본화와 별항) — api/coach.py의 학생 턴 적재 2곳(classify_student_intent 호출부)이 실제로 섀도를 부르는지 서빙 경로 테스트로 동결. 섀도 지연이 학생 응답 지연에 더해지지 않게 응답 후 실행(백그라운드)되는지도 동결"
  - "⑤ 실패 주입 — 꺼짐·URL 없음·키 없음·타임아웃·연결 거부·401·5xx·잘못된 JSON 각각에서 본류 응답이 바이트 동일하고 실패 타입이 기록되는지 픽스처로 검증. 성공 대조군 포함. 뮤테이션으로 가드 절마다 RED 확인"
  - "⑥ 범위 밖(명시) — StudentIntent 5종 enum·DB 스키마·교수 결정 로직 변경 없음. Laya 판단으로 학생 노출·저장 값을 바꾸는 승격은 파일럿 일치도 측정 뒤 별도 태스크·Kiki 결정. 개인정보 감지는 보조 관측 신호일 뿐 PII 보호 절차를 대체하지 않는다(법령 유래 절차 기계 대체 금지)"
