notes: "재발방지대책(CLAUDE.md 실수 관리 의무). 사고 경위: 2026-09-08 \"머지 경합 해소\" 안내에서 `G-merge-queue-or-strict-relax`의 title을 그대로 인용해 이미 cleared·재판정된 결정을 사용자에게 다시 물었다(evidence를 먼저 읽었다면 나지 않았을 왕복). 같은 세션에서 `G-pr-auto-resync-token`도 main 기준 pending만 보고 \"미발급\"으로 판정할 뻔했으나, 이번엔 \"trunk 부재를 미구현으로 단정 금지\" 규칙을 스스로 적용해(미머지 브랜치 실측) 사전에 잡았다 — 그 규칙이 이미 커버하는 축이라 별항 등재는 하지 않는다. 이 태스크는 오직 \"title만 읽고 evidence를 안 읽는\" 축을 겨냥한다. 도구가 title 옆에 evidence를 강제로 보여주면, 안내자가 그 규율을 몰라도 낡은 title에 낚이지 않는다 — HARN-86(전이 거부가 해소 경로를 안 알려주던 결함)과 같은 형태의 \"도구 쪽 대책\"이다.\n\n[정정 2026-09-10] Codex P2×2(PR #1066) 수용 — ③이 notes 저장 게이트(waive)를 못 보고 ④가 앞부분 절단으로 핵심 문구를 잘라낼 수 있음을 지적. 둘 다 실측 재현 후 acceptance에 정정 반영"
