acceptance:
  - "① per-learner 시계열 조회 신설 — 한 학생의 학습 과정을 시간순으로 재구성하는 표면(또는 리포트)을 만든다. 계획서 §17 예시 형태: `diagnostic_started` → `learner_state_created` → `concept_selected` → `content_viewed` → `problem_attempted` → `assessment_failed` → `misconception_detected` → `mastery_updated(0.54→0.43)` → `recommendation_generated`.\n② 적재는 이미 충족 — 신규 이벤트 타입·신규 테이블을 만들지 않는다. `db/models/activity.py:311 AttemptEvent`(hypertable)와 `schema/enums.py:1223-1262` EventType 11종, `schema/event_data_contract.py`가 이미 있다. 이 태스크는 **읽기 축**이다.\n③ 부재 근거의 범위 — 현행 소비처는 집계 롤업(`l2/learning_metrics_rollup.py:301`)·기록률 리포트(`harness/attempt_skill_event_reach_report.py:149`)·`harness/wh1_evaluation.py`뿐이며 전부 **집계**다. per-learner 시계열 조회는 내가 찾은 방법으로는 0건이다(검색어 trace/timeline/시간순/이력/chronolog × 인덱스+docs+api, 역할 \"학생 단위 이벤트 조회\", 소비자 역추적 AttemptEvent import처 전수).\n④ 미성년 PII 경계 — 학습 이벤트 열람은 학생 본인 스코프를 기본값으로 한다. 운영자·교사 열람은 이 태스크 범위 밖이며 별건(`ADMIN-05` 계열)에 둔다. 학생 원문 답안·수식은 트레이스에 싣지 않는다(DP-02 payload allowlist 준수).\n⑤ 휴면 EventType 고지 — EventType 11종 중 생산 6종·휴면 5종이다. 트레이스가 휴면 타입을 \"없음\"으로 표기하는지 \"미생산\"으로 표기하는지 구분한다. 미측정이 무활동으로 읽히면 안 된다."
