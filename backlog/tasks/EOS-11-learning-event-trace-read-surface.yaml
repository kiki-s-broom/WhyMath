notes: "출처: 계획서 300 §4 작업2(Attempt Event) + §17(Event Trace — \"매우 중요한 추가 항목\") — 대조표 §4 단위3. 분류(§14): LOOP.\n\n실측(판정 기준 main 2e1220b4): 이벤트 **적재**는 충족(S3-16·EOS-57·DP-02·EOS-48 done). 빠진 것은 **읽기 축**이다. 인접 todo 3건(DP-03 멱등성·DP-04 계약 거버넌스·S4-22 신호 소비 배선)은 전부 적재·계약 축이라 per-learner 시계열 조회를 소유하지 않는다.\n\n주의: EOS-63(attempt_skill_event 소비 전환)은 다른 세션이 claim 중이므로 이 태스크와 파일이 겹치면 조율이 필요하다.\n\n착수 전제: 2026-09-03 Kiki 결정(선언 §1.3) 갱신.\n\n[정정 2026-09-16] paths ['src/backend/whymath_backend/l2/*event*.py', 'src/backend/whymath_backend/ops/*trace*.py'] → ['src/backend/whymath_backend/l2/*event*.py', 'src/backend/whymath_backend/ops/*trace*.py', 'src/backend/whymath_backend/api/me.py', 'tests/backend/l2/test_learning_event_trace.py', 'tests/backend/api/test_me_learning_trace.py']: 읽기 표면이 api/me.py의 GET /v1/me/learning-trace로 착지하고 테스트가 tests/backend/l2·api에 생기는데, 등재 당시 paths가 l2/*event*.py·ops/*trace*.py만 덮고 있었다. paths는 병렬 세션 겹침 탐지의 유일한 입력이라 좁으면 미탐이 되므로(CLAUDE.md), 실제로 건드린 범위를 실측에 맞춰 넓힌다."
