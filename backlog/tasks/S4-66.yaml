acceptance:
  - "설계서 docs/architecture/verifier_v2_domains.md §5를 구현한다 — l3/sequence_induction.py 신설: DSL 파서(§5.4)·정확 산술 평가기·질의 a(N)/S(N)/terms(N)/closed(식, upto=M). 평가기는 fractions.Fraction/int + ast 화이트리스트 노드만 허용하며 eval·sympify를 쓰지 않는다. 자원 상한(단계 수 N<=1000, 항 비트 길이<=65536, 거듭제곱 지수<=64, AST 노드<=64) 초과는 fail이 아니라 unverifiable(사유 명시)이다 — 제곱 점화 a(n+1)=a(n)^2는 a1=2에서 n=17에 비트 길이 한도를 넘으므로 상한은 가상의 위험이 아니다."
  - "답 비교는 정확 일치(==)만 쓰고 math.isclose를 쓰지 않는다. 회귀 테스트로 a(n+1)=2*a(n)+1, a(1)=1에서 a(30)=1073741823에 정답+1(1073741824)을 주면 fail임을 고정한다 — 같은 값을 isclose(rel_tol=1e-9)로 비교하면 통과하는 케이스(설계서 §6.1 실측표)이므로 비교 방식이 바뀌었다는 변별력 증거가 된다."
  - "l3/verifier.py에 sequence_induction을 등록한다(_VERIFIERS_V2)과 동시에 전용 교차검증 관점 K=3(sequence_reconstruction/sequence_falsification/sequence_grounding)을 _CROSS_VERIFY_PERSPECTIVES에 명시 등록한다 — 확률 관점 기본값 폴백에 기대지 않는다. 관점 1은 가시 필드를 question_text 하나로 제한해 발문에서 점화식을 스스로 읽게 하고 판정은 기계가 Fraction 정확 일치로 한다. 프롬프트 자산 6개를 docs/prompts/l3_cross_verify.md 정본에 추가하고 prompt_asset_audit를 통과한다."
  - "_DomainResult와 ResidueSubject에 후행 기본값 필드 machine_value_exact(문자열, 기본 빈 문자열)를 추가하고 tier 선택 필드(기본 None)를 추가한다 — 기존 생성처가 전부 키워드 인자이므로 소스 호환이다. 기존 테스트 무변경 통과로 하위호환을 증명한다. 어댑터 계약(ProblemVerifyInput 5필드·ProblemValidation 4필드)은 바꾸지 않는다."
  - "신규 answer_kind 소비 지점을 같은 슬라이스에서 맞춘다: harness/qa_pipeline.py의 _NON_EQUATION_DSL_ANSWER_KINDS에 sequence_induction 추가, scripts/analysis/eos_core_adapter_boundary_scan.py에 l3.sequence_induction ADAPTER 분류, scripts/analysis/eos_feature_inventory_v2.py 귀속. 이 셋은 pytest가 아니라 CI infra-contracts 잡이 검사하므로 그 잡을 로컬에서 재현해 exit code로 보고한다."
  - "inductive_sequence_skeleton_generator의 _InductiveSkeleton(kind·first·step·term)을 DSL 문자열로 직렬화하는 함수를 추가하고, [12대수03-06] 코퍼스 30건(problem_bank_generated_v0)에 대해 발문의 점화식을 실제로 실행한 값과 verify.conditions의 폐형식 값을 대조해 불일치 건수를 보고한다(0건이어도 0건이라고 명시). 코퍼스 레코드 재기록과 tier 각인은 이 태스크에서 하지 않는다 — populate의 tier 값 동기가 선행이며 그것은 answer_kind v2 소비 지점 정합 태스크 소관이다."
  - "보호 장치 주입 검증: 초기항 오류·점화식 계수 오류·인덱스 시작점 오류·홀짝 분기 반전을 각각 주입해 해당 축이 RED로 변하는지 확인하고, 주입이 실제 적용됐는지(mutated != original)와 원복이 바이트 동일한지를 단언한다. ruff·black·mypy --strict·lint-imports를 exit code로 보고하고 CI 잡 목록 전수(backend·infra-contracts 포함)를 재현한 뒤 PR을 생성한다."
