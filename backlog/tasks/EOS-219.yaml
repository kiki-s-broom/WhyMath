acceptance:
  - "① Windows 팝업 판정 창(tkinter): EOS-210 맹검 세션과 같은 작업 목록·같은 기록 계약(hint_verdicts.jsonl append 전용·지문)으로 판정을 기록한다. 버튼 누설/누설 아님/건너뛰기/종료, 근거 입력란, 진행 수 표시. tkinter 없는 환경에서는 import 시점이 아니라 실행 시점에 명확한 오류로 멈춘다.\n② 힌트별 AI 권고 파일(data/runs/<회차>-review/hint_ai_recommendations.jsonl): hint_id·권고(leak|no_leak)·이유·작성자·작성 시각. 창은 권고를 판정 화면에 표시한다.\n③ 보조 판정 표기: 권고를 본 판정은 기록에 그 사실이 남는다(판정 행의 표기 필드 또는 근거 접두). 측정기 출력·결과 문서가 이 판정이 맹검이 아니라 AI 권고 참조 판정임을 숨기지 않는다.\n④ 논리층(작업 목록 구성·기록 쓰기·권고 결합)은 tkinter 없이 테스트한다. 권고 파일의 hint_id가 작업 목록에 없거나 형식이 틀리면 거부한다.\n⑤ 런북: Kiki PC에서 판정용 별도 워크트리로 실행하는 블록(공유 클론 브랜치 전환 사고 회피)과 6항목 브리핑."
  - "[정정 2026-10-30 · 헌법 R19-01 충돌 해소 — Kiki 선택: 지시를 헌법에 맞게 변경] ②·③을 다음으로 대체한다. ②' AI 권고는 판정 입력 전에 화면에 내지 않는다. 판정 전에는 '무엇이 누설인가' 기준표만 표시한다. 판정이 기록 파일에 append된 직후에만 그 힌트의 AI 권고를 보여 주고, 사람 판정과 다르면 불일치로 표시한다. 권고는 판정 행에 쓰지 않고 별도 파일(hint_ai_recommendations.jsonl)에만 둔다. ③' 판정 행은 맹검 판정 그대로다(권고 공개 전에 기록됨). 공개 후 같은 창에서 재판정하는 경로는 두지 않는다(재판정은 맹검이 아니므로 기존 --rejudge 경로와 그 표기 규칙을 따른다). 세션 끝에 사람-AI 불일치 목록(hint_id·사람·AI)을 출력·파일로 남긴다. 집행: 권고 표시 함수가 기록 성공 이후에만 호출됨을 테스트로 동결한다(기록 실패·건너뛰기 시 권고 비공개)."
