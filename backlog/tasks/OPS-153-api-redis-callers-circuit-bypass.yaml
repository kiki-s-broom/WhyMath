notes: |-
  출처: OPS-149 acceptance ④ 판정(2026-10-18, 코드를 읽어 확인). 확인 전에는 지는지 몰랐고, 읽은 결과 두 곳 모두 같은 비용을 진다.

  [실측: 코드 읽기] Redis 가 죽으면 소켓 타임아웃(redis_socket_timeout_s 기본 2.0초)이 지난 뒤에야 예외가 잡히고 폴백한다. 두 곳 모두 우회 장치가 없어 요청마다 같은 대기를 되풀이한다.
  - api/_device_store.py CachedDeviceStore.verify: 캐시 get 1회(최대 2초) → DB 위임 → 성공이면 setex 1회(최대 2초) = 요청당 최대 약 4초. 디바이스 서명 검증은 보호 엔드포인트마다 거치는 경로다.
  - api/_rate_limit.py RedisBackend: hit/hit_both/hit_many 가 Redis 호출 1회(최대 2초) 후 예외를 잡아 인메모리 폴백 — 코치 요청 앞단이다.
  - 반대로 revoke 의 _cache_invalidate 는 강등을 의도적으로 금지한다(예외 전파) — 우회 대상에서 제외해야 한다.

  [왜 OPS-149 에 포함하지 않았나] 보안 인접 경로(디바이스 서명·요청 제한)를 건드려 리뷰·위험 축이 다르고, 폴백 의미론이 서로 다르다(캐시는 미스, rate limit 은 인메모리 폴백, 디바이스는 DB 직행, 무효화는 전파). OPS-149 의 L3 캐시 우회만으로 WH-1 한 턴의 캐시 대기 94~95% 는 닫힌다.

  [정직한 공백] 이 두 소비처의 Redis 없음 실측 수치는 아직 없다 — 위 대기는 코드와 OPS-146 의 연산당 2,016ms 로부터의 추정이다. 운영 구성(docker-compose.prod.yml)에서 Redis 가 죽는 빈도도 이 판정이 말하지 않는다.
