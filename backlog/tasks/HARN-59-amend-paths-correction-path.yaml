notes: "발견 경위: PR #970 codex P2. OPS-53에 acceptance ④로 'scripts/harness 편입'을 적었으나 paths는 src/backend/.../harness·ops와 tests/backend/**뿐이라, 그 태스크를 claim한 세션이 scripts/harness를 편집하면 scope drift 경고가 나고 겹침 검사도 그 파일을 예약하지 못한다. amend가 acceptance·gate·track·depends·priority·eos-priority는 고칠 수 있는데 paths만 경로가 없다 — HARN-24(acceptance)·HARN-49(track)·HARN-52(depends/priority)가 각각 같은 이유로 열렸던 것의 마지막 구멍이다. 일반형: 정정 경로가 없는 필드는 등재 시점의 오류가 영구화된다.\n\n[정정 2026-09-07] paths ['scripts/harness/backlog.py', 'tests/harness/test_amend_paths.py'] → ['scripts/harness/backlog.py', 'tests/harness/test_amend_cli.py', 'tests/infra/test_test_suite_wiring.py']: 구현 의미를 대장에 반영하고 존재하지 않는 테스트 파일 경로를 실제 파일로 교체"
