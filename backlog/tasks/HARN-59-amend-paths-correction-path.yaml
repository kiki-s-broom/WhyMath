id: HARN-59-amend-paths-correction-path
title: "amend에 paths 정정 경로 신설 — 범위 확장이 acceptance에만 남고 겹침 검사·scope drift에 반영되지 않는다"
track: infra-debt
stage: S3
subject: cross
layer: infra
status: done
priority: 2
eos_priority: P1
owner: claude
depends_on: []
requires_gates: []
acceptance:
  - "① amend --path 신설 — 기존 --acceptance/--gate/--depends와 같은 append 규약(제거는 열지 않는다). paths는 겹침 검사(_check_path_overlap)·scope drift(check-edit)·가시성 고지의 입력이므로 acceptance 문구로는 대체되지 않는다"
  - "② 변별력 양방향 — 확장 전에는 그 경로 편집이 scope drift로 잡히고, 확장 후에는 잡히지 않는지 실측한다. 한쪽만 보면 '항상 통과'가 그대로 통과한다"
  - "③ 배선 확인 — 신규 테스트가 CI(tests/harness 잡)에서 실제로 실행되는지 tests/infra 계약으로 대조. 저장소에 존재함 ≠ 돌아감"
  - "④ 소급 정정 — OPS-53의 paths에 scripts/harness/**·tests/harness/**를 부착한다(본 결함의 발견 계기). 다른 태스크의 소급 정정은 범위 밖"
  - "①-정정 (2026-09-07 착지 시) — --path는 append가 아니라 **교체**로 구현됐다. 이유: 이 축의 실사용 절반이 '넓게 잡은 glob을 좁히는 것'인데 append로는 좁힐 방법이 자체가 없다(넓은 패턴이 영구 고정된다). 확장은 기존 목록을 함께 지정해 달성한다 — 실제로 OPS-53 소급 정정을 그 형태로 수행했다(3건 → 5건). 대신 이전 값을 notes에 남겨 '무엇을 왜 바꿨는가'가 사라지지 않게 한다. 제거를 열지 않는다는 ①의 원래 취지는 artifacts 축이 승계한다(append만)"
artifacts:
