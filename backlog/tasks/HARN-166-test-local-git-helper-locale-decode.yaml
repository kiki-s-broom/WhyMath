notes: "출처: EOS-128 4회차(2026-09-23)의 CI 스텝 정합 검증 중 발견. `pytest tests/harness -q`가 3 failed / 970 passed로 끝났고(래퍼 알림은 exit 0이었다 — 「래퍼가 종료 코드를 가리는 축」), 로그를 읽어 발견했다. 수정 전 커밋 알림만 믿었으면 실패 3건을 통과로 보고했다.\n\n[선재 확인 — 실측] 프로브 워크트리를 분기 기준 main 1671b9d4에 만들어 같은 테스트를 돌렸고 **동일하게 3 failed / 2 passed**였다. 즉 이 세션의 대장 변경(게이트·태스크 YAML)이 원인이 아니다. 원인은 로케일 cp949와 테스트-로컬 헬퍼의 인코딩 미지정 조합이다.\n\n[기존 소유자 검색 — 이름이 아니라 역할로] `cp949`·`인코딩`·`디코딩`·`encoding=`·`text=True`·`_run_git`·`subprocess`로 대장 전수 검색. 가장 가까운 셋과의 경계: (가) `HARN-19`(done) — `scripts/harness/*`의 같은 결함을 고쳤고 acceptance ⑥이 \"scripts/ 밖 subprocess 전수 감사는 범위 밖\"으로 **명시 제외**했다 (나) `OPS-53`(todo) — *출력* 축(우리가 stdout/stderr로 인쇄하는 문자열)이라 읽기 축과 다르며, 그 태스크 notes가 두 축을 구분해 적어 두었다 (다) `OPS-44`(done) — 같은 *현상*(\"로컬 스위트 상시 red로 판정 신뢰 훼손·CI는 green\")을 다뤘으나 paths가 `tests/backend/**`라 **harness 표면이 비어 있었다**. 그래서 신규다.\n\n[앞선 오판 재발 방지] 3회차에 `gates amend` 부재를 \"경로 없음\"으로 결론해 HARN-167(구 HARN-162)을 중복 등재한 사고가 있었다(CLI 표면만 보고 대장을 안 봄). 이번에는 등재 전에 역할 검색을 먼저 했다.\n\n[정정 2026-09-24] notes 치환 — 번호 충돌 해소 — 중복 등재 쪽 HARN-162-gates-amend-missing이 HARN-167로 개명됨(main의 HARN-162-ci-mirror-shell-mismatch와 충돌)"
