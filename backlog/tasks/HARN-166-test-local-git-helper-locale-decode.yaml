acceptance:
  - "① 재현 고정 — 한국어 Windows(cp949) 로케일에서 `tests/harness/`가 상시 red인 실패 집합을 전수 실측한다. 이번 실측은 `test_cli.py::TestCheckStop`의 3건(`test_reentry_passes_immediately`·`test_blocks_when_in_progress_task_not_updated`·`test_passes_when_task_updated`)이고, 분기 기준 main 1671b9d4에서 동일하게 3 failed / 2 passed임을 확인했다(회귀 아님). 다른 파일에도 같은 헬퍼 형태가 있는지 전수 스캔한다 — 한 파일만 고치고 \"해소\"라고 말하지 않는다.\n\n② 원인은 *테스트-로컬* 헬퍼다 — `tests/harness/test_cli.py:28`의 `_run_git`이 `subprocess.run(..., capture_output=True, text=True)`로 인코딩을 지정하지 않아, 로케일이 cp949인 환경에서 git이 내는 UTF-8 한글(커밋 요약 등)을 reader 스레드가 디코드하다 `UnicodeDecodeError`를 낸다. **프로젝트 헬퍼(`scripts/harness/*`)는 HARN-19가 이미 고쳤고 그 태스크 acceptance ⑥이 \"scripts/ 밖은 범위 밖\"으로 명시 제외했다** — 그 제외분이 여기다. OPS-53은 *출력(우리가 내는 것)* 축이고 이 축은 *입력(우리가 읽는 것)*이라 겹치지 않는다(그 태스크 notes가 두 축을 구분해 적어 두었다).\n\n③ 왜 위험한가 — 실패가 assertion이 아니라 스레드 예외라 **그 테스트의 목적(Stop 훅이 미갱신 claim을 차단하는가)이 검증되지 않은 채 red로만 남는다**. 게다가 로컬에서 상시 red면 \"로컬 green\" 판정 자체가 불가능해지고, 세션이 이를 \"선재 실패\"로 넘기면 진짜 회귀와 구분되지 않는다(OPS-44가 같은 이유로 등재됐다 — 그 태스크 paths는 `tests/backend/**`라 harness 표면은 비어 있었다). CI는 Linux(UTF-8)라 이 결함을 **구조적으로 볼 수 없다**.\n\n④ 대책은 검사 대상이 아니라 헬퍼다 — 인코딩을 명시(`encoding=\"utf-8\", errors=...`)하거나 저장소 표준 헬퍼를 쓰게 통일한다. 새 규칙 산문을 만들지 않는다.\n\n⑤ 변별력(양방향) — 로케일을 cp949로 강제한 서브프로세스에서 수정 전 red·수정 후 green을 양쪽 실측한다. 성공/실패에서 같은 값을 내는 검사는 위장이다.\n\n⑥ 배선 확인 — 신설/수정 테스트가 실제로 CI `harness-integrity` 잡에서 실행되는지 대조한다(저장소에 존재함 ≠ 돌아감). CI는 Linux라 로케일 실패가 재현되지 않으므로, 로케일 강제는 테스트 안에서 *명시적으로* 해야 한다.\n\n⑦ 완료 판정 — 한국어 Windows 로케일에서 `tests/harness`가 상시 red 0건이고, 그 사실이 ⑤의 양방향 실측으로 뒷받침된다."
