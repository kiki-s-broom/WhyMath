notes: "ADMIN-09 대장(data/collection_inventory.json, 판정 기준 main 8a5ea4d1, 2026-10-08)이 처음으로 기계에 드러낸 불일치다. 재현: 그 파일의 columns에서 state 값을 센다 — collected_unconsumed 9건. 대장 이전에는 이 불일치를 볼 수 없었다(pipa_data_matrix.md §3.2가 고지를 명령하는 수집 항목 목록의 진실 원천이 없었다). 관측(기계 미강제): Flutter 온보딩이 실제로 보내는 필드는 target_grade·target_score·target_exam_date·birth_year 4개뿐이라 9컬럼은 '열려 있으나 어느 클라이언트도 보내지 않는' 상태일 가능성이 높다 — 폐쇄의 실사용 영향은 작을 것으로 추정하나 prod DB 비영 행 확인은 이 세션이 못 했다(ADMIN-02의 G-prod-dead-column-check와 같은 접근 경로 문제). 이 태스크는 ADMIN-09의 대장을 입력으로 쓰므로 depends_on으로 건다."
