notes: "발견 경위: PR #1375(HARN-130·179·170) 병합 검증 중, `store.load_backlog(Path(\"backlog\"))`가 게이트 0건을 돌려주는 것을 보고 같은 형태의 호출처를 확인했다. 실측(main `0f05876b` 병합 후 트리): 리포트 함수 `_broken_dependency_count()` 직접 호출 결과 measured=True · value=8. 올바른 루트로 읽으면 태스크 940건 · 위반 0건. 8건은 소프트 분류표가 가리키는 태스크 8개가 '백로그에 없다'는 판정이다(태스크를 0건으로 읽었기 때문). 로더는 'backlog/tracks.yaml 없음 (seed 미실행?)' 오류를 냈지만 `_errors`로 버려졌다. 같은 이유로 진짜 위반이 생겨도 값은 그대로 8이다 — 오경보이자 무변별. 도입 커밋은 얕은 클론이라 미확정(파일은 EOS-08 #1175로 신설). 등급은 리포터 EOS-08과 같은 P2로 두었다 — 재판정은 amend --eos-priority."
