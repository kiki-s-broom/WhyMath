  - "④-b [PR #1034 Codex P1 수용 2026-09-07] ④의 '새 임계·새 게이트 0'은 유지하되, 기존 게이트 ② low_quality 플래그의 *집행 지점*을 영속 계층에 추가 — 풀이 합류로 노이즈 전사의 우연 매칭이 가설 편입·+1 지지·−1 반박으로 즉시 영속되는 경로가 열렸기 때문(응답 플래그는 DB 쓰기를 되돌리지 못함). low_quality면 세션/턴 핸들러가 빈 매칭으로 큐레이션(중립 텍스트 턴과 동일)하고 반박 호출을 보류. 응답의 후보·match_low_quality·개입 결정은 불변(⑤ intervene 불변 준수). 정본화≠집행 규칙의 게이트 ② 적용"
