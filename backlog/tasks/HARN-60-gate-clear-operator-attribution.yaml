notes: "발견 경위: PR #971 codex P1. Kiki가 서명한 clear 커밋(363d437d · Author: kiki)을 스쿼시 머지하면 저자가 머지 수행자로 바뀌고, 브랜치 ref가 자동 삭제되면 '에이전트가 아니라 사람이 clear했다'는 증거가 복원 불가능해진다. 실측: 이벤트 대장은 actor를 브랜치명('main')으로 기록해 사람 신원을 담지 않는다. 저장소 정책상 merge commit·rebase가 모두 금지(405)라 스쿼시 외 선택지가 없으므로, 증거는 git 메타데이터가 아니라 **대장 데이터**에 있어야 한다. 준수 감사 A3(에이전트의 사람 게이트 clear = 심각도 높음)이 실재하는데 그 준수를 사후 증명할 채널이 취약하다는 것이 이 태스크의 요점이다."
