acceptance:
  - "① 승계 근거(2026-10-06 · 판정 `docs/reviews/eos39_app_help_completion_selection_judgment_2026-10-06.md` §4-4): EOS-39는 도움 접기가 만든 전부 실패에만 하한 사다리를 쓰고 **실제 오답만 있는 이력의 하한(−4.0)은 바꾸지 않았다.** R3(오개념 교정)는 `purpose=learning`으로 학습 밴드(정답확률 0.70~0.85)를 쓰고 그 가중(`recommendation_policy._combine_axes`의 `learning_band_weight(theta, item)`)이 **선택 θ를 읽는다** — 하한 대칭은 R3의 문항 선택을 바꾼다(독립 비판의 저장소 실물 함수 재현: 첫 실패 b=+1.5 · 12문항 개념 풀에서 현행 b=−2.0(3.5 로짓 쉬움) → 대칭 b=−0.91(2.4 로짓 쉬움 · 밴드 안)). 이 태스크가 EOS-39 acceptance ⑦의 남은 반쪽을 소유한다."
  - "② 프로브 선행(판정보다 먼저): 실제 오답만 있는 이력(앱 EOS-146 적재 · 도움 접기와 무관)에서 R3·R6가 현행 하한(−4.0)으로 **무엇을 고르는지**를 실 정책 함수로 고정하는 테스트를 만든다. EOS-39 프로토타입 실측으로 EOS-24·3루프·EOS-26(단위+통합) 기존 테스트가 하한 동작을 계약으로 **잡지 못한다**는 것이 확인돼 있다(\"깨지지 않았으니 안전하다\"가 근거가 못 된다). 이 프로브가 R3·R6 기준선의 첫 동결이다. 변별력은 하한을 사다리로 바꾸는 주입이 RED가 되는 것으로 확인한다."
  - "③ 판정: 하한 대칭(실패한 최저 난이도 − 0.5 사다리)을 실제 오답 이력에도 쓸지, R3·R6의 학습 밴드 가중만 선택 θ와 분리할지, 현행을 유지할지를 ②의 프로브 수치로 정한다. 바꾸면 R3·R6 변형 `policy_version`을 다시 올린다(REC-11). 오개념 교정의 문항 선택이 바뀌므로 EOS-24가 판정한 경로의 재판정이며 교수학 독립 비판 1회를 받는다."
