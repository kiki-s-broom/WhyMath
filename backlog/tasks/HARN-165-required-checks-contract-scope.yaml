# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-165-required-checks-contract-scope
title: "required 여부 판단 강제 계약이 ci.yml 한 파일만 본다 — 워크플로 파일을 새로 만들면 판단 자체가 발생하지 않는다"
track: infra-debt
stage: S3
