acceptance:
  - "① 범위 실측 — .github/workflows/*.yml 전건을 파싱해 PR에서 실행되는 잡(on: pull_request)을 전수 열거하고, 그중 required 목록에도 _INTENTIONAL_EXCLUSIONS에도 없는 잡을 지목한다. 스캔 0건은 실패(공허한 통과 금지)."
  - "② 계약 확장 — tests/infra/test_required_checks_doc.py의 _ci_job_names()가 ci.yml 단일 파일이 아니라 PR 트리거 워크플로 전건을 읽게 한다. 확장으로 새로 unaccounted가 되는 잡은 required 등재 또는 사유 있는 제외 중 하나로 판정한다."
  - "③ 결함 주입 — PR 트리거 워크플로 파일을 하나 새로 추가한 상태를 주입해 테스트가 RED가 되는지 확인하고(그 잡 이름을 지목하는가), 등재 후 GREEN이 되는지 확인한다. 주입 적용·바이트 동일 원복을 단언한다."
