notes: "S3-02(done)의 잔여 트리거 ③ = \"자연 자유사용 15~30분 대표측정\"(docs/strategy/s3_pilot_briefing.md·2026-07-28 사전등록 판정문). 이 태스크는 그 측정을 *실행 가능·판정 가능*하게 만드는 준비분이다 — 측정 자체는 Kiki 실기기 회차(게이트).\n\n착수 근거(실측 2026-09-22): 사전등록 판정문이 요구하는 세 값 중 둘을 현행 도구가 낼 수 없다.\n  - V3(등호 방정식 변형 턴 >=5건): shadow 관측 레코드(wh1_shadow.py)는 프라이버시 설계상 비식별 요약만 담아 등식 형태 축이 없다. 사람이 자유사용 중에 손으로 세면 \"자연 자유사용\"이 오염된다(대본 금지 전제 위반) — 그래서 기계 집계가 방법론적으로도 옳다.\n  - 회차 분리: wh1_shadow_harvest는 원장 전체 기준으로만 집계하고 시간 필터가 없다. 2026-07-19 합성 60제출(eq 24/24 correct)이 그대로 분모에 남아 있어, 그 원장으로 판정하면 이번 회차와 무관하게 통과가 나온다(거짓 green).\n  - 모집단: 리포트의 unverifiable 비율은 none(verify 미호출) 포함 분모라 사전등록 모집단과 다르다 — 화면 숫자를 그대로 읽으면 오판한다.\n판정 기준은 사전등록분 그대로 두고(사후 이동 금지) 측정 가능성만 복원한다."
