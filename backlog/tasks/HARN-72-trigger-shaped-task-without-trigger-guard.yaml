notes: "출처: PR #999 Codex P1. CLAUDE.md '실수 관리 — 반복 실수(동일 유형 2회 이상)는 재발방지대책 등재가 의무'의 집행. 대책은 '다음엔 조심한다'가 아니라 규칙·코드·태스크 중 하나여야 하므로 코드 축으로 등재한다.\\n\\n인접 구분: HARN-52(audit-deps)는 **notes에 적힌 선행**이 depends_on에 집행됐는지를 본다. 이 태스크는 **acceptance에 적힌 미래 트리거**가 requires_gates·depends_on에 집행됐는지를 본다 — 같은 '산문↔집행' 축이지만 필드가 다르다. 확장으로 될 일이면 audit-deps를 확장하고, 안 되면 사유를 적는다(새 장치 남발 금지).\n\n[정정 2026-09-06] [트리거 면제] 이 태스크가 검출기 자신이라 acceptance ①·②가 탐지 대상 어구('~가 생기면 재측정' 등)를 **예시로 인용**한다. 대기 태스크가 아니라 트리거 장치를 *만드는* 태스크이므로 게이트를 붙일 대상이 없다 — 검출기의 첫 실사용 오탐 사례이자 탈출구가 필요한 근거 그 자체"
