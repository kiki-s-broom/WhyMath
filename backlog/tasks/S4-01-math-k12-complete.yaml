notes: "대학과정 포함 — 개념 그래프는 학년 무관(Curriculum-as-Overlay). 문제은행 축 연계(2026-07-29, problem_bank_gap_review.md §3): ARCH-18 커버리지 리포트가 저작 우선순위 입력(D4), S4-13 SymPy 불가 영역 경로가 확률·기하 확장 선결(D7) [2026-08-11 과목/학교급 완비 점검 승계] acceptance의 '초·중·고+대학 4축 활성'은 노드 존재만으로 충족 판정될 수 있다 — 대학 축 실측 하한: 원자 1,069(32과목) 존재하나 대학 코드 참조 문항 0/2,638 · 고등→대학 엣지 0 · 대학 내부 481엣지가 같은 과목 479/과목 간 2로 사실상 32개 고립 사슬. K-12 축은 0문 4과목(2수·12경수·12실통·12수과)·초3~4 2.1%. 근거: docs/architecture/subject_content_coverage_gap_review.md §8 · docs/data/problem_bank_coverage_2026-08.md.\n\n[정정 2026-09-01] eos_priority null → P2: 판정표 N/이월 — 2027 이월(폐기 아님·선언 §6-5). EOS-80 일괄 백필\n\n[정정 2026-09-22] depends_on 제거 1건: 12/31 내부 콘텐츠 완성 우선 순서 결정(2026-09-22 Kiki 지시) — 파일럿(S3-01)이 내용 완성 이후로 이동했고, 본 태스크는 실학생 응답을 입력으로 소비하지 않는다(스테이지 순서로 상속된 의존). 실응답이 입력인 S4-15만 의존을 유지한다. 로드맵 docs/strategy/status_roadmap_2026-07.md S4절의 파일럿-우선 순서와 의도적으로 상이하며, 근거는 S4-01 실측 커버리지(대학 코드 참조 문항 0/2638·K-12 0문 4과목·초3~4 2.1%) — 이 상태로 파일럿을 돌리면 학생이 풀 문제가 없다.\n\n[정정 2026-09-23] 첫 슬라이스 범위와 남은 범위를 acceptance에 명시. 원문 acceptance가 한 줄(\"초·중·고+대학 4축 활성 + traversal 성능 예산 실부하 통과\")이라 실행 단위가 없어, 이번에 실제로 닫는 것과 닫지 않는 것을 분리해 적는다. 범위를 조용히 좁히지 않기 위함이며, 교육적 타당성 축은 게이트로 분리해 집행한다.\n\n[정정 2026-09-23] 밀도 수치 오류 정정 — 엣지 추가 시 분모도 증가함을 반영(1.99%→1.97%). 서브에이전트 검증이 지적했고 산술로 재확인했다.\n\n[정정 2026-09-23] requires_gates -G-s401-uni-boundary-edge-review: 게이트 오부착 정정 — G-s401-uni-boundary-edge-review 는 승인분을 정본에 병합하는 한 동작만 관할하는데 S4-01 본체에 붙어 있어, 검수와 무관한 나머지 범위(대학 과목 간 32개 고립 사슬·대학 문항 0/2638·K-12 0문 4과목·초3~4 2.1%·traversal 실부하)까지 전부 사람 검수 대기로 막혔다. 12/31 내부 콘텐츠 완성 목표에서 정확히 막으면 안 되는 자리다. 게이트는 신규 S4-60-uni-boundary-edge-merge 로 옮겨 붙였고 그 태스크가 병합 동작을 소유한다.\n\n[정정 2026-09-28] paths ['src/data-pipeline/**', 'data/**', 'docs/data/**', 'tests/data_pipeline/**'] → ['src/data-pipeline/**', 'data/**', 'docs/data/**', 'tests/data_pipeline/**', 'src/backend/whymath_backend/harness/traversal_load_probe.py', 'tests/backend/harness/test_traversal_load_probe.py', 'tests/infra/test_traversal_load_probe_wiring.py', '.github/workflows/ci.yml', 'scripts/analysis/eos_feature_inventory_v2.py']: 슬라이스 2(traversal 실부하) 착수 — 측정 CLI는 backend harness 좌석, 배선은 CI 잡, 인벤토리 귀속 필요\n\n[정정 2026-09-28] paths ['src/data-pipeline/**', 'data/**', 'docs/data/**', 'tests/data_pipeline/**', 'src/backend/whymath_backend/harness/traversal_load_probe.py', 'tests/backend/harness/test_traversal_load_probe.py', 'tests/infra/test_traversal_load_probe_wiring.py', '.github/workflows/ci.yml', 'scripts/analysis/eos_feature_inventory_v2.py'] → ['src/data-pipeline/**', 'data/**', 'docs/data/**', 'tests/data_pipeline/**', 'src/backend/whymath_backend/harness/traversal_load_probe.py', 'tests/backend/harness/test_traversal_load_probe.py', 'tests/infra/test_traversal_load_probe_wiring.py', '.github/workflows/ci.yml', 'scripts/analysis/eos_feature_inventory_v2.py', 'scripts/analysis/data_access_layer_audit.py', 'backlog/jit_index.json']: 데이터 접근 기준선 편입·jit 인덱스 재생성이 범위에 들어온다\n\n[정정 2026-09-28] 슬라이스 2 PR 증적\n\n[정정 2026-10-01] paths ['src/data-pipeline/**', 'data/**', 'docs/data/**', 'tests/data_pipeline/**', 'src/backend/whymath_backend/harness/traversal_load_probe.py', 'tests/backend/harness/test_traversal_load_probe.py', 'tests/infra/test_traversal_load_probe_wiring.py', '.github/workflows/ci.yml', 'scripts/analysis/eos_feature_inventory_v2.py', 'scripts/analysis/data_access_layer_audit.py', 'backlog/jit_index.json'] → ['src/data-pipeline/**', 'data/**', 'docs/data/**', 'tests/data_pipeline/**', 'src/backend/whymath_backend/harness/traversal_load_probe.py', 'tests/backend/harness/test_traversal_load_probe.py', 'tests/infra/test_traversal_load_probe_wiring.py', '.github/workflows/ci.yml', 'scripts/analysis/eos_feature_inventory_v2.py', 'scripts/analysis/data_access_layer_audit.py', 'backlog/jit_index.json', 'data/corpus/atom_graph_v1/inter_course_edges_university_v1.json', 'scripts/build_inter_course_edges_s4_01.py', 'src/data-pipeline/data_pipeline/atom_graph/inter_course_edges.py', 'src/data-pipeline/data_pipeline/atom_graph/cross_band_edges.py', 'tests/data_pipeline/atom_graph/test_inter_course_edges.py', 'docs/data/inter_course_edges_university_v1.md']: 슬라이스 3(대학 과목간 엣지) 착수·산출 — 범위와 남은 범위를 acceptance에 명시, 기존 paths 전부 유지하고 산출 파일 편입\n\n[정정 2026-10-01] 슬라이스 3 PR 증적 기록\n\n[정정 2026-10-08] CUR-06 acceptance ⑤ — 경계 연결 밀도를 명시 완료 항목으로 추가(노드 4축 존재만으로 충족 판정 방지)"
