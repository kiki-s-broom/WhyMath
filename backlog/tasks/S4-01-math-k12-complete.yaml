  - "[슬라이스 2 · 2026-09-28] traversal 성능 예산 실부하 측정 — 남은 범위 ⒟를 닫는다. 착수 시점 실측(원자 백본 2,683노드·2,210엣지를 실 PG에 적재, 전 앵커 전수): 정책 경로(깊이 2·노드 20·시간 2.0초) 선수 탐색 p99 5.5ms, 깊이 2 중복 제거 후 최대 11노드(예산 20 미발동), 깊이 5 최대 55노드(라우트 상한 64 미발동·20 초과 앵커 131), 동시 32요청에서도 최대 약 0.5초. 산출물: ① 판정 CLI whymath_backend.harness.traversal_load_probe — 실 PG에서 전 앵커 × 탐색 형태 3종(정책 선수 깊이 2 · 직접 후행 1-hop · 라우트 선수 깊이 5) × 동시성 수준을 전수 측정하고, 시간 예산 초과 0건 · 결과 집합이 graph.json 구조 전수 계산과 앵커별 일치 · 측정 앵커 수가 코퍼스 노드 수와 일치할 때만 exit 0(측정 불성립 exit 2). 전수 측정이지 표본이 아니므로 Wilson 경계는 해당 없음 ② 구조 전수 계산은 DB 없이도 돌며 제안 엣지 파일을 겹쳐 병합 후 부하를 미리 계산한다(S4-60 병합 판단 입력) ③ PR에서도 도는 backend-migrations 잡(실 PG)에 적재+판정 스텝으로 배선하고 배선 동결 테스트를 둔다 ④ 판정 로직은 결함 주입(시간 초과·결과 불일치·앵커 0건·코퍼스 드리프트) 전건 RED + 정상 대조군 GREEN. 측정 중 발견한 예산 밖 경로(/v1/me/weak-concepts/* 깊이 최대 5·시간 예산 없음, GET /v1/concepts/{id}/edges 행 상한 없음)는 이 슬라이스에서 고치지 않고 별도 태스크로 등재한다 — 현재 규모에서 실측상 안전하다는 것과 예산이 걸려 있다는 것은 다르다."
