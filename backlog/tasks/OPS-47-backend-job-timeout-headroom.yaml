acceptance:
  - "① 실측 고정(2026-08-21·재현 명령 동봉): main push의 backend 잡 성공 11표본은 20.9/28.2/29.4분(최소/중앙/최대)이고 상한은 timeout-minutes:35 → 최대 표본 기준 여유 5.6분(16%)뿐이다. 2026-08-21 커밋 01ff6041에서 이 여유가 실제로 소진돼 Pytest 단계에서 cancelled(=timeout) 발생. 재현: GET /actions/workflows/ci.yml/runs?branch=main&event=push → 각 run의 /jobs에서 backend 잡 started_at→completed_at"
  - "② 상한 재상향은 답이 아님을 전제로 한다 — 이미 25→35로 한 번 올렸고(ci.yml:276-280 주석) 다시 걸렸다. 소요 자체를 줄이는 축을 고른다: ci.yml 주석이 지목한 pytest-xdist 병렬 실행 / 무거운 생성기·게이트 테스트 slow 마크 분리 중 실측으로 효과가 확인된 것만 채택. 여러 축을 동시에 넣지 않는다(어느 것이 들었는지 판정 불가가 된다)"
  - "③ 변별력 양방향: 적용 전후 소요를 같은 방식으로 재고 분포(최대 표본)로 비교한다. 적용 후만 재고 통과 선언 금지. 목표는 '평균이 줄었다'가 아니라 '최대 표본의 여유가 상한의 30% 이상'이다"
  - "④ 커버리지 게이트 불변: --cov-fail-under=70·계층별 floor·Wilson 게이트 9종은 그대로 돌아야 한다. 병렬화로 게이트가 조용히 빠지면 '검증 장치를 만들고 배선 확인 없이 완료 선언 금지'에 걸린다 — 적용 후 게이트 스텝이 실제로 실행되는지 확인"
  - "⑤ 경계 별항(중복 회피): HARN-32 ③이 '완화책 후보 = CI 분할·단축(백엔드 잡이 병목)'을 적어 두었으나 그 태스크의 대상은 *머지 경합*(base 전진·mergeable_state)이다. 이 태스크는 *잡 자체의 시간 여유*를 본다 — 착수 시 HARN-32와 소유 축이 갈리는지 재확인하고, 겹치면 한쪽으로 합친다"
  - "⑥ [재측정 완료 2026-09-10] pytest-xdist 병렬화는 OPS-58(PR #944, 2026-08-31~09-01 착지)이 '-n auto --dist loadfile'로 이미 적용했다(다른 태스크·다른 동기=머지 경합 완화였으나 소요 축을 줄이는 동일 메커니즘). OPS-47은 그 효과가 타임아웃 여유에 실제로 반영됐는지 독립 재측정으로 확인했다. 재현 스크립트: scripts/analysis/measure_backend_job_timeout_headroom.py(신규, ci.yml에서 timeout-minutes를 직접 읽어 하드코딩 회피). 실행: python3 scripts/analysis/measure_backend_job_timeout_headroom.py kiki-s-broom/WhyMath main --n 11. 결과(2026-09-08~09-10 main push 11표본, GET /repos/{owner}/{repo}/actions/workflows/ci.yml/runs?branch=main&event=push): backend 잡 소요 최소/중앙/최대 = 12.7/18.3/19.5분(적용 전 20.9/28.2/29.4분 대비 대폭 축소). 최대 표본 기준 여유 = 35 - 19.53 = 15.47분(44.2%) — 목표 '상한의 30% 이상'을 충족한다.\n⑦ [④ 재확인] 재측정 표본 11건 전부 backend 잡 conclusion=success이고, 잡 스텝 목록에 계층별 커버리지 게이트·결함주입 강등전·선택형단답 채점 강등전·코치 프로즈 유출·앵커 탐지 채널·교수법 팩·비유예시 결함 검출기·표기 커버리지·콘텐츠 출처감사·데이터 등급 라우팅·라우터 우회 결정·L3 프롬프트 레일 게이트가 전 표본에서 정상 실행·통과했다(--cov-fail-under=70 포함 Pytest 스텝이 게이트들보다 먼저 완주). 병렬화로 게이트가 빠지지 않았음을 확인.\n⑧ [⑤ 재확인] HARN-32는 필수 상태 체크(브랜치 보호 up-to-date 요구) 기준 머지 경합 축을 다루고(⑦ 실측 — strict policy 확정, PR #916), backend 잡은 애초에 필수 체크 목록에 없다(HARN-32 ⑧). 이 태스크는 backend 잡 자체의 타임아웃 상한 대비 여유를 다룬다 — 축이 겹치지 않음을 재확인. ci.yml 주석(backend 잡 timeout-minutes 위)을 재측정 수치로 갱신했다."
