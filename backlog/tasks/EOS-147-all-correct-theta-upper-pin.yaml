acceptance:
  - "① 실측 사실(2026-09-26 · 실 PG 컨테이너 재현) — 첫 응답이 정답뿐인 학습자는 다음 `GET /v1/me/next-problem`에서 `theta=4.0`을 받고, 추천이 은행의 가장 어려운 문항(재현 픽스처에서 난이도 4.8)으로 간다. 원인: `l2/irt.py::estimate_ability`는 전부 정답이면 MLE 발산을 상한(`_THETA_UPPER = 4.0`)으로 돌려주고, 후보 정렬(`candidate_pool_order_by`)이 |b−θ| 최근접이다. 오답이 하나라도 기록돼야 θ가 유한하게 내려온다.\n② 앱 학생에게는 영구적이다 — 앱의 응답 기록은 코치 정답 완료(`api/coach.py::_complete_problem` · `is_correct=True`)뿐이라 오답이 기록되지 않는다(EOS-146). 첫 완료 이후 모든 추천이 가장 어려운 남은 문항이 된다(코드 경로 · 앱 실측 아님). API 클라이언트도 초반 연속 정답 구간에서 같은 도약을 겪는다.\n③ 처분 판정 선행 — 초기 구간 추정(예: 사전분포를 둔 추정·단계 크기 제한)·상한 도달 시 선택 규칙 중 무엇을 쓸지 정한다. θ 추정기는 평가 캡처(ASM-03)와 공유되므로(`load_attempt_history_state` 단일 진실 원천) 두 소비처의 영향을 함께 판정한다. 결정 없이 추정기를 바꾸지 않는다."
  - "[2026-09-29 처분 기록 — 구현 완료 시점 · 판정문 `docs/reviews/eos147_all_correct_theta_pin_judgment_2026-09-29.md` §10 처분표] ①(재현)과 ③(처분 판정)은 이행했다: 독립 교수학 비판 1회를 반영한 개정 판정문이 추정기 불변 · 추천 표적 분리(후보 C) · 단계 0.5(잠정 · 초안 1.0에서 내림)를 정했고, 구현은 `l2/irt.py::ability_for_selection` · `AttemptHistoryState.selection_theta` · 두 정책의 선택 θ 소비 · 응답 가산 2필드(`selection_theta`·`theta_boundary`) · 처치 기록 키 2종 · 정책 버전 `cat_v4`·`suneung_v2`(`cat_v3`은 병렬 태스크 EOS-33이 쓰는 번호라 건너뜀)다. ②(앱 학생 영구성)는 **해소하지 못했다**: 앱은 코치 정답 완료만 기록하는 개루프라 추천열이 학생 행동과 무관하고, 이 변경은 수정 전 추천열 앞에 사다리 칸 3개를 끼워 \"남은 가장 어려운 문항\" 정체의 시작을 2번째에서 5번째 추천으로 늦출 뿐이다(합성 앱 학생의 독립 성공확률 평균 θ_true=−1/0/+1에서 0.061/0.147/0.312 → 0.068/0.160/0.330 · 방향의 증거이며 운영 수치가 아니다). API 클라이언트의 초반 연속 정답 도약(첫 정답 뒤 난이도 2.9 → 4.8)은 사다리(2.9 → 3.4 → 3.9 → 4.4 → 4.8)로 바뀌어 해소했다. 앱 영구성의 해소는 `EOS-39-app-help-completion-evidence-in-target-selection`(하강 채널 · 꼭대기 이후 처분 · `used_hint` 소비 · 값의 실측 보정 · 발동률 리포트)이 소유한다. 이월·결합: `EOS-40-coach-server-theta-fallback-ungated`(코치 폴백 무게이트 — 재현부터) · `EOS-146-app-wrong-answer-event-source`(하한 비대칭 재판정) · `REC-10-next-problem-honesty-fields-render`(신규 필드는 계측 신호)."
  - "[2026-10-02 정정 — 수능 정책 식별자] 위 2026-09-29 처분 기록과 산출물 줄이 적은 수능 정책 번호 `suneung_v2`는 병합 전에 EOS-31(PR 1418 · 수능 게이트에 출제 범위 조건 추가)이 먼저 써서, 병합이 이 변경의 수능 번호를 `suneung_v3`로 올렸다. `suneung_v2` = EOS-31의 규칙, `suneung_v3` = 그 위에 EOS-147의 선택 θ 분리다. 기본 CAT `cat_v4`는 그대로다. 두 변경이 한 번호를 쓰면 소급 평가가 서로 다른 선택 규칙을 한 정책으로 읽는다(판정문 4-5가 예고한 충돌 — 뒤에 머지되는 쪽이 누적 상태를 가리키는 번호로 푼다). 소스 상수·테스트 리터럴·두 뮤테이션 러너(`mutate_eos147_selection_theta_guards.py`·`mutate_eos31_suneung_scope_guards.py`)의 앵커·판정문·MEMORY.md의 EOS-147 줄을 함께 정정했다."
