acceptance:
  - "① 실측 범위 확정 — 응답 경계에서 미측정(None)을 0.0으로 접는 지점을 전수로 찾는다. 2026-09-16 확인분: api/me.py의 개념 숙달·스킬 숙달 응답이 mastery가 None일 때 0.0을 반환한다(스킬 축도 동형). 역할 기반으로 재검색해 다른 경계도 본다\n② 의미 판정 — 클라이언트가 '아직 측정 안 됨'과 '숙달도 0'을 구분해야 하는지 정한다. 구분이 필요하면 응답 스키마에서 None을 살리고(Optional), 불필요하면 왜 불필요한지 근거를 적는다. L2 계약(EOS-13)은 미측정을 None으로 지키므로, 접는 결정을 유지하더라도 그것이 의도된 표현 계층 결정임을 문서화한다\n③ 클라이언트 영향 — 모바일이 그 필드를 어떻게 읽는지 확인한다. Optional로 바꾸면 Dart 쪽 파싱이 깨질 수 있으므로 계약 변경 범위를 먼저 잰다\n④ 변별력 — 미측정 학습자로 응답을 만들어 '구분 가능'이 실제로 성립하는지 확인한다. 접기를 유지하기로 했다면 그 결정을 회귀 테스트로 동결해 다음 세션이 무심코 뒤집지 못하게 한다"
  - "[이행 기록 2026-09-28 · 판정 기준 main `ed3d14da`] ① 충족 — 응답 경계에서 학습자 숙달의 None을 숫자로 접는 곳은 `api/me.py::submit_attempt`의 `ConceptMasteryUpdate`·`SkillMasteryUpdate` 2모델(`mastery` 0.0 · `sample_size` 0) 4자리뿐이었다. 역할 기반 재검색(백엔드 전역 `else 0`·`or 0`·`coalesce(…, 0)` 113건)의 나머지는 횟수 · 내부 계산 · 학습자 측정이 아닌 영역 · 의도된 표현으로 분류됐다. 읽기 표면(`/v1/me/mastery/current` · `bkt_mastery` · `irt_mastery_proxy` · 추천 근거 `mastery`)은 이미 null 보존. ② 판정 — 스키마를 `float | None`·`int | None`으로 열고 빈 값은 null로 낸다. 갱신 행은 추정기 계약상 값을 가지므로 빈 값은 writer 결함 신호이고, 0.0으로 접으면 거짓 측정 \"숙달 0\"이 된다 — 경고 로그로 드러낸다(값·식별자 미기록). 추천 근거 `confidence` 0.0은 의도된 표현으로 유지(근거 없음 = 신뢰도 0 · 미측정은 `type`·`basis`·`mastery=None`이 말한다)하고 계약 문서 §12에 기록했다. ③ 충족 — 모바일은 `POST /v1/me/attempts`를 부르지 않고 두 필드를 파싱하는 코드가 0건(웹·webapp도 0) · 하네스 프로브는 목록 길이만 센다 → 파손 없음. ④ 충족 — HTTP 수준 null/0.0 구별(개념·스킬 두 축 · 진짜 0.0 대조군) · 스냅샷 읽기 표면 구별 · 경고 로그 테스트 + `api/` 전수 AST 가드. 뮤테이션 15종(구현 7 · 가드 8) 전건 RED."
