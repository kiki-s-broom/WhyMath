acceptance:
  - "① 결함 재현 고정 — `amend --gate`로 requires_gates를 붙인 in_progress 태스크를 `unblock`하면 원격 claim을 release한다(현 동작). 그 게이트 부착이 trunk(origin/main)에 없는 동안 main 기준 selector는 그 태스크를 게이트 없는 착수 가능 후보로 본다. 이 경로를 테스트로 동결한다(수정 전 동작 복원 시 RED)."
  - "② 게이트 대기 홀드 — 게이트 부착으로 claim을 놓을 때 그 부착이 trunk에 아직 없으면 원격 claim을 지우지 않고 게이트 대기 홀드로 바꾼다(HARN-48 `remote_claims.hold()` 재사용 · 레코드에 게이트 ID·브랜치·사유). 부착이 이미 trunk에 있으면 종전대로 release한다(과잉 점유 금지 — 양방향 변별력)."
  - "③ 홀드 해제 지점 — 게이트 부착이 trunk에 착지하면 홀드를 걷는다(`claims reap`·세션 브리핑이 origin/main의 requires_gates를 확인). 걷히지 않으면 영구 점유가 되므로 착지 후 해제를 테스트로 동결한다(HARN-48 ⑦ 양방향 원칙)."
  - "④ 착수 안내 — 다른 세션이 홀드된 태스크를 `start`하면 '게이트 대기 홀드 — 게이트 G-…가 브랜치 X에만 있고 미머지'로 안내하고 거부한다. 차단 홀드(HARN-48)와 문구·종류를 구별한다. 게시 실패는 침묵하지 않는다(stderr + 이벤트 · HARN-48 ⑤와 같은 규율)."
  - "⑤ 변별력 — ①~④ 절마다 그 절을 끊는 뮤테이션을 두고 전건 RED를 확인한다(주입 적용 단언 · 원복 바이트 동일 · HARN-174 러너 재사용)."
