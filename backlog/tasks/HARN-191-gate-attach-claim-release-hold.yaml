title: "게이트를 붙이고 claim을 반납하면 게이트가 미머지 브랜치에만 있어 main 기준으로 태스크가 비어 보인다 — 병렬 세션이 EOS-129·EOS-137을 다시 구현(HARN-48 block 홀드의 amend·unblock 입구)"
