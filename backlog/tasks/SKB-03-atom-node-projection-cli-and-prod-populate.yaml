acceptance:
  - "① 실측 확정: 2026-09-14 G-skb01-concept-behavior-skills-populate 실행(Kiki·Phaiakes9 whymath-pg·main b810388b) 중 concept_atom_crosswalk.populate가 \"atom_node 대상 행 부재 1311건 (예: 10공수1-01-01-1, 10공수1-01-01-2, 10공수1-01-01-3)\"을 보고했다 — atom_node.behavior_skills 갱신 0건. 같은 실행에서 concept 축은 1311/1311 전건 매칭됐으므로 code 키 자체는 정상이고 atom_node 테이블에 그 행들이 없다는 뜻이다. 착수 시 atom_node 전체 행수를 직접 실측해 \"1311개 code 부재\"인지 \"테이블 전량 공백\"인지 범위를 확정한다(이 등재 시점에는 전자만 확인됨).\n② 적재 경로 부재 확정: l1/atom_graph/atom_node_projection.py는 atom_node 멱등 upsert 구현을 갖고 있으나 CLI 진입점이 없다(__main__ 블록 0건·argparse 0건 — main b810388b 실측). 즉 prod에 적재할 실행 경로 자체가 없다. l1/atom_graph/populate.py는 concept/concept_edge 적재기라 atom_node를 건드리지 않는다(docstring 명시). 해법은 SKB-01과 동형: 적재 CLI를 신설하고 게이트로 prod 1회 실행을 위임한다.\n③ 소비처 영향 명시: atom_node는 L2 weak_concept_recommendation(약개념 추천 메타 enrich·S0-4d)이 소비한다 — 비어 있으면 그 경로가 \"메타 누락\"이 아니라 \"원자 축 밖\"으로 읽어 조용히 enrich 0건이 된다(모듈 docstring 24행). 작동한 비율 원칙에 따라 적재 후 enrich 성립 비율을 리포트로 확인할 수 있어야 한다.\n④ prod 적재는 human gate로 위임(prod DB 쓰기라 세션 직접 실행 불가) — 게이트 등재는 CLI 신설 PR 병합 후."
  - "②-정정(2026-09-14 착수 실측): \"적재 CLI 진입점이 없다\"는 진단은 증상은 맞았으나 위치가 달랐다. 정확히는 \"이미 있는 CLI가 형제 projection을 빠뜨렸다\"다 — 이 저장소의 관례는 <dir>/populate.py가 형제 *_node_projection.py를 부르는 것이고(skill_graph/populate.py 24행·problem_type_graph/populate.py 24행·concept_content 전부 그렇다) atom_graph/populate.py만 atom_node_projection import가 0건이었다. 그 CLI는 concept/concept_edge/시각화 Overlay 2종을 적재하는 멀쩡한 진입점이었다. 따라서 해법은 새 CLI 신설이 아니라 기존 CLI에 여섯 번째 적재 스텝 배선이며, 같은 파일의 VIZ-01 D1 선례(opt-in Overlay)를 그대로 답습했다. 다만 Overlay와 달리 경로 인자가 없어(같은 graph.json) opt-in 스위치가 None 경로가 아니라 불린 populate_node_meta다 — 기본 False가 기존 hermetic 단위테스트(tmp_path 그래프·PG 불요)의 계약을 보존하고, CLI(_main)는 기본 ON으로 호출하며 --skip-atom-node로 opt-out한다. 이 정정은 SKB-01의 ③-보정2와 같은 형태다(진단은 정확, 정정 위치가 달랐다).\n③-충족확인(2026-09-14): 이 항이 요구한 \"작동한 비율\" 신호는 이미 배선돼 있었다 — l2/weak_concept_recommendation.py가 off_atom_axis를 계수해 WeakConceptResult로 반환한다(216·223·247행·ARCH-13 표면화). 새로 만들 필요가 없으므로 이 태스크의 실제 스코프는 CLI 배선 하나로 줄었다. 다만 그 계수가 적재 후 실제로 줄어드는지는 학습자 진단 데이터가 있는 요청을 호출해야 알 수 있어 이 태스크 범위 밖이다(런북 §8에 고지).\n①-부분충족(2026-09-14): 기대 적재 건수를 코퍼스에서 직접 셌다 — data/corpus/atom_graph_v1/graph.json의 concepts 2,683건(세부개념 1,823 + 단원 217 + 소단원 643), name/level 결손으로 skip될 노드 0건. concept 테이블 2,683행과 정확히 일치한다. 이 과정에서 atom_node_projection.py docstring의 \"원자 1,837 + 단원 217 + 소단원 643 = 2,697\"이 낡은 값임이 드러나 3곳을 실측값으로 정정했다. 다만 이 항이 요구한 \"prod atom_node 전체 행수\"(전량 공백인지 1,311 code만 부재인지)는 prod DB 읽기라 세션이 못 한다 — 게이트 런북 [B]단계의 BEFORE_TOTAL이 그 답을 낸다.\n④-집행(2026-09-14): prod 적재 게이트 G-skb03-atom-node-populate 등재 + 런북 docs/ops/skb03_atom_node_populate_runbook.md 작성. 런북은 SKB-01 런북 §9의 교훈(자동 가드 없음·블록 간 사람 판정·체크아웃 대신 동등성 판정)을 처음부터 적용했다. 이 게이트가 clear되고 AFTER_TOTAL=2683이 확인되기 전까지 이 태스크는 미완이다.\n⑤-후속발견(2026-09-14): atom_node 행이 생긴 뒤 concept_atom_crosswalk.populate를 한 번 더 돌려야 atom_node.behavior_skills가 채워진다(2026-09-14 실행은 대상 행 부재로 0건이었다). 그 재실행은 이 게이트 범위 밖이며 런북 §8에 고지했다 — AFTER_WITH_SKILLS=0이 정상임을 함께 명시해 오판을 막았다."
