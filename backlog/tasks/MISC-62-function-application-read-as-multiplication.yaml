notes: "MISC-33 착수 중 실측으로 발견(2026-10-08). `identity_status('f(x)', 'f*x')`가 identity를 돌려준다 — 함수 적용을 곱셈과 같다고 보는 거짓 양성이 동치 권위에 이미 있다. 같은 파서(`_PARSE_TRANSFORMS`)로 `safe_parse_expr('f(x)+1')`은 `f*x + 1`을 낸다. 비교: 변환 없는 `safe_sympify('f(x)+1', convert_xor=True)`는 `f(x) + 1`(함수)로 읽는다. 내장 함수 `sin(x)`는 정상이고 미지 이름 f·g에서만 생긴다. 원인 가설은 auto_symbol이 만든 Function 토큰을 implicit_multiplication이 곱 대상으로 보는 상호작용이다.\n\nMISC-33에서 고치지 않은 이유: 파서 변환을 바꾸면 identity_status 소비처 전체의 판정이 움직이고, f(x)와 x(x+1)을 가르는 표기 정책은 코드가 아니라 결정 사항이다. MISC-33은 이 결함을 늘리지도 줄이지도 않으며(matches_wrong_form의 구조 파싱이 동치 권위와 같은 읽기로 맞춰질 뿐), 현재 동작을 계약 테스트로 동결해 승계 지점을 기계로 남긴다.\n\n영향 추정(미측정): 학생 답에 f(x) 꼴이 들어가는 문항에서만 발생한다. 빈도는 측정하지 않았다 — 우선순위를 P2로 둔 근거는 추정이며 빈도 실측 후 amend --eos-priority로 재판정한다."
