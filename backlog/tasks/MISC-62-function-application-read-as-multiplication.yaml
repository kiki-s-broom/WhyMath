acceptance:
  - "① 표기 정책을 먼저 정한다 — 함수 적용 `f(x)`를 곱 `f*x`와 구별하려면 어떤 이름을 함수로 읽을지(예: 단일 문자 f·g·h 뒤 괄호) 정책이 필요하다. `docs/architecture/notation_contract.md`는 함수 적용 `f(x)`를 규정하지 않으므로(MISC-33 실측 2026-10-08) 정책을 그 문서에 먼저 적는다. 학생 입력에서 `x(x+1)`은 곱이고 `f(x+1)`은 함수 적용이라 이름만으로는 가를 수 없다 — 정책 결정은 Kiki 판단 사항이다.\n② 정책에 따라 `l3/symbolic_equivalence.py`의 `_PARSE_TRANSFORMS`를 고쳐 `identity_status('f(x)', 'f*x')`가 identity가 아니게 한다. 원인 가설(실측으로 확정 필요): `auto_symbol`이 만든 `Function('f')`를 `implicit_multiplication`이 함수 뒤 괄호로 보고 `*`를 끼워 넣는 상호작용.\n③ MISC-33이 남긴 계약 테스트 `test_function_application_is_read_as_multiplication_known_limitation`(tests/backend/l3/test_symbolic_equivalence.py)이 현재 동작을 동결해 두었으므로, 고치면 그 테스트가 RED가 된다 — 그때 한계 테스트를 구별한다는 단언으로 뒤집는 것까지가 범위다.\n④ `identity_status`·`identity_status_detail` 소비처 전건(verify_step·verify_final_answer·solution_set·slot_generator·subject_adapter_math·selective_grading_demotion_eval·wrong_form_match·카탈로그 무결성)에 대조군을 두고, 회귀 판정은 백엔드 전체 스위트로 한다."
