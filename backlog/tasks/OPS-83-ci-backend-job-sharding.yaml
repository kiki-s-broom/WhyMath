notes: "발견 경위(2026-09-18 · EOS-18/PR #1196 머지 과정 실측): Kiki의 \"왜 이렇게 더딘가\" 질문에 구간을 나눠 측정한 결과, green 이후 머지까지의 대기가 작업 시간과 맞먹었다. 큐 회전당 약 24분이고 그 안에서 `backend — lint·type·test` 18분 34초가 지배 항이다. 즉 큐 처리량의 분모를 줄이는 축이 이 태스크다.\n\n[OPS-58과의 관계 — 중복 아님] OPS-58(done)은 같은 잡을 29분 41초 → 18분 34초로 줄였으나 **잡 내부** 병렬화(pytest-xdist)였고, 그 acceptance ⑤가 \"이 태스크는 경합 *창*을 줄일 뿐 경합 자체를 없애지 못한다. 근본 해법(merge queue 또는 up-to-date 요구 해제)은 저장소 관리자 설정이라 게이트로 분리한다\"로 스스로 범위를 닫았다. 머지 큐는 그 뒤 실제로 도입됐고(HARN-98 done), 그러자 병목이 \"경합 확률\"에서 \"**큐 회전 시간**\"으로 성격이 바뀌었다 — 직렬 큐에서는 잡 소요가 곧 처리량이다. 잡 단위 샤딩은 OPS-58이 쓰지 않은 자원(러너 N대)을 쓰는 다른 축이다.\n\n[인접 태스크] HARN-112(큐 묶음 크기)는 같은 문제의 **분자** 축이다 — 한 번에 몇 건을 검증하느냐. 이 태스크는 **분모** 축 — 한 번 검증에 얼마가 걸리느냐. 둘은 곱해져 처리량이 되므로 어느 쪽이든 단독으로도 이득이 나지만, CLAUDE.md 「여러 축 동시 투입 시 어느 것이 들었는지 판정 불가」에 따라 **동시에 적용하지 않는다** — 먼저 착수한 쪽의 효과를 실측한 뒤 나머지를 판단한다.\n\n[범위 밖] 테스트를 줄이거나 skip·quarantine으로 시간을 버는 것은 이 태스크가 하지 않는다(CLAUDE.md 금지). 큐 전용 축약 CI도 하지 않는다 — 검증 표면을 줄이는 방향이고 큐 체크 집합은 HARN-56이 소유한다."
