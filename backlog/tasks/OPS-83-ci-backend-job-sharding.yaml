acceptance:
  - "① 현행 실측 고정 — `backend — lint·type·test` 잡이 18분 34초다(2026-09-18 실측: run 35328149615 · 09:16:18Z→09:34:52Z). OPS-58 적용 *전*이 29분 41초였으므로 pytest-xdist가 약 37%를 줄였고, 남은 18분 34초가 이제 큐 회전의 지배 항이다. 스텝 타임스탬프로 pytest 비중을 **다시** 잰다 — OPS-58 ①의 90%는 병렬화 이전 수치라 그대로 인용하면 안 된다.\n② 축 구분(전제 확인) — OPS-58은 **잡 내부** 병렬화(러너 1대의 코어를 xdist 워커로 나눔)를 했고 done이다. 이 태스크는 **잡 단위** 분할(Actions matrix로 러너 N대에 분산)을 본다. 전제는 \"ubuntu-latest의 코어 수가 상한이라 xdist만으로는 더 못 줄인다\"이며, 이 전제를 ①에서 확인한 뒤에만 진행한다. 확인 결과 잡 시간이 pytest가 아닌 곳(설치·체크아웃)에 쏠려 있으면 이 태스크는 대상을 잘못 고른 것이므로 재정의한다.\n③ 커버리지 합산 정합 — 샤딩하면 `coverage.xml`이 샤드 수만큼 쪼개진다. 계층별 커버리지 게이트(`scripts/coverage/check_layer_coverage.py`)가 그 파일을 읽으므로 `coverage combine` 결과가 직렬 수치와 **완전 일치**해야 한다(lines·branches 총계). OPS-58 ②가 xdist에 대해 같은 검사를 통과시켰고 한 자리도 다르지 않았다 — 같은 기준을 적용한다. 어긋나면 게이트가 통과하면서 틀린 판정을 낸다.\n④ 순서 의존 오염 — 이 저장소는 `db.session._engine` 전역 오염 이력이 있다(OPS-06/07/09). 샤딩은 파일 단위 분배라 `--dist loadfile`과 같은 성질이지만 **샤드 경계가 바뀌면 같은 워커에 있던 테스트가 갈라진다**. 전체 스위트가 샤딩 상태에서 통과하는지, 그리고 샤드 배정을 바꿔도 통과하는지 둘 다 확인한다.\n⑤ 효과 실측 — 예측이 아니라 적용 전후 실측 대조. 잡 소요만 보지 말고 **큐 회전 시간**까지 본다 — 잡을 줄여도 큐가 다른 것을 기다리면 이득이 나지 않는다. 러너 사용량(분 단위 과금)이 N배가 되므로, 이득이 그 비용에 못 미치면 되돌린다.\n⑥ 변별력 — 샤드 하나를 일부러 실패시켰을 때 잡 전체가 red가 되는지 주입으로 확인한다. 샤드 실패가 삼켜지면 \"13,259건 통과\"가 \"일부만 돌았다\"를 가린다 — CLAUDE.md 「안 돌린 검사와 통과한 검사를 같은 화면에서 읽지 않는다」의 샤딩판이며, 이 저장소는 그 사고를 이미 한 번 겪었다(2026-09-10 PR #1075 · 뒤 스텝 20개 skipped).\n⑦ 필수 체크 이름 정합 — 잡이 N개로 갈라지면 룰셋의 required status check 이름이 바뀐다. 이름이 어긋나면 required가 영원히 pending이 되거나(머지 영구 불가) 사라진 이름이 조용히 미강제가 된다. 머지 큐도 같은 이름 집합을 쓴다. 룰셋 변경은 관리자 권한이라 Kiki 실행 블록이 필요할 수 있다(CLAUDE.md 6항목 브리핑·자리표시자 0개). 이 축은 HARN-82가 소유하므로 착수 시 경계를 재확인한다."
