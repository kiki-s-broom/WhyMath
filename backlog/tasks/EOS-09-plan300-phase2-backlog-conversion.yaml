notes: "출처: Kiki 제공 외부 문서 `300_Phase 2 — EOS Closed Learning Loop 실행계획`(2026-09-28~10-25 · §1~§22) — 2026-09-16 세션에 .docx로 첨부·본문 전량 확보. 저장소는 이 문서를 `docs/reviews/eos_phase2_plan_300_gap_review_2026-09-03.md`로 한 차례 대조했고 Kiki가 강등 결정을 내렸으나, 그 대조는 Gate 2 조건·API·경계 축에 집중해 §22 우선순위 20건 전건 분해는 하지 않았다. 본 태스크는 그 잔여를 착수 단위로 변환한다.\n\n분류(§14): SUPPORT — 폐쇄루프 자체가 아니라 그 계획을 대장에 싣는 지원 작업.\n\n주의 1 — 이 변환은 실행 승인이 아니다. 선언 `docs/strategy/eos_transition_declaration_2026-08-30.md` §1.3이 2026-09-03 Kiki 결정으로 \"계획서 300의 4주 Phase 2는 실행하지 않고 참고 문서로 강등 · 10월 공식 목표는 G2 앵커 콘텐츠 생산 유지 · 8상태 학습 상태 머신 신설은 보류(재확인 지점 = G4 12/13)\"를 정본화했다. 등재된 태스크의 착수는 그 결정의 갱신을 전제로 한다.\n\n주의 2 — 원 문서 §3의 8상태 상태 머신(NEW→DIAGNOSING→READY→LEARNING→PRACTICING→ASSESSING→REMEDIATING→ADVANCING)은 09-03 결정이 명시적으로 보류한 항목이다. 저장소는 상태를 머신이 아니라 이력으로 모델링한다(*MasteryHistory append-only + attempt_event 시계열) — 8상태를 세우면 같은 사실의 두 번째 진실 원천이 생긴다(붕괴 연쇄 \"유지보수 지옥\"). 등재 제외 후보이며 대조표 ③절에 근거를 적는다."
