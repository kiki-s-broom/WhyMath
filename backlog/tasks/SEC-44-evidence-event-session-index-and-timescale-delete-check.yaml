  - "① evidence_event 에는 session_id 인덱스가 없다(PK (event_id, time) 과 idx_ev_obj_time 뿐). SEC-40 의 세션 ID IN 삭제와 meta.user_binding 일치 조회가 전 청크 순차 스캔임을 EXPLAIN 으로 실측하고, 인덱스 추가 여부와 형태(하이퍼테이블 인덱스)를 판정한다. 인덱스 추가는 alembic 마이그레이션이라 신규 리비전 등재 절차(EOS 인벤토리·prod 스키마 프로브)를 밟는다.\n② TimescaleDB 하이퍼테이블에서 evidence_event 의 DELETE 와 압축 청크 동작을 실환경(TimescaleDB 가 있는 PG)에서 검증한다. 이 컨테이너 PG 에는 TimescaleDB 가 없어 SEC-40 의 통합 테스트는 일반 테이블에서만 돌았다 — 압축·보존 정책은 alembic 에 0건이지만 운영 DB 사실은 미확인이다.\n③ 검증하지 못한 부분은 통과로 계상하지 않는다. 운영 DB 접근이 필요하면 Kiki 행동 게이트로 올린다."
