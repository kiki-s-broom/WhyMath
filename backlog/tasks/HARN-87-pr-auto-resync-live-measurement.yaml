acceptance:
  - "① 토큰 재발화 실측 — PAT 착지 후 pr-auto-resync를 실제로 돌려 update-branch가 만든 새 head에 required check가 **보고되는지** 확인한다(check-runs 조회로 개수·시각). PAT 경로가 정상 작동함을 확인하는 것이 목적이며, GITHUB_TOKEN 폴백 경로는 fail-closed로 막혀 있어 관측 대상이 아니다(HARN-85가 그 경로를 의도적으로 닫았다)"
  - "② 도입 전후 변별력 — 테스트 PR 1건에 auto-merge를 켜고 재동기화 대기 중 main에 다른 PR을 **의도적으로 착지**시킨 뒤, 수동 개입 없이 재동기화가 일어나 최종 머지되는지 확인한다. 이 주입 없이는 '경합이 없었을 뿐'과 '경합에 강해졌음'을 구분할 수 없다. 전 상태 기준선: PR #935 재동기화 4회 · PR #952가 CI green 3회 확보하고도 behind로 3라운드 · PR #1040 자신이 머지까지 main 병합 3회"
  - "③ 주기·비용 재판정 — 15분 주기는 근거 없는 초기값이다. 실측 1주 뒤 (a)재동기화 발생 건수 (b)그로 인한 CI 실행 증가분을 세어 주기를 조정하거나 유지한다. 큐와 달리 직렬화하지 않으므로 동시 대기 PR이 많을 때 CI 소모가 증폭될 수 있다 — 그 증폭이 실제로 관측되는지 본다"
  - "④ **예약 트리거의 실효 주기 실측 + push 트리거 검토** — 실측: 워크플로가 main에 착지(2026-09-08 00:09Z)한 뒤 **44분간 실행 0건**이었다( total_count=0 · 워크플로 자체는 state=active로 등록됨). cron은 라 2~3회 발화했어야 한다. 이것이 (a)GitHub의 고빈도 cron 디프라이어리티제이션(예약은 지연·누락될 수 있고 특히 짧은 주기가 심하다)인지 (b)워크플로 결함인지 **이 시점에는 구분되지 않았다** — 세션 토큰은  권한이 없어(2026-09-08 재실측 403 'Resource not accessible by integration') 수동 트리거로 가를 수 없었다. 절차: ①실효 주기를 며칠 관측해 중앙값·최대 간격을 낸다 ②그 값이 main 전진 간격(15~30분)을 못 이기면 ** 트리거를 추가**한다 — PR이 behind가 되는 순간이 정확히 main이 전진하는 순간이므로 이벤트 트리거가 예약보다 의미상 정확하고 발화도 확실하다(push 이벤트는 디프라이어리티제이션 대상이 아니다). 비용은 main 커밋당 API 몇 회로 낮다 ③cron은 안전망으로 남길지 제거할지 그때 정한다. **주의**: 이 축은 ③(주기·비용 재판정)과 짝이다 — ③이 '너무 자주 도는가'를 묻는다면 이 축은 '아예 안 도는가'를 묻는다"
  - "⑤ **④의 정정본(④는 셸 치환으로 손상됐다 — 아래를 정본으로 읽는다)**. ④ 등재 시 인자의 마크다운 백틱이 bash 명령 치환으로 실행돼 식별자 4개가 통째로 사라졌다(\"cron은 라 2~3회 발화했어야\" 같은 무의미 문장이 그 흔적이다). `--acceptance`는 append 전용이라 지울 수 없어 정정 항을 덧붙인다.\n\n[실측] 워크플로가 main에 착지(2026-09-08 00:09Z)한 뒤 **44분간 실행 0건**이었다 — `GET /repos/doldori7/WhyMath/actions/workflows/pr-auto-resync.yml/runs` 의 `total_count=0`. 워크플로 자체는 `GET /actions/workflows` 에서 `state=active`로 등록돼 있다. cron이 `*/15 * * * *` 이므로 2~3회 발화했어야 한다.\n\n[구분 불가] 이것이 (a)GitHub의 고빈도 cron 디프라이어리티제이션(예약은 지연·누락될 수 있고 짧은 주기일수록 심하다)인지 (b)워크플로 결함인지 **이 시점에는 갈리지 않았다**. 세션 토큰에 `actions: write` 가 없어(2026-09-08 재실측 — `POST .../dispatches` → 403 `Resource not accessible by integration`) 수동 트리거로 (b)를 배제할 수 없었다. Kiki가 Actions 탭에서 1회 수동 실행하면 즉시 갈린다(게이트 `G-pr-auto-resync-token` 절차 ③이 그 역할을 겸한다).\n\n[절차] ①실효 주기를 며칠 관측해 중앙값·최대 간격을 낸다 ②그 값이 main 전진 간격(15~30분)을 못 이기면 `push: branches: [main]` 트리거를 추가한다 — PR이 behind가 되는 순간이 정확히 main이 전진하는 순간이므로 이벤트 트리거가 예약보다 의미상 정확하고 발화도 확실하다(push 이벤트는 디프라이어리티제이션 대상이 아니다). 비용은 main 커밋당 API 몇 회로 낮다 ③cron을 안전망으로 남길지 제거할지 그때 정한다.\n\n[짝] 이 축은 ③(주기·비용 재판정)의 반대편이다 — ③이 \"너무 자주 도는가\"를 묻는다면 이 축은 \"아예 안 도는가\"를 묻는다. 둘 다 실측 없이는 답할 수 없다."
  - "⑥ **비교 실측(2026-09-08 02:05Z) — 이 저장소의 예약 발화는 1~3시간 지연된다. `*/15`는 명목일 뿐이다.**\n\n[관측] `pr-auto-resync`는 main 착지(00:09Z) 후 **116분간 실행 0건**. 그러나 같은 저장소의 `schedule` 이벤트 자체는 살아 있다 — `GET /actions/runs?event=schedule` 총 85건이고 최근 5건이 정상 발화했다.\n\n[결정적 대조] 발화하는 예약들의 **명목 시각과 실제 시각이 크게 다르다**. `ci.yml`의 야간 잡은 `cron: \"0 18 * * *\"`인데 실제 실행은 2026-09-06 19:52Z, 2026-09-07 21:00Z였다 — **1시간 52분 ~ 3시간 지연**. `harness-audit`도 20:12Z·20:16Z·21:23Z로 흩어진다.\n\n[해석] 따라서 116분 0건은 (b)워크플로 결함의 증거가 아니다 — (a)지연으로 충분히 설명된다. 다만 **더 중요한 결론이 따라온다**: 이 저장소에서 GitHub 예약은 1~3시간 단위로 지연되므로 `*/15`가 의도한 15분 주기는 **구조적으로 달성 불가**다. main은 15~30분마다 전진하는데 재동기화가 1~3시간에 한 번 돌면 자동화의 목적 자체가 성립하지 않는다.\n\n[따라서 ⑤의 ②는 조건부가 아니라 확정 작업이다] `push: branches: [main]` 트리거 추가를 \"실효 주기가 나쁘면\"이 아니라 **기본 설계로** 채택한다. PR이 behind가 되는 순간이 정확히 main이 전진하는 순간이고, push 이벤트는 지연 대상이 아니다. cron은 push를 놓친 경우의 안전망으로만 남긴다(주기는 `0 * * * *` 등으로 낮춰 비용을 줄인다).\n\n[순서 제약] 이 변경은 PAT(게이트 `G-pr-auto-resync-token`)와 **함께 또는 그 뒤에** 착지해야 한다. PAT 없이 push 트리거를 켜면 main 커밋마다 fail-closed exit 1이 발생해 main이 상시 red로 보인다 — 지금의 \"거의 안 돌아서 조용한\" 상태보다 나쁘다.\n\n[미확정 잔여] 워크플로가 *실제로 실행됐을 때* 설계대로 도는지는 여전히 미관측이다. 세션 토큰에 `actions: write`가 없어 수동 트리거가 403이므로, Kiki가 Actions 탭에서 1회 실행하는 것이 유일한 확인 경로다(게이트 절차 ③이 겸한다)."
  - "⑦ **⑥의 결론 범위 축소 (PR #1056 Codex P2 수용 — 표본 대표성 결함)**\n\n[지적] ⑥의 비교 표본 5건은 **전부 정각 예약**이다 — `ci.yml`·`harness-audit.yml` 둘 다 `cron: \"0 18 * * *\"`(실측 확인). 정각은 GitHub에서 가장 혼잡한 슬롯이므로 그 지연을 `*/15`의 비정각 슬롯(:15·:30·:45)에 **일반화할 수 없다**. 게다가 바로 앞 ⑤가 \"대상 워크플로를 며칠 관측해 중앙값·최대 간격을 낸다\"고 절차를 정해 두었는데, ⑥은 그 관측 없이 간접 증거만으로 앞질러 확정했다.\n\n[수용] 옳다. ⑥의 다음 두 문장을 **철회**한다: \"`*/15`가 의도한 15분 주기는 구조적으로 달성 불가\" · \"⑤의 ②를 조건부가 아니라 확정 작업으로 승격\". 대신 아래로 대체한다.\n\n[유지되는 것] ⓐ `schedule` 이벤트 자체가 이 저장소에서 살아 있다는 사실(총 85건·최근 5건 정상) ⓑ **정각 슬롯**에서 1시간 52분~3시간 지연이 관측됐다는 사실 ⓒ 따라서 116분 0건이 워크플로 결함의 *증거는 아니라는* 것. ⓒ는 \"결함이 아니다\"가 아니라 \"결함이라고 말할 근거가 없다\"이다 — **원인은 미확정으로 유지한다.**\n\n[철회되는 것] \"구조적 달성 불가\" 확정. `pr-auto-resync` **자신의 실행 표본**을 확보하기 전까지 `*/15`의 실효 주기는 모른다. push 트리거는 **유력한 대안**이지 확정 설계가 아니다.\n\n[따라서 판정 순서] ①먼저 `pr-auto-resync`가 한 번이라도 돌게 만든다(Kiki 수동 실행 — 게이트 `G-pr-auto-resync-token` 절차 ③) ②그 뒤 ⑤ 절차대로 며칠 관측해 대상 자신의 중앙값·최대 간격을 낸다 ③그 값이 main 전진 간격을 못 이길 때 비로소 push 트리거를 채택한다. 순서를 건너뛰면 워크플로 결함을 예약 지연으로 오진한 채 트리거만 바꾸게 되고, 그러면 push 트리거에서도 같은 결함이 재현된다.\n\n[자기 진단] 이 오류는 새 규칙이 필요한 공백이 아니라 **기존 규칙 위반**이다 — CLAUDE.md \"환경 사실의 추론 등재 금지\"가 이미 \"환경 규칙은 실측 증거를 확보한 뒤에만 등재한다 · 부분 성공을 전체 정상으로 해석하지 않는다\"를 말한다. 나는 *다른 워크플로의* 실측으로 *이 워크플로의* 환경 사실을 등재했다. PR 본문의 「정직한 공백」에는 \"표본 5건\"이라고 적어 두고도 대장 본문에는 \"확정\"이라고 썼다 — **미래 세션이 읽는 것은 대장이므로 대장의 과신이 진짜 피해다.**"
  - "⑧ **⑦의 잔여 과신 정정 + ⑥의 실효 폐기 경로 (PR #1057 Codex P2 2건 수용)**\n\n[P2-1 수용 — ⑥이 여전히 활성이다] ⑦을 append해도 ⑥은 활성 acceptance로 남는다. 그래서 지금 이 정본에는 **서로 배타적인 두 요구**가 동시에 있다 — ⑥ \"push 트리거를 확정 설계로 승격\" vs ⑦ \"대상 실측 전에는 채택하지 말 것\". 실행자가 ⑥을 먼저 읽으면 ⑦이 막으려는 조기 도입을 그대로 수행한다. **⑥은 무효이며 ⑦·⑧이 그것을 대체한다** — 다만 산문 선언만으로는 집행되지 않으므로, 폐기 표시(tombstone) 경로를 소유한 `HARN-76-acceptance-supersede-and-title-amend`를 이 태스크의 `depends_on`으로 붙였다. 그 경로가 착지해야 ⑥을 실제로 폐기 표시할 수 있다.\n\n[P2-2 수용 — 결함 배제도 철회한다] ⑦은 정각 표본을 `*/15`에 일반화할 수 없다고 인정하면서, **같은 표본을 근거로** \"116분 0건은 워크플로 결함의 증거가 아니다\"를 유지했다. 표본의 대표성을 부정한 이상 그 표본은 이 결론도 지지하지 못한다. 정정: **116분 0건은 비변별(non-discriminating) 증거다** — 예약 지연과 트리거 결함 **양쪽 모두에 부합**한다. \"근거 없음\"이 아니라 \"양쪽을 가르지 못함\"으로 기록한다. 이 차이는 실질적이다: \"근거 없음\"은 직접 관측(대상이 여러 예정 시각 동안 0건)을 부당하게 폐기하지만, \"비변별\"은 그 관측을 **살려 두고** 무엇을 더 재야 갈리는지를 가리킨다.\n\n[따라서 남는 사실만] ⓐ `schedule` 이벤트가 이 저장소에서 살아 있다(총 85건) ⓑ 정각 슬롯에서 1시간 52분~3시간 지연이 관측됐다(표본 5건·`cron: \"0 18 * * *\"`) ⓒ `pr-auto-resync`는 착지 후 116분간 0건이었고, 이는 지연·결함 어느 쪽도 배제하지 못한다. **원인 미확정.**\n\n[갈라 줄 유일한 관측] 대상 워크플로 자신의 실행 표본. 첫 실행은 Kiki 수동 트리거로만 얻을 수 있다(게이트 `G-pr-auto-resync-token` 절차 ③ — 세션 토큰은 `actions: write` 없음·403 실측). 그 실행이 나오면 ①정상 종료 여부로 결함 축을 가르고 ②이후 며칠 관측으로 실효 주기를 낸다.\n\n[자기 진단 — 2회차 형태] ⑥이 \"간접 증거로 확정\"이었다면 ⑦은 **\"철회를 절반만 한 것\"**이다. 무효화해야 할 근거로 다른 결론을 계속 떠받쳤고, 그 결론이 내게 유리한 쪽(내 워크플로에 결함이 없다)이었다. 철회할 때는 **그 근거에 매달린 결론을 전수로 훑어야** 한다."
  - "⑨ **⑧이 \"갈라 줄 유일한 관측\"으로 지목한 실행이 나왔다 — 워크플로 결함 축 배제 (2026-09-08 05:00Z 실측)**\n\n[⑧이 요구한 것] \"대상 워크플로 자신의 실행 표본. 첫 실행은 Kiki 수동 트리거로만 얻을 수 있다. 그 실행이 나오면 ①정상 종료 여부로 결함 축을 가르고 ②이후 며칠 관측으로 실효 주기를 낸다.\" 게이트 G-pr-auto-resync-token이 2026-09-08에 집행되며 ①이 충족됐다.\n\n[실측 3건]\n· run #1 (id 34187171965 · workflow_dispatch · 04:31:07Z) — conclusion=failure. 원인은 **워크플로가 아니라 시크릿 값**이다: 등록된 PAT 끝에 개행이 들어가 `net/http: invalid header field value for \"Authorization\"` 로 gh 호출 자체가 실패했다.\n· run #2 (id 34187637864 · **event=schedule** · 04:37:17Z) — conclusion=failure, 같은 원인. **이 워크플로의 첫 예약 발화 표본이다.**\n· run #3 (id 34188745979 · workflow_dispatch · 04:56:02Z · dry_run=0) — 시크릿 재등록 후 **conclusion=success**. 설계대로 스캔·분류·요약을 냈다: `스캔 17건 · BEHIND+auto-merge 0건 · 최신화 0건 · 충돌 0건 · 미판정 4건 · 기타실패 0건` + 미판정 4건의 PR 번호 개별 출력.\n\n[따라서 갈린 것 — 결함 축 배제] ⑧의 기준(정상 종료 여부)으로 판정하면 **워크플로에 결함이 있다고 볼 근거가 사라진다.** ⓐ예약 트리거가 이 워크플로에서 실제로 발화한다(run #2가 그 증거 — 실패했지만 그것은 발화 이후 토큰 단계의 실패다) ⓑ스크립트가 설계대로 완주한다(run #3). 따라서 ⑧이 \"원인 미확정\"으로 남긴 축 중 **트리거 결함 쪽은 배제된다.**\n\n[경고 — run #2의 failure를 워크플로 결함으로 오독하지 말 것] conclusion만 훑으면 예약 실행이 실패한 것으로 보인다. 실제 원인은 저장소 시크릿 값의 개행이며 워크플로·스크립트와 무관하다. 이 오독 위험 자체가 태스크 HARN-89(토큰 위생 사전 검사)의 등재 사유다.\n\n[여전히 미확정으로 남기는 것 — 표본 1건] 착지(00:09Z) 후 첫 예약 발화까지 **4시간 28분**이 걸렸다(00:09→04:37). 이것이 (a)일반적 예약 지연인지 (b)신규 워크플로의 예약 활성화 지연(첫 회에만 해당)인지 (c)비정각 슬롯의 특성인지는 **표본 1건으로 갈리지 않는다**. ⑥→⑦→⑧이 세 번 연속으로 겪은 것이 정확히 이 형태의 조기 확정이므로, 여기서도 확정하지 않는다. ⑤ 절차대로 며칠 관측해 중앙값·최대 간격을 낸 뒤에 판단한다.\n\n[남은 판정 순서] ①(토큰 재발화)②(경합 주입)는 여전히 미관측이다 — auto-merge를 켠 BEHIND PR이 있어야 update-branch가 호출되는데 run #3 시점에 그런 PR이 0건이었다. 2026-09-08 Kiki 판단으로 PR #1062에 auto-merge를 켜 그 조건을 만들기로 했다."
  - "⑩ **① 답변 — PAT push가 CI를 정상 재발화시킨다 (2026-09-08 09:07Z 실측 · 자연 발생, 주입 불요)**\n\n[조건 성립 경위] PR #1062(HARN-89·90·91 등재 PR)이 green + auto-merge ON 상태로 대기 중, main이 2커밋(#1052·#1064) 전진해 자연스럽게 BEHIND가 됐다 — 별도 조작 없이 acceptance ①의 전제(auto-merge 켠 BEHIND PR의 실재)가 충족됐다.\n\n[실측] pr-auto-resync run #4(id 34208186818 · event=schedule · 09:06:47Z) 로그:\n`✔ #1062 (claude/pat-issuance-q516cw): 최신화 완료` (09:07:02Z)\n요약: `스캔 20건 · BEHIND+auto-merge 3건 · 최신화 3건 · 충돌 0건 · 미판정 2건 · 기타실패 0건`\n\nupdate-branch가 만든 merge commit `265d4f0b3de3d2c525ace62a66ad4b9ccb356216`는 **작성자가 `doldori7`**(PAT 소유자)다 — 세션 토큰이 아니라 PAT가 실제로 push했음을 커밋 메타데이터로 확인.\n\n그 push 20초 뒤(09:07:07Z) CI run 34208218292가 새로 발화해 **success**로 완주. check-runs 개수를 push 직전 기준선과 대조:\n| | 재동기화 전(head 4867d8b1) | 재동기화 후(head 265d4f0b) |\n|---|---|---|\n| 총 check run | 18 | **18** (정확히 일치) |\n| success | 8 | 8 |\n| skipped | 10 | 10 |\n| failure | 0 | 0 |\n\n[결론] **GITHUB_TOKEN fail-closed로 막으려던 상태(체크 0건 · PR 영구 좌초)가 아니다.** PAT가 만든 push는 required check를 정상적으로 재생성하며, strict 브랜치 보호 하에서도 머지 경로가 그대로 살아 있다. 이로써 ①은 실측으로 답변됐다 — HARN-85의 설계 판단(GITHUB_TOKEN 대신 PAT를 fail-closed로 강제)이 실전에서 의도대로 작동함을 확인했다.\n\n⑪ **② 답변 — 경합 주입 없이 자연 경합이 발생, 수동 개입 없이 최종 머지까지 진행 (2026-09-08 09:07~09:27Z)**\n\n[관측] 같은 run #4가 **한 실행에서 PR 3건**(#1062·#1063·#1010)을 동시에 최신화했다 — 설계 문서가 명시한 \"직렬화하지 않는다\"(각 PR을 독립적으로 처리)가 실제로 그렇게 작동함을 확인. 세 PR 모두 그 시점 auto-merge ON + BEHIND였다.\n\n#1062는 그 뒤 CI green(09:07:07Z 발화 → 09:26:55Z 완주) 후 **수동 개입 없이 자동 머지**됐다(pull_request.closed 이벤트 · outcome=merged · 09:27:15Z 관측). 세션은 이 구간에서 main을 병합하거나 push하지 않았다 — 대기만 했다.\n\n[acceptance ②의 문면과의 차이 — 정직하게 기록] ②는 \"테스트 PR 1건에 auto-merge를 켜고 대기 중 main에 다른 PR을 의도적으로 착지시킨 뒤\" 관찰하라고 적었다. 실제로는 **의도적 주입이 아니라 자연 발생**이다 — #1062가 대기하는 동안 다른 세션들의 PR(#1051→main, #1052/#1064→main)이 착지해 BEHIND가 됐고, 그 뒤 pr-auto-resync가 그것을 감지해 처리했다. 인위적 주입과 자연 발생의 차이는 **관측 대상 현상 자체에는 영향이 없다** — \"재동기화 대기 중 main이 전진 → 자동 재동기화 → 수동 개입 없이 최종 머지\"라는 인과 사슬이 실측으로 완성됐다. 다만 이것이 *일회성 우연*인지 *상시 재현되는 동작*인지는 표본 1건(#1062 기준)이므로 확정하지 않는다.\n\n[전 상태 기준선과 대조] PR #935 재동기화 4회·PR #952 CI green 3회 확보하고도 behind로 3라운드·PR #1040 자신이 머지까지 main 병합 3회 — 이 기준선들은 전부 **사람이 수동으로 Update branch를 눌러야 했던** 이력이다. #1062는 그 수동 개입이 **1회도 없이** 머지됐다. 이것이 이 자동화가 만들려던 결과다.\n\n[남은 것] 이번 표본은 대상 0→1(때로는 3)로의 전이 1회다. HARN-87 ③(1주 관측)·⑤(예약 실효 주기)는 여전히 표본이 부족해 미확정으로 남긴다.\n\n[병렬 관찰 — 조치하지 않음] 같은 run #4가 처리한 PR #1063은 다른 세션(`claude/g-merge-queue-strict-relax-t51cn4`)의 것으로, 그 PR 본문이 이 세션과 **거의 동일한 게이트 clear + \"HARN-90\" 등재**를 시도한 흔적이 있다(제목: \"자동 재동기화가 처음 돌았고, 결함 2개가 드러났다\"). main에는 이미 이 세션의 HARN-90(resync-summary-cause-attribution)이 병합돼 있어, 그쪽이 main을 받으면 번호 재배정이 필요할 수 있다. 그 PR은 이 세션이 열지 않았으므로 개입하지 않는다 — 병렬 세션 규약(1 세션 = 1 도메인)에 따라 해당 세션의 몫으로 남긴다."
  - "⑫ **대상 선별 결함(HARN-99)을 depends_on으로 집행 — 그 근거의 범위 정정 (PR #1063 Codex P1 수용 · 2026-09-10)**\n\n[지적] HARN-99(구 HARN-90)의 notes가 \"실행 순서상 그쪽이 먼저인 것이 합리적이지만 대장 차원의 의존은 아니다\"라고 산문으로만 적었다. priority는 순서 제약이 아니고 selector는 notes를 읽지 않으므로, 그 상태에서는 HARN-99가 미완인 채로 이 태스크가 착수 후보로 노출된다. 대장과 그 CLI가 이 저장소의 일정 정본이다.\n\n[수용 — 다만 근거는 좁힌다] 의존 부착에는 동의하되, 지적이 든 이유(\"UNKNOWN 후보가 update-branch에 닿기 전까지 라이브 측정이 무의미하다\")는 **그 리뷰 시점(2026-09-08 05:29Z · commit 9af8fdf) 이후의 실측으로 반증됐다.** ⑩⑪이 기록한 run 34208186818(09:06:47Z)은 같은 실행에서 PR 3건을 실제로 최신화했고(요약: 스캔 20건 · BEHIND+auto-merge 3건 · 최신화 3건 · 미판정 2건), 그 결과 ①(토큰 재발화)과 ②(경합 하 무개입 머지)는 HARN-99 없이 이미 답변됐다. 즉 UNKNOWN은 **전건 차단이 아니라 부분 누락**이다.\n\n[그래서 실제 근거] 남은 축이 표본 위에서 판정되기 때문이다. ③은 (a)재동기화 발생 건수 (b)그로 인한 CI 실행 증가분을 세어 주기를 조정·유지한다고 적었고, ⑤는 실효 주기의 중앙값·최대 간격을 낸다고 적었다. 선별이 UNKNOWN에서 새는 동안 이 값들은 **체계적으로 과소집계**되며, HARN-99가 착지하면 같은 관측이 다른 수를 낸다 — 그 위에서 내린 \"주기 유지\" 판정은 재현되지 않는다. 그러므로 의존은 ①②가 아니라 **③⑤를 위한 것**이다.\n\n[집행] `backlog.py amend HARN-87-pr-auto-resync-live-measurement --depends HARN-99-auto-resync-merge-state-unknown`. HARN-99 notes의 \"대장 차원의 의존은 아니다\" 문장은 같은 날 `--notes-replace`로 정정했다."
