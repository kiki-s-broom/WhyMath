  GOLD-25가 계약 3에서 중첩 스킵을 실측했다 — 소스 whymath_backend.l4(패키지)가 금지 대상 l4.subject_adapter_math의 상위 패키지라 import-linter가 그 쌍을 건너린다(as_packages 기본 True + _modules_overlap). 그래서 l4 CORE 모듈이 어댑터를 import해도 KEPT·exit 0(M3b). 보정 형태(95모듈 열거 + as_packages=false)는 저장소 밖 임시 config로 주입 시 BROKEN, 주입 없이 exit 0임을 확인했다.

