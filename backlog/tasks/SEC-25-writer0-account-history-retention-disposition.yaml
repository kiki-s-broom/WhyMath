acceptance:
  - "① 실측 재확인 — `user_track_history`(`UserTrackHistory`)·`user_persona_history`(`UserPersonaHistory`)의 writer가 판정 시점에도 0건인지 다시 센다. 2026-10-02 SEC-41 실측은 `schema/` 변환 seam 외에 모델을 참조하는 쓰기 경로가 없었다(\"내가 찾은 방법으로 0건\" — 범위: `src/backend/whymath_backend` 전수 grep, 모델·erasure·export·retention 제외). 부재 판정은 시점에 종속되므로 근거 커밋 해시를 함께 적는다."
  - "② 처분 — writer가 여전히 0건이면 좌석 폐기 또는 보류를 판정한다(`ARCH-51`의 `user_state_snapshot` 처분이 선례). writer가 생겼거나 생길 예정이면 `privacy/retention.py`의 `_RETENTION_PLAN`에 편입(기준 컬럼 `changed_at`·`detected_at`)하거나 사유 있는 영구 제외로 확정한다. 보존 연한이 법령 판단이면 연한을 코드가 정하지 않고 MGMT-02 회신 대기로 명시한다(CLAUDE.md 「법령 유래 절차의 기계 대체 금지」)."
  - "③ 해소 시 `privacy/retention.py`의 `_RETENTION_PLAN_EXEMPTIONS`와 `_RETENTION_PLAN_EXEMPTION_EXPIRY`에서 두 테이블 항목을 걷는다. 걷지 않은 채 이 태스크가 done·cancelled가 되면 SEC-41이 신설한 만료 가드(`tests/backend/privacy/test_retention_plan_completeness.py`)가 RED를 낸다 — 처분을 구현하는 사람이 항목을 걷는 것이 해소의 정의다."
