notes: "SEC-41 파생(2026-10-02 · 판정 기준 main `a05eb49a`). SEC-41이 보존 파기 완전성 가드를 신설하며 기존 사유 없던 제외 목록에 사유를 붙이는 과정에서, 이 두 테이블은 \"설계상 영구 제외\"가 아니라 \"writer 0이라 보존할 행이 아직 없다\"가 유일한 정직한 사유임을 확인했다. 그 사유는 writer가 생기는 순간 거짓이 되는데 이를 알려 주는 장치가 없어, 임시 제외로 등재하고 이 태스크를 해소 태스크로 묶었다. `user_state_snapshot`은 같은 상태이지만 소유 태스크 `ARCH-51`이 이미 있어 그쪽에 묶었다."
