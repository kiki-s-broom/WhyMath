  - "① G-eos-g4(12/13) 조건 5개를 main 기준으로 실측해 한 문서에 남긴다 — docs/reviews/eos_g4_measurement_2026-12.md. 조건: 누적 ≥60 CU(A6 30 + A4 30) · 자동검증 1차 통과율 ≥70%(Wilson 단측 하한 병기) · A6 깊이앵커 무개입 루프 3연속(Phase 3 Gate A와 동일 회차) · 내부 테스트 계정 표본 ≥20건(실사용자 아님을 명시 · EOS-135) · P0 결함 0.\n② 문서 상단에 판정 기준 main 커밋 해시를 박는다. 조건마다 값·근거 경로(파일·명령 출력)·측정 시각을 적는다. 측정하지 못한 조건은 '측정 실패'로 적고 PASS로 계상하지 않는다.\n③ 'P0 결함'을 무엇으로 세는지 출처를 명시한다. 저장소에 정해진 출처가 없으면 세는 방법을 정하지 말고 Kiki에게 확인한다.\n④ 이 문서는 판정문이 아니다 — clear 요청이나 verdict 기록은 Kiki 몫이다(에이전트가 --as kiki로 대행하지 않는다)."
  - "⑤ 정정(2026-10-30 독립 검토): 자동검증 1차 통과율의 판정 형식은 Wilson 단측 95% 하한 ≥ 0.70이다(점추정 판정 금지 · CLAUDE.md 검증 권위). 점추정은 참고로만 적는다.\n⑥ 정정(2026-10-30 독립 검토): ADR-007은 무개입 루프 앵커를 \"A6 깊이앵커\"라고 적지만 앵커 레지스트리(data/corpus/eos_anchor_set_v1/anchors.yaml)는 depth: true가 A4뿐이다(A6은 false). 측정 문서에 이 불일치를 그대로 적고 어느 쪽을 정본으로 쓸지 Kiki께 확인한다.\n⑦ 정정(2026-10-30 독립 검토): G4 조건 중 \"무개입 루프 3연속\"과 \"내부 테스트 계정 표본 ≥20\"을 생산하는 태스크는 이 사슬에 없다 — 루프는 Phase 3 Gate A와 같은 회차(P3-17 판정)에서 나오므로 G-eos-g4가 P3-17을 입력으로 기다린다. 테스트 계정 표본의 생산 경로가 없으면 측정 실패로 적는다."
