  - "① 6곳(`l3/cross_verify.py:768`·`l3/multi_solution.py:782`·`l3/pedagogy/analogy_generator.py:355`·`l3/pedagogy/explanation_generator.py:245`·`l3/queue/tasks.py:135`·`ops/live_preflight.py:267`)이 각각 실제로 어느 좌석으로 클라우드를 부르는지 판정한다 — 꽂힌 provider에서 읽는 `served_cloud_seat`(ARCH-64) 또는 `llm_generator`의 방식. LOCAL 전용 경로(비동기 큐 워커 — QUALITY는 로컬이라 클라우드 결정이 안 온다는 근거 확인)는 판정만 남기고 호출은 명시해도 무방하다. 판정 없이 일괄 치환하지 않는다.\n② 좌석을 명시한다. 미상(None)은 anthropic으로 접지 않고 '미측정'으로 남긴다(CLAUDE.md '모른다 ≠ 아니다'). 같은 좌석을 trace의 `cloud_seat`에도 싣는다.\n③ 집행 지점(정본화와 별항) — `actual_cost_usd`·`actual_cost_usd_or_none`·`actual_cost_krw` 호출은 `seat` 키워드를 반드시 명시한다는 것을 AST 소스 스캔 테스트로 동결한다. 신규 호출이 좌석을 생략하면 red. 주입 RED(좌석 생략 복원)와 대조군을 함께 넣는다.\n④ 영향 판정 — 이미 적재된 trace·생성 로그의 과대 계상은 소급 정정하지 않는다. 대신 어느 기간·어느 경로가 영향을 받았을 수 있는지 범위를 판정문에 남긴다. 특히 OPS-105가 의도적으로 표지를 달지 않은 저작 생성기들의 `cost_krw`는 `cost_report`가 '미표기'로 게이트② 표본에 기본 포함하므로(strict-surface 미사용 시) 표본 원가를 부풀렸을 수 있다 — 라이브 데이터가 없으면 '미측정'으로 적는다.\n⑤ 범위 밖 — 학생 대면 파이프라인(`l3/pipeline.py`)은 이미 좌석을 명시한다. 단가표 값 자체와 `SERVING_CLOUD_SEAT` 기본값은 건드리지 않는다."
