acceptance:
  - "① 현상 재확인 — 승인 문항 12건의 오답 보기가 카탈로그 kebab이 아니라 M-id(M0674)를 그대로 가리킨다. P3-02 계측기(phase3_coverage._reached_misconceptions)는 M-id 형태를 그대로 '닿음'으로 세지만, 서빙 경로(distractor_link_matches)는 CATALOG_BY_ID에 없는 id를 조용히 버려 후보가 0건이다. 측정은 연결됐다고 말하고 서빙은 아무것도 안 하는 구간이다(오답 보기 선택 378건 중 12건).\n② P3-44 acceptance ②의 '02-06은 M0674를 직접 기입했는데도 미충족' 원인 규명에 이 발견을 연결한다 — 이 태스크는 P3-44를 대체하지 않고 입력만 준다.\n③ 처분 선택지를 적는다: 계측기가 raw M-id를 닿음으로 세지 않게 정렬 / 서빙이 raw M-id를 크로스워크 역방향으로 해소 / 문항 오답 보기를 kebab으로 교체(승인 문항 수정이라 재승인 경로 필요 — P3-44 ④). 크로스워크 신설은 Kiki 서명이 필요하므로 세션이 대신 정하지 않는다.\n④ 변별력 — raw M-id 보기를 하나 주입했을 때 계측 수치와 서빙 후보가 같은 방향으로 움직이는지 확인한다(둘이 어긋나는 상태가 재발하지 않게)."
  - "⑤ [정정 2026-10-18 · 착수 결과] ①~④ 이행 - 정본 docs/reviews/p3_57_raw_mid_distractor_parity_2026-10-18.md (판정 기준 main d33ab2e4). (가) 현상 재확인: 승인 문항 236건의 오답 보기 378건 중 366건은 계측기 닿음과 서빙 후보가 일치하고 12건(전부 M0674, 개념 02-06, 유형 solve-for-unknown, problem_bank_p3_calculus1_diff_v0)은 계측기 닿음 O / 서빙 후보 X로 갈라진다. 같은 보기를 해석하는 곳은 세 곳이다 - 계측기(L1, M-id를 정규식만 보고 셈 - 코퍼스에 없는 M9999도 셈), 발행 게이트(L3, DB 카탈로그로 실재 확인 - 코드를 읽은 것이고 DB 실행 확인은 못 했다), 서빙(L4, kebab 키 카탈로그 68건만 보고 M-id 경로 없음). 좌석이 있는 M0671도 raw로 적으면 서빙이 버린다. (나) P3-44 연결: P3-44 9-나의 계측기 쪽 막힘(문제유형이 스킬과 안 겹침)과 이 태스크의 서빙 쪽 막힘(id 이름표 불일치)은 같은 12건에 대한 독립된 두 막힘이다. P3-44 10-1이 기존 은행 제자리 수정을 금지하므로 보기를 kebab으로 고치는 길은 닫혀 있다. P3-61은 kebab을 신설하지만 문항에 적힌 것은 raw M0674라서 P3-61만으로는 12건이 서빙되지 않는다(추론 - 좌석 있는 M0671 raw가 버려진다는 실측이 근거). (다) 처분 선택지와 실측 영향: 계측기가 raw M-id를 세지 않게 하면 슬롯 60/60이 59/60, 문항 메타 7필드 적격 1121건 중 12건이 오개념 서명 비어 있음으로 바뀐다(Graph Connectivity는 5/10 그대로). 선택지 A 계측기 정렬 / B 서빙 별칭 해소(오늘은 0건, P3-61과 서명 뒤에만 효과) / C 보기 교체(닫힘) / D 고정(완료). 세션 권고 = B+A를 한 쌍으로 P3-61 이후에. 결정은 Kiki 게이트 G-p357-raw-mid-distractor-disposition. (라) 변별력과 재발 방지: tests/backend/ops/test_phase3_measure_serve_parity.py - 보기 id 형태 5종 표(일치 2 / 갈라짐 3), 실 코퍼스 어긋남 래칫 {M0674: 12}(분모는 리포트 378과 동일), 주입 탐지, 무어긋남 대조군, 담당 태스크(P3-61) done 시 RED인 만료. 주입 5종 전건 의도한 테스트가 RED(적용 단언과 원복 sha256 일치 확인). 집행(처분 A/B)은 이 태스크가 하지 않았다 - 게이트 판정 뒤 집행 태스크를 등재하고 테스트의 담당 태스크 상수를 그 id로 바꾼다."
