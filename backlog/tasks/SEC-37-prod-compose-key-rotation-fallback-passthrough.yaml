id: SEC-37-prod-compose-key-rotation-fallback-passthrough
title: "운영 compose가 암호화 키 회전용 복호 fallback 변수(*_DECRYPTION_FALLBACK_KEYS)를 넘기지 않는다 — 운영에서 키 회전이 곧 lockout"
track: math-completion
