acceptance:
  - "① 실측 사실(2026-09-30 · 판정 기준 main `270968a2` · 이 검색 방법 기준) — '포기'(문제를 풀다 떠남)를 뜻하는 신호가 코치 경로(`api/coach.py`)와 모바일 `lib/` 어디에도 없다(`포기`·`abandon`·`give_up` 검색 0건). 대화 세션(`dialogue`)은 완료(`attempt_id` 링크)와 미완료만 구분하고, 미완료 세션이 '진행 중'인지 '떠난 것'인지 알 방법이 없다. EOS-146(가)는 서버가 검증으로 판정한 명확한 오답 제출만 원장에 적재하므로, 오답을 한 번도 제출하지 않고 떠난 학생은 여전히 어떤 이벤트도 남기지 않는다."
  - "② 처분 판정 선행 — '무엇을 포기로 볼 것인가'가 먼저다. 후보: (가) 앱에 '모르겠어요/건너뛰기'를 명시 신호로 두고 그 요청을 받는다(학생 의사가 명확하나 UI·메타인지 표현 설계가 든다) (나) 미완료 대화가 N분 유휴이면 서버가 포기로 간주한다(UI 변경 0이나 '생각하는 중'과 구별되지 않는다 — 모른다 ≠ 아니다) (다) 포기를 이벤트로 세지 않고 '미완료 대화 수'만 관측 지표로 둔다. 어느 쪽이든 학생을 낙인찍는 표현·게임화 금지 원칙(부정 피드백 강화 금지)과 R6(원인 미상 오답)에 포기를 오답 1건으로 접어 넣을지가 교수학 판정이다. 결정 없이 구현하지 않는다 — 착수하는 세션이 결정 게이트를 `backlog.py gates add`로 등재한 뒤 멈춘다(산문 선행 금지)."
  - "③ 경계 — EOS-146(가)가 만드는 '오답 적재 → 상태 머신' 경로를 재사용한다(중복 구현 0). R5 연속 오답의 범위(개념 무관·시간 창 부재)는 EOS-145 소유이며 이 태스크가 바꾸지 않는다. 포기가 오답과 같은 카운트에 들어가면 R5 임계(3)가 더 빨리 걸리므로, 카운트에 넣는 결정을 하면 EOS-145의 판정과 함께 본다."
