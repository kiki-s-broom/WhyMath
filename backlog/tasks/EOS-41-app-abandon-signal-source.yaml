notes: "출처: G-eos146-disposition 결정(2026-09-30 · 세션 사용자) — (가) 문제당 최초 오답 1건을 택하면서 '포기'는 이번 처분에서 제외하고 별도 태스크로 분리하기로 했다. 등급 P2 근거: Release Gate A(답안 → 채점 → 오개념 → 보정)는 오답 원천만으로 성립하고 포기는 우회 가능하다. 재판정은 `amend --eos-priority`."
