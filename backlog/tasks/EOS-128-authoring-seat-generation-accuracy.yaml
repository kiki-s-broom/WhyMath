notes: "등재 경위(2026-09-20): EOS-121 라이브 회차(180호출) 집행 중 부수로 드러났다. 그 회차의 목표는 다양성 축이었고 판정은 `docs/ops/eos121_seat_generation_diversity_verdict.md`가 소유한다 — 이 태스크는 **같은 회차에서 같이 나왔지만 아무도 소유하지 않은 축**이다. 채팅·PR 본문에만 남기면 만료 없는 유예가 되므로(CLAUDE.md) 소유자를 만든다.\n\n왜 별건인가: 다양성 결함은 \"같은 것을 또 만든다\"이고 처방이 샘플링·프롬프트 다양화다. 정확성 결함은 \"틀린 것을 만든다(또는 옳은 것을 틀리게 표현한다)\"이고 처방이 검산 계약 또는 생성 지시다. 두 축은 원인도 처방도 겹치지 않는다.\n\n**depends_on을 비워 둔 이유(명시)**: 이 태스크가 쓸 증거 파일(`.eos121-out/anthropic.review.jsonl`)은 **이미 생성돼 있다**. 다양성 축 태스크의 종결 여부와 무관하므로 그것을 의존으로 걸면 실재하지 않는 차단이 생기며, `depends_on`을 비워 두는 것이 정확한 상태 표현이다. 다만 판정 서술이 판정문을 인용하므로 그 문서가 main에 있는지 착수 세션이 먼저 확인한다(2026-09-20 현재 `e91a75d3`에 있다).\n\n측정 한계 승계: 판정문 「정직한 한계」가 이 축에도 그대로 걸린다 — 각 좌석 1회차 · 단일 성취기준 `[10공수1-02-02]`·이차방정식 한정 · `top_p` 미통제(대칭이되 통제되지 않음). 따라서 \"anthropic이 산술에 약하다\"로 일반화하지 않는다. 확정된 것은 *이 워크로드에서 이 좌석이 이 spec을 전건 거부당했다*이다.\n\n주의: 이 태스크도 ARCH-56의 발동 조건 ⓐ(학생 대면 또는 상시 배치 트래픽 투입)를 건드리지 않는다."
