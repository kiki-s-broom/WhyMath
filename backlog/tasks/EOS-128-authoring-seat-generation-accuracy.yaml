acceptance:
  - "① 실측 근거 고정 (EOS-121 라이브 회차 `6ea0b38ab0f840e5b70bae6b1ba7dd77` · 판정 기준 main `217119dc` · 2026-09-20 Phaiakes9) — anthropic 좌석 90호출 중 `rejected_gate` 30건이고 **전건 `quad-sum` spec**이다(`quad-largest`·`quad-smallest`는 각 0건). 사유는 다양성이 아니라 검산 실패다: `정확성 실패 — Tier1 답 검산 fail: 조건 위반 — 잔차 ≠ 0: -6`(`l3/equivalent/acceptance.py:357` ← `l3/verify_answer.py:392` — 단일 조건·자유변수 전건 치환된 직접 수치 평가 분기). 같은 회차 openrouter는 같은 spec에서 수용 14·게이트 거부 0이고, 그 좌석의 실패는 **생성 단계**에 몰린다(`generation_failed` 8건 = conditions DSL 위반). **30/30은 우연이 아니라 체계적**이며 그것이 이 태스크의 존재 이유다. 근거 문서 = `docs/ops/eos121_seat_generation_diversity_verdict.md`."
  - "② 첫 행위는 재측정이 아니라 **회수**다 — 거부된 30건의 본문은 이미 영속돼 있다. `.eos121-out/anthropic.review.jsonl`의 `ReviewQueueEntry` 행이 `candidate_payload`(문항·정답·해설·**검산 조건** 전문 = 코퍼스 레코드 동일 직렬화)와 `spec_id`·`reasons`를 담는다(`harness/needs_review_worklist.py:163-202`). `.genlog.jsonl`은 입력 스냅샷만 있고 **출력이 없으므로** 거기서는 규명되지 않는다. 그 파일은 Phaiakes9의 gitignore 폴더에만 있으므로 회수에 Kiki 회신이 필요하고, 착수 세션이 그 회신을 게이트 또는 런북 블록으로 등재한다. **회수 전에 유료 회차를 계획하면 180호출을 또 태운다.**"
  - "③ 두 가설을 전수 분류로 가른다 — ⓐ **모델 산술 오류**(문항도 답도 틀렸다) ⓑ **표현 불일치**(문항은 옳은데 `conditions`가 구속하는 것과 `answer`가 가리키는 것이 다르다 — 발문은 \"두 근의 합\"을 묻는데 `conditions`가 `x`를 근으로 구속하고 `answer`가 그 합을 `x`에 담으면 잔차는 당연히 0이 아니다). **ⓑ라면 거부된 문항의 상당수가 교육적으로 멀쩡하고 결함은 검산 계약이 파생량 답을 표현하지 못하는 쪽에 있으며, 처방이 정반대가 된다**(프롬프트 교정 vs 검산 계약 확장). 판정은 인상이 아니라 회수한 30건 전수 분류로 하고 ⓐ/ⓑ/판정불가 건수를 낸다. **EOS-121 판정문의 \"수학적으로 틀린 문제를 만들었다\"는 이 분류 이전의 추론이므로, 이 항이 그것을 확정하거나 정정한다** — 판정문은 같은 PR에서 이미 범위를 낮춰 적었다."
  - "④ 교락(confounding)을 인지하고 가른다 — `quad-sum`은 셋 중 **유일하게 난이도 3.5**이고 **유일하게 파생량(두 근의 합)을 묻는다**. 나머지 둘은 근 자체를 묻고 난이도 2.5·3.0이다. 즉 **spec 축·난이도 축·답 종류 축이 교락**돼 있어 이 회차만으로는 \"어려워서\"인지 \"파생량이라서\"인지 가를 수 없다. 가르려면 ⓐ 근을 묻는 난이도 3.5 spec ⓑ 파생량을 묻는 난이도 2.5 spec을 추가해 **좌석당 15회씩**만 돌린다 — 30/30과 0/30을 가르는 데 그 이상의 정밀도는 필요 없고, ③의 분류가 ⓑ로 나오면 이 회차 자체가 불요해질 수 있으므로 **③ 다음에 판단한다**."
  - "⑤ 처방은 분류 뒤에 — ⓑ면 검산 계약 축(`l3/verify_answer.py`·`l3/equivalent/acceptance.py`가 파생량 답을 표현·검증할 수 있는가), ⓐ면 프롬프트·spec 축(저작 프롬프트가 `conditions`와 `answer`의 관계를 무엇으로 지시하는가). **미분류 상태에서 코드부터 고치지 않는다** — 어느 쪽이든 고치면 다른 쪽에서 무증상 오검이 된다. 처방이 코드 변경을 부르면 그 변경은 **실패 주입으로 변별력을 증명**한 뒤에만 보호로 친다(CLAUDE.md)."
  - "⑥ 검산 레일이 작동한 것은 확정된 사실이고 이 태스크의 대상이 아니다 — 거부된 30건은 **코퍼스에 한 건도 들어가지 않았다**(`accepted_stored` 0). 이 태스크가 다루는 것은 레일의 실패가 아니라 **좌석의 산출 품질**이다. 레일 신설·강화는 범위 밖이다."
  - "⑦ 파급 — 좌석 선택 판정의 재료다. EOS-121이 *다양성* 축에서 anthropic 열위를 판정했는데(회차 내 중복률 2.43배), **정확성 축의 격차가 더 크다**(게이트 거부 33.3% vs 2.2% = 15배). 더 중요한 것은 **실패 양식이 다르다**는 것이다 — openrouter는 형식을 틀려 생성 단계에서 죽고, anthropic은 형식은 맞히는데 검산에서 죽는다. **후자는 검산 레일이 없는 경로에서는 통과한다.** `ARCH-55` 4회차 비용 비교와 `ARCH-56` 상시 채택 판정(게이트 `G-arch56-availability-trigger`)에 다양성 축과 **함께** 병기한다. 이 태스크 자체는 채택 결정이 아니다."
  - "⑧ 범위 밖 — 다양성 축 재측정(EOS-121 소유) · 좌석 채택·교체 결정(ARCH-56) · `embedding_near` 검출기 배선(EOS-121 판정문 한계 절) · `top_p` 통제(Anthropic API가 `temperature`와의 동시 지정을 거부하므로 구조적 불가 — PR #1225에서 철회) · 검산 레일 신설."
