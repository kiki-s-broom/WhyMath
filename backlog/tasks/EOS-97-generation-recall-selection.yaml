acceptance:
  - "① 조인 축 확정 — GenerationLog에 run_id를 신설하거나 기존 cu_slug 조인 설계를 확정한다. 어느 쪽이든 '이 배치·이 프롬프트 버전·이 모델로 만든 산출물'을 **기계가 특정할 수 있어야** 한다. 실측: run_id는 AccumulateReport·ReviewQueueEntry에만 있고 GenerationLog와 조인 축이 아니다"
  - "② 선별 조회 CLI — run_id·prompt_version·model_name·seed 중 하나로 산출물을 열거한다(--json). **절단 금지** — 전건 모드를 제공하고 상위 N건만 내는 기본값이 있으면 분모를 함께 낸다(CLAUDE.md 절단 출력 부재 판정 축)"
  - "③ 처분 — 열거분을 격리로 넘기거나 재생성 대상 목록을 산출한다. **격리 경로는 신설하지 않는다** — 이미 실재한다(PATCH /v1/problems/{id} · RequireContentAdmin · review_status+quarantine_reason+quarantined_at 3필드 동시 기입 · problem_quarantine_contract.md §5). 그 계약 §138이 전용 격리 엔드포인트를 의도적으로 미채택했으므로 표면을 늘리지 말고 기존 PATCH를 호출한다. **dry-run 기본**이며 실제 처분은 명시 플래그로만"
  - "④ 집행 별항(정본화≠집행) — 조회 원천이 genlog JSONL 사이드카인지 DB GenerationLog인지 명기한다. 현행은 **DB 직접 조회 모드가 미구현**이고 hit_cu_metrics docstring이 이를 '정직한 공백'으로 자인한다. 둘 다 지원하지 않으면 어느 쪽을 지원하는지 적는다"
  - "⑤ 변별력 양방향 실측 — 특정 해시로 만든 산출물 N건을 주입한 뒤 **그 N건만 정확히** 열거되는지 과다·과소 양방향으로 확인한다. 무관한 산출물이 섞이거나 대상이 빠지면 리콜은 오히려 위험하다"
