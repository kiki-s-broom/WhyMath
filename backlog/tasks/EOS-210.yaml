  - "① 힌트 정답 누설의 사람 판정 기록 좌석을 만든다 — 두 용도: (가) 기계 판정 불가 힌트(`ops/g3_content_measures`의 L1·L2 사람 폴백 · 짧은 정답의 글자 축 유보 등)의 판정 (나) 의미적 누설 표본 검수(`docs/standards/eos_verification_design_v1.md` §5 F-Ⅴ \"자동 검사 밖\" · §6 \"전수 자동 + LLM 심판 + 인간 30건\"). 판정 기록은 hint_id·판정자·일시·판정(누설/아님)·근거를 갖는다(헌법 R2-03 게이트 기록 4요건) ② 측정 CLI(`ops/g3_content_measures`)가 그 기록을 읽어 기계 판정 불가 힌트의 UNDECIDED를 해소하고, 의미 축(`HINT_SEMANTIC_AXIS`)을 표본 크기·누설 건수·Wilson 상한으로 낸다 — 표본이 30건 미만이면 측정 불가로 낸다(0건 통과 위장 금지) ③ 사람 판정은 기계 판정을 대체하지 않는다 — 기계가 누설로 판정한 힌트는 사람 판정과 무관하게 누설이며, 어긋나면 둘 다 보존하고 어긋남을 센다(EOS-207 ③ 선례) ④ 검수 도구가 사람 판정 입력 전에 기계 판정을 보여주지 않는다(헌법 R19-01)"
