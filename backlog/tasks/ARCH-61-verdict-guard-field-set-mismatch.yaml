  - "① 정정: `tests/backend/db/test_assessment_result_verdict_premise.py`의 `_ALLOWED_IMPORTERS` 중 `l2/learning_event_trace.py` 항목 주석이 재판정 트리거 3의 미발동 근거로 **예측 5필드**(`estimated_grade`·`estimated_score`·`estimated_percentile`·`target_university_id`·`admission_probability`)를 지목한다. 그러나 정본 `docs/architecture/canonical_entity_model_v1.md` §3-C가 트리거 2·3에서 말하는 \"5필드\"는 **JSONB 진단 5필드**(`concept_diagnosis`·`pattern_diagnosis`·`weak_points`·`strong_points`·`recommended_path`)다. 주석의 근거 문장을 정본 집합으로 바꾼다"
  - "② 결론 불변 확인 후 명기: 그 모듈이 JSONB 5필드도 읽지 않는다는 것을 실측하고 주석에 적는다(2026-09-21 실측 — 읽는 컬럼은 `started_at`·`completed_at`·`assessment_type` 3종뿐이고 `select(Assessment)`는 시간선 투영용 조회 1곳). 즉 판정 결론은 바뀌지 않으며 이 태스크는 **근거 문장의 정정**이지 판정 변경이 아니다"
  - "③ 전수 대조: 같은 파일 허용목록의 나머지 항목(`db/models/__init__.py`·`api/me.py`·`privacy/erasure.py`·`privacy/export.py`·`privacy/retention.py`·`harness/assessment_seat_reach_report.py`) 사유 문장도 \"5필드\"를 어느 집합으로 쓰는지 대조한다. 한 건만 고치고 나머지가 같은 혼동을 담고 있으면 정정이 아니다. 대조 결과를 0건이라도 적는다(CLAUDE.md 부재 판정 절차 — 검색 범위 명시)"
  - "④ 회귀 방지 장치: 두 집합의 혼동이 재발하지 않도록 JSONB 5필드 집합을 이 파일의 명시 상수로 올리거나(예: `_JSONB_RESULT_FIELDS`) 정본 §3-C 문면과 대조하는 검사를 둔다. **단 장치를 만들면 실패 주입으로 RED를 먼저 확인한 뒤에만 보호로 계상한다** — 정상 입력에서 초록인 것은 보호의 증거가 아니다(CLAUDE.md 보호 장치 실패 주입). 주입은 \"정본의 5필드 목록을 예측 필드로 바꿔치기\" 1종 이상을 포함한다"
  - "⑤ 범위 밖(명시): `ARCH-38` '혼입 유지' 판정 자체는 건드리지 않는다. 재판정 트리거 3종은 2026-09-21 조기 실측에서 **전건 미발동**이었고(트리거1 가드 5건 통과 · 트리거2 5필드 속성대입 0건·`update(Assessment)` 0건 · 트리거3 서빙 소비 reader 0건·`ASM-11` status=todo), 재판정 착수는 게이트 `G-arch38-verdict-recheck`와 `ARCH-40`이 소유한다. 이 태스크가 그 게이트를 닫거나 앞당기지 않는다"
