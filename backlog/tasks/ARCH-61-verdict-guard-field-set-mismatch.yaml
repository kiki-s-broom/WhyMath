notes: "출처: 2026-09-21 게이트 `G-arch38-verdict-recheck`의 조기 실측 중 발견(판정 기준 main `3d534dcc`). 게이트의 재확인 지점은 2026-10-26이라 아직 35일 남았고, 그 사전 정보를 모으다 가드 주석의 근거 지목 오류가 드러났다.\n\n왜 사소하지 않은가: CLAUDE.md \"가드가 *막는다*는 주장도 주입으로 검증한다\"(2026-09-06)가 겨냥하는 형태다 — 차단·미발동의 **근거를 틀리게 지목**하면 그 문장을 믿고 판단하는 다음 세션이 어긋난 결론을 낸다. 여기서는 두 집합이 우연히 같은 결론(\"그 모듈은 안 읽는다\")을 내므로 지금 당장의 오판은 없지만, 근거와 결론이 서로 다른 것을 가리키는 상태 자체가 재확인 가드의 신뢰를 깎는다. 특히 이 파일은 `ARCH-38` 판정의 **자동 축 전부**를 지는 유일한 가드다.\n\n함께 기록(고치지 않고 적는다 — 별건): 판정 당시(2026-09-06) §3-C가 \"`pattern_diagnosis`가 비어 있고 소비처가 없어 이 용도로 쓴다\"고 적은 것과 달리, 지금은 `POST /v1/me/assessments/assemble`(L6 블루프린트 좌석)이 이 필드에 문항 id 배열을 **실데이터로 쓴다**(`api/me.py`의 `_blueprint_pattern_diagnosis`). 행을 새로 만들며 쓰는 **생성 writer**라 재판정 트리거 2(갱신 writer)는 미발동이지만, 그 배열을 되읽어 무엇을 낼지 결정하는 코드가 생기면 **트리거 3이 발동**한다. 2026-10-26 재확인 때 볼 감시 대상이 하나 늘었다는 사실을 `ARCH-40`·게이트 판정자가 알아야 한다.\n\n측정 범위(명시): 이 컨테이너에는 sqlalchemy가 없어 백엔드 전체 스위트를 돌리지 못했다. 해당 가드는 순수 AST라 `--noconftest`로 실행해 5건 통과(exit 0)를 확인했고, 트리거 2·3은 세션이 별도 AST 스캔·grep으로 잰 값이지 CI 게이트의 판정이 아니다."
