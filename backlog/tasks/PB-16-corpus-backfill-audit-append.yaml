title: "코퍼스 단위 review_status 백필이 재실행 때 감사로그를 덮어쓴다 — 고정 코퍼스에 레코드를 더하고 다시 돌리면 이전 각인 기록이 감사 파일에서 사라져 승격 게이트가 그 레코드를 손각인 의심으로 읽는다"
