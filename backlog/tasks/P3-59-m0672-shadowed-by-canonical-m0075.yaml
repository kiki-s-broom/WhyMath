  - "① 현상 — 핵심 오개념 M0075와 M0672는 같은 kebab(product-rule-naive)을 공유한다. 승인 크로스워크에서 M0075가 직접매핑 0.97, M0672가 직접매핑 0.85라 canonical 선정(select_canonical: strict 최대 단독)이 M0075만 고른다. 그래서 학생이 [12미적Ⅰ-02-04]의 곱의 미분 오답을 해도 리포트의 오개념 id는 M0075(02-01)로 나가고 M0672는 도달하지 않는다. P3-06 표에서는 M0672가 shadowed로 표기된다.\n② 선택지: M0672 전용 kebab 신설(카탈로그 개수 동결 테스트 연쇄 + 크로스링크 Kiki 서명) / 두 M-id를 한 오개념으로 인정(P3-01 명세의 핵심 오개념 목록 조정 — 분모 변경이라 Kiki 결정) / 현상 유지(리포트 id 가림을 수용).\n③ 분모를 바꾸는 선택은 세션이 임의 확정하지 않는다(P3-01 acceptance ②와 같은 이유)."
