  - "① 실측 재현: diagnose('x²=2x 양변을 x로 나누면 x=2라는 풀이는 틀렸다')가 root-loss-by-dividing을 confidence 1.0(substring 양쪽 신호 '양변'·'x로 나누' 공출현)으로 반환하고 apply_match_quality_gate(top-1 floor 0.65)를 통과함을 확인한다 — 학생이 오개념을 명시적으로 부정/정정하는 문장인데도 확신 진단이 나간다. MISC-22 PR #1071 Codex P1 리뷰에서 발견됐고, 그 PR은 자신이 새로 노출시킨 5개 regex 채널만 EXPLICIT_CORRECTION_MENTION(catalog.py) 기반으로 방어했다 — 이 항목은 그 정정과 무관하게 이전부터 있던 substring 경로의 사각이라 범위 밖으로 분리됐다"
  - "② 카탈로그 전체(800+항목)에서 이 사각이 얼마나 광범위한지 실측한다 — signals(substring) 또는 regex_signals가 있는 모든 항목에 대해 'canonical_statement를 인용하며 틀렸다고 명시한 문장'을 결정론 생성해 diagnose()에 넣고 confidence>=0.65(서빙 도달) 비율을 측정하는 스크립트(anchor_detection_channel_eval.py 패턴 참고)를 작성한다. 전수 대비 비율이 나와야 '몇 건'이 아니라 '전체의 몇 %'로 우선순위를 매길 수 있다"
  - "③ 해소 방향을 정한다 — MISC-22가 도입한 EXPLICIT_CORRECTION_MENTION(catalog.py, 명시적 정정 언급 정규식)을 재사용해 root-loss-by-dividing을 포함한 대상 항목들에 refuting_regex로 부여하거나(MISC-23 선례), _match_one 자체에 전역 반박 축으로 통합하는 방안(diagnose() 시그니처·confidence 계약 변경 필요 — 영향 범위가 크므로 pedagogy-designer 검토 대상)을 저울질한다. 후자를 택하면 카탈로그 개별 부여 부담이 사라지지만 '반박 언급이 있으면 그 오개념은 절대 성립 안 함'이라는 전역 규칙이 맞는지 교수학적으로 검증해야 한다(예: 학생이 남의 오답을 인용해 비웃는 경우 등 edge case)"
  - "④ 회귀 테스트: anchor_detection_channel_eval 또는 test_misconception_diagnose.py에 이 반박 축을 동결하는 케이스를 추가한다"
