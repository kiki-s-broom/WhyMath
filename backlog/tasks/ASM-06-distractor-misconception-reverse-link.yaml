notes: "브랜치 jkwdzn의 원 ASM-04/D5 재작성. REC-02(오개념 표적 프로브 공급)가 정방향(가설→프로브 선택)만 다룸 — 이건 역방향(학생이 고른 실제 오답 인덱스→오개념 ID). 선행조건: 현재 student_answer가 자유텍스트라 '어느 보기를 골랐는지' 자체가 채점 레이어에 없음 — NLP-02 shadow 채점이 선택 인덱스를 이미 포착하는지 먼저 확인 후 스코프 확정.\n\n[차단 2026-08-11] 선행 조건 불충족 확정 + 스코프 재정의 필요 (2026-08-11 r2 §3 D4 실측). acceptance ①은 'NLP-02 shadow가 학생이 고른 MC 인덱스를 이미 포착하는지 실측 확인 — 포착 안 하면 스코프를 그에 맞게 재정의하고 착수'를 선행으로 걸었다. 실측 답 = **포착하지 않는다**. ⑴shadow(harness/attempt_grading_shadow_report.py)는 student_answer 자유텍스트를 verify_answer에 넘길 뿐 선지 개념 자체가 없다 ⑵애초에 그 shadow의 코퍼스 파생 가능 비율이 0.00%다(ASM-08). 진짜 차단 요인은 채점 권위가 아니라 AttemptSubmitRequest(api/me.py:641-657)에 선택 인덱스 슬롯이 없다는 것 — model_config가 extra='forbid'라 클라가 임의 필드를 실어 보낼 수도 없다. 재정의 방향: 요청 슬롯 selected_choice_index 신설 + 적재 + 클라 변경 + 마이그레이션으로 스코프를 다시 잡고, 사장 규모 관측(ASM-09) 착지 후 해제한다. 승계할 제약 = 오개념 reactive retrieval만(preload 금지)·오답을 오개념으로 단정 금지(distractor_map은 가설 근거)·기존 misconception_hypothesis 좌석으로 흘리고 별도 판정 경로 신설 금지(이중 진실원천)·점수/오답률 노출 금지.\n\n[정정 2026-09-01] eos_priority null → P1: 판정표 R/내용KPI — 12월 검증 관여(KPI·계약·앵커 자산). EOS-80 일괄 백필\n\n[정정 2026-09-07] 7n9n72 브랜치 단위 소유자였던 HARN-37이 done(#962)이 되어 잔여 좌석의 명시 참조가 끊김 — 2026-09-07 미머지 브랜치 감사(docs/reviews/unmerged_branch_audit_2026-09-07.md)가 좌석 태스크 본문에 고립 참조를 부착\n\n[정정 2026-09-07] stray-code 8회차 후속(#1027 §4.2 표 · #1020 머지 후 보완): 7회차가 부착한 고립 참조가 부재 파일 3종(distractor_link·테스트·alembic)만 열거해 동반 변경이 빠졌다 — 그대로 회수하면 슬롯이 없어 RED이고, alembic은 폐기 리비전에 체인돼 multiple heads가 난다. 판정 기준 main d50781b7\n\n[정정 2026-09-07] Codex P1+P2(PR #1033) 수용: ①me.py 경로만 회수하면 실제 학생 흐름(coach)에서 슬롯이 영원히 NULL이라 기능이 휴면 — 모바일이 POST /v1/me/attempts를 부르지 않음을 실측 ②acceptance 산문은 claim 시점 충돌 검출에 무력(start·overlap은 paths만 읽음)이라 paths 정정 CLI(HARN-57)를 depends_on으로 집행\n\n[정정 2026-09-21] paths ['src/backend/whymath_backend/l4/misconception/**', 'src/backend/whymath_backend/schema/problem.py'] → ['src/backend/whymath_backend/l4/misconception/**', 'src/backend/whymath_backend/schema/problem.py', 'src/backend/whymath_backend/schema/activity.py', 'src/backend/whymath_backend/schema/coach.py', 'src/backend/whymath_backend/db/models/activity.py', 'src/backend/whymath_backend/db/schema_version.py', 'src/backend/whymath_backend/api/me.py', 'src/backend/whymath_backend/api/coach.py', 'src/backend/alembic/versions/**', 'tests/backend/l4/misconception/**', 'tests/backend/api/test_me.py', 'tests/backend/api/test_coach.py', 'tests/backend/db/test_activity_orm.py', 'tests/backend/schema/test_activity.py']: acceptance 5항 집행 — 착수 전 paths 실확장 (HARN-57 amend --path 착지 후 최초 적용). 종전 paths(l4/misconception/** + schema/problem.py)가 회수 대상 동반 변경(api/me.py·api/coach.py·db/models/activity.py·schema/activity.py·db/schema_version.py·alembic 신규 리비전·모바일 선지 탭 경로)을 하나도 덮지 않아 병렬 세션에 충돌을 알리지 못하는 상태였다. 넓은 glob(api/**)은 overlap 상시 오탐을 만들므로 파일 단위로 좁혀 선언한다(HARN-57 4항 취지).\n\n[정정 2026-09-21] 착수 판정 기록 — acceptance 5항이 요구한 ⓐ/ⓑ 택일 판정과 그 근거, 그리고 고립 브랜치 구현을 그대로 회수하면 안 되는 두 축(이중 진실원천·coach attempt 경로의 구조적 불가)을 실측으로 확정해 등재"
