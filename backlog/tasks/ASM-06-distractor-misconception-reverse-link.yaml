  - "[고립 참조 보완 2026-09-07 stray-code 8회차 · 판정 기준 main d50781b7] 위 참조의 3파일만으로는 회수가 성립하지 않는다. **동반 변경 전건(main 부재 실측)**: schema/activity.py selected_choice_index 필드(int|None·ge=0) · db/models/activity.py ProblemAttempt 컬럼 · api/me.py AttemptSubmitRequest 슬롯 신설(extra=forbid라 클라가 임의 필드로 못 보냄)+적재+응답 matched_misconception_id · db/schema_version.py 리비전 등재 · l4/misconception/__init__.py resolve_misconception_from_choice export + 테스트 3파일(tests/backend/api/test_me.py 6건·tests/backend/db/test_activity_orm.py·tests/backend/schema/test_activity.py). 실측: main src에서 resolve_misconception_from_choice·matched_misconception_id 0파일, ORM·alembic의 selected_choice_index 0(유일 hit는 harness/distractor_signal_dormancy_report.py의 예약 슬롯명). **alembic 재채번 필수** — 브랜치 리비전 0afd40ce1867의 down_revision은 7ef2b5a8e69e(S3-32 구설계)인데 main은 #738에서 review_turns_remaining+attempt_id 존재 판정으로 대체하며 그 리비전을 건너뛰었다(폐기). 그대로 포트하면 multiple heads — main 단일 head c1a5e07b4d38(93 리비전·2026-09-07 실측) 위로 재채번한다. **paths 유의**: 현 paths(l4/misconception/**·schema/problem.py)가 위 파일들을 덮지 않아 착수 시 scope-drift 경고가 나면 오탐이 아니라 이 항이 명시 승인한 범위다(paths 정정 CLI는 HARN-57 소관·미착지)"
  - "[Codex P1 수용 2026-09-07 · 실측] 위 보완이 열거한 api/me.py(AttemptSubmitRequest) 경로만 회수하면 **실제 학생 흐름에서 슬롯이 영원히 NULL**이라 역방향 링크가 휴면으로 남는다. 실측: 모바일은 POST /v1/me/attempts를 **부르지 않는다**(completion_signal.dart:9,11·coach_models.dart:402가 'api/coach.py 계약 명문·중복 적재 금지'로 자인) — 선지 탭은 chat_screen.dart::_onChoiceSelected가 student_input에 **값만** 실어 coach로 보내고, ProblemAttempt는 api/coach.py::_complete_problem(ProblemAttemptORM 생성부 :1040)이 만든다. 따라서 회수 범위에 **coach 제출 경로를 포함**한다 — ⓐcoach 요청 스키마에 선택 인덱스 슬롯 신설 + _onChoiceSelected가 인덱스 동봉, 또는 ⓑ서버가 student_input 값과 선지 목록을 대조해 인덱스 파생(택1을 착수 시 판정하고 근거를 notes에 기록). **E2E 테스트로 '선지 탭 → attempt.selected_choice_index 적재 → 오개념 링크 산출'을 관통 증명**한다. me.py 경로는 API 소비자(웹·외부)용으로 함께 유지. **paths 집행 정정**: 앞 항의 'scope-drift 경고는 승인된 범위' 문면은 *다른 세션에게* 충돌을 알리지 못한다(start·overlap은 paths만 읽는다) — 그래서 이 태스크를 HARN-57(amend --path 신설)에 depends_on으로 걸었다. 착수 전에 paths를 api/**·db/models/**·schema/**·alembic/**로 실제 확장한다"
  - "[착수 판정 2026-09-21 · 회수 세션 · 판정 기준 main a71356cd] 앞 항이 요구한 ⓐ/ⓑ 택일과 회수 범위를 실측으로 확정했다. 요지는 **고립 브랜치 087859bd의 구현을 그대로 회수하면 안 된다**는 것이다 — 그 사이 main이 바뀌어 두 군데가 어긋난다.\n\n(1) ⓐ/ⓑ 판정 = **ⓐ(클라가 인덱스 동봉)**. ⓑ(서버가 student_input 값↔선지 목록 대조로 인덱스 파생)를 버린 근거: 같은 문자열을 직접 타이핑한 학생과 보기를 탭한 학생이 구분되지 않고, 중복 선지·공백 정규화 차이에서 무증상 오귀속이 난다. 화면 문자열에서 구조를 역산하는 것은 CLAUDE.md '표현 != 의미'의 정면 위반이며, 선택 인덱스는 클라이언트만 아는 사실이다(ASM-09 notes가 이미 같은 결론).\n\n(2) 브랜치 판 그대로 회수 금지 축 A — **이중 진실원천**. 브랜치는 결과를 AttemptSubmitResponse.matched_misconception_id라는 *별도 응답 필드*로 냈다. 그 시점 main에는 오개념 파이프라인이 없었으나 지금은 있다(EOS-104: _scan_attempt_misconceptions -> collect_assessment_evidence(possible_misconceptions=) -> apply_candidates). 별도 필드를 신설하면 이 태스크 notes가 금지한 '별도 판정 경로 신설'이 된다. 그래서 신규 응답 필드 0으로 구현하고, 선지 역추적 결과를 **기존 후보 집합에 합류**시켜 증거·가설 좌석으로만 흐르게 했다.\n\n(3) 브랜치 판 그대로 회수 금지 축 B — **coach attempt 경로는 구조적으로 불가**. 앞 항(Codex P1)은 'coach 제출 경로를 포함하라'고 했고 방향은 옳으나 착지점이 틀렸다. api/coach.py::_complete_problem은 서버가 정답을 확인한 순간에만 호출돼 is_correct=True만 적재한다(docstring 명문·실측). 즉 coach attempt에 인덱스를 실으면 **정답 선지만** 기록되고 역추적은 항상 None이다. coach에서 오답 선지가 실제로 남는 자리는 attempt 행이 아니라 **대화 턴**이고, 그 턴의 오개념 좌석은 _compute_matches -> _apply_hypotheses(curate_hypothesis)다. 그래서 coach 배선은 CoachRequest 슬롯 + create_session/append_turns 두 영속 경로의 가설 좌석 합류로 착지했다.\n\n(4) 채널 분리 원칙: 텍스트 채널(EOS-104)과 선지 채널(ASM-06)은 재료도 실패 모드도 달라 서로의 실행 조건이 아니다. 특히 '보기만 탭하고 아무것도 쓰지 않은 제출'은 종전에 통째로 not_run이었고 선지 채널만이 그 회차를 살린다. 품질 게이트(apply_match_quality_gate)는 채널별로 **따로** 적용한다 — 같은 호출에 섞으면 선지 후보의 높은 신뢰도가 top-1이 되어 원래 floor에서 걸러졌어야 할 약한 텍스트 후보까지 통과시킨다(게이트 1은 top-1 하나로 목록 전체를 판정).\n\n(5) 정답 회차는 선지 채널도 제외한다. 여기서 not_run을 벗어나면 호출자가 apply_candidates를 불러 '정답이 기존 가설을 감쇠시키는' 동작이 딸려 생기는데, 그 반증 비대칭은 별건 EOS-123의 소관이라 침범하지 않는다.\n\n(6) alembic 재채번 이행: 브랜치 리비전 0afd40ce1867(down 7ef2b5a8e69e, 폐기 체인)을 버리고 5b3e9c27a1f6(down d2a9e4b71c35 = 2026-09-21 실측 단일 head, EOS-112) 신규 채번. KNOWN_REVISIONS 등재 완료.\n\n(7) ASM-09 동결 테스트 반전 이행: test_real_attempt_submit_request_has_no_capture_slot이 예고대로 깨져 새 진실(has_capture_slot)로 재작성하고, 리포트 상태가 capture_slot_present_backtrace_unmeasured로 실제 뒤집혔는지 확인하는 테스트를 추가했다. 합성 슬롯없는 모델 픽스처가 프로브의 양방향 변별력을 계속 보존한다.\n\n(8) 뮤테이션 검증: 15종 주입 전건 RED(생존 0). 1회차에 코치 중복제거 절이 생존해 픽스처를 정정했다 — 중복은 가설 *행 수*를 늘리지 않고(id 키 딕셔너리로 접힘) evidence_count/reinforce를 두 번 적용하므로, 단언 축을 행 수에서 **증거 횟수**로 바꾼 뒤에야 변별력이 생겼다."
