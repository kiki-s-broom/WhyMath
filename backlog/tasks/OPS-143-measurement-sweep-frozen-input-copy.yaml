notes: "출처: OPS-136 조사(2026-10-14)에서 사고 대장 verification-tree-mutation-during-check 5회차 발생. 방해 프로세스를 깔고 측정 스크립트를 프로세스마다 기동하는 스윕이 도는 중에 대상 테스트 파일을 편집했다 — 스크립트가 그 파일을 매번 import하므로 편집 이후 기동한 프로세스는 편집본을 읽는다. 세션이 곧 알아채 수정 전 판본을 git show HEAD:로 뜬 사본(sha256 일치 확인)으로 import 경로를 바꿔 오염을 막았고 측정 로직 차이가 없어 결과는 유효했으나, 막은 것은 장치가 아니라 사람의 사후 알아챔이었다. 기존 상환 HARN-194(ci_mirror 한정)·HARN-307(검사 래퍼 셸 스크립트 한정)은 이 형태(임의 측정 스크립트의 import)를 닿지 못한다 — acceptance ③ 참조. 유실 위험은 없었다."
