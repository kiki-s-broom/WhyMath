acceptance:
  - "① 실측 전제 — problem_type_codes 채움률은 2,218/2,647(83.8%)이고 미태깅 429건은 전량 problem_bank_rephrased_v0다(전 코퍼스 순회 실측 2026-08-11). S3-27 acceptance ④가 이 429건을 '계보 미영속으로 원 생성기 추적 불가'를 사유로 명시 제외했고, 그 사유의 해소를 S4-14에 걸었다."
  - "② 차단 조건 해소 확인 — S4-14는 rephrase측을 범위에서 분리했고(notes: 'identity 설계 결정이 선행돼야 해 분리'), 그 분리분은 S4-21-rephrase-lineage-identity-decision으로 등재돼 **done**이다(identity_id 신설 + problem_relation 변형 이력 + rephrased_v0 429 소급 처리). 즉 S3-27이 유예의 근거로 삼은 '원 생성기 추적 불가'는 더 이상 성립하지 않는다. 이 태스크는 그 전제가 실제로 무너졌는지를 먼저 실측으로 확인하고(identity_id/relations로 429건의 부모 슬러그 추적이 실제 가능한지), 가능한 범위에서만 태깅한다."
  - "③ 태깅 실행 — 부모 문항의 problem_type_codes를 계보를 따라 상속한다(재서술은 봉인 모델상 수치·정답·선지 불변이므로 인지 행동 유형도 불변이라는 논거를 명문화). LLM 0·문항 텍스트 추론 0·재실행 바이트 결정론(S3-27·S3-10 백필 동형). 상속 불가 잔여분은 건수와 사유를 리포트에 명시 기록한다(침묵 통과 금지 — 부분 커버의 정직 고지 형식은 S3-27 선례 유지)."
  - "④ 계측기 회복 확인 — problem_bank_coverage.zero_coverage_types()는 docstring이 스스로 '§4-① 트리거의 발화 계측기'라고 선언한 도구다. 코퍼스의 16.2%가 미태깅인 채로는 그 계측기의 0커버 판정이 과대 계상된다. 태깅 전후로 zero_coverage_types() 결과가 어떻게 바뀌는지 기록한다 — 이것이 이 태스크의 실제 가치다(태깅 자체가 아니라 계측기 신뢰성)."
  - "⑤ 변별력 검증 — 임의 1건의 계보를 끊은 상태에서 그 건이 '상속 불가'로 정직 계상되는지 실측 후 cp 백업으로 원복(git checkout 금지)."
