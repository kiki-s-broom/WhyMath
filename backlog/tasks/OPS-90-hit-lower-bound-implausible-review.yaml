acceptance:
  - "① 비현실적으로 짧은 판정의 가시화 — hit_cu_metrics가 measured CU 중 경과가 하한 미만인 건수를 별도로 세고 리포트에 출력한다. 하한은 인자(--min-plausible-seconds)로 주되 기본값을 둔다. 그 건수가 표본의 과반이면 HIT 중앙값 줄 옆에 경고를 붙인다 — 지금은 중앙값 6초가 목표 4분을 40배 초과 달성한 성공으로만 읽힌다.\n② 게이트의 방향 대칭 — --max-median-minutes가 상한만 보므로 0초에 가까울수록 무조건 통과한다. 하한 위반이 다수일 때 게이트를 통과시킬지 말지를 결정해 집행한다(fail-closed 권장·미채택이면 사유를 docstring에 남긴다).\n③ 실패 주입으로 변별력 확인 — 하한 미만 표본을 주입해 RED를 확인하고, 정상 표본 대조군이 GREEN인 것까지 확인한다. 정상 입력에서 초록인 것은 보호의 증거가 아니다.\n④ 하한값의 근거를 적는다 — 임의의 숫자를 박지 않는다. 실측 근거(2026-09-22 회차: 중앙값 6초·P90 41초·총합 4분 6초 / 15건 전건 승인 13 반려 2)를 docstring이나 문서에 남기고, 근거 없이 고른 값이면 그렇게 밝힌다."
