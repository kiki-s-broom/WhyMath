  - "① 중복 소유 실측 확정 — P-13(SCENARIO-001~010 + CI 배선)의 처분이 두 곳에 있다. 크로스워크 `docs/strategy/plan300_phase2_backlog_crosswalk.md:240`은 `| P-13 ... | §16 | amend | PED-36 |`로 *amend*를 지정했고 같은 표의 합계줄도 \"amend 2건\"(P-13·P-15, 둘 다 PED-36)으로 센다. 그러나 2026-09-19T05:45:01Z에 세션 claude/new-session-jchdr8이 *add*로 `EOS-119-phase2-scenario-regression-suite`를 신규 등재·claim했다. 두 태스크의 acceptance가 같은 축을 문자 그대로 중복 소유한다: PED-36 ⑧(SCENARIO-001~010 정형화 10종 열거) ≡ EOS-119 ①(같은 10종 열거) · PED-36 ⑩(\"CI 상시는 현재 미충족\" + e2e-nightly가 schedule 전용) ≡ EOS-119 ③(CI 실행 실재 + 같은 e2e-nightly schedule 전용 지적). 두 세션이 독립적으로 같은 병목(.github/workflows/ci.yml의 e2e-nightly `if github.event_name == schedule`)에 도달했다.\n\n② 판정 기준 명시 — 위 대조는 main 82d43d52와 origin/claude/new-session-jchdr8 f34b7478 기준이다. EOS-119는 이 시점 **미머지**이며 로컬 대장에는 \"미존재\"로 보인다(`backlog.py claims` 출력). 즉 PED-36만 읽는 세션은 이 중복을 볼 수 없다.\n\n③ 이 태스크의 범위는 *판정*이 아니라 *해소 경로 결정 요청*이다. 세 가지 처분이 가능하고 어느 것이 옳은지는 이 태스크가 정하지 않는다: (가) EOS-119를 정본으로 두고 PED-36의 ⑧·⑩을 폐기 표시(tombstone)해 승계를 명시 — amend는 append 전용이라 삭제가 아니라 승계 표기로만 가능하다(HARN-76 ④) (나) EOS-119를 cancel하고 크로스워크대로 PED-36 amend로 수렴 (다) 축을 쪼개 EOS-119=시나리오 10종+CI 배선, PED-36=페르소나 뱅크 스키마+연속 3루프로 경계를 재선언. 어느 쪽이든 크로스워크 240행의 `amend | PED-36` 표기도 함께 정정해야 표와 대장이 어긋나지 않는다.\n\n④ 방치 시 재발 형태 — CLAUDE.md의 VIZ-03/VIZ-07 선례와 같은 \"좌석 계약이 done 태스크를 seat_owner로 지목하는 결정 불가\" 상태다. 한쪽이 done 되면 다른 쪽 acceptance가 코드 대조에 나타나지 않은 채 남는다(회수 규칙 — 존재하지 않는 코드는 대조 실패조차 내지 않는다).\n\n⑤ 이 태스크는 조사·등재 전용이다. EOS-119는 타 세션 원격 claim 상태이므로 이 태스크를 집행하는 세션은 EOS-119의 코드·대장을 건드리기 전에 claim 상태를 재확인한다(착수 순서 규칙)."
  - "[집행 결과 2026-09-28 · 판정 기준 main `a17e92c7`] ① 실측 재확인 — 등재 시점과 사실이 바뀌었다: `EOS-119`는 done(PR #1300 · 시나리오 10건 CI 통과 · 회귀 주입 10/10 RED)이고 trunk에 `tests/backend/scenarios/test_phase2_scenario_regression_suite.py`(SCENARIO-001~010 · integration 표식)가 실재한다. ③ 해소 경로는 이 태스크가 정하지 않았다 — 2026-09-19 Kiki가 이미 (다) 축 분리로 판정했고 경계(⑧·⑩ = EOS-119)가 선언돼 있었다(크로스워크 §11.6 · PED-36 ⑪ 폐기 표시 항). (나)(EOS-119 cancel)는 EOS-119 done으로 소멸. 이 태스크는 남은 집행만 했다: `PED-36` acceptance에 ⑧·⑩ 폐기 표시 추가 · 크로스워크 `P-13` 행을 `EOS-119` 신규 등재로 정정 · 집계를 신규 등재 10건 · amend 0건으로 정정 · §11.7 신설. ④ 재발 형태 해소 — PED-36의 ⑧·⑩이 완료 조건 대조에서 빠져, done 태스크를 좌석 소유자로 지목하는 결정 불가 상태가 남지 않는다. ⑤ EOS-119의 코드·대장은 건드리지 않았다(done · 원격 claim 없음)."
