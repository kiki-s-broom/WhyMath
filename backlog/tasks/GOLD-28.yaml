notes: |-
  출처: golden/RUFF_STRICTNESS_DECISION.md §7 ③ — Kiki 승인 2026-11-18. 승인 ②(S112 추가)와 ④(옛 구역 기록만)는 이 태스크와 별개다.

  왜 이 태스크인가: BLE001·S110·S112는 "예외를 삼켰는가"만 본다. 예외 없이 `return None`/`return False`로 넘기는 무음은 보지 못한다(§5 — 옛 구역 3곳). 그 축은 AST로만 잡힌다.

  경계: RS-11(G2 게이트)은 ruff 규칙 집합이고, 이 태스크는 그 집합 밖의 AST 축이다. GOLD-26(전역 select 도입 판정)과도 독립이다.

  S112 부분집합 실측(2026-11-18 · ruff 0.15.22): S112가 잡는 자리는 전부 넓은 except이라 같은 줄이 BLE001(또는 E722)에도 걸린다 — 새 검출 0건. 이 태스크는 그 축과 무관하다.

  [미러 면제 2026-11-19] 이 호스트는 Windows·Python 3.13이고 골든 pytest는 로컬 docker Postgres 5433에만 닿는다. CI 잡은 ubuntu·Python 3.12·서비스 컨테이너 Postgres 5432라 로컬 미러가 같은 판정을 내지 못한다(5432는 타 프로젝트가 점유). 같은 커밋의 실제 CI 잡 golden-path가 pass(496 passed · 신규 17건 포함)이므로 CI 증거로 대체한다. GOLD-29 선례와 같은 환경 사유.
