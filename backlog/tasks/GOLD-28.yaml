  - "① 현행 실측 — 착수 시점 main 해시를 적고, ruff 4규칙(BLE001·S110·S112·E722)이 `return None`/`return False` 무음 3곳을 잡지 못함을 명령 출력으로 보인다. 골든 구역의 현재 건수도 다시 잰다."
