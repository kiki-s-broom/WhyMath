  - "④ 주입 — 새 위반 1건과 허용 목록 불일치 1건으로 RED를 확인한다(cp 백업 → 주입 → 확인 → cp 복원, 바이트 동일 확인). 검사 대상 .py가 0개일 때 실패하는지도 확인한다."
  - "⑤ 범위 — 골든 구역만 게이트를 건다. 옛 구역은 건수 기록만 하고 코드를 고치지 않는다(골든 기간 옛 코드 읽기 전용 · 옛 구역 처분은 S74 뒤 재판정)."
