acceptance:
  - "① 프로브 14행 작성: 대표 과정(미적분Ⅰ '미분') 문항 0건 핵심 개념 7개([12미적Ⅰ-02-03]·-02-04·-02-05·-02-06·-02-08·-02-09·-02-10) 각각에 정답 행 1개와 오답 주입 행 1개(정답 값만 틀리게 바꾼 행)를 만든다. 개념별로 실제 저작 형태를 쓴다: 도함수 값·곱의 미분·접선 방정식·평균값 정리의 c값·극값 개수·방정식 실근 개수·속도/가속도.\n② 판정은 exit code로 낸다: 정답 파일이 기존 재검증 경로(harness.corpus_reverify 또는 문항 수용 게이트)에서 exit 0이고 skip 0이며, 오답 파일이 exit 1이고 실패 수가 오답 행 수와 같아야 '가능'. 한쪽만 만족하면 '일부 가능', 정답 행이 skip(unverifiable)이면 '불가'. exit 0만으로 '검증됨'이라 하지 않는다 — corpus_reverify는 unverifiable을 skip으로 넘기고 fail일 때만 exit 1을 낸다.\n③ 변별력: 오답 주입 행이 실제로 실패하는지 확인한다. 정답 행과 오답 행이 둘 다 통과하는 프로브는 위장이므로 무효 처리하고 원인을 적는다.\n④ 결과를 docs/reviews/p3_18_*.md에 개념 7개 표(가능/일부/불가 + 근거 exit code)로 남긴다. 실행하지 못한 항목은 실행하지 못했다고 쓴다(환경에 sympy가 필요하다 — python -m pip install -e src/backend 후 실행).\n⑤ 불가·일부 개념이 나오면 세션이 분모를 조정하지 않는다: 처분안(가: 핵심 개념에서 제외하고 사유 기록 / 나: 파생 판정(극값 개수 등)으로 대체 / 다: 인간 폴백)을 Kiki 결정 게이트로 올린다. P3-01 ③은 그 결과를 입력으로 받는다.\n⑥ 완료 판정 — 결과 문서와 프로브 행이 main에 있고 ②의 exit code가 문서에 기록됨."
