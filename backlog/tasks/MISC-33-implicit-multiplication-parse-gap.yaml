notes: "암묵 곱셈(`2x`·`4x²`)이 공용 파싱 소스 `l3.symbolic_equivalence.to_sympy_source`에서 곱셈 기호로 전개되지 않아 `sympy.sympify`가 SympifyError를 낸다. 실측(2026-09-18): `to_sympy_source(\"(2x+3)²\")` → `(2x+3)**2` → SympifyError. 명시 곱셈 `(2*x+3)²`은 정상 파싱된다.\n\n영향: 동치 판정·거짓형 정합을 쓰는 모든 경로가 학생이 흔히 쓰는 표기 하나를 통째로 못 본다. EOS-104의 오답 서명 채널(`l4/misconception/answer_signature.py`)에서 `(2x+3)² = 4x²+9`가 구조적으로 동일한 오개념인데도 미검출인 것이 실례이며, 그 사실은 `tests/backend/l4/misconception/test_answer_signature.py::test_known_limitation_implicit_multiplication_is_not_parsed`가 계약으로 동결해 두었다(고치면 그 테스트가 RED가 되므로 승계 지점이 기계로 남아 있다).\n\n범위: 수정처는 `l3/symbolic_equivalence.py`의 `to_sympy_source` 단일 지점이다(동치 권위 일원화 — 호출처에서 각자 고치면 같은 질문에 두 개의 답이 생긴다). sympy의 `parse_expr(transformations=implicit_multiplication_application)` 채택 여부를 실측 비교하고, 채택 시 기존 동치 판정 전건에 회귀가 없는지 확인해야 한다(거짓 양성 위험: `f(x)`가 `f*x`로 읽히는 등 — 함수 적용과의 충돌을 반드시 픽스처로 둘 것).\n\n착수 시 주의: 이 태스크는 동치 판정 권위를 건드리므로 오개념 채널 단독으로 판정하지 않는다. `identity_status` 소비처 전건을 먼저 열거하고 각각에 대조군을 둔다.\n\n[정정 2026-10-08] paths ['src/backend/whymath_backend/l3/symbolic_equivalence.py'] → ['src/backend/whymath_backend/l3/symbolic_equivalence.py', 'src/backend/whymath_backend/l4/misconception/wrong_form_match.py', 'tests/backend/l3/test_symbolic_equivalence.py', 'tests/backend/l4/test_wrong_form_match.py', 'tests/backend/l4/misconception/test_answer_signature.py']: 착수 실측으로 태스크 전제 정정 — 깨지던 곳은 to_sympy_source가 아니라 wrong_form_match 구조 파싱의 파서 규칙 불일치. 수정 범위에 wrong_form_match.py와 테스트 3개 추가, 선행 결함은 MISC-62로 분리"
