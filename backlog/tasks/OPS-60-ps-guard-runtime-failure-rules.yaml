notes: "OPS-57 acceptance ②의 미이행분 승계. 출처는 2026-08-31 LIC-02 siyavula URL 프로브이며 2026-09-01 관여도 트리아지 런북 사고와는 **별개 축**이다 — OPS-57은 후자만 구현하고 done 처리했고, 그 사실을 PR #973 본문에 적었으나 리뷰 봇(codex P1)이 '되돌릴 수 없는 done이 잔여 작업을 대장에서 지운다'고 지적해 승계로 분리했다. done은 종결 상태라 in_progress로 되돌릴 CLI 경로가 없으므로 승계 등재가 유일한 정정 경로다. 회수 시 acceptance 전수 재대조 규칙(2026-08-10)의 취지 그대로다.\n\n[정정 2026-09-11] acceptance④ 판정(오탐 위험이 커 채택 여부를 먼저 판정하라는 지시 이행) — 전면 채택(펜스\n경계 무관 모든 if/else 짝을 정적 추적)은 중첩·backtick 줄바꿈·문자열 속 else 등 변수가\n많아 보류. 대신 \"펜스가 else/elseif로 시작\"만 채택 — 이 부분집합은 그 펜스 안에 대응하는\nif가 존재할 수 없어(있었다면 else로 시작하지 않는다) 오탐이 구조적으로 0이다.\n`TestFenceStartingWithBareElse`(5건)로 양방향 동결. acceptance⑤·⑥은 기존 자산 전건\n재검사(324파일 0위반)로 충족 — 그 과정에서 deployment_cd_runbook.md의 실사고 패턴\n(`$_.Exception.Response.StatusCode`를 존재확인 없이 참조)을 실제로 1건 발견해 고쳤다\n(규칙을 좁혀 피해가지 않고 코드를 고침)."
