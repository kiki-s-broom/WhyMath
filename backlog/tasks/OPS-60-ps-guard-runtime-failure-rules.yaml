acceptance:
  - "① 자동 변수 대입 금지 — $home·$host·$input·$error·$args·$pwd·$matches·$profile 등. $home 대입은 거부되면서 후속 if($home)이 참이 되어 '실패가 성공처럼 보이는' 신호를 낸다"
  - "② Invoke-WebRequest에 -UseBasicParsing 필수 — PS 5.1의 IE 파싱 대화상자가 절차를 대화형으로 정지시킨다(무인 실행 불가)"
  - "③ catch가 $_.Exception.Response를 존재 확인 없이 참조 금지 — 전송 계층 오류(DNS·TLS·연결거부)에서는 Response가 null이라 원래 원인이 유실된다"
  - "④ if/else 다중행 구조 경고 검토 — 대화형 붙여넣기에서 if{...}와 else{...}가 여러 입력으로 나뉘면 PS가 if를 완결 문으로 파싱해 else가 고아가 되고(CommandNotFoundException) 검증 스텝이 통째로 미실행된다(OPS-57 notes의 4번째 관측). 오탐 위험이 커 채택 여부를 먼저 판정한다"
  - "⑤ 변별력 양방향 — 규칙마다 위반 샘플 exit 1 · 정상 샘플 exit 0을 tests/infra로 동결. 기존 자산 전건이 green인지 먼저 확인한 뒤 차단으로 승격(OPS-57 acceptance ③과 동일 규약)"
  - "⑥ 오탐 우선 — 오탐이 있는 가드는 사람이 끄게 만든다. 좁히는 쪽을 택하고 놓치는 형태를 명시한다(OPS-57에서 자리표시자 꺾쇠 오탐 1건을 그렇게 처리했다)"
  - "[판정 2026-09-11] ④ 채택 여부 판정 완료 — 전면 채택(펜스 경계 무관 모든 if/else 짝 정적 추적)은 중첩·backtick 줄바꿈·문자열 속 else 등 변수가 많아 오탐 위험 커 보류. 대신 '펜스가 else/elseif로 시작'만 채택 — 그 펜스 안에 대응하는 if가 있을 수 없는 구조적으로 오탐 0인 좁은 부분집합. TestFenceStartingWithBareElse(5건)로 양방향 동결"
