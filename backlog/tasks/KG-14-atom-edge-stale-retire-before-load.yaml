acceptance:
  - "① 잔존 엣지 은퇴(retire) 스텝 — 원자 백본 적재(`whymath_backend.l1.atom_graph.populate`)가 upsert만 해서 정본에서 지운·뒤집은 엣지가 prod `concept_edge`에 남는다. 적재와 **같은 트랜잭션**에서 \"양끝이 원자 백본 코드이고 · `edge_type=PREREQUISITE`이고 · CMS 소유가 아니며(`cms_edited_at IS NULL`) · 정본 적재 예정 집합에 없는\" 행만 지운다. 범위 밖 행(구 개념그래프·CMS·다른 적재기 소유)은 건드리지 않는다\n② 기본은 dry-run — 지울 목록과 건수만 출력하고 쓰지 않는다. 실제 삭제는 명시 플래그로만. dry-run 목록은 패리티 프로브(`atom_graph_prod_parity`)의 `DB에만 있는 엣지`(비-CMS) 집합과 같아야 한다(테스트로 대조)\n③ 적재 후 DB 합집합 순환 검사 — 은퇴+upsert 뒤 prod의 PREREQUISITE 그래프가 비순환인지 커밋 전에 확인하고, 순환이면 롤백(현재 적재기의 순환 검사는 정본 파일만 본다 · 재구성 실측: prod 2,210 상태에 KG-12 정본을 덧적재하면 2-순환 5쌍 — 4수01-02-2→4수01-01-1, AALG1-P03→C14, CALC2-C08→R04, LINA1-P07→P08, MFLD-C06→C07)\n④ \"작동한 비율\" — 리포트에 은퇴 건수·upsert 건수·CMS 보존 건수를 싣는다\n⑤ 검증: 단위(가짜 store)·PG 통합 테스트, 뮤테이션(범위 절 하나씩 제거 → RED: CMS 보존·원자 코드 범위·PREREQUISITE 한정·순환 롤백), exit code 보고\n⑥ 런북 `docs/ops/skb03_atom_node_populate_runbook.md` 갱신(dry-run → 확인 → 적용 · 쓰기 블록 자가거부 가드 · 공유 작업 사본은 main 기준 worktree) 후 Kiki 실행 → 패리티 `STATUS=MATCH`가 완료 증적"
  - "⑦ 정정 및 실측 반영(2026-10-21 Kiki 머신 읽기 전용 패리티 · 판정 기준 main 9ca012c1) — ⓐ ③의 괄호 \"현재 적재기의 순환 검사는 정본 파일만 본다\"는 **틀렸다**. 엣지 적재기(`AtomBackendEdgeStore.populate`)는 쓰기 전에 `assert_acyclic_with_db`로 DB의 모든 PREREQUISITE 엣지와 새 엣지의 합집합을 검사하고 순환이면 `PrerequisiteCycleError`로 거부한다. 따라서 지금 적재하면 prod에 순환이 생기는 것이 아니라 **엣지 적재가 거부되고**(개념 upsert는 앞선 별도 트랜잭션이라 이미 반영될 수 있다), 정본이 prod에 영영 도달하지 못한다. ③은 \"은퇴 → upsert → 기존 합집합 순환 검사\"가 한 트랜잭션에서 통과하는 것으로 읽는다 ⓑ 실측: prod `concept_edge` 2,234건(= KG-09 직전 정본 + S4-60 경계 24 · 재구성 추정 2,210은 경계 24를 빼고 센 오류) · 정본에만 265 · DB에만 221 · 적재 후 잔존 예정 221 · 순환 위험 5쌍(4수01-02-2→4수01-01-1 · AALG1-P03→AALG1-C14 · CALC2-C08→CALC2-R04 · LINA1-P07→LINA1-P08 · MFLD-C06→MFLD-C07) ⓒ prod에 `concept_edge.cms_edited_at` 열이 없다 — 리비전 a8c4e1f7b3d9(`concept`·`concept_edge`에 열 추가)가 미적용이다. 현재 적재기는 그 열을 쓰므로(CMS 소유 보호 `upsert_guard`) 스키마가 head가 아니면 적재가 실패한다. ⑥의 런북은 백업 + `alembic upgrade head` 선행 단계와 판 확인을 포함한다(선례 `docs/ops/g_admin06_browser_menu_call_runbook.md` B1·B2)"
