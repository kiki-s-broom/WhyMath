  - "① 실제 학생 단계 입력 분포로 상한 재판정 — OPS-126 ②는 교육과정 형태 합성 단계 354건(최대 0.157초)과 고차 방정식 스트레스 16건(상한 없이도 전부 unverifiable)까지만 실측했다. 합성 대리 분포이지 실제 학생 입력이 아니다. 파일럿이 verify-step·verify-solution 격리 호출을 최소 1,000건 쌓은 뒤 /health/ready 의 sympy_isolation 섹션(calls·timeouts·queue_waits·worker_deaths·fallbacks·undecidable_ratio)을 서버 프로세스별로 수집해, timeouts 가 0 이 아니면 그 입력이 상한 없이 돌렸을 때 correct·incorrect 로 끝났을지(= 상한이 판정 정보를 잃었는지)를 재현 가능한 입력으로 판정하고 sympy_isolation_timeout_s 를 유지·조정한다. 수집 단위는 프로세스이며 합산은 수집 측에서 한다(process_id 로 구분).\n② 워커 수 재판정 — queue_waits 가 0 이 아니면 sympy_isolation_max_workers 증설을 검토한다. OPS-126 ③ 실측: 느린 입력 2건이 워커 2개를 점유하는 동안 정상 요청 20건의 대기는 p50 5.77초·최대 5.80초이며 접힘은 0건(대기 상한 10초 안). 워커 1개당 RSS 73~76MB(Linux·Python 3.12·SymPy 1.14)이므로 증설 비용은 개당 약 75MB 이다. Windows 상주 메모리는 미측정이다.\n③ 파일럿 데이터가 없으면 이 태스크는 대기 상태로 두고 완료로 닫지 않는다(공허 통과 금지)."
