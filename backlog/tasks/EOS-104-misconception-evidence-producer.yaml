notes: "출처: EOS-12 구현 중 실측 발견. EOS-12는 채점 Evidence 3종 계약을 세우고 개념·스킬 2종의 생산자를 배선했으나, 세 번째(오개념)는 **두 채점 경로 어디에도 생산자가 없다** — api/me.py submit_attempt는 오개념 매칭을 돌리지 않고, api/coach.py _complete_problem은 완료가 항상 서버 판정 정답이라 오개념이 성립하지 않는다. 그래서 EOS-12는 빈 리스트를 내보내는 대신 MisconceptionScan.NOT_RUN으로 \"보지 않았다\"를 고지하는 데서 멈췄다(0건을 \"오개념이 없었다\"로 읽히게 하지 않기 위함).\n\n실측 근거(판정 기준 main ab1fdc82 + EOS-12 브랜치): diagnose 호출처는 api/coach.py 2곳(대화 턴)뿐이고 둘 다 attempt를 만들지 않는다. 게이트 결과(MatchGateResult)는 하류 가설 저장소로 가고 채점 응답에 합류하지 않는다.\n\n주의: 귀속 단위 불일치가 이 태스크의 핵심 난점이다(acceptance ③). 턴 단위 매칭을 attempt 증거로 그대로 옮기면 \"이 답안의 오개념 후보\"라는 거짓 주장이 된다."
