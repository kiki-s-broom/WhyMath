  - "[계획서 300 §16·§11 편입 — 2026-09-16 · EOS-09 변환] 이 태스크의 시나리오 뱅크에 아래 두 축을 편입한다.\n\n⑧ SCENARIO-001~010 정형화 — 계획서 §16이 지정한 10종: 001 신규학생 정상학습 · 002 낮은 진단점수 · 003 선수개념 결손 · 004 동일 오개념 반복 · 005 힌트 후 정답 · 006 AI Tutor 질문 · 007 mastery threshold 통과 · 008 다음 concept 이동 · 009 세션 종료 후 재접속 · 010 학습상태 복구. 실측(main 2e1220b4): 이 식별자를 가진 케이스 집합은 0건이고, 관통 테스트 2종(tests/backend/api/test_e2e_vertical_slice_integration.py 13단계 · src/mobile/test/e2e_loop_flow_test.dart 13단계)은 단일 합성 학습자 1인 1회 관통까지만 덮는다.\n\n⑨ 미커버 6종의 공통 병목을 먼저 적는다 — 002·004·005·008·009·010 중 009·010은 LearningSession writer 0이 원인이고 현재 테스트가 session_id is None을 단언해 그 공백을 계약으로 동결하고 있다. 005는 힌트 본문 생성기 부재(S4-11)가 선행이다. 시나리오를 쓰기 전에 어느 것이 코드 갭이고 어느 것이 테스트 갭인지 분류한다 — 분류 없이 10종을 쓰면 6종이 skip으로 위장된다.\n\n⑩ \"CI 상시\"는 현재 미충족 — 계획서 §16은 SCENARIO-001~010을 CI에서 항상 돌리라고 한다. 현행 관통 테스트는 e2e-nightly(.github/workflows/ci.yml:1566 · if github.event_name == schedule · cron 0 18 * * *) 전용이라 PR·push에서 돌지 않는다. 어느 잡이 어느 조건에서 실행할지 정하고, 배선을 확인한 뒤에 완료로 친다(저장소에 존재함 != 돌아감).\n\n⑪ 페르소나 3인 완주(계획서 §11) — A 정상 학습자 · B 선수학습 결손(반복 오답 → prerequisite gap → 하위 concept → 보정 → 원래 concept 복귀) · C 특정 오개념(오답 패턴 → detection → corrective explanation → targeted problem → confidence 감소). 실측: E2E 2종 모두 단일 학습자(uuid4 1인)이고, B축은 부분 실재하나(막힌 선수 시딩으로 선수 복습 코칭 신호 유발) 완주까지 가지 않으며 C축은 실증 0이다. 주의 — l1/problem_bank/persona_fit_rules.py의 페르소나는 문항 적격 필터용이지 학습자 여정 페르소나가 아니다(이름이 같다고 같은 것이 아니다).\n\n⑫ 연속 3루프(계획서 §18 최중요 조건) — 운영자 DB 개입 0으로 3회 연속 학습 루프. 현행은 1회 관통까지만 실증돼 있다. 이 축의 게이트는 backlog/gates.yaml 54건 중 0건이며 선언 본문에만 있다(G4 12/13 배정). 시나리오 뱅크가 이 반복을 표현할 수 있는지 판정해 적는다."
  - "[진행 기록 2026-09-19 · P-15 회차] acceptance ⑪(페르소나 3인 완주)만 착지했다. 나머지 항(①②③·⑧⑨⑩·⑫)은 미이행이며 이 태스크는 done이 아니다.\n\n· ⑪ 산출물 = tests/backend/api/test_persona_three_path_completion.py(실 PG·HTTP만·학습자 상태 직접 쓰기 0) + tests/infra/test_p15_persona_nightly_wiring.py(야간 배선 동결) + .github/workflows/ci.yml e2e-nightly 스텝 1건 + 판정 문서 docs/reviews/p15_persona_three_path_2026-09-19.md. PR https://github.com/kiki-s-broom/WhyMath/pull/1228 · 판정 기준 main 433ec9ea.\n· 판정 = B 통과 · C 통과(오개념 신뢰 0.98 → 0.74 · 24.5% 감소) · A 부분 통과(진단 확정이 영구히 쓰이지 않아 \"진단 → 학습\" 화살표가 끊김). 뮤테이션 12종 전건 RED.\n· ⑪이 드러낸 결함 4건은 P-15 범위 규율에 따라 등재만 했다 — EOS-123(P0 · CAT 중단 규칙 미도달) · MISC-34(정답 시도가 감쇠를 트리거하지 않음) · EOS-124(상태 머신 R4 미발화 · EOS-105 한계 승계) · EOS-125(루프 학습자의 general_ability가 항상 null).\n· ⑧·⑩은 이 회차에서 건드리지 않았다 — EOS-119(타 세션 claim)와 중복 소유 상태이고 그 판정·해소 경로는 EOS-120이 소유한다.\n· ⑫(연속 3루프)는 여전히 미실증이다. P-16(Gate 2) 판정 전에 별도 회차가 필요하다."
