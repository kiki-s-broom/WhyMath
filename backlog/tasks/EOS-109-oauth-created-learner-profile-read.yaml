notes: "Week 1 Gate(EOS-106) 판정이 지목한 **끊긴 지점 하나**다. 판정 기준 main d99a4828 · 증거 = CI run 35313156085 잡 105499238372 (실 PG · pytest -m integration).\n\n실측 증거: `1 failed, 321 passed, 13 skipped` 중 유일한 실패가 `test_week1_gate_one_cycle_without_direct_db_writes`이고, 예외는 `whymath_backend/db/models/user.py:197`의 `ValidationError: 4 validation errors for UserProfile` — track_type·target_universities·inkang_provider·accessibility_needs 전부 `Input should be a valid list [input_value=None]`.\n\n원인: ORM 컬럼은 nullable(`list[...] | None`)인데 스키마 필드는 `list[...]`(비옵셔널·default_factory=list)다. `to_schema()`는 키를 *명시적으로* None으로 넘기므로 default_factory가 적용되지 않는다. 그리고 `resolve_user`(api/auth.py)는 `from_schema`를 경유하지 않고 ORM 생성자를 직접 불러 그 4컬럼을 NULL로 남긴다. 즉 **운영 로그인 경로로 만들어진 계정은 자기 프로필을 읽을 수 없다**.\n\n이 결함은 main에 이미 있던 것이고 EOS-106이 건드린 코드가 아니다 — 기존 관통 테스트가 학습자를 `UserProfile.from_schema(...)`로 시딩해(그래서 `[]`가 채워져) 이 경로를 한 번도 지나가지 않았기 때문에 드러나지 않았다. Week 1 Gate가 사용자 생성을 API로 옮기자 즉시 드러났다.\n\n범위 주의(실측): 학습자 *루프*는 이 결함에 걸리지 않는다 — 같은 회차에서 대조군 테스트(`test_mastery_step_assertion_is_discriminating`)가 OAuth로 만든 학습자로 `POST /v1/me/attempts`·`GET /v1/me/mastery/current`를 통과했다. 즉 `ConsentedUser` 의존성은 `to_schema()`를 부르지 않고, 깨지는 것은 users 라우터의 응답 직렬화다.\n\n[정정 2026-09-18] 판정 회차 실측으로 등재 사유의 범위를 정정 — 이 결함은 Week 1 Gate를 막지 않는다(7단계 밖). P0는 온보딩 500을 사유로 유지\n\n[개명 2026-09-18] EOS-108 → EOS-109-oauth-created-learner-profile-read: 번호 충돌 해소 — 상대 세션이 2026-09-18T06:28:35Z에 EOS-108-mastery-engine-v1-single-write-path로 먼저 claim했고(claims 대장 실측·로컬 미존재) 내 add가 그 뒤였다. 선착 우선으로 내 번호를 옮긴다. 슬러그도 함께 부여 — 무슬러그 bare id가 번호 충돌 검사의 사각이었다\n\n[정정 2026-09-18] rename 사유의 사실 오류 정정 — 이벤트 대장 실측상 내 add(06:28:11Z)가 상대 claim(06:28:35Z)보다 24초 빨랐다. 선착 우선이 아니라 24초 경합이며 개명은 피해 최소화 선택이다\n\n[정정 2026-09-19] acceptance ②③⑤ 판정 결과와 근거 등재 — 고친 축(ⓑ)과 ⓐ·ⓒ 미채택 사유, 기존 행 축의 미측정 선언과 그것이 결론을 바꾸지 않는 이유, 전수 스캔 실측 22건"
