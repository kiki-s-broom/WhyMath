acceptance:
  - "① OAuth 콜백(`resolve_user`)으로 *새로 생성된* 학습자에 대해 `GET /v1/users/me`와 `PATCH /v1/users/me`가 200을 돌려준다. 현행은 둘 다 500이다 — `UserProfile.to_schema()`가 NULL 배열 4컬럼(track_type·target_universities·inkang_provider·accessibility_needs)을 `list[...]` 필드에 넣어 ValidationError를 낸다.\n② 고치는 축을 **판정해서** 적는다(셋 중 하나를 고르고 사유를 남긴다): ⓐ`resolve_user`가 `from_schema` 경유로 생성해 스키마 기본값 `[]`을 받게 한다 ⓑ`to_schema()`가 NULL을 `[]`로 강제 변환한다 ⓒ컬럼에 server_default `'{}'`를 주고 마이그레이션으로 기존 NULL을 백필한다. ⓐ는 신규 행만 고치고 ⓑ는 읽기측 전건을 고치며 ⓒ는 저장 계약을 바꾼다 — 세 축의 파급이 다르므로 고른 이유가 남아야 한다.\n③ **기존 행 축을 분리해 판정한다** — 이미 NULL로 저장된 행이 있으면 ⓐ만으로는 그 행이 계속 500이다. prod/pilot DB에 해당 행이 있는지 실측하고, 있으면 백필을 별항으로 처리한다(없으면 '실측 0건'을 근거와 함께 적는다).\n④ 회귀 동결: OAuth 콜백으로 만든 학습자를 `GET /v1/users/me`로 읽는 통합 테스트가 CI(backend-migrations 잡)에서 상시 실행된다. 이 태스크가 착지하면 `tests/backend/api/test_week1_gate_closed_loop.py`의 `xfail(strict=True)` 표식이 XPASS로 실패하므로 **그 표식을 함께 제거**한다(표식이 남아 있으면 CI red).\n⑤ 인접 표면 전수 확인 — `to_schema()`를 응답에 쓰는 다른 라우트가 같은 NULL 배열로 깨지는지 본다(`users.py` 외에 `me.py`·`privacy.py` 등). 깨지는 곳이 더 있으면 같은 판정으로 함께 고친다(부분 수정 금지)."
  - "[정정 2026-09-18 — 등재 사유의 범위 정정] 이 태스크의 최초 notes는 \"Week 1 Gate가 지목한 끊긴 지점\"이라 적었고 P0 사유를 \"Week 1 Gate를 막고 있으므로\"로 달았다. **그 사유는 틀렸다.** 끊긴 지점을 xfail로 분리한 뒤 회차(CI run 35315225642 잡 105505403023)에서 7단계 사이클 테스트가 통과했다(`322 passed, 1 xfailed` · 스텝 exit 0). 즉 이 결함은 게이트의 7단계 *밖*에 있고 게이트를 막지 않는다 — 판정 FAIL의 근거였던 것은 판정 세션이 7단계 밖에 덧붙인 `GET /v1/users/me` 단언이었다. P0 유지 사유는 게이트가 아니라 **온보딩 자체**다: `PATCH /v1/users/me`도 같은 스키마를 응답하므로 신규 가입 계정의 프로필 조회·수정이 둘 다 500이고, 그러면 폐쇄루프 시연이 성립하지 않는다. 결함의 실재와 acceptance ①~⑤는 그대로 유효하다."
  - "[정정 2026-09-18 — rename 사유의 사실 오류] 이 태스크를 EOS-108에서 EOS-109로 옮긴 rename 이벤트의 `--reason`은 \"상대 세션이 먼저 claim했고 내 add가 그 뒤였다\"고 적었다. **그 사실 진술은 틀렸다.** 이벤트 대장 실측: 내 add = 2026-09-18T06:28:11Z · 상대의 claim(EOS-108-mastery-engine-v1-single-write-path) = 2026-09-18T06:28:35Z — 내가 **24초 먼저** 등재했다. 즉 선착은 내 쪽이었고, 충돌은 누구의 잘못도 아닌 **24초 경합**이다: 내 add 시점에 상대 claim은 대장에 없었고, 상대 start 시점에 내 EOS-108은 아직 push되지 않아 서로가 서로를 볼 수 없었다(내 add 출력이 그 사각을 명시적으로 경고했다 — \"이 번호는 push 전까지 다른 세션에 보이지 않는다\"). 개명 자체는 유지한다 — 상대가 그 번호로 이미 착수해 구현 중이고, 번호 모호성을 없애는 비용이 내 쪽이 더 싸기 때문이다. 다만 사유는 \"선착 우선\"이 아니라 \"경합 + 피해 최소화 선택\"이다. 번호 예약 사각의 재발방지대책은 별건으로 등재했다."
  - "[판정 2026-09-19 — acceptance ②③⑤ 결론과 근거]\n\n② 고친 축 = ⓑ(읽기측 `to_schema()`가 NULL을 미설정으로 읽는다). ⓐ·ⓒ를 고르지 않은 사유:\n  · ⓐ(resolve_user를 from_schema 경유)는 **호출부 하나만** 고친다. ORM 생성자를 직접 부르는\n    경로는 `api/auth.py:resolve_user` 말고 `ops/account_bootstrap_cli.py:bootstrap_account`도\n    있고(실측 2건), 이미 NULL로 저장된 행은 계속 500이다 — acceptance ⑤ \"부분 수정 금지\"에 걸린다.\n  · ⓒ(server_default '{}' + 백필)는 저장 계약을 바꾸는데, 그 nullable은 DDL 정본\n    (`schemas/v1.0/schema_v1.0.md` §5.1)에서 온 것이라 스키마 문서 결정·MEMORY 로그가 선행해야\n    한다. 게다가 server_default는 INSERT가 컬럼을 *생략할 때만* 적용되므로 명시적 NULL 기록을\n    막지 못하고, ORM↔스키마 타입 불일치 자체는 그대로 남아 `to_schema()`는 여전히 깨질 수 있다.\n    즉 ⓒ는 입력을 좁힐 뿐 구멍을 닫지 않는다.\n  · ⓑ는 **행의 출처와 무관하게** 전건을 고친다(기존 행·신규 행·CLI 생성·원시 SQL 생성).\n    그리고 이 4필드는 스키마에 `| None`이 없어 \"미상\"이라는 상태가 정의돼 있지 않으므로,\n    NULL을 `[]`로 읽는 것은 정보 손실이 아니라 스키마가 선언한 뜻 그대로다.\n  · 구현은 UserProfile 국소 패치가 아니라 공용 seam 헬퍼\n    (`db/models/_schema_seam.py::drop_unset_nulls`)다. 규칙은 이름 열거가 아니라 산출물 판정\n    (필드에 None을 실제로 넣어 보고 거부 여부를, PK 여부는 매퍼에서 판정)이라 새 컬럼이 늘어도\n    목록 갱신이 필요 없다. 일부러 양보하지 않는 자리 2종을 명시했다 —\n    (1) 기본값 없는 required(ProblemStep.problem_id·StudentSolutionStep.expression: 후자는\n    봉투 암호화 계약이 docstring에 명시돼 있어 기본값을 지어내면 계약이 조용히 무너진다)\n    (2) PK(UserProfile.user_id는 default_factory=uuid4라, 뺐다면 NULL PK에 매 호출 새 UUID를\n    지어내 *남의 프로필처럼* 200을 돌려줬을 것이다).\n\n③ 기존 NULL 행 축: 이 세션은 prod/pilot DB에 **도달할 수 없다**(컨테이너에 docker 데몬 없음·\n   WHYMATH_DATABASE_URL 미설정). 그러므로 \"실측 0건\"이라고 적지 않는다 — **미측정**이다.\n   다만 축을 ⓑ로 고른 결과 이 판정이 **결론을 바꾸지 않는다**: NULL 행이 있든 없든 읽기가\n   성립하므로 백필 마이그레이션이 불필요하다. 그리고 그 주장을 말로 두지 않고 기계로 고정했다 —\n   `tests/backend/api/test_users_me_legacy_null_arrays.py`가 실 PG에서 배열 4컬럼을 원시 UPDATE로\n   NULL로 *주입한 뒤* GET·PATCH 200을 단언하고, 주입이 실제로 반영됐는지와 주입 헬퍼의 변별력\n   (대조군)까지 함께 단언한다. 즉 \"기존 행도 읽힌다\"는 실측된 계약이다.\n\n⑤ 인접 표면 전수: 이름 열거가 아니라 매퍼·스키마 산출물 스캔으로 판정했다. 같은 형태의 불일치\n   (ORM nullable 컬럼 ↔ 스키마 비옵셔널 필드)는 UserProfile 4건이 아니라 **10개 모델 22건**이다\n   (Concept.cognitive_type · ConceptFusion.exemplar_problem_ids · ConceptVersion 4건 ·\n   CurriculumEntry 5건 · Problem.persona_fit · ProblemStep.problem_id · SourceEntity.source_authority ·\n   StudentSolutionStep.expression · TextbookMapping.authors · TextbookUnit 2건 · UserProfile 4건).\n   그중 기본값을 가진 20건을 헬퍼 배선으로 함께 닫고(7파일·21 호출부), 기본값 없는 2건은 위\n   ②의 사유로 의도적 미대상이다. 새 모델이 같은 함정을 만들면\n   `tests/backend/db/test_to_schema_null_seam.py`의 전수 거버넌스가 red를 낸다(스캔 0건 가드 포함).\n\n[검증 — 통과가 아니라 주입으로 확인]\n  뮤테이션 8종 전건 RED(원복 바이트 동일 단언 포함): 헬퍼 무력화(단위·통합 각 1) · PK 보호 제거 ·\n  기본값 검사 제거 · None 거부 판정 제거 · user.py 배선 제거(단위·통합 각 1) · 전수 스캔 공허화.\n  **한계 명시**: 전건 RED는 가드가 센 정도를 말할 뿐 *무엇을 안 봤는지*는 말하지 않는다 —\n  주입 목록에 올린 절만 검사한 결과다."
