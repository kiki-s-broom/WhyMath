acceptance:
  - "① OAuth 콜백(`resolve_user`)으로 *새로 생성된* 학습자에 대해 `GET /v1/users/me`와 `PATCH /v1/users/me`가 200을 돌려준다. 현행은 둘 다 500이다 — `UserProfile.to_schema()`가 NULL 배열 4컬럼(track_type·target_universities·inkang_provider·accessibility_needs)을 `list[...]` 필드에 넣어 ValidationError를 낸다.\n② 고치는 축을 **판정해서** 적는다(셋 중 하나를 고르고 사유를 남긴다): ⓐ`resolve_user`가 `from_schema` 경유로 생성해 스키마 기본값 `[]`을 받게 한다 ⓑ`to_schema()`가 NULL을 `[]`로 강제 변환한다 ⓒ컬럼에 server_default `'{}'`를 주고 마이그레이션으로 기존 NULL을 백필한다. ⓐ는 신규 행만 고치고 ⓑ는 읽기측 전건을 고치며 ⓒ는 저장 계약을 바꾼다 — 세 축의 파급이 다르므로 고른 이유가 남아야 한다.\n③ **기존 행 축을 분리해 판정한다** — 이미 NULL로 저장된 행이 있으면 ⓐ만으로는 그 행이 계속 500이다. prod/pilot DB에 해당 행이 있는지 실측하고, 있으면 백필을 별항으로 처리한다(없으면 '실측 0건'을 근거와 함께 적는다).\n④ 회귀 동결: OAuth 콜백으로 만든 학습자를 `GET /v1/users/me`로 읽는 통합 테스트가 CI(backend-migrations 잡)에서 상시 실행된다. 이 태스크가 착지하면 `tests/backend/api/test_week1_gate_closed_loop.py`의 `xfail(strict=True)` 표식이 XPASS로 실패하므로 **그 표식을 함께 제거**한다(표식이 남아 있으면 CI red).\n⑤ 인접 표면 전수 확인 — `to_schema()`를 응답에 쓰는 다른 라우트가 같은 NULL 배열로 깨지는지 본다(`users.py` 외에 `me.py`·`privacy.py` 등). 깨지는 곳이 더 있으면 같은 판정으로 함께 고친다(부분 수정 금지)."
  - "[정정 2026-09-18 — 등재 사유의 범위 정정] 이 태스크의 최초 notes는 \"Week 1 Gate가 지목한 끊긴 지점\"이라 적었고 P0 사유를 \"Week 1 Gate를 막고 있으므로\"로 달았다. **그 사유는 틀렸다.** 끊긴 지점을 xfail로 분리한 뒤 회차(CI run 35315225642 잡 105505403023)에서 7단계 사이클 테스트가 통과했다(`322 passed, 1 xfailed` · 스텝 exit 0). 즉 이 결함은 게이트의 7단계 *밖*에 있고 게이트를 막지 않는다 — 판정 FAIL의 근거였던 것은 판정 세션이 7단계 밖에 덧붙인 `GET /v1/users/me` 단언이었다. P0 유지 사유는 게이트가 아니라 **온보딩 자체**다: `PATCH /v1/users/me`도 같은 스키마를 응답하므로 신규 가입 계정의 프로필 조회·수정이 둘 다 500이고, 그러면 폐쇄루프 시연이 성립하지 않는다. 결함의 실재와 acceptance ①~⑤는 그대로 유효하다."
  - "[정정 2026-09-18 — rename 사유의 사실 오류] 이 태스크를 EOS-108에서 EOS-109로 옮긴 rename 이벤트의 `--reason`은 \"상대 세션이 먼저 claim했고 내 add가 그 뒤였다\"고 적었다. **그 사실 진술은 틀렸다.** 이벤트 대장 실측: 내 add = 2026-09-18T06:28:11Z · 상대의 claim(EOS-108-mastery-engine-v1-single-write-path) = 2026-09-18T06:28:35Z — 내가 **24초 먼저** 등재했다. 즉 선착은 내 쪽이었고, 충돌은 누구의 잘못도 아닌 **24초 경합**이다: 내 add 시점에 상대 claim은 대장에 없었고, 상대 start 시점에 내 EOS-108은 아직 push되지 않아 서로가 서로를 볼 수 없었다(내 add 출력이 그 사각을 명시적으로 경고했다 — \"이 번호는 push 전까지 다른 세션에 보이지 않는다\"). 개명 자체는 유지한다 — 상대가 그 번호로 이미 착수해 구현 중이고, 번호 모호성을 없애는 비용이 내 쪽이 더 싸기 때문이다. 다만 사유는 \"선착 우선\"이 아니라 \"경합 + 피해 최소화 선택\"이다. 번호 예약 사각의 재발방지대책은 별건으로 등재했다."
