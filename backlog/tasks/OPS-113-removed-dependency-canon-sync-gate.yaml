  - "② 게이트 신설 — tests/infra/test_removed_dependency_canon_sync.py. pubspec.yaml의 '제거 사유 주석 블록'에서 의존명을 파싱해 추출하고(하드코딩 목록 금지 — 주석이 단일 진실원천), 그 이름이 src/backend/**/*.py·docs/architecture/**/*.md·docs/standards/**/*.md에 허용목록 밖으로 등장하면 exit 1. 허용목록에는 '제거 이력·사고 경위를 서술하는 위치'만 사유 주석과 함께 등재한다(근거 없는 포괄 허용 금지 — MOB-08 pubspec_dependency_usage_governance_test.dart 허용목록 관용구 답습)."
