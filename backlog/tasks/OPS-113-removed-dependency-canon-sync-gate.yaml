  - "④ CI 배선 확인 — 이 테스트가 infra-contracts 잡(tests/infra 상시 실행)에서 실제로 도는 것을 확인한 뒤 완료로 친다. 새 테스트·모듈이 EOS 기능 인벤토리 전수 귀속 가드에 걸리지 않는지도 같은 잡에서 확인한다."
  - "⑤ 범위 밖 동결 — flutter_tts·speech_to_text 재도입, SpeechSpec 클라 배선, firebase/푸시 구현 일체. 이 태스크는 '제거 사실이 정본에 반영되어 있는가'만 기계화한다."
