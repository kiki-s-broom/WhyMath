  - "① 착수 조건 — `EOS-139-undiagnosed-wrong-recommendation-criterion`이 main에 착지한 뒤에만 착수한다(판정 기준 커밋 해시를 판정문 상단에 박는다). EOS-139가 Gate 2 Loop 1 '보정' 기준을 Kiki 결정(게이트 `G-eos24-loop1-undiagnosed-wrong-criterion`)대로 재정의하고 상시 3루프 하네스(`tests/backend/api/test_e2e_three_consecutive_loops.py`)의 `_FROZEN`·판정 규칙에 반영한 상태가 전제다.\n\n② 판정 회차 분리 — 구현 세션과 다른 세션에서 단독 집행한다. production code를 고치지 않고, 발견한 결함은 태스크로 등재만 한다.\n\n③ 재실측 범위 — 2026-09-25 재판정문(`docs/reviews/eos_phase2_gate2_rejudgment_2026-09-25.md`) §8-1 재현 절차 그대로: 10조건 하네스(week1·week3·p11·persona) + 상시 3루프 하네스(general·misconception) + SCENARIO 회귀 스위트 + 일회성 프로브 V1~V4 + `ops/loop_kpi_gate` CLI. 3루프 판정은 **EOS-139가 착지시킨 기준**으로 하되, 9/25 판정문 §3-5가 그 기준의 두 조건(ⓐ 선수 개념 진단 · ⓑ 오답 시 practice_prerequisite 하강)을 main 데이터에 대 본 결과와 일치하는지 대조한다.\n\n④ 대조표 — 9/19(EOS-22)·9/24·9/25(EOS-130) 판정과 조건별로 달라진 점·같은 점을 표로 적는다.\n\n⑤ KPI 5종 실측값 병기 — CLI exit code와 5종 verdict를 그대로 싣고 미측정은 unmeasured로 적는다(Gate 2 문면 밖이지만 판정 규칙이 병기를 요구한다).\n\n⑥ 최종 한 줄 PASS 또는 FAIL — 조건부 PASS 없음. 미충족 조건마다 끊긴 지점·남은 작업량·11월 일정 영향.\n\n⑦ 게이트 clear는 Kiki 소유 — `G-p3-entry-gate2-pass`는 kind=decision·assignee=kiki다. 이 태스크는 증거를 만들 뿐 닫지 않으며 --as kiki로 대행하지 않는다."
  - "[2026-09-25 추가 — P3-00b(Phase 2 인수 점검) 흡수 · Kiki 결정] 이 태스크의 판정문 1건이 지시문 세트 [02] P3-00b의 산출을 겸한다. P3-00-phase2-acceptance-check는 이 흡수로 취소됐다(같은 판정을 두 번 하지 않는다). 처음에는 EOS-130에 붙였으나 EOS-130이 그 전에 2차 판정을 마쳤으므로(PR #1323), 진입 게이트를 열 수 있는 이 3차 재판정으로 옮긴다. 아래는 기존 ①~⑦에 없던 것만 적는다.\n⑧ SCENARIO-001~010 CI 실행 확인(지시문 [02] 3번): ③의 로컬 실행과 별도로, 판정 기준 main 커밋의 CI 실행에서 SCENARIO-001~010이 실제로 돌았는지(skipped 아님)를 잡 이름·스텝 결과로 적는다. 돌지 않았으면 통과가 아니라 측정 실패로 적는다. 상시 CI 도달 동결은 EOS-142 소유이고, 이 항목은 판정 시점의 1회 확인이다.\n⑨ 미충족·측정 실패 항목마다 Phase 3의 어느 태스크(P3-xx full-id) 전에 고쳐야 하는지 지목하고, 등재한 선행 태스크를 그 P3 태스크에 backlog.py amend --depends(full-id)로 건다. notes 산문으로만 적지 않는다. 최종 verdict가 PASS여도 KPI 미측정·측정 실패 항목은 이 절차를 밟는다 — PASS가 KPI 공백을 면제하지 않는다.\n⑩ 무개입 연속 3루프 축의 현재 소유 태스크를 full-id로 지목한다. 오답 유형(general·misconception)이나 루프마다 끊긴 지점이 다르면 각각 적는다.\n⑪ 완료 판정(지시문 [02] 문구 승계) — Phase 2 Gate 2 10조건·무개입 연속 3루프·KPI 5종이 main 기준으로 재실측되고, ④ 대조표와 ⑥ 최종 한 줄 verdict가 판정문으로 남고, 미충족 항목이 Phase 3 선행 태스크로 등재됨."
