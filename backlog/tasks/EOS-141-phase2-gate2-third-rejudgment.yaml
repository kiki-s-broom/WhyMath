notes: "출처: EOS-130 판정(2026-09-25 · 판정 기준 main 841ee77d · 최종 FAIL) §6·§8-3. 판정 기준: main 841ee77d.\n\n[왜 신규인가] EOS-130은 FAIL 판정문을 남기는 것으로 완료 조건 ⑧이 충족돼 done이 된다. 그러면 다음 재판정의 소유자가 없다 — 2026-09-19 EOS-22 FAIL 뒤 재판정 소유자가 사흘간 부재했던 사고(사고 대장 gate-resolution-path-unlinked 1회차 · EOS-130 등재로 수습)와 같은 형태가 재생산된다. 그래서 EOS-130 done과 같은 PR에서 후속 재판정을 등재한다.\n\n[의존 근거] 9/25 판정의 유일한 미충족은 무개입 연속 3루프 중 원인 미상 오답(general)의 Loop 1 '보정'이다(10조건·P-13·EOS-124 축은 전부 해소). 그 축의 소유자가 EOS-139이고, EOS-139의 기준 재정의가 main에 없으면 재판정은 같은 FAIL을 반복한다. 그래서 depends_on = EOS-139 하나만 건다. KPI ⑤(EOS-132)·3루프 하네스 CI 도달 동결(EOS-142)은 Gate 2 문면(10조건 + 3루프) 밖이거나 유지 요건이라 걸지 않는다.\n\n[게이트 미부착] G-p3-entry-gate2-pass를 requires_gates로 걸지 않는다 — 자기가 증거를 대야 할 게이트에 막히는 순환(P3-00 선례)을 피한다.\n\n[등급] eos_priority P0 — EOS-130과 같은 근거(재판정 없이는 저장소 G2의 최신 verdict가 FAIL로 고정되고 P3-01~P3-14 14건이 selector에서 막힌다).\n\n[정정 2026-09-25] title 'Phase 2 Gate 2 3차 재판정 — EOS-139 착지 후 원인 미상 오답 Loop 1 '보정'을 새 기준으로 재실측 (판정 전용·구현 세션 분리)' → 'Phase 2 Gate 2 3차 재판정 + 인수 점검(P3-00b 흡수) — 원인 미상 오답 Loop 1 '보정'을 새 기준으로 재실측 (판정 전용·구현 세션 분리)': Kiki 결정 2026-09-25(P3-00b를 Phase 2 Gate 2 재판정에 흡수)의 집행 대상을 EOS-130에서 이 태스크로 옮김. EOS-130은 PR #1323에서 2차 판정(FAIL · 미충족 1축)을 마쳐 done이 됐고, 진입 게이트 G-p3-entry-gate2-pass를 열 수 있는 판정은 이 3차 재판정이다. 옮기면서 지시문 [02] 3번(SCENARIO-001~010 CI 실행 확인)처럼 기존 ①~⑦에 없던 요구만 ⑧~⑪로 추가했다. 제목에서 특정 선행 태스크 이름을 뺐다 — 선행은 depends_on이 정본이다."
