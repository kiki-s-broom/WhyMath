acceptance:
  - "① harness/*.py·ops/*.py CLI가 stdout/stderr로 print하는 모든 문자열 리터럴을 전수 스캔해 cp949 인코딩 불가 문자(em dash 등) 존재를 검출하는 회귀 테스트 신설 — CI 동결(2026-08-30 재실측: 개별 모듈 cp949 대응은 산재하나 전수 스캐너 부재)"
  - "② 기존 CLI 리포트 모듈(visualization_reach_report·attempt_grading_shadow_report·pedagogy_content_slot_reach_report 등)도 같은 스캔으로 재확인 — 발견 위반은 이번 태스크에서 함께 수정"
  - "③ 변별력 — em dash 1개를 의도 주입해 스캐너 검출 실측 후 복원(cp 백업 원복). 성공/실패 동일값이면 위장"
  - "④ 대상 범위 확장 — scripts/harness/*.py(특히 backlog.py)를 포함한다. 기존 ①의 대상은 src/backend/.../harness·ops뿐이라 **사람이 매일 쓰는 대장 CLI가 빠져 있었다**. 2026-09-01 실측: Kiki 머신에서 backlog.py gates list·amend --help 2건이 UnicodeEncodeError로 죽었다(U+23F3 ⏳·U+2014 —)"
  - "⑤ 해법 우선순위 재판정 — ①의 '문자 금지 스캐너'보다 **진입점에서 stdout/stderr을 UTF-8로 재구성**하는 편이 우선 검토 대상이다. 근거: windows_utf8_setup.md §1이 'CP949를 애플리케이션 내부에서 지원하려 하지 말 것'이라 못박았고, 문자 금지는 한국어 출력의 가독성을 영구히 깎는다. 재구성이 성립하면 ①의 스캐너는 불요해질 수 있으므로 어느 쪽을 채택했는지 명시한다"
  - "⑥ 변별력(파이프 축) — 콘솔이 아니라 **파이프·리다이렉트**에서 검증한다. 파이프를 걸면 stdout이 로케일 인코딩을 쓰기 때문에 콘솔에서만 테스트하면 이 결함이 보이지 않는다. 로케일 cp949 강제 서브프로세스에서 수정 전 실패·수정 후 성공 양방향 실측"
  - "⑦ 런북 회귀 방지 — 착지 후 docs/ops/eos_relevance_triage_gate_runbook.md §6-1b의 UTF-8 강제 블록이 여전히 필요한지 재판정한다. 불요해지면 제거하거나 '보험'으로 명시(만료 없는 유예 금지)"
  - "⑧ paths 부착 대기 — ④가 넓힌 범위(scripts/harness/**·tests/harness/**)는 이 태스크의 paths에 반영되지 않았다. amend에 paths 정정 경로가 없기 때문이며(HARN-59가 소유), 그때까지 이 태스크를 claim한 세션은 scripts/harness 편집 시 scope drift 경고를 받는다. HARN-59 착지 후 paths를 부착하고 이 항을 해소한다"
  - "[인접 축 통지 2026-09-14 · 이 태스크의 범위 아님] 같은 cp949 계열의 네 번째 축이 실측됐고 별도로 처리됐다 — 혼동 방지를 위해 적어 둔다. 이 태스크는 '우리가 내는 출력'(stdout/stderr 인쇄)이 cp949에서 죽는 축이다. 새로 난 것은 '셸이 제3 도구의 출력을 디코딩 왕복시켜 파일을 손상시키는' 축이다: PowerShell 5.1이 gh api의 stdout을 Console.OutputEncoding(cp949)으로 디코딩한 뒤 재인코딩해, 필수 체크 이름의 U+2014/U+00B7이 뒤따르는 따옴표를 트레일 바이트로 삼켜 JSON 구조 문자가 유실됐다(2,659→2,618자·41자 소실·판정기 exit 2). 처리 = 런북을 cmd /c 경유로 바꿔 디코딩 자체를 없애고 tests/infra/test_ruleset_drift.py가 그 형태를 동결(뮤테이션 4종 전건 RED). 주의점: 인코딩을 명시해도(Out-File -Encoding utf8) 소용없었다 — 이미 깨진 문자열을 명시한 인코딩으로 쓸 뿐이었다. 그러므로 이 태스크의 acceptance 5(진입점 stdout 재구성)를 채택하더라도 이 축은 덮이지 않는다."
