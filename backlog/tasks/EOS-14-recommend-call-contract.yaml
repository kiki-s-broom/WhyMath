acceptance:
  - "① 계약 시그니처 분리 — 계획서 §8의 `recommend(learner_state, learning_context)` 형태로 호출 계약을 세운다. 현행은 HTTP 핸들러(`api/me.py:2169 GET /v1/me/next-problem`)가 `user_id`+쿼리 파라미터로 **내부에서 재계산**하며 LearnerState를 입력으로 받지 않는다.\n② 결과와 이유를 분리하지 않는다 — 계획서 §8의 요지는 \"Recommendation이 아니라 Recommendation + Reason을 처음부터 설계\"다. 반환에 `reason{type, confidence}`를 **필수 필드**로 둔다(옵셔널이면 비는 경로가 생긴다).\n③ 현행 '이유'와의 차이를 적는다 — 현행 `NextProblemResponse`(`api/me.py:2106-2165`)의 5필드(`weight_axes_applied`·`candidate_pool_size`·`weak_concept_signal_count`·`candidate_zero_reason`·`band_calibrated`)는 **관측 메타**(어느 축이 적용됐나·후보가 왜 0인가)이지 **선택된 문항의 추천 근거**(어느 개념·어느 오개념 때문에 이 문항인가)가 아니다. 새 `reason`은 후자를 담는다.\n④ 영속 축은 이미 있음 — `l2/recommendation_evidence.py:116-148`이 `gate_reason`·`candidates[]`·`policy_version`을 영속한다(REC-11 done). **재구현하지 않는다** — 계약이 그것을 읽거나 쓰도록 잇는다.\n⑤ 교체 가능성 — v1 내부는 계획서가 허용한 규칙(`mastery<0.4 → prerequisite` / `0.4~0.7 → current` / `>0.7 → next`)이어도 된다. 다만 그 규칙이 **단일 정책 함수**에 모이게 한다 — 현행 임계는 `l2/weak_concept_recommendation.py:152`·`l2/prerequisite_recommendation.py:385,439`·`l2/learner_state.py:49-50` 3모듈에 분산돼 있다.\n⑥ 추천 정지 금지 — 계약 교체가 추천 결과를 바꾸면 안 된다. 교체 전후 동일 입력에서 같은 문항이 나오는지 대조하고, 달라지면 왜 달라졌는지 적는다."
