acceptance:
  - "① 회피 경로 실측 재현 — retention.py:127이 'delete(model).where(ts < cutoff)'이므로 클라가 먼 미래 started_at을 신고하면 그 행은 조건을 영원히 만족하지 않는다. 미성년자 PII가 보존기한을 넘겨 무기한 잔존하는 경로를 테스트로 재현한 뒤 막는다(재현 없이 방어부터 넣지 않는다 — 무엇을 막는지 모르는 가드가 된다)"
  - "② NULL 축도 같은 회피다 — retention.py 모듈 docstring이 'NULL 타임스탬프는 파기 대상 아님'을 정직 스코프로 선언하지만, PED-37 이후 started_at은 클라가 신고하지 않으면 NULL로 남는다. 즉 신고하지 않는 클라의 attempt는 영구 잔존한다. 해법 후보: retention이 COALESCE(started_at, ingested_at)를 기준으로 보게 한다(ingested_at은 서버가 채우므로 항상 있다). 채택 시 파기 대상 건수가 늘어나므로 소급 영향은 게이트 G-attempt-retention-purge-backfill-decision과 조율"
  - "③ 서버측 상한 검증 — 클라 신고 started_at이 수신 시각(ingested_at)보다 미래인 경우의 처분을 정한다(거부/절단/기록 후 경고). 어느 쪽이든 '조용히 받아들이기'는 선택지가 아니다. 판정은 데이터가 아니라 계약이므로 테스트로 동결"
  - "④ 변별력 — 회피 상태를 주입해 RED를 확인한 뒤에만 보호로 친다. 정상 입력에서 초록인 것은 보호의 증거가 아니다(CLAUDE.md 2026-09-01)"
  - "⑤ [승계 2026-09-07] PED-37의 사후 확장 acceptance를 이 태스크가 잇는다 — 병렬 세션이 PED-37 done 이후 '신규 행의 started_at이 어떤 입력 조합에서도 NULL이 되지 않게 서버측 폴백을 두거나, 파기 기준에 보장 채워지는 컬럼 폴백을 배선한다'를 추가했다. PED-37 구현(클라 신고값 그대로 적재·미신고 NULL)은 이 요구를 충족하지 않으며 충족해서도 안 된다(서버 now 폴백이 32_learning_history §EOS-48-2 날조 금지에 걸린다). 따라서 해소는 파기 기준 쪽 폴백이고 그 축이 곧 이 태스크의 ②다"
  - "⑥ [②의 자기정정 2026-09-07] ②가 제안한 COALESCE(started_at, ingested_at)의 근거 'ingested_at은 서버가 채우므로 항상 있다'는 거짓이다. 실측: db/models/activity.py:186의 ingested_at은 nullable이고 server_default가 없다 — 현재 두 writer(me.py·coach.py)가 채우는 것은 코드 규약일 뿐 스키마 보장이 아니라, 세 번째 writer가 생략하면 NULL이 된다. 반면 created_at(:225)은 server_default=sa.func.now()가 있으나 모델 주석이 'from_schema 경유 덮어쓰기 가능'을 자인한다. 즉 현재 어느 컬럼도 '보장 채워짐'이 아니다 — 폴백 컬럼을 고르기 전에 그 컬럼에 보장을 부여하는 것(server_default 부여 또는 덮어쓰기 경로 차단)이 선행이며 그 선행까지 이 태스크가 소유한다"
