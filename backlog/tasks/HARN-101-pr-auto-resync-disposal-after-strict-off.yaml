notes: "발견 경위(2026-09-14): 게이트 G-strict-policy-and-classic-cleanup을 A안(strict 해제 + 클래식 삭제)으로 처분하면서, pr-auto-resync 워크플로의 존재 근거가 통째로 사라진 것을 확인했다.\n\n그 워크플로는 \"보호를 낮추는 대신(=strict 해제) 충족을 자동화한다\"는 취지로 만들어졌다(HARN-85 · .github/branch-protection-setup.md '대신 하는 것' 절). 즉 strict를 *유지하기 위한* 장치다. strict가 꺼지면 behind가 머지를 막지 않으므로 자동 최신화는 머지 경로의 필수 요소가 아니게 된다.\n\n왜 즉시 지우지 않는가: ⓐ 부수 효용이 남아 있을 수 있다(큐 진입 전 최신화가 큐 안 재검증 실패를 앞당겨 노출) ⓑ PR_AUTO_RESYNC_TOKEN 발급이 사람 왕복 1회를 이미 소모했으므로 되돌리기 전에 측정 근거가 있어야 한다 ⓒ 무엇보다 이 세션은 게이트 처분 범위이지 워크플로 처분 범위가 아니다 — 범위를 넓히지 않는다.\n\n그래서 문서에는 '전제 소멸' 경고만 박고 판정은 이 태스크로 분리했다. 경고 없이 두면 다음 세션이 그 절을 *현행 근거*로 읽는다(CLAUDE.md '만료 없는 유예·제외 금지' — 판정 지점 없는 존치는 유예다).\n\n인접: HARN-85(워크플로 신설)·HARN-87(라이브 실측)이 같은 전제 위에 있다. HARN-82(pr_merge_readiness docstring의 strict=true 전제)도 같은 축이나 그쪽은 별도 태스크로 이미 등재돼 있다(blocked).\n\n[정정 2026-09-14] 존치·폐기 판정의 전제가 'strict가 실제로 꺼져 있음'이다. 게이트가 clear되기 전(=클래식 삭제 전)에는 실질 strict가 살아 있어 ②ⓐ 판정이 성립하지 않는다 — 산문이 아니라 대장에 집행한다(HARN-52 축)."
