acceptance:
  - "① 전제 재확인 — strict 해제(2026-09-14 Kiki 결정 A안) 착지 후, pr-auto-resync가 실제로 무엇을 하고 있는지 실측한다. dry_run=1로 1회 실행해 분모(스캔 N건)와 후보(BEHIND+auto-merge M건)를 기록한다. strict가 꺼진 뒤에도 후보가 계속 잡힌다면 그 PR들은 behind이되 머지는 막히지 않는 상태다 — 즉 최신화가 '필요해서'가 아니라 '조건에 걸려서' 일어난다.\n② 존치/폐기 판정 — 세 축으로 가른다. ⓐ 머지 경로 필수성: strict off + merge queue 하에서 behind는 머지를 막지 않으므로 필수 아님(이것은 이미 확정) ⓑ 부수 효용: 큐 진입 전에 미리 최신화해 두면 큐 안 재검증 실패를 앞당겨 발견하는 효과가 있는가 — 있으면 정량으로 적고 없으면 없다고 적는다 ⓒ 비용: 주기 실행이 소모하는 CI 분과 update-branch가 유발하는 워크플로 재발화 수. ⓒ가 ⓑ를 넘으면 폐기.\n③ 폐기로 판정하면 — .github/workflows/pr-auto-resync.yml 제거, PR_AUTO_RESYNC_TOKEN 시크릿 폐기 안내(게이트 G-pr-auto-resync-token은 cleared이므로 되돌리지 않고 후속 노트만 단다), .github/branch-protection-setup.md의 '대신 하는 것' 절을 사고 기록으로 강등한다(지우지 않는다 — 왜 만들었고 왜 없앴는지가 다음 세션의 판단 재료다).\n④ 존치로 판정하면 — 위 문서 절 머리의 '전제 소멸' 경고를 존치 근거로 교체하고, 그 근거가 ②ⓑ의 실측 수치를 인용하게 한다. '일단 두자'는 근거가 아니다.\n⑤ 어느 쪽이든 HARN-85(워크플로 신설)·HARN-87(라이브 실측)의 notes에 이 판정 결과를 승계 참조로 남긴다 — 그 둘의 acceptance는 strict 유지를 전제로 쓰였으므로, 전제가 바뀐 사실이 그쪽 기록에서도 보여야 한다."
