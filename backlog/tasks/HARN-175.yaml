notes: "발견 경위 2026-09-25(판정 기준 main f138f894): Kiki가 G-mp02-rerun-model-pilot 조회를 요청 → `gates show`가 \"여는 작업 미선언 — validate 위반(HARN-174)\"을 출력했는데 같은 시점 `backlog.py validate`는 exit 0이었다. 원인: `Gate.validate()`는 \"cleared·waived 게이트는 아무것도 막지 않으므로 요구하지 않는다(과거 행 소급 금지)\"로 pending에만 입력 선언을 요구하지만, `report.gate_inputs_text()`는 status를 보지 않고 입력이 없으면 무조건 위반 문구를 낸다. 실측: 닫힌 게이트 62건(cleared 56·waived 6) 전부 표시=위반·검증기=무위반(오경보율 100%), pending 22건은 양쪽 일치. 위험: HARN-92가 `gates show`를 게이트 인용의 정본 경로로 만들었으므로 닫힌 게이트를 조회하는 모든 세션이 거짓 위반을 본다. `gates amend`는 status를 가리지 않아 닫힌 게이트에 --no-inputs 소급 기입이 통과하며, 그것은 store.py가 피하려는 대장 전역 무의미 변경이다. 피해 실측 0건(이벤트 대장: 종결 후 입력 amend 0/22) — 사고가 아니라 잠복 결함 발견이다."
