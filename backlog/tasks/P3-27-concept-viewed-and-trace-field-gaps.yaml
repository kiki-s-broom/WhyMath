  - "① concept_viewed 실체화 결정 — P3-13 실측에서 이 역할은 대응 이벤트 2종 중 content_viewed 가 생산자 0건(DORMANT)이고 concept_selected 는 concept_id 를 싣지 않는다(세션 writer 가 target_concept_id 를 채우지 않음). 둘 중 하나를 택해 결정 근거와 함께 기록한다: (가) 콘텐츠 열람 로그 좌석 신설 (나) 세션 개시 이벤트가 개념을 싣도록 writer 확장. 어느 쪽이든 새 Entity·DB 스키마가 필요하면 Phase 3 범위규율에 따라 Release Blocker 여부를 먼저 판정하고, 아니면 이 태스크는 12월 이후로 이월한다.\n② 트레이스 추적 필드 보강 판정 — 숙달 변경(mastery_updated)에 session_id·problem_id 가 없으나 concept_mastery_history 는 attempt_id 를 보유한다(투영에서 떨어뜨림). 응답 지연·오개념·힌트 요청에 session_id 가 없는 것은 구조적 N/A 인지 보강 대상인지 이벤트별로 판정하고, 보강하는 것은 attempt 귀속 투영뿐이다(새 컬럼 금지).\n③ 검증 — tests/backend/scenarios/test_gate_d_event_role_census.py 의 동결 단언(content_viewed 0건·concept_selected concept_id None)을 승격하고, scripts/ops/verify_gate_de_discrimination.py 의 기록 차단 주입이 승격된 단언에서 RED 인지 실측한다. 정상 입력에서 초록인 것은 증거가 아니다.\n④ content_version 은 이 태스크의 범위가 아니다 — EOS-47-attempt-version-pinning 소유(시도 시점의 판을 기록하는 원천이 없는 상태). 현재 problem.problem_version_id 는 서빙 판 포인터라 그 값으로 채우면 날조다."
