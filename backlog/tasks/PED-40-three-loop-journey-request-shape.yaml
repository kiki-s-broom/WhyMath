acceptance:
  - "① 실측 사실(EOS-26 · 2026-09-26) — 3루프 하네스 본 관통(`tests/backend/api/test_e2e_three_consecutive_loops.py::_run_journey`)은 모든 추천을 `prioritize_weak_concepts=true`로 요청한다(`test_e2e_persona_journeys.py::_next_problem`의 `weak_first` 기본값 True). 실제 모바일 앱은 이 파라미터를 보내지 않는다(`src/mobile/lib/features/problems/data/problems_api.dart::getNextProblem` 기본값 false · 유일한 호출부 `problem_screen.dart`가 인자 없이 `load()`). EOS-26은 진단 보정 프로브만 두 요청 형태로 강화했다 — 약점 가중(방금 틀린 개념 문항 1.85배)이 기준 ⓑ를 대신 세우고 있었기 때문이다(EOS-26 판정문 §1-2).\n② 목표 — 본 관통(Loop 1~3)을 두 요청 형태로 돌려 형태별 판정을 낸다. 실제 앱 형태에서 §18(무개입 연속 3루프)이 서는지 실측하고, 형태별로 다르면 동결표를 형태별로 나눈다(한 표로 두면 한쪽을 올리는 순간 다른 쪽이 거짓 해소가 된다 — EOS-24 동결표 분리 선례).\n③ 같은 공백이 페르소나 여정 하네스(`test_e2e_persona_journeys.py` — 기본 `weak_first=True`)에도 있는지 확인하고 이 태스크의 범위를 정한다."
