notes: "등재 경위(2026-09-19): DeepSeek 오케스트레이션 잔여 작업 점검 중 발견. 배선 축은 ARCH-49·ARCH-55·ARCH-57·ARCH-58·EOS-111·EOS-112로 전부 done이고 build_cloud_provider의 프로덕션 소비처가 7곳(저작 생성기·재진술·다중풀이·교차검증·해설·비유·사전적재)인데, 그 좌석이 실제로 도는 회차에서 신호가 좌석을 제대로 말하는지는 **아무도 본 적이 없다**. 「작동 신호 없는 알고리즘 부착 금지」가 겨냥하는 형태다 — 신호를 만들었고 단위 계약은 뮤테이션으로 동결했으나(EOS-111 5종·EOS-112 14종) 라이브 작동 비율은 0이다.\n\n실행 자체는 가볍다(런북 실재·키 등록됨·ARCH-57 라이브 1회차 선례 있음). 무거운 것은 판정이다 — ②의 두 신호 동시 확인과 ③의 대조군이 없으면 통과가 위장이 될 수 있다.\n\n주의: 이 태스크가 ARCH-56의 발동 조건 ⓐ(OpenRouter 경로가 상시 배치 트래픽을 받기로 결정)를 건드리지 **않는다**. 1회 관측 회차이지 상시 채택 결정이 아니다. 상시로 돌리기로 하는 판정은 별건이며 그때 ARCH-56 보류가 풀린다(게이트 G-arch56-availability-trigger).\n\n[정정 2026-09-19] 라이브 회차는 Phaiakes9와 키가 필요해 세션이 대체할 수 없다 — 산문에만 두면 selector가 읽지 않아 즉시 착수 후보가 된다(ARCH-56 선례)\n\n[판정 2026-09-19 · 기준 origin/main `412ccb71` · 런북 PR #1223] 라이브 2회차 실행 완료. 판정 4축 전건 성립 — ⓐ 두 회차 모두 `state=all_on_selected_seat`(not_measured 아님) ⓑ 두 회차 모두 `comparable=5 > 0`(관측 축 EOS-112가 라이브에서 살아 있다) ⓒ `served_models`가 서로 다르다(openrouter=`deepseek/deepseek-v4.1-flash` 5건 vs anthropic=`claude-sonnet-4-6` 5건 — 신호가 좌석을 구분한다) ⓓ openrouter `retries_measured=5 > 0`(`retries_total=0`은 계측했고 재시도가 없었다는 뜻이며 분모와 혼동하지 않는다).\n\nacceptance ④ **사람 판정**: 두 회차 모두 `differs=0` · `differing_pairs=[]`. `comparable=5`이므로 이것은 미관측이 아니라 **실측 0**이다 — 두 공급사 모두 선언값과 글자 그대로 같은 문자열을 돌려준다. 별칭→버전 해소가 *일어나지 않았다*. 이것은 사전 가정의 반증이다: 세션이 검증용 픽스처를 만들 때 Anthropic이 날짜 붙은 ID(`claude-sonnet-4-6-20260219` 형태)를 돌려줄 것으로 가정했으나 실측은 핀 문자열 그대로였다. 따라서 이 두 좌석에 한해 선언 축과 관측 축은 현재 같은 값을 내며, EOS-112가 두 축을 분리해 둔 가치는 *지금 차이가 있어서*가 아니라 *차이가 생겼을 때 보이게 하려고*다.\n\n대조군의 `retries_measured=0` · `retries_total=null`은 정상이다(Anthropic SDK 자체 재시도 · 우리 전송기 미경유 — `anthropic.py:216`). 두 회차에 같은 잣대를 대면 정상을 결함으로 읽는다.\n\n[부수 산출물] 게이트 집행 중 `check_runbook_blocks.py`가 유료 외부 호출·출력 리다이렉션 블록을 쓰기로 분류하지 않는다는 것이 주입으로 드러났다(자가거부 가드를 지워도 통과). 검출기 자체는 대조군에서 exit 1로 잡히므로 원인은 쓰기 어휘의 범위다 — 상환은 `HARN-116`이 소유한다.\n\n[승계 정정] acceptance ①이 \"런북 `docs/ops/arch57_authoring_openrouter_runbook.md`가 이미 있으므로 새로 배선할 것은 없다\"고 적었으나 **그 전제는 틀렸다**. `cloud_seat` 블록은 요약 stdout에만 실리는데 ARCH-57판 `[C]`는 stdout을 담지 않아 이 태스크가 요구하는 회신을 만들 수 없다. 전용 런북 `docs/ops/eos118_seat_signal_live_runbook.md`를 신설해 해소했다(PR #1223).\n\n[정정 2026-09-19] notes 치환 — 라이브 2회차 판정 기록 (acceptance ④ 사람 판정 · 게이트 G-eos118 증적)"
