acceptance:
  - "① 라이브 회차 실행 — Phaiakes9에서 `WHYMATH_CLOUD_PROVIDER=openrouter`로 `problem_corpus_accumulate` 회차를 1회 돌리고 요약의 `cloud_seat` 블록 전문을 회신한다. 런북 `docs/ops/arch57_authoring_openrouter_runbook.md`가 이미 있으므로 새로 배선할 것은 없다 — 이 태스크는 도구 태스크가 아니라 **관측 태스크**다.\n② 변별력 — 판정은 두 신호를 **함께** 본다: ⓐ `cloud_seat.state`가 `not_measured`가 아닐 것 ⓑ `cloud_seat.observation.declared_vs_served.comparable`가 0보다 클 것. ⓐ만 보면 선언 축만 살아 있고 관측 축(EOS-112)이 죽어 있어도 통과한다 — 그것이 정확히 EOS-111을 등재하게 만든 형태다(`calls_with_cache_telemetry: 0`이 두 원인에서 같은 값이라 변별력이 0이었다). 한 신호로 두 축을 판정하지 않는다.\n③ 대조군 — 셀렉터를 기본값(`anthropic`)으로 둔 회차도 1회 돌려 `observed_models`가 **다른 값**을 내는지 본다. 양쪽이 같은 화면을 내면 신호가 좌석을 구분하지 못하는 것이며, 그때 ①의 통과는 위장이다. 대조군 없이 ①만 성립하면 '전부 선택 좌석으로 계상'하는 과잉 구현도 통과한다.\n④ 어긋남 쌍의 실제 모양 — `declared_vs_served.differs`가 0보다 크면 `differing_pairs`를 그대로 기록하고, 별칭→버전 해소인지 진짜 폴백인지 **사람이 판정해** 그 판정을 notes에 남긴다(기계가 가르지 않기로 한 축이다 — EOS-112 PR #1211). `differs`가 0이면 \"이 공급사는 선언값과 같은 문자열을 돌려준다\"는 실측이며 그것도 기록한다 — 0은 미관측이 아니라 실측 0이다(②-ⓑ가 comparable>0을 요구하므로 둘이 구분된다).\n⑤ 재시도 축 — `observation.retries.calls_with_retries_measured`가 0보다 커야 한다. OpenAI 호환 경로는 우리 전송기를 타므로 계측이 성립해야 하고, 0이면 계측 배선이 라이브에서 죽은 것이다(None=미계측과는 다른 사실이며 요약이 둘을 구분해 낸다). `retries_total`이 0인 것은 정상(계측했고 재시도가 없었다)이다 — 분모와 분자를 혼동하지 않는다.\n⑥ 판정과 산출물 — ①~⑤가 전부 성립하면 EOS-111·EOS-112 PR 본문의 '정직한 공백'(라이브 미확인)이 닫힌다. 성립하지 않으면 **그 실패가 이 태스크의 산출물**이며, 원인을 실측 규명해 수정 태스크로 분리 등재한다(실패 회차를 폐기하지 않는다 — 측정 도구의 실패 경로 설계 규칙).\n⑦ 승계 근거 — EOS-111(PR #1208)·EOS-112(PR #1211) 양쪽이 \"이 컨테이너에 egress·키가 없어 라이브 확인을 못 했다\"를 '정직한 공백'에 적었고, 두 태스크의 done 조건에는 그 축이 없었다. 산문에만 남기면 만료 없는 유예가 되므로(CLAUDE.md) 대장으로 옮겨 소유자를 만든다. 이것은 '못 했다'의 기록이 아니라 '누가 언제 할 것인가'의 집행이다."
