acceptance:
  - "① 실측 사실(판정 기준: main 97e504aa · 2026-09-29) — cmd_amend(scripts/harness/backlog.py)는 대상 태스크가 다른 세션의 원격 claim 아래에 있어도 경고 없이 쓴다. 근접 사고 1건(피해 0): 2026-09-29 07:00:48Z에 다른 세션이 HARN-170을 claim했는데, 이 세션이 07:04Z경 HARN-170에 amend(우선순위·등급 상향)를 경고 없이 성공시켰다. 커밋 직후 claim 기록을 다시 조회하다 발견해 푸시 전에 폐기했다 — 발견은 도구가 아니라 이 세션의 수동 재조회였다. 같은 파일을 두 세션이 고치면 나중에 병합하는 쪽이 충돌하고 머지 큐에서 MERGE_CONFLICT로 빠질 수 있다. 정적 스캔(claim 조회 어휘 참조 수, 거친 값): cmd_start 25 · cmd_gates 15 · cmd_cancel 7 · cmd_block 3 · cmd_amend 1(674줄). 정확한 판정은 구현자가 함수 단위로 다시 실측한다(이 스캔은 어휘 계수이지 호출 그래프가 아니다)."
  - "② 처분 — amend가 대상 태스크의 다른 세션 claim을 발견하면 stderr에 경고(claim 보유 브랜치·시각 포함)와 이벤트 1줄을 남긴다. 거부하지는 않는 것을 기본으로 제안한다(대장 정정 경로 보존 — 차단 여부는 구현 시 Kiki 판정). claim을 조회하지 못한 경우(캐시 없음·오프라인)는 '없음'과 구분해 '확인 불가'로 알린다(모른다≠아니다 — 3상태)."
  - "③ 범위 전수 — 같은 사각이 대상 태스크를 쓰는 다른 대장 verb(rename · gates 중 태스크를 바꾸는 하위 명령 등)에도 있는지 함수 단위로 확인하고, 없는 곳은 '없음'과 근거를, 있는 곳은 같은 경고를 붙인다. 확인하지 않은 verb는 목록으로 남긴다(안 본 것을 통과로 세지 않는다)."
  - "④ 변별력 — 다른 세션 claim이 있는 태스크 · 자기 claim 태스크 · claim 없는 태스크 · claim 확인 불가의 4상태 각각에서 경고 유무를 단언하는 테스트를 tests/harness에 두고, claim 조회를 제거하는 뮤테이션이 RED가 됨을 확인한다(주입 실재 단언 포함). 경고가 나야 하는 것은 첫째(다른 세션 claim)와 넷째('확인 불가' 문구)뿐이다."
  - "⑤ [정정 2026-09-29] ①의 시각·경위 서술을 이벤트 대장과 claim 기록으로 실측 정정한다. amend 이벤트 시각은 07:02:26Z이다(①의 '07:04Z경'은 폐기한 로컬 커밋 시각 07:04:05Z와 섞은 값이었다). HARN-170 재claim(07:00:48Z)보다 1분 38초 뒤이므로 결함 주장(claim 뒤의 무경고 성공)은 그대로 성립한다. 발견은 '커밋 직후'가 아니라 약 6분 뒤(07:10Z경), 이 태스크 파일을 고친 다른 브랜치가 있는지 찾다가 claim 커밋을 보고서였다. 미확인 1건: 07:02:26Z에 이 세션의 로컬 claim 캐시가 그 claim을 이미 알고 있었는지는 확인하지 못했다. 캐시만 보는 조회는 낡은 캐시에 속을 수 있으므로 ②의 구현은 원격 claim 대장을 먼저 갱신할지도 정해야 한다."
