notes: "출처: Kiki 지시(2026-09-15) \"소유자 없는 갭 등재\" 8건 중 '중복 서비스 감사' 축.\n\n왜 갭인가: 이 저장소의 중복 방어는 전부 **착수 시점**(태스크 축)이나 **콘텐츠**(코퍼스·생성기 축)에 있고, 이미 트렁크에 들어간 코드끼리의 중복을 보는 경로는 없다. 사고 이력도 착수 시점 축뿐이다 — OPS-07 병렬 중복 735줄 폐기(2026-07-27·claim push 상시 실패가 원인), MP-04 전량 폐기(2026-09-06·claim 자체를 안 함). 두 사고 모두 \"머지 전\"에 잡거나 못 잡은 것이고, 머지된 뒤 남은 중복은 아무도 세지 않는다.\n\n부재 판정 범위(명시): 역할 기반 검색 결과다 — scripts/ 전수에 duplicate / 중복 / overlap / similar / clone / copy-paste / jscpd, backlog/tasks 전수에 코드 중복 / 중복 구현 / 클론으로 검색했고 걸린 것은 태스크 축·코퍼스 축·생성기 축뿐이었다. \"내가 찾은 방법으로는 0건\"이라는 뜻이다.\n\n주의(등재자 자신의 한계): 예비 스캔의 큰 숫자(render_report 40건 등)는 **이름 충돌**이고 완전 동일 클론은 2쌍뿐이었다. 이 태스크를 \"중복이 많다\"의 근거로 인용하지 말 것 — 얼마나 중복인지는 아직 측정되지 않았고 그 측정이 acceptance ③이다."
