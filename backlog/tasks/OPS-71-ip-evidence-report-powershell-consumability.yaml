acceptance:
  - "① 런북의 리포트 소비 경로에서 ConvertFrom-Json을 제거한다 — Windows PowerShell 5.1은 JSON 객체 키를 대소문자 무시로 다뤄 'Claude <...>'와 'claude <...>'를 중복 키로 거부한다. 키는 사람 이름·이메일이라 우리가 통제할 수 없으므로 소비자를 바꾼다(python -m json.tool 계열 인프로세스 추출)."
  - "② 실패가 성공으로 위장되지 않는다 — 파싱 실패 시 FOREIGN=0종처럼 '이상 없음'으로 읽히는 값을 출력하지 않고 즉시 중단 사유를 낸다. 결함 주입(중복 대소문자 키·파일 부재·status=error)으로 RED를 실측한다."
  - "③ 도구 축: 리포트 JSON이 대소문자 충돌 키를 포함할 수 있음을 도구가 스스로 알리거나(리포트 필드) 소비 안전한 형태를 함께 낸다 — 소비자가 조용히 깨지지 않게."
  - "④ clear 블록도 같은 경로로 교체 — 게이트 clear가 리포트 파싱에 의존하므로 ①을 적용하지 않으면 G-eos-ip-separation-evidence는 계속 막힌다."
