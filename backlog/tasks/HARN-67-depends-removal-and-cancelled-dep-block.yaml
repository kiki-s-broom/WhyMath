acceptance:
  - "① 두 결함을 분리해 적는다 — ⓐ amend에 depends **제거** 경로가 없다(--depends는 부착 전용) ⓑ 선행이 **cancelled**여도 selector가 후속을 차단한다(done만 해소로 침). ⓑ가 더 위험하다: 오등재를 바로잡으면 그것에 의존하던 정상 태스크가 조용히 영구 차단되고, 아무 경고도 나지 않는다"
  - "② ⓑ의 판정 규칙을 정한다 — cancelled 선행을 해소로 볼 것인지, 결정 불가로 보고 **차단하되 경고를 낼 것인지**. 조용한 차단만은 금지(침묵 실패 금지). 어느 쪽이든 next·brief가 그 상태를 **보이게** 해야 한다"
  - "③ ⓐ 정정 경로 신설 — amend에 remove-depends 옵션(full id 지정 + reason 필수). 대장 손편집 금지 원칙상 정정은 CLI로만 가능해야 한다(HARN-57 done 증적·HARN-59 paths와 같은 계열)"
  - "④ 변별력 양방향 실측 — 선행을 cancel한 뒤 후속이 next 후보에서 어떻게 되는지 정상·뮤테이션 양방향으로 확인한다. **상위 N건 기본 출력이 아니라 전건 모드(--n 충분히 큰 수 --json)로 판정**한다 (EOS-62 선례: priority가 낮으면 정상·뮤테이션 양쪽 모두 후보에 없음이라 변별력이 0이 된다)"
  - "⑤ (2026-09-06 추가) ⓒ 게이트 **탈착** 경로 — amend --gate는 부착 전용이고 backlog.py:1483이 '제거는 열지 않는다(게이트 해제는 gates clear의 몫)'라 적었으나, **오부착**(잘못된 태스크에 건 게이트)은 clear 대상이 아니다. requires_gates는 착수 조건(selector.py:6)이라 산출물 검수 게이트를 산출 태스크 자신에 걸면 교착이 되는데, 그 실수를 되돌릴 CLI가 없다. remove-gate 옵션(G-id + reason 필수) 신설"
  - "⑥ (2026-09-06 추가) ⓓ notes **정정** 경로 — audit-deps(HARN-52)가 notes의 '선행/선결' 어구를 위반으로 판정하지만, notes를 고치는 CLI가 없다(amend --reason은 append). 위반을 지적하면서 고칠 수단이 없는 게이트는 사람이 게이트를 끄게 만든다(CLAUDE.md 2026-09-01 등재 사유와 동형). notes 치환 옵션(--notes-replace 구문자 신문자 + reason) 또는 audit-deps가 '의존 아님' 명시 어구를 면제하는 규칙 중 택1"
  - "⑦ (2026-09-06 추가) 사고 경위 — PR #1000 초판: MP-01(회차 태스크)에 G-eos-first-run-canary-review를 걸어 교착 + notes '소프트 선행'으로 audit-deps red → cancel·재등재. 이어 EOS-98이 타 세션 #994와 번호 충돌(개명 CLI 부재) → 미머지 브랜치 재구성·MP-04 재등재. 정정 경로 부재로 인한 번호 소모 EOS-94·96·MP-01·(EOS-98 회수) — 개명(rename) 경로도 같은 계열로 검토"
