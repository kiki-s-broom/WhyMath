notes: "사고 경위(2026-09-05 실측): PR #988 세션이 EOS-94(격리 쓰기측)를 오등재하고 EOS-96(리콜)에 depends_on EOS-94를 붙였다. Codex 리뷰가 EOS-94의 갭 판정이 틀렸음을 지적(격리 쓰기 경로는 api/problems.py patch_problem으로 이미 실재)해 EOS-94를 cancel했더니 **EOS-96이 후보에서 사라진 채 아무 경고도 나지 않았다**. amend에 의존 제거 경로가 없어 정정이 불가능해 EOS-96을 cancel하고 EOS-97로 재등재해야 했다 — 번호 2개와 왕복 1회를 태웠다. HARN-52가 선행을 대장에 집행하게 만든 뒤의 부작용 축이다: 집행이 강해진 만큼 **정정 경로가 없으면 잘못된 집행도 영구화**된다. HARN-57(done 증적 정정)·HARN-59(paths 정정)와 같은 계열의 세 번째 사례이므로 반복 결함으로 등재한다(CLAUDE.md 실수 관리 — 동일 유형 2회 이상은 재발방지 등재 의무).\n\n[정정 2026-09-06] 2026-09-06 PR #1000 등재 과정에서 같은 계열의 정정 경로 공백 2건이 추가로 드러남 — 게이트 탈착·notes 정정 모두 CLI 경로가 없어 초판 오등재(MP-01)를 cancel+재등재로만 고칠 수 있었고, 이어 EOS-98 번호 충돌은 개명 경로가 없어 브랜치 재구성으로만 풀렸다"
