acceptance:
  - "① 해소 경로 필드 — 게이트 모델(scripts/harness/models.py 의 Gate)에 resolved_by(그 게이트의 해소 증거를 만드는 태스크 full-ID 목록)를 추가한다. 설정 경로는 gates add --resolved-by 와 정정 경로(HARN-124 의 gates amend 에 --resolved-by 추가)뿐이다. 대장 손편집 금지는 그대로다.\n\n② 감사 명령 — backlog.py audit-gates 를 신설한다. 판정 대상은 미종결 태스크를 1건 이상 requires_gates 로 막는 pending 게이트다. kind=decision 인데 resolved_by 가 비어 있으면 RED. kind=human·external 은 Kiki 가 직접 행동하는 게이트라 해소 태스크가 없을 수 있으므로 면제할 수 있다. 다만 면제는 게이트 필드(면제 사유)로 명시해야 하고, 사유 없는 공란은 RED 다.\n\n③ 게이트 경유 순환 — resolved_by 태스크 자신, 또는 그 depends_on 추이 폐포(선행의 선행까지)에 속한 태스크가 그 게이트를 requires_gates 로 걸고 있으면 RED. 회귀 픽스처 2건은 실제 사고의 재생이다: (가) P3-00 이 진입 게이트 G-p3-entry-gate2-pass 를 걸고 있어 재판정 소유자가 될 수 없던 상태(2026-09-22) (나) EOS-50 이 자기를 판정 대상으로 삼는 통합 게이트 G-p3-w3-release-merged 를 걸고 있던 상태(2026-09-23).\n\n④ 충족 불가 신호 — resolved_by 가 가리키는 태스크가 대장에 없거나, 그 태스크 또는 선행 폐포 안에 cancelled 태스크가 있으면 RED. 이것이 '영원히 열 수 없는 게이트'의 기계 판정이다.\n\n⑤ CI 배선 — harness-integrity 잡에 audit-gates 스텝을 넣고 배선 동결 테스트를 둔다(tests/infra/test_dep_declaration_wiring.py 선례). 이번 실행에서 그 스텝이 skipped 가 아니라 실제로 도달했는지까지 확인한다.\n\n⑥ 백필 — 착지 시점의 pending 게이트 전수에 resolved_by 또는 면제 사유를 채운다. 2026-09-25 main 3307b64e 기준 pending 21건, 그중 미종결 태스크를 막는 15건이다. 15건 중 7건은 게이트 ID 를 본문에 언급하는 비부착 미종결 태스크가 0건이다(휴리스틱 — 언급 여부만 셌다). 특히 G-p3-g1-week1·G-p3-g2-week2 는 판정 세션이 할 일인데 판정 태스크가 없다. Gate 2 재판정 소유자가 없어 EOS-130 을 신규 등재해야 했던 2026-09-22 상태와 같은 형태다. 만료 없는 그랜드파더로 통과시키지 않는다.\n\n⑦ 변별력 — 절마다(② 필수 · ② 면제 사유 · ③ 순환 2형 · ④ 부재 · ④ 취소) 그 절이 없으면 통과하는 반례 픽스처를 둔다. 절을 하나씩 뮤테이션해 전건 RED, 대조군(정상 연결 게이트)은 GREEN 을 확인한다. 주입 적용 단언(mutated != original)과 원복 바이트 동일 단언을 하네스에 내장한다.\n\n⑧ 한계 명시 — 이 감사는 '연결돼 있는가'만 본다. 연결된 태스크가 다 끝났을 때 실제로 PASS 가 나오는지는 판정하지 못한다(그것은 판정 세션의 몫이다). 이 한계를 docs/standards/build_harness.md 해당 절과 명령 도움말에 적는다."
  - "[설계 변경 2026-09-25 · Kiki 결정 \"②+③ 방향\" · 판정 기준 main 42a77272] 이 항은 위 ①~⑧(resolved_by 칸 + 별도 검사기 audit-gates)을 대체한다. 완료 판정은 아래 v2-1~v2-12만 본다.\n대체 이유: 옛 설계는 게이트를 그래프 밖에 둔 채 칸과 검사기를 덧대는 방식이다. 그러면 순환 검사가 두 벌(store.detect_cycle · 신규 audit-gates)이 되고, 착수 순서의 병목 과소평가는 그대로 남는다. selector.unblock_count 는 바로 다음 태스크 수만 세므로 2026-09-25 실측에서 EOS-24·EOS-124 가 각각 1건으로 보이지만, 게이트를 그래프에 넣고 끝까지 따라가면 각각 13건이다. 새 설계는 게이트를 태스크와 같은 그래프의 노드로 편입해 기존 검사기와 선택기를 그대로 쓴다.\n\nv2-1 게이트 입력 간선 — Gate 모델(scripts/harness/models.py)에 depends_on 과 no_inputs_reason 을 둔다. depends_on 은 이 게이트를 판정·해소하기 전에 끝나야 하는 태스크 full-ID 목록이다. no_inputs_reason 은 사람이 직접 행동하는 게이트처럼 입력 태스크가 원래 없는 경우의 사유다. pending 게이트는 둘 중 정확히 하나를 가져야 한다. 둘 다 비었거나 둘 다 있으면 validate 오류다.\n\nv2-2 통합 그래프는 하나 — 태스크와 게이트를 노드로, 세 종류 간선(task.depends_on · task.requires_gates · gate.depends_on)을 한 그래프로 만드는 함수를 한 곳에 둔다. 다음이 전부 이 함수 하나를 쓴다: validate 의 순환 검사(store.detect_cycle), 쓰기 시점 순환 거부(amend --depends 의 자체 경로 추적 · amend --gate · add 의 --depends/--gates · gates add/amend 의 --depends). 두 번째 순환 검사기를 새로 만들지 않는다. 순환 보고에는 경로에 게이트 ID 가 보여야 한다.\n\nv2-3 막다른 길 — gate.depends_on 이 대장에 없는 태스크나 cancelled 태스크를 가리키면 validate 오류다(영원히 못 여는 게이트). 태스크 depends_on 에 같은 판정이 이미 있으면 그 함수를 공유한다.\n\nv2-4 병목 우선순위 — selector.unblock_count 를 '바로 다음 태스크 수'에서 '통합 그래프를 끝까지 따라간 미종결 후손 수'로 바꾸고, board.py 도 같은 값을 쓴다. 정렬 키 순서(stage → priority → 해금 수 → id)는 유지하므로 영향은 같은 stage·priority 안의 순서다. 착지 시점 대장으로 EOS-24·EOS-124(또는 그 시점 G-p3-entry-gate2-pass 입력 사슬의 태스크)의 해금 수를 다시 계산해 보고한다. 2026-09-25 실측은 1 → 13 이다.\n\nv2-5 대기 이유 설명 — next·status 가 게이트 때문에 제외한 태스크에, 어느 입력 태스크를 기다리는지를 경로로 보인다(예: P3-01 ← G-p3-entry-gate2-pass ← EOS-130 ← EOS-24).\n\nv2-6 쓰는 순간 막기 — gates add 는 --depends(반복 지정) 또는 --no-inputs <사유> 중 하나가 없으면 exit 1 로 거부하고 대장에 아무것도 쓰지 않는다. gates amend(HARN-124)에 같은 두 옵션과 입력 제거(--remove-depends)를 더한다. 모든 쓰기는 v2-2 함수로 순환·막다른 길을 먼저 판정하고, 통과할 때만 쓴다.\n\nv2-7 해소 시점 집행 — gates clear 는 depends_on 태스크가 전부 done 이 아니면 exit 1 로 거부한다. 판정 근거가 될 작업이 끝나지 않았는데 조건 충족을 기록할 수는 없기 때문이다. gates waive 는 Kiki 의 예외 경로이므로 이 검사를 받지 않는다.\n\nv2-8 FAIL 판정 기록 — decision 게이트의 FAIL 판정을 gates amend --verdict FAIL --evidence <판정문 경로·기준 커밋> 으로 기록하게 한다. 이때 --depends 로 미충족 항목의 소유 태스크를 1건 이상 새로 붙이지 않으면 거부한다. 판정 이력은 게이트 corrections(HARN-124)에 쌓인다. 2026-09-24 재판정문이 지목한 EOS-24·EOS-124 가 재판정 태스크에 연결되지 않은 채 방치된 사고(계열 gate-resolution-path-unlinked 3회차)를 막는 집행 지점이다.\n\nv2-9 백필 — 착지 시점의 pending 게이트 전수(2026-09-25 기준 21건)에 depends_on 또는 no_inputs_reason 을 채운다. 만료 없는 그랜드파더로 통과시키지 않는다. cleared·waived 게이트는 아무것도 막지 않으므로 대상이 아니다. G-p3-entry-gate2-pass 의 입력은 EOS-130 이다. G-p3-g1-week1·G-p3-g2-week2 는 판정 태스크가 없으므로, 판정 태스크를 CLI 로 등재한 뒤 그것을 입력으로 건다.\n\nv2-10 변별력·회귀 — 재현 픽스처 3종이 각각 쓰기 시점에 거부되고 validate 도 RED 를 내야 한다: 사고 1(P3-00 이 자기가 증거를 대야 할 진입 게이트를 요구), 사고 2(EOS-50 이 자기를 판정 대상으로 삼는 통합 게이트를 요구), 사고 3(FAIL 기록에 소유 태스크 없음). 정상 사슬 대조군은 GREEN 이어야 한다. 절마다(입력 필수 · 순환 · 막다른 길 · clear 집행 · FAIL 기록 · 전이 해금 수) 그 절이 없으면 통과하는 반례를 두고 뮤테이션 전건 RED 를 확인하며, 주입 적용 단언(mutated != original)과 원복 바이트 동일 단언을 하네스에 내장한다. 순위 변경 영향은 착지 PR 에 next 전건(--n 전체 --json)의 전후 비교로 첨부한다(순위가 바뀐 태스크 수 · 상위 20건 변화). 순서를 동결한 기존 테스트는 지우지 않고 의도를 적어 갱신한다.\n\nv2-11 CI — 새 CI 스텝을 만들지 않는다. 검사가 validate 와 쓰기 경로 안에 있으므로 harness-integrity 잡의 기존 validate 스텝이 집행한다. 착지 PR 의 CI 실행에서 그 스텝이 skipped 가 아니라 실제로 도달했는지 확인한다.\n\nv2-12 한계 명시 — 기계가 판정하는 것은 구조적 불가능(순환 · 막다른 길 · 입력 없음)까지다. 기준 자체가 현 정책에서 달성 불가능한 의미적 불가능은 그래프로 알 수 없다. 그것은 기준을 실행 가능한 테스트로 두는 방식(예: PED-36 ⑫ 의 3루프 상시 하네스)과 판정 세션의 몫이며, 이 한계를 docs/standards/build_harness.md 와 명령 도움말에 적는다."
