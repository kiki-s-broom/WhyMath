notes: "출처: 2026-09-25 Kiki 질문 \"가능하지 않은 것을 게이트로 두는 게 맞나? 대책은?\" — G-p3-entry-gate2-pass 점검 세션. 판정 기준 main 3307b64e.\n\n[실측 결론] G-p3-entry-gate2-pass 는 원리상 불가능한 게이트가 아니다. 통과 기준(10조건 + 무개입 연속 3루프 — 2026-09-19 판정문 §7)은 코드로 달성할 수 있는 기능 요건이고, 실학생·외부 기관·비용이 필요하지 않다. 2026-09-24 재판정이 지목한 FAIL 원인 두 축의 수정은 이미 PR 로 올라와 있다(EOS-24 = #1316 · EOS-124 = #1317 · 두 PR 모두 CI green · 2026-09-25 기준 미머지). 게이트를 불가능처럼 보이게 만든 것은 게이트와 해소 작업 사이의 연결이 대장에 없다는 구조 결함이다.\n\n[같은 계열 3회 — 세 번 모두 사람이 읽다가 발견] (1) 2026-09-22 P3-00 게이트 경유 순환 (2) 2026-09-23 EOS-50 게이트 경유 순환 (3) 2026-09-24 재판정문이 PASS 경로로 EOS-24·EOS-124 를 지목했으나 재판정 태스크 EOS-130 의 depends_on 에는 EOS-21 하나만 걸려 있었다 — Kiki 지시로 #1314 가 수동 연결했다(2026-09-25). 기계 검사가 하나도 없었던 이유는 검사할 대상이 없기 때문이다. 게이트 모델 필드는 id·title·kind·assignee·status·requested·remind_after_days·evidence·cleared_by 이고, 해소 경로를 가리키는 필드는 내가 찾은 방법으로 0건이다(models.py Gate 정의 · 역할 키워드로 태스크 대장 검색).\n\n[선행] HARN-124(gates amend) — #1284 브랜치에서 done · 2026-09-25 기준 미머지. 백필(⑥)과 정정(①)에 게이트 정정 CLI 가 필요하다.\n\n[중복 확인] OPS-38(CI 게이트 도달 가능성 계약)은 CI 검사 잡의 도달을 다루는 다른 축이다. HARN-39(게이트 제목·notes 편집 CLI)와 HARN-124(게이트 문면·독촉 정정)는 게이트 필드의 정정 경로이지 해소 경로 연결·순환 검사가 아니다. HARN-52(audit-deps)는 태스크 사이 의존만 보고 게이트는 보지 않는다(dep_declaration.py 354행 주석).\n\n[정정 2026-09-25] paths ['scripts/harness/models.py', 'scripts/harness/backlog.py', 'scripts/harness/store.py', 'tests/harness/test_gate_resolution*', '.github/workflows/ci.yml', 'docs/standards/build_harness.md', 'backlog/gates.yaml'] → ['scripts/harness/models.py', 'scripts/harness/store.py', 'scripts/harness/selector.py', 'scripts/harness/board.py', 'scripts/harness/backlog.py', 'tests/harness/test_gate_graph*.py', 'tests/harness/test_selector.py', 'docs/standards/build_harness.md', 'backlog/gates.yaml']: Kiki 결정 2026-09-25 ②+③ — 게이트를 그래프 밖에 두고 칸·검사기를 덧대는 설계(①~⑧)를 게이트의 그래프 편입(v2-1~v2-12)으로 대체. 실측 근거: selector.unblock_count 가 바로 다음 태스크만 세어 EOS-24·EOS-124 가 1건으로 보이나 게이트 편입 시 13건, store.detect_cycle 과 amend 의 경로 추적이 태스크끼리만 순환을 본다. 새 CI 스텝이 필요 없어 ci.yml 범위를 뺐다.\npaths 제거 