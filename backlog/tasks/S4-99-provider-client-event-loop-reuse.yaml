notes: "발견 경위(2026-09-24 · 게이트 G-s416-round2-live-battle 라이브 회차): Kiki 실행 로그에서 `missing_condition_checklist`·`multiple_valid_answers_counterexample`·`independent_reconstruction` 3관점이 거의 전 문항 `RuntimeError`로 unclear 처리됐다. 셋은 정확히 v4 관점 세트 3종 각각의 **첫 관점**이다. `CrossVerifier.verify`가 호출마다 `asyncio.run`으로 새 루프를 여는데 provider가 캐시한 httpx 기반 클라이언트의 커넥션 풀이 닫힌 이전 루프에 묶여 있어, 새 루프의 첫 요청이 `RuntimeError: Event loop is closed`로 죽는다(두 번째 요청부터는 풀이 비워져 성공). 컨테이너에서 실물 ollama 0.x AsyncClient + 가짜 서버로 동일 패턴(루프마다 첫 요청만 실패) 재현 완료. 로컬 강등전 전 회차(--local-model 포함)와 anthropic 좌석 회차가 같은 결함 아래서 측정됐을 가능성이 높다 — openrouter·deepseek은 호출마다 클라이언트를 새로 만들어 영향 없음."
