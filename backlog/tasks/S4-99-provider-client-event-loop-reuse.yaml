  - "① `OllamaProvider`·`AnthropicProvider`가 기본 생성한 비동기 클라이언트를 **생성 당시의 이벤트 루프가 아닌 루프**에서 재사용하지 않는다 — 루프가 바뀌면 새로 만든다(주입된 클라이언트는 건드리지 않는다). ② 회귀 테스트: 두 번의 `asyncio.run` 사이에서 기본 클라이언트가 교체되는지, 같은 루프 안에서는 재사용되는지, 주입 클라이언트는 유지되는지를 동결하고, 수정을 되돌리면 RED가 나는지 뮤테이션으로 확인한다. ③ 실물 `ollama` AsyncClient + 로컬 가짜 서버로 수정 전 `Event loop is closed` 재현 / 수정 후 0건을 실측한다(PR 본문에 기록). ④ `residue_gate_demotion_battle_history.md`에 2026-09-24 2차 라이브 회차 수치와 이 결함의 영향(합집합 단조성상 오검출 결론 불변)을 기록한다."
