acceptance:
  - "① 상태 8종을 데이터로 선언 — NEW·DIAGNOSING·READY·LEARNING·PRACTICING·ASSESSING·REMEDIATING·ADVANCING을 열거형으로 두고, 허용 전이를 **코드 분기가 아니라 전이표 데이터**(frozenset of (from,to))로 선언한다. 전이표는 단일 진실 원천이며 전이 판정 함수는 그 표만 읽는다.\n② 미정의 전이 거부 — 표에 없는 전이는 조용히 통과시키지 않고 전용 예외로 거부한다. 방어 검증 = NEW→ADVANCING 등 미정의 전이를 주입해 RED 확인(정상 입력 초록은 증거가 아님 · CLAUDE.md 2026-09-01).\n③ v1 전이 규칙 5종 + 규칙당 반례 1개 — 정답·고신뢰→ADVANCING / 정답·저신뢰→PRACTICING / 오답·오개념확인→REMEDIATING / 오답·선수결손→선수 개념 / 반복실패→설명·힌트. 각 규칙마다 그 규칙이 없으면 통과해 버리는 입력을 픽스처에 넣는다(픽스처 접촉 규칙 · 2026-09-07).\n④ Event → LearnerState → Policy → Next Action 구조 — UI→API→DB가 아니라 이 축으로 배선한다. Policy는 교체 가능한 Protocol로 분리하고 v1 내부 구현은 if/else로 둔다. LLM은 이 경로에서 상태를 결정하지 않는다(설명·후보 분류까지).\n⑤ 영속 좌석 배선(정본화≠집행 별항) — 상태를 user_state_snapshot의 신규 컬럼으로 영속하고 writer를 배선한다. 기존 writer 0건 좌석이므로 이 태스크가 첫 writer다. 조립 즉시 계산이 아니라 영속임을 명시한다.\n⑥ 진실 원천 중복 완화 명시 — *MasteryHistory·attempt_event와 같은 사실을 두 곳에 두게 되는 위험(2026-09-03 보류 사유)을 어떻게 다루는지 코드 주석과 ADR에 적는다. 영속 상태는 파생 가능해야 하며, 이력에서 재계산한 값과 영속값이 어긋나면 검출되는 대조 경로를 둔다.\n⑦ 뮤테이션 전건 결과 — 전이표·거부 경로·규칙 5종에 뮤테이션을 주입해 전건 RED를 확인하고 결과를 PR 본문에 적는다. 주입이 실제 적용됐는지(mutated != original)도 단언한다."
  - "[범위 정정 — 착수 후 실측 반영 · 판정 기준 main 0f12e76a] acceptance ⑤는 등재 시점에 \"상태를 user_state_snapshot의 신규 컬럼으로 영속한다\"로 적혔으나, 착수 후 실측으로 **좌석을 바꿨다**. 사유 3건:\n\n① user_state_snapshot은 학생당 N행의 *시점 사진*(숙달 맵·시간·멘탈 신호)이라 \"국면 전이 사건\"을 담을 자리가 없다. 컬럼을 하나 더하면 사진마다 그때의 상태를 중복 기록하게 된다.\n② EOS-103(PR #1185·미머지)이 LearnerState 좌석에 learner_state 테이블을 도입 중이다. main 기준으로는 부재이나(git cat-file -e origin/main:src/backend/whymath_backend/db/models/learner_state.py → 부재), 그쪽 좌석에 컬럼을 더하면 머지 시 충돌한다.\n③ 가변 상태 컬럼은 \"왜 그 상태인가\"와 \"누가 바꿨는가\"를 둘 다 잃는다(UPDATE가 직전 값을 지운다).\n\n대신 learning_state_transition 테이블을 신설했다 — append-only 전이 원장이며 LearnerState 좌석의 2번째 테이블로 정본(canonical_entity_model_v1.md §2-A 13행)에 편입했다(curriculum_version이 Curriculum 좌석 2번째인 선례 동형). 현재 상태는 저장하지 않고 원장 최신 행에서 파생한다(get_current_state) — 가변 상태 컬럼 0건이므로 \"현재 상태\"의 원천은 원장 하나다. user_state_snapshot은 읽지도 쓰지도 않았다(writer 0 유지 · 그 좌석 판정은 EOS-10 acceptance ③이 소유).\n\n[집행 지점 — 정본화와 별항]\n· 서빙: api/me.py::submit_attempt → build_attempt_evidence → advance_on_attempt. AST 가드 test_submit_attempt_actually_calls_the_state_machine이 동결(호출 제거 시 뮤테이션 M19가 RED).\n· 표면: GET /v1/me/learning-state · POST /v1/me/learning-state/transitions(미정의 전이 409 · 정책 소유 트리거 422).\n· 단일 writer: l2/learning_state_machine.py::record_transition. 판정(assert_transition_allowed)이 적재보다 앞서므로 거부된 전이는 원장에 남지 않는다(M11이 RED).\n· GDPR 파기: privacy/erasure.py::_ERASURE_PLAN에 편입(전수 가드 test_no_owner_column_table_missing_from_erasure_plan이 미편입을 RED로 잡았다 — 이 게이트가 실제로 누락을 검출했다).\n\n[뮤테이션 22종 전건 RED] 하네스는 순수 Python(셸 배제)이며 주입 적용(mutated != original)과 원복 바이트 동일(sha256)을 각각 단언한다. M1 판정 항상 True / M2 침묵 통과 / M3 (NEW,ADVANCING) 추가 / M4 (ASSESSING,ADVANCING) 제거 / M5 (NEW,NEW) 자기전이 / M6 None을 고확신 / M7 확신 경계 >=→> / M8 반복실패 경계 >=→> / M9 규칙 우선순위 뒤집기 / M10 미매치 폴백 / M11 적재가 판정보다 앞섬 / M12 거부를 조용히 삼킴 / M13 정책 불법 상태 삼킴 / M14 INITIAL_STATE=READY / M15 대조 항상 일치 / M16 미채점을 실패로 계상 / M17 스캔 LIMIT 제거 / M18 정답에도 오개념 preload / M19 서빙 호출 제거 / M20 응답 필드 Optional화 / M21 정책 트리거 차단 해제 / M22 409→200.\n자진 공개: 초회 실행에서 M13이 구문 오류로 RED였다 — 구문 오류 RED는 검출이 아니므로 하네스를 고쳐(try/except 짝 맞춤 + ast.parse 선단언) 재실행해 진짜 RED를 확인했다.\n\n[명시한 한계 3건 — 승계 없이 숨기지 않는다]\n① 기존 학생 전원이 NEW라 첫 응답 제출의 평가 진입 전이(NEW → ASSESSING)가 거부된다. 그 쌍을 전이표에 넣어 거부를 없애는 선택은 하지 않았다 — \"무엇 대비 평가인가\"가 없는 평가를 합법화하면 머신이 보증하는 것이 사라진다. 거부는 응답 learning_state.rejected_transition에 값으로 실리며(예외 타입명 포함), attempt 적재·숙달 전파는 그대로 성공한다. 이 슬라이스는 상태 머신을 관측 가능하게 배선하며 학습 루프를 게이팅하지 않는다.\n② 규칙 R4(선수결손)는 서빙 경로에서 매치되지 않는다 — prerequisite_gap_concept_ids의 생산자(recommend_prerequisite_gaps)가 개념 그래프 재귀 CTE 순회라 제출마다 돌리기에 무겁다. build_attempt_evidence가 인자로 받도록 열어 두었고, 미배선 사실을 모듈 docstring 표와 테스트로 못 박았다.\n③ record_transition의 읽기-적재 사이 TOCTOU 창이 남는다. append-only라 과거를 훼손하지 않으며 어긋남은 reconcile_state가 검출한다."
