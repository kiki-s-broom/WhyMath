notes: |-
  발견 경위 (GOLD-25 세션 · 2026-11-17): GOLD-25 푸시 전 로컬 CI 미러(HARN-308)에서 `infra-contracts`가 red였다. 처음에는 4건이었고, 9p 지연을 제거한 뒤 남은 1건이 이 테스트다. 원인 분리 실측 — `origin/main` a350b96d의 깨끗한 워크트리에서도 같은 실패가 재현됐다(파일 단위 6회 중 4회 red · 단독 실행은 green). 즉 순서 의존이며 내 변경과 무관하다.

  기전: `scripts/analysis/corpus_facts.py`의 `_READ_CACHE` 키가 `(f"{path}:{parse.__name__}", st_mtime_ns, st_size)`다. 테스트는 `_provenance.json`을 `record_count: 3` → `4`로 고치는데 바이트 길이가 같아 `st_size`가 불변이고, 두 쓰기가 같은 타임스탬프 tick에 들어가면 `st_mtime_ns`도 불변이라 캐시가 옛 파싱을 돌려준다. 이 환경 실측: 즉시 재작성 200회 중 184~187회 mtime_ns 동일.

  영향: GitHub Actions(ext4·ns 타임스탬프)는 통과하므로 trunk CI는 초록이다. 그러나 굵은 타임스탬프 파일시스템에서는 상시 flake이고, 이 머신에서는 모든 세션의 HARN-308 미러가 `infra-contracts`에서 red가 되어 매번 사유 있는 우회를 쓰게 만든다. 우회가 습관화되면 게이트가 신호를 잃는다.

  주의: `tests/infra`를 고칠 때 `scripts/analysis/corpus_facts.py`는 골든 규칙(새 코드는 golden/에만) 밖 파일이다 — 착수 전에 소유자 판단이 필요하다.
