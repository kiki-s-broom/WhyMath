acceptance:
  - "① 계정 유형 실측 선행 — kiki-s-broom이 실제로 Organization 계정인지 GitHub API(owner.type)로 확인한다. 이 세션은 cross-tier 제약으로 kiki-s-broom 저장소에 API 접근이 불가했다(add_repo가 \"cross-tier adds are not supported in v1\" 로 거부 — 세션당 단일 owner만 부착 가능). kiki-s-broom을 초기 소스로 하는 새 세션에서 GET /repos/kiki-s-broom/whymath 를 실행해 owner.type=Organization을 확정하기 전까지는, \"merge queue 큐잉등록 성공\"이 유일한 간접 근거임을 명시한다(간접 신호를 성공 판정으로 쓰는 안내 금지 축 — 반증 가능성 열어둠)."
  - "② 시크릿 이관 — doldori7/WhyMath에 존재가 확인된 시크릿(DEPLOY_SSH_HOST/USER/KEY/KNOWN_HOSTS/PATH, PR_AUTO_RESYNC_TOKEN)을 kiki-s-broom/whymath 저장소 Settings→Secrets and variables→Actions에 동일 이름으로 재등록한다. 값은 세션이 읽을 수 없으므로 Kiki가 직접 발급·등록해야 한다(기존 값 복사 불가 — GitHub는 시크릿 값을 재조회 허용하지 않는다)."
  - "③ 브랜치 보호/룰셋 재구성 — .github/branch-protection-setup.md에 문서화된 규칙(필수 상태 체크 목록·up-to-date 강제 등)을 kiki-s-broom/whymath main에 동일하게 재설정한다. 이번엔 merge queue 옵션이 실제로 화면에 있는지 먼저 확인하고(①의 조직 계정 확정과 연동), 있으면 활성화한다. HARN-82가 지적한 축(문서와 라이브 설정 불일치) 재발을 막기 위해, 설정 직후 라이브 조회 스크립트(pr_merge_readiness.py 등)로 required check 개수를 실측해 문서에 병기한다."
  - "④ CI 배선 확인 — kiki-s-broom/whymath에서 GitHub Actions가 활성화되어 있는지, ci.yml의 merge_group 트리거를 포함한 5개 워크플로(ci.yml·deploy.yml·branch-cleanup.yml·harness-audit.yml·pr-auto-resync.yml)가 실제로 발화하는지 1회 이상 실측 확인한다(성공 경로만 보고 설계하지 않기 — 실패 시 원인이 로그에 남는지도 확인)."
  - "⑤ 병렬 세션 좌표 — 이관 시점에 doldori7/WhyMath에서 진행 중인 다른 세션들(이 등재 시점 기준 EOS-63·HARN-56·HARN-82·HARN-86·HARN-87·MGMT-06·MP-02 claim 중)의 작업이 두 저장소로 갈라지지 않도록 컷오버 시점을 정하고, 컷오버 전후로 미러링(강제 동기화 또는 일시 정지) 절차를 문서화한다. 이관 도중 커밋이 갈라지면 회수 비용이 이번 사고 이력(미병합 고립 4회차 등)과 같은 유형이 된다."
  - "⑥ 정본 참조 갱신 — README·CI 배지·docs 내 저장소 URL 등 doldori7/WhyMath를 정본으로 지칭하는 참조를 kiki-s-broom/WhyMath로 갱신한다(코드 변경은 이 세션이 PR로 낼 수 있는 범위 — 설정 자체는 Kiki 실행)."
  - "⑦ 구 저장소 처리 방침 — doldori7/WhyMath를 아카이브할지, 리다이렉트 안내만 남길지 Kiki가 결정하고 기록한다."
  - "⑧ 이 태스크의 실행 범위 한계 명시 — 착수 세션은 kiki-s-broom을 초기 소스로 하는 새 세션이어야 한다(cross-tier 제약 실측 완료 — ①에 근거 병기). doldori7/WhyMath에 고정된 세션에서는 준비 문서·백로그 등재까지만 가능하고 실제 push/PR/설정 집행은 불가하다."
  - "⑨ [2026-09-09 정정] 이 태스크 등재 시점에는 kiki-s-broom/whymath를 doldori7/WhyMath의 별도 복사본으로 오인해 acceptance ②③에 '시크릿 재등록'·'브랜치 보호 재구성'을 적었다. 이후 이 브랜치를 kiki-s-broom/WhyMath로 push하자 GitHub가 'This repository moved'를 응답했고, 브랜치·claim 이력이 doldori7 쪽과 완전히 동일함을 실측 확인했다 — 즉 별도 복사본이 아니라 GitHub 저장소 전환(Transfer repository)이다. GitHub 저장소 전환은 시크릿·브랜치 보호 룰셋·webhook·Actions 설정을 저장소와 함께 자동으로 옮긴다(GitHub 표준 동작). 따라서 acceptance ②③은 '재등록/재구성'이 아니라 '자동 승계가 실제로 됐는지 1회 실측 확인'으로 범위를 좁혀 수행한다 — 확인 결과 누락된 항목이 있을 때만 그 항목을 추가로 등록한다."
  - "⑩ **①③④ 실측 완료 · ⑥의 실행 표면 축 착지 (2026-09-10 · PR #1063 세션)** — 나머지는 Kiki 결정이라 이 세션이 닫지 않는다.\n\n[① 계정 유형 — 답변됨] `owner.type=Organization`(GitHub 검색 API 응답 `\"type\":\"Organization\"` · org id 326699881). ⑧이 \"kiki-s-broom을 초기 소스로 하는 새 세션이어야 한다\"고 적었으나 **그 전제는 부분적으로 틀렸다** — doldori7 스코프 세션에서도 REST는 리다이렉트로 도달하고 git push도 된다(실측: 이 브랜치가 그렇게 push됐다). 거부되는 것은 GraphQL(리뷰 스레드 resolve)과 프록시 경유 raw curl뿐이다.\n\n[③ 브랜치 보호 — 승계 확인 + merge queue 활성] `PUT /pulls/1063/merge` → 405 `Repository rule violations found: A conversation must be resolved before this pull request can be merged / Changes must be made through the merge queue / All comments must be resolved`. 즉 룰셋이 승계됐고 merge queue가 실제로 켜져 있다. merge queue 전제 재판정은 HARN-98(착지 · PR #1078)과 HARN-56이 소유한다.\n\n[④ CI 배선 — 확인] `GET /actions/workflows` 총 5건 전부 state=active. 실발화도 관측 — pr-auto-resync run #16(schedule · success), harness-audit run #293(push · actor=github-merge-queue[bot]), CI가 PR #1063에서 체크 18건 정상 생성.\n\n[⑥ 정본 참조 — 실행 표면 축만 착지] 워크플로 인자·도구 코드·런북 문자열은 HARN-02가, GitHub API 리다이렉트 미추종 5곳은 HARN-03이 해소했다(둘 다 PR #1063). **이름을 새 owner로 바꿔 적지 않고** `$GITHUB_REPOSITORY`·`repos/{owner}/{repo}` 자기서술로 바꿨다 — 다음 이관에서 같은 사고를 예약하지 않기 위해서다. 전수 가드 = tests/infra/test_canonical_repo_reference.py. README·배지·docs URL 축은 **미착수로 남는다**.\n\n[② 시크릿 — 4/5] PR_AUTO_RESYNC_TOKEN 승계는 확인(pr-auto-resync가 fail-closed 설계인데 run #16까지 success). **DEPLOY_SSH_HOST/USER/KEY/KNOWN_HOSTS/PATH는 미실측** — deploy.yml이 수동 승인이라 이관 후 실행 이력이 없어 확인 경로가 없다.\n\n[남는 축 — 전부 Kiki 결정] ② DEPLOY_SSH_* 실측(배포 1회 또는 저장소 설정 화면 확인) · ⑤ 병렬 세션 컷오버 좌표 · ⑦ 구 저장소(doldori7/WhyMath) 처분 방침. 그래서 이 태스크를 done으로 닫지 않고 blocked로 되돌린다 — 실측으로 끝낼 수 있는 축은 위에서 끝냈다."
  - "⑪ [2026-09-12 · 이 세션] ⑥ 잔여 축(README·docs URL) 착지 + ⑤ 재판정.\n\n[⑥ 잔여 — README·배지·docs URL] ⑩이 \"미착수로 남는다\"고 적은 축을 착지했다. 대상 7개 파일에서 doldori7/WhyMath를 kiki-s-broom/WhyMath로 갱신: .github/branch-protection-setup.md(진입 경로·재발 탐지 gh api 명령·소스 pin 시정 3단계 — 총 6곳), docs/architecture/deployment_cd_runbook.md(environment 승인 규칙 gh api 3곳 — reviewer id=doldori7는 계정 식별자라 원문 유지), docs/ops/kice_pdf_history_purge_runbook.md·docs/standards/ssm_activation_handoff.md·infra/phaiakes9/LIVE_LLM_ACTIVATION.md·infra/phaiakes9/SETUP_GUIDE.md(git clone 명령 각 1곳), docs/standards/system_superiority_maintenance.md(SSM 발동 프롬프트의 \"레포=\" 1곳). README.md 자체와 CI 배지는 애초에 doldori7 참조가 없어 대상이 아니었다(실측: grep 0건).\n\n[의도적으로 남긴 것 — 판정 시점 보존] MEMORY.md·CLAUDE.md(사고 경위 인용)·docs/architecture/canonical_repo_migration_kiki_s_broom_runbook.md·이 태스크 자신의 acceptance ⑨⑩(날짜가 붙은 실측·결정 기록)은 과거 사실이라 고치지 않았다(CLAUDE.md \"미머지 존재를 충족으로 단정 금지\" 규칙군의 판정 시점 원칙과 동일 근거 — 이력을 현재로 덮어쓰면 판정 시점이 사라진다). .github/branch-protection-setup.md 내부에도 날짜가 박힌 사고 기록 인용문 2곳(줄 8·176 — \"[정정 2026-09-03]\"·\"3회차 재발\" 블록)과 전환 전후 비교표 1곳(줄 302 — 의도적 대조)은 같은 이유로 남겼다. tests/harness·tests/infra의 doldori7 문자열은 전부 함수 인자로 넘기는 임의 픽스처 값이라(실제 저장소 식별과 무관) 대상이 아니다.\n\n[검증] pytest tests/infra/test_ruleset_drift.py tests/infra/test_ruleset_pin_plan.py tests/infra/test_required_checks_doc.py tests/infra/test_merge_queue_wiring.py tests/infra/test_deploy_artifacts.py tests/infra/test_pr_auto_resync.py tests/infra/test_source_document_binary_guard.py tests/infra/test_canonical_repo_reference.py tests/infra/test_branch_cleanup.py -q → 259 passed, EXIT=0(내가 건드린 문서를 구조적으로 파싱하는 테스트 전부 포함). backlog.py validate --quiet → EXIT=0.\n\n[⑤ 재판정 — 별도 조정 불필요] 저장소가 사본이 아니라 GitHub Transfer였음이 이미 실측 확정됐다(⑨) — 브랜치·claim 이력이 자동으로 그대로 옮겨졌고, 이관 시점에 doldori7/WhyMath에서 진행 중이던 세션들(EOS-63·HARN-56·HARN-82 등)의 브랜치는 컷오버 조정 없이 kiki-s-broom/WhyMath에서 계속 작업이 이어졌다(실측: SessionStart 브리핑이 이관 이후로도 그 세션들의 원격 claim을 계속 인식). 즉 \"미러링 또는 일시 정지 절차 문서화\"가 애초에 필요하지 않았다 — 대상(사본 병존)이 존재하지 않았기 때문이다. 별도 문서를 새로 만들지 않고 이 항에 판정만 남긴다.\n\n[여전히 Kiki 몫 — ②⑦] 이 세션은 kiki-s-broom/WhyMath를 시작 저장소로 하는 세션이 아니라 doldori7/WhyMath 스코프 세션이 kiki-s-broom 쪽으로 리다이렉트돼 push하는 형태라(⑧·⑨ 선례와 동일 경로), DEPLOY_SSH_* 시크릿 승계 실측(②)에 필요한 저장소 설정 화면 접근이나 배포 실행을 할 수 없다. ⑦(구 저장소 doldori7/WhyMath 처분 방침)은 정책 결정이라 세션이 대신 정할 수 없다. 상태는 blocked를 유지한다."
  - "⑫ [2026-09-12] ⑦ 구 저장소 처분 방침 — Kiki 결정: 아카이브. 단, 이 세션은 doldori7 소유 저장소에 API로 접근할 수 없어(cross-tier 제약 재확인 — add_repo(owner=doldori7) 시도가 이번엔 하네스가 아니라 자동 모드 권한 분류기 자체에서 거부됨) \"아카이브할 대상이 실제로 남아 있는지\"를 이 세션이 검증하지 못했다. GitHub 저장소 전환(Transfer)은 옛 owner/repo 슬롯을 리다이렉트로만 남기고 그 owner의 저장소 목록에서 완전히 제거하는 것이 표준 동작이라, doldori7 계정에는 이미 \"Archive\" 버튼을 누를 대상 자체가 남아 있지 않을 가능성이 높다(추정 — 미실측). Kiki가 https://github.com/doldori7?tab=repositories 를 열어 WhyMath가 목록에 보이는지만 확인하면 10초 내 판가름난다: 안 보이면 이미 전환으로 완전히 사라진 것이라 이 항목은 조치 불필요로 종결하고, 보인다면(예: 포크가 별도로 남아 있는 경우) 그 저장소에서 Settings → Archive this repository를 실행한다. 이 확인 전까지는 acceptance ⑦을 완료로 닫지 않는다(환경 사실의 추론 등재 금지 — CLAUDE.md)."
  - "⑬ [2026-09-14 · 이 세션] ②⑦ 재확인 시도 — 여전히 Kiki 전용 확인만 남는다.\n\n이번 세션은 kiki-s-broom/whymath가 시작 저장소라(acceptance ⑧이 요구한 조건 충족) 이전 세션들보다 API 접근권이 넓지만, 그래도 두 항목을 대신 끝낼 수 없었다.\n\n[② DEPLOY_SSH_* 시크릿] GitHub API·MCP 도구 어디에도 '시크릿 이름 목록 조회' 기능이 없다(값은 물론 존재 여부도 API로 노출하지 않는 GitHub의 의도된 설계 — actions_list 도구는 list_workflows/list_workflow_runs/list_workflow_jobs/list_workflow_run_artifacts만 지원, secrets 관련 method 없음). 간접 증거로 deploy.yml 워크플로 실행 이력을 조회했으나(actions_list list_workflow_runs, resource_id=deploy.yml) kiki-s-broom/whymath에서 total_count=0 — 이관 이후로도 여전히 실행 이력이 없어 '성공 배포가 시크릿을 증명'하는 간접 경로도 막혀 있다. 결론: 이 항목은 Kiki가 저장소 Settings → Secrets and variables → Actions 화면에서 직접 6개 이름(DEPLOY_SSH_HOST·DEPLOY_SSH_USER·DEPLOY_SSH_KEY·DEPLOY_SSH_KNOWN_HOSTS·DEPLOY_SSH_PATH·PR_AUTO_RESYNC_TOKEN)의 존재를 확인하는 것 외에 세션이 대신할 검증 경로가 없다.\n\n[⑦ 구 저장소 처분] doldori7 저장소는 cross-tier 제약으로 이 세션에서도 API 조회 자체가 불가함을 재확인(add_repo 시도 없이, 세션 스코프가 kiki-s-broom 단일 owner로 고정된 채 시작됐음을 시스템 리마인더로 확인). Kiki가 github.com/doldori7?tab=repositories 에서 WhyMath 존재 여부를 직접 확인해야 한다 — 없으면 ⑦은 조치 불필요로 종결, 있으면 그 저장소에서 Archive 실행.\n\n[상태 유지] 위 두 확인 전까지 done으로 닫지 않고 blocked 유지 — 새로 확인된 사실은 \"대체 검증 경로가 없음이 이 세션에서도 재확인됨\"뿐이고, ⑫의 결론(Kiki 결정 대기)은 바뀌지 않는다."
  - "⑭ [2026-09-15 · 이 세션] 새 축 발견 — **Kiki 머신 로컬 클론의 origin URL이 아직 옛 주소다.** 기존 ⑥은 *저장소 안의 파일*(README·docs·워크플로 인자)만 다뤘고, ⑪이 그 잔여를 착지시키며 \"⑥ 완료\"로 적었다. 그러나 **로컬 git config는 저장소 파일이 아니므로 어느 항에도 포함되지 않았다** — 부재 확인 방법: acceptance+notes 전문에서 `set-url`·`remote set`·`로컬 클론`·`클론의 remote`·`origin URL`·`remote URL`·`git remote` 7개 어구 전건 0건(내가 찾은 방법으로는 0건).\n\n[실측 2026-09-14] Kiki 머신에서 `git push origin --delete claude/adoring-mccarthy-sle0uj` 실행 시 출력: `remote: This repository moved. Please use the new location: https://github.com/kiki-s-broom/WhyMath.git` / `To https://github.com/doldori7/WhyMath.git`. 즉 명령은 **성공했지만**(GitHub 리다이렉트) origin은 여전히 `doldori7/WhyMath`를 가리킨다. 반면 이 세션(CCR 컨테이너) 클론은 `git remote get-url origin` → `https://github.com/kiki-s-broom/WhyMath`로 이미 새 주소다 — 즉 **두 클론이 서로 다른 주소를 본다.**\n\n[왜 지금 안 깨지는데 고쳐야 하는가] GitHub의 저장소 전환 리다이렉트는 편의 기능이지 영구 계약이 아니다. 특히 **옛 이름이 재사용되면 리다이렉트가 끊긴다**(doldori7가 WhyMath라는 이름의 새 저장소를 만드는 경우). 그때 Kiki 머신의 push/pull은 조용히 엉뚱한 저장소를 향하거나 인증 실패로 바뀐다. 지금 한 줄로 끝나는 일이 그때는 원인 규명부터 시작해야 한다.\n\n[해소 절차 — Kiki 머신 1회] `cd C:\\Users\\kiki\\Desktop\\__AI\\WhyMath` 후 `git remote set-url origin https://github.com/kiki-s-broom/WhyMath.git` 실행, 그리고 `git remote get-url origin`으로 새 주소가 나오는지 확인한다(변별력: 실행 전에는 doldori7, 후에는 kiki-s-broom이 나와야 한다 — 성공/실패 양쪽에서 같은 값을 내지 않는다). 부수로 `git fetch origin` 1회가 리다이렉트 경고 없이 끝나는지 본다.\n\n[범위 명시] 이 항은 **Kiki 머신 클론 1개**에 대한 것이다. 다른 머신·다른 워크트리 사본이 있다면 각각 같은 조치가 필요하며, 이 세션은 그 존재 여부를 알 수 없다."
  - "⑮ [2026-09-21 · 이 세션] 잔여 3축(②⑦⑭) 전부 판정 — 게이트 G-canonical-repo-residual-kiki-checks clear. 동시에 **이 태스크가 3개 세션에 걸쳐 실어 나른 잘못된 전제 3건을 철회한다.** 정정을 별항으로 두는 이유: acceptance는 append 전용이라 ②⑩⑬의 원문이 그대로 남으며, 정정 없이는 다음 세션이 그 원문을 다시 읽는다.\n\n[정정 1 — ②의 전제 철회] acceptance ②가 적은 \"doldori7/WhyMath에 **존재가 확인된** 시크릿(DEPLOY_SSH_HOST/USER/KEY/KNOWN_HOSTS/PATH …)\"은 근거 없는 추론이었다. 이 5종은 전환에서 승계에 실패한 것이 아니라 **애초에 등록된 적이 없으며 그것이 설계된 정상 상태다.** 저장소 정본 근거 4건: docs/architecture/deployment_cd_runbook.md §7 머리말(\"현재는 대상 호스트가 없어 등록하지 않는다\")·같은 문서 줄 378(2026-09-01 \"배포 시크릿 5종이 전부 미설정이라 반드시 실패한다\")·§8 미프로비저닝 표 1행(\"GCP/AWS 프로덕션 호스트 — 없음\"), .github/workflows/deploy.yml preflight 잡 주석(\"미설정이면 여기서 사유와 함께 실패한다 — 지금 상태(인프라 미프로비저닝)의 정상 결과다\"). 배포 대상 호스트가 존재한 적이 없으므로 그 SSH 접속 정보도 존재할 수 없다. ⑩의 \"② 시크릿 — 4/5\" 표기도 같은 오류의 파생이다(5분의 4가 확인된 것이 아니라, 나머지 5종은 확인 대상이 아니었다).\n\n[정정 2 — ⑬의 이름 오류] ⑬이 확인 대상으로 지목한 DEPLOY_SSH_PATH 는 저장소 워크플로·코드에 **0건**이다(실측: 전수 grep 결과 이 문자열은 gates.yaml 게이트 제목·본 태스크 ⑬·이벤트 로그 1줄에만 존재). 실제 이름은 DEPLOY_PATH 다 — .github/workflows/deploy.yml:86 및 런북 §7-1의 `gh secret set DEPLOY_PATH`. 게이트가 폴백으로 지정한 Settings 화면 확인을 수행했다면 없는 이름을 찾았을 것이고, 최악의 경우 틀린 이름으로 시크릿이 등록돼 preflight가 계속 실패했을 것이다.\n\n[정정 3 — ⑬의 API 부재 주장 철회] ⑬이 적은 \"GitHub API·MCP 도구 어디에도 '시크릿 이름 목록 조회' 기능이 없다(값은 물론 존재 여부도 API로 노출하지 않는 GitHub의 의도된 설계)\"는 **거짓이다.** GET /repos/{owner}/{repo}/actions/secrets 가 실재하며 시크릿 이름과 갱신일시를 반환한다(값은 반환하지 않는다). 참인 명제는 좁다 — \"MCP 도구 actions_list 에 secrets method가 없다\". 그것이 \"GitHub API에 없다\"로 확대됐고, 나아가 \"값 재조회 불가\"(사실)와 \"이름 조회 불가\"(거짓)가 한 문장에 합쳐졌다.\n\n[실측 — ② 부재 판정의 검색 범위 3층] 2026-09-20~21 Kiki 머신 PowerShell 실행. 저장소층: `gh api repos/kiki-s-broom/WhyMath/actions/secrets --jq '.secrets[].name'` → PR_AUTO_RESYNC_TOKEN 1건만 출력. 조직층: 같은 형식의 `.../actions/organization-secrets` → 빈 출력(빈 배열 · 오류 아님). 환경층: 검사 불요 — preflight 잡에 environment 키가 없어 환경 시크릿이 구조적으로 도달하지 못하며, 있더라도 preflight는 동일하게 실패한다. 변별력: 저장소 조회가 실제로 이름 1건을 내어 엔드포인트 동작을 스스로 증명했고, 그 동작하는 형식으로 조직 조회가 빈 배열을 냈다 — 둘 다 빈 출력이었다면 \"없음\"과 \"엔드포인트 미동작\"을 구별할 수 없었다.\n\n[실측 — ⑦ 구 저장소] `gh repo list doldori7 --limit 200` → \"Showing 11 of 11 repositories in @doldori7\" 전건 출력에 WhyMath 부재(도구가 분모를 밝혔으므로 절단이 아니다). 전환이 옛 owner 슬롯에서 저장소를 완전히 제거했으므로 2026-09-12 Kiki 결정(아카이브)을 집행할 대상 자체가 없다 — ⑫의 추정(\"남아 있지 않을 가능성이 높다 — 미실측\")이 실측으로 확정. 조치 불필요로 종결.\n\n[⑭ 로컬 클론 origin] 2026-09-15 완료(전 doldori7 → 후 kiki-s-broom). 범위 한계 유지: 확인된 것은 Kiki 머신 클론 1개뿐이며 다른 머신·워크트리 사본은 조회 경로가 없다.\n\n[acceptance 전수 재대조 — done 판정 근거] ① 완료(⑩ owner.type=Organization) · ② **무효로 종결**(정정 1 — 승계 확인 대상이 존재하지 않음) · ③ 완료(⑩ 룰셋 승계·merge queue 활성) · ④ 완료(⑩ 워크플로 5건 active·실발화 관측) · ⑤ 완료(⑪ 재판정 — 사본 병존이 없어 컷오버 조정 자체가 불요) · ⑥ 완료(⑩ 실행 표면 + ⑪ README·docs URL) · ⑦ 완료(위 실측 — 조치 불필요 종결) · ⑧ 이행(범위 한계 명시·⑩이 부분 오류까지 정정) · ⑨⑩⑪⑫⑬ 기록항 · ⑭ 완료.\n\n[이 태스크 범위 밖으로 남는 것] 배포 시크릿 5종의 실제 등록은 대상 호스트 프로비저닝 시점의 작업이며 런북 §7이 소유한다. 미등록은 결함이 아니라 현재의 정상 상태다."
