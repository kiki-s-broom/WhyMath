notes: "발견 경위(2026-09-09): Kiki가 대화 중 \"GitHub 프로젝트 kiki-s-broom/WhyMath의 main 브랜치로 큐잉등록 했어\"라고 보고했다. 세션이 doldori7/WhyMath 스코프에 고정된 채로 확인한 사실은 다음과 같다.\n\n[확인된 사실 — 익명 git clone(읽기 전용)]\n· kiki-s-broom/whymath는 실재하는 공개 저장소이고, doldori7/WhyMath와 별도 owner다(전환/리다이렉트가 아니라 독립 저장소).\n· main 브랜치 HEAD = 94d1f28, 그 부모가 doldori7/WhyMath 현재 main HEAD인 3059936과 동일 — 즉 이 세션이 보는 최신 코드베이스에 커밋 1개(#1074, 병렬 중복 착수 경위 기록)를 더 얹은 상태.\n· .github/workflows/ 5종(ci.yml·deploy.yml·branch-cleanup.yml·harness-audit.yml·pr-auto-resync.yml)이 그대로 존재하고, ci.yml의 merge_group 트리거·pr-auto-resync.yml의 PR_AUTO_RESYNC_TOKEN 참조도 그대로 복사돼 있다.\n\n[이 세션이 확인하지 못한 것 — 도구 제약]\n· add_repo(access=push)가 \"cross-tier adds are not supported in v1: session already has repos from owner(s) [doldori7]\"로 거부됐다 — 세션 하나는 한 owner의 저장소만 부착 가능. 그 결과 kiki-s-broom/whymath의 GitHub API(owner.type·브랜치 보호 룰셋·시크릿 존재 여부·Actions 활성화 상태)를 이 세션에서는 조회할 수 없다.\n· \"merge queue 큐잉등록 성공\"은 Kiki의 구두 보고뿐이며, 이 저장소가 실제 Organization 계정인지는 API로 직접 확인하지 못했다(가용성 확인 절차 축 — 설정 성공 보고를 계정 유형 확정의 증거로 대체하지 않기 위해 acceptance ①로 별도 등재).\n\n[배경 — 이 결정과 연결된 기존 게이트]\nG-merge-queue-or-strict-relax(2026-09-07 cleared)가 \"merge queue 도입\"을 채택했다가 doldori7/WhyMath가 User 계정이라 조직 전용 기능을 쓸 수 없어 D)자동 재동기화(HARN-85)로 재판정한 바 있다. kiki-s-broom이 실제 Organization이면 그 제약이 사라지므로, 이번 이관은 그 원래 판정의 전제 자체를 바꾸는 사건이다 — 다만 HARN-85(자동 재동기화)는 이관 완료 전까지, 그리고 이관 후에도 merge queue가 커버하지 못하는 예외 상황의 안전망으로 유지 여부를 별도 판단해야 한다(이 태스크의 범위 밖 — 승계 시 acceptance에 추가 권장).\n\n[Kiki 결정 — 이번 대화, 2026-09-09]\n\"새 정본 저장소로 전환\" 선택(3안 중 시나리오 A) — doldori7/WhyMath는 유지만 하고, 향후 모든 개발·PR·머지를 kiki-s-broom/WhyMath로 옮긴다.\n\n[이 세션의 실행 범위 한계]\n이 세션은 doldori7/WhyMath에 고정된 채(설계 브랜치 claude/g-merge-queue-strict-relax-rm3cmc) 시작됐고, 위 cross-tier 제약으로 kiki-s-broom 쪽에 push/PR/API 작업을 할 수 없다. 그래서 이번 세션의 산출물은 (a) 이 백로그 태스크·게이트 등재 (b) 이관 준비 문서 작성까지이고, 실제 이관 집행(시크릿 재등록·브랜치 보호 재구성·병렬 세션 컷오버)은 kiki-s-broom을 초기 소스로 하는 새 세션 + Kiki의 GitHub 설정 작업이 필요하다.\n\n[정정 2026-09-09] 저장소 전환(transfer) 확인 — 복사본이 아니라 실제 이관이므로 시크릿·브랜치 보호 자동 승계 여부만 실측하면 되고 수동 재등록이 필요 없을 가능성이 높다\n\n[정정 2026-09-10] 2026-09-10 실측 반영 — 1·3·4 답변, 6의 실행 표면 축 착지(HARN-02·03), 잔여는 Kiki 결정\n\n[차단 2026-09-10] 잔여 acceptance가 전부 Kiki 결정·설정 작업이다 — ② DEPLOY_SSH_* 실측(배포 1회 또는 설정 화면) · ⑤ 병렬 세션 컷오버 좌표 · ⑦ 구 저장소 처분 방침. 실측으로 끝낼 수 있는 축(①③④·⑥ 실행 표면)은 2026-09-10 PR #1063에서 끝냈고 acceptance ⑩에 기록했다. 착수 자격 확인 중 claim이 잡혀 다른 세션을 막지 않도록 되돌린다.\n\n[정정 2026-09-12] ⑥ 잔여 축(README·docs URL) 착지 + ⑤ 재판정 기록\n\n[차단 2026-09-12] 잔여 acceptance ②(DEPLOY_SSH_* 승계 실측)·⑦(구 저장소 처분 방침)은 Kiki 결정·설정 작업 — 세션이 대행 불가\n\n[정정 2026-09-12] ⑦ Kiki 결정(아카이브) 기록 + 대상 실재 확인 필요 축 명시"
