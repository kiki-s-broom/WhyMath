notes: "분리 경위(2026-09-14): OPS-78이 저장소 전수 인코딩 가드를 만들며 라이선스 스냅샷 20건 중 5건의 sha256이 meta 기록과 어긋난 것을 발견했다. 원인은 .gitattributes에 스냅샷 경로 규칙이 없어 Git 기본 text auto가 CRLF를 LF로 정규화한 것이며, 재발 차단(-text)과 복원 가능분 2건(ncic·schoolinfo — 차이가 LF 개수와 정확히 일치해 CRLF 복원 시 기록 해시와 바이트 동일)은 OPS-78이 처리했다.\n\n이 태스크가 받는 것은 복원 불가 3건이다: illustrative-mathematics(차이 1,915 vs LF 2,667) · kogl-license-types(105 vs 2,646) · omnimath(10 vs 995). 차이가 LF 개수와 맞지 않는다 = 원본이 혼합 줄바꿈이었다 = 어느 줄이 CRLF였는지 결정할 수 없다. 전건 복원은 오버슈트하고 부분 복원은 조합 폭발이라 바이트 복원이 원리적으로 불가능하다.\n\n왜 OPS-78에서 분리했는가: 재수집은 외부 사이트 접근이 필요하고(샌드박스 egress 제약 가능성), 무엇보다 원 sha256을 되찾지 못한다 — 사이트가 그 사이 약관을 고쳤으면 해시가 달라지기 때문이다. 즉 '가드를 만든다'와 성격이 다른 판단이 필요하다. OPS-78은 그 3건에 stored_sha256과 integrity_note를 기록해 훼손 사실을 남기고 통과시키며, 가드는 그 기록이 있는 경우에만 예외로 인정한다(기록 없는 통과는 위장이고, 무조건 위반은 고칠 수 없는 위반을 상시 보고해 사람이 가드를 끄게 만든다).\n\n인접: 게이트 G-license-snapshot-blocked-sources(cleared)가 14곳의 미수집을 다뤘고, 이 3곳은 그때 수집에 성공한 쪽이다."
