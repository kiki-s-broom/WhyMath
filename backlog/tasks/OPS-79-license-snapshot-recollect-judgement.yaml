acceptance:
  - "① 재수집 가치 판정 — 3건(illustrative-mathematics·kogl-license-types·omnimath)의 약관 페이지를 지금 다시 받아 내용이 2026-08-31 수집분과 실질적으로 같은지 본다. 같으면 재수집본으로 교체하고 meta를 갱신한다(그때의 sha256이 새 기준이 된다). 다르면 교체하지 않는다 — 그 경우 우리가 가진 것은 '그 시점 약관'의 유일한 사본이고, 바이트가 정규화됐어도 본문 텍스트는 보존돼 있으므로 증거 가치가 0은 아니다.\n② 텍스트 동일성 확인 — 바이트가 달라도 CRLF/LF 차이뿐이면 본문은 같다. 현재 저장분을 LF 정규화 기준으로 재수집본과 비교해 '줄바꿈 외 차이 0'인지 실측한다. 차이가 있으면 그것은 사이트가 약관을 고쳤다는 뜻이고, 그 사실 자체가 기록 가치가 있다.\n③ 판정 결과를 meta에 반영 — 교체하든 안 하든 integrity_note를 결론으로 갱신한다. '조사했고 이렇게 판정했다'가 남아야 다음 사람이 같은 조사를 반복하지 않는다.\n④ 접근 제약 명시 — 이 3곳이 샌드박스 egress에서 차단되는지 먼저 확인한다. 게이트 G-license-snapshot-blocked-sources가 14곳을 403으로 기록했으므로 이 3곳도 세션에서 못 받을 수 있다. 그러면 Kiki 머신 실행이 필요하며, 명령 블록은 cmd /c 경유로 준다(2026-09-14 cp949 유실 사고).\n⑤ 정직한 공백 — 재수집으로 원 sha256을 되찾을 수는 없다. 사이트 내용이 1바이트라도 바뀌면 해시가 달라지기 때문이다. 이 태스크가 회복하는 것은 '해시 검증 가능한 증거'이지 '2026-08-31의 바이트'가 아니다. 그 구분을 결론에 적는다."
