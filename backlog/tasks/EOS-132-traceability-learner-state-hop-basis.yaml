notes: "출처: 2026-09-24 KPI ①⑤ 구조적 미측정 추가 검토 → Kiki 권장안 승인. KPI ⑤의 두 막힘 중 추천 hop(학습자 결합)은 선행 태스크가, LearnerState hop은 이 태스크가 소유한다.\nARCH-51과의 관계: ARCH-51은 user_state_snapshot을 폐기 선택지로 두는데, 현행 원천 대장은 KPI ⑤의 LearnerState hop을 그 좌석에 매달아 두었다. 이 태스크 ⑤가 hop 원천을 옮겨야 ARCH-51 폐기가 KPI ⑤를 영구 미측정으로 굳히지 않는다(ARCH-51 acceptance ⑤로 교차 기록).\n\n[정정 2026-09-24] 추가 검토: ⑤ 분자 쿼리 미작성·능력치 근거 부재 상태 구별\n\n[정정 2026-09-28] paths ['src/backend/whymath_backend/l2/recommendation_evidence.py', 'src/backend/whymath_backend/l2/learning_event_trace.py', 'src/backend/whymath_backend/ops/loop_kpi_gate.py'] → ['src/backend/whymath_backend/l2/recommendation_evidence.py', 'src/backend/whymath_backend/l2/learning_event_trace.py', 'src/backend/whymath_backend/ops/loop_kpi_gate.py', 'src/backend/whymath_backend/l2/learner_state.py', 'src/backend/whymath_backend/api/me.py', 'docs/standards/loop_kpi_contract.md', 'tests/backend/l2/test_learner_state_basis.py', 'tests/backend/l2/test_learning_event_trace.py', 'tests/backend/l2/test_recommendation_evidence.py', 'tests/backend/ops/test_loop_kpi_gate.py', 'tests/backend/ops/test_loop_kpi_gate_integration.py', 'tests/backend/api/test_eos132_learner_state_basis_integration.py']: 실제 편집 범위 반영 — 근거 캡처는 LearnerState 소유 모듈(l2/learner_state)에, 기록 배선은 /me/next-problem 핸들러(api/me)에 두었고, 계약 문서와 테스트 6파일을 더했다\n\n[정정 2026-09-28] 이행 기록 — ①~⑧ 착지 내용과 판정 기준 커밋"
