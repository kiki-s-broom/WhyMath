acceptance:
  - "① 판정 기준 재실측 — 착수 시점 main 해시를 적고, KPI ⑤의 필수 원천 중 `LEARNER_STATE_CREATED`(user_state_snapshot)가 여전히 DORMANT인지 확인한다.\n② hop 정의(2026-09-24 결정) — 체인 \"Recommendation → LearnerState → Assessment → Attempt → Problem\"의 LearnerState hop을 **추천 기록 meta에 남긴 근거 식별자**로 되짚는다. `/me/next-problem`이 `get_state`로 조립한 LearnerState의 근거(사용한 숙달 시계열의 최신 `measured_at`, 능력치 스냅샷 식별자, 활성 오개념 가설 id 목록)를 `record_recommendation_treatment`의 meta에 싣는다. meta 비민감 원칙(B1)을 지킨다 — 식별자·시각만, 학생 원문·수치 풀이 없음.\n③ 사후 재구성 방식을 채택하지 않은 근거 — 숙달 시계열(`(user_id, concept_id, measured_at)` append-only)은 시점 재구성이 가능하지만 오개념 가설 레코드는 `updated_at`으로 덮어써져 과거 상태를 복원할 수 없다. 이 근거를 계약 문서에 적는다.\n④ `user_state_snapshot` 오용 금지 — 그 좌석을 LearnerState 캐시로 쓰지 않는다(ARCH-51 notes: 예측·시간관리 신호용이라 축이 다르다). EOS-10 가드 `test_get_state_does_not_touch_user_state_snapshot_seat`를 지우지 않는다.\n⑤ 원천 대장·KPI 게이트 정합 — `_SOURCE_REGISTRY`의 `LEARNER_STATE_CREATED` 원천을 user_state_snapshot에서 추천 meta 근거로 옮기고, `ops/loop_kpi_gate._REQUIRED_SOURCES`의 TRACEABILITY 항목과 어긋나지 않게 한다. 이 전환이 끝나면 ARCH-51의 폐기 판정이 KPI ⑤를 막지 않는다.\n⑥ KPI ⑤ 측정 개시 확인(실패 주입) — meta 근거가 빠진 추천 1건을 넣었을 때 KPI ⑤가 fail(분자 1)을 내고, 전 hop이 이어진 추천만 있을 때 pass를 내는지 확인한다. 선행 태스크 이전에 기록된(근거 meta 없는) 과거 추천을 어떻게 셀지(관측창 시작 경계 또는 제외 사유 표기) 정하고 적는다 — 소급 불가 행을 조용히 실패로 계상하거나 조용히 빼지 않는다."
  - "⑦ 분자 쿼리 소유(2026-09-24 추가 검토) — 현행 `ops/loop_kpi_gate.collect_traceability`는 선결이 풀려도 분자를 세지 않고 미측정을 낸다(\"조인 키를 확정하는 배선 좌석 EOS-11/EOS-79가 채운다\"라고 적혀 있으나 두 태스크 모두 done이다). 즉 원천 대장만 PRODUCED로 바꾸면 KPI ⑤는 여전히 미측정이다. **이 태스크가 분자 쿼리를 쓴다** — 각 hop의 조인 키를 구체적으로 적는다: 추천 → 학습자(`evidence_event.session_id → learning_session.user_id`, EOS-131) → LearnerState 근거(meta의 숙달 행 키) → 시도(`concept_mastery_history.attempt_id` — 이미 있는 느슨참조) → 문제(`problem_attempt.problem_id`). 체인의 Assessment hop이 시도와 어떻게 이어지는지(진단 시도만 Assessment에 속하는지 등)를 실측으로 정하고, 이어지지 않는 추천 유형이 있으면 '끊김'인지 '해당 없음'인지를 계약에 적는다.\n⑧ 능력치 근거가 비어 있는 경우 — θ 스냅샷은 `api/me.py capture_ability_snapshot` 등으로 생산되지만(원천 대장 PRODUCED) 시도마다 찍히지는 않는다(루프 writer = EOS-125 todo). 그래서 추천 시점에 그 학생의 스냅샷이 아직 없을 수 있다. 이것은 역추적 실패가 아니라 \"사전값(prior)으로 추천했다\"는 정상 상태일 수 있으므로, meta에 \"근거 없음 + 사유\"를 명시해 남기고 KPI ⑤가 이를 끊김으로 세지 않게 한다. 반대로 근거 필드 자체가 빠진 추천은 끊김으로 센다(모른다 ≠ 아니다 — 두 경우를 구별하는 실패 주입 1쌍)."
