acceptance:
  - "① 클라이언트 소비 배선 — Flutter 학생 앱이 `GET /v1/me/learner-state`를 실제로 호출한다. 현재 앱은 학습 상태를 조각 3개(`/v1/me/mastery/current`·`/v1/me/ability`·`/v1/me/diagnosis/summary`)로 각각 불러 화면에서 합친다. 그 합성 규칙이 클라에 있는 한 소비처마다 달라질 수 있고, CLAUDE.md \"수학 로직을 클라에 넣지 않는다\"(슬라이스 89)의 경계에 걸린다.\n② 도달 판정 해소 — `ops/declared_unwired_audit.py`의 `http_routes` 축에서 이 라우트가 `reached`가 되어야 한다. 그 시점에 `_CLASSIFICATION` 대장의 `pending-task:` 선언을 **걷는다**(유예는 자동 해제되지 않는다 — 걷는 것이 이 태스크의 산출물이다).\n③ 조각 3표면의 처분 명시 — 단일 표면으로 옮긴 뒤 기존 3개를 유지할지 폐기할지 적는다. 유지가 기본이나(다른 소비처가 있을 수 있다) \"그냥 둔다\"가 아니라 판정으로 적는다.\n④ `origins` 소비 — 응답의 `origins`를 클라가 읽어 `no_producer` 필드를 UI에서 \"아직 없는 기능\"으로, `no_data`를 \"풀이를 더 하면 채워짐\"으로 **구별해** 표시한다. 둘을 같은 빈칸으로 그리면 서버가 애써 가른 구분이 화면에서 소실된다."
