notes: "발견 경위(2026-09-28 · stray-code 13회차 · docs/reviews/unmerged_branch_audit_2026-09-28.md): 감사 중 재fetch에서 새 브랜치 `claude/focused-ramanujan-2p5q8w`가 나타났고, 그 커밋이 열린 PR #1346과 같은 EOS-129 ⑤ 게이트를 따로 만든 것을 확인했다. 이 감사 세션의 SessionStart 브리핑도 EOS-129를 후보 1위로 보여 줬다 — 즉 두 세션 모두 같은 화면을 봤고, 그 화면에는 PR #1346의 부분 이행이 없었다.\n\n사고 대장 계열 `parallel-duplicate-implementation`의 11회차로 등재했다(이 브랜치에서 기록할 때는 10회차였으나, main 머지로 같은 날 먼저 기록된 같은 계열 사고 1건이 대장에 들어왔다 — incident series 실측). 선행 대책들은 각자 다른 입구를 막았다 — HARN-11(미머지 done), HARN-14(미머지 설계 문서), HARN-09/07(원격 claim), CLAUDE.md 착수 순서 규칙(claim 전 코드 열람 금지). 이번 입구는 \"부분 이행 후 claim 해제\"이며, 이것은 정상 흐름이다(게이트 대기로 세션을 끝낼 때 claim을 붙들고 있으면 HARN-134류 홀드가 생긴다). 그러므로 대책은 해제를 막는 것이 아니라 해제 뒤에도 부분 이행이 보이게 하는 것이다.\n\n두 게이트의 처분(어느 쪽을 남길지)은 이 태스크의 범위가 아니다 — 두 세션·Kiki가 판단한다. 판정 문서는 PR #1346 쪽이 도구·거부 가드까지 갖춘 상위 집합으로 보인다고만 적었다(읽어서 그렇게 보인다 — 실행 대조는 하지 않았다).\n\n인접: HARN-11(미머지 done 탐지·done) · HARN-125(claim 거부 후 정보 공백·todo — 막힌 뒤의 가시성, 이 태스크는 막히기 전의 가시성) · HARN-176(미머지 실시간 감시기·done) · HARN-182(열린 작업 통합 그래프·done).\n\n[정정 2026-09-28] title 'start 프리플라이트가 미머지 '부분 이행 후 claim 해제(todo)'를 못 본다 — 열린 PR의 EOS-129 ⑤ 게이트를 다른 세션이 4분 만에 중복 신설 (중복 구현 계열 10회차)' → 'start 프리플라이트가 미머지 '부분 이행 후 claim 해제(todo)'를 못 본다 — 열린 PR의 EOS-129 ⑤ 게이트를 다른 세션이 4분 만에 중복 신설 (중복 구현 계열 11회차)': 회차 정정 — main(ed3d14da) 머지 후 대장 기준 이 사고는 같은 계열 11번째다(incident series 실측)\nnotes 치환 — 회차 정정 — main(ed3d14da) 머지 후 대장 기준 이 사고는 같은 계열 11번째다(incident series 실측)"
