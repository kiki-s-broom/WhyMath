  - "③ 기본값 전환 판단 — ①②의 실측 결과가 나온 뒤에만 anthropic_prompt_caching 기본값(현행 False) 전환 여부를 판단한다. 켜는 쪽으로 결정하면 MEMORY 결정 로그에 실측 적중률·절감 추정을 근거로 기재한다. 계측 없이 켜지 않는다(EOS-99 ④ 승계)"
  - "①-a 선행 조건(PR #1023 codex P1 정정) — 회차 명령에 --subscription premium --budget-krw <양수>를 **둘 다** 준다. 키만 넣고 돌리면 라우터가 LOCAL로 강제해 클라우드 호출이 0건이 되고 state='not_applicable'만 나온다(측정 회차 공전). 근거 실측 2026-09-07: free/0=local · free/5000=local · premium/0=local · premium/5000=cloud_mid — 구독·예산이 각각 독립적으로 LOCAL을 강제한다(business_cost_tier 규칙1·2 + guard_cloud). 두 플래그는 EOS-99가 함께 배선했고 미지정 시 기본값(free/0.0)은 종전과 동일하다. 회차 직후 자가검증: 리포트 prompt_cache.calls_with_cache_telemetry > 0 이어야 ①이 성립한다 — 0이면 클라우드로 안 나간 것이므로 적중률을 읽지 말고 플래그부터 확인한다"
