  - "① 코치 완료 경로의 채점 증거가 힌트 사용을 3상태로 싣는다 — `hint_used_of(evidence)`가 그 attempt의 `problem_attempt.used_hint`와 같은 값을 돌려준다(None은 None 그대로 — 모른다를 안 썼다로 접지 않는다). `/v1/me/attempts`(클라 자가보고 used_hint) 경로의 처분도 판정해 적는다.\n② 기본 추정기는 이 태스크가 바꾸지 않는다 — `bkt-v1` 유지(측정 없는 기본 전환 금지 · `docs/architecture/mastery_update_contract_v1.md` 기본 추정기 처분 절). 연속 정답 축(`StreakSignal`)은 범위 밖.\n③ 집행 지점 — 시나리오 스위트 SCENARIO-005 ④ⓒ의 정직한 공백 동결(완료 응답의 `completion_evidence`에 `hint_used` 키가 없다)이 이 수정으로 실패하도록 되어 있다. 그 단언을 정상 동작 단언으로 뒤집는다.\n④ 생산자 제거 뮤테이션이 ③을 RED로 만드는지 주입 확인."
