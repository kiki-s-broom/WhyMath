acceptance:
  - "① 실측 전제 (판정 기준 main 4b33d243 · 2026-09-15): `README.md`에서 `venv`·`pip install`·`alembic`·`pytest`·`docker compose` 어구가 **전건 0회**다(`grep -cE` 실측 0). '빠른 시작' 절은 Claude Code 진입과 슬래시 명령 안내이며 **서비스 기동 경로가 아니다**."
  - "② 요구 기준은 \"새 개발 환경에서 README만 보고 서비스가 실행되어야 한다\"(EOS 계획서 ①§23 · 갭리뷰 B4)이다. 최소 기동 경로 — 파이썬 환경·의존성·DB(docker `whymath-pg` 5433)·마이그레이션·서버 기동·스모크 확인 — 을 순서대로 적는다."
  - "③ **검증 없는 실행 안내 금지** — 적을 명령이 실제로 그 산출물을 내는 코드 경로인지 저장소에서 *먼저* 확인한다(가정 기반 런북 금지 · 2026-07-16 등재). 각 단계에 그 단계 산출물 자체를 보는 자가검증 스텝(포트 리스너·행 수·파일 존재)을 동봉하고, pid 파일·/health처럼 **다른 프로세스가 대신 만족시킬 수 있는 간접 신호**는 성공 근거로 쓰지 않는다(2026-07-17 좀비 uvicorn 사고)."
  - "④ 판정은 exit code로 — README에 적는 검사 명령은 `-q`·`| tail`로 출력을 죽이지 않는다(2026-08-09 black 사고). 실행기는 `python -m pip`·`python -m pytest` 형태로 인터프리터를 고정한다(2026-07-27 다중 환경 사고)."
  - "⑤ 회귀 동결 — 문서만 고치면 다음 스택 변경에서 그대로 stale이 된다. README가 지시하는 경로·파일·명령이 저장소에 실재하는지 기계가 대조하게 한다(`tests/infra` 계열). 변별력은 문서의 명령 1건을 존재하지 않는 경로로 바꿔 RED가 나는지로 실측하고, 원복은 `cp` 백업으로만 한다(2026-08-10 `git checkout` 사고 규칙)."
  - "⑥ 범위 경계 — Kiki 머신 전용 런북(`docs/ops/**`·`scripts/demo/run_demo.ps1`)과 축이 다르다. 이쪽은 **임의의 새 기기·새 세션** 기준이며, Kiki 머신 고정 경로·PowerShell 전제를 README 본문에 넣지 않는다."
