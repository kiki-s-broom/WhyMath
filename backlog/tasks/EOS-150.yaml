  - "③ 변별력 — 정답만 틀린 문항(조건·산문·출처는 정상)이 fail로 판정됨을 반례 픽스처로 동결하고, 재검산 성분을 빼는 뮤테이션이 RED를 내는지 확인한다. 저장소 문제은행 전수에서 새 fail·판정 불가 건수를 실측해 적는다."
