  - "① 문항 좌석에 정답 재검산 성분 추가 — `harness/qa_pipeline.judge_item`이 `corpus_reverify._reverify_one`(S6 상시 재검산 — Tier1·근 선택·Tier2 단계·개념형)을 재구현 없이 부른다. 재검산 fail은 violation, skip(재료 없음·unverifiable)은 unjudgeable로 옮겨 pass로 접지 않는다. 이 성분이 ok가 아닌 문항은 pass가 될 수 없다(필수 성분)."
