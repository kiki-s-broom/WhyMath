notes: "출처: Kiki 결정 2026-09-03 — 'One In → One Out 조건부 채택: 신규 P0 추가 시 기존 P0 하나를 제거·연기하되 보안·데이터 손실·출시 차단 결함은 예외'. 실측: Rule 4 본체는 HARN-55가 이미 집행한다(backlog.py:1312-1382 --swap-out · policy.eos_p0_budget=50 · models.py:280). **예외 조항만 미집행**이다. 지금 물리지 않는 이유 = 비종결 P0 15건 < 예산 50건이라 교환 요구 자체가 발동하지 않는다 — 그래서 P2다. 착수 트리거: 비종결 P0가 예산에 근접하거나(45+) 예외 사유에 해당하는 P0 등재가 실제로 거부될 때. 그 전에 등재해 두는 이유는 예산에 닿는 순간이 곧 '급한 보안 결함을 못 넣는 순간'이기 때문이다.\n\n[정정 2026-09-03] notes 수치 오기 정정 — '비종결 P0 15건'은 총계(15)와 비종결(13)의 혼동이다. amend에 notes 정정 경로가 없어(HARN-57 결측 필드 계열) 실측 기준선을 acceptance ④로 고정한다. 판정·트리거(45+)에는 영향 없으나 결정 로그의 실측 수치가 틀린 채 굳는 것을 막는다"
