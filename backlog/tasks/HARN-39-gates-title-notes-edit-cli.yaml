  - "④ [2026-09-06 실사례 추가] 낡은 *제목*보다 무거운 축은 **부분 답변을 게이트에 적을 수 없다**는 것이다 — clear 판단자가 못 읽으면 추론으로 닫는다. 실사례: G-eos-task-prefix-exhausted(선택지 3종)에 대해 #1000이 MP 접두를 채택했고(e6d1614d · 게이트 등재 bfd4cb3a보다 나중 커밋) 그것이 선택지 ③(트랙별 프리픽스 분리)을 만족한 것처럼 보였다. 실제 답은 'MP는 회차 축 트랙 한정, EOS 축 일반의 후속은 미결'(Kiki 확정 2026-09-06)이며 그 사실은 MEMORY.md에만 있고 게이트 본문에는 없었다. 세션이 실측으로 막아 피해 0이었으나 막은 것은 장치가 아니라 사람이다. 따라서 edit는 '낡은 표기 정정'만이 아니라 **'열린 채로 판정 근거·부분 답변을 누적'**하는 용도를 명시적으로 지원해야 한다(clear/waive와 달리 게이트를 닫지 않는다)."
  - "⑤ 집행 지점 별항(정본화≠집행) — edit를 만드는 것과 /gates 절차가 그것을 쓰는 것은 다르다. gates 스킬 문서에 '부분 답변·판정 근거는 edit로 게이트에 기록한다(clear 아님)'를 넣어 실제 경유 경로를 만든다. 이 항이 없으면 CLI만 생기고 아무도 안 쓴다(PED-06 선례)."
