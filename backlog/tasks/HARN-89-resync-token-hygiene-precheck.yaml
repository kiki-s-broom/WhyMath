acceptance:
  - "① 토큰 위생 사전 검사 — pr_auto_resync.sh가 gh를 호출하기 전에 GH_TOKEN 값을 검사한다. 앞뒤 공백·개행은 제거하고 그 사실을 로그에 남긴다(조용히 고치지 않는다 — 침묵 실패 금지). 남은 이상(값 내부의 공백·제어문자·비ASCII, 비정상 길이, github_pat_ 접두 부재)은 fail-closed로 exit 1하되 **무엇이 잘못됐는지 이름을 붙여** 보고한다. 토큰 값 자체는 절대 출력하지 않는다(길이·불리언만 — CLAUDE.md 시크릿 자가검증 규칙 준수)."
  - "② 변별력 — 정상 토큰에서 초록인 것은 보호의 증거가 아니다(2026-09-01 등재 규칙). 오염 형태를 실제로 주입해 각각 다른 메시지가 나오는지 확인한다: (a)끝 개행 (b)끝 공백 (c)앞 공백 (d)값 내부 개행 (e)비ASCII 문자 (f)빈 문자열 (g)정상값(대조군 — 아무 경고도 나오지 않아야 한다). (a)~(c)는 제거 후 통과 + 고지, (d)~(f)는 exit 1이어야 한다. 대조군 (g)가 핵심이다 — 모든 입력에서 경고가 나오면 그 경고는 신호가 아니라 배경 소음이다."
  - "③ 계약 테스트를 기존 tests/infra/test_pr_auto_resync.py에 편입하고, 그 파일이 실제로 CI 잡에서 수집되는지 확인한다(\"저장소에 존재함\"과 \"돌아감\"은 다르다 — OPS-10 배선 동결 축)."
  - "④ **①의 정정 — 토큰 *종류*에 따라 검사 축을 나눈다 (PR #1062 Codex P2 수용)**\n\n[지적] ①이 `github_pat_` 접두 부재를 fail-closed 조건에 넣었는데, 이 워크플로에는 **PAT 없이 도는 정당한 경로**가 있다. `PR_AUTO_RESYNC_TOKEN`이 없으면 워크플로가 `github.token`을 넘기고(`.github/workflows/pr-auto-resync.yml:49-50`), `dry_run=1`이면 스크립트가 쓰기 자격 검사를 통과시켜 읽기만 수행한다. 이 경로는 배선 확인용으로 **일부러 열어 둔 것**이며 `tests/infra/test_pr_auto_resync.py::test_dry_run_is_allowed_without_pat`가 계약으로 동결하고 있다(2026-09-08 실측: 그 테스트는 `token_kind=\"github_token\"` · `dry_run=\"1\"`로 rc 0을 단언한다). `github.token`은 `ghs_` 접두라 ①을 문자 그대로 구현하면 **그 계약 테스트가 RED가 된다**.\n\n[수용] 옳다. ①의 fail-closed 목록에서 `github_pat_` 접두 부재는 **모든 실행에 적용될 수 없다**.\n\n[다만 전부를 PAT 모드로 좁히지는 않는다 — 지적보다 좁게 수용] 지적은 \"위생 검사를 PAT/쓰기 모드로 스코프하라\"고 제안하지만, 그렇게 하면 `github_token` 경로가 **같은 진단 불가 상태로 남는다**. 값에 개행이 들어가면 헤더 거부는 토큰 종류를 가리지 않고 일어나며, 실제로 2026-09-08 run #2(`event=schedule`)가 그 형태로 실패했다. 그래서 축을 나눈다:\n\n· **문자 위생**(앞뒤 공백 제거 후에도 남는 개행·제어문자·비ASCII) — **토큰 종류 무관 전 실행**에 적용한다. 헤더에 넣을 수 없는 값은 어느 토큰이든 실패하므로, 진단은 어느 경로에서도 나와야 한다.\n· **형식 검사**(`github_pat_` 접두·기대 길이 범위) — `RESYNC_TOKEN_KIND=pat`일 때만 적용한다. `github_token` 경로에서는 접두가 다른 것이 **정상**이다.\n\n[변별력 — 이 정정 자체를 검증하는 법] ②의 주입 목록에 두 건을 추가한다: ⓔ`token_kind=github_token` · `dry_run=1` · **정상** `ghs_` 토큰 → 통과해야 한다(대조군 — `test_dry_run_is_allowed_without_pat`가 계속 GREEN인지가 판정) ⓕ같은 조건에 **개행이 섞인** `ghs_` 토큰 → 진단이 나와야 한다(문자 위생은 종류 무관임을 확인). ⓔ가 없으면 이 정정이 지켜졌는지 알 수 없고, ⓕ가 없으면 좁게 수용한 이유가 집행되지 않는다."
