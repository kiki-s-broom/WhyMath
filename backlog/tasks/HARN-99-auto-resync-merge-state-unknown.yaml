notes: "발견 경위(2026-09-08 · 실측): 게이트 G-pr-auto-resync-token 통과 직후 첫 정상 실행(run 34188745979 · dry_run=0 · 04:56:02Z)의 로그가 `── 요약: 스캔 17건 · BEHIND+auto-merge 0건 · 최신화 0건 · 충돌 0건 · 미판정 4건 · 기타실패 0건`이었다. 미판정 4건 중 하나가 PR #1059인데, **같은 시각 REST 조회는 그 PR을 `mergeable_state: behind`로 답했다** — 재동기화해야 할 바로 그 대상을 건너뛴 것이다.\n\n설계 자체는 옳게 작동했다(\"모른다 ≠ 아니다\" — UNKNOWN을 BEHIND로 접지 않고 건너뛰며 출력에 남겼다). 문제는 **입력이 거의 항상 UNKNOWN으로 온다**는 것이고, 그러면 자동화가 형식적으로 정상 동작하면서 실효는 0이 된다 — CLAUDE.md \"작동 신호 없는 알고리즘 부착 금지\"가 겨냥하는 상태에 가깝다(다행히 요약이 분모와 미판정 수를 내도록 설계돼 있어 이 상태가 즉시 보였다).\n\n범위 구분: 라이브 측정 태스크(HARN-87)는 *실효 주기·변별력 측정*이 범위다. 2026-09-10(PR #1063 Codex P1 수용) 그 태스크의 depends_on에 **이 태스크를 붙였다** — 대상 선별이 UNKNOWN에서 새면 HARN-87 ③(재동기화 발생 건수·CI 실행 증가분)과 ⑤(예약 실효 주기)가 과소집계된 표본 위에서 판정되기 때문이다. 산문으로 \"순서상 이쪽이 먼저\"라고 적는 것은 selector가 읽지 않으므로 집행이 아니다(CLAUDE.md \"…산문에만 적고 대장에 집행하지 않기 금지\" 규칙). 이 태스크 자신의 depends_on은 비운다 — 스크립트의 기능 결함이라 앞서 착지해야 할 것이 없다.\n\n[병렬 충돌 고지 — 반드시 읽을 것] 토큰 위생 태스크(`HARN-89-resync-token-hygiene-precheck` · 타 세션 `claude/pat-issuance-q516cw` · todo)가 **paths 2개를 정확히 공유**한다(`.github/scripts/pr_auto_resync.sh`·`tests/infra/test_pr_auto_resync.py`). 축은 다르다 — 그쪽은 *토큰 값 오염 사전 검사*(이 세션이 진단한 `invalid header field value for \"Authorization\"`의 대책), 이쪽은 *대상 선별 결함*(UNKNOWN을 못 뚫어 BEHIND를 놓침). 두 태스크는 같은 스크립트의 다른 구간을 건드리지만(전자는 gh 호출 전 토큰 검사, 후자는 목록 조회 후 후보 선별) 같은 파일이므로 나중에 착수하는 쪽이 병합을 감당해야 한다. 착수 시 `backlog.py start`의 겹침 경고를 무시하지 말고 그쪽 상태를 먼저 확인한다.\n\n두 결함 모두 **같은 실행 회차에서 드러났다** — run 34187637864(토큰 오염으로 실패)과 run 34188745979(성공했으나 대상 0건 선별)가 그것이다. 실패 경로 설계(응답 본문 보존)와 요약 분모 출력이 각각 하나씩을 즉시 보이게 했다.\n\n[번호 이력] 최초 `HARN-90-auto-resync-merge-state-unknown`으로 등재했으나 main에 타 세션의 `HARN-90-resync-summary-cause-attribution`(done)이 착지해 번호가 충돌했고(`validate`가 검출), 상대가 머지 상태라 이쪽이 개명했다. 두 태스크는 **인접하지만 다르다** — 상대는 *요약의 분모 3층·0건 원인 귀속*(보고), 이쪽은 *UNKNOWN을 뚫어 대상을 찾기*(탐지). main 스크립트 실측상 UNKNOWN은 여전히 건너뛰기만 한다.\n\n[정정 2026-09-10] notes 치환 — PR #1063 Codex P1 수용 — 산문 순서 선언을 대장 집행(HARN-87 depends_on)으로 교체"
