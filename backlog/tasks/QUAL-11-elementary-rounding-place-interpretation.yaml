acceptance:
  - "① 실측 사실(판정 기준 main 9a19ec0c · 2026-09-25 전체 시스템 재검토 §3-5): data/corpus/problem_bank_elementary_rounding_v0/problems.jsonl 600문을 전수 재계산했다. 발문은 전부 \"N을 X의 자리에서 반올림/올림/버림하면\"인데, 정답은 600/600이 \"X의 자리까지 나타냄\" 해석으로 계산돼 있다. 한국 초등 교과 관례(\"X의 자리에서\" 어림 → X 자리 숫자를 보고 그 윗자리까지 나타냄)와 비교하면 불일치 537 · 일치 63이다. 답이 입력값과 같은 문항이 15건이다(예: \"81880을 십의 자리에서 반올림/올림/버림\" → 정답 셋 다 81880, 관례상 81900/81900/81800). SymPy 검증은 생성기가 만든 조건식만 확인하므로 발문과 정답의 해석 불일치를 잡지 못한다. 600문 전부 review_status 없음 · is_published=False라 학생 노출은 0이다.\n② 처분: 생성기(harness/elementary_rounding_batch.py 계열)를 발문 해석에 맞게 고치거나, 발문을 \"X의 자리까지 나타내시오\"로 바꿔 정답 해석에 맞춘다. 어느 쪽인지는 교수학 확인(교과서 표현 관례) 후 정하고 근거를 notes에 남긴다. 답이 입력값과 같아지는 입력(어림 자리 아래가 전부 0)은 생성 단계에서 거른다.\n③ 회귀 동결: 코퍼스 전수를 독립 계산식(관례 해석)과 대조하는 테스트를 둔다. 불일치 0 · 답=입력값 0을 단언하고, 생성기 해석을 되돌리는 뮤테이션이 RED인지 확인한다.\n④ 일반화 판정: 같은 부류(발문 문장과 조건식의 의미 불일치)가 다른 템플릿 코퍼스에도 있을 수 있다. 발문↔조건 의미 검사기를 신설할지는 판정만 하고 이 태스크에서 구현하지 않는다(필요하면 별도 등재)."
