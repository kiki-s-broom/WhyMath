acceptance:
  - "① `learner_state`가 GDPR 삭제 경로에 편입된다 — `privacy/erasure.py`의 `_ERASURE_PLAN`에 등재하거나(소유 컬럼 `learner_id`), `_ERASURE_PLAN_EXEMPTIONS`에 사유와 함께 등재한다. 어느 쪽이든 \"아무 데도 없음\" 상태는 해소한다.\n② 파기 순서 검증 — `erase_user()`는 마지막에 `delete(UserProfile)`을 실행하는데 `learner_state.learner_id`는 `user_profile.user_id`를 FK로 물고 `ondelete`가 없다. 실 PG 통합 테스트로 **삭제 요청이 FK 위반으로 실패하지 않는지** 확인한다(조용한 누락이 아니라 요청 자체가 터지는 축).\n③ 완충 가드의 사각 해소 — `tests/backend/privacy/test_erasure_plan_completeness.py`의 `OWNER_COLUMN_NAMES`는 `user_id`·`student_id`·`target_user_id` **3종 고정 열거**라 `learner_id` 같은 별칭을 구조적으로 못 본다. 이름 열거 대신 **산출물 검사**로 바꾼다 — 예: `user_profile.user_id`를 참조하는 FK를 가진 테이블을 전수 스윕(컬럼명 무관). CLAUDE.md 「금지 패턴 열거 대신 산출물 검사」 축.\n④ 실패 주입 — `learner_id` 형태의 소유 컬럼을 가진 더미 테이블을 주입해 가드가 RED를 내는지 확인한다(현행 가드는 이 주입에서 GREEN이다 = 변별력 0). 주입 적용 단언(`mutated != original`) 포함."
