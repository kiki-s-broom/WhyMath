acceptance:
  - "① 결함 고정: tests/harness/test_gate_clear_command_attribution_wiring.py:46의 _CONCRETE_CLEAR = r'gates clear\\s+(G-[A-Za-z0-9-]+)((?:\\s+\\S+)*)'에서 (?:\\s+\\S+)*의 \\s가 개행을 포함하므로 tail이 '그 명령의 나머지 인자'가 아니라 '파일의 나머지 전부'가 된다. 결과: 파일 어딘가에 --as라는 문자열이 산문으로라도 한 번 나오면 '--as not in tail' 검사가 통과한다 — 즉 이 가드는 명령이 실제로 --as를 갖는지 검사하지 못한다"
  - "② 실측 근거(2026-09-07·MGMT-04 세션): docs/legal/export_prediction_disclosure_counsel_brief.md를 _HUMAN_COPY_PASTE_FILES에 등재한 뒤 명령에서 --as kiki를 제거하는 뮤테이션을 주입(적용 1건 단언 통과)했으나 가드 로직 재현 결과 offenders 0건 — RED가 나오지 않았다. 같은 파일 §8 산문의 '--as {kiki,partner}' 설명이 tail에 삼켜졌기 때문. 최소 재현: re.findall(r'gates clear\\s+(G-[A-Za-z0-9-]+)((?:\\s+\\S+)*)', 'clear G-foo --evidence x 개행 --as 를 설명만 한다') → tail이 2줄을 포함"
  - "③ 수정: tail을 같은 줄로 한정한다(예 ((?:[^\\S\\n]+\\S+)*) 또는 줄 단위 스캔 후 매치). 수정 뒤 기존 5개 파일이 여전히 green인지 확인하고, red가 나오면 그 파일의 명령이 실제로 --as를 빠뜨린 것이므로 명령을 고친다(가드를 되돌리지 않는다)"
  - "④ 변별력 주입 필수: 등재된 각 파일에 대해 --as를 제거한 뮤테이션이 RED를 내는지 전건 확인하고, 원복은 사전 cp 백업으로 하며 원복 후 git diff 0줄을 단언한다. '일부만 RED'면 하네스를 의심한다(CLAUDE.md 2026-09-06 주입 자체의 실재)"
  - "⑤ 같은 파일의 다른 검사(test_syntax_reference_shows_the_flag·test_exemptions_are_real_and_named)도 같은 정규식을 공유하는지 확인하고, 공유하면 함께 고친다"
  - "⑥ 겸사: 같은 가드에 --no-base 축이 없다 — HARN-68이 커밋·PR 기준 없는 evidence를 exit 1로 거부하므로, 사람 복붙용 clear 명령이 --no-base도 --evidence 안 커밋참조도 없으면 실행 시 반드시 실패한다. --as와 같은 형태로 검사 축을 추가할지 판정한다(추가하면 기존 5개 파일이 red가 될 수 있으므로 ③과 같은 순서로 처리)"
  - "⑥ 판정(2026-09-08): --no-base 축을 `--as`와 같은 형태로 **전면 도입하지 않는다** — 대부분의 명령에서 판정 불능이기 때문이다. 실측 근거 3가지. (a) 값이 실행 시점에 정해진다: 런북 증거는 \"<커밋/문서/기록>\"·\"...\" 자리표시자이거나 \"$Verdict\" 셸 변수라, 기준의 유무가 사람이 그때 무엇을 치느냐에 달렸고 정규식은 그것을 볼 수 없다 — 모르는 것을 위반으로 접으면 CLAUDE.md \"모른다 ≠ 아니다\"를 어긴다. (b) 꼬리가 줄 단위다: ③에서 tail을 [^\\S\\n]로 줄 한정했으므로, PowerShell 백틱 줄이음으로 다음 줄에 --evidence를 두는 docs/ops/ip_separation_evidence_gate_runbook.md는 꼬리에 증거가 없다 — 전면 검사는 이 파일을 거짓 위반으로 보고한다(--as는 줄이음 앞에 와서 무사하다). (c) 산문 축약형(--evidence ...)이 섞여 있다.\n⑥-b 대신 채택: **구조적으로 결정 가능한 부분집합만** 못박는다 — 증거 전체가 URL인 명령. 실측으로 backlog._has_judgment_base가 녹화 링크·드라이브 링크·유튜브 링크·자리표시 링크를 전부 False로 판정하므로, 사람이 무엇을 치든 --no-base 없이는 반드시 exit 1이다. 신규 검사 = TestUrlOnlyEvidenceCarriesNoBase(_no_base_violations 경유).\n⑥-c 발견된 실결함 3건 수정(③의 규칙대로 가드가 아니라 명령을 고쳤다): G-kiki-device-demo의 복붙 명령 scripts/demo/README.md 2건 + .claude/commands/demo-doctor.md 1건이 증거로 녹화 링크만 주고 있었다 — 시연을 마친 Kiki가 안내대로 링크를 넣고 실행하면 게이트가 안 닫히고 exit 1만 본다. 셋 다 --no-base \"시연 녹화 링크 — 판정 근거가 커밋·PR이 아니라 실기기 시연 영상이다\"를 붙이고 왜 필수인지 주석을 달았다.\n⑥-d 파생 발견(④의 연장): ③의 정규식 수정 자체가 어떤 테스트로도 동결돼 있지 않았다. 뮤테이션 M3(정규식을 결함형 \\s로 되돌림)이 GREEN이었다 — 저장소가 이미 옳으면 결함형은 검사를 무력화할 뿐 없는 위반을 만들지 않기 때문이다. 대책 = 합성 픽스처 TestTailRegexIsLineBounded(절마다 그 절의 반례 4건: 줄 한정·다건 검출·backlog.py 접두 요구·구체 ID 요구). 같은 이유로 판정문을 테스트 안에 인라인으로 두면 그 판정문을 지우는 뮤테이션(M6 --as, M7 --no-base, M9 전수분류)이 전부 생존했으므로, 판정을 모듈 수준 순수 함수(_as_flag_violations·_no_base_violations·_unclassified_files)로 승격하고 TestJudgmentFunctionsActuallyReportViolations가 위반 입력·준수 입력 양방향으로 못박는다.\n⑥-e 뮤테이션 최종: 13종 중 12종 RED. 생존 1종(M11 = test_exemptions_are_real_and_named의 assert path.exists()를 pass로) — 이것은 가드의 판정을 무력화하는 것이 아니라 테스트를 지우는 것이고 어떤 테스트도 자기 삭제를 검출하지 못한다. 한계로 코드 도크스트링에 명시했다. 원복 전건 바이트 동일 단언 통과(cp 백업·git 계열 원복 미사용)."
