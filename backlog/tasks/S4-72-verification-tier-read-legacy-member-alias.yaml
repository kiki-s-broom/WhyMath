notes: "출처: S4-55 마감 점검(2026-10-08~09, 판정 기준: main a07fa67c). 다른 세션 점검이 보고하고 본 세션이 origin/main에서 재현했다 — read_verification_tier에 레거시 멤버를 넘기면 alias 없이 그대로 반환된다(MACHINE_EXHAUSTIVE→MACHINE_EXHAUSTIVE, MACHINE_SAMPLED→MACHINE_SAMPLED). 한 줄 수정(_resolve_tier(raw.value))을 버리는 임시 사본에 적용해 멤버 입력이 FINITE_EXHAUSTIVE·NUMERIC_SAMPLING으로 풀리고 기존 test_verification_tier.py 10건이 통과함을 확인했다(브랜치에는 적용 전). 기존 test_read_enum_instance_returns_itself는 신규 멤버 SYMBOLIC_PROOF만 써서 이 구멍을 못 봤다. read/stamp의 src/·scripts/ 호출처는 0건이라 영향은 잠재적이다 — 첫 생산자가 레거시 멤버를 read에 넘기는 순간 현실이 된다. Kiki 결정(2026-10-09, 추천안대로): (1) A 수정과 D 문서 정정을 S4-69와 분리해 이 태스크로 등재 (2) 설계서 §4.1과 S4-55 acceptance ③ 문구를 코드(NUMERIC_SAMPLING 단일 매핑)에 맞춘다 (3) 레거시 이름 합치기 구조 변경은 보류. S4-69와 tests/backend/l3/test_verification_tier.py를 공유한다 — 서로 다른 테스트 함수를 추가하는 방식이라 충돌은 병합으로 풀린다."
