  - "① 현재 DB·시드·교육과정 노드 자산에서 학년/과목/단원별 Concept·Skill·Problem·Misconception 보유량과 연결 상태를 표로 실측한다. **이 표 없이 과정을 추천하지 않는다.**\n② 그 표를 근거로 대표 과정 후보 2~3개를 제안한다. 후보마다 ⓐ현재 연결 밀도 ⓑ4주 안에 95% 도달에 필요한 추가 작업량 ⓒ출시 시장성 근거. **최종 선택은 Kiki가 한다 — 세션이 임의 확정하지 않는다**(AI가 확정하면 이후 모든 Coverage 분모가 흔들린다).\n③ 선택된 과정에 대해 9항을 **데이터 파일(YAML/JSON)**로 명세한다: 과정 1개 / 대상 학년·과목·단원 범위 / Curriculum Node 목록 / Concept 목록(핵심 여부 표시) / Skill 목록 / 핵심 오개념 목록 / 필수 Problem Type 목록 / 문제 수량 목표 / 콘텐츠 completeness 기준.\n④ 이 명세는 P3-02 Coverage 계측의 **분모**다. 이후 변경은 PR + 변경 사유 기록으로만 한다.\n⑤ 스키마 위반(빈 목록·존재하지 않는 Concept ID 참조)에 로더가 실패하게 한다 — **존재하지 않는 ID를 주입해 RED 를 확인**한다.\n⑥ 완료 판정 — 9항 범위 명세가 데이터 파일로 main 에 있음."
