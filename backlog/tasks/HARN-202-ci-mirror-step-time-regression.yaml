acceptance:
  - "① 진단 재현 — 미러가 스텝의 *성패*만 보고 *소요*는 보지 않아, 시간 회귀를 품은 변경을 통과로 보고한다는 것을 합성 이력으로 재현한다. 실측(2026-09-29 PR #1380 CONST-09): 로컬 미러 backend 잡 Pytest 스텝이 base 1,095초 → 변경 후 1,502초(+37%)였는데 `✔`로 표시됐고, 같은 커밋의 CI backend 잡은 35분 상한에 걸려 pytest 99% 지점에서 cancelled(`--dist loadfile`이라 무거운 파일 몇 개가 꼬리를 이뤘다).\n② 절대값이 아니라 기준선 대비로 판정한다 — 로컬 1,502초(25분)는 35분 상한 *안*이었다. 즉 \"로컬 소요 < timeout-minutes\"는 이번 사고를 통과시키는 검사다(반례를 픽스처로 동결). 미러는 스텝별 소요를 base 커밋(merge-base 또는 origin/main) 키로 로컬 이력에 기록하고, 같은 스텝의 이번 소요가 기준선 대비 일정 비율(초안 +20%) 이상이면 '시간 회귀' 상태로 낸다 — 통과(exit 0)가 아니다(HARN-180의 exit 3처럼 '통과 아님'으로 구분).\n③ 모른다 ≠ 아니다 — 기준선이 없으면(이력 0건·다른 머신·다른 워커 수) '기준선 없음'으로 드러내고 '회귀 없음'으로 접지 않는다. 최종 줄에 잡의 `timeout-minutes`(ci.yml에서 직접 읽음 — 하드코딩 금지)와 로컬 소요 비율도 함께 낸다.\n④ 변별력 — 합성 이력 픽스처로 회귀(RED)·대조군 무회귀(GREEN)·기준선 없음(별도 상태) 3상태, 그리고 ②의 '상한 안이지만 기준선 대비 회귀' 반례. 뮤테이션으로 각 절의 반례를 밟는다(비율 판정 제거·기준선 없음을 무회귀로 접기·timeout 하드코딩)."
