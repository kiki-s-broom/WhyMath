notes: "발견 경위: 2026-09-29 PR #1380(CONST-09 학생 입력 CAS 안전 파싱)의 CI backend 잡이 35분 상한에 걸려 cancelled. 원인은 안전 파서가 문자열을 두 번 읽어(구조 파싱 + 실제 파싱) 파싱 1회당 약 2배가 된 것이고, 테스트 스위트가 같은 문자열을 반복 파싱해(문자열 sympify 52.6만 건 중 고유 2.4만 건) 그 비용이 누적됐다. 푸시 전 로컬 미러는 Pytest 스텝을 1,502초 걸려 통과로 표시했다 — 직전 base 실행은 1,095초였는데 미러는 그 비교를 하지 않는다. 즉시 조치는 PR #1380 안에서 판정 캐시 확대(4,096 → 32,768칸)로 했다. 이 태스크는 '미러가 시간 회귀를 못 본다'는 재발 축을 막는다. OPS-100(main CI 잡별 시간 여유 상시 감시)은 *머지 뒤* 누적 소진을 보는 사후 감시라 *푸시 전* 변경 단위 회귀는 다루지 않는다 — 축이 겹치지 않는다. 사고 대장 계열: ci-job-timeout-exhausted 2회차(1회차 OPS-69 harness-integrity)."
