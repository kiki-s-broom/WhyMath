  - "② 문서 선행(doc-first) - docs/prompts/misconception_diagnosis.md에 선지 역추적 전용 항목의 정의·허용 조건(본문 신호 0건 허용, 후보는 distractor_link 채널로만 생성)을 먼저 쓴다. 그 뒤에 l4/misconception/catalog.py에 4개 항목을 더한다. 현행 불변식 signals 1건 이상을 이 부류에 한해 완화하되 완화 범위를 코드(명시 플래그)와 테스트로 동결한다 - 부류 밖 항목에는 불변식이 그대로 유효해야 하고, 이를 어기는 항목을 주입하면 RED여야 한다."
