acceptance:
  - "① 혼동 실측 기록 — 두 표면이 담는 사실이 실제로 다름을 먼저 적는다. GET /v1/me/learner-state(EOS-10)는 숙달 맵·능력치·오개념을 합성한 요약 상태를, GET /v1/me/learning-state(EOS-105)는 8상태 학습 국면과 전이 이력을 준다. 경로는 한 글자 차이인데 의미는 겹치지 않는다.\n② 판정 — 셋 중 하나를 고른다: (a) 한쪽 개명 (b) 둘 다 개명해 의미를 드러내는 어휘로 교체 (c) 현행 유지 + 혼동 방지 장치만(OpenAPI summary·docstring 상호 참조). (c)를 고르면 그 근거를 적는다 — \"고치기 번거롭다\"는 근거가 아니다.\n③ 소비자 실측이 선결 — 개명 비용은 소비자 수에 비례한다. 판정 전에 두 경로의 소비자를 전수 확인한다(Flutter src/mobile/lib 전수 grep · 웹 · 테스트 · 문서). 지금은 둘 다 소비자 0에 가까우므로 개명 창이 열려 있고, 이 창은 닫힌다.\n④ 기계 집행 — 판정이 (a)(b)면 개명 후 구 경로의 잔존 참조 0건을 전수 스캔으로 확인한다. (c)면 두 엔드포인트의 docstring이 서로를 명시적으로 지목하는지 회귀 테스트로 동결한다(산문 규약은 리팩터링으로 조용히 사라진다).\n⑤ 범위 밖 명시 — 이 태스크는 어휘만 다룬다. 두 표면의 기능·계약·소유 좌석은 각각 EOS-10과 EOS-105가 소유하며 이 태스크가 바꾸지 않는다."
