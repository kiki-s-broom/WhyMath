notes: "출처: 2026-09-17 EOS-105 착지 중 발견. PR #1189(EOS-105)가 GET /v1/me/learning-state를 추가하려는 시점에 main이 EOS-10(PR #1184)의 GET /v1/me/learner-state를 이미 머지한 상태였다. 병합 과정에서 두 경로가 한 글자 차이임을 실측으로 확인했다(api/me.py 1095행 learning-state · 1830행 learner-state).\n\n라우팅 충돌은 없다 — 경로가 다르므로 FastAPI는 정상 분기한다. 문제는 사람이다: 클라 개발자·리뷰어·미래 세션이 둘을 혼동할 표면이 열렸다.\n\n등재만 하고 고치지 않은 이유: EOS-105 세션의 범위 밖이며(마스터 프리앰블 \"이번 항목 밖의 코드를 김에 같이 고치지 않는다\"), 상대 표면 EOS-10은 방금 머지된 타 세션 산출물이라 일방 개명이 부적절하다. 어느 쪽을 어떻게 바꿀지는 Kiki 판정 사안에 가깝다.\n\n착수 시점 권고: 소비자가 생기기 전이 가장 싸다. 두 표면 모두 현재 클라 소비자가 없는 것으로 보이나 그 자체를 acceptance ③이 실측으로 요구한다(\"내가 찾은 방법으로는 0건\" 범위 명시 포함)."
