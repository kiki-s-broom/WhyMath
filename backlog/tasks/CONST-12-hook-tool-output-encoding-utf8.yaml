acceptance:
  - "① 현행 실측 고정(정본화): Windows(cp949 로캘)에서 헌법 도구의 서브프로세스·표준 출력 해독이 어긋난 3곳을 재현 증거와 함께 표로 못박는다 — (a) .claude/hooks/guard_constitution.py 가 차단 안내문을 stderr 로 낼 때 인코딩을 지정하지 않아 파이프에서 cp949 로 나간다 (b) scripts/constitution/selftest_guard.py run_fixture 가 capture_output + encoding utf-8 로 읽어 차단 픽스처 28건마다 reader 스레드가 UnicodeDecodeError 를 낸다(2026-10-03 Kiki 머신 실측: 트레이스 28건 = 차단 기대 픽스처 28건) (c) scripts/constitution/adopt_amendment.py run_merge 가 merge_rules.py 출력을 UTF-8 로 읽는데 그 도구는 cp949 로 낸다(PR #1447 본문 실측: 첫 미리보기 UnicodeDecodeError, PYTHONUTF8=1 우회).\n② 집행 지점 1 — 출력 측: 가드와 merge_rules.py 가 진입점에서 stdout/stderr 를 UTF-8 로 재구성한다(OPS-53 ⑤ 와 같은 방향 — windows_utf8_setup.md 의 'CP949 를 애플리케이션 내부에서 지원하려 하지 말 것'). 정본화(①)와 별항이며, 이 항이 끝나야 읽는 쪽 수정이 의미를 갖는다.\n③ 집행 지점 2 — 읽는 쪽: selftest_guard 와 adopt_amendment run_merge 가 자식 출력을 UTF-8 로 명시 해독하되 해독 실패를 삼키지 않는다. 특히 자가시험은 판정을 종료 코드에만 걸고 안내문 본문을 보지 않으므로, 차단 픽스처마다 stderr 에 헌법 조문 안내문(제9조)이 비어 있지 않게 실렸는지 단언을 추가한다.\n④ 변별력(파이프 축): 콘솔이 아니라 파이프·리다이렉트에서 검증한다. 로케일 cp949 를 강제한 서브프로세스(PYTHONUTF8 해제·PYTHONIOENCODING=cp949)로 수정 전 UnicodeDecodeError 가 재현되고 수정 후 사라짐을 양방향 실측한다. 가드 안내문을 일부러 비우거나 인코딩을 되돌리는 뮤테이션을 주입해 새 단언이 RED 임을 확인하고 원복한다(cp 백업으로 원복 — git checkout 금지).\n⑤ 회귀 테스트: 위 3곳 모두 tests/infra 또는 tests/harness 에 동결한다(현재 selftest_guard·merge_rules 에는 테스트가 없다). CI 잡에서 실제로 도는지 배선을 확인한다.\n⑥ 범위 결정(Kiki 판정 대기): A0004(원본 등록부 3건 추가)를 채택 도우미가 반영하도록 adopt_amendment.py 에 plan_a0004 를 추가하는 일을 이 태스크에 포함할지, 별도 태스크로 분리할지 — 같은 파일을 만지므로 포함을 권고하나 분리 가능하다. 어느 쪽이든 constitution/ 는 쓰지 않는다(제9조).\n⑦ 범위 밖: constitution/ 직접 수정, 규칙 R0-01 의 의미 변경, OPS-53 의 harness·ops CLI 전수 감사(별건), HARN-196 의 stdin 해독 정정(별건)."
  - "⑧ 재현 레시피(2026-10-03 Linux 실측 — ①의 추론을 재현으로 승격): 가드를 PYTHONIOENCODING=cp949 로 실행하면 stderr 가 cp949 바이트로 나오고(첫 글자 ⛔ 는 backslashreplace 되어 리터럴 문자 6자 ⛔ 로, 한글은 cp949 2바이트로) 종료 코드는 그대로 2다. 그 바이트를 UTF-8 로 해독하면 invalid continuation byte · 위치 7 · 바이트 0xc4 — Kiki 머신 Windows 트레이스(위치 7 · 0xc4)와 정확히 일치한다. 기본 UTF-8 로캘은 427바이트가 정상 해독된다. 따라서 ④ 의 변별력 시험은 Linux CI 에서 환경변수 하나로 가능하다(Windows 전용이 아니다). 부수 발견: 차단 안내문의 ⛔ 가 cp949 에서는 리터럴 ⛔ 로 깨져 나가므로 훅 소비자가 UTF-8 로 읽으면 안내문이 모지바케가 된다 — 차단 자체(종료 코드 2)는 영향이 없다. Claude Code 가 훅 stderr 를 실제로 어떻게 해독하는지는 이번에 확인하지 못했다(미확인)."
  - "⑨ ⑧ 정정(전달 단계 손상 — 대장 기록기 결함 아님): ⑧ 의 '리터럴 문자 6자 ⛔' 는 오기다. 입력 파일을 확인하니 내가 적은 역슬래시 표기가 명령 전달 중 실제 문자 ⛔ 로 바뀌어 있었다. 올바른 사실: cp949 로 강제한 가드의 stderr 는 ⛔ 자리에 6글자 리터럴 텍스트가 나온다 — 바이트로 5c 75 32 36 64 34 (역슬래시, 소문자 u, 숫자 26 과 d4) 이며 그 뒤에 공백 20 과 한글 cp949 바이트 c4 da 가 이어진다(재현 출력 앞 8바이트: 5c 75 32 36 64 34 20 c4). 이 줄을 포함해 이 태스크의 텍스트에 역슬래시 표기를 직접 적지 않는다 — 바이트 값으로 적는다."
  - "⑩ ⑥ 판정(2026-10-03 Kiki): A0004 용 채택 도우미 확장 plan_a0004 를 이 태스크에 포함한다(분리하지 않는다). 범위: scripts/constitution/adopt_amendment.py 에 A0004 를 인자로 받아 docs/constitution_proposals/rules_v1.0.2_sources_additions.yaml 의 sources 항목 3건을 rules.yaml 의 sources 절 끝에 덧붙이는 쓰기 계획과 개정 기록(A0004) 생성을 추가한다. A0003 선행 채택을 전제로 확인하고(미채택이면 거부), 규칙 목록·단계·조문이 불변임을 단언하며, 이미 채택됐으면 거부하고, UTF-8·LF 로만 쓴다(기존 A0003·A0002 계획과 같은 규율). 사람 전용(AI 세션 안에서는 반영 거부)을 유지하고 constitution/ 는 이 태스크에서 쓰지 않는다 — 반영은 Kiki 가 도우미로 한다. 변별력: A0004 미리보기가 sources 9건을 12건으로 보여 주는지, A0003 이전·중복 채택·규칙 변경 주입에서 거부하는지를 뮤테이션으로 확인한다. 회귀 테스트는 ⑤ 와 같은 방식으로 동결한다."
