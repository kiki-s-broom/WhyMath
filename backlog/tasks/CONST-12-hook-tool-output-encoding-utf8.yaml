notes: "2026-10-03 코딩 헌법 이식 과제 C(가드 Windows 실동작 확인) 실행 중 발견. 판정은 통과(SELFTEST_EXIT=0·HOOK_BLOCK_EXIT=2·HOOK_ALLOW_EXIT=0)이며 이 결함은 판정을 훼손하지 않는다 — 자가시험이 종료 코드만 쓰기 때문이다. 같은 날 같은 계열(Windows cp949 와 UTF-8 해독 불일치)이 3곳에서 나와 계열 단위로 등재한다. 기존 CONST-10·HARN-196 은 stdin 입력 해독만, OPS-53 은 harness·ops CLI 출력 크래시만 다루며 .claude/hooks 와 scripts/constitution 은 범위 밖이다(2026-10-03 대장 실측: selftest_guard·merge_rules 를 언급하는 태스크는 CONST-02 뿐). 실행 Kiki 머신 증거: C 출력의 PYTHON3_PATH 는 AppData 의 실제 python3.exe.\n\n[정정 2026-10-03] paths ['.claude/hooks/guard_constitution.py', 'scripts/constitution/selftest_guard.py', 'scripts/constitution/adopt_amendment.py', 'scripts/constitution/merge_rules.py', 'tests/infra/**'] → ['.claude/hooks/guard_constitution.py', 'scripts/constitution/selftest_guard.py', 'scripts/constitution/adopt_amendment.py', 'scripts/constitution/merge_rules.py', 'tests/infra/test_hook_tool_output_utf8.py']: 범위 재설정 — 실제로 만질 4개 파일과 신규 회귀 테스트 1개만 지정\npaths 제거 1건: ['tests/infra/**']"
