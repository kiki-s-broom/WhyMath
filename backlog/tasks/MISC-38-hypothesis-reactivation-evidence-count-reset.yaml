acceptance:
  - "① 실측 — `update_hypotheses`는 활성 세트에 없는 오개념의 매치를 신규 가설(evidence_count=1)로 만들고, `_persist_active_set`은 기존 비활성 행을 그 값으로 덮어쓴다. 그래서 M을 5번 보인 뒤 감쇠로 가지치기된 학생이 다시 M을 보이면 MISC-30 사다리(`l2/remediation_policy.py` 2·3·4회)가 1회로 읽는다. 코치 경로(`curate_hypothesis`)와 채점 경로(`apply_candidates`) 양쪽에서 테스트로 재현한다."
  - "② 판정 — 재활성화 때 누적 횟수를 보존할지(비활성 행의 evidence_count 승계), 보존한다면 사다리가 읽는 값이 \"평생 누적\"인지 \"이번 활성 구간\"인지 교수학적으로 정한다(낙인 방지와 반복 오류 대응의 균형 · MISC-30 same error 정의). 새 카운터를 만들지 않는다는 MISC-30 ②를 따른다."
  - "③ 빈도 근거 — EOS-123이 정답 회차에도 감쇠를 열어 가지치기가 앞당겨지므로 이 리셋이 더 자주 드러난다(신선 매치 0.9는 감쇠 16회에 가지치기 · EOS-123 판정문 §4-1·§4-3). 판정 근거에 그 빈도 변화를 포함한다."
