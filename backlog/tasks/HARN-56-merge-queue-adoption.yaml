  - "① 실측 선행 — 룰셋의 required status check 목록과 'require branches to be up to date' 실제 설정을 gh api repos/doldori7/WhyMath/rules/branches/main 으로 덤프해 기록한다. 지금 이 태스크의 전제(최신 base 강제가 켜져 있다)는 405 응답 문구와 mergeable_state=behind 로부터의 추론이므로, 설정 실물로 확인하기 전까지는 가설이다. 확인 결과 전제가 틀리면 태스크를 재정의하고 착수하지 않는다"
  - "② merge queue 배선 — main 대상 ruleset에 merge queue 를 켜고, 큐가 사용할 체크를 현행 required 집합과 일치시킨다. 큐 안에서 GitHub 이 최신 base 위로 재검증하므로 개별 PR 의 수동 최신화가 불필요해진다. 'require branches to be up to date' 는 큐 도입 후에도 유지한다 — 보호를 낮추는 것이 아니라 충족 방식을 바꾸는 것이 이 태스크의 취지다(우회 아님)"
  - "③ 변별력 실측 — 도입 전후를 같은 지표로 비교한다. 전: 이 사고 실측(PR #952 가 CI green 3회를 확보하고도 behind 로 3라운드 소요, 각 라운드 약 30분). 후: 테스트 PR 1건을 큐에 넣고, 큐 대기 중 main 에 다른 PR 을 의도적으로 착지시킨 뒤에도 수동 개입 없이 머지되는지 확인. 이 주입을 하지 않으면 '경합이 없었을 뿐'과 '경합에 강해졌음'을 구분할 수 없다"
  - "④ 실패 경로 설계 — 큐에서 축출(dequeue)되는 경우(재검증 red·큐 타임아웃)에 무엇이 남는지 정한다. 축출이 조용하면 PR 이 열린 채 방치되므로, 축출 사유가 PR 에 보이는지 확인하고 보이지 않으면 세션 절차(축출 감지·재투입)를 런북에 명시한다"
  - "⑤ 정본 문서 갱신 — docs/reviews/pr931_merge_block_root_cause_2026-08-31.md 가 dirty 축(events.ndjson 샤딩)만 다루고 behind 축은 다루지 않는다. 그 문서에 behind 축을 추가하거나 승계 문서를 만들어, 다음 세션이 'blocked' 를 만났을 때 두 축을 구분할 수 있게 한다"
  - "[전제 변경 통지 2026-09-09 · 타 세션(whymath-29) 실측] 이 태스크의 차단 사유가 된 \"merge queue를 켤 수 없다\"가 더 이상 성립하지 않는다. 저장소가 개인 계정에서 조직으로 **이관**됐다 — `doldori7/WhyMath` → `kiki-s-broom/WhyMath`, `owner.type` User → **Organization**, repo id 1237870848 동일(이관이지 신설 아님). 계기 = 조직 관리자의 Claude GitHub App 재설치.\n\n[실측 방법] REST `repos/doldori7/WhyMath`가 301 Moved Permanently를 내고, 검색 API가 같은 id를 새 full_name으로 돌려준다. git(fetch·ls-remote)은 리다이렉트를 투명 처리해 정상 동작한다.\n\n[왜 이 태스크에 중요한가] 2026-09-07에 merge queue가 **조직 소유 전용**이라 이 저장소에서 불가하다는 판정이 나왔고(CLAUDE.md v0.2.18 \"가용성 확인 절차\" 규칙의 사고 경위), 그 결과 게이트 `G-merge-queue-enable-ruleset`이 waive되고 대안 D안(자동 재동기화 · HARN-85/HARN-87)으로 갔다. 그 waive의 근거가 소멸했다. 또한 `scripts/harness/ruleset_drift.py:291-294`와 `.github/branch-protection-setup.md:318`이 \"저장소가 조직으로 이관되면 그때 `merge_queue`를 이 튜플에 추가한다\"고 예약해 둔 재평가 트리거가 발동했다.\n\n[근거의 범위 — 단정하지 않는 부분] 내가 실측한 것은 `owner.type=Organization`까지다. `.github/branch-protection-setup.md`가 \"조직 소유 공개 저장소는 무료 플랜에서도 merge queue 사용 가능\"이라고 적고 있으므로 제공 조건에는 부합하나, **룰셋 화면에 `Require merge queue` 항목이 실제로 보이는지는 확인하지 못했다** — 이 세션은 GitHub API가 끊겨 있다(옛 이름 301 · 새 이름 세션 스코프 밖 · `add_repo`가 cross-tier 거부). 착수 세션은 화면 실물 또는 라이브 룰셋 조회로 확정한 뒤 진행한다. 2026-09-07 사고가 정확히 \"설정 부재를 미설정으로 읽은\" 것이었으므로 반대 방향 단정도 하지 않는다.\n\n[결정이 필요한 사항 — 세션이 정할 일이 아니다] 이제 merge queue와 자동 재동기화(D안)가 **둘 다 가능**하다. D안은 이미 착지해 동작 중이다(HARN-87 라이브 실측 완료). 그러므로 ①merge queue로 전환 ②D안 유지 ③병행 중 무엇인지는 Kiki 결정이며, `G-merge-queue-or-strict-relax`(cleared·D안 채택)의 재판정에 해당한다. 이 통지는 전제 변경 사실만 전달한다.\n\n[인접 태스크] 이관 자체의 정본 전환은 `HARN-96-canonical-repo-migration-kiki-s-broom`(priority 1 · claude/g-merge-queue-strict-relax-rm3cmc)이 소유한다 — 시크릿·룰셋 승계·CI 배선·컷오버·구 저장소 처분. 그 태스크의 acceptance ③이 \"merge queue 옵션이 실제로 화면에 있는지 먼저 확인하고 있으면 활성화한다\"를 이미 담고 있으므로, 이 태스크와 HARN-96의 경계를 착수 전에 정리할 것."
  - "[가용성 확정 통지 2026-09-21 · 타 세션(whymath-74 · G-arch38 재확인) 라이브 실측] 2026-09-09 통지가 \"룰셋 화면에 `Require merge queue` 항목이 실제로 보이는지는 확인하지 못했다 — 착수 세션은 화면 실물 또는 라이브 룰셋 조회로 확정한 뒤 진행한다\"로 남긴 미확인 축이 **해소됐다.** 그리고 결과는 \"쓸 수 있다\"보다 한 칸 더 나아간다 — **merge queue는 이미 켜져 있고, main 대상으로 필수(required)다.**\n\n[실측 3건 · PR #1244 · main 기준 `3d534dcc` · 2026-09-21T07:18Z] ⓐ CI 18잡 전건 green(성공 6·스킵 12·실패 0)·`mergeable_state: clean` 상태에서 REST 직접 머지(`PUT /repos/kiki-s-broom/WhyMath/pulls/1244/merge`, squash)가 **405 Repository rule violations found — \"Changes must be made through the merge queue\"**로 거부됐다 ⓑ `enable_pr_auto_merge`(SQUASH)는 성공했다 ⓒ 직후 GitHub가 `pull_request.enqueued` 이벤트를 발행했다(actor=doldori7). 즉 큐는 제공될 뿐 아니라 **강제되는 경로**이며, 우회 경로가 닫혀 있다.\n\n[근거의 범위 — 단정하지 않는 부분] 내가 확인한 것은 **머지 API의 거부 문구와 큐 진입 사실**까지다. 라이브 룰셋 JSON을 직접 조회해 `merge_queue` 규칙의 파라미터(큐가 사용하는 체크 집합·merge method·최대 대기 등)를 읽지는 **않았다** — 이 세션에 룰셋 조회 도구가 없다. 그러므로 acceptance ②의 \"큐가 사용할 체크를 현행 required 집합과 일치시킨다\"가 **충족됐는지는 미확인**이다. 2026-09-03 정정이 경고한 실패 모드(미강제 상태에서 큐를 켜면 일부만 검증하는 큐가 된다)가 여전히 열린 질문이므로, 착수 세션은 룰셋 실물을 먼저 읽어야 한다.\n\n[이 태스크에 대한 함의] ⓐ acceptance ②(merge queue 배선)는 **누군가 이미 켰다** — 누가 언제 켰는지 이 세션은 모른다. 그러므로 ②는 \"하는 일\"이 아니라 \"확인하고 파라미터를 대조하는 일\"로 축소된다 ⓑ acceptance ①(룰셋 실측)은 그 대조의 선결로 여전히 유효하며, 명령의 저장소 경로가 옛 이름 `doldori7/WhyMath`로 적혀 있으니 `kiki-s-broom/WhyMath`로 고쳐야 한다(301 리다이렉트에 의존하지 않는다) ⓒ acceptance ③(변별력 실측 — 큐 대기 중 main에 다른 PR을 의도적으로 착지시켜 경합 내성 확인)은 **아직 아무도 안 했다**. PR #1244의 큐 통과는 경합 주입이 없는 회차라 ③의 증거가 되지 못한다 — \"경합이 없었을 뿐\"과 \"경합에 강해졌음\"을 구분하지 못한다는 ③ 자신의 문장이 그대로 적용된다 ⓓ acceptance ④(축출 실패 경로)도 미착수다.\n\n[게이트 함의 — 세션이 정할 일이 아니다] `G-merge-queue-or-strict-relax`는 D안(자동 재동기화) 채택으로 cleared였는데, 이제 merge queue가 **실제로 강제되는 상태**다. 두 장치가 동시에 살아 있는 셈이므로 ①merge queue 단일화 ②D안 유지 ③병행 중 무엇인지는 Kiki 재판정 사안이다. 이 통지는 상태 변화 사실만 전달한다.\n\n[전달 경로에 대한 기록] 이 태스크를 claim한 세션 `claude/status-f9lp65`는 **도달 불가**다 — CCR 세션 목록 90건(2페이지)을 전수 조회했으나 그 브랜치를 가진 세션이 없다. 원격 브랜치 `claude/status-f9lp65`(`d792c9d0`)는 살아 있고 끝 커밋 제목이 \"HARN-56 blocked — 부분 착지 후 관리자 권한 게이트 대기\"다. claim은 2026-09-09 이후 갱신이 없다. 그래서 세션 간 메시지가 아니라 **대장 append**를 전달 경로로 썼다(2026-09-09 통지와 같은 방식). claim 자체의 처분(회수·해제)은 이 통지의 범위가 아니며 `stray-code` 감사가 소유한다.\n\n[큐 동작 실측 추가 2026-09-21T07:55Z · acceptance ③에 부분 기여] 큐는 **직렬 FIFO**로 동작하며, 각 PR마다 `gh-readonly-queue/main/pr-<번호>-<직전 main sha>` 브랜치에서 `merge_group` 이벤트로 CI를 새로 돌린다(`ci.yml` 기준 `merge_group` 트리거는 PR #974가 착지시킨 것). 실측 타임라인: PR #1244가 07:18Z에 enqueue된 뒤 대기하는 동안 main이 `c8627941` → `18dea600`(#1240) → `0469f289`(#1241)로 **두 번 전진**했고, 그 뒤 #1244의 큐 CI가 07:48:57Z에 **`0469f289` 위에서** 시작했다(`gh-readonly-queue/main/pr-1244-0469f289…`). PR의 `base.sha`는 생성 시점 `c8627941` 그대로인데 큐는 최신 main 위에서 재검증한 것이다 — **수동 최신화(rebase·merge) 없이** 경합이 흡수됐다.\n\n[③을 닫지 않는 이유] 이 경합은 **의도적 주입이 아니라 우연**이다. acceptance ③이 요구한 것은 \"테스트 PR 1건을 큐에 넣고 큐 대기 중 main에 다른 PR을 **의도적으로** 착지시킨 뒤\" 확인하는 것이고, 그래야 \"경합이 없었을 뿐\"과 \"경합에 강해졌음\"을 구분할 수 있다는 것이 ③ 자신의 문장이다. 이번 회차는 관측된 경합 2회가 우연히 발생했을 뿐 설계된 주입이 아니므로 **③의 증거로 계상하되 ③을 닫지는 않는다**. 다만 \"큐가 최신 main 위에서 재검증한다\"는 메커니즘 자체는 위 브랜치명·타임스탬프로 확인됐으므로, ③의 남은 몫은 *주입의 설계*이지 *메커니즘의 미확인*이 아니다.\n\n[부수 관측 — ④(축출 실패 경로)에 참고] 큐 대기 중 PR의 `mergeable_state`가 `unknown`으로 장시간 머무르고 `updated_at`도 갱신되지 않아, **PR 객체만 보면 큐 안에 있는지 축출됐는지 구분되지 않는다**. 이 세션은 한때 축출을 의심했고, 구분은 `list_workflow_runs`를 `event=merge_group`으로 걸어 `gh-readonly-queue/main/pr-<번호>-*` 실행의 존재·상태를 보고서야 가능했다. ④가 정할 \"축출이 조용하면 무엇이 남는가\"의 실무 답 하나가 이것이다 — **축출 여부 판정은 PR 상태가 아니라 merge_group 워크플로 실행 조회로 한다.**\n\n[회차 종결 2026-09-21T08:15Z] PR #1244는 **수동 개입 0회로 머지됐다** — main `9fec05ae`. 전 과정 타임라인: 07:13Z PR 생성(base `c8627941`) → 07:17Z 직접 머지 405 거부 → 07:18Z auto-merge(SQUASH) 설정·enqueue → 07:18Z·07:25Z 사이 main 2회 전진(#1240 `18dea600` · #1241 `0469f289`) → 07:48Z 큐 CI 시작(`0469f289` 위) → 08:15Z 머지. **rebase·merge·force-push 어느 것도 하지 않았고 PR의 head sha는 `1d54b017`로 끝까지 불변이었다.** 이것이 이 태스크가 해소하려던 behind 루프(PR #952가 CI green 3회를 얻고도 3라운드 소요)의 반대 사례다."
  - "⑤ 실패 경로 설계의 반대 축 — **자발적 dequeue 가 세션에 없다** (2026-09-22 실측 · PR #1277). acceptance ④ 는 *비자발적* 축출(재검증 red·큐 타임아웃)에 무엇이 남는지를 묻는다. 그 반대 축이 실측으로 드러났다: 세션이 **큐에 넣은 뒤 자기 PR 의 결함을 발견해도 고칠 수 없다.**\n\n실측 3건: ⓐ 큐에 들어간 브랜치로의 push 가 `GH006: Protected branch update failed — A pull request for this branch has been added to a merge queue. Branches that are queued for merging cannot be updated. To modify this branch, dequeue the associated pull request.` 로 거부된다(4회 재시도 전건 동일) ⓑ `disable_pr_auto_merge` 는 성공하지만 **큐 엔트리를 제거하지 않는다** — 해제 후에도 같은 GH006 이 그대로 난다 ⓒ 실제 dequeue 는 GraphQL `dequeuePullRequest` 뮤테이션이 필요하고 세션의 GitHub 도구 집합(`mcp__github__*`)에 그 경로가 없다. `gh` CLI 도 없다.\n\n그래서 세션에게 남는 선택지가 셋뿐이고 전부 비용이 있다: ①머지를 기다렸다가 후속 PR 로 고친다(결함이 main 을 한 번 통과한다) ②Kiki 께 dequeue 를 요청한다(왕복 1회) ③지정 브랜치 외로 푸시한다(**금지** — 명시 허가 필요).\n\n파급: 이 상태에서 세션은 `Stop` 훅의 \"미푸시 커밋을 푸시하라\" 요구를 **구조적으로 충족할 수 없다**. 훅과 브랜치 보호가 서로 모순되는 요구를 내므로, 세션은 훅 경고를 안고 종료하거나 커밋을 되돌려야 한다 — 어느 쪽도 설계된 동작이 아니다.\n\n처방 후보(구현자 판단): ⓐ 런북·절차에 \"큐 투입은 마지막 행위다 — 투입 전 자기 diff 재독을 강제\" 를 명시 ⓑ 세션 도구에 dequeue 경로를 추가(가능하면) ⓒ 훅이 '큐 대기 중 브랜치'를 인지해 미푸시 경고를 유예. CLAUDE.md 「거부의 우회 금지」 처리 순서 ③(CLI 경로 자체가 없는 설계 공백)에 해당해 등재한다."
  - "⑥ `git push --dry-run` 은 이 블로커에 변별력이 없다 (2026-09-22 실측 · ⑤ 의 부수 발견). 큐 대기 중 푸시 가능 여부를 `--dry-run` 으로 확인했다가 오판했다 — **같은 시점 같은 브랜치에서 `git push --dry-run` 이 EXIT=0, 실제 `git push` 가 EXIT=1**(GH006)이었다.\n\n원인: `--dry-run` 은 ref 업데이트가 fast-forward 인지만 보고 **서버측 pre-receive 훅을 거치지 않는다.** 큐 잠금은 그 훅에서 나므로 허용 상태와 차단 상태에서 같은 값이 나온다 — CLAUDE.md 「변별력 없는 검증 스텝 금지」의 정의 그대로다.\n\n처방: 큐 잠금 해제 여부의 판정은 **실제 `git push` 의 exit code 로만** 한다. 자동화(체크인 루프·런북)에 `--dry-run` 을 게이트로 넣지 않는다. 같은 이유로 `git ls-remote`·`git fetch` 성공도 푸시 가능의 근거가 아니다(읽기 경로는 잠기지 않는다)."
