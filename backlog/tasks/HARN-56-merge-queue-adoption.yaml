  - "① 실측 선행 — 룰셋의 required status check 목록과 'require branches to be up to date' 실제 설정을 gh api repos/doldori7/WhyMath/rules/branches/main 으로 덤프해 기록한다. 지금 이 태스크의 전제(최신 base 강제가 켜져 있다)는 405 응답 문구와 mergeable_state=behind 로부터의 추론이므로, 설정 실물로 확인하기 전까지는 가설이다. 확인 결과 전제가 틀리면 태스크를 재정의하고 착수하지 않는다"
  - "② merge queue 배선 — main 대상 ruleset에 merge queue 를 켜고, 큐가 사용할 체크를 현행 required 집합과 일치시킨다. 큐 안에서 GitHub 이 최신 base 위로 재검증하므로 개별 PR 의 수동 최신화가 불필요해진다. 'require branches to be up to date' 는 큐 도입 후에도 유지한다 — 보호를 낮추는 것이 아니라 충족 방식을 바꾸는 것이 이 태스크의 취지다(우회 아님)"
  - "③ 변별력 실측 — 도입 전후를 같은 지표로 비교한다. 전: 이 사고 실측(PR #952 가 CI green 3회를 확보하고도 behind 로 3라운드 소요, 각 라운드 약 30분). 후: 테스트 PR 1건을 큐에 넣고, 큐 대기 중 main 에 다른 PR 을 의도적으로 착지시킨 뒤에도 수동 개입 없이 머지되는지 확인. 이 주입을 하지 않으면 '경합이 없었을 뿐'과 '경합에 강해졌음'을 구분할 수 없다"
  - "④ 실패 경로 설계 — 큐에서 축출(dequeue)되는 경우(재검증 red·큐 타임아웃)에 무엇이 남는지 정한다. 축출이 조용하면 PR 이 열린 채 방치되므로, 축출 사유가 PR 에 보이는지 확인하고 보이지 않으면 세션 절차(축출 감지·재투입)를 런북에 명시한다"
  - "⑤ 정본 문서 갱신 — docs/reviews/pr931_merge_block_root_cause_2026-08-31.md 가 dirty 축(events.ndjson 샤딩)만 다루고 behind 축은 다루지 않는다. 그 문서에 behind 축을 추가하거나 승계 문서를 만들어, 다음 세션이 'blocked' 를 만났을 때 두 축을 구분할 수 있게 한다"
  - "[전제 변경 통지 2026-09-09 · 타 세션(whymath-29) 실측] 이 태스크의 차단 사유가 된 \"merge queue를 켤 수 없다\"가 더 이상 성립하지 않는다. 저장소가 개인 계정에서 조직으로 **이관**됐다 — `doldori7/WhyMath` → `kiki-s-broom/WhyMath`, `owner.type` User → **Organization**, repo id 1237870848 동일(이관이지 신설 아님). 계기 = 조직 관리자의 Claude GitHub App 재설치.\n\n[실측 방법] REST `repos/doldori7/WhyMath`가 301 Moved Permanently를 내고, 검색 API가 같은 id를 새 full_name으로 돌려준다. git(fetch·ls-remote)은 리다이렉트를 투명 처리해 정상 동작한다.\n\n[왜 이 태스크에 중요한가] 2026-09-07에 merge queue가 **조직 소유 전용**이라 이 저장소에서 불가하다는 판정이 나왔고(CLAUDE.md v0.2.18 \"가용성 확인 절차\" 규칙의 사고 경위), 그 결과 게이트 `G-merge-queue-enable-ruleset`이 waive되고 대안 D안(자동 재동기화 · HARN-85/HARN-87)으로 갔다. 그 waive의 근거가 소멸했다. 또한 `scripts/harness/ruleset_drift.py:291-294`와 `.github/branch-protection-setup.md:318`이 \"저장소가 조직으로 이관되면 그때 `merge_queue`를 이 튜플에 추가한다\"고 예약해 둔 재평가 트리거가 발동했다.\n\n[근거의 범위 — 단정하지 않는 부분] 내가 실측한 것은 `owner.type=Organization`까지다. `.github/branch-protection-setup.md`가 \"조직 소유 공개 저장소는 무료 플랜에서도 merge queue 사용 가능\"이라고 적고 있으므로 제공 조건에는 부합하나, **룰셋 화면에 `Require merge queue` 항목이 실제로 보이는지는 확인하지 못했다** — 이 세션은 GitHub API가 끊겨 있다(옛 이름 301 · 새 이름 세션 스코프 밖 · `add_repo`가 cross-tier 거부). 착수 세션은 화면 실물 또는 라이브 룰셋 조회로 확정한 뒤 진행한다. 2026-09-07 사고가 정확히 \"설정 부재를 미설정으로 읽은\" 것이었으므로 반대 방향 단정도 하지 않는다.\n\n[결정이 필요한 사항 — 세션이 정할 일이 아니다] 이제 merge queue와 자동 재동기화(D안)가 **둘 다 가능**하다. D안은 이미 착지해 동작 중이다(HARN-87 라이브 실측 완료). 그러므로 ①merge queue로 전환 ②D안 유지 ③병행 중 무엇인지는 Kiki 결정이며, `G-merge-queue-or-strict-relax`(cleared·D안 채택)의 재판정에 해당한다. 이 통지는 전제 변경 사실만 전달한다.\n\n[인접 태스크] 이관 자체의 정본 전환은 `HARN-96-canonical-repo-migration-kiki-s-broom`(priority 1 · claude/g-merge-queue-strict-relax-rm3cmc)이 소유한다 — 시크릿·룰셋 승계·CI 배선·컷오버·구 저장소 처분. 그 태스크의 acceptance ③이 \"merge queue 옵션이 실제로 화면에 있는지 먼저 확인하고 있으면 활성화한다\"를 이미 담고 있으므로, 이 태스크와 HARN-96의 경계를 착수 전에 정리할 것."
