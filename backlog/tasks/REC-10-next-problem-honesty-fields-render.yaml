notes: "docs/architecture/ai_recommendation_module_gap_review_r3.md §3 D7. problem_models.dart:33-54의 NextProblemResponse가 원래 5필드만 선언 — REC-01이 추가한 4필드와 REC-04의 band_calibrated 전건 미파싱이고, 파싱하는 standardError·measurementSufficient조차 src/mobile/lib 전역 reader 0. 서버는 candidate_zero_reason으로 '후보 조회 0건'과 '게이팅 전부 부적격'을 이미 구분해 보내는데 클라가 버린 뒤 주석으로 '측정 충분·또는 미시딩'이라 뭉갠다. learning_path_module_gap_review_r2.md §9 9회차 원칙('정직 표기는 그것을 만든 응답 밖으로 나갈 때 함께 가야 한다')의 추천축 재생산이며 PATH-10보다 한 단계 이르다(렌더 0이 아니라 파싱 0). REC-01·REC-04 모두 paths가 backend만이라 렌더 좌석을 볼 수 없었다 — 어느 태스크의 실패도 아닌 두 태스크 사이의 무소유 경계. 백로그 전수 grep에서 이 필드명은 REC-04 YAML에만 등장 = 소유 태스크 0.\n\n[정정 2026-09-01] eos_priority null → P2: 판정표 N/이월 — 2027 이월(폐기 아님·선언 §6-5). EOS-80 일괄 백필\n\n[정정 2026-09-16] 계획서 300 §8(Recommendation + Reason) 편입 — EOS-09 변환 대조에서 '계측 축'과 '교수적 이유'가 서로 다른 축임이 드러났다. REC-10은 전자의 클라 도달을 소유하므로 그 경계를 acceptance에 못박는다(후자 생산은 신규 등재분이 소유)"
