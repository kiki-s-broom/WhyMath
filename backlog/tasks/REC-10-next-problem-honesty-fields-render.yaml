  - "[계획서 300 §8 편입 — 2026-09-16 · EOS-09 변환] 노출할 '이유'가 두 종류라는 것을 구분한다.\n\n⑤ 계측 축 != 교수적 이유 — 현행 NextProblemResponse 5필드(weight_axes_applied · candidate_pool_size · weak_concept_signal_count · candidate_zero_reason · band_calibrated)는 **계측 메타**다(어느 가중 축이 적용됐나 · 후보가 왜 0인가). 계획서 §8이 요구하는 것은 **교수적 이유**다 — reason{type: PREREQUISITE_GAP, confidence: 0.87} 형태로 \"어느 개념·어느 오개념 때문에 이 문항인가\". 이 태스크는 전자의 렌더를 소유하며, 후자의 생산은 별건(추천 호출 계약)이 소유한다. 렌더 설계가 두 종류를 같은 자리에 섞지 않게 한다.\n\n⑥ 학생에게 숫자를 노출하지 않는다 — 이 태스크 acceptance ④가 이미 계측 수치의 학생 숫자 노출을 금지한다. 따라서 필요한 것은 필드 파싱이 아니라 **사유 라벨 어휘 설계**다(candidate_zero_reason의 no_pool · all_gated_ineligible을 학생이 읽을 문장으로). 어휘 목록을 acceptance 산출물로 남긴다.\n\n⑦ 정서 안전 — 사유 라벨이 \"너에게 맞는 문제가 없다\"로 읽히면 학습 동기를 꺾는다(CLAUDE.md 교수학 금기). 후보 0 상태의 문면은 학생 귀책이 아닌 형태로 쓴다."
