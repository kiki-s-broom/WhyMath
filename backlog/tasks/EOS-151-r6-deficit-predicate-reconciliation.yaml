acceptance:
  - "① `l2/learning_state_recommendation.py::_prerequisite_status`의 약점(WEAK) 판정을 `recommendation_contract.is_prerequisite_deficit`(BKT 사전값 0.3 미만)로 교체한다 — EOS-26은 그 판정을 \"(가)와 같은 선 · 같은 입력\"으로 정의했고 EOS-33이 (가)의 선을 0.7에서 사전값으로 옮겼다. EOS-26 단위 테스트의 경계 리터럴(0.69 약점 · 0.70 숙달)은 0.29/0.30으로 바뀌고, 0.30~0.69는 \"측정됐고 결손 아님\"(원인 후보가 아님 → 미측정 선수가 있으면 탐침, 없으면 같은 개념 `refuted`)이 된다.\n\n② 정책 식별자 `cat_v2_state_undiagnosed` → `cat_v3_state_undiagnosed` — 이름표·재선택이 기본 CAT 규칙을 따른다는 전제의 이름이므로 기본 CAT(`cat_v3`)에 맞춘다(소급 평가가 두 규칙을 섞지 않게).\n\n③ 병합 순서 트립와이어 `tests/backend/l2/test_recommendation_policy.py::TestParallelMergeTripwire`의 skip 분기를 지워 상시 불변식 테스트로 승격한다(분류기가 트리에 있는 한 두 좌석의 술어 일치를 단언).\n\n④ S-1 조합 검토(EOS-33 판정문 §8): 오답 원천(`EOS-146`)이 생기면 정보량 최대 출제(정답 ≈ 50%)와 난이도를 모르는 BKT가 만나 모형상 능력과 무관하게 같은 개념 6문항 안 75%가 선수 구간에 든다 — 판정하거나 측정 태스크로 분리한다.\n\n⑤ `scripts/analysis/mutate_eos26_r6_guards.py`의 경계 앵커(0.69·0.70)를 새 술어로 재앵커하고 전건 검출을 다시 확인한다."
