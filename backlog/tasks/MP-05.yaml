acceptance:
  - "① 식별 근거 — genlog JSONL에서 같은 run_id 행을 **적재 순서대로** 읽어 앞머리 canary_size건을 카나리 구간으로 잘라낸다. canary_size는 대장(rounds.jsonl) 행의 canary_size 필드에서 읽는다(추론 금지 — 회차마다 다를 수 있고 0=관문 끔·None=미기록은 서로 다른 처분이다)"
  - "② 산출 — review_session --queue가 그대로 먹는 JSONL(slug 키를 갖는 행)을 낸다. 카나리 시도 중 **수용된 것**은 코퍼스 <out>.jsonl에서, **비수용**은 <out>.review.jsonl에서 해결하며, 어느 쪽에서도 못 찾은 행은 조용히 버리지 않고 사유와 함께 남긴다(침묵 실패 금지)"
  - "③ 변별력 — 카나리 30 회차와 카나리 0(관문 끔) 회차에서 산출 건수가 달라야 한다. 대장에 canary_size가 None(미기록·구행)이면 '모른다'로 exit 1 — 30을 기본값으로 가정해 채우지 않는다(모른다 ≠ 아니다)"
  - "④ 실측 공백 근거 — 2026-09-06 실측: 카나리 통과분은 표식 없이 그대로 코퍼스에 append되고(problem_corpus_accumulate.py:305-306 '카나리는 버리는 표본이 아니라 이 회차의 앞부분이므로, 통과분은 그대로 코퍼스에 append된다'), 코퍼스 행·검수 큐 행 어디에도 phase 표식이 0건이라 '이 30건이 카나리였다'를 기계가 특정할 수 없다"
