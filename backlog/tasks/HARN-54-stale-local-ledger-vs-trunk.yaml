acceptance:
  - "① `next`·`start`가 로컬 `backlog/`와 **`origin/main`의 대장**을 대조해, 후보(또는 착수 대상)의 상태가 main에서 이미 done/cancelled이면 그 사실을 고지한다. 네트워크 0 계약 유지 — 이미 fetch된 remote-tracking ref만 읽는다(`scan_remote_task_files`의 fetch=False 선례). 조회 불가는 침묵하지 말고 판정 불가로 말한다"
  - "② 차단이 아니라 고지 — main이 done이어도 로컬에 정당한 후속 작업이 있을 수 있으므로 exit 1로 막지 않는다(HARN-43 선례). 다만 `start`에서는 고지가 **눈에 띄어야 한다** — 사고 당시 path_overlap 경고 4줄에 묻혀 착수가 그대로 진행됐다"
  - "③ remote-tracking ref 자체가 낡았으면 그 사실도 고지 — `remote_refs_age_seconds`(HARN-43이 이미 만든 함수)를 재사용한다. main에 없음과 main을 최근에 못 봤음은 다른 진술이며, 후자를 전자로 말하면 거짓 안심이 된다"
  - "④ 변별력 양방향 실측 — main에서 done인 태스크를 착수하면 고지가 뜨고, todo인 태스크에서는 뜨지 않는다를 hermetic bare_remote 픽스처로 동결. 무조건 뜨는 고지는 습관화돼 정작 필요할 때 안 보인다(HARN-43 ③ 동형). 뮤테이션으로 대조 로직을 무력화하면 red가 되는지 확인"
