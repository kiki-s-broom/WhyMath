acceptance:
  - "① 클라우드에서 *내려받은* .dump.age 1건으로 §3 복구 리허설을 1회 수행한다 — 로컬 원본이 아니라 회수본이어야 반출 경로 전체(업로드→동기화→회수→복호→pg_restore)가 검증된다. 개인키는 클라우드가 아니라 §1b의 별도 매체에서 가져온다(§4-5 키 분리를 검증 과정에서 깨지 않는다)."
  - "② 변별력: 이 검증이 무엇을 잡을 수 있는지 명시한다 — 동기화 중 잘린 사본·클라우드측 변조·확장자만 맞고 내용이 다른 파일은 로컬 원본 검증(§4-1a)으로는 절대 드러나지 않는다. 회수본 복원이 성공했을 때와 실패했을 때 각각 무엇이 증명되는지를 런북에 적는다."
  - "③ 결과를 런북 §4-1d와 §5 운영 표에 기록한다 — 실시 일자·대상 파일·결과. §4-1d는 현재 '분기 리허설 때 한 번 수행하면 된다'는 *권고 산문*뿐이고 실시 기록 칸이 없다."
  - "④ 집행 지점 별항(정본화≠집행): 분기 리허설이 실제로 이 분기를 밟게 하는 장치를 정한다. 산문 권고만으로는 다음 분기에 또 로컬 원본으로 리허설한다 — 재확인 게이트(G-backup-restore-rehearsal 계열) 또는 리허설 체크리스트 항목 중 하나로 못박는다."
