  - "처분 판정: 편집 시 자동으로 새 DRAFT 생성 / 발행본 편집 차단 / 드리프트 표지만 남김 중 하나를 근거와 함께 고른다. 고른 처분의 집행 지점은 정본화와 별항으로 적고, 서빙·편집 코드가 그 지점을 실제로 경유함을 AST 또는 통합 테스트로 동결한다."
