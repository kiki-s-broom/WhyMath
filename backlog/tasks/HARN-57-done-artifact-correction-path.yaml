notes: "출처: 2026-09-01 HARN-44 종결 시 실측. EOS 등급 P2 근거: 12월 검증 폐쇄루프(G0~G5)는 이 경로 없이도 성립한다 — 증적은 PR·커밋 메시지로 우회 기록 가능하므로 '애매하면 P0가 아니다' 원칙에 따라 판정 이후로 둔다. 경위: done을 PR 생성 *전에* 부른 세션 실수가 1차 원인이지만(올바른 순서 = PR 생성 후 done --artifact '#N'), 진짜 문제는 그 뒤 정정이 불가능하다는 것이다 — done은 종결 상태라 재실행 거부(done→done 전이 불가), amend는 --acceptance/--gate/--track/--depends/--priority/--eos-priority만 열려 있고 --artifact가 없다. 결과로 HARN-44 artifacts에 '커밋 예정(PR 동반)'이 남고 실제 PR #965는 대장에서 추적 불가다. HARN-52가 남긴 교훈의 재현 — '고칠 수 없는 위반을 지적하는 게이트는 사람이 게이트를 끄게 만든다'(그때는 --depends 부재, 이번은 --artifact 부재). CLAUDE.md '거부의 우회 금지' 처리 순서 3(CLI 경로 자체가 없는 설계 공백이면 태스크 등재·HARN-06 선례)에 따라 등재하며 대장을 손편집하지 않았다. HARN-56은 원격 인플라이트(claude/status-uh55gf·merge-queue-adoption)와 충돌해 CLI 제안 번호 57을 채택.\n\n[정정 2026-09-03] HARN-62 흡수 — CLI 의미 중복 고지 수용. amend 결측 필드(--artifact·--path)는 한 문제이며 같은 파일을 소유한다\n\n[정정 2026-09-03] title 축 추가 — amend 결측 필드 계열(--artifact·--path·--title)의 세 번째. title은 브리핑·next의 유일한 노출 문자열이라 오정보의 전파 경로가 가장 짧다"
