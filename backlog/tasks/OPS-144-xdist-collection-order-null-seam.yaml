acceptance:
  - "① 원인 확정과 재현 고정 — tests/backend/db/test_to_schema_null_seam.py 의 _mismatches() 가 Base.registry.mappers 를 순회해 parametrize 목록을 만든다. SQLAlchemy 2.0.54 에서 registry.mappers 는 frozenset[Mapper] 라(소스 확인) 순회 순서가 객체 주소 해시에 의존하고, 그래서 ids 순서가 프로세스마다 달라진다. 실측(2026-10-14): 순수 origin/main 복제본(PYTHONPATH 를 그 복제본으로 고정)에서 pytest -n 4 -p no:randomly 로 이 파일만 돌리면 3/3 회 수집 단계 오류(gw 간 'Different tests were collected'). 단일 프로세스는 PYTHONHASHSEED 1~4 에서 26건으로 안정이라 단일 프로세스 실행으로는 보이지 않는다. 수정 전에 이 재현 명령과 실패 줄을 notes 에 남긴다."
  - "② 수정 — 파라미터 목록을 결정적 순서로 고정한다(예: ORM 클래스명·컬럼명 기준 정렬). 같은 수정이 이 파일 하나로 끝나는지, registry.mappers 를 순회해 테스트를 만드는 다른 모듈이 있는지 전수 확인해 같은 PR 에서 함께 고친다."
  - "③ 전수 탐지 장치(수정과 별항) — 이 유형은 한 파일의 실수가 아니다. 같은 세션(P3-26)에서 랜덤 UUID 를 parametrize id 에 쓴 테스트도 같은 오류를 냈다. tests/backend 전체에서 parametrize 의 값·ids 가 set/frozenset/registry 순회 또는 uuid4 같은 비결정 원천에서 나오는 모듈을 AST 로 전수 탐지하는 거버넌스 테스트(또는 수집 일치 점검)를 만든다. 스캔 0건이면 실패로 판정한다(공허한 통과 금지)."
  - "④ 변별력 — 수정 전 상태에서 ① 의 재현 명령이 RED, 수정 후 GREEN 임을 보인다. 정렬을 제거하는 뮤테이션을 주입해 ③ 의 탐지기가 RED 를 내는지 확인하고, 주입이 실제로 적용됐는지(mutated != original)와 바이트 동일 복원을 단언한다. 단일 프로세스 실행만으로 통과를 선언하지 않는다 — 반드시 -n 2 이상."
  - "⑤ 미규명 사항 — 왜 CI 는 이 실패를 내지 않았는가. CI backend 잡은 pytest -n auto --dist loadfile 로 도는데 같은 파일이 통과해 왔다. 워커 수·수집 시점의 임포트 순서·mapper 등록 시점 중 무엇이 순서를 우연히 같게 만드는지 실측해 기록한다. 규명 전까지 CI 통과를 이 파일의 안전 근거로 쓰지 않는다. 같은 조건(-n auto --dist loadfile)에서 재현되는지도 함께 확인한다."
  - "⑥ 배선 확인(정본화와 별항) — ③ 의 탐지 장치가 CI backend 잡에서 실제로 실행되는지 잡의 스텝 목록으로 확인하고, 그 확인을 완료 증적에 남긴다. 저장소에 존재하는 것과 CI 에서 도는 것은 다르다."
