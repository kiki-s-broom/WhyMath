  범위 한계(정직): 원인은 소스로 확인한 사실(registry.mappers = frozenset)과 재현 실측까지다. CI 가 왜 통과해 왔는지는 규명하지 못했다(acceptance ⑤). 우선순위를 P2 로 둔 것은 단일 프로세스·CI 현행 설정에서는 통과하고 12월 검증 판정 경로에 닿지 않기 때문이며, ⑤ 에서 CI 재현이 되면 P1 로 올린다.
