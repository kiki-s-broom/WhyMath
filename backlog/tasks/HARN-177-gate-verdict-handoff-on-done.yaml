acceptance:
  - "① 판정 인계의 집행 지점 — pending decision 게이트의 입력 태스크를 backlog.py done 할 때, 그 게이트에 대한 판정 결과를 같은 호출에서 남기게 한다. 선택지는 셋이다: FAIL(미충족 항목의 미종결 소유 태스크 1건 이상 — gates amend --verdict FAIL 과 같은 함수로 기록) · PASS(판정문 근거 기록 — clear 는 여전히 게이트 담당자 몫) · 판정과 무관한 입력(사유 필수). 셋 중 아무것도 없으면 exit 1 이고 대장에 아무것도 쓰지 않는다. 판정 결과는 태스크 증적이 아니라 게이트 corrections 에 남아야 한다 — 증적에만 있으면 그래프가 읽지 못한다.\n\n② 표시 정직성 — pending decision 게이트의 입력이 전부 done 인데 그 이후 판정 기록(FAIL 또는 PASS)이 없으면, next·status·gates show 가 '(사람 판정 대기)' 대신 '판정 결과 미기록'을 낸다. 판정이 기록되지 않은 상태를 사람 차례로 안내하지 않는다.\n\n③ 재현 픽스처 — 2026-09-25 실측 상태를 그대로 쓴다: 게이트 입력(재판정 태스크)이 FAIL 판정문과 함께 done 이 되고 후속 재판정 태스크가 게이트에 연결되지 않은 상태. ①은 그 done 을 거부해야 하고 ②는 경고를 내야 한다. 정상 인계(FAIL + 소유 태스크 연결) 대조군은 GREEN 이어야 한다.\n\n④ 변별력 — 절마다(① 세 선택지와 무선택 거부 · ② 경고 조건) 그 절이 없으면 통과하는 반례를 두고 뮤테이션 전건 RED 를 확인한다. 주입 적용 단언(mutated != original)과 원복 바이트 동일 단언을 하네스에 내장한다(verify_gate_graph_discrimination.py 선례).\n\n⑤ 한계 명시 — 이 집행은 판정 태스크가 done 을 거칠 때만 작동한다. 판정문만 쓰고 태스크를 닫지 않거나, 대장 밖에서 판정한 경우는 막지 못한다. 이 한계를 docs/standards/build_harness.md §3e 와 done 도움말에 적는다."
  - "⑥ [추가 2026-09-26 · 판정 기준 main b8af6f26] 이미 붙은 소유 태스크로 FAIL 을 기록하는 경로 — HARN-174 v2-8 은 FAIL 기록에 미종결 소유 태스크를 1건 이상 '새로' 붙이기를 요구한다. 그래서 사람이 먼저 입력을 재지정한 게이트(2026-09-25 #1321 이 진입 게이트에 한 것)에는 FAIL 판정을 기계 판독 형식으로 남길 방법이 없다. 소유 태스크가 이미 게이트 상류(입력의 선행 폐포)에 있으면 새 부착 없이 FAIL 을 기록할 수 있게 하되, 상류에 소유 태스크가 하나도 없으면 여전히 거부한다(사고 3 방지 축은 유지). ①의 done 인계도 이 경로를 쓴다. 반례 픽스처: 소유 태스크가 이미 입력인 게이트에 FAIL 기록 → 통과, 상류에 미종결 태스크가 없는 게이트에 FAIL 기록 → 거부."
