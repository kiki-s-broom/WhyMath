acceptance:
  - "① 재현 — task.session 이 null 인 blocked 태스크를 다른 브랜치에서 `unblock` 했을 때 원격 홀드가 남는 것을 테스트로 고정한다(현재: `_release_remote_claim` 이 prev_session or current_branch 를 넘겨 홀더 브랜치와 불일치 → release 가 force 필수 error → best-effort 경고만 남고 로컬만 todo 가 된다).\n② 정본 경로 신설 — 차단 홀드는 착수 점유가 아니므로, 차단 사유가 해소됐을 때 홀더가 아닌 세션도 정상 경로로 걷을 수 있어야 한다. `unblock` 이 원격 홀드의 실제 홀더 브랜치를 읽어 kind == block 인 레코드에 한해 해제하도록 고친다(kind == claim 은 지금처럼 force 필수 유지 — 착수 점유 탈취는 계속 막는다).\n③ 실패 주입 — 홀더 브랜치가 살아 있는 경우·이미 머지된 경우·원격 조회 실패(offline/error) 3종을 주입해 각각 RED 를 확인한다. 특히 offline 을 \"홀드 없음\"으로 읽지 않는지(list_claims 상태 무시 금지) 단언한다.\n④ 침묵 금지 — 해제에 실패하면 현재는 stderr 경고 1줄 뒤 로컬만 todo 로 바뀌어, 대장이 blocked 인데 로컬은 todo 인 분기 상태가 무증상으로 남는다. 실패 시 로컬 전이도 되돌리거나(또는) 분기 상태를 status 화면이 드러내게 한다.\n⑤ 배선 확인 — 신규 테스트가 CI 에서 실제로 실행되는지 확인한 뒤 완료로 친다(tests/harness 잡 소속 명시)."
  - "[계보 정정 2026-09-22 — CI 의미 중복 가드가 잡았다] 이 태스크는 **HARN-48-block-remote-hold-publication(done)의 승계**다. HARN-48 acceptance ④ \"unblock이 홀드를 해제 — 안 걷으면 해제된 태스크가 영구 차단으로 보인다\"가 정확히 이 축인데, 구현이 **같은 세션이 unblock하는 경로만** 덮었다: cmd_unblock 은 _release_remote_claim 에 task.session 을 넘기고 cmd_block 이 그것을 비우므로 항상 current_branch 로 폴백한다 — 차단을 건 세션이 그대로 살아 있을 때만 브랜치가 일치한다. 차단 사유가 대부분 외부 입력 대기여서 **해소는 거의 항상 다음 세션이 한다**는 점을 고려하면, ④가 실제로 보호하는 경우가 오히려 드문 쪽이다. 즉 done 태스크의 미이행 acceptance이며, CLAUDE.md 회수 규칙(VIZ-03 → VIZ-07 선례)에 따라 승계 태스크로 분리한다. HARN-48 을 되살리지 않는다.\n등재 경위(중복 실측의 실패와 그 원인): 내 1차 중복 검색은 HARN-42·HARN-45만 찾고 HARN-48을 놓쳤다. backlog.py add 의 의미 중복 고지도 침묵했는데, 그 pool 이 status in (todo, in_progress, blocked, review) 로 한정돼 **done 태스크를 구조적으로 보지 않기 때문**이다. 고지의 원 목적(병렬 이중 구현 방지)에는 맞는 필터지만, **미이행 acceptance를 남긴 done 태스크의 승계** 축은 그 사각에 그대로 들어간다. 잡아낸 것은 tests/harness/test_semantic_duplicate_notice.py 의 실코퍼스 보정 테스트였다 — 등재 시점이 아니라 CI 에서.\n추가 축 ⑥ — 위 사각의 처분을 이 태스크가 함께 판정한다: ⓐ 고지 pool 에 done 을 포함하되 \"완료됨\" 라벨을 붙여 구분해 낼지 ⓑ 별도 축(미이행 acceptance 승계 탐지)으로 둘지 ⓒ 현행 유지가 옳은지. ⓒ를 고르면 그 근거를 코드 주석으로 고정한다 — 판정 없이 두면 다음 세션이 같은 자리에서 같은 것을 놓친다."
  - "[수동 해제 절차 문서화 2026-09-22 · 본 수정과 별개] 이 결함이 고쳐지기 전까지의 유일한 해제 수단을 docs/standards/build_harness.md §3b-4 에 정본으로 넣었다 — 증상·원인 코드 지점·`--force` 가 탈취가 아닌 청소가 되는 3조건(①차단 사유 해소를 사람이 판정 ②홀더 세션 종료 실측 ③타 세션 진행 중 claim 부재)·자가거부 쓰기 블록·실측 함정 3종(git fetch 가 작업 트리를 안 바꾼다 / cp949 표시 깨짐 / 로컬 unblock 선행 시 분기 상태). 채팅에만 두면 다음 세션이 같은 벽에서 같은 시간을 쓴다.\n주의 — 이 문서화는 **완화이지 해소가 아니다**. 절차가 사람 왕복 1회를 계속 요구하므로 acceptance ①~⑥ 은 그대로 미이행이며, 이 태스크를 done 으로 볼 근거가 되지 않는다. 수정이 착지하면 §3b-4 는 \"과거에 이랬다\"로 축약하거나 삭제한다."
