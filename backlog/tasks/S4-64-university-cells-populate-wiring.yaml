  - "`l1/curriculum/populate.py` 적재 CLI가 `atom_graph_v1` graph.json 경로(신규 `--atom-graph` 인자, 기본 `data/corpus/atom_graph_v1/graph.json`)를 받아 `load_kr_curriculum_entries_for_university_atoms` 결과를 canonical·원자 목록과 합쳐 `populate_kr_curriculum_entries`로 멱등 적재한다 — 호출처가 src에 1건 이상 존재함을 소스 스캔 테스트로 동결(현재 0건: S4-62가 함수만 추가했고 populate.py:82-83은 graph.json+crosswalk.jsonl만 읽는다. 이 상태에서는 대학 셀이 curriculum_entry에 영원히 들어가지 않는다)\nCLI 보고 줄에 대학 셀 건수를 canonical·원자와 별도로 출력하고(조용한 무동작 금지), 파일 부재 시 기존 규약대로 return 2. 건수는 S4-62 실측 기준 grade_band가 채워진 대학 원자 512건(전체 대학 원자 1,069건)을 기대값으로 하되, 구현 시점 코퍼스로 재실측해 테스트에 박는다\n대학 required_depth 정책 결정: S4-62는 원본 커밋(40597d5c)을 따라 대학 원자 전건을 mastery로 고정했으나 docs/strategy/grade_axis_mvp_shortest_path_v1.md §3 W0 S-1은 과목 성격별 차등을 요구한다 — 둘이 어긋난다. 고정 유지 / 과목별 차등 중 하나를 Kiki가 결정하고 그 결정을 로더 상수 주석과 전략 문서 양쪽에 반영한다(결정 전 구현 착수 금지)\n실 PG 적재는 prod 쓰기이므로 Kiki 실행 단계는 사전 브리핑 6항목과 쓰기 블록 자가거부 가드를 갖춘 런북으로 분리하고, 이 태스크의 완료 증적에는 적재 전후 curriculum_entry 대학 셀 건수(introduced_grade 13~16)를 실측으로 남긴다"
  - "Polya 학년 register의 대학 채널 확정: S4-62는 UserProfile.grade 계약(ge=10 le=14, 13~14=N수1·2)을 따라 l4/polya/prompts.py의 _GRADE_BAND_RANGES를 10~14=고등학생·15~16=대학생으로 두었다. 로더 관례(대학 1~4학년=introduced_grade 13~16)와 13~14에서 번호가 겹쳐 대학 1~2학년은 이 정수 채널로 표현할 수 없다 — 대학 축을 실제로 연결할 때 호출자가 넘기는 입력을 모호하지 않게 정한다(예: school_level 기반 별도 인자 또는 grade 계약 확장). 정하기 전에는 대학 호출자를 base_system_for_grade에 연결하지 않으며, test_matches_grade_to_band_ladder_for_every_user_profile_grade가 사다리 이탈을 막는다"
  - "[정정 2026-10-09 · Kiki 결정] 위 acceptance의 두 번째 묶음(\"Polya 학년 register의 대학 채널 확정\")은 폐기한다. 결정: Polya 4단계 틀은 학부생(대학 과정)에 적용하지 않는다 — 학부생은 이미 문제풀이 초보 단계를 넘었고(전문가 역전 효과) 3단계 전이 판정이 등호·결론어를 요구해 증명형 문제에서 막힌다. 따라서 대학 호출자를 base_system_for_grade·PolyaCoach.decide의 grade 채널에 연결하지 않으며, l4/polya/prompts.py의 _GRADE_BAND_RANGES 15~16(대학생) 칸은 연결 대상이 아니라 폐기 후보다(제거 여부는 대학 코칭 모드 설계 태스크가 판정). 대학 코칭은 별도 모드(정답 미루기·소크라테스 우선·메타인지·정서 안전 원칙 유지, 4단계 틀은 막혔을 때만)로 설계한다 — 후속 태스크 PED-CU-... 참조. 이 정정은 첫 묶음(populate 배선·건수 보고·required_depth 정책 결정·실 PG 적재 런북)에는 영향이 없다: 대학 required_depth 정책(mastery 고정 유지 vs 과목별 차등)은 여전히 Kiki 결정 대기이며 결정 전 구현 착수 금지다."
  - "[포인터] 위 정정문이 가리키는 후속 태스크 = PED-47-undergrad-coaching-mode-without-polya-ladder (대학 코칭 모드 설계)."
  - "[결정 2026-10-09 · Kiki] 대학 required_depth 정책 = C안(cognitive_type 기반). 고정 mastery(S4-62 원본 커밋 40597d5c 방식)는 폐기하고, 대학 원자(세부개념·grade_band 보유 512건)의 graph.json cognitive_type에서 도출한다: 절차→procedural, 개념→conceptual, 표상→None(정직 폴백 — RequiredDepth 4단계에 표상 칸이 없다). mastery는 대학 셀에서 당분간 쓰지 않는다(숙달 요구를 표현할 근거 데이터가 없고 학년 승격은 지어내기에 가깝다). 구현 완료 조건: ①로더 상수 _UNIV_REQUIRED_DEPTH 고정 mastery를 원자별 cognitive_type 도출 함수로 교체하고 주석에 '임시 휴리스틱·인지 수준 원문 주석 확보 시 대체' 및 이 결정을 명기 ②기대 분포를 구현 시점 코퍼스로 재실측해 테스트에 박는다(512건 중 개념/절차/표상 건수와 required_depth None 건수 = 표상 건수, mastery 0건) ③docs/strategy/grade_axis_mvp_shortest_path_v1.md §3 W0 S-1 해소 문구를 '과목 성격별'에서 'cognitive_type 기반(원자 단위)'으로 갱신하고 결정 일자를 남긴다 ④cognitive_type 라벨의 출처(작성자·검수 여부)를 코퍼스 문서에서 확인해 결과를 PR에 적는다(미확인이면 '미확인'으로 명기). 변별: 표상 원자가 None을 유지하는지, 절차 원자가 conceptual로 오도출되는지 주입으로 RED 확인."
