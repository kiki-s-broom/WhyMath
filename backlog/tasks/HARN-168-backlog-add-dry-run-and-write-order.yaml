acceptance:
  - "① `backlog.py add --dry-run` — 번호 충돌 검사·파일 범위 겹침·의미 중복 후보·EOS 우선순위 검사를 전부 실행하되 **태스크 파일과 이벤트를 하나도 쓰지 않는다**. 출력 마지막 줄에 \"쓰기 0건(dry-run)\"을 낸다. 테스트: dry-run 전후로 `backlog/tasks/`·`backlog/events/`의 파일 목록과 바이트가 동일함을 단언한다(실패 주입: dry-run 분기를 지우면 RED).\n② 쓰기 순서 — 경고 이벤트(`policy_warn`)를 태스크 파일보다 먼저 쓰는 현행 순서에서, 프로세스가 중간에 죽으면(2026-09-24 실측: stdout을 `| head -3`으로 받아 BrokenPipe로 exit 1) **태스크 파일은 없고 경고 이벤트만 남는 반쪽 쓰기**가 된다. 검사를 전부 끝낸 뒤 태스크 파일 → 이벤트 순으로 쓰거나, 이벤트를 모아 두었다가 태스크 파일 쓰기 성공 뒤 한 번에 쓴다. 테스트: stdout 쓰기 도중 BrokenPipeError를 주입했을 때 \"태스크 파일 없음 + 이벤트 없음\" 또는 \"둘 다 있음\" 중 하나만 성립함을 단언한다.\n③ BrokenPipe를 판정 불가로 표시 — stdout이 닫혀 종료할 때 exit 1(일반 실패와 같은 코드)이 아니라 별도 코드와 stderr 한 줄(\"출력이 잘려 중단됨 — 쓰기 상태: …\")을 낸다. 잘린 출력을 \"거부됨\"으로 오독하지 않게 하기 위해서다."
