notes: "출처: 2026-09-24 MP-02 재회차 세션(claude/wizardly-allen-bqgujn)에서 CI 재현으로 tests/harness를 두 번 돌렸는데 두 번 다 세션 이벤트 대장에 가짜 policy_warn 7줄이 생겼다(scope_drift 4 · path_overlap 3 — 파일 scripts/harness/backlog.py·README.md). 줄 수가 TestCheckEditHook의 호출 구성과 정확히 일치한다: backlog.py 경로 3회 × (scope_drift+path_overlap) + README.md 1회 × scope_drift. 원인: 이 테스트가 monkeypatch.chdir(REPO_ROOT) 후 실제 check-edit를 호출하므로, 실행 세션에 claim이 있으면 조율 정책 검사가 실제로 발화해 실제 대장에 쓴다. 피해: 커밋하면 대장에 거짓 경고가 남는다 — 이번에는 두 번 다 커밋 전에 발견해 되돌렸다(백업 보존). claim 없는 CI 러너에서는 증상이 없어 CI가 구조적으로 못 잡는다.\n\n[정정 2026-09-25] 2026-09-25 재발(이 세션 · claude/adoring-bohr-54tyhd) — ci_mirror로 harness-integrity를 재현하자 세션 샤드에 가짜 path_overlap 3줄(23:10:51·53·57, file=scripts/harness/backlog.py)이 생겼고, 세션 종료 훅이 그것을 커밋하라고 요구했다. 커밋본과 바이트 대조로 3줄만 제거했다. claim 없는 세션이었으므로 발생 조건을 넓히고, 이미 커밋된 오염 규모를 실측해 acceptance ④⑤로 덧붙인다. 이 shallow 클론의 git log -S는 TestCheckEditHook 도입을 2026-09-22로 보이지만 서명 묶음은 09-07부터 있다 — 같은 형태의 다른 테스트가 있거나 이력이 잘렸다(미판정 · ① 전수 확인 범위).\n\n[정정 2026-09-28] 3회차 재발 실측 + 분리 워크트리 우회법 실측(이벤트 0줄)\n\n[정정 2026-09-29] HARN-115 CI 미러 중 실측 — ③이 이름으로 적은 테스트 외에 같은 형태(실제 jit 인덱스 덮어쓰기 후 복원)의 테스트가 하나 더 있다"
