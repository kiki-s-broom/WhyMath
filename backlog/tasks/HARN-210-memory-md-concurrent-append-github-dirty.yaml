title: "MEMORY.md 동시 append가 GitHub 서버 병합에서 충돌(dirty)로 보인다 — 결정 로그를 덧붙인 PR이 main 착지마다 충돌·CI 런 0건 (이벤트 HARN-46 · 사고 대장 HARN-130 동형 3회차)"
