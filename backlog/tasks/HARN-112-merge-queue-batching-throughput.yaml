acceptance:
  - "① 현행 처리량 실측 고정 — 큐를 켠 뒤의 실제 회전 시간을 잰다(예측 금지). 실측 표본 1건(2026-09-18 · 이 태스크 등재 세션): PR #1196이 09:35:33Z 큐 진입 → 10:24:35Z 머지 = 49분. 그중 앞 순번 PR #1195 대기가 약 25분이고, 자기 차례의 큐 실행(`gh-readonly-queue/main/pr-1196-4643a314`)이 약 24분이다. 표본 1건은 근거로 약하므로 착수 세션이 `merge_group` 이벤트 실행 N건(최소 10)의 `run_started_at`→`updated_at`으로 중앙값을 낸다. 재현 도구는 `scripts/analysis/measure_merge_gate_latency.py`가 strict 정책 시절 것이라 큐 체제에 그대로 맞지 않는다 — 맞추거나 별도 산출기를 만든다.\n② 분모 실측 — 같은 구간의 PR 착지 요구량을 잰다. 큐 처리량(시간당 머지 건수)과 PR 생산 속도(병렬 세션이 PR을 여는 속도)를 나란히 놓아야 \"느리다\"가 체감이 아니라 수치가 된다. 2026-09-18 브리핑 기준 병렬 세션 8곳이 태스크를 claim 중이었다. 생산 < 처리면 이 태스크는 그 시점에 불필요하므로 **착수하지 않고 닫는다** — 측정이 도입을 부정하는 경우를 미리 열어 둔다.\n③ 일괄 처리(batching) 설정 판정 — GitHub 머지 큐의 묶음 크기 관련 설정이 이 저장소·이 조직 플랜에서 **실제로 제공되는지** 룰셋 화면 또는 라이브 룰셋 조회로 확인한다. 부재가 \"미설정\"인지 \"미제공\"인지 구분하기 전에는 도입을 결정으로 올리지 않는다(CLAUDE.md v0.2.18 「설정 부재를 설정 가능으로 단정 금지」 — 이 규칙의 사고 경위가 정확히 merge queue였다). 미제공이면 그 사실을 `.github/branch-protection-setup.md`에 근거와 함께 남기고 ④로 가지 않는다.\n④ 적용 — 제공되면 묶음 크기를 ①②의 수치가 지지하는 값으로 설정한다. 룰셋 변경은 저장소 관리자 권한이라 세션이 직접 할 수 없다 — Kiki 실행 명령 블록을 CLAUDE.md 「Kiki 직접 수행 과제의 사전 브리핑 템플릿」 6항목에 맞춰 동봉한다(자리표시자 0개 · 실행 블록과 증거 블록 분리).\n⑤ 변별력 양방향 — 적용 후만 재고 통과를 선언하지 않는다. ①의 지표를 적용 전후 같은 방법으로 재고 대조한다. 또한 묶음이 **실제로 묶였는지**를 큐 실행의 PR 수로 확인한다: 묶음 크기를 올렸는데 매 실행이 여전히 PR 1건이면 설정이 안 먹은 것이지 효과가 없는 것이 아니다 — 둘을 구분하지 못하면 판정이 위장이 된다.\n⑥ 실패 경로 — 묶음 안의 PR 하나가 red면 묶음 전체가 어떻게 되는지(전량 축출인지 이등분 재시도인지) 확인해 런북에 적는다. 묶음이 클수록 한 건의 실패가 무고한 PR을 함께 되돌리므로, 그 비용이 ①의 이득을 넘지 않는 크기여야 한다.\n⑦ 경계 별항(중복 소유 회피) — HARN-56은 큐 **도입**(켜기·체크 집합 일치·축출 경로)을 소유하고 in_progress다. HARN-98은 큐를 **감시 축에 편입**(ruleset_drift.py)한 것으로 done이다. HARN-32는 strict 정책 시절의 **경합 원인 규명**으로 done이며 그 완화책으로 merge queue를 명시적으로 채택하지 않았다(⑨). 이 태스크는 그 셋 중 어디에도 없는 **처리량(묶음 크기)** 축만 본다. 착수 시 세 태스크의 현재 상태를 다시 읽어 경계를 재확인한다."
