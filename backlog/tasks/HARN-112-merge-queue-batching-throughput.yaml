notes: "발견 경위(2026-09-18 · EOS-18/PR #1196 머지 과정 실측): Kiki가 \"오케스트레이션 설정이 이렇게 더딘 것인지\" 물어 원인을 나눠 측정한 데서 나왔다. 구간별 실측 — 착수→PR 생성 50분(08:19Z→09:09Z, 조사·구현·전체 스위트 1회 13분·뮤테이션 8종 포함) / PR CI 20분(`backend — lint·type·test` 18분 34초가 지배) / 큐 진입→머지 49분. 즉 **green 확인 이후의 대기가 작업 시간과 맞먹는다**.\n\n병목은 에이전트 쪽이 아니라 큐의 직렬성이다. 큐는 PR을 한 건씩 최신 main 위에 리베이스해 CI를 처음부터 다시 돌리므로 회전당 약 24분이고, 상한이 시간당 약 2.5건이다. 병렬 세션이 그보다 빨리 PR을 만들면 대기열은 구조적으로 길어진다 — 확률이 아니라 구조(HARN-32 notes의 같은 표현).\n\n[등재 전 중복 확인] 역할 기준 검색으로 `merge_group`·`group_size`·`batch size`·`min_entries`·`merge_limit`·`maximum pull requests`·`일괄 처리`·`처리량`을 backlog/·docs/·scripts/·.github/ 전역에 걸었다. 일치 2건은 전부 무관이었다(SEC-04의 `batch_size`는 백필 CLI, integration_flow_gap_review는 브랜치 충돌 일괄 처리). 즉 **묶음 크기 축은 이 저장소에 미등재**다.\n\n[범위 밖] 큐 전용 축약 CI(`merge_group` 이벤트에서 정적 검사 생략)는 이 태스크가 다루지 않는다 — 검증 표면을 줄이는 방향이라 이 저장소의 규율과 충돌하고, 큐 체크 집합은 HARN-56 acceptance ②가 이미 소유한다. 잡 소요 단축은 별건(OPS-58 후속 축)이다."
