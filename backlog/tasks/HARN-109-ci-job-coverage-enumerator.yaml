acceptance:
  - "① 잡 전수 열거 — .github/workflows/ci.yml의 잡 이름을 파싱해 전량 내놓는 도구를 만든다. 열거 0건이면 통과가 아니라 exit 1이다(스캔 0건은 실패 — CLAUDE.md 2026-09-01 축 ④). 파싱 대상이 YAML이므로 정규식이 아니라 yaml.safe_load로 읽는다.\n② 변경 대상 잡 판정 — 이번 변경(git diff 경로)이 닿는 잡을 계산해 낸다. ci.yml의 changes 잡(path filter)이 이미 그 매핑을 갖고 있으면 그것을 정본으로 읽고, 없는 잡은 \"판정 불가\"로 내놓는다 — 조용히 \"안 닿음\"으로 접지 않는다(모른다 != 아니다).\n③ 로컬 재현 커버리지 대조 — 세션이 실제로 돌린 잡 집합과 ②의 결과를 대조해, 빠진 잡을 이름으로 지목한다. 이 도구의 출력이 곧 \"내가 무엇을 안 봤는가\"의 답이어야 한다.\n④ 변별력 주입 검증 — 잡을 하나 빼고 돌렸을 때 실제로 그 잡을 지목하는지 주입으로 확인한다(정상 입력에서 초록인 것은 증거가 아니다). 주입이 실제 적용됐는지(mutated != original)도 단언한다.\n⑤ 잡 경계의 환경 차 이관 — 잡마다 working-directory와 설치 패키지가 다르다는 사실을 도구가 함께 내놓는다(backend 잡은 src/backend에서 전체 의존성, infra-contracts는 레포 루트에서 7종만). 이것을 안 내놓으면 사람이 재현 스크립트를 짜다가 같은 자리에서 또 틀린다.\n⑥ 범위 명시 — 이 태스크는 *열거와 대조*만 한다. 잡을 대신 실행해 주는 러너는 만들지 않는다(로컬에서 재현 불가한 잡 — docker-build 등 — 이 있고, 그것을 \"실행했다\"로 위장하는 것이 더 나쁘다). 재현 불가 잡은 \"재현 불가\"로 명시 출력한다."
