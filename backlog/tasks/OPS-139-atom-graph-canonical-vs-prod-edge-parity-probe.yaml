notes: |-
  2026-10-13 Kiki 지시로 등재(S4-60 후속). 계기: S4-60(PR #1558)이 정본 graph.json 엣지를 2,210에서 2,234로 늘렸지만 prod DB(whymath-pg)는 별도 적재 동작이 있을 때까지 2,210에 머물렀다. 그 어긋남은 감시 장치가 아니라 PR 본문의 정직한 공백 항목과 Kiki의 수작업 count 쿼리로만 드러났다. 같은 계열의 선례: SKB-03 — atom_node 적재 구현이 어떤 CLI에서도 호출되지 않아 prod에 한 번도 적재된 적이 없었고, 빈 테이블이 정상 동작처럼 보였다. 정본과 DB는 서로 다른 시점에 바뀌는 두 진실이라 어긋남은 구조적으로 재발한다(S4-61의 129건 병합이 다음 후보).
  무엇이 이미 있고 무엇이 없는가(실측): 스키마 쪽은 scripts/ops/probe_prod_schema_revision.sql(읽기 전용 프로브)과 ops/db_host_reachability(도달성 3신호)가 있다. 데이터 쪽 — 정본 엣지 수 대 DB 엣지 수 대조 — 는 내가 찾은 방법(backlog 전수 grep: 패리티·정본↔DB·canonical drift 등, scripts/ops 목록)으로는 0건이다. 인접 태스크 HARN-216은 오개념 crosslink 적재의 canonical 뒤집힘 판정이라 대상이 다르다(원자 백본 엣지가 아님).
  eos_priority를 P1로 둔 이유: 우회는 가능하나(수작업 count) 우회가 사람의 기억에 의존하고, 정본이 바뀔 때마다 prod 서빙 그래프와 어긋날 수 있다. 과대하다고 판단되면 amend --eos-priority로 P2로 내리면 된다.
  주의: 이 세션은 prod DB에 접속할 수 없다(Kiki 머신 전용) — 구현은 순수 판정 함수와 단위 테스트까지이고 실측 실행은 Kiki 런북으로 넘긴다.

