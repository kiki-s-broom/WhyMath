# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: OPS-139-atom-graph-canonical-vs-prod-edge-parity-probe
title: "원자 백본 정본(graph.json)과 prod DB(concept_edge) 엣지 수·분포 불일치를 읽기 전용으로 판정하는 프로브 — S4-60 병합 뒤 prod가 2,210건에 머문 어긋남이 감시가 아니라 사람의 수작업 count로만 드러났다"
