acceptance:
  - "① 지문 기록 — 검수 CLI(harness/review_session)가 started·finished 이벤트에 검수자에게 보인 CU 내용의 지문(sha256)을 싣는다. 정규화 규칙(어느 키를 넣고 뺄지 — review_status 등 운영 메타 제외)을 한 함수로 정본화하고, 스키마(schema/review_timer)는 선택 필드로 받아 하위호환을 지킨다. 지문 없는 옛 이벤트는 '모름'이지 '일치'가 아니다."
  - "② 각인 집행 — 사람 판정 각인 도구(review_status_verdict_bridge)가 최신 종결 판정의 지문과 코퍼스 현재 내용의 지문을 대조해, 다르면 각인하지 않고 별도 버킷(검수 후 내용 변경)으로 보고한다. 지문 없는 판정의 처리(보류 vs 현행 유지)를 판정 문서로 남기고 테스트로 동결한다."
  - "③ 게이트 집행 — 골든 승격 게이트가 승격 제안의 현재 내용 지문과 최신 사람 판정 지문을 대조한다(불일치 = 경로 밖·별도 사유). 음성 대조: 승인 → 내용 손편집 → 승격 제안이 차단된다(실 파이프라인 관통 E2E)."
  - "④ 손질 승인 해금 판정 — 검수 도구가 손질 후 내용의 지문까지 기록할 수 있으면 approved_with_edit를 재검수 없이 각인할 수 있는지 판정한다(현행 EOS-136은 재검수 필수로 보류). 판정 결과와 근거를 docs/standards/review_status_stamping_contract.md에 반영한다."
