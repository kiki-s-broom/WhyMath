title: "검수 후 내용 편집 미탐지 — 검수 이벤트에 검수자가 본 CU 내용 지문이 없어, 승인 뒤 문항 내용을 손으로 고쳐도 각인 도구·승격 게이트가 통과시킨다 (EOS-136 계약 §8 한계)"
