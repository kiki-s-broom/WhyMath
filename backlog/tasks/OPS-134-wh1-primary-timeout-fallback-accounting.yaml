  - "① 시간 초과 턴의 소요 분해 실측 — primary 한 턴의 총 예산(wh1_primary_timeout_seconds 기본 15초)이 어디서 소진되는지 LLM 호출별 지연·모델 콜드 로드·캐시(Redis) 대기로 나눠 잰다. 2026-10-12 서버 stderr에 \"Redis 캐시 강등 — TimeoutError\"가 1건 있었으나 이것이 시간 초과의 원인인지는 검증되지 않았다(가설). Redis 미기동 환경과 기동 환경을 같은 합성 트래픽으로 대조한다.\n② 폴백 비율의 회계 — 시간 초과로 결정론 폴백한 턴은 현재 primary 기록 0줄이라 \"primary가 작동한 비율\"을 어디서도 읽을 수 없다(실측: 15요청 중 14턴이 시간 초과, 성공 1건 — 기록 파일은 1줄). 폴백 사유와 비율을 기록·집계하는 좌석을 만들고, 리포트가 작동한 비율을 말하게 한다.\n③ 표본 회계 정합 — 시간 초과 턴은 LLM 호출이 이미 serving 표지로 Langfuse에 전송된다(1차 45건·재시도 43건 = 요청당 약 3건) 즉 출력이 버려진 호출이 학생 대면 표본·비용 집계에 들어간다. 이것이 게이트② 로컬 비율 등 판정치를 어떻게 왜곡하는지 정량하고 처리 방침(표지 구분 또는 제외)을 결정한다.\n④ 타임아웃 기본값 재판정 — 15초가 로컬 모델 조건에서 적정한지 ①의 실측으로 판정하고, 바꾼다면 MEMORY 결정 로그에 근거를 남긴다. 판정 전까지 학생 대면 서빙 영향 범위(결정론 폴백으로 서빙은 계속되므로 장애가 아니라 품질 저하)를 notes에 명기한다."
  - "[분리 2026-10-14] 이 태스크의 이행 범위는 ②(폴백 결말 기록·채택률 리포트), ③(폐기 호출 비중 보고·처리 방침 결정), ①의 계측 재료(elapsed_ms·llm_ms_total·llm_calls·llm_calls_finished와 타임아웃 소요 분해 줄)까지다. ①의 라이브 실측(Redis 미기동/기동 대조)과 ④(15초 재판정)는 Phaiakes9 실측이 필요해 OPS-141-wh1-primary-timeout-live-decomposition으로 승계했다. 기본 타임아웃은 바꾸지 않았다. 승계 사유와 근거는 MEMORY 결정 로그(2026-10-14)에 있다."
