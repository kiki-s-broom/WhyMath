  - "① 실측: [12미적Ⅰ-02-03]~[12미적Ⅰ-02-10] 중 문항 0건 개념 7개(-02-03·-02-04·-02-05·-02-06·-02-08·-02-09·-02-10)를 misconceptions_v1 M-id에 연결하고(2026-09-30 정적 조사는 M0671~M0674·M0676~M0678로 보고 — 착수 시 재계수), 크로스워크(crosslinks.json) 승인 행이 있는지 개념별로 센다.\n② 적격성 판정: 개념별 M-id가 카탈로그 채택 기준(positive-signal형 — 학생의 잘못된 행동이 답·풀이에 드러나는 오개념)을 만족하는지 판정한다. omission형('빠뜨린다'·'못 쓴다'·'무시')은 채택 밖이다(misconception_diagnosis.md 기준 · 앵커 A5가 같은 이유로 보류된 선례). 부적격은 사유와 함께 문서에 남기고 kebab을 만들지 않는다 — 7건은 상한이지 목표가 아니다.\n③ doc-first: 적격분 kebab은 docs/prompts/misconception_diagnosis.md 상세화가 먼저이고 l4/misconception/catalog.py 신설이 그다음이다. 카탈로그 개수를 동결한 테스트(test_misconception_catalog.py의 len(CATALOG) 단언 등)와 연쇄 회귀를 함께 갱신한다(MISC-21 선례: 경로 14개).\n④ 검수 큐 전사: 신설 kebab의 kebab↔M-id 후보 행을 docs/data/misconception_crosslink_review_queue.json에 pending으로 옮긴다. 손으로 crosslinks.json에 행을 추가하지 않는다 — 승인·적재는 Kiki 서명 뒤 crosslink_review promote 경유다(crosswalk_gate_contract.md).\n⑤ MISC-21이 남긴 서명 전 3행(M0462·M0515·M0599)을 같은 서명 대상 목록에 넣어 게이트로 넘긴다(2026-09-30 조사 시점에 대장 추적이 없었다 — 착수 시 현황 재확인).\n⑥ 서명은 세션이 하지 않는다 — 승인 게이트 계약상 사람 전용이며 서명 위조는 도구가 못 잡는다. 서명 게이트에 서명 대상 표(kebab id·mis id·link_type·confidence·rationale + crosslink_review_aid 근거 리포트)를 붙여 Kiki가 한 번에 판정할 수 있게 한다.\n⑦ 완료 판정 — 적격성 판정표와 신설분이 main에 있고 검수 큐에 pending 행이 있으며 관련 테스트가 exit 0."
