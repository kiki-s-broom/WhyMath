  - "① 개념 원천 정본을 결정한다: graph.json(원천 파일)과 DB 중 어느 쪽이 정본이고 CMS 쓰기가 어느 쪽으로 가는가. 결정 없이 DB 엣지를 쓰면 다음 적재가 덮어쓴다.\n② prerequisite 관계 쓰기는 비순환(DAG) 검사(Reachability Check)를 통과해야만 한다 — 순환을 만드는 요청은 서버가 거부하고 주입으로 RED를 확인한다.\n③ 개념 신규 생성은 살아있는 concept 행을 직접 만들지 않고 버전 워크플로우(초안→검토→승인→발행)를 거친다. 삭제는 발행본이 있는 개념에 대해 거부한다.\n④ 화면: 개념 작업대에 신규 생성·관계 편집 패널을 더하고, 권한 없는 계정의 시도는 서버가 403으로 막음을 실 DB 종단 검증으로 확인한다."
