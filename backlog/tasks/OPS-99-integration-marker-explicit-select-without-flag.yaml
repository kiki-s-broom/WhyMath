acceptance:
  - "① 실측 — `tests/backend/conftest.py::pytest_collection_modifyitems`는 플래그가 없으면 integration 마커 테스트를 전부 skip으로 바꾼다. 사람이 `-m integration`으로 **명시 선택**했을 때도 같아서, 고른 테스트가 전부 skip이고 종료 코드는 0이다(2026-09-28 EOS-123 세션 실측: `2 skipped, 4 deselected` · exit 0). 판정을 종료 코드로 하는 규칙 아래에서 이 실행은 \"통과\"로 읽힌다."
  - "② 집행 — 마커 식이 integration을 양의 방향으로 고른 실행(`-m integration` · `-m \"integration and ...\"`)에서 플래그가 없으면 skip 대신 사용 오류(`pytest.UsageError` · exit 4)로 멈추고 켜는 방법을 출력한다. 마커 식이 없거나 `not integration`이면 현행 기본 skip을 유지한다(CI backend 잡의 전체 수집을 깨지 않는다). `tests/data_pipeline/conftest.py`도 같은 형태이므로 함께 처리한다."
  - "③ 변별력 — 네 경우를 서브프로세스 테스트로 동결한다: 명시 선택 + 플래그 없음 → exit 4 · 명시 선택 + 플래그 있음 → 실행 · 마커 식 없음 → 기존 skip(exit 0) · `-m \"not integration\"` → 영향 없음. 가드 제거 뮤테이션이 RED인지 확인한다(주입 실재 단언 포함)."
  - "④ 범위 밖 — CI 워크플로가 플래그를 켜는 방식(backend-migrations 잡의 env)은 그대로 둔다. CI 쪽 도달 동결은 EOS-21·EOS-142 소관이다."
