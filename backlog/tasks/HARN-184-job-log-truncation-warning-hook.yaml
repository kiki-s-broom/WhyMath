acceptance:
  - "① 실측 근거(2026-09-28 PR #1349): CI 실패 원인을 잡 로그 끝 120줄(원본 398줄)만 조회하고 PR 코멘트로 판정했다. 결론(PyPI 읽기 시간 초과)은 맞았지만 시간 초과 횟수를 \"5회\"로 잘못 적었고(실제 6회 — 마지막 시도는 재시도가 없어 경고 줄 없이 끝난다), 직전 성공 실행·같은 시각 다른 잡·재현 대조 없이 단정했다. Kiki가 \"다시 분석 검증해서 원인을 정확히 찾아줘\"로 재검증을 요청해 전체 로그·동시 잡 대조·로컬 재현으로 확정했다. 출력 절단 판정 계열(check-output-truncation)의 재관통이다 — 이번 입구는 사람이 쓴 `| tail`이 아니라 도구 인자(`tail_lines`)였다."
  - "② 집행 지점: `.claude/settings.json`에 PostToolUse 훅(matcher `mcp__github__get_job_logs`)을 둔다. 훅은 도구 응답의 `original_length`와 실제로 돌려받은 줄 수를 비교해, 적으면 \"잘린 로그(반환 N줄 / 원본 M줄) — 원인 판정 전 전체 조회(tail_lines ≥ M)\"를 모델 맥락에 주입한다. 잡 여러 개를 한 번에 받는 `failed_only` 모드는 응답 형태를 먼저 실측한 뒤 잡별로 같은 비교를 한다(형태를 확인하지 못하면 ③의 '판정 불가'로 처리)."
  - "③ 모른다 ≠ 아니다: 응답 JSON 파싱 실패·`original_length` 부재·URL만 돌려받은 경우(return_content=false)는 '잘리지 않음'으로 접지 않고 '절단 여부 판정 불가'를 주입한다. 훅 자신의 예외는 예외 타입명을 남기고 도구 사용은 막지 않는다(fail-open이되 침묵하지 않는다)."
  - "④ 변별력: 합성 훅 입력 픽스처로 — 절단(원본 398줄 중 120줄) → 경고, 전체(398줄 중 398줄) → 무경고(대조군), 경계(원본과 반환이 같음) → 무경고, 파싱 실패·필드 부재 → 판정 불가. 뮤테이션으로 비교 방향과 경계(=) 절의 반례를 밟고, 주입이 실제로 적용됐는지도 단언한다. 한계(명시): 훅은 경고만 주입할 뿐 판정을 강제하지 못한다 — 산문 규칙은 추가하지 않는다(2026-09-20 등재 동결)."
