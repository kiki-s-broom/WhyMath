notes: "2026-09-28 CONST-02 세션의 CI 원인 진단 사고(check-output-truncation 계열 재관통)의 재발 방지 대책으로 등재. 같은 계열의 기존 대책은 사람이 붙이는 `| tail`(2026-08-09 규칙)과 도구가 기본값으로 자르는 조회(2026-09-01 `backlog.py next` 분모 표기)였는데, 이번 입구는 MCP 도구 인자 `tail_lines`라 두 대책 모두 닿지 않았다. 응답에 `original_length`가 실려 오므로 절단 여부를 기계가 판정할 수 있다 — 판정 가능한 것을 사람 규율에 맡기지 않는다."
