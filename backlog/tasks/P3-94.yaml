acceptance:
  - "① 수집기(harness/ai_quality_live_collect.py)가 WH-1 primary에서 LLM이 생성한 초안 본문을 결말(채택·강등·폴백)과 무관하게 측정 전용 파일에 저장한다 — 학생 응답 경로·서빙 코드는 바꾸지 않는다(측정 전용 · 노출 0). 원문은 그 파일에만 두고 run.json에는 건수만. ② ai_quality_eval이 그 초안을 후보로 읽는 모드를 가진다. 문장 축 6개(수학적 정확성 · 정답 누설 · Hint 적절성 · 설명 일관성 · 학생 수준 적합성 · hallucination)를 LLM 초안 기준으로 판정하고, 결정론·경로 축 2개(오개념 판정 정확도 · Curriculum 범위 이탈)는 대상이 아님을 리포트에 표기한다(D16 해석 2026-11-01). ③ 초안이 0건이면 PASS가 아니라 '측정 불가'로 exit 비0 — 테스트로 동결(0건 공허 통과 금지). ④ Kiki PC 재수집 런북(6항목 브리핑 · worktree · HEAD 대조 · 쓰기 블록 자가거부)과 8축 리포트. ⑤ 리포트의 LLM 초안 분포는 D16 임계값 6개 확정의 입력이다 — 임계값 자체는 이 태스크가 정하지 않는다."
  - "⑥ [Kiki 2026-11-06 승인] 튜터 정책 좌석 비교 — 수집기에 측정 전용 좌석 선택(--policy-seat local-fast|local-mid|cloud-mid)을 둔다. 서빙 라우팅·학생 응답 경로는 바꾸지 않는다(측정 전용 · 수집기 프로세스 안에서만 적용). 후보 3개 = qwen2.5:3b(현행 LOCAL GENERAL FAST) · qwen2.5:7b(LOCAL GENERAL MID) · deepseek/deepseek-v4.1-flash(CLOUD_MID · openrouter 좌석). 클라우드 호출 비용 사용 승인. 본 수집 전에 같은 20사례로 3좌석 시험 수집을 하고, 리포트에 좌석별 결말 분포(채택·강등·폴백·실패) · 출력 형식 위반율 · 초안 건수 · 문장 축 6개 결과 · 턴 지연(중앙값·p95) · 턴당 provider 호출 수를 나란히 낸다. 튜터 모델 확정과 MEMORY 결정 기록은 Kiki 몫이며 이 태스크는 비교 입력만 낸다."
  - "⑦ 리포트는 초안 건수를 결말별·사례 종류별로 나누어 표기하고, 축별 판정 대상 수·판정 불가 수를 함께 적는다(축 min_n 미달은 측정 불가로 표기 — 통과로 접지 않는다)."
  - "⑧ [Kiki 2026-11-06 결정 — 좌석 비교 리포트 결정 대기 1안] 측정 전용 정책 프롬프트 변형(--policy-prompt utterance-required)으로 재수집한다. 근거: 좌석 비교(docs/reviews/p3_94_seat_compare_report_2026-11-06.md)에서 로컬 두 모델 초안 0/20 — 서빙 정책 프롬프트가 학생에게 직접 말하지 말라·utterance 선택·발화 없는 예시로 안내하는 계약이 원인. 변형은 그 세 문구만 수집기 프로세스 안에서 바꾸고(서빙·정책 코드 무변경), 대상 문구가 정확히 1건씩 없으면 실행 거부. 순서: 같은 20사례로 qwen2.5:7b(주 후보) + 클라우드 MID(품질 기준선) 재수집 → 초안이 나오면 선택 좌석으로 244사례 본 수집 → 초안 50~100건 사람 채점으로 판정기-사람 일치율 측정 → D16 임계값 입력. qwen2.5:3b는 이번 비교로 후보에서 뺀다(계약 위반 3/20 · 턴당 호출 9.0회)."
  - "⑨ [Kiki 2026-11-07 결정] ⑧의 사람 채점을 AI 채점으로 대체한다(Kiki 지시: 사람 채점 없이 AI가 진행). 방식 = 저장소 선례(KG-12 AI 2인 검수 → 3인째 판정)를 따른다: 좌석을 가린 채점 묶음(data/runs/p3_94/ai_scoring_packet_40.jsonl · 문항 정답·조건·풀이 단계 포함)을 서로 독립인 AI 채점자 2명이 같은 루브릭(정답 누설·수학 오류·단계 적합·일관성·학생 수준·지어낸 내용·전반 품질)으로 채점하고, 축별 채점자 간 일치도(Cohen κ)를 낸다. 불일치 항목만 3번째 AI가 판정해 패널 판정을 만든 뒤, 규칙 판정기와 패널의 축별 일치율과 좌석별 품질을 리포트한다. 한계(명시): AI 채점자의 오류율은 사람 기준으로 측정되지 않았다 — 패널 판정은 독립 다관점 기계 판정이지 사람 검수의 대체 측정이 아니다."
