acceptance:
  - "① 실측 사실(판정 기준 main 5af2097b · 2026-09-24 Gate 2 재판정 프로브 4변이) — 첫 오답 직후 `GET /v1/me/next-problem`은 4변이 전건 `action=diagnose · reason=unmeasured`를 낸다. 오개념 유발 오답(V2·V3·V4)에서 시도 응답의 상태 머신은 `to_state=REMEDIATING`이고 `l2/learning_state_policy`는 `NextActionKind.REMEDIATE_MISCONCEPTION`을 산출하는데, 추천 정책(`api/me.py::recommend_next_problem` → `NextProblemPolicy(learner_state, learning_context)`)은 그 상태·다음행동을 입력으로 받지 않는다. 같은 회차에 상태와 추천이 어긋난다.\n② 처분 — 추천 정책이 학습 상태 머신의 현재 상태(최소 REMEDIATING)를 읽도록 배선하거나, 읽지 않는 것이 교수학적으로 옳다면 그 근거를 판정문으로 남기고 Gate 2 Loop 1 \"보정\" 마디의 판정 기준을 Kiki 결정으로 재정의한다. 어느 쪽이든 결정 없이 구현하지 않는다(정책 설계 판정 선행).\n③ 배선을 택하면 — 오개념 오답 1건 직후 추천의 action이 remediation 계열(practice_current 또는 practice_prerequisite, 또는 신설 행위)이고 reason.type이 unmeasured가 아님을 HTTP 경로 통합 테스트로 단언한다. 추천 문항과 action/target_concept의 정합은 EOS-124 소관이므로 이 태스크가 대신 단언하지 않는다.\n④ 인접 경계 — EOS-127(상태 머신 R4 미발화 — 상태 머신의 *입력* 축), EOS-124(추천 정책 축 ↔ 선택 축 불일치 — 추천의 *내부* 축)와 다르다. 이 태스크는 상태 머신 *출력* → 추천 *입력* 축이다. 처분 전에 세 태스크의 acceptance를 대조한다."
