acceptance:
  - "① 좌석 작동 신호 정본화 — 저작 배치 요약(`problem_corpus_accumulate`의 `payload`)에 **어느 좌석이 몇 건을 실제로 처리했는가**를 싣는다. 형태는 기존 `payload[\"prompt_cache\"]`(EOS-99 `PromptCacheTally` → `prompt_cache_rates`)와 **동형**으로 한다: 호출별 `GenerationLog`를 이미 받고 있는 `_genlog_sink`에서 집계하고(두 벌 산식 금지), 리포트와 회차 대장에 같은 dict를 싣는다. 최소 축: `model_name` 분포(건수) · 선택된 셀렉터 값(`cloud_provider_name()`) · 성공/실패 건수 · 재시도 총합(`retries_in_current_call`).\n② 미측정과 0의 구분 — `model_name`이 None인 호출이 섞이면 그것을 0건이나 빈 문자열로 접지 않고 **미측정으로 계상**한다. `prompt_cache`가 이미 이 규약을 지킨다(`measured`·`unmeasured_reason`·`state`). 같은 이유로 \"셀렉터는 openrouter인데 실제 호출은 0건\"인 상태가 **눈에 보여야** 한다 — 그것이 이 태스크의 존재 이유다.\n③ 선언≠배선 해소 — `l3/providers/factory.cloud_provider_name()`은 ARCH-57이 신설했으나 **프로덕션 호출처가 0건**이다(실측 2026-09-18: `__all__`과 테스트뿐). 이 태스크가 그것을 실제로 부르거나, 부르지 않기로 판정하면 제거한다. 선언만 남겨 두지 않는다.\n④ 변별력 — 이 신호가 **실제로 구분하는지** 주입으로 확인한다. 최소 3종: ⓐ 셀렉터 openrouter인데 LOCAL 경로만 돈 회차(요약이 그 사실을 말해야 한다) ⓑ 혼재 회차(클라우드 일부·로컬 일부) ⓒ `model_name` None 혼재(미측정으로 계상되고 0으로 접히지 않는다). 정상 회차 대조군을 함께 둔다 — 대조군이 없으면 \"전부 미측정으로 계상\"이라는 과잉 수정이 통과한다.\n⑤ 이 태스크가 상환하는 실제 사고 — 2026-09-18 ARCH-57 라이브 1회차에서 `OPENROUTER_EXIT=0`·5/5 저장이 나왔는데 **OpenRouter가 서빙했는지 요약만으로는 판정 불가**였다. `calls_with_cache_telemetry: 0`이 \"OpenRouter가 캐시 필드를 안 낸다\"와 \"LOCAL로 떨어졌다\" 양쪽에서 같은 값이라 변별력이 0이었고(`unmeasured_reason` 문구 자체가 두 원인을 나란히 적는다), genlog 사이드카를 따로 열어야 알 수 있었다. 요약이 스스로 말했다면 왕복이 없었다.\n⑥ 범위 밖(명시) — 비용 집계의 정확도 향상(청구서 대조)은 이 태스크가 아니다. `GenerationLog.cost_usd`를 그대로 합산해 싣되 \"단가 곱셈이며 청구서 미대조\"임을 표기만 한다. 좌석별 품질 비교도 범위 밖이다(표본 설계가 필요하며 ARCH-55가 그 축의 선례다)."
  - "[범위 분할 2026-09-18 · 착수 시 실측] 등재 당시 acceptance ①의 \"최소 축\" 4개 중 **둘이 새 배관을 요구한다**는 것이 착수 조사에서 드러났다(등재 세션의 계획 오류 — 비용을 확인하지 않고 적었다). 실측: ⓐ `GenerationLog`에 retry 필드가 0건이고 `retries_in_current_call`은 `provider_accuracy_battle`에서만 쓰여 저작 경로에는 그 값을 싱크까지 나르는 채널이 없다 ⓑ `Usage`에 모델 필드가 없고 provider 3종 어디도 응답의 `model` 키를 읽지 않는다 ⓒ `db/models/provenance.GenerationLog.from_schema`가 mapper 컬럼으로 필터링하므로 pydantic에만 필드를 더하면 DB 저장에서 조용히 버려진다 — 제대로 하려면 pydantic + DB 컬럼 + alembic 마이그레이션까지다.\n그래서 이 태스크의 범위를 **기존 `GenerationLog` 필드로 계산 가능한 축**으로 좁힌다: `model_name` 분포 · 선택된 셀렉터 값(`cloud_provider_name()`) · 성공/실패 건수 · 비용 합(미상 건수 분리). 사고의 핵심(\"셀렉터는 openrouter인데 LOCAL이 돌았다\")은 이 축만으로 구분된다 — LOCAL은 qwen 핀, 클라우드는 좌석 핀이기 때문이다(`ARCH-58`이 후자를 고쳤다).\n**재시도 총합과 관측 모델(ARCH-58이 이 태스크로 넘긴 축)은 후속 태스크로 분리한다** — 조용한 유예가 아니라 승계이며, 승계 태스크 id를 이 항에 적어 추적 가능하게 한다. 그 축은 \"설정이 뭐라고 했나\"가 아니라 \"누가 실제로 답했나\"를 묻는 다른 질문이고 provider 측 대체·폴백을 잡는다. 승계 = `EOS-112-generation-log-served-model-and-retries`."
