notes: "사고 경위 2026-09-18 ARCH-57 라이브 1회차(Kiki 실행 Phaiakes9): OPENROUTER_EXIT=0 · 5/5 accepted_stored로 배치는 성공했으나 OpenRouter가 실제로 서빙했는지 요약으로 판정 불가. 대조군 Anthropic 회차는 calls_with_cache_telemetry=5 · prompt_tokens_total=12110 · measured=true였는데 OpenRouter 회차는 0건이었고, 그 0이 '이 provider가 캐시 필드를 노출하지 않는다'와 'LOCAL 경로만 돌았다' 양쪽에서 나온다(unmeasured_reason 문구가 두 원인을 나란히 적는다 — 즉 도구 자신이 변별력 없음을 알고 있다). 판정하려면 genlog 사이드카의 model_name을 따로 열어야 했다. CLAUDE.md 「작동 신호 없는 알고리즘 부착 금지」의 정확한 사례이며, ARCH-57 PR #1202 본문이 이 공백을 '정직한 공백'으로 미리 적어 둔 항목이다(그때 판단은 '산출물 스키마 변경이라 라이브 1회차에서 무엇이 필요한지 본 뒤가 낫다'였고, 1회차가 필요한 것을 정확히 알려 줬다). 훅 지점은 이미 있다 — _genlog_sink가 호출별 GenerationLog(model_name·input_tokens·output_tokens·cost_usd·success·latency_ms)를 받고 PromptCacheTally가 같은 자리에서 집계한다. 대칭 구조로 좌석 집계를 붙이는 일이다.\n\n[정정 2026-09-18] 착수 조사에서 acceptance ①의 최소 축 2개가 새 배관(마이그레이션 포함)을 요구함이 드러나 범위를 분할 — 승계 EOS-112 등재. 산문에만 남기면 만료 없는 유예가 되므로 acceptance에 append로 고정"
