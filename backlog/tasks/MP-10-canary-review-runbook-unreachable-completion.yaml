notes: "검수 런북 축 결함 3회차다(사이드카 경로·인코딩에 이어). 앞 둘은 Kiki 머신 라이브 실행 중에 드러났으나 이번엔 실행 전에 코드 대조로 발견했다 — 그래서 왕복 손실 0이다. 방향은 이 태스크가 앞이고 회차 검수 실행이 뒤다: 이 정정 없이 검수를 안내하면 완주한 검수가 미완주로 보이고 게이트가 증적을 다 갖춘 상태로 닫힌 채 남는다. 회차 태스크 쪽 depends_on 부착은 그 태스크의 claim이 풀린 뒤에 한다(현재 다른 세션 claim)."
