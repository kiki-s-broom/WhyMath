notes: "근거 = docs/architecture/03c_cloud_tier_transition_v2.md 3절. 판정 기준: main d10ba109.\n\n이 태스크가 학생 대면 전환(ARCH-64)의 안전 장치다. 실측된 공유 풀 대기열 실패율이 2026-09-17~18 4회차에서 30%→15%→0%로 흔들렸고(limit_source=upstream_provider_shared_pool·is_byok=false) p95 지연이 212초까지 갔다. 저작 경로에서는 명확한 실패가 옳은 선택이지만(사람이 본다) 학생 대면에서는 그 실패가 학생 화면의 오류가 된다.\n\nfailover가 성립하면 가용성 축은 '차단 판정의 입력'이 아니라 '운영 지표'가 된다 — ARCH-56의 acceptance 재정의가 그 위에 선다(Kiki 판정 사안).\n\n주의: seat_failover_rate가 상시 높으면 그것은 보호가 작동 중이라는 뜻이 아니라 1차 좌석이 부적합하다는 신호다. 그때 openrouter_allowed_providers에 정밀도가 같은 곳(baseten — PROVIDER_* 표 등재·Region US·baseten/fp8)을 추가해 이중화한다. 정밀도가 다른 곳을 넣는 것은 이중화가 아니라 오염이다.\n\n[정정 2026-09-24] ARCH-66: Anthropic API 사용 중단 방침"
