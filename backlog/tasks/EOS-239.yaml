  - "① 완전제곱식 해설의 필수 단계(양변 나누기 → 상수항 이항 → 더할 값 → 제곱근 → 두 근)를 저작 프롬프트 규칙 또는 사후 검사로 강제한다. 근거: EOS-225 A4 회차 5번·10번이 이항·더할 값 단계 누락으로 수정승인(F3).\n② 문장제의 범위 조건(x > 0 · 자연수)을 검산이 확인하지 못하는 공백을 측정한다 — 문항에 조건이 있는데 검산식은 '큰 근' 선택으로만 정답을 고르는 건수(A4 회차 문장제 11건). 지원 여부는 설계 결정으로 기록한다.\n③ 난이도 값의 척도 규칙을 정한다 — 같은 구조인데 값이 다른 사례(A4 회차 2↔4 · 4↔19 · 6↔11)와 0.5 단위 이탈(31번 2.8)을 근거로, 루브릭 또는 산정 방식을 문서로 확정한다(BKT·IRT 입력 영향 명시).\n④ 학생 화면 표기 혼재(cm² · cm^2 · sqrt(...))와 해설 문체 혼재(~입니다/~이다)를 기존 표기 정규화 권위(MATH-01)로 처리할 수 있는지 확인하고, 안 되면 처리 위치를 정한다."
