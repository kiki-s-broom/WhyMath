acceptance:
  - "① 결함 실측 고정 — ops/log_scrubber.PII_SHAPE_PATTERNS의 이메일·한국 휴대전화 정규식이 양끝 \\b 경계를 써서, Python 정규식이 한글을 단어 문자로 보는 탓에 조사가 붙거나 앞에 한글이 붙은 PII를 놓친다. 2026-09-28 실측(main 919865d4): scrub_text가 '연락처 010-1234-5678로 문의'·'전화 01012345678입니다'·'메일 kid@test.com으로'·'메일은kid@test.com'을 전부 원문 그대로 반환했고, 단독 '010-1234-5678'·'kid@test.com'만 가렸다. 이 사례들을 회귀 테스트로 고정한다(수정 전 RED 확인)."
  - "② 경계 수정 — \\b를 한글 인접을 허용하는 경계(예: 숫자·영문 앞뒤가 [0-9A-Za-z]가 아님을 보는 전후방 탐색)로 바꿔 한국어 문장 속 PII를 가린다. 전화번호는 숫자 연속의 일부(예: 더 긴 숫자열 안의 010으로 시작하는 부분)를 오검출하지 않는 대조군을 함께 둔다. 같은 패턴을 재사용하는 harness/banned_words_pii_eval.py(qa_pipeline 축 8 · EOS-137 문항 좌석)와 시크릿 하드코딩 스캔이 같은 수정을 받는지 소비처 전수 확인"
  - "③ 소급 영향 판정 — 이미 쓰인 로그에 조사 인접 PII가 평문으로 남았을 가능성을 판정한다(로그 보존 기간·저장 위치 실측). 운영 로그 조회는 Kiki 머신 몫이면 런북으로 분리한다"
  - "④ 같은 원인 확장(착수 시 실측 2026-09-28) — PII 2종뿐 아니라 같은 모듈의 자격증명 3종(sk-/pk- API 키 · Bearer 토큰 · JWT)·WHYMATH_*_KEY/SECRET/SALT 환경변수 대입·학생 원문 필드명 패턴도 선두 \\b 때문에 한글이 바로 앞에 붙으면 놓친다. 실측: scrub_text가 '키sk-ant-abcdefgh1234 노출'·'토큰eyJhbGciOi.eyJzdWIiOi.c2lnbmF0dXJl'·'설정WHYMATH_JWT_SECRET_KEY=abc123'·'헤더Bearer abcdefgh12345'를 원문 그대로 반환. 수정은 모듈의 모든 패턴에 re.ASCII를 적용해 단어 경계를 ASCII 기준으로 되돌리는 것 — ASCII 문맥의 기존 판정은 바꾸지 않는다(영숫자 인접은 여전히 비매칭 — 대조군으로 동결). CREDENTIAL_SHAPE_PATTERNS는 시크릿 하드코딩 스캔(SECRET_LITERAL_PATTERNS)과 공유되므로 그 스캔을 함께 돌려 새 오검출 0을 확인한다"
