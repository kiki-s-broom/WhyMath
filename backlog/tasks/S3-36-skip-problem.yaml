acceptance:
  - "① 판정 먼저: 이 태스크는 이식이 아니라 결정이다. main problem_screen.dart의 건너뛰기 버튼은 코치 화면으로 이동할 뿐 \"이 문제를 건너뛰고 다른 문제를 받는\" 동작이 아니다. 그리고 올바른 구현은 모바일 단독으로 불가능하다 — 서버 GET /v1/me/next-problem의 후보 쿼리는 채점 이력이 있는 문제만 제외하므로, 건너뛰기를 어디에도 기록하지 않으면 다시 조회해도 같은 문제가 결정론적으로 반환된다(api/me.py candidate_stmt·2026-08-10 섀도 세션 실측, 착수 시 재확인할 것).\n② Kiki 결정 1 — 서버 계약: (가) 클라가 제외 목록을 넘긴다(예: exclude 쿼리 파라미터 — 기존 attempted/sibling 배제와 동형 SQL 필터·학습자 모델 무영향·목록 상한 필요) vs (나) 서버가 skip을 기록한다(테이블 또는 이벤트 신설·이력 남음·분석 가능). 두 안의 비용과 되돌리기 난이도를 함께 제시하고 결정을 받는다.\n③ Kiki 결정 2 — 교수학 정책: 건너뛴 문제가 θ 추정·숙달(BKT/IRT)에 어떻게 반영되는가. 오답 처리는 금지이며(CLAUDE.md: 부정적 피드백의 정서적 강화 금지·학습 효과 우선), 단순 미응답과도 구분돼야 한다. 이 L2 의미론이 정해지기 전에는 서버 구현을 시작하지 않는다.\n④ 결정 후 구현 범위: 모바일 + 백엔드 교차 계층이다. 이 태스크의 paths·layer가 그 범위를 담도록 등재했고, 결정이 서면으로 남은 뒤에 착수한다. 원 커밋 fa08081·7f0d84e의 UX 디테일은 GitHub API로 읽어 참고하되, 서버 계약이 달라지면 그대로 이식하지 않는다.\n⑤ 완료 기준: 건너뛴 직후 재조회에서 다른 문제가 오는 것을 테스트가 실증한다(결정론적 동일 문제 반환이 회귀로 잡히게). 건너뛰기가 오답으로 계상되지 않음도 함께 동결한다."
