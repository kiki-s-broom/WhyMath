  - "[2026-09-22 차단 사유 정밀화 — 옵션 A·C의 *구조적* 불가 실측 · 판정 기준 main `b81a9909`] 2026-08-11 차단은 \"옵션 A/B/C 택1 시 착수 가능\"으로 세 길을 동등하게 열어 뒀다. 그 셋을 main 코드에 대고 재면 **A와 C는 택일의 대상이 아니라 지금 존재하지 않는 길**이다. 세 길이 전부 같은 한 가지를 필요로 하고 그것이 사람 게이트 뒤에 의도적으로 비어 있기 때문이다 — **kebab-id → 개념 링크**.\n\n(1) 실측 — 서빙 경로에 kebab→개념 링크가 **없다**.\n  · `l4/misconception/models.py::Misconception`(런타임 카탈로그 단위)의 필드는 id(kebab)·name_kr·domain·canonical_statement·counterexample·signals·regex_signals·refuting_regex다. `domain`은 `MisconceptionDomain` enum(영역)이지 개념 코드가 아니다 — **개념 링크 필드 0건**.\n  · `l4/misconception/hypothesis.py::MisconceptionHypothesis`도 `misconception_id`(kebab)·confidence·turns_since_evidence뿐이다(2026-08-11 차단 사유 ②가 그대로 성립).\n  · 개념 링크를 가진 유일한 자산은 `db/models/misconception_catalog.py::MisconceptionCatalog.concept_src_id`인데 그 테이블의 PK는 **`mis_id`(M-id·예 'M0425')**이고, 그 ORM docstring이 \"기존 kebab-id 오개념 체계와는 별개라 **FK가 전혀 없다**\"고 명문화한다. 즉 kebab에서 개념에 닿으려면 kebab→M-id 홉이 반드시 필요하다.\n\n(2) 그 홉(crosswalk)은 **비어 있고, 비어 있는 것이 설계다**. `docs/standards/crosswalk_gate_contract.md`가 \"AI 자기승인·검수 없는 적재를 금지\"하고 승인·적재·노출 플립을 전부 사람(4b-2)에게 둔다 — 오귀속 진단은 사용자가 검증할 수 없기 때문(CLAUDE.md 우선순위 #1·#2). `config.py`의 `misconception_crosslink_mode` docstring도 \"crosswalk 테이블은 사람 검수 전까지 비어 있어 보통 미매핑([])\"이라고 적는다. **따라서 A(순수 삼중쌍 어댑터)도 입력이 없다** — 2026-08-11 차단 사유 ②가 A에는 해당하지 않는 줄 알았으나, 삼중쌍의 첫 항이 kebab이고 끝 항이 개념이면 가운데 홉이 여전히 이 crosswalk다.\n\n(3) C(crosslink 전배선)는 \"비권장\"이 아니라 **현 설계와 정면으로 어긋난다**. `misconception_crosslink_mode`는 `Literal[\"off\", \"shadow\"]` **2값뿐이고 서빙 값이 없다**. 그리고 shadow는 비노출이 *불변*이다 — `l4/misconception/crosslink_shadow.py` 모듈 docstring: \"**비노출**: 반환 `None`. 호출자(게이트)가 신호를 받을 변수가 없어 student-facing 누출이 구조적으로 차단된다\". 즉 C는 얇은 어댑터가 아니라 ⓐ config에 서빙 모드 신설 + ⓑ 사람 검수 캠페인으로 crosswalk 적재, 두 개의 선행을 동반한다.\n\n(4) **고립 브랜치 구현(7n9n72 · 43e5d6d8)을 이식하면 안 되는 이유가 확정됐다.** 위 [고립 참조 보완 2026-09-07]이 기록한 대로 그 구현의 서빙 보충 경로는 `misconception_crosslink_mode != \"off\"` 게이트를 쓴다. 그 조건이 참이 되는 유일한 값이 `shadow`이므로, 그대로 이식하면 **비노출 측정 모드가 학생 대면 보충을 서빙하게 된다** — (3)이 인용한 비노출 불변의 정면 반전이다. 종전 기록은 이것을 \"옵션 C 계열이라 결정 전에는 대조 자료로만\"이라고 적었는데, 실제로는 대조 자료로도 위험하다(그 게이트 표현을 그대로 베끼는 순간 같은 반전이 재생산된다). **무비판 이식 금지가 아니라 이 게이트 표현의 채택 금지**로 강화한다.\n\n(5) 남는 길은 **B(별도 `recommend_misconception_review_coaching`) 하나뿐**이며, B만이 개념 링크를 요구하지 않는다 — \"이 오개념을 다시 보자\"는 오개념 자체를 대상으로 하므로 kebab만으로 성립하고, 2026-08-11 차단 사유 ③(오라벨)도 발생하지 않는다(`recommend_prerequisite_coaching`을 건드리지 않으므로 무엇도 \"선수\"로 라벨되지 않는다 — acceptance ①의 시그니처 불변도 자동 충족).\n\n(6) **그러나 B는 이 태스크의 정체를 바꾼다** — 제목·목표인 \"선수학습 복습 ↔ 오개념 연동\"이 아니라 \"오개념 복습 코칭 신설\"이 된다. 연동이 아니라 신규 기능이므로 MISC-02 id로 수행하면 스코프 치환이다. 그래서 세션이 임의로 택하지 않고 Kiki 판정으로 올린다. 선택지는 실질적으로 둘이다 — **ⓑ B를 별도 태스크로 등재하고 MISC-02는 cancel** 또는 **ⓒ crosswalk 사람 검수가 채워질 때까지 MISC-02를 blocked 유지**(A/C는 그때 비로소 택일 대상이 된다).\n\n**범위 명시**: 위 (1)~(3)은 main `b81a9909`의 소스를 읽어 확정한 것이고, crosswalk 테이블의 *실제 행 수*는 이 컨테이너에 DB가 없어 **측정하지 않았다** — \"비어 있다\"의 근거는 계약 문서와 config docstring의 선언이지 라이브 카운트가 아니다."
