  - "① 재현·범위 확정: 클라우드 provider(Anthropic·OpenRouter·DeepSeek 각각)를 직결한 CrossVerifier.verify()가 LOCAL 라우팅 결정을 받아 전 관점 provider_error가 되는지를 가짜 클라이언트로 좌석별 실행해 확정한다(OPS-104 보고는 Anthropic 좌석+가짜 클라이언트만 실행했고 OpenRouter는 코드 읽기만 했다). 실제 residue_gate_demotion_battle --cloud 진입점이 같은 조립을 쓰는지도 실행으로 확인한다.\n② 사실이면 수정: --cloud 측정 조립이 클라우드 결정을 만들어 주도록 고치되, 측정 구성=배포 구성 원칙(UnionCrossVerifier docstring)과 충돌하지 않는지 확인한다 — 배포 라우팅은 LOCAL이므로 클라우드 좌석 측정이 인증이 되려면 배포 라우팅도 같은 좌석이어야 한다는 --cloud help 문구의 전제를 함께 판정한다.\n③ 회귀 테스트: 클라우드 provider 직결 CrossVerifier가 provider_error가 아닌 실제 generate 호출에 도달함을 좌석별로 고정한다(기존 test_residue_gate_demotion_battle.py의 --cloud 테스트는 상호배타·설정 기록만 본다).\n④ 라이브 호출은 G-arch66-anthropic-api-pause-review 전까지 하지 않는다 — 가짜 클라이언트 범위만 수행하고 라이브 미수행을 명시한다."
