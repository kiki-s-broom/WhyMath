notes: "출처: Kiki 결정 2026-09-22 (EOS-128 4회차 AskUserQuestion 응답 \"지금 즉시 재판정 착수\") — 미등재 잔여 ⓑ의 처분.\n\n[중복 실측] 재판정 태스크는 실재하지 않았다. 이름으로 \"재판정\"을 검색하면 0건이고, 기능으로 검색하면 두 태스크가 나오는데 둘 다 재판정이 아니다: EOS-22-gate2-final-judgment(done·2026-09-19 FAIL)는 *1회차 판정*이고 후속이 없으며, P3-00-phase2-acceptance-check(todo)는 제목에 \"Gate 2 10조건·KPI 5종 main 기준 재실측\"이 있어 오독하기 쉬우나 그 태스크 자신의 notes가 \"등재는 착수가 아니다 — 착수 전제는 Phase 2 Gate 2 PASS(게이트 G-p3-entry-gate2-pass)\"라고 적어 진입 *후* 인수 점검임을 밝히고 있다. 즉 P3-00은 진입 게이트를 requires_gates로 걸고 있어 자기가 증거를 대야 할 게이트에 막힌다(순환) — 재판정 소유자가 될 수 없다. 그래서 신규다.\n\n[등급 근거] eos_priority P0 — 정의(\"없으면 12월 검증(G0~G5)이 성립하지 않는다\")에 해당한다. Gate 2는 저장소 G2(기준선 확보·10-25)의 판정 대상이고, 재판정 없이는 G2의 최신 verdict가 2026-09-19 FAIL로 고정된다. P0 예산 50건 대비 비종결 P0 4건이라 교환(swap-out) 불필요. 원 판정 EOS-22는 P2로 등급되어 있었고 이 등급은 그와 다르다 — 은폐하지 않고 여기 적는다(등급 불일치는 보고 대상이지 맞출 대상이 아니다).\n\n[선행] depends_on = EOS-21-week-gate-harnesses-never-run-in-ci. 근거는 실측이다 — EOS-22의 유일 미충족 조건이 \"무개입 연속 3루프\"이고 그 루프의 판정 하네스 중 3종이 어느 CI 잡에서도 실행되지 않는다(EOS-21 acceptance 확장이 워크플로 참조 0건으로 실측). 배선 상태를 모르는 채 재판정하면 같은 FAIL을 반복한다. EOS-21은 depends_on·requires_gates가 모두 비어 지금 착수 가능하므로, 임계 경로는 EOS-21 착지 → 재판정이다.\n\n[게이트 미부착] 이 태스크에는 requires_gates를 걸지 않았다 — 걸면 자기가 증거를 대야 할 G-p3-entry-gate2-pass에 막혀 P3-00과 같은 순환에 빠진다. 재판정은 진입 게이트 *앞*에서 도는 유일한 Phase 3 관련 작업이다.\n\n판정 기준 main 1671b9d4\n\n[정정 2026-09-25] 재판정 선행 집행(2026-09-25 · Kiki 지시 \"(나)안 — EOS-24·EOS-124 착지 후 재판정\"). 근거 = 2026-09-24 재판정문 docs/reviews/eos_phase2_gate2_rejudgment_2026-09-24.md §7-1 \"재판정 PASS까지 필요한 최소 경로\" 1·2번. 무개입 연속 3루프가 4변이 전건 미충족인 직접 원인 두 축(Loop 1 보정 미발화 = EOS-24 · Loop 3 전진 불일치 = EOS-124)이 depends_on에 없어, 기존 선행 EOS-21만 착지해도 이 태스크가 착수 후보로 풀려 같은 FAIL을 세 번째로 재생산할 수 있었다. 3루프 상시 하네스 축은 depends_on에 넣지 않았다 — 그 축을 가진 태스크는 소유 범위가 넓고(①②③⑨⑫), 재판정은 9/19·9/24와 같은 일회성 프로브로 잴 수 있으며, 상시성은 판정 요건이 아니라 유지 요건이다. 기존 EOS-21 의존은 유지한다(처분은 이 태스크 소유 세션 몫 — 9/24 판정문 §7-2). 판정 기준 main 9a19ec0c (PR #1295 머지 — EOS-24 등재 착지)."
