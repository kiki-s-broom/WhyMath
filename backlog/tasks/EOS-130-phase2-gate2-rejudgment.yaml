acceptance:
  - "① Phase 2 Gate 2의 10조건과 KPI 5종을 main 기준으로 재실측한다 — 판정 기준 커밋 해시를 보고 상단에 박는다. 근거는 실파일·명령 출력·태스크 ID 중 하나여야 하고, 문서 언급은 근거가 아니다.\n\n② 판정 회차 분리(지시문 세트 주의 4) — 이 태스크는 판정 전용이며 구현 세션과 다른 세션에서 단독 집행한다. 조건을 충족시키려고 production code를 고치지 않는다. 발견한 결함은 태스크로 등재만 한다.\n\n③ 선행 판정과의 대조 — 2026-09-19 EOS-22 판정문(docs/reviews/eos_phase2_gate2_judgment_2026-09-19.md · 최종 FAIL · 10조건 충족 / 무개입 연속 3루프 미충족)과 조건별로 달라진 점·같은 점을 표로 적는다. 재판정이 앞 판정을 그대로 반복하는 것인지 실질 변화가 있는 것인지 읽는 사람이 구분할 수 있어야 한다.\n\n④ 무개입 연속 3루프 축의 현재 상태 — EOS-21이 실측한 미배선 하네스 3종(test_week1_gate_closed_loop.py · test_week3_gate_remediation_loop.py · test_e2e_persona_journeys.py — 워크플로 참조 0건)이 그 축의 근거다. 이 태스크의 선행이 EOS-21인 이유이며, EOS-21의 처분(배선 또는 명시 제외) 결과를 그대로 인용한다. 배선되었으면 야간 잡 실측 출력을, 제외로 처분되었으면 그 사실을 근거로 적는다.\n\n⑤ KPI 5종(P-14 · EOS-15) 실측값 병기 — ops/loop_kpi_gate CLI의 exit code와 5종 verdict를 그대로 싣는다. 미측정은 0으로 적지 않고 unmeasured로 명시한다.\n\n⑥ 최종 한 줄은 PASS 또는 FAIL이며 조건부 PASS는 없다. 미충족 조건마다 (가)끊긴 지점 (나)남은 작업량 추정 (다)11월 일정에 미치는 영향을 적는다.\n\n⑦ 게이트 clear는 Kiki 소유다 — G-p3-entry-gate2-pass는 kind=decision·assignee=kiki이고, 이 태스크는 그 게이트의 증거를 만드는 것이지 닫는 것이 아니다. 에이전트가 --as kiki로 대행하지 않는다(거부의 우회 금지).\n\n⑧ 완료 판정 — 10조건·KPI 5종이 main 기준으로 재실측되고, EOS-22와의 조건별 대조표와 최종 한 줄 verdict가 판정문으로 남고, 미충족분이 선행 태스크로 등재됨."
