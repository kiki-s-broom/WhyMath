acceptance:
  - "① CLI 신설 — `scripts/ops/ci_job_repro.py --job <잡이름>`이 `.github/workflows/ci.yml`을 **파싱해** 그 잡의 install 스텝과 run 스텝을 순서대로 낸다. 사람의 기억이나 문서 사본이 아니라 ci.yml 자신이 단일 진실 원천이어야 한다 — 사본을 두면 드리프트가 곧 이 도구의 거짓말이 된다. ② `--list`로 잡 이름을 전수 열거한다(잡 자체를 빠뜨리는 축 방어). ③ `--exec`로 실제 실행하되 각 스텝의 exit code를 개별 출력하고, **하나라도 비-0이면 전체 exit 1**로 끝낸다(래퍼가 종료 코드를 가리는 축 방어 — 마지막 명령이 echo가 되지 않게 한다). ④ 출력을 파일로 받을 때 `tail`·`head`를 경유하지 않는 형태를 기본값으로 낸다(절단 축 방어). ⑤ 변별력 — ci.yml에서 install 스텝 하나를 지우고 돌리면 그 잡의 재현 명령에서도 사라져야 한다(파싱이 실제로 ci.yml을 읽는지 확인). 하드코딩 사본이면 이 테스트가 통과해 버린다. ⑥ 뮤테이션 4종 전건 RED — (a) install 스텝 누락 (b) 잡 이름 오타 시 조용히 빈 목록 반환 (c) 비-0 스텝을 exit 0으로 접기 (d) `--list`가 일부 잡만 반환. 각 절마다 그 절이 없으면 통과하는 입력을 픽스처로 둔다. ⑦ CI 자기참조 — 이 도구 자신이 `infra-contracts` 잡에서 `--list`로 돌아 ci.yml 파싱이 깨지지 않았음을 상시 확인한다."
