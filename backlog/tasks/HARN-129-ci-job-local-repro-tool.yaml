notes: "등재 근거 = 2026-09-21 PR #1255 작업 중 발생한 사고 2건(사고 대장 등재). 로컬에서 tests/infra를 돌려 47 failed를 받았는데, 실제로는 CI가 설치하는 7종 중 sqlalchemy·pytest-asyncio 2종을 빼먹은 환경 결손이었다. 두 의존성을 설치하자 같은 파일이 115 passed exit 0. CI의 infra-contracts 잡도 success였다.\n\n피해는 거짓 red 1건과 그것을 가리려 돌린 A/B 2회(기준선 워크트리 포함 약 6분)다. 다행히 거짓 green이 아니라 거짓 red였고 A/B로 자기 변경이 아님을 확정한 뒤 보고했다.\n\n이 도구가 막으려는 것은 CLAUDE.md가 이미 세 번 적은 \"CI가 실제로 쓰는 명령을 그대로 재현한다\"의 네 번째 입구다: 2026-08-09 대상 경로를 좁힘 → 2026-09-10 검사 종류를 빠뜨림 → 2026-09-17 잡을 빠뜨림 → 이번 의존성 집합을 빠뜨림. 세 번의 대책이 전부 산문이었고 네 번째 입구로 뚫렸다. 2026-09-20 산문 규칙 등재 동결에 따라 이번 대책은 코드여야 한다.\n\n핵심 설계 판단: 재현 명령을 문서에 적지 않고 ci.yml에서 유도한다. 적어 두면 그 사본이 드리프트하고, 드리프트한 재현 도구는 안 돌린 것보다 나쁘다(틀린 green을 준다)."
