notes: "출처: 2026-09-24 사용자 지적 \"KPI 5종 중 2종은 구조상 측정 불가\" → 추가 검토 → Kiki 권장안 승인. 결정 로그 = MEMORY 2026-09-24 \"S3-16 ③ 부분 번복\".\nS3-16 ③(2026-07-29)은 focus_score·engagement_score·learning_session 행 writer를 한 문장으로 미신설 결정했으나, 사유(\"단일 스칼라가 정본 5분류와 축 불일치\")는 점수에만 해당하고 세션 행(시작·종료 시각)에는 해당하지 않는다. 그 결정 하나가 세 소비처를 막고 있었다 — 루프 KPI ①(ops/loop_kpi_gate), 파일럿 KPI2 재방문율(harness/pilot_kpi_baseline.py:812 · D7 ≥30% \"가장 먼저 검증할 가설\"), surrogate_baseline_report ③. 이 태스크 하나로 셋이 풀린다.\n게이트② 판정문 §6-2의 \"evidence_event 조인 키 도입(마이그레이션 동반)\"은 이 태스크 ④로 정정된다 — user_id 컬럼 추가가 아니라 실 session_id 경유.\nG4(12/13)가 루프 완주율·역추적률 보고를 요구하므로 그 전에 착지해야 한다. P0 승격 여부(P0 예산 swap-out 필요)는 Kiki 판단으로 남긴다."
