notes: "출처: 2026-09-24 사용자 지적 \"KPI 5종 중 2종은 구조상 측정 불가\" → 추가 검토 → Kiki 권장안 승인. 결정 로그 = MEMORY 2026-09-24 \"S3-16 ③ 부분 번복\".\nS3-16 ③(2026-07-29)은 focus_score·engagement_score·learning_session 행 writer를 한 문장으로 미신설 결정했으나, 사유(\"단일 스칼라가 정본 5분류와 축 불일치\")는 점수에만 해당하고 세션 행(시작·종료 시각)에는 해당하지 않는다. 그 결정 하나가 세 소비처를 막고 있었다 — 루프 KPI ①(ops/loop_kpi_gate), 파일럿 KPI2 재방문율(harness/pilot_kpi_baseline.py:812 · D7 ≥30% \"가장 먼저 검증할 가설\"), surrogate_baseline_report ③. 이 태스크 하나로 셋이 풀린다.\n게이트② 판정문 §6-2의 \"evidence_event 조인 키 도입(마이그레이션 동반)\"은 이 태스크 ④로 정정된다 — user_id 컬럼 추가가 아니라 실 session_id 경유.\nG4(12/13)가 루프 완주율·역추적률 보고를 요구하므로 그 전에 착지해야 한다. P0 승격 여부(P0 예산 swap-out 필요)는 Kiki 판단으로 남긴다.\n\n[정정 2026-09-24] 추가 검토: KPI ① 동어반복 위험·동시 요청 경합·CASCADE 첫 작동·재방문율 의미\n\n[정정 2026-09-25] paths ['src/backend/whymath_backend/l2/recommendation_evidence.py', 'src/backend/whymath_backend/l2/learning_event_trace.py', 'src/backend/whymath_backend/api/me.py', 'src/backend/whymath_backend/db/models/activity.py'] → ['src/backend/whymath_backend/l2/recommendation_evidence.py', 'src/backend/whymath_backend/l2/learning_event_trace.py', 'src/backend/whymath_backend/api/me.py', 'src/backend/whymath_backend/db/models/activity.py', 'src/backend/whymath_backend/l2/learning_session_writer.py', 'src/backend/alembic/versions/20260925_0000_8e4c2a7f1b93_learning_session_writer.py', 'src/backend/whymath_backend/api/coach.py', 'src/backend/whymath_backend/ops/loop_kpi_gate.py', 'src/backend/whymath_backend/privacy/export.py', 'src/backend/whymath_backend/privacy/retention.py']: 구현 실측 — 신규 writer 모듈·마이그레이션과 배선·KPI·보존 파기 지점이 원 범위 밖이라 scope_drift 경고 2건 발생. 실제 변경 파일로 범위를 정정한다."
