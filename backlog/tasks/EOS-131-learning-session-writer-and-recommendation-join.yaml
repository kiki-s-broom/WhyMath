acceptance:
  - "① 판정 기준 재실측 — 착수 시점 main 해시를 적고, `l2/learning_event_trace._SOURCE_REGISTRY`에서 `CONCEPT_SELECTED`(learning_session)가 DORMANT, `RECOMMENDATION_GENERATED`(evidence_event)가 UNJOINABLE인지 다시 확인한다. 근거 = `docs/reviews/eos_phase2_gate2_judgment_2026-09-19.md` §4·§6-2, 2026-09-24 결정 로그.\n② 세션 writer 배선 — **서버 측 유휴 간격 규칙**으로 `learning_session` 행을 만든다(2026-09-24 결정): 인증된 학습 활동(최소 `/me/next-problem`·`submit_attempt`·코치 턴)이 들어올 때 그 학생의 열린 세션이 없거나 마지막 활동으로부터 30분이 지났으면 새 세션을 연다. 클라(Flutter)는 수정하지 않는다. 유휴 간격 30분은 상수 1곳에 두고 근거를 주석으로 남긴다. 세션 종료(`ended_at`)는 다음 세션이 열리거나 조회 시점에 유휴 간격이 지난 것으로 확정한다 — 종료 신호 누락으로 세션이 영원히 열려 있는 상태를 만들지 않는다.\n③ 세션 행에 점수를 쓰지 않는다 — `focus_score`·`engagement_score`는 계속 NULL이다(S3-16 ③의 점수 미신설 결정은 유지). 이 불변식을 테스트로 동결한다.\n④ 추천 기록에 실 세션 결합 — `l2/recommendation_evidence.record_recommendation_treatment`가 호출마다 발급하던 `uuid.uuid4()` placeholder를 ②의 실 `session_id`로 바꾼다. `evidence_event`에 `user_id` 컬럼을 추가하지 않는다 — PED-03·REC-03의 \"user_id 없음·시그니처에 user_id 슬롯 자체가 없음(구조적 차단)\" 설계를 유지하고, 학습자 결합은 `evidence_event.session_id → learning_session.user_id` 경로로 얻는다. 같은 세션의 `problem_attempt.session_id`도 서버가 채운다.\n⑤ 개인정보 — `learning_session`은 이미 `privacy/erasure.py`·`privacy/export.py` 대상이다(재확인). `evidence_event.session_id`는 FK가 아니므로 삭제권 이행 뒤에는 세션 행이 사라져 추천 기록이 자동으로 학습자와 끊긴다 — 이 성질을 테스트로 확인한다. 학생이 활동 중인 동안 추천 기록이 학습자와 결합되므로, 열람권(export) 대상에 넣을지 판정하고 근거를 적는다.\n⑥ 원천 대장 전환 — ②④가 착지하면 `_SOURCE_REGISTRY`의 두 항목을 PRODUCED로 바꾼다. 테스트는 대장 문자열이 아니라 **실제 writer 경로를 호출해 행이 생기는 것**을 확인한다.\n⑦ 해제 확인(실패 주입 포함) — (가) `ops/loop_kpi_gate` KPI ①의 `blocked_preconditions`가 비고, 세션 0건 관측창에서는 여전히 `unmeasured`(exit 2), 세션 N건·추천 도달 M건 관측창에서 M/N이 나온다 (나) `harness/pilot_kpi_baseline` KPI2 재방문율이 세션 행을 읽어 값을 낸다 (다) `harness/surrogate_baseline_report`의 ③ \"영구 불가\" 표기를 걷는다(그 표기의 근거 주석 `:142`·`:164` 정정 포함).\n⑧ 기존 동결 정정 — `tests/backend/api/test_e2e_vertical_slice_integration.py:746`의 `assert attempt.session_id is None`(공백 동결)을 새 계약(서버가 세션을 채운다)으로 바꾼다. 지우지 말고 반대 방향 단언으로 교체한다."
  - "⑨ KPI ① 분자 재정의(2026-09-24 추가 검토) — 현행 계약(`docs/standards/loop_kpi_contract.md` §2, `ops/loop_kpi_gate.collect_loop_completion`)의 분자는 \"같은 `session_id`의 추천 기록이 **하나라도** 있는 세션\"이다. ②에서 `/me/next-problem`이 세션을 여는 활동에 포함되면, 앱이 첫 문제를 추천으로 받는 흐름상 **거의 모든 세션이 시작 순간 '도달'로 계상돼 KPI ①이 동어반복**이 된다(측정하려던 Attempt → Assessment → Mastery → Recommendation 흐름을 전혀 보지 않는다). 그러므로 분자를 \"그 세션의 **첫 시도 이후**에 기록된 추천이 있는 세션\"으로, 분모를 \"시도가 1건 이상 있는 세션\"으로 바꾼다(시도 없는 세션은 루프가 시작되지 않은 것이므로 분모에서 빼되, 그 건수는 리포트에 따로 낸다 — 조용히 빼지 않는다). 계약 문서 §2와 게이트 docstring을 함께 고친다. 대안 \"next-problem을 세션 개시 활동에서 제외\"는 채택하지 않는다 — 첫 추천이 세션 없이 기록돼 ④의 결합이 다시 끊긴다. 실패 주입 3종: (가) 시도 전 추천만 있는 세션 → 미도달 (나) 시도 후 추천이 있는 세션 → 도달 (다) 시도는 있으나 이후 추천이 없는 세션 → 미도달. 옛 정의로 되돌리면 (가)가 RED여야 한다.\n⑩ 동시 요청 경합 — 같은 학생의 요청 두 건이 거의 동시에 들어오면 둘 다 \"열린 세션 없음\"을 보고 세션을 두 개 열 수 있다(분모 부풀림·재방문율 왜곡). 학생당 열린 세션 1개를 DB 제약(부분 유니크 인덱스 등) 또는 행 잠금으로 보장하고, 동시 요청 2건 주입 테스트로 세션 1개만 생기는지 확인한다.\n⑪ 연쇄 삭제가 처음으로 작동한다 — `problem_attempt.session_id`는 `learning_session`에 `ondelete=\"CASCADE\"`로 걸려 있다. 지금까지는 값이 항상 NULL이라 이 연쇄가 한 번도 작동한 적이 없다. 서버가 값을 채우면 보존 파기(`privacy/retention.py`, 둘 다 `started_at` 기준·attempt 먼저)에서 세션의 `started_at`이 그 세션 시도들보다 앞서므로, 세션이 먼저 파기 기준을 넘으면 **아직 기준 안쪽인 시도가 연쇄로 함께 지워진다**(세션 길이만큼 조기 파기 — 방향은 '늦은 파기'가 아니라 '이른 파기'라 법적 위험은 낮지만, 파기 리포트의 시도 건수가 실제보다 적게 집계된다). 파기 기준을 맞추거나(예: 세션은 `ended_at` 기준) 연쇄 파기 건수를 리포트에 계상하는 방법 중 하나를 고르고, 경계 사례 1건을 테스트로 고정한다.\n⑫ 재방문율 의미 변화 명시 — 스키마 docstring은 세션을 \"앱 진입~종료\"로 적지만 서버 추론 세션은 \"학습 활동 묶음\"이다. 앱을 열기만 하고 학습 활동이 없으면 세션이 생기지 않는다. KPI2 재방문율이 무엇을 재는지 계약에 한 줄로 적는다(학습 재방문율로는 오히려 더 정확하다)."
