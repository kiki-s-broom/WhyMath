notes: "실측 2026-09-18 Kiki 실행 Phaiakes9 — ARCH-57 라이브 1회차의 genlog 대조에서 발각. OpenRouter 좌석 회차와 Anthropic 회차의 model_name이 **둘 다** claude-sonnet-4-6 5건으로 같았다. 실행 자체는 정상이었다는 증거: 캐시 텔레메트리가 OR=0/5 · AN=5/5로 갈렸고(AnthropicProvider가 양쪽을 서빙했다면 양쪽 다 실렸어야 한다), RECHECK_SEAT=OpenRouterProvider였으며, dedup 결과도 5/5 저장 vs 1/5 저장으로 달랐다. 즉 OpenRouter가 실제로 서빙했고 기록만 거짓이다. 원인은 model_name_for_decision이 CLOUD 티어에서 anthropic 설정 좌석을 하드코딩해 읽는 것이고, 그 전제는 ARCH-57 이전에는 참이었다 — 슬롯을 셀렉터로 바꾸면서 이 함수를 같이 고치지 않은 것이 이 세션의 누락이다. 이번 회차의 '어느 좌석이 서빙했는가' 판정이 genlog로는 불가능했던 이유이기도 하다(캐시 텔레메트리라는 간접 신호로만 추론했다)."
