건이 코퍼스와 DB에 전건 승격되는 것을 실측으로 확인했다(코퍼스 3건 갱신·mark_review_status 1콜). review_status==\"reviewed\"는 l1/concept_graph/retrieval.py·l1/atom_graph/retrieval.py가 학생 노출을 거르는 기준이므로 이는 메타데이터 부정확이 아니라 미검증 AI 콘텐츠의 학생 노출 경로다(의사결정 우선순위 #1).\n\n[정정 2026-09-22] 재부착 — 2026-09-21에 붙인 것이 PR #1251 머지와의 충돌 해소에서 소실됐다(양쪽이 같은 필드 블록을 고쳤고, 게이트 부착분을 살리려 main 버전을 취했다). 부착 근거는 동일하다: KG-02의 846건 검수 배치는 MID 좌석(2026-09-21 Kiki 좌석 확정으로 DeepSeek V4.1 flash @ OpenRouter)에서 실 LLM을 호출하는데, CLOUD_TOKEN_PRICE_USD_PER_1M이 CostTier로만 키가 잡혀 있어 그 좌석 회차의 비용 기록이 24.4배 과대 계상된다(1회 8.612원으로 기록되지만 실제는 0.354원). 그 값은 guard_cloud의 예산 판정 입력이기도 하다. 846건은 예산 판정에 유의미한 규모이므로 ARCH-62가 단가표에 좌석 축을 넣어 착지한 뒤에 이 검수 배치를 돌려야 회차 비용 기록이 사실이 된다. 같은 단가표 근거로 MID 컷오버 쪽도 이미 같은 의존을 대장에 집행해 두었다(정본 = docs/architecture/03c_cloud_tier_transition_v2.md). 산문이 아니라 depends_on으로 집행하는 이유는 selector.py가 notes를 읽지 않기 때문이다. 판정 기준: main c919a7c3.\n\n[정정 2026-09-25] 2026-09-25 게이트 G-kg02 점검(Kiki 판정: 보류+대장 정정) — acceptance ③의 관측 표면이 다른 테이블을 읽는 표면이었음을 주입 실측으로 확인해 정정 항을 덧붙인다. notes 2026-09-21 정정의 'review_status==reviewed는 l1/concept_graph/retrieval.py·l1/atom_graph/retrieval.py가 학생 노출을 거르는 기준'이라는 전제도 틀렸다: 두 retrieval은 concept_node·atom_node를 읽고, concept_content를 읽는 학생 경로(/study → get_concept_dsl)는 review_status를 보지 않는다 — 그 노출 게이트는 신규 CONT-05가 소유한다. 부수 정정: 2026-09-22 ARCH-62 선행 부착 사유의 'MID 좌석(OpenRouter)에서 실 LLM 호출'은 코드와 다르다 — concept_content_review_batch._build_provider는 로컬 OllamaProvider만 만든다(ARCH-62는 done이라 차단 영향 없음). 판정문 = docs/reviews/kg02_gate_premise_recheck_2026-09-25.md"
