notes: "출처: HARN-174 v2-9 백필(2026-09-25). 게이트 G-p3-g2-week2에는 판정을 수행할 태스크가 대장에 없었다 — 게이트 제목이 판정 회차 분리 집행을 요구하는데 그 회차의 소유자가 없는 상태였다. 이 태스크가 그 게이트의 입력(gate.depends_on)이다.\n\n[게이트 미부착] 이 태스크는 G-p3-g2-week2를 여는 작업이므로 그 게이트를 requires_gates로 걸면 순환이 된다(HARN-174 이후 CLI가 쓰기 시점에 거부한다). Week 1 게이트는 걸지 않는다 — 입력 태스크의 첫 번째가 이미 그 게이트를 요구하므로 전이로 막힌다."
