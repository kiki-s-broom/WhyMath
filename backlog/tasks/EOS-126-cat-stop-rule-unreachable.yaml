acceptance:
  - "① 실측 재현 — 테스트 픽스처 문항 45건(난이도 1.0~5.0 순환·같은 개념 PRIMARY)을 CAT 추천 순서대로 풀린 결과 SE가 0.391에서 멈췄고 후보 풀이 소진됐다(목표 `TARGET_SE = 0.3` · `l2/next_problem_selection.py:72`). 14문항 시점 SE=0.685. 수렴 속도가 후반 문항당 0.0005 수준이라 현행 추정기·문항 정보량으로는 수십~수백 문항이 필요하다. 이 재현을 CLI 또는 테스트로 고정한다.\n② 끊긴 화살표 확정 — SE가 임계에 못 닿으면 `POST /v1/me/assessments/capture`가 항상 `written=False · reason=insufficient_measurement`로 끝나고, 그 분기에서만 호출되는 `provision_learner_state(reason=diagnosis_capture)`가 돌지 않아 `learner_state` 행이 생기지 않는다. 그 결과 `POST /v1/me/objectives/{objective_id}/study`는 `require_learner_state` 게이트에서 영구히 409다. 즉 계획서 §11 페르소나 A의 \"진단 → 학습\" 화살표가 main에서 끊겨 있다.\n③ 처분 3택 중 하나를 근거와 함께 고른다 — (가) 중단 규칙 완화·모드별 차등(SE 임계를 상수 하나가 아니라 목적별로) (나) 정보량 산출·문항 모수(a·b) 교정으로 수렴 속도 자체를 올린다 (다) 문항 수 상한 기반 2차 중단 규칙 추가(최대 N문항이면 SE와 무관하게 확정). 어느 쪽이든 임계를 \"낮춰서 통과시키는\" 것이 목적이 되면 안 된다 — 진단 확정이 측정 근거를 잃는다.\n④ 집행 지점 별항(정본화 != 집행) — 해소 후 `tests/backend/api/test_persona_three_path_completion.py`의 A-5 절이 현재 `written is False`를 계약으로 동결하고 있다. 그 단언을 `written is True` + `learner_state` 1건으로 뒤집는 것까지가 이 태스크의 완료다. 뒤집지 않으면 해소돼도 하네스가 옛 상태를 계속 요구해 빨강이 된다.\n⑤ Gate 2 연결 — 계획서 §18 조건 3(LearnerState 자동 생성)·조건 10(전체 과정 반복 가능)이 이 축에 직접 걸린다. P-16 판정 전에 처분이 나와 있어야 한다."
  - "[정정·정밀화 2026-09-19 · 같은 세션] ②의 \"영구히 409\"는 등재 시점에 **추론**이었다. 실측으로 승격하며 두 가지를 정정한다.\n\n⑥ 실측 승격 — 학습목표 행을 심고 호출한 결과 `409 학습을 시작하려면 먼저 진단을 완료해야 합니다`가 나왔다(learner_state 0건). 시도를 쌓고 capture를 시도한 뒤에도 같다. 즉 D1 → learner_state 부재 → 학습 진입 차단의 사슬은 이제 읽어서 추론한 것이 아니라 측정된 것이다. 회귀 동결 지점 = `tests/backend/api/test_persona_three_path_completion.py`의 A-6 마디.\n\n⑦ 게이트 순서 정정 — `post_study_unit`은 목표 로드(부재 시 404)를 `require_learner_state`(부재 시 409)보다 **먼저** 한다. 그러므로 \"학습 진입이 막힌다\"를 D1의 증거로 쓰려면 목표 행이 실재해야 하며, 그렇지 않은 상태의 차단은 D1과 무관하다. 이 태스크의 완료 판정에서 409/404를 혼동하지 않는다.\n\n⑧ \"도달 불가\"의 범위 명시 — SE 0.391은 **이 회차 픽스처의 문항 풀**(단일 개념·난이도 1.0~5.0 순환·정답률 약 3/4) 실측이다. 정보량이 더 높은 실제 문항 풀에서는 수렴이 빠를 수 있으므로, 처분 판단 전에 **운영 코퍼스 기준 수렴 곡선을 다시 측정**한다. 등재 문구의 \"영구히\"는 그 재측정 전까지 픽스처 조건부로 읽는다."
  - "[경로 정정 2026-09-19 · PR #1228 축소 후] ④가 가리키던 `tests/backend/api/test_persona_three_path_completion.py`는 **존재하지 않는다**. main이 PR #1227(EOS-122)로 P-15를 먼저 착지시켜 3경로 하네스가 이미 있었으므로, 이 세션의 중복 하네스를 폐기하고 고유 마디만 착지본에 얹었다.\n\n⑨ 동결 지점 정정 — 이 결함의 회귀 동결은 `tests/backend/api/test_e2e_persona_journeys.py`의 `test_persona_a_diagnosis_confirmation_and_study_entry_are_blocked`다. 그 테스트가 세 마디를 단언한다: ①4문항 제출 후 `assessments/capture`가 `written=False · reason=insufficient_measurement` ②그래서 `learner_state` 행이 생기지 않고 ③`POST /v1/me/objectives/{id}/study`가 **409**. 해소 시 그 단언들을 `written is True`·`study 201`로 뒤집는 것까지가 이 태스크의 완료다(④의 취지 불변·대상 파일만 교체).\n\n⑩ 변별력 실측 — 뮤테이션 3종 전건 RED: N1 목표 행 제거(409가 404로 바뀜 — 차단 사유 혼동) · N2 `require_learner_state` 게이트 제거(차단 소멸) · N3 `measurement_sufficient` 경계 무력화(capture가 쓰임). 주입 적용과 원복 바이트 동일을 각각 단언했다."
  - "[전제 정정 2026-09-19 · EOS-22 Gate 2 판정 실측 수용] ⑧이 열어 둔 질문(\"실제 문항 풀에서는 수렴이 빠를 수 있으니 처분 전 재측정한다\")에 **답이 나왔다**. 이 태스크의 제목과 ①②가 쓴 \"영구히\"·\"미도달\"은 **틀렸다**.\n\n⑪ 정정된 사실 — CAT 중단 규칙은 **도달한다. 다만 67문항이 필요하다.** EOS-22 판정 프로브 실측(문항 20종·난이도 1.0~5.0 균등·정답률 2/3 고정 · `docs/reviews/eos_phase2_gate2_judgment_2026-09-19.md` §2-1): 10회 SE 1.007 · 20회 0.536 · 40회 0.379 · **67회 0.297**(임계 첫 통과). 내 최초 측정(45문항 SE 0.391)이 \"미도달\"로 보인 것은 후보 풀이 45개에서 소진돼 더 못 갔기 때문이다 — 수렴은 단조이며 멈춘 적이 없다. 즉 **막힌 것이 아니라 비현실적으로 긴 것**이다.\n\n⑫ 그래서 결함의 정의가 바뀐다 — \"루프가 구조적으로 끊겼다\"가 아니라 **\"진단 완료에 67문항이 필요해 실학생이 한 자리에서 완주할 수 없고, 그 전까지 `learner_state`가 없어 학습 진입이 409로 막힌다\"**이다. 처분 3택(⑤의 가·나·다)은 그대로 유효하되 판단 근거가 \"임계를 낮춰 도달시킨다\"가 아니라 **\"도달 비용을 학생이 감당할 수준으로 줄인다\"**로 바뀐다. 문항 정보량 교정(나)과 문항 수 상한 2차 중단 규칙(다)의 우선순위가 올라간다.\n\n⑬ 회귀 동결은 그대로 유효하다 — `test_persona_a_diagnosis_confirmation_and_study_entry_are_blocked`는 **4문항** 제출 후를 단언한다(67 ≫ 4). \"짧은 진단 세션은 확정되지 않는다\"는 사실은 정정 후에도 참이므로 단언을 바꿀 필요가 없다. 해소 판정 시 그 테스트의 문항 수를 늘려 뒤집을지, 임계 정책 변경으로 4문항에서도 확정되게 할지는 처분과 함께 정한다.\n\n⑭ id 슬러그(`cat-stop-rule-unreachable`)는 **바꾸지 않는다** — 이미 머지된 main과 EOS-22 판정문이 이 id를 인용하고 있어 개명하면 참조가 깨진다. 제목만 정정했고, 슬러그의 \"unreachable\"은 이 항으로 반증돼 있다(HARN-100 개명은 미머지 충돌 해소용이지 문면 정정용이 아니다)."
