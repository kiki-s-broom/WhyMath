acceptance:
  - "① 실측 재현 — 테스트 픽스처 문항 45건(난이도 1.0~5.0 순환·같은 개념 PRIMARY)을 CAT 추천 순서대로 풀린 결과 SE가 0.391에서 멈췄고 후보 풀이 소진됐다(목표 `TARGET_SE = 0.3` · `l2/next_problem_selection.py:72`). 14문항 시점 SE=0.685. 수렴 속도가 후반 문항당 0.0005 수준이라 현행 추정기·문항 정보량으로는 수십~수백 문항이 필요하다. 이 재현을 CLI 또는 테스트로 고정한다.\n② 끊긴 화살표 확정 — SE가 임계에 못 닿으면 `POST /v1/me/assessments/capture`가 항상 `written=False · reason=insufficient_measurement`로 끝나고, 그 분기에서만 호출되는 `provision_learner_state(reason=diagnosis_capture)`가 돌지 않아 `learner_state` 행이 생기지 않는다. 그 결과 `POST /v1/me/objectives/{objective_id}/study`는 `require_learner_state` 게이트에서 영구히 409다. 즉 계획서 §11 페르소나 A의 \"진단 → 학습\" 화살표가 main에서 끊겨 있다.\n③ 처분 3택 중 하나를 근거와 함께 고른다 — (가) 중단 규칙 완화·모드별 차등(SE 임계를 상수 하나가 아니라 목적별로) (나) 정보량 산출·문항 모수(a·b) 교정으로 수렴 속도 자체를 올린다 (다) 문항 수 상한 기반 2차 중단 규칙 추가(최대 N문항이면 SE와 무관하게 확정). 어느 쪽이든 임계를 \"낮춰서 통과시키는\" 것이 목적이 되면 안 된다 — 진단 확정이 측정 근거를 잃는다.\n④ 집행 지점 별항(정본화 != 집행) — 해소 후 `tests/backend/api/test_persona_three_path_completion.py`의 A-5 절이 현재 `written is False`를 계약으로 동결하고 있다. 그 단언을 `written is True` + `learner_state` 1건으로 뒤집는 것까지가 이 태스크의 완료다. 뒤집지 않으면 해소돼도 하네스가 옛 상태를 계속 요구해 빨강이 된다.\n⑤ Gate 2 연결 — 계획서 §18 조건 3(LearnerState 자동 생성)·조건 10(전체 과정 반복 가능)이 이 축에 직접 걸린다. P-16 판정 전에 처분이 나와 있어야 한다."
  - "[정정·정밀화 2026-09-19 · 같은 세션] ②의 \"영구히 409\"는 등재 시점에 **추론**이었다. 실측으로 승격하며 두 가지를 정정한다.\n\n⑥ 실측 승격 — 학습목표 행을 심고 호출한 결과 `409 학습을 시작하려면 먼저 진단을 완료해야 합니다`가 나왔다(learner_state 0건). 시도를 쌓고 capture를 시도한 뒤에도 같다. 즉 D1 → learner_state 부재 → 학습 진입 차단의 사슬은 이제 읽어서 추론한 것이 아니라 측정된 것이다. 회귀 동결 지점 = `tests/backend/api/test_persona_three_path_completion.py`의 A-6 마디.\n\n⑦ 게이트 순서 정정 — `post_study_unit`은 목표 로드(부재 시 404)를 `require_learner_state`(부재 시 409)보다 **먼저** 한다. 그러므로 \"학습 진입이 막힌다\"를 D1의 증거로 쓰려면 목표 행이 실재해야 하며, 그렇지 않은 상태의 차단은 D1과 무관하다. 이 태스크의 완료 판정에서 409/404를 혼동하지 않는다.\n\n⑧ \"도달 불가\"의 범위 명시 — SE 0.391은 **이 회차 픽스처의 문항 풀**(단일 개념·난이도 1.0~5.0 순환·정답률 약 3/4) 실측이다. 정보량이 더 높은 실제 문항 풀에서는 수렴이 빠를 수 있으므로, 처분 판단 전에 **운영 코퍼스 기준 수렴 곡선을 다시 측정**한다. 등재 문구의 \"영구히\"는 그 재측정 전까지 픽스처 조건부로 읽는다."
