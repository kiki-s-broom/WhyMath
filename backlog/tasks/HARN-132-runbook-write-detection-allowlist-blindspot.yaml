notes: "발견 경위: 2026-09-21 게이트 G-eos02-prompt-cache-live-run 실행 준비에서 런북 v2 를 쓰고, 그 런북의 쓰기 가드가 기계로 검증되는지 결함 주입으로 확인하다가 드러났다. 가드를 제거해도 스캐너가 통과를 냈다.\n\n스캐너 자체는 옳은 문제(출력은 흐름을 멈추지 않는다)를 겨냥하고 HARN-106 으로 착지한 장치다. 결함은 목적이 아니라 탐지 방식에 있다 — 토큰 허용목록은 새 명령이 생길 때마다 사각이 늘어난다. CLAUDE.md 「금지 패턴 열거 대신 산출물 검사」가 겨냥하는 형태이며, 같은 파일 주석이 이미 eos02 런북을 예시로 들며 오탐 축을 조정한 적이 있다(2026-09-17) — 그때 오탐은 줄였으나 미탐은 보지 않았다.\n\n실무 영향: LLM 저작 배치 런북은 이 저장소에서 가장 비싼 쓰기다(EOS-121 회차는 180 호출·수천 원). 그 부류가 통째로 가드 검증 밖에 있다.\n\nEOS-02 라이브 회차는 이 태스크를 기다리지 않는다 — 해당 런북의 가드는 실제로 들어 있고 사람이 읽어 확인했다. 이 태스크가 고치는 것은 그 가드가 기계로 동결되지 않는다는 점이다.\n\n[취소 2026-09-21] 중복 — HARN-116-runbook-write-vocab-paid-call-redirect 가 같은 결함(쓰기 어휘 공백)을 2026-09-19 부터 소유한다. 2026-09-21 EOS-02 런북 2회차 실측만 그쪽 notes 에 덧붙인다\n\n[개명 2026-09-22] HARN-127-runbook-write-detection-allowlist-blindspot → HARN-132-runbook-write-detection-allowlist-blindspot: 번호 충돌 해소 — main이 HARN-127-runbook-guard-glob-scope로 이 번호를 이미 갖고 있고(머지 완료), 이쪽은 미머지 브랜치 claude/nifty-mayer-3nz1z7의 동번호 이종 태스크다. HARN-100 규약대로 미머지 쪽을 개명한다. 이 태스크는 status=cancelled로, HARN-116 acceptance ⑥과 중복임이 확인돼 등재 직후 취소된 것이다(PR #1252 본문 「승계」절). 내용 변경은 없고 식별자만 바꾼다. 발견 경위: PR #1252를 main에 병합하는 과정에서 backlog.py validate가 exit 1로 지목했다 — 양쪽 브랜치 각각에서는 validate가 통과했고 병합해야만 드러나는 충돌이다."
