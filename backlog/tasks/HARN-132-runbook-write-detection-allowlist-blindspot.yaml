acceptance:
  - "① 사각 실증 재현 — scripts/ops/check_runbook_blocks.py 의 쓰기 판정이 토큰 허용목록(_WRITE_COMMAND_TOKENS · _WRITE_COMMAND_PAIRS)이라, 목록에 없는 실행기는 돈을 쓰고 파일을 써도 쓰기 블록으로 계상되지 않는다. 2026-09-21 실측: EOS-02 런북의 회차 실행 블록에서 자가거부 가드를 통째로 제거했는데 스캐너가 exit 0 통과를 냈고, 쓰기 블록 집계는 19개로 변하지 않았다(주입 전후 동일). 이 재현을 회귀 테스트로 고정한다.\n② 판정 축 전환 — 명령 이름 열거 대신 산출물·효과 기준으로 판정한다. 최소한 다음이 쓰기로 잡혀야 한다: 저작 배치 실행기(whymath_backend.harness.problem_corpus_accumulate 등 --out 인자로 파일을 쓰는 모듈 실행), Tee-Object -FilePath, Copy-Item, Move-Item, Add-Content, 리디렉션 연산자로 파일을 만드는 형태. 판정 근거를 주석에 남긴다.\n③ 오탐 대조군 — 읽기 전용 블록이 새 규칙에서 쓰기로 오인되지 않는지 확인한다. 특히 현행 런북 14건이 새 규칙에서 어떻게 재분류되는지 전건 출력하고, 새로 위반이 되는 블록은 waive 가 아니라 가드 추가로 해소한다(만료 없는 유예 금지).\n④ 뮤테이션 전건 RED — ②에서 추가한 각 판정 형태마다 그 형태를 쓰는 블록에서 가드를 제거해 RED 가 나오는지 확인한다. 형태별로 픽스처를 따로 둔다 — 한 형태의 픽스처가 다른 형태의 절을 밟지 않는다."
