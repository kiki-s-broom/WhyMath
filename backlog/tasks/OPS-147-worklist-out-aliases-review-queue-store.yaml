notes: "등재 경위(2026-10-15): 게이트 G-eos23-rejected-quad-sum-classification 실행 중 Kiki 머신의 anthropic.review.jsonl이 JSONL이 아니라 마크다운 뷰임이 드러났다(분류기 CLASSIFY_EXIT=2 · 257줄 전건 JSONDecodeError). 원인 = EOS-121 런북이 --out anthropic.jsonl과 --worklist-out anthropic.review.jsonl을 같은 경로로 지정(큐 정본 기본 경로 = <out>.review.jsonl)해, 회차 끝 worklist_path.write_text(problem_corpus_accumulate.py)가 정본을 덮어씀. 코드에는 두 경로의 동치를 막는 장치가 없었다. 분류 결과와 한계는 docs/reviews/eos23_quad_sum_rejection_classification_2026-10-15.md. 정본 소실로 EOS-23 ③은 분류기 대신 뷰 기반 수작업 분류로 판정됐다 — 향후 회차에서 같은 일이 없도록 이 태스크가 코드로 막는다."
