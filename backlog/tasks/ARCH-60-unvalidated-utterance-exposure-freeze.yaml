acceptance:
  - "① 현행 실측·정오 판정 — LLM이 만든 문자열이 학생 응답으로 나가는 경로를 전건 열거하고(개수와 검색 방법을 함께 기록 — 절단 출력로 부재 판정 금지), 각 경로를 3분류한다: (a)게이트를 통과한 뒤에만 승격 (b)게이트 없이 승격(위반) (c)학생 대면이 아님(진단·배틀·리포트 전용). 소스를 읽어 추론한 것은 '읽어서 그렇게 보인다'로 범위를 밝혀 적는다.\n② 위반 처분 — ①의 (b)가 0건이 아니면 이 태스크에서 막거나 해소 태스크로 분리 등재한다. 0건이면 그 사실을 근거와 함께 기록한다.\n③ 집행 배선 — 'LLM 생성 문자열은 검증 게이트를 통과한 것만 학생에게 노출된다'를 AST 전수 가드로 동결한다. 금지 문자열 열거가 아니라 구성된 결과(승격 지점의 제어 흐름에 게이트 호출이 실재하는가·게이트 반환값이 실제로 분기 조건으로 쓰이는가)를 검사한다. 게이트를 호출만 하고 결과를 버리는 형태도 위반으로 잡는다.\n④ 스캔 0건 실패 — 대상을 하나도 못 찾으면 exit 1/RED. 전수 가드가 공허하게 통과하는 상태를 금지한다(test_proxy_ca_optional.py 선례).\n⑤ 결함 주입 실증 — 게이트 제거·반환값 무시·조건 반전 등 우회 형태를 각각 주입해 RED를 확인하고, 주입이 실제 적용됐는지(mutated != original)·원복이 바이트 동일한지를 하네스가 단언한다. 절마다 그 절이 없으면 통과해 버리는 반례를 픽스처에 넣는다(2026-09-07 픽스처 접촉 규칙).\n⑥ CI 배선 실재 확인 — tests/infra는 infra-contracts 잡이 항상 실행한다. 이 파일이 그 잡에서 실제로 수집·실행되는지 확인한 것까지가 완료다(OPS-03·OPS-10).\n⑦ 범위 밖 동결 — 신규 PRM 엔진 0 · 신규 Agent 계층 0(Phase 2 원문 §15) · 발화 내용·톤 변경 0 · Assessment/Mastery 로직 변경 0 · 새 검증기 신설 0(기존 게이트를 동결하는 태스크이지 게이트를 만드는 태스크가 아니다) · 산문 docstring 추가만으로 완료 선언 금지."
  - "[진행 기록 2026-09-19 · 판정 기준: main df374448] ①②의 실측 결과 — LLM이 만든 문자열이 학생 응답으로 나가는 좌석은 **2건**이고 위반(b)은 **0건**이다. 검색 방법: (i) 역할 기반 — 백엔드 프로덕션 .py 전수(rglob)를 ast로 파싱해 filter_tone을 *호출*하는 모듈 집계(재수출·docstring 언급 제외) (ii) 소비자 역추적 — api/ 에서 LLM 텍스트를 응답에 싣는 호출처 grep (iii) Wh1LlmSeam·l3.pipeline 소비자 전건 열거. 결과: (a)게이트 통과 후 승격 2건 = harness/wh1_primary.py::run_wh1_primary_turn(verify 의무 §3.1 → 정답 억제 §3.4 → 프로즈 정책 게이트 → 금지모드 가드 → filter_tone) · l4/polya/engine.py::PolyaCoach.coach(LLM 원문 → filter_tone). (c)학생 대면 아님 = l4/misconception/judge_seam(오개념 후보 분류) · l5/ocr/recognize(인식) · l4/content_supply(저작·검수 게이트가 별도 축) · l3/equivalent/rephrase(저작). 소스를 읽어 판정한 것이므로 '읽어서 그렇게 보인다' 범위다 — 라이브 트래픽 표본은 보지 않았다.\n[진행 기록 2026-09-19] ③~⑥ 착지 — tests/infra/test_unvalidated_utterance_exposure.py(17건) 7절 AST 전수 가드. 절 A 최종 게이트 도달 · B 프로즈 게이트 반환값 소비 · C verify 의무의 선행(순서) · D 정답 억제 백스톱 + verdict 집합 동결 · E Polya 엔진 최종 게이트 · F 톤 게이트 좌석 baseline · G 승격 값의 출처. ⑤ 주입 M1~M15 15종 전건 RED·생존 0(하네스가 치환 count·mutated != original·원복 바이트 동일을 매 건 단언). ⑥ infra-contracts 잡은 needs 게이팅이 없어 항상 pytest tests/infra를 수집·실행한다.\n[미이행 · 정직 기록] ARCH-46(라우터 축)·ARCH-59(권위 축)와 달리 이 가드는 *새 학생 대면 좌석의 신설*을 절 F(좌석 baseline)로만 본다 — 누군가 filter_tone을 거치지 않는 완전히 새로운 학생 대면 LLM 경로를 만들면 절 F는 그것을 보지 못한다(baseline이 늘지 않으므로). WH-1 축은 절 A+G 조합으로 닫혀 있고(승격되는 값은 run_wh1_primary_turn 반환뿐) Polya 축은 절 E가 닫는다. 이 잔여를 메우려면 '학생 대면 응답 필드의 생산자 등록부'가 필요하며 그것은 P-11(API 표면 정리)의 소유다."
