  - "[범위 축소 2026-09-06 · 등재 직후] ②항(title 정정 경로)은 **HARN-57 ⑤가 이미 소유**한다(2026-09-03 등재 — 'SessionStart 브리핑과 next가 노출하는 것은 title 한 줄이라 paths보다 위험도가 높다'). 중복 구현 금지 — ②는 **범위 밖**으로 내리고 이 태스크는 ①(acceptance 항 폐기 표시) 축만 소유한다. HARN-57은 artifacts·--no-pr·paths·title 4축을 다루고 acceptance 항 축은 다루지 않으므로 ①은 중복이 아니다. 발견 경위: backlog.py add의 의미 중복 고지가 HARN-57을 유사도 0.14로 지목 — 고지가 실제 중복을 잡은 사례"
  - "[근거 보강 2026-09-08 · HARN-88 취소분 승계] 같은 공백이 다른 형태로 한 번 더 실증됐다. `HARN-87` acceptance ④를 등재할 때 bash 인자의 마크다운 백틱이 명령 치환으로 실행돼 식별자 4개(`*/15`·API 경로·`workflow_dispatch`·`push: branches: [main]`)가 빈 문자열로 저장됐다 — \"cron은 라 2~3회 발화했어야\" 같은 무의미 문장만 남았고 CLI는 정상 종료했다. `--acceptance`가 append 전용이라 **되돌릴 경로가 없어** 정정본 ⑤를 덧붙이는 것으로만 수습했고, 손상된 ④가 활성 항으로 남았다.\n\n그 뒤 ⑥(과신한 결론)을 ⑦로 철회했을 때 PR #1057 Codex P2가 정확히 이 구조를 지적했다: **\"⑦을 append해도 ⑥은 그대로 활성 acceptance로 남으므로, 정본에 서로 배타적인 두 요구가 동시에 존재한다 — 실행자가 이전 항을 먼저 읽으면 이번 변경이 막으려는 조기 도입을 그대로 수행한다.\"** ARCH-31(#1012)에서 이 태스크를 낳은 것과 **같은 형태의 2회차**다.\n\n즉 이 태스크의 ①(폐기 표시)은 \"대조표가 길어진다\"는 가독성 문제가 아니라 **정본이 모순을 담는 문제**다. 우선순위 재고 근거로 남긴다(현재 priority 3).\n\n한편 취소된 HARN-88은 `--acceptance-replace`의 빈 문자열 치환으로 **항 삭제**를 제안했는데, 그것은 이 태스크 ④가 의도적으로 닫아 둔 축이다(HARN-20 사고 이후 append 전용은 결함이 아니라 설계). 폐기 표시(tombstone)와 삭제는 다르다 — 이 태스크의 경계를 그대로 유지한다."
