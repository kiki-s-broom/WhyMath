acceptance:
  - "① `ci_job_coverage.py scope`가 **변경 파일 0건이면 exit 2**로 끝나고 \"판정 대상 없음 — `--diff-base`가 커밋되지 않은 변경을 못 보는지, `--changed-file`을 빠뜨렸는지 확인\" 사유를 낸다. 의도적 0건은 `--allow-empty`로만 통과(스캔 0건은 실패 규칙) ② 표준 입력이 파이프인데(`not sys.stdin.isatty()` + 읽을 데이터 있음) `--changed-file`이 없으면, 조용히 무시하지 않고 exit 2로 거부하거나 `--stdin` 플래그로 명시 소비한다(둘 중 택1, 선택 근거를 docstring에) ③ 판정 머리말에 건수만이 아니라 **사용한 변경 파일 목록 전체**를 출력하고, 미커밋(staged·unstaged) 변경이 diff-base 계산에서 빠졌으면 그 건수를 경고로 낸다 ④ `ci_mirror.py`가 scope를 내부 호출하는 경로도 같은 규칙을 따르는지 확인 ⑤ 변별력: 0건 입력·파이프 입력·미커밋 변경만 있는 트리 3종 픽스처가 각각 exit 2/거부/경고를 내는지 단언 + 정상 입력 대조군 exit 0 + 각 가드 제거 뮤테이션 RED"
