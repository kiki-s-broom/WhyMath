notes: "사고 2026-09-25(series ci-local-repro-gap, 3회차): PR #1305 로컬 검증에서 변경을 staged만 한 상태로 `git diff --cached --name-only | ci_job_coverage.py scope`를 실행했다. scope는 stdin을 읽지 않고 기본 `--diff-base origin/main`으로 커밋된 diff(0건)를 계산해 **변경 파일 0건·exit 0**으로 상시 잡 6개만 제시했고, 세션은 출력을 `tail -15`로 잘라 머리말의 \"변경 파일 0건\"을 보지 못한 채 backend 잡을 범위 밖으로 판단했다. 같은 파일 3건을 `--changed-file`로 넣으면 backend·backend-migrations가 \"닿음\"으로 나온다(2026-09-25 재실측). 실제 CI에서 backend가 돌았고, 마침 외부 원인(SQLAlchemy 2.1.0)으로 red였다. 도구의 조용한 기본값과 절단 판독이 겹친 형태 — HARN-109가 만든 도구의 입력 축 사각. HARN-109·HARN-119 후속."
