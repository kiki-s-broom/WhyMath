notes: "출처: 2026-09-29 HARN-192(게이트 ID 중복) ③ 교차 브랜치 시뮬레이션 중 부수 발견. 임시 git 저장소에서 두 브랜치가 gates.yaml의 같은 자리에 같은 게이트를 삽입하게 하고 충돌 마커 줄만 지워 병합했더니, 블록이 2개가 아니라 1개였고 validate가 green이었다(게이트 4건). git이 공통 줄을 합치고 title 줄만 충돌로 남기므로 마커만 지우면 title 키가 둘인 블록이 된다.\n\n[실측] 위 병합 파일을 직접 열어 확인하지는 않았다(블록 수 1·validate green으로부터의 추론). 로더 동작은 별도로 실측했다: store._load_yaml이 title이 둘인 gates 블록을 읽으면 결과가 {'gates': [{'id': 'G-x', 'title': '뒤 제목'}]}이다. 오류·경고 없이 뒤 값이 이긴다. 즉 병합 충돌을 줄 단위로 서둘러 풀면 앞 정의가 조용히 사라진다.\n\n[경계] HARN-192는 같은 id의 블록 단위 중복(사전 대입 덮어쓰기)만 다룬다. 이 태스크는 그보다 아래 층, 한 블록 안의 키 중복이다. 두 결함은 원인이 다르고 한쪽 수정이 다른 쪽을 막지 못한다(시뮬레이션에서 HARN-192 수정 후 하네스도 이 케이스는 green이었다).\n\n[범위 명시] 정책·인시던트 등 대장 밖 YAML 로더가 같은 취약점을 갖는지는 확인하지 않았다 — acceptance ①이 착수 시 판정하도록 남겼다."
