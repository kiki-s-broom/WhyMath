# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-203-yaml-duplicate-key-silent-override
title: "대장 YAML의 한 블록 안 중복 키를 로더가 조용히 덮어쓴다 — yaml.safe_load는 뒤 값이 이기고 오류가 없다(HARN-192 ③ 시뮬레이션에서 부수 발견)"
