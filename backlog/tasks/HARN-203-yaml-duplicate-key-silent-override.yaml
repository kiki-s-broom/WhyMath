acceptance:
  - "① 검출 — 대장 YAML 로더가 같은 매핑 안에서 같은 키를 두 번 만나면 오류로 올린다. 오류에는 파일명과 중복된 키 이름이 들어간다. 대상은 backlog/tasks·gates.yaml·tracks.yaml 로드 경로(store._load_yaml)이며, 정책·인시던트 등 다른 로더까지 넓힐지는 착수 시 판정해 적는다. 현재 yaml.safe_load는 뒤 값이 이기고 오류가 없다(2026-09-29 실측: title이 둘인 게이트 블록이 뒤 값 하나로 로드됨).\n② 회귀 테스트 — 중복 키 픽스처는 RED(수정 전 코드에서 GREEN임을 먼저 확인해 결함 재현을 증명), 키가 서로 다른 대조군은 GREEN. HARN-192의 블록 단위 ID 중복 테스트(TestGateIdDuplicate)와 같은 관례를 따른다.\n③ 기존 대장 전건 실측 — 검사를 켜기 전에 실제 backlog/ 전체(태스크 900건대·게이트·트랙)에 중복 키가 0건인지 먼저 센다. 0건이 아니면 검사를 켜는 순간 main이 red가 되므로 정정 경로를 함께 정한다.\n④ 변별력 — ①의 검사를 제거·약화하는 뮤테이션이 ②의 테스트를 RED로 만드는지 확인한다(주입 적용 단언 · 원복 바이트 동일)."
