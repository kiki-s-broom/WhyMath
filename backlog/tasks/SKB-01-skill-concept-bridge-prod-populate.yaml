  - "③-보정(2026-09-11 실측, Kiki 런북 준비 중 코드 검증): concept_graph.populate 재실행으로는 concept.behavior_skills를 채우지 못한다 — 런타임 정본 atom_graph_v1/graph.json(2,683건)에 behavior_skills 필드 자체가 없음(grep 0건 직접 확인). 그 필드가 있는 것은 구 코퍼스 concept_graph_v1/graph.json(437건, 404/437 비어있지 않음)뿐이며, populate CLI는 --graph로 넘긴 파일의 필드를 그대로 upsert할 뿐이다. S0-2(concept_atom_crosswalk/transfer.py)가 이미 behavior_skills를 전파하지만 그 UPDATE 대상은 atom_node.behavior_skills·concept_content.atom_codes(별개 테이블 2종, transfer.py 36-39행 명시)이지 concept 테이블이 아니다 — concept.behavior_skills(EOS-63이 측정한 그 컬럼)를 채우는 코드 경로는 저장소에 없다(populate.py·transfer.py 전수 확인 + 역할 기반 검색 0건). 착수 세션은 ①atom_node→concept 동기화 코드 신설 또는 ②atom_graph_v1/graph.json 재생성 파이프라인에 behavior_skills 필드 병합 중 하나를 스코프에 포함해야 하며, 이는 human gate(prod 쓰기)가 아니라 코드 작업이다. skill_node populate(acceptance③ 전반부)는 이 문제와 무관하게 그대로 게이트 실행 가능(python -m whymath_backend.l1.skill_graph.populate --graph data/corpus/skill_graph_v1/graph.json, WHYMATH_DATABASE_URL 사용·dry-run 없음, 확인 완료)."
  - "③-보정2(2026-09-12 코드 착수·claude/friendly-hypatia-hlqsqf): ③-보정이 지목한 옵션 ①(atom_node→concept 동기화 코드 신설)을 구현했다. concept.behavior_skills를 채우는 코드 경로가 저장소에 없다는 진단은 정확했으나, 정정할 위치는 l1/concept_graph가 아니라 l1/atom_graph/atom_backend_concept.py였다 — 이 모듈이 실제 런타임 concept(2,683행·atom backbone) 적재기이고 concept_graph/backend_concept.py는 이미 [LEGACY_SNAPSHOT·non_runtime](S0-4b, 런타임 소비처 0)로 격하돼 있었다. atom_backend_concept.py는 behavior_skills 컬럼을 아예 건드리지 않아(INSERT/SET 미등장) 신규 행이 server_default '{}' 그대로 남는 것이 근본원인이었다.\n해법: l1/concept_atom_crosswalk/transfer.py에 CrosswalkTransferStore.update_concept_behavior_skills()·transfer_concept_behavior_skills()를 신설 — atom_node.behavior_skills와 *같은* derive_atom_behavior_skills() 매핑(atom code 키)을 재사용해 concept.behavior_skills를 UPDATE한다(concept.code가 atom code와 같은 키 공간이라 별도 다리 불요). concept_atom_crosswalk/populate.py CLI에 세 번째 이전 스텝으로 배선. hermetic 단위테스트 6종 추가(UPDATE-not-INSERT·updated_at 컬럼 부재 확인·missing 보고·사전순·wrapper·CLI 배선) + 통합테스트 1종 확장 — 44건 전부 통과(ruff·black·mypy 클린). paths에 l1/concept_atom_crosswalk/** 추가(실제 수정 위치가 원래 paths 밖이었음 — 태스크 등재 시점엔 atom_backend_concept.py의 존재를 몰랐다).\nprod 반영은 새 게이트 G-skb01-concept-behavior-skills-populate(PR 병합 후 실행)로 위임 — 이 PR 자체는 prod DB 쓰기가 없다(코드+테스트만). 런북: docs/ops/g_skb01_concept_behavior_skills_populate_runbook.md. 이 게이트가 clear되고 CLI 출력의 AFTER_NONEMPTY>0이 확인되기 전까지 acceptance③(후반부)·④는 미완이다."
