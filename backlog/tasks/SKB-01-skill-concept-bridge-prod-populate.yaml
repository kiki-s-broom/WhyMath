notes: "출처: G-eos63-skill-event-reach-sample 실측(2026-09-10, Kiki 실행·claude 진단). 런북(docs/ops/eos63_skill_event_reach_sample_runbook.md) 그대로 실행한 결과 — writer_reach=100%(20/20)·resolution=0%(0/20, 전부 기록·해소 0건). 판정표(런북 §4)에 따르면 이는 '전환 보류 — 대책은 코드가 아니라 브리지 데이터 보강' 케이스. 원인 확인 쿼리(read-only, whymath-pg): skill_node_total=0·skill_node_estimable=0·concept_total=2683·concept_with_skills=0. skill_node 테이블이 prod에 전혀 적재된 적이 없고, concept.behavior_skills도 전량 빈 배열이다. EOS-63은 이 태스크가 done되고 해소율이 실측으로 0%를 벗어나기 전까지 착수 보류한다(EOS-63 acceptance②의 '기록 0건 상태에서 소비를 바꾸면 스킬 숙달 전파가 죽는다' 경고가 정확히 이 상태).\n\n[정정 2026-09-10] 겹침 고지 반영 — EOS-43(미머지 브랜치 claude/g-eos49-content-version-seat-zvknzk)이 같은 게이트(G-eos63)를 대상으로 '격리 DB 측정' 전략을 이미 등재했으나, 그 전제(2026-09-09 실측: prod problem/attempt 전수 0건)는 2026-09-10 오늘 같은 게이트 회차에서 prod에 실제 후보 문제 20건이 존재해 무효화됐다 — 실측이 prod 직접 실행(런북 그대로)으로 성립해 EOS-43의 격리 DB 우회가 더 이상 필요 없다. 이 태스크(SKB-01)는 EOS-43과 달리 '측정 방법'이 아니라 '측정으로 드러난 브리지 데이터 공백의 해소'가 스코프라 범위가 다르다. EOS-43은 그 소유 세션이 병합 시 본 실측을 근거로 재판단해야 한다(취소 권한이 이 세션에 없음 — 미머지 타 브랜치).\n\n[정정 2026-09-11] Kiki용 G-skb01-bridge-populate 런북 작성 전 코드 검증에서 발견 — concept_graph.populate 재실행은 목표(concept.behavior_skills 채우기)를 달성 못하는 것을 실측 확인. 반쪽짜리 런북으로 prod에 무의미한 쓰기를 넣지 않기 위해 acceptance를 보정하고 Kiki에게는 skill_node populate만 안내한다.\n\n[정정 2026-09-11 후속] 위 발견(atom_graph_v1/graph.json에 behavior_skills 필드 부재)을 SKB-02-atom-graph-behavior-skills-merge로 분리 등재해 depends_on에 집행(같은 근본원인을 두 세션이 독립적으로 실측 확인 — 서로 다른 해법 축 ①atom_node→concept 동기화 vs ②graph.json 재생성 병합 중 ②를 SKB-02가 담당). SKB-02는 커밋된 graph.json을 후처리 병합하는 방식으로 완료해 PR #1127로 머지 대기 중 — 원본 xlsx가 휘발돼 transform-v1 재실행이 불가하므로 corpus 후처리가 유일한 경로였다(university_standard_fill.py U2와 동형 제약). 병합 후 실측: 크로스워크 437행(unmapped 0) → 원자 1,311건 매핑· 1,198건 nonempty. PR #1127이 머지돼야 acceptance③의 concept_graph.populate 재실행이 실제 효과를 낸다 — 그 전까지는 이 노트의 '③-보정' 지침(skill_node populate만 안내)이 유효하다.\n\n[정정 2026-09-12] paths ['src/backend/whymath_backend/l1/skill_graph/**', 'src/backend/whymath_backend/l1/concept_graph/**'] → ['src/backend/whymath_backend/l1/skill_graph/**', 'src/backend/whymath_backend/l1/concept_graph/**', 'src/backend/whymath_backend/l1/concept_atom_crosswalk/**', 'src/backend/whymath_backend/l1/atom_graph/**']: 코드 착수 결과: 실제 수정 위치는 atom_graph/atom_backend_concept.py(런타임 정본)·해법은 concept_atom_crosswalk/transfer.py 신설 함수(옵션①) — SKB-02의 graph.json 병합(옵션②)과는 별개 경로로, concept.behavior_skills는 atom_node.behavior_skills를 직접 재사용해 채우므로 SKB-02 완료 여부와 무관하게 유효하다. 새 human gate로 prod 실행 위임. 기존 두 경로는 유지하고 두 경로를 추가(교체 아님).\n\n[정정 2026-09-12] 코드 착수분 PR 오픈 — prod DB 쓰기 없는 코드+테스트+문서(concept.behavior_skills 전파). 태스크는 in_progress 유지(새 게이트 대기)."
