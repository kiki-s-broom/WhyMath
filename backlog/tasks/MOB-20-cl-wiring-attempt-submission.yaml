  - "⑤ [범위 정정 2026-09-03 · PR #976 리뷰 P1 수용] **acceptance ①은 무효다.** 'Flutter가 POST /v1/me/attempts를 호출한다'를 그대로 구현하면 **attempt·숙달 이중 적재**가 된다 — 학생 경로의 attempt는 이미 코치 완료 경로가 적재한다(S3-32 done · api/coach.py:983-1030 _complete_problem → ProblemAttempt(is_correct=True) + 숙달 2축 + 문제시도 이벤트). API 계약이 '클라는 별도로 POST /v1/me/attempts를 부르지 않는다(중복 적재 금지)'를 명문화한다(api/coach.py:440-446). **정정된 범위 = CoachResponse 완료 신호 3필드의 클라 소비**: problem_complete(완료·다음 문항 진행 신호) · awaiting_reflection(돌아보기 대기 UX) · completed_attempt_id(적재된 attempt 참조). 실측 근거 = lib/features/chat/data/coach_models.dart 3필드 grep **0건** · chat_screen.dart:302-304의 자인 주석('그 두 상태는 S3-32 소관이라 main엔 아직 없다 — 착지 시 같은 조건을 이 가드에 추가할 것'). 이는 S3-32 acceptance ③('CoachResponse에 completion 신호 필드 추가해 클라가 next-problem을 자동 호출할 수 있게 한다')의 **미이행된 클라 절반**이다. acceptance ②(응답 소비)·③(세션 축 정직)·④(변별력)는 그대로 유효하되 대상이 attempts 응답이 아니라 CoachResponse다"
  - "⑥ [acceptance ④ 실증 완료 2026-09-03 · CI 뮤테이션] 로컬에 Flutter SDK가 없어(컨테이너 실측) flutter test를 돌릴 수 없으므로 변별력을 **CI 라운드로** 실증했다. 절차: green(847efaea) → 뮤테이션 커밋(2bc16a91 · chat_controller의 완료 신호 이전 블록 주석 처리) → **RED** → revert(58259780) → green 복귀. 결과 **393 passed / 9 failed**(예측 컨트롤러 3 + 위젯 5 + e2e 1 = 9와 일치). 이름으로 확인한 8건은 전부 coach_completion_signal_test.dart — 컨트롤러 3(신호 이전·순서 갱신·실패 시 미잔존) + 위젯 5(돌아보기 안내·완료 어포던스·탭 이동/비움·신호 스코프·입력 잠금). **9번째는 로그 tail 범위 밖이라 이름을 보지 못했고 9-8=1의 산술 추정이다(e2e 불변식 ⑥ 추정) — 본 것과 추정을 구분해 적는다.** 대조군('신호 없으면 선택지 보임') 1건은 뮤테이션에서도 통과 = 모든 입력에서 초록인 가드가 아님을 반대 방향으로 확인"
  - "⑦ [리뷰 P1 2건 수용 2026-09-03 · PR #979] 초판에 실결함 2건이 있었고 코드 실측으로 확인해 고쳤다. (가) 완료 신호가 문제에 스코프되지 않아, 학생이 홈에서 다른 문제를 열면(problem_screen.dart:83이 activeProblemProvider만 교체 · router.dart:128 StatefulShellRoute가 탭 상태 보존 · provider는 autoDispose 아님) 이전 완료 패널이 새 문제 위에 남아 **새로 고른 문제를 건너뛰게** 만들었다 → CoachCompletionSignal에 problemId 각인 + 화면이 appliesTo()로 렌더 시점 대조(리스너 경합 없음). (나) 완료 후에도 턴 생성 입력이 열려 있어 한 턴 더 보내면 서버 already_completed(coach.py:2630 · l4/completion.py:150) no-op으로 problem_complete=false가 돌아와 **유일한 진행 경로가 사라진 채 끝난 세션에 묶였다** → 입력바·OCR 잠금(둘 다 _dispatch 경유 · 장면 요청은 턴을 안 만들어 제외). 회귀 테스트 2건 신설(총 12건)"
