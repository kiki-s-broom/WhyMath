notes: "출처: CLAUDE.md '미머지 존재를 충족으로 단정 금지'(2026-09-06 등재)의 집행 지점. 사고 경위 = 2026-09-05 Gate 0 A~E 검토가 미머지 EOS-91(PR #986)을 Gate 0-B 근거로 달았고, 같은 세션의 '고아 3건 소유자 부여 완료' 보고도 ARCH-38·39·OPS-61 전부 미머지였다. main 기준 실제 변화는 ARCH-37 하나. Kiki 지적: '미머지 PR로 게이트를 닫지 마십시오 — 판정에는 시점이 붙어야 한다.'\n\n[차단 2026-09-06] 1세션=1태스크 규약(validate 위반 1건 실측) — 같은 브랜치에서 HARN-66과 동시 claim은 거부된다. HARN-66(ADR 번호 검사) 착지 후 재착수한다. 두 태스크는 같은 축('판정 근거가 원격/trunk에 있는가')이라 한 PR에 담을 수 있으나, claim은 순차여야 한다.\n\n[정정 2026-09-06] block 사유에 'HARN-66 착지 후 재착수'를 산문으로 적고 depends_on에 넣지 않아 audit-deps(HARN-52)가 거부 — 규칙대로 하드 의존을 부착한다. 선행의 실체는 기술적 의존이 아니라 순서 제약이다: 두 태스크는 같은 축이라 한 PR에 담기로 했고, 1세션=1태스크 규약상 claim이 순차여야 한다. HARN-66 착지 후 HARN-68을 재착수한다."
