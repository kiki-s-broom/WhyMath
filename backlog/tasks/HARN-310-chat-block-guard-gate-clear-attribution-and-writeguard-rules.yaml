acceptance:
  - "① 결함 고정(2026-10-12 G-const-precedence-declaration 게이트 clear 안내에서 실측된 채팅 블록 결함 3건, 전부 에이전트가 Kiki에게 채팅으로 건넨 PowerShell 블록): (a) `backlog.py gates clear`에 `--as kiki`가 빠져 대장에 `cleared_by: claude`로 기록됐다 — Kiki가 직접 실행했는데 에이전트 중계로 기록됐고, 정정은 Kiki 머신의 전용 worktree에서 `--as kiki`로 재기입해 PR로 올리는 우회 경로를 밟았다(append 전용 이벤트 대장이라 원 기록은 로컬에서 폐기). (b) 쓰기 블록의 자가거부 가드가 변경 파일 집합을 `git diff --name-only`로 검사했는데 이 명령은 추적 전 새 파일(이벤트 샤드)을 보여주지 않아 정상 상태를 거부했다 — 안전한 거부였으나 1왕복 손실. (c) 같은 가드가 `$Ev = if (…) { @(Get-Content …) }`로 받은 값을 `$Ev[0]`으로 인덱싱했는데 PowerShell이 한 줄짜리 배열을 스칼라로 풀어 `$Ev[0]`이 첫 줄이 아니라 첫 글자가 돼 검사가 항상 False였다(추정 — 이 환경에서 재현은 하지 못했고, 블록을 `Get-Content -Raw` 전체 문자열 검사로 바꾸자 통과했다) — 역시 안전한 거부, 1왕복 손실. 읽어서 확인한 사각: HARN-83은 저장소에 커밋된 문서·런북 속 명령만 정적 검사하고, chat_block_guard.py(HARN-163)에는 gates clear·--as 언급이 0건이며 규칙이 상태 전환(HARN-163)과 쓰기 뒤 파괴 단계(HARN-300)에 한정돼 있다. 즉 채팅으로 건네는 gates clear 명령과 쓰기 블록의 검사 코드 품질은 코드가 보는 곳이 없었다(내가 찾은 방법으로는 0건)."
  - "② 규칙 A — gate clear 주체: chat_block_guard에 규칙을 추가해, 실행 의도 태그 펜스 안의 `backlog.py gates clear <게이트 id>` 명령이 같은 명령(줄 이어쓰기 포함, 줄 한정)에 `--as <owner>`를 갖지 않으면 위반으로 판정한다. 판정 함수는 HARN-83이 이미 동결한 순수 함수(tests/harness/test_gate_clear_command_attribution_wiring.py의 _as_flag_violations·_CONCRETE_CLEAR)를 재사용하거나 공용 위치로 올려 두 곳이 같은 정규식을 쓰게 한다 — 정규식이 둘이면 한쪽이 낡는다. HARN-83의 교훈 그대로 tail 정규식은 줄 한정이어야 한다(\\s가 개행을 넘으면 산문 속 --as 한 번에 공허하게 통과한다). 정상 형태 반례를 픽스처에 넣는다: `--as`가 이어쓰기 다음 줄에 있는 명령, 같은 블록의 다른 명령(예: 다른 게이트)에만 --as가 있는 경우."
  - "③ 규칙 B — 신규 파일 맹점: 쓰기 블록(git add·commit·push 중 하나 이상 포함)이 변경 파일 집합을 git diff --name-only·--stat·--numstat 결과의 비교로 판정하는데 같은 블록에 git status --porcelain·ls-files --others·--untracked-files 중 어떤 것도 없으면 위반으로 판정한다. 먼저 탐지 가능성과 오탐률을 실제 대화 기록(transcript) 표본으로 측정한다 — 오탐이 허용 못 할 수준이면 구현하지 않고 '탐지 불가'와 근거(표본 수·오탐 사례)를 notes에 남긴다. 억지로 구현해 상시 발화하는 가드를 만들지 않는다(CLAUDE.md 상시 실패하는 fail-open 보호 금지)."
  - "④ 규칙 C — PowerShell 스칼라 풀림: `$x = if (…) { @(…) }` 또는 `$x = @(…) | …`처럼 파이프·식 결과를 변수에 받은 뒤 `$x[0]` 등 인덱스 접근이나 .Count와 요소 접근을 함께 쓰는 블록에서, 변수 정의가 `$x = @(…)` 전체 감싸기 형태가 아니면 위반으로 판정한다. ③과 같은 방식으로 탐지 가능성·오탐률을 먼저 측정하고 불가하면 구현하지 않는다. 정상 반례를 픽스처에 넣는다: `$x = @(git status --porcelain)`(감싸기 있음), 인덱스 접근이 없는 변수."
  - "⑤ 변별력: 규칙마다 위반·정상 양방향 픽스처를 두고, 위반 픽스처는 ①의 실제 사고 블록 원문을 쓴다. 규칙 제거·정규식 약화 뮤테이션을 주입해 RED를 확인하되 하네스가 적용 실재(치환 1건, mutated != original)와 원복 바이트 동일을 전후 단언한다. 전건 RED를 커버리지로 읽지 않는다 — 규칙마다 실세계에서 몇 가지 형태로 나타나는지 열거하고 형태별 픽스처를 둔다(CLAUDE.md 기존 규칙: 픽스처가 그 절을 밟는가)."
  - "⑥ 집행 지점(②~④의 정본화와 별항): 규칙이 실제 Stop 훅 경로에서 발화한다는 배선 테스트 — 등록된 훅 명령 문자열을 그대로 실행해 위반 transcript에서 종료 코드 2, 정상 transcript에서 종료 코드 0을 단언하고(HARN-308 방식), 위반 로그 chat_block_violations.jsonl에 규칙 id가 남는지 확인한다. 훅이 실패하면 막지 않는(fail-open) 기존 동작은 유지하되 예외 타입명을 로그에 남긴다. 완료 선언 전에 이 배선 테스트가 CI의 어느 잡에서 도는지 확인한다."
  - "⑦ 범위·한계: CLAUDE.md에 새 산문 규칙을 추가하지 않는다(2026-09-20 신규 산문 규칙 등재 동결 — 대책은 코드와 태스크만). 이미 화면에 나간 답변은 지울 수 없으므로 이것은 예방이 아니라 탐지·재작성 강제·기록이다(HARN-114와 같은 한계). 같은 사고에서 나온 네 번째 결함, 즉 에이전트가 새 버전을 안내했는데 Kiki가 이전 버전 블록을 다시 붙여넣은 혼선은 이 태스크가 코드로 막지 못한다 — 블록 첫 줄에 버전 식별 출력을 두는 방안의 효용은 ②~④ 착지 후 별도 판정한다."
