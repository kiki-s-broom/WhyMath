# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-111-task-number-reservation-race
title: "태스크 번호 배정의 24초 경합 — add가 배정한 번호가 push 전까지 다른 세션에 안 보여 EOS-108이 두 태스크에 중복 배정됐다 (동일 유형 3회차 · 기계 집행 필요)"
