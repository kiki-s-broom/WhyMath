acceptance:
  - "① `backlog.py add`가 배정한 번호가 **push 전까지 다른 세션에 보이지 않는** 사각을 닫는다. 현행 `add`는 그 사각을 stderr로 정직하게 경고하지만(경고 문면 실재), 경고는 경합을 막지 못한다 — 실측된 경합 창은 24초였다.\n② 대책 후보를 **측정 근거와 함께 판정**한다(하나를 고르고 사유를 남긴다): ⓐ`add` 시점에 번호를 원격에 예약한다(`start`가 `refs/claims/*`에 쓰는 것과 같은 방식의 경량 ref — 예약이 실패하면 fail-open이 아니라 번호를 다시 고른다) ⓑ `scripts/harness/adr_number_check.py`가 이미 하는 **원격 전 브랜치 스캔**을 태스크 번호로 확장해 `harness-integrity` 잡이 교차 브랜치 충돌을 CI에서 잡는다(사후 검출) ⓒ 둘 다. ⓐ는 사전 예방이고 ⓑ는 사후 검출이라 성질이 다르다 — ⓑ만 채택하면 충돌은 계속 나고 CI가 알려 줄 뿐이다.\n③ **검출 변별력을 주입으로 확인한다** — 같은 번호를 서로 다른 브랜치에 심어 검사가 RED를 내는지 보고, 정상 상태(번호 전건 유일)에서 GREEN인지 대조군으로 확인한다. 스캔 0건(브랜치를 하나도 못 찾음)은 실패로 계상한다.\n④ **개명 경로의 사후 정정 범위를 문서화한다** — `rename`은 이벤트 대장·문서·커밋 메시지·PR 본문의 구 번호 참조를 옮기지 않는다고 스스로 경고한다(실측). 그 경고가 지시하는 수동 작업(`git grep -n <구번호>`)의 표준 절차와, 되돌릴 수 없는 표면(머지된 커밋 메시지·게시된 PR 코멘트)에 대한 교차 참조 노트 관례를 적는다.\n⑤ 기존 `_GRANDFATHERED_ID_NUMBERS`(이미 중복된 과거 번호 면제 목록)를 늘리지 않는다 — 이 태스크의 목적은 신규 충돌 차단이고, 과거 면제는 만료 없는 유예 금지 규칙의 대상이다."
