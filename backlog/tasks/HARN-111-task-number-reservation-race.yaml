notes: "사고 경위(2026-09-18 · EOS-106 판정 세션): 후속 태스크를 `add --id EOS-108`로 등재했고(이벤트 대장 06:28:11Z), 24초 뒤 다른 세션이 같은 번호를 `EOS-108-mastery-engine-v1-single-write-path`로 claim했다(06:28:35Z). 두 태스크가 같은 번호를 나눠 쓰게 돼 문서·커밋의 `EOS-108` 참조가 결정 불가가 됐다 — CLAUDE.md가 ARCH-13(2026-07-18/25)·OPS-15(2026-07-29) 선례로 이미 등재한 형태의 3회차다.\n\n원인 규명(실측): `add`의 번호 충돌 검사 자체는 건전하다 — `store.id_number_of`가 슬러그를 떼고 번호만 비교하므로 `EOS-108`과 `EOS-108-mastery-...`는 같은 번호로 잡힌다. 문제는 **타이밍**이다: 내 add 시점에 상대 claim이 대장에 없었고, 상대 start 시점에 내 태스크 파일은 아직 push되지 않았다. 즉 검사가 못 본 게 아니라 **볼 것이 없었다.** `add` 출력이 그 사각을 명시적으로 경고한다(\"이 번호는 push 전까지 다른 세션에 보이지 않는다\") — 즉 알려진 사각이고, 경고는 경합을 막지 못한다.\n\n해소(이 세션): 내 쪽을 `EOS-109-oauth-created-learner-profile-read`로 개명했다(상대가 그 번호로 이미 착수·구현 중이라 피해 최소화 선택 — 선착은 오히려 내 쪽이었다). 문서·테스트의 구 번호 참조 11건을 옮기고, 되돌릴 수 없는 표면(커밋 메시지·게시된 PR 코멘트)을 위해 판정 문서에 교차 참조 노트를 넣었다.\n\n이 태스크는 그 사각 자체를 닫는다. CLAUDE.md 「실수 관리」(시스템 실수 또는 동일 유형 2회 이상 → 재발방지대책 등재 의무)에 따른 등재이며, 동일 유형 3회차이므로 산문 규칙이 아니라 **기계 집행**이어야 한다.\n\n[정정 2026-09-20] 동일 유형 4회차 실측 부착(2026-09-20 EOS-128) — 종전 진단(24초 경합·볼 것이 없었다)으로 설명되지 않는 사례. 선착 브랜치가 19분 먼저 origin에 있었고 scan_remote_task_files의 fetch=False 기본값이 기여 원인. 대책 후보 ⓓ(스캔 전 원격 갱신) 추가"
