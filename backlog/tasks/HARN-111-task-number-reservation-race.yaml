acceptance:
  - "① `backlog.py add`가 배정한 번호가 **push 전까지 다른 세션에 보이지 않는** 사각을 닫는다. 현행 `add`는 그 사각을 stderr로 정직하게 경고하지만(경고 문면 실재), 경고는 경합을 막지 못한다 — 실측된 경합 창은 24초였다.\n② 대책 후보를 **측정 근거와 함께 판정**한다(하나를 고르고 사유를 남긴다): ⓐ`add` 시점에 번호를 원격에 예약한다(`start`가 `refs/claims/*`에 쓰는 것과 같은 방식의 경량 ref — 예약이 실패하면 fail-open이 아니라 번호를 다시 고른다) ⓑ `scripts/harness/adr_number_check.py`가 이미 하는 **원격 전 브랜치 스캔**을 태스크 번호로 확장해 `harness-integrity` 잡이 교차 브랜치 충돌을 CI에서 잡는다(사후 검출) ⓒ 둘 다. ⓐ는 사전 예방이고 ⓑ는 사후 검출이라 성질이 다르다 — ⓑ만 채택하면 충돌은 계속 나고 CI가 알려 줄 뿐이다.\n③ **검출 변별력을 주입으로 확인한다** — 같은 번호를 서로 다른 브랜치에 심어 검사가 RED를 내는지 보고, 정상 상태(번호 전건 유일)에서 GREEN인지 대조군으로 확인한다. 스캔 0건(브랜치를 하나도 못 찾음)은 실패로 계상한다.\n④ **개명 경로의 사후 정정 범위를 문서화한다** — `rename`은 이벤트 대장·문서·커밋 메시지·PR 본문의 구 번호 참조를 옮기지 않는다고 스스로 경고한다(실측). 그 경고가 지시하는 수동 작업(`git grep -n <구번호>`)의 표준 절차와, 되돌릴 수 없는 표면(머지된 커밋 메시지·게시된 PR 코멘트)에 대한 교차 참조 노트 관례를 적는다.\n⑤ 기존 `_GRANDFATHERED_ID_NUMBERS`(이미 중복된 과거 번호 면제 목록)를 늘리지 않는다 — 이 태스크의 목적은 신규 충돌 차단이고, 과거 면제는 만료 없는 유예 금지 규칙의 대상이다."
  - "⑥ 4회차 실측(2026-09-20 · EOS-128) — **종전 진단 \"검사가 못 본 게 아니라 볼 것이 없었다(24초 경합)\"는 이번 건을 설명하지 못한다.** 이번엔 선착 브랜치가 **19분 먼저** origin에 있었다: 내 `add`가 07:24:12Z에 `EOS-128-authoring-seat-generation-accuracy`를 등재하고 브랜치를 07:25Z에 push했는데, 타 세션(`claude/new-session-fy0wry`)이 07:44:17Z에 같은 번호로 `EOS-128-phase3-plan-backlog-conversion`을 등재했다. 즉 **볼 것이 있었는데 못 봤다.**\n\n⑦ 그래서 기여 원인이 하나 더 있다 — `scan_remote_task_files(root)`가 **두 호출부 모두 `fetch=False` 기본값**으로 불린다(`backlog.py:1604`·`1883`). 그 함수 docstring이 밝히듯 그것은 \"**이미 있는 remote-tracking ref만** 본다(네트워크 0)\"이다. CCR 세션 클론은 얕고 좁게 시작하므로 병렬 세션이 방금 만든 브랜치는 **그 세션이 우연히 fetch하지 않는 한 refs/remotes에 존재하지 않는다** — 스캔은 성실히 돌고 0건을 내며, 0건은 \"없음\"과 같은 색이다. 이 세션에서 `git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'`를 명시 실행한 **뒤에야** 원격 브랜치 36개가 보였다. **범위 명시**: 상대 클론을 직접 들여다보지는 못했으므로 이것은 *우리 쪽 코드 경로와 우리 클론의 실측으로 설명되는 기제*이며, 상대 세션에서 실제로 그 경로를 탔다는 확인은 아니다.\n\n⑧ 따라서 ②의 대책 후보에 **ⓓ를 추가해 함께 판정한다** — 스캔 직전에 원격 heads를 갱신한다(`fetch=True` 또는 `git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'` 선행). ⓐ(예약)보다 훨씬 작고, **19분 간격이던 이번 충돌은 ⓓ만으로 잡혔다**. 다만 ⓓ는 24초 경합(3회차 EOS-108 형태)은 못 막으므로 ⓐ의 대체가 아니라 **하한**이다. 비용은 `SCAN_FETCH_TIMEOUT`(90초) 한 번이며, 이미 `fetch=True` 경로가 구현돼 있어 신설 코드가 아니라 **기본값 판단의 문제**다. 판정 시 함께 볼 것: fetch 실패가 fail-open으로 조용히 0건이 되지 않는지(현행 status `ok`/`offline`/`error` 구분을 호출부가 어떻게 쓰는지).\n\n⑨ 4회차 해소 기록 — 내 쪽을 `EOS-23-authoring-seat-generation-accuracy`로 개명했다(CLI 제안 번호 그대로 · 손추론 없음). 선착은 이번에도 내 쪽이었으나 상대가 `in_progress` claim + PR #1233 + 하위 태스크 11건 + 게이트 1건으로 번호를 참조 중이라 이쪽 이동이 쌌다. ④가 요구하는 수동 정정 범위를 실제로 밟았다: `git grep -n <구번호>`로 문서 2곳을 옮겼고, 이벤트 대장(append-only)과 머지 불가 표면은 `rename` 이벤트가 잇는다. **부수 관측**: `_suggest_number`의 ①(최대+1)이 `cap=99`라 EOS 접두가 100번대에 든 뒤로는 ①이 영구히 불발하고 ②(하위 미사용 재사용)만 작동한다 — 그래서 EOS-128 다음 제안이 `EOS-129`가 아니라 `EOS-23`이었다. HARN-73에서 Kiki가 결정한 A안 그대로이므로 결함이 아니지만, **번호가 순차 기대와 어긋나므로 개명 사유를 태스크 안에 남기지 않으면 다음 읽는 사람이 헷갈린다**(이번엔 EOS-23이 머지된 PR #1229 본문에 '취소' 맥락으로 한 번 등장해 실제로 모호성이 생겼고, 그 태스크는 파일로 커밋된 적이 없어 번호 자체는 비어 있었음을 확인해 acceptance ⑨에 적었다)."
