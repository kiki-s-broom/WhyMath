acceptance:
  - "① 대표 과정 핵심 Concept 마다 6슬롯(대표·기본·응용·오개념 유발·진단·숙련도 확인)을 채운다.\n② Skill 별 문제 확보율(Problem Coverage)을 P3-02 CLI 로 측정해 95% 이상(수치는 실측 기준선 확인 후 Kiki 확정).\n③ 문제은행을 많이 넣는 것이 목표가 아니다 — Concept ↔ Problem ↔ Misconception **삼각관계**를 만드는 것이 목표다.\n④ 콘텐츠는 데이터다 — 소스 하드코딩 금지. 범위 밖 학년·단원 금지.\n⑤ 완료 판정 — Problem Coverage ≥ 95% AND 핵심 Concept 6슬롯 충족."
  - "[2026-10-14 Kiki 결정 4건 — 설계 메모 docs/reviews/p3_05_triangle_density_design_2026-10-14.md 7절, 전건 메모 제안안 채택]\n① Problem Coverage 목표는 95%를 유지하되 스킬이 8개뿐이라 사실상 8/8이 필요함을 문서에 명시한다.\n② 슬롯이 빈 3개 개념(02-01·02-02·02-07)의 기존 문항 413건은 재배정을 먼저 하고, 그래도 모자라는 칸만 새로 생성한다. 배정 규칙은 코드가 아니라 데이터(YAML)로 둔다.\n③ 근사 중복 기준은 2단(숫자 접기 + 수식·미지수 이름 접기)을 채택하되, 정상·결함 주입 양쪽으로 검증한 뒤에만 기준으로 쓴다.\n④ 삼각의 오개념 변(Graph Connectivity)을 완료 판정에 포함하되 일정은 분리한다. 크로스링크 추가는 Kiki 서명이 필요하므로 오답 보기 재연결을 먼저 진행한다."
  - "[2026-10-15 결정 ③ 정정 — Kiki 확인] 근사 중복 기준은 2단이 아니라 1단(숫자 접기)을 계측기에 적용한다. 근거: 같은 날 실측에서 2단(변수·함수 이름 접기)이 1단에 더한 합침이 0건이었다(코퍼스 한 글자 변수가 x 3,085회·f 1,049회로 통일 — 이름만 바꾼 변형이 없다). 양성 대조군(변수 이름만 다른 같은 문제)에서 2단 규칙은 반응했으므로 규칙이 죽어 0이 아니라 코퍼스에 그 중복이 없는 것이다. 2단은 코퍼스에 그런 변형이 생기면(예: 5단계 신규 생성이 변수 이름을 바꿔 쓰는 경우) phase3_stem_fold 에 더해 재개한다.\n[후속 제안] 문면 접기 정의가 생성기 skeleton_of(l3/equivalent/p3_diff_skeleton_base.py)와 계측기 fold_stem(l1/standards/phase3_stem_fold.py) 두 곳에 따로 구현돼 있다. 14,538건 전수에서 결과가 같고 test_phase3_stem_fold.py 가 동치를 지키지만, 구현을 한 곳으로 합치는 것(skeleton_of 가 fold_stem 에 위임)은 생성기·문제은행 결정론에 닿아 이번 범위 밖으로 남긴다."
  - "[2026-10-15 3단계 Kiki 결정 3건 — 초안 docs/reviews/p3_05_slot_assignment_draft_2026-10-15.md 6절, 전건 제안안 채택]\n① 배정 방식 = 정직형(가족 단위·한 문면=한 슬롯): 기존 문항 재배정으로 5칸(02-01 응용·오개념 유발 / 02-02 오개념 유발 / 02-07 대표·오개념 유발), 나머지 13칸은 4단계 생성. 난이도 띠형은 같은 문면 21개가 두 칸에 세어져 채택하지 않는다.\n② 교수학 판정: 02-07 단답 181건 = 대표, 02-01 접선 기울기 역방향 80건 = 응용.\n③ 02-01에 PRIMARY로 달린 '극값의 개수' 24건은 슬롯 배정을 보류하고 개념 매핑 재검토를 별건으로 분리한다(개념 태깅 변경은 승인 경로 — 세션이 바꾸지 않는다).\n집행 지점(정본화와 별항): 규칙 정본 = data/corpus/phase3_scope_v1/slot_assignment_rules.yaml, 적용 = 결정론 백필 CLI harness/problem_slot_backfill(LLM 0·tags 키만 변경·2회 실행 바이트 동일). 완료 판정 = phase3_coverage 슬롯 지표 42/60 -> 47/60.\n발견(별건): 02-02 24건은 정답이 전부 0(미분가능한 양성 예 없음) — 4단계 생성 문항에 미분가능한 예를 섞는다."
  - "[2026-10-15 4·5단계 Kiki 결정 2건 — 승인 경로 크기 하한(_MIN_N=200, harness/problem_corpus_review_status_backfill.py)이 구성을 정한다]\n① 4단계(13칸)와 5단계(02-03 패턴 일반화 · 02-10 문장제)는 새 은행 1개로 묶는다: 13칸 x 12건 = 156건 + 02-03 패턴 일반화 24건 + 02-10 문장제 24건 = 204건(n >= 200). 따로 만들면 각각 200건을 못 넘어 승인되지 않고, 채우려면 같은 문제 복제로 부풀려야 해서 PR #1639 의 중복 방지와 충돌한다. 기존 504건 은행(problem_bank_p3_calculus1_diff_v0)은 건드리지 않아 승인 근거가 유지된다.\n② 새 은행도 P3-03 과 같은 자격 통과 프로토콜(기계 게이트 + LLM 판정자 2명, harness/p3_audit_qualification)로 감사한다. 불합격 회차(P3-03 은 68->23->11->5->1건, 5회차)가 나올 수 있음을 전제로 진행하고 회차마다 as-found 를 기록한다. 3단계에서 드러난 결함 부류(<=/>= 표기, 선지 sqrt 표기, 변별력 없는 우회로)는 생성기에서 처음부터 막는다.\n승인 전에는 새 문항이 review_status 를 갖지 않으므로 phase3_coverage 지표에 잡히지 않는다 — 생성 PR 머지만으로 슬롯 47/60 이 오르지 않고, 승인 경로 완료가 6슬롯 60/60 과 Problem Coverage 8/8 의 조건이다."
