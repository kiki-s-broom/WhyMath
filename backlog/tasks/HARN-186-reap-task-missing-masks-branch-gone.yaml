  - "① 실측 고정 — 원격 claim `OPS-73-generated-inventory-conflict-blocks-ci`(홀더 `claude/status-38gu4d` · 2026-09-12T02:59:55Z 등록 · harness-claims 커밋 `d145632d`)는 같은 날 태스크가 `OPS-76-generated-inventory-conflict-blocks-ci`로 개명돼(OPS-76 notes [개명 2026-09-12] · HARN-100 개명 CLI 착지 #1148보다 앞선 수동 개명이라 claim이 따라오지 않았다) main에 그 ID가 없고, 홀더 브랜치도 원격에 없다. 그런데 `claims reap`은 이것을 `task_missing`으로만 분류한다 — `scripts/harness/remote_claims.py::stale_claims()`가 `task is None`이면 곧바로 `continue`해 홀더 브랜치 부재 판정(HARN-26)에 도달하지 않기 때문이다. `AUTO_REAP_REASONS`(task_done·branch_gone)는 task_missing을 의도적으로 제외하므로 `.github/workflows/harness-audit.yml`의 `claims reap --auto`가 main push·야간마다 돌아도 16일째 남아 있고, SessionStart 브리핑이 매 세션 \"착수 금지\"로 노출한다. stray-code 12회차(2026-09-18)·13회차(2026-09-28) 연속 관측. 재현: `python3 scripts/harness/backlog.py claims reap` 출력의 `(task_missing, claude/status-38gu4d)` 줄 + `git ls-remote --heads origin claude/status-38gu4d` 0건.\n② 판정 순서 정정 — 태스크 부재 claim에 대해서도 홀더 브랜치 부재(유예 경과)를 먼저 판정해 `branch_gone`으로 분류할지 결정하고, 채택/기각 근거를 docstring에 적는다. 근거 후보: 기존 테스트 `test_branch_gone_takes_precedence_over_ttl`이 \"순서가 뒤집히면 사유가 비확정 사유가 되어 자동 집행에서 빠진다 — 순서는 표시 문구가 아니라 집행 여부를 바꾼다\"고 고정했는데, 같은 논리가 task_missing에도 적용된다. 또 task_missing을 자동 청소에서 뺀 이유(다른 브랜치에서 등재된 태스크는 CI 러너에 구조적으로 missing)는 홀더 브랜치가 살아 있을 때의 논거다 — 홀더 브랜치가 유예(24h)를 넘겨 없으면 그 claim이 지키는 작업은 원격에 없다. 반례를 찾으면 테스트로 고정하고 기각한다.\n③ 변별력 — 픽스처 4종: ⓐ task 부재 + 브랜치 부재(유예 경과) → branch_gone(자동 청소 대상) ⓑ task 부재 + 브랜치 부재(유예 이내) → 삭제 금지 사유(`*_recent`) ⓒ task 부재 + 브랜치 실재 → task_missing 유지(대조군 — 이것이 없으면 \"태스크 부재는 전부 branch_gone\"이라는 과잉 수정이 통과한다) ⓓ `existing_branches=None`(조회 실패) → 현행 task_missing(브랜치 판정 보류). 판정 순서를 되돌리는 뮤테이션이 ⓐ에서 RED인지 확인하고, 주입 실재(mutated != original)·원복 바이트 동일을 단언한다.\n④ 집행 지점(정본화와 별항) — 착지 후 `harness-audit.yml` `claim-reap` 잡(`--auto`) 실행 로그에서 이 유형이 branch_gone으로 실제 청소되는지 확인한다. OPS-73 고아 claim이 그때까지 남아 있으면 그것이 라이브 표본이다(이미 치워졌으면 그 경위를 notes에 남기고 ③의 합성 표본으로 대체)."
