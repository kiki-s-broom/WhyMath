  - "① 학생 답안에서 Error Signature 를 추출하고, 그것으로 Misconception Candidate 와 confidence 를 낸 뒤, Remediation Strategy 까지 도달하는 전 구간을 연결한다.\n② 오답을 단순 incorrect 로 처리하지 않는다 — 그러면 EOS 의 가치가 크게 떨어진다(원 문서 Week 2).\n③ 대표 과정 핵심 오개념 **각각에 대해** 위 산출이 실제로 나오는지 확인한다.\n④ 변별력 — 잘못된 오답을 주입했을 때 엉뚱한 오개념이 confidence 높게 나오지 않는지, 신호가 없을 때 조용히 단정하지 않는지(no_confident_match) 주입으로 확인한다.\n⑤ 오개념은 LLM 초기 context 에 preload 하지 않는다(reactive retrieval 만). ID 는 기존 kebab↔M-id 크로스워크를 경유한다.\n⑥ 완료 판정 — 핵심 오개념 각각에 대해 오답 → 후보·confidence → 교정 전략이 산출되고 변별력 주입이 RED."
