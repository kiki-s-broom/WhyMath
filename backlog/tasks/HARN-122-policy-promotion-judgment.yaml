acceptance:
  - "① 정탐률 실측 — `backlog.py policy report --days 74`를 확장해 rule별 경고 건수와 **정탐**(경고 후 같은 파일이 두 세션의 PR·커밋에 실제로 동시 등장한 비율)을 낸다. 훅 축(id='-', file 필드)과 태스크 단위 축(add/start 시 other 필드)을 분리 집계한다 — 현재 path_overlap 18,909건 중 17,021건이 태스크 단위 선언 겹침이며 프리픽스 근사가 `docker-compose*.yml ⊇ backlog/incidents.*` 같은 무관 쌍까지 경고한다(2026-09-20 HARN-118 등재 시 실측 39건)."
  - "② 승격 판정 집행 — `adhoc_edit`(claim 없이 src/·infra/ 편집)은 claim-first 원칙의 집행 지점이므로 정탐률과 무관하게 block 승격(예외 경로 docs/·backlog/). `scope_drift`는 정탐률 ≥50% 또는 예방 사례 ≥1이면 block, 미달이면 기준 재설계를 결정 로그에 남긴다. `path_overlap` 태스크 단위 축은 add/start 시 1회 요약(상위 3건+총수)으로 축약해 소음을 제거한다. 승격 = policy.yaml 1줄 + MEMORY 결정 로그 + policy_promote 이벤트(build_harness.md §3c 절차 그대로)."
  - "③ 결정 잊지 않기 — `policy report`가 승격 기준(2주 또는 30세션) 충족 상태를 감지하면 브리핑에 \"승격 판정 필요\" 1줄을 내고 사람 게이트 1건을 자동 등재한다(보고서 §6 E9). 변별력: 기준 미달 픽스처 → 게이트 0건, 충족 픽스처 → 1건(중복 등재 없음)."
  - "[정정 2026-09-20] ①의 측정 창 — policy.yaml은 2026-07-16(PR #524)에 도입됐으므로 판정 창은 74일이 아니라 66일이다. `--days 74`는 도입 이전까지 포함하는 창이라 결과는 같지만 서술은 \"정책 도입일 이후 전 기간(66일)\"으로 읽는다(반박 검증 지적)."
