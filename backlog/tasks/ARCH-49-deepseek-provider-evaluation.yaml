notes: "착수 배경: 2026-09-16 Kiki 요청(\"오케스트레이션 시스템 — high=Fable 5.1 / main·low=DeepSeek\"). 실측 조사 결과 오케스트레이션 뼈대(3축 라우터·CompositeProvider·역외 반출 게이트·비용 회계)는 이미 완비되어 새 프로바이더 추가는 파일 1개+config 3필드 규모다. 막는 것은 기술이 아니라 ①실측 근거 부재(채택 조건 ②) ②학생 데이터의 국외 이전이다. 선행 게이트 ARCH-46(프로바이더 좌석 계약)은 착지했다. 상세 대조 = docs/reviews/eos_micro_project_orchestration_v1_gap_review_2026-09-05.md 3-C.\n\n[정정 2026-09-16] Kiki 시간대별 프로바이더 전환 제안(2026-09-16)에 대한 실측 대조 — 피크 시간대 KST 환산과 OpenRouter 수수료 구조를 확인한 결과 시간축 라우팅은 절감 효과가 없어 측정 항목으로만 편입\n\n[정정 2026-09-17] 모델 ID 실측 정정 — 웹 자료의 deepseek-v4-flash는 API가 받지 않는 이름이며 실제는 deepseek-flash. 2026-09-16 Kiki 머신 /models 조회 결과\n\n[정정 2026-09-17] acceptance ② 답 확정 — 관할을 CostTier가 아니라 프로바이더 메타데이터로 분리, CN 기본 허용은 합성 프로브만(코퍼스는 opt-in). 학생 데이터 차단은 기존 USER_GENERATED.export=False가 이미 보장함을 실측 확인\n\n[정정 2026-09-17] OpenRouter 경유 실측 확정 — 가격·slug·deny 필터·양자화 4건. 앞서 OpenRouter를 비용 증가로 판정한 오판을 정정하고, provider.only+allow_fallbacks+data_collection 3파라미터를 채택 계약으로 고정\n\n[정정 2026-09-17] deny 필터 단일 의존 금지 — OpenRouter 분류와 상충하는 2차 자료가 제시됐고 1차 자료는 프록시 차단으로 미확인. 어느 쪽이 참이어도 성립하도록 provider.only를 독립 방어층으로 고정\n\n[정정 2026-09-17] paths ['src/backend/whymath_backend/l3/providers/**', 'src/backend/whymath_backend/config.py'] → ['src/backend/whymath_backend/l3/providers/**', 'src/backend/whymath_backend/config.py', 'src/backend/whymath_backend/l3/provider_jurisdiction.py', 'tests/backend/l3/**', 'tests/infra/test_provider_jurisdiction_declaration.py']: 착지 시점 acceptance 전수 재대조 — 이행 7항/미이행 2항(라이브 측정)을 항별로 고정하고 미이행분을 ARCH-55로 승계. 신설 모듈·테스트 경로를 기존 범위에 더해 편입(기존 2건 유지)"
