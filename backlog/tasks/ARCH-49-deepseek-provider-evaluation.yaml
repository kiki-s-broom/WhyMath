acceptance:
  - "①실측 근거 확보(CLAUDE.md 프로바이더 채택 조건 ②) — DeepSeek V4(`deepseek-v4-flash`·`deepseek-v4-pro`)를 현행 클라우드 핀(`claude-sonnet-4-6`)과 품질·지연·비용 3축으로 비교 측정한다. 측정 대상은 *학생 데이터가 없는 저작 경로*의 실제 프롬프트(코퍼스 문항 저작·개념 추출)이며, 정확도 축은 결함 주입 강등전으로 판정한다(`docs/standards/superhuman_verification_standard.md`). 점추정 금지 — Wilson 단측 경계.\n②법적 축의 선결 판정 — DeepSeek API는 중국 본토 서버 전용이고 데이터 레지던시 선택지가 없다(2026-09 실측). `l3/data_export_policy.py`는 `CLOUD_MID`/`CLOUD_HIGH`를 국외 이전으로 판정하므로, 새 티어를 그 집합에 넣을지·별도 관할 축을 만들지를 먼저 결정하고 코드로 집행한다. 미성년자 학생 저작이 실린 요청(`STUDENT_SUBMITTED_WITH_CORPUS` 등급)은 이 프로바이더로 나가지 않아야 한다 — 그 불변식을 기계가 판정하게 한다.\n③라우터 경유 배선(채택 조건 ①) — `l3/providers/deepseek.py`를 추가하고 `CompositeProvider` 디스패치를 확장한다. 새 프로바이더도 `scripts/ops/check_provider_seat_contract.py`(ARCH-46)를 통과해야 한다 — 그 게이트가 이 태스크의 안전장치다.\n④MEMORY 결정 로그 기재(채택 조건 ③) — 실측 수치·비교 조건·채택 여부를 적는다. 미채택도 결론이다.\n⑤저비용 티어의 기본 경로는 건드리지 않는다 — `CostTier.LOCAL`(Phaiakes9)은 학생 대면 경로의 기본값으로 유지한다. 이 태스크는 *클라우드 티어의 선택지를 넓히는 것*이지 로컬 우선 원칙을 뒤집는 것이 아니다."
  - "⑥비용 축의 시간대 구분 — DeepSeek은 피크(01:00-04:00·06:00-10:00 UTC 월~금)와 오프피크의 단가가 정확히 2배 차이다(2026-08-16 개정). 측정 리포트는 각 호출의 요금 구간(peak/off_peak)을 기록하고 두 구간을 분리 집계한다. **시간축 라우팅은 이 태스크에서 만들지 않는다** — 한국시간 환산 결과 피크가 10:00-13:00·15:00-19:00 KST라 학생 사용 피크(평일 저녁·주말)가 오프피크와 겹치고, OpenRouter 경유는 카드 충전 5.5% 수수료가 붙어 피크 회피용으로도 절감이 아니라 증가다(2026-09-16 Kiki 제안에 대한 실측 대조). 필요 여부는 ①의 실측 수치로 판정하며, 대신 *저작 배치의 오프피크 스케줄링*과 *프롬프트 캐싱*을 절감 후보로 리포트에 명시한다."
  - "⑦모델 ID 정정(실측) — ①이 적은 `deepseek-v4-flash`는 **틀린 문자열이다**. 2026-09-16 Kiki 머신에서 실 API를 조회한 결과(`GET https://api.deepseek.com/models`, 유효 키) 반환된 id는 정확히 두 개다: **`deepseek-flash`** · **`deepseek-v4-pro`**. 웹 자료 3곳이 일치해 `deepseek-v4-flash`라고 적었고 Kiki도 `deepseek-v4.1-flash`로 기억했으나 둘 다 API가 받는 이름이 아니다(제품 표기와 API id가 다른 사례). 코드·하네스·설정의 핀은 실측값만 쓴다. 신규 ID 추가·변경 시에도 같은 방식으로 실 API 조회를 먼저 한다 — CLAUDE.md 「환경 사실의 추론 등재 금지」."
  - "⑧관할 축 설계 확정(②의 답) — **새 `CostTier`를 만들지 않는다.** 근거 실측: `l1/rights/permission_map.py:378`의 `_USER_GENERATED.export=False`라 학생 저작이 실린 요청은 이미 `export_judgment`→`guard_data_export`가 LOCAL로 강등한다 — 어떤 클라우드 프로바이더로도 나가지 않는다. 티어를 늘리면 `OFFSHORE_TIERS`·세 축 불변식·`LOCAL_MODEL_MATRIX`를 전부 손대야 하므로 축 폭발이다(플레이북 7대 붕괴 연쇄 ②). 대신 **관할(jurisdiction)을 프로바이더 메타데이터로 분리**한다(Layer Separation): 프로바이더마다 관할을 선언하고, 관할별 *허용 라이선스 등급*을 정책으로 둔다. `CostTier`는 \"얼마나 비싼가·어디서 도는가\"만 계속 말하고, \"어느 나라 법인인가\"는 프로바이더가 말한다.\n   **기본값은 보수적으로 둔다** — CN 관할은 `WHYMATH_GENERATED`(합성 프로브)만 허용한다. 즉 ①의 측정은 기본 설정으로 가능하되, *자체 저작 코퍼스*(`INTERNAL_OWNED`)를 중국 서버로 보내는 것은 설정 opt-in을 요구한다. 라이선스상으로는 `INTERNAL_OWNED.export=True`라 반출이 가능하지만, 그것은 *법적* 판정이고 영업자산(개념 그래프·오개념 카탈로그·교수학 프롬프트)을 학습에 넘길 위험은 별개 축이기 때문이다.\n   **미확정 사실 1건(명시)**: DeepSeek이 유료 API 입력을 학습에 쓰는지가 확정되지 않았다 — 2차 자료가 서로 반대로 적고(\"2026-03 정책 개정으로 유료 API는 학습 제외\" vs \"유료 API를 학습에서 빼 주지 않는다\"), 1차 자료(`cdn.deepseek.com` 약관)는 이 세션의 네트워크 정책이 차단해 확인하지 못했다. opt-in을 기본 OFF로 두는 이유가 이것이며, 확인되면 그 근거와 함께 기본값을 재평가한다."
  - "⑨OpenRouter 경유 실측 확정(2026-09-16 Kiki 머신) — ⑧이 전제한 \"DeepSeek=CN 관할\"은 **경로에 따라 다르다**. DeepSeek V4는 MIT 오픈웨이트라 서방 공급사가 서빙하며, OpenRouter의 `deepseek/deepseek-v4-flash` 엔드포인트는 **16곳**이다. 실측 4건:\n   (a) **가격이 공식보다 싸다** — OpenRouter 최저 `open-inference` $0.05/$0.14, `deepinfra` $0.09/$0.18 vs DeepSeek 공식 오프피크 $0.15/$0.60. 출력 기준 3.4~4.3배 저렴하다. 5.5% 수수료는 *크레딧 충전* 단계에만 붙고 토큰 단가에 없다 — 앞서 \"OpenRouter는 절감이 아니라 증가\"로 판정한 것은 **가격을 실측하지 않은 오판이며 이 항으로 정정한다**.\n   (b) **공급사 slug = `tag`의 `/` 앞부분** — `deepinfra/fp8`→`deepinfra`. `only=[\"deepinfra\"]`+`allow_fallbacks=false` 실호출로 `PROVIDER=DeepInfra` 확인.\n   (c) **`data_collection=\"deny\"` 필터 작동** — `open-inference`·`deepinfra`·`venice`·`digitalocean`·`azure` 5곳 전건 통과(실호출). 준수 엔드포인트가 없으면 조용히 우회하지 않고 거부한다.\n   (d) **양자화가 공급사마다 다르다** — 대부분 fp8, `atlas-cloud`만 fp4, `venice`·`digitalocean`·`phala`·`azure`는 unknown. **공급사를 고정하지 않으면 매 호출마다 다른 정밀도가 응답해 품질 비교가 성립하지 않는다.**\n   **채택 계약(코드에 박는다)**: OpenRouter 경유 호출은 `provider.only`·`allow_fallbacks=false`·`data_collection=\"deny\"` 세 파라미터를 **항상** 동반한다. 옵션이 아니라 계약이며 누락 시 테스트가 실패하도록 동결한다. 기본 허용 공급사는 `[\"deepinfra\",\"digitalocean\"]`(둘 다 미국·deny 통과). OpenRouter **Preset 기능은 코드 경로에 쓰지 않는다** — 설정이 웹 UI에 있으면 저장소 게이트가 검사할 수 없어 이중 진실 원천이 된다(요청의 명시 파라미터가 Preset을 덮어쓰므로 코드가 항상 이긴다).\n   **미확인(명시)**: `open-inference`(최저가)·`streamlake`·`gmicloud`·`novita`·`atlas-cloud`·`nextbit`·`mancer`·`phala`의 법인 국적을 확인하지 못했다. 중국계로 아는 것은 `siliconflow`·`alibaba`·`baidu` 3곳뿐이며 그것은 회사로 아는 것이지 API가 말해 주는 값이 아니다. `azure`만 `tag`에 `azure/us`로 리전을 명시한다."
  - "⑩`data_collection=\"deny\"`를 안전의 단일 근거로 쓰지 않는다 — ⑨(c)가 5개 공급사의 deny 통과를 실측했으나, **그 통과는 OpenRouter의 *분류*이지 우리가 검증한 사실이 아니다**. 2026-09-16 Kiki가 제시한 2차 자료는 `open-inference`를 \"프롬프트를 학습에 쓰는 대가로 무료 모델 rate limit을 푸는 공급사\"로 설명해 deny 통과와 정면 충돌한다. 그 설명은 우리 실측과 두 군데서 어긋나고(유료 모델 호출이 과금과 함께 성공했으므로 \"무료 전용\"이 아니다 · deny를 통과했다) Arize AI의 OpenInference(OpenTelemetry 기반 LLM 계측 표준)와 이름이 겹쳐 혼동한 정황이 있으나, **1차 자료로 확정하지 못했다** — `openrouter.ai`·`cdn.deepseek.com` 둘 다 이 세션의 egress 프록시가 차단한다.\n   따라서 설계는 어느 쪽이 참이어도 성립해야 한다: **이중 방어**로 둔다. ⓐ `data_collection=\"deny\"`(OpenRouter 판정) ⓑ `provider.only`=우리가 국적·평판을 아는 공급사만(우리 판정). ⓑ가 단독으로도 성립하므로 OpenRouter 분류를 신뢰하지 않아도 계약이 유지된다 — CLAUDE.md 「판정치를 외부 관측 인프라에만 의존 금지·이중 회계」(langfuse v2 무증상 전멸 2026-07-16 교훈)의 프로바이더 축 적용이다. `open-inference`는 최저가($0.05/$0.14)이나 이 논쟁이 미해결이므로 기본 허용목록에 **넣지 않는다**."
  - "⑪ 이행·미이행 재대조(2026-09-17 착지 시점 · CLAUDE.md 「회수로 done 선언 시 acceptance 전수 재대조 생략 금지」) — 이 태스크가 실제로 착지시킨 것과 남긴 것을 항별로 적는다. 산문에만 적으면 만료 없는 유예가 된다.\n   **이행**: ③ 라우터 경유 배선(`l3/providers/deepseek.py`·`openrouter.py`·`_openai_compat.py` 신설 + `CompositeProvider` 관할 게이트 · `check_provider_seat_contract.py` exit 0) · ⑦ 모델 ID 실측 핀(`deepseek-flash`/`deepseek-v4-pro` 기본값 + 회귀 동결) · ⑧ 관할 축 설계 집행(`l3/provider_jurisdiction.py` — 새 `CostTier` 0개 · 학생 저작 전건 배제 전수 격자) · ⑨ 세 파라미터 채택 계약 동결(`build_provider_block` 단일 좌석 · 뮤테이션 8종 RED) · ⑩ 이중 방어(허용목록이 `data_collection` 분류와 독립 · `open-inference` 미포함 동결) · ④ MEMORY 결정 로그 기재 · ⑤ `CostTier.LOCAL` 기본 경로 무변경(클라우드 조립 15곳 전부 Anthropic 그대로).\n   **미이행 → `ARCH-55-deepseek-live-battle-measurement`로 승계**: ① 품질·지연·비용 3축 강등전 실측 · ⑥ 피크/오프피크 분리 집계. 둘 다 **Kiki 머신의 유효 키로 라이브 호출**이 필요해 이 세션에서 수행 불가다(측정을 돌릴 수 있는 *배선*까지가 여기 범위). `pricing_window`(요금 구간 라벨러)는 ⑥의 재료로 이번에 착지시켰다.\n   **따라서 이 시점의 채택 결론은 \"미판정\"이다** — 코드가 있다는 것이 채택했다는 뜻이 아니며, 기본 라우팅은 변경되지 않았다. 채택 여부는 `ARCH-55`가 실측으로 판정한다(미채택도 결론이다)."
