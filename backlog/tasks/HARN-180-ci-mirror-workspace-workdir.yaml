# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-180-ci-mirror-workspace-workdir
title: "ci_mirror가 working-directory의 github.workspace 식을 해석하지 않아 OPS-24 드리프트 게이트 2개를 건너뛰는데 판정은 '전 잡 통과' — 해석 + 미실행 수 표기"
