acceptance:
  - "① 실측 재확인 — `user_state_snapshot` 테이블의 writer가 여전히 0건인지 판정 시점에 다시 센다(`UserStateSnapshot` 전거 검색 → 쓰기 경로 유무). 2026-09-16 EOS-10 실측은 schema 정의·`db/models/__init__` 등록·`privacy/export.py`·`privacy/erasure.py`의 읽기·삭제뿐이었다. 부재 판정은 시점에 종속되므로 근거 커밋 해시를 함께 적는다.\n② 배선 또는 폐기 — 둘 중 하나로 판정한다. 배선이면 writer를 어느 좌석이 갖는지(누가 언제 스냅샷을 찍는지)를 별항으로 적고, 폐기면 마이그레이션·`privacy` 표면 처리까지 포함한다. \"그냥 둔다\"는 판정이 아니다.\n③ privacy 표면 처리 — 폐기로 갈 경우 `privacy/export.py`(`_state_snapshot_student_json`·`state_snapshots` 키)와 `privacy/erasure.py`의 삭제 대상 목록에서 제거해야 한다. 이것이 이 태스크가 EOS-10에서 분리된 이유다 — 개인정보 열람·삭제권 이행 경로를 건드리므로 학습 표면 태스크에 섞을 수 없다(PIPA 표면 변경은 별도 검토가 필요하다).\n④ EOS-10과의 경계 확인 — `l2/learner_state.py`의 `test_get_state_does_not_touch_user_state_snapshot_seat` 가드는 \"이 조립기는 그 좌석을 경유하지 않는다\"를 동결한다. 배선으로 판정하더라도 그 가드를 그냥 지우지 말고, 조립기가 좌석을 읽어야 하는지(= 같은 사실의 두 번째 진실 원천이 되지 않는지)를 별도로 판정한 뒤 처리한다."
  - "⑤ KPI ⑤ 교차 조건(2026-09-24 추가) — 현행 원천 대장(`l2/learning_event_trace._SOURCE_REGISTRY`)은 KPI ⑤(Traceability)의 LearnerState hop(`LEARNER_STATE_CREATED`)을 이 좌석에 매달아 두었다. 그러므로 **폐기로 판정하려면 EOS-132가 그 hop의 원천을 추천 기록 meta 근거로 옮긴 뒤여야 한다** — 먼저 폐기하면 KPI ⑤가 영구 미측정으로 굳는다. 배선으로 판정하더라도 이 좌석을 LearnerState 캐시로 쓰지 않는다(notes의 축 불일치)는 EOS-132 ④와 같다."
