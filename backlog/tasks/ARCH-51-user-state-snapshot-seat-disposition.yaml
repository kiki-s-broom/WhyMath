notes: "출처: EOS-10(LearnerState 단일 조회 표면) acceptance ③. EOS-10은 \"이 표면은 그 좌석을 쓰지 않는다\"를 확정하고 AST 가드로 동결했으나, 좌석 **자신의** 처분은 범위 밖으로 남겼다 — privacy 표면(열람·삭제권)을 건드리기 때문이다.\n\n분류(계획서 300 §14): SUPPORT — 루프가 도는 데 필요하지 않다(EOS-10이 이미 좌석 없이 돈다).\n\n선례: EOS-72 \"배선 또는 폐기\" 형식. 만료 없는 유예를 만들지 않기 위해 이 태스크가 그 판정의 소유자다.\n\n주의 — 축이 다르다: 그 좌석이 담는 것은 estimated_grade·estimated_score·estimated_percentile·pattern_mastery·time_management_score·consecutive_active_days 등 예측·시간관리·멘탈 신호이고, LearnerState가 담는 것은 BKT/IRT 숙달·능력이다. 겹치는 concept_mastery 한 축도 이쪽은 ConceptMasteryHistory(append-only 시계열)가 정본이다. 그러므로 \"LearnerState 캐시로 전용한다\"는 선택지는 축이 다른 테이블의 오용이며 기본적으로 배제한다.\n\n[정정 2026-09-24] KPI ⑤ LearnerState hop이 이 좌석에 매달려 있어 폐기 선행 조건을 교차 기록 (2026-09-24 KPI ①⑤ 추가 검토)"
