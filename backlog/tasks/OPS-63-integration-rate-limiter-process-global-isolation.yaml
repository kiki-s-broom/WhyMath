notes: "출처: PR #980 머지 드라이브 2026-09-06 — 실 PG 통합 잡이 같은 코드에서 순서에 따라 red(E2E의 두 번째 POST /v1/coach/sessions가 429). 즉시 조치는 E2E 시작 시 reset_store 한 줄(커밋 e13765c8·PR #980)이고, 이 태스크는 통합 21파일 전체에 대한 구조 격리다. 같은 유형 선례: OPS-06(db.session._engine 전역 오염 → OPS-07 가드·OPS-09 무작위화). 두 번째 발생이라 CLAUDE.md 실수 관리 규칙(시스템·반복 실수 재발방지 등재 의무)에 따라 등재. 번호는 CLI 제안(OPS-62는 로컬 선점). 로컬 검증 한계: 이 컨테이너에는 pgvector 확장·docker가 없어 실 PG 재현은 CI가 판정했다.\n\n[정정 2026-09-06] PR #1001 Codex P2 — ③의 뮤테이션 순서(두 파일)가 IP 쓰기 한도 60에 못 미쳐(≈38) 변별력 0. 시딩 기반 절차로 정정(2026-09-06 실측)\n\n[정정 2026-09-11] acceptance③-정정(PR #1001 Codex P2 수용분) 이행 — 실 PG 없이도 도는 hermetic 시딩 검증을\ntests/backend/api/test_rate_limit_fixture_isolation.py로 구현했다: ①IP 쓰기 버킷에 60건\n직접 시딩 → 헬퍼(reset_inmemory_rate_limit_store) 호출 없이 _enforce_by_ip가 429를 내는지\n확인(픽스처 끈 상태 재현) ②같은 시딩 후 헬퍼 호출 → 재요청이 통과하는지 확인(격리가 실제로\n비움) ③Redis 백엔드로 교체한 상태에서 헬퍼가 .reset()을 호출하지 않는지 확인(acceptance①\n\"Redis 설정은 건드리지 않는다\" 경계). pytest-randomly 순서와 무관하게 직접 함수 호출로\n검증해 순서 의존을 배제했다. 21개 통합 테스트 파일의 실제 순서 재현(실 PG 필요 축)은 이\n샌드박스에 pgvector·docker가 없어 재현 불가 — CI의 \"backend — 마이그레이션·통합 (실 PG)\"\n잡이 이 픽스처가 적용된 상태로 green인지로 간접 확인한다(태스크 notes가 이미 이 한계를\n명시)."
