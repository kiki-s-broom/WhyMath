notes: "발견 경위(2026-09-10 04:19Z): HARN-03 착지 직후 SessionStart 브리핑을 다시 읽었더니 오류 문구만 바뀌고 결과(13건 미판정)는 그대로였다. HARN-03의 done 증적에 \"실효는 토큰 부재로 미관측\"이라고 적었는데, 실제 잔여 원인은 토큰이 아니라 프록시의 숫자 경로 거부였다 — 공백을 적어 둔 덕에 다음 관측에서 바로 잡혔다.\n\n[교훈] 이관 결함의 축이 셋으로 늘었다: ⓐ이름 리터럴(HARN-02) ⓑ리다이렉트 미추종(HARN-03) ⓒ**리다이렉트 목적지가 접근 불가**(이 태스크). ⓒ는 ⓑ를 고쳐야 비로소 보인다 — 앞 결함이 뒤 결함을 가리고 있었다.\n\n[겹침] scripts/harness/remote_claims.py는 HARN-03이 방금 건드린 파일이다. 다른 열린 태스크의 소유는 없다.\n\n[정정 2026-09-11] 실측 재확인 — 원 사고 PR #675 포함 4건이 현재 세션에서 리다이렉트/프록시 거부 없이 정상 응답. 재현 실패로 고칠 대상 없음, 다음 재현 세션을 위해 기록만 남김.\n\n[정정 2026-09-12] 3연속 비재현 실측 + shallow 가드가 원 증상을 구조적으로 가릴 수 있다는 신규 단서 기록\n\n[정정 2026-09-12] 4회차 재측정에서 재현 성공 — 원인 확정 및 해법 ⓐⓑⓒ 실측 반증, 귀속 개선분 기록\n\n[정정 2026-09-12] 실측: 정본 이름도 '세션 미활성' 403 — 조회가 되려면 세션 스코프가 정본 이름을 포함해야 하고 그 축은 HARN-96이 소유한다. notes가 아니라 depends_on으로 집행해야 selector가 착수 후보에서 뺀다\n\n[차단 2026-09-12] acceptance ④ '적용 후 열림/닫힘 판정' 미충족 — 4회차에서 재현·원인 확정하고 해법 ⓐⓑⓒ(이름 고치기)를 실측 반증했으나, 남은 해법은 프록시 정책(ⓓ) 또는 세션 스코프가 정본 이름을 포함하는 것이고 후자는 HARN-96 소유. 귀속 개선분은 PR #1148로 착지. depends_on HARN-96 집행 완료"
