acceptance:
  - "① 실측 고정 — HARN-03의 `-L` 착지 이후 이 컨테이너의 SessionStart 브리핑 오류 문구가 바뀌었다. 전: `{'message': 'Moved Permanently', 'url': '.../repositories/1237870848/pulls/675'}` · 후: `{'message': 'Numeric-ID repository paths (repositories/{id}/...) are not supported through this proxy. Use repos/{owner}...'}`. 즉 curl이 리다이렉트를 **따라가기는 하는데** 그 목적지가 숫자 ID 경로이고 에이전트 프록시가 그것을 거부한다. 미머지 브랜치 13건의 열림/닫힘은 여전히 미판정이다."
  - "② 범위 구분(중요) — 이것은 HARN-03의 회귀가 아니다. 프록시가 없는 환경(GitHub Actions 러너·Kiki 머신)에서는 `-L`만으로 리다이렉트가 완결되므로 그쪽은 고쳐졌다. 남은 것은 **에이전트 프록시가 숫자 ID 경로를 막는 CCR 컨테이너 한정** 문제다. 다만 이 저장소의 작업 대부분이 CCR 세션에서 일어나므로 실효 피해는 작지 않다 — 매 세션 브리핑이 13건을 \"상태 미확인\"으로 낸다."
  - "③ 해법 후보와 판단 기준 — ⓐ `GITHUB_REPOSITORY` 등 환경변수 우선 사용(CI에서는 자동 설정·CCR에서는 세션이 export해야 함) ⓑ 정본 이름을 저장소 안의 설정 파일에 두고 읽기 ⓒ `git remote set-url` 안내(클론별 조치라 코드로 못 막는다) ⓓ 프록시가 숫자 경로를 허용하도록 요청. **ⓐ와 ⓑ는 \"이름을 어딘가에 적는다\"는 점에서 HARN-02가 반대한 방향과 닿아 있으므로**, 어느 것을 택할지는 실측(각 경로가 실제로 뚫리는지)과 Kiki 판단을 함께 밟는다. 추론으로 고르지 않는다."
  - "④ 변별력 — 어떤 해법을 택하든 착수 세션은 ⓐ해법 적용 전 브리핑이 13건 미판정임을 재현하고 ⓑ적용 후 실제로 열림/닫힘이 판정되는지 확인한다. \"오류 문구가 바뀌었다\"는 해결의 증거가 아니다 — 이번 실측이 정확히 그 함정이었다(문구는 바뀌었는데 결과는 동일)."
  - "[2026-09-11 재측정 — 재현 실패] 이 CCR 세션(브랜치 claude/harn-04-repro-note)에서\n`_fetch_pr_states(root, [675, 802, 1101, 1102])`를 직접 호출 + `backlog.py branches`(unshallow 후)로\n실측한 결과, 원 사고에서 인용된 PR #675를 포함해 전건이 리다이렉트·프록시 거부 없이 정상 응답했다\n(`{675: ('closed', False), 802: ('closed', False), 1101: ('closed', True), 1102: ('open', False)}`).\n`branches` 브리핑도 \"미판정\" 없이 전건(고립 11·PR-닫힘 2·PR 12)을 정상 분류했다. 즉 이 세션 시점\n기준으로는 acceptance①이 기술한 \"숫자 ID 경로 거부\"가 재현되지 않는다 — 프록시 쪽이 그 사이 바뀌었을\n가능성이 있으나 확정할 방법은 없다(간헐적·컨테이너별일 수 있음). acceptance④의 \"재현 후 고침\" 순서상\n지금은 고칠 대상이 없어 해법 ⓐ~ⓓ 중 하나를 추론으로 착수하지 않는다 — 다음에 이 브리핑에서 \"미판정\"이\n다시 보이는 세션이 착수하며, 그때는 이 기록과 비교해 재현 조건(시점·PR 번호·컨테이너)을 좁힐 수 있다.\nstatus는 todo로 유지한다(고쳐지지 않았고, 재발 가능성도 배제 못함)."
  - "[2026-09-12 재측정 3회차 — 재현 실패 + 신규 관측] 이 세션(claude/stoic-galileo-a3z3x9)에서 `_fetch_pr_states(root, [675, 802, 1101, 1102])`를 직접 호출한 결과 `{675: ('closed', False), 802: ('closed', False), 1101: ('closed', True), 1102: ('closed', True)}`로 4건 전부 정상 응답(프록시 거부·리다이렉트 오독 없음) — 2026-09-11 세션과 동일한 결과.\n\n신규 관측: 이 세션은 shallow 클론으로 시작했고, unshallow 전 `backlog.py branches`는 PR 상태 조회(`_fetch_pr_states`)에 도달하기도 전에 `is_shallow_repo`(2026-08-11 사고 대책·본 태스크와 무관한 별도 가드)에서 `status=shallow`로 즉시 반환된다(`_git(... --is-shallow-repository)` 결과). 즉 **현재 신규 CCR 세션의 기본 상태(shallow)에서는 SessionStart 브리핑이 애초에 `_fetch_pr_states` 코드 경로 자체를 실행하지 않는다** — acceptance①이 기술한 \"13건 미판정\" 문구가 이제 안 보이는 것이 이 태스크가 고쳐졌기 때문인지, 아니면 shallow 가드가 먼저 막아 원 증상 자체가 가려진 것인지 이번 관측만으로는 구분할 수 없다. `git fetch --unshallow` 후 재실행한 `backlog.py branches`는 \"미판정\" 없이 고립 11·PR-닫힘 3·PR 10건을 전건 정상 분류했다(라벨 정체 8건 경고 포함, 이는 이 태스크와 무관).\n\n결론: acceptance④의 \"재현 후 고침\" 순서상 이번에도 고칠 대상이 재현되지 않았다 — 3연속 비재현(2026-09-11, 2026-09-12 unshallow 전 shallow 가드로 도달 불가, 2026-09-12 unshallow 후 직접호출 정상). 해법 ⓐ~ⓓ 중 하나를 추론으로 착수하지 않는다. status는 todo로 유지 — 재발 가능성(간헐적·컨테이너별)을 배제 못하고, shallow 가드가 원 증상을 구조적으로 가릴 수 있다는 사실 자체가 다음 재현 세션에 필요한 새 단서다."
  - "[2026-09-12 재측정 4회차 — **재현 성공** · 원인 확정 · 해법 ⓐⓑⓒ 반증] 판정 기준: main `60bdd59b` · 세션 `claude/status-38gu4d`(스코프 = 이관 *전* 이름 `doldori7/WhyMath`).\n\nⓐ **재현됨** — 3연속 비재현 뒤 4회차에서 원 증상이 그대로 났다. `git fetch --unshallow` 후 `_fetch_pr_states(root, [675, 802, 1101, 1102, 1075])` 직접 호출 → `(None, \"APIError: PR #675 응답 형식 이상 — {'message': 'Numeric-ID repository paths ...\")`. 3회차가 남긴 단서(shallow 가드가 원 증상을 가린다)가 정확했다 — unshallow 전에는 `backlog.py branches`가 `status=shallow`로 exit 2에서 멈춰 `_fetch_pr_states`에 도달조차 하지 않는다.\n\nⓑ **원인** — `_fetch_pr_states`/`_fetch_pr_labels`는 `owner/repo`를 `git remote get-url origin`에서 뽑는다. 이 컨테이너의 origin은 `https://github.com/doldori7/WhyMath`(이관 전 이름)이므로 매 요청이 301로 튀고, 그 목적지가 숫자 ID 경로라 에이전트 프록시가 403으로 막는다.\n\nⓒ **해법 ⓐ·ⓑ·ⓒ(이름 고치기)는 반증됐다** — 두 경로를 각각 실측했다(`curl -w '%{http_code} %{url_effective}'`):\n  · `repos/doldori7/WhyMath/pulls/675` → 301 → `repositories/1237870848/pulls/675` → **403** `Numeric-ID repository paths ... not supported through this proxy`\n  · `repos/kiki-s-broom/WhyMath/pulls/675` → 리다이렉트 **없음** → **403** `GitHub access to this repository is not enabled for this session`\n  즉 origin을 정본으로 바꾸거나(ⓒ) 정본 이름을 환경변수·설정 파일에 적어도(ⓐ·ⓑ) **실패 문구만 바뀌고 조회는 그대로 실패한다**. 이것이 acceptance ④가 이름 붙인 함정이며, 이번엔 그 함정을 실측으로 확인한 뒤 피했다.\n\nⓓ **이번 세션이 착지시킨 것 = 귀속(attribution)뿐, 해결 아님** — `_attribute_api_failure()`를 신설해 정책 거부를 `ProxyNumericPathBlocked`·`SessionScopeBlocked`로 나누고 두 조회 함수에 배선했다. 이전에는 이 응답이 `\"state\" not in data` 분기에 떨어져 **\"응답 형식 이상\"**으로 오귀속됐다 — 코드 결함(우리가 고칠 것)과 환경 차단(이 세션에서 못 고칠 것)이 한 글자로 보였고, 그래서 같은 조사가 세 세션 반복됐다. 검증: 뮤테이션 8종 전건 RED(과잉 수정 대조군 2종 포함) · `tests/harness` 822 passed · ruff/black exit 0.\n\nⓔ **적용 후에도 열림/닫힘은 여전히 미판정** — acceptance ④의 \"적용 후\" 축은 **미충족**이다. 브리핑은 이제 `⚠ PR 열림/닫힘 조회 미수행(ProxyNumericPathBlocked: ...) — PR 제출됨 13건은 수동 확인 필요`로 정확히 말하지만, 13건의 상태는 그대로 모른다. 이 태스크는 그러므로 **done이 아니다**.\n\nⓕ **남은 해법과 그 소유자** — 실측이 가리키는 것은 ⓓ축(프록시가 숫자 경로를 허용) 또는 **세션 스코프가 정본 이름을 포함**하는 것이다. 후자는 `HARN-96`(정본 저장소 이관)이 이미 소유한다 — 그 태스크 acceptance는 `add_repo`의 cross-tier 거부와 GraphQL 차단을 이미 기록하고 있다. **범위 명시**: \"정본 이름을 스코프에 포함한 세션에서는 조회된다\"는 것은 *측정하지 않았다* — 이 세션에서 그런 세션을 만들 수 없다(`add_repo`가 `cross-tier adds are not supported in v1`으로 거부). 현재 스코프가 정본 이름을 거부한다는 것까지만 실측이고, 그 너머는 추론이다."
