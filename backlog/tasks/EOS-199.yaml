acceptance:
  - "① Windows 데스크톱 검수 창 — `whymath_backend.harness.review_session_gui`(tkinter · 표준 라이브러리만 · 새 의존성 0)가 `harness/review_session`과 같은 인자(`--queue`·`--events`·`--verdicts`·`--reviewer-id`·`--resume`)를 받아 큐의 CU를 한 건씩 창에 띄우고, 승인·수정승인·반려·보류·종료를 버튼으로 받는다. 반려는 F1~F8 사유 필수, 수정승인은 사유 선택, 메모 입력 가능 ② 기록 동일성 — 타이머 이벤트(`start_review`·`finish_review`·`abort_review`)와 판정 파일(`append_verdict_jsonl`)을 기존 터미널 세션과 같은 함수·같은 의미로 쓴다: 항목을 화면에 띄울 때 started, 판정 시 finished+verdict, 보류·종료·창 닫기 시 aborted. 같은 판정 순서를 터미널 세션과 GUI 제어기에 넣었을 때 이벤트 종류·순서·필드(경과 시간 제외)가 같음을 테스트로 고정 ③ 이어하기 호환 — `--resume`이 터미널 세션이 남긴 이벤트 파일의 완료 CU를 건너뛰고, 그 반대도 성립 ④ 창 로직과 위젯 분리 — 판정·기록 제어기는 tkinter 없이 테스트 가능(CI 헤드리스), tkinter import는 실행 진입점에서만 지연 ⑤ HIT 하한 가드(OPS-90)와 충돌 없음 — 30초 미만 판정을 막지는 않되 화면에 경과 시간을 표시"
