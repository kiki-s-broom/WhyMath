acceptance:
  - "① 부분 채택만 한다 — 계획서 §20은 PR 단위를 기능 기준에서 Vertical Slice 기준으로 바꾸라고 한다(나쁜 예 \"PR — Mastery DB 추가\" / 좋은 예 \"PR — Wrong Answer → LearnerState Update Slice\"). 저장소의 PR 단위 정본은 **태스크 1:1**이며 그것은 바꾸지 않는다. 채택하는 것은 **태스크 분해 지침**이다 — \"표면 1개만 만드는 태스크\"보다 \"학생이 실제로 도달하는 슬라이스\"를 선호한다.\n② 규약을 어디에 적을지 정한다 — `docs/standards/build_harness.md`(태스크 분해 규약이 사는 곳)가 1순위다. CLAUDE.md 본문에 넣으려면 버전·수정일 표기도 함께 갱신한다.\n③ 기계 집행 여부를 명시한다(정본화≠집행) — 이 규약은 **사람 규율**로 둘 것인지, `backlog.py add`가 제목 형태를 검사할 것인지 판정해 적는다. 집행하지 않기로 하면 \"기계 집행 없음\"을 명시한다. 슬라이스 여부는 기계가 판정하기 어려우므로 사람 규율이 정직한 기본값이다.\n④ 기존 게이트와 충돌하지 않는다 — `backlog.py done`의 PR 증적 검사(HARN-23 done)와 태스크:PR 1:1은 그대로 유지된다. 이 규약은 그 위에 얹는 **분해 취향**이지 대장 구조 변경이 아니다.\n⑤ 인접 미머지 확인 — `HARN-104-pr-template-eos-blocks`(todo·미머지 all=2/main=0)가 PR 템플릿을 건드린다. 템플릿 파일을 수정하려면 그 브랜치와 충돌하는지 먼저 확인한다."
