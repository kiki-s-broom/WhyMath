acceptance:
  - "① 실측 재확인: Week 1 게이트(tests/backend/api/test_week1_gate_closed_loop.py)와 Week 2 게이트(tests/backend/api/test_week2_gate_wrong_answer_propagation.py)가 어느 CI 잡에서도 실제 판정에 도달하지 않는다는 것을 다시 실측한다. 2026-09-19 실측 근거: (가) 두 파일은 pytest.mark.integration이고 PG 미도달 시 skip한다 (나) backend 잡에는 postgres service가 없고 WHYMATH_RUN_INTEGRATION도 없어 두 파일이 '5 skipped · exit 0'으로 끝난다(CI backend 잡 조건 재현 실측) (다) 실 PG가 있는 유일한 PR/야간 잡 e2e-nightly는 test_e2e_vertical_slice_integration.py만 이름으로 부른다 (라) backend-serial-nightly에도 postgres service가 없다. 즉 EOS-106 artifacts가 '판정 통과'로 기록한 하네스는 그 뒤 CI에서 한 번도 돈 적이 없다.\n② 처분 판정: 두 게이트를 e2e-nightly에 배선할지, 별도 PG 잡으로 옮길지, 또는 '1회 판정용이었고 상시 실행 대상이 아니다'로 명시 제외할지를 근거와 함께 고른다. 제외를 고르면 그 사실을 파일 docstring과 태스크에 적어 '돈다고 오해되는 상태'를 없앤다 — 만료 없는 유예 금지.\n③ 배선을 고르면 배선 실재성을 기계로 동결한다. 선례 = tests/infra/test_p11_chain_nightly_wiring.py(EOS-116)가 이미 '스텝 실재 + schedule 발화 + fail-closed + python -m pytest + postgres service + WHYMATH_RUN_INTEGRATION=1'의 6축을 순수 함수로 판정하며 합성 워크플로 주입 5종으로 변별력을 봉인해 뒀다. 그 판정 함수를 재사용한다(재구현 0).\n④ 변별력 주입: 배선을 넣었으면 그 배선을 하나씩 깨뜨려(스텝 제거·postgres service 제거·WHYMATH_RUN_INTEGRATION 제거) 전건 RED를 확인한다. 정상 입력 GREEN은 증거가 아니다.\n⑤ 범위: 게이트 하네스 자체의 판정 내용은 건드리지 않는다. 이 태스크는 '그 판정이 실제로 일어나는가'만 다룬다."
  - "[범위 확장 2026-09-19 · EOS-22 Gate 2 판정 실측] 이 태스크가 적은 미배선 범위는 Week 1·Week 2인데, Gate 2 판정이 전수로 다시 세어 보니 **미배선 하네스가 5종 중 3종**이다. 워크플로 참조 실측(grep -c <파일명> .github/workflows/*.yml):\n\n  · tests/backend/api/test_week1_gate_closed_loop.py        → 참조 0건\n  · tests/backend/api/test_week3_gate_remediation_loop.py   → 참조 0건  (이 태스크가 안 적은 것)\n  · tests/backend/api/test_e2e_persona_journeys.py          → 참조 0건  (이 태스크가 안 적은 것 · P-15 산출물)\n  · tests/backend/api/test_p11_five_stage_loop_chain.py     → ci.yml 1건 (e2e-nightly · schedule 전용)\n  · tests/backend/api/test_e2e_vertical_slice_integration.py→ ci.yml 2건 (e2e-nightly · schedule 전용)\n\n즉 Gate 2 10조건의 판정 근거가 되는 하네스 중 **PR·push에서 도는 것은 0종**이고, 야간 schedule에서라도 도는 것은 2종뿐이다. week3(오답→오개념→교정→힌트→새문제→재시도 6마디)와 persona 3종(P-15가 방금 착지시킨 것)은 **어느 잡에서도 실행되지 않는다** — 저장소에 존재할 뿐이다. P-15 착지 당일에 그 산출물이 이미 미배선이었다는 뜻이므로, 이 태스크의 해소 범위에 두 파일을 포함한다.\n\n실측 방법(재현): 워크플로 파일에서 각 테스트 파일명을 세고, backend 잡에 WHYMATH_RUN_INTEGRATION·postgres service가 없음을 확인한다. 2026-09-19 컨테이너 재현에서 이 5종은 통합 플래그 없이 10 skipped·exit 0으로 끝났고, 실 PG + WHYMATH_RUN_INTEGRATION=1을 주자 10 passed로 바뀌었다 — skip이 통과로 위장하던 상태가 실행으로 확인됐다.\n\n판정 기준: main 77ee1992."
