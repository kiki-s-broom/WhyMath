acceptance:
  - "① 실측 사실(2026-09-26 코드 대조) — 모바일 앱은 `POST /v1/me/attempts`를 부르지 않는다(`src/mobile/test/e2e_loop_flow_test.dart`가 호출 0회를 동결 · MOB-20 \"배선 아님 — 계약상 금지\"). 학습 상태 머신(`l2/learning_state_machine.py::advance_on_attempt`)의 호출부는 `api/me.py`의 응답 제출 경로 하나뿐이고, 코치 완료(`api/coach.py::_complete_problem`)는 `ProblemAttempt(is_correct=True)`만 적재하며 상태 머신을 돌리지 않는다. 앱의 오답·포기는 어디에도 적재되지 않는다. 그래서 앱 학생의 원장은 비어 있고, 추천이 상태 머신 결정을 집행하는 두 경로 — R3 오개념 교정(EOS-24)과 R6 원인 미상 오답(EOS-26) — 는 앱 학생에게 **0회** 돈다. 두 경로의 해소는 API 계약 수준(3루프 하네스·`POST /v1/me/attempts` 클라이언트)이다.\n② 경계 — `EOS-134`(todo)는 코치 **정답 완료**만 상태 머신에 태운다. 착지해도 R3·R6의 원천(오답)은 생기지 않는다. 이 태스크는 오답·포기 이벤트의 원천이다.\n③ 처분 판정 선행 — (가) 코치 턴의 오답 신호(검증 결과·오개념 매칭)를 응답 1건으로 적재하고 상태 머신을 돌린다 (나) 앱이 문항 단위 오답을 제출하도록 계약을 바꾼다(MOB-20의 \"계약상 금지\" 재판정) (다) 앱에서는 상태 머신 집행을 쓰지 않는다고 결정하고 게이트·판정문에 범위를 명기한다. 결정 없이 구현하지 않는다 — 코치 대화의 한 턴을 \"오답 1건\"으로 셀지 자체가 교수학 판정이다."
  - "④ (EOS-26 독립 비판 발견 10 · 2026-09-26 — 병기) 오답 원천이 생기면 R6 집행(EOS-26)이 진단 목적 CAT의 측정 효율에 주는 영향을 잰다. 오답 뒤 문항이 제한 후보(선수 탐침 · 같은 개념 연습 — 연습은 학습 밴드)로 바뀌어 정보량 최대 선택에서 벗어나므로 SE 수렴이 늦어질 수 있다 — ASM-03 capture가 `TARGET_SE`(0.3) 대신 `MAX_ADMINISTERED_ITEMS`(20문항) 상한으로 확정되는 비율이 지표다(`l2/next_problem_selection.py`). capture 관측에 R6 제한 문항 비율을 싣거나 배치 진단 구간에서 R6 제한을 끄는 조건을 이 태스크의 처분 판정과 함께 본다. 지금은 앱 도달 0이라 영향 0이다(EOS-26 판정문 §5)."
  - "⑤ (2026-09-29 정정 — 게이트 부착) ③의 처분 판정 선행을 게이트 G-eos146-disposition(decision · Kiki)으로 대장에 집행했다 — 종전에는 산문뿐이라 next가 이 태스크를 1순위 후보로 내놓아 각 세션이 같은 벽에 부딪혔다. ②의 EOS-134(todo)는 낡았다: EOS-134는 done이고 코치 정답 완료는 advance_on_graded_attempt(api/coach.py:1416)를 돈다. 결론은 유지된다 — R3·R6의 원천인 오답·포기는 여전히 어디에도 적재되지 않는다(코치 경로에 is_correct=False·포기 적재 0건 · 모바일 lib에 POST /v1/me/attempts 호출 0건 · 2026-09-29 main a28a8d08 실측 · 이 검색 방법 기준). 게이트가 clear되면 선택한 (가)·(나)·(다)에 맞춰 acceptance를 다시 쓴다(구현 범위가 선택에 따라 백엔드 하나·앱 계약·문서뿐으로 갈린다)."
  - "[EOS-147 연동 2026-09-29 · 하한 비대칭 재판정 소유] 이 태스크가 앱의 오답·포기 신호를 응답으로 적재하면 θ의 **하한 경계(전부 오답 → -4.0)가 앱에서 처음 발동**한다. `EOS-147-all-correct-theta-upper-pin`은 전부 오답 쪽을 이번 범위 밖으로 뒀다(선택 θ = 추정 θ = -4.0 · 판정문 `docs/reviews/eos147_all_correct_theta_pin_judgment_2026-09-29.md` §4-4). 그 근거 중 \"앱에서 도달 불가\"는 이 태스크가 적재를 시작하는 순간 만료된다 — 그때 하한 비대칭을 다시 판정한다. 판정 재료: 오답 한 번에 θ가 0에서 -4.0으로 4로짓을 과잉 반응하고(문항 정보 효율 42% 이하), `EOS-26` 판정문 §0·§5 발견 4와 `EOS-148-r5-non-execution-premise-rejudge` ②가 이미 문서화한 대로 앱 요청 형태에서는 θ 하한이 가장 쉬운 **무관 개념**으로의 이탈을 낳을 수 있다(가장 쉬운 문항은 교정이 아니다). EOS-147이 응답과 처치 기록에 `theta_boundary`를 남기므로(`lower` 포함) 발동률을 소급 측정할 수 있다."
  - "⑥ (2026-09-30 · 게이트 G-eos146-disposition clear — 세션 사용자 결정 · 판정 기준 main `270968a2`) 처분이 정해져 ③의 선행 조건이 해소됐고, ⑤가 예고한 재작성이 이 항이다. 대장은 append 전용이라 ①~⑤를 지우지 않으며, 충돌하면 이 항(⑥·⑦)이 우선한다. ⓐ 선택은 (가)다. (나)(앱이 `POST /v1/me/attempts`로 자가보고)는 채택하지 않는다 — 정오 판정이 클라로 넘어가 서버 권위와 \"수학 로직을 클라에 넣지 않는다\" 원칙에 부딪히고, MOB-20이 금지한 이중 적재가 남는다. (다)도 채택하지 않는다 — R3·R6 앱 도달 0이 영구화된다. ⓑ 계수 단위는 코치 대화에서 서버가 마지막 풀이 단계를 `VerificationOutcome.incorrect`로 판정한 제출(`l4/completion.py`의 `REDIRECT` 진입 = `api/coach.py::_resolve_completion`의 `final_incorrect`)이고, 그중 **같은 학생·같은 문제의 최초 1건만** 센다. 중간 코치 턴은 세지 않는다. 같은 문제의 재제출이 다시 오답이어도 세지 않는다 — 틀린 뒤 스스로 고치는 것은 Polya의 정상 경로라 원장에서 벌점처럼 쌓이게 하지 않는다. unverifiable(사변·파싱 불가)은 오답이 아니다(모른다 ≠ 아니다 — 호출부가 이미 둘 다 False로 넘긴다). ⓒ 적재는 `ProblemAttempt(is_correct=False)` 1행과 `advance_on_graded_attempt(is_correct=False, confidence=None)`이다. 오개념은 그 턴에서 이미 확인된(신뢰 하한 초과) id만 R3 입력으로 넘기고, 없으면 R6으로 간다 — 새 진단을 만들지 않는다. **`dialogue.attempt_id`에 연결하지 않는다** — 그 필드가 존재하는 것이 '완료됨' 표지(재완료 가드)라, 오답 행을 링크하면 풀던 대화가 완료로 읽힌다."
  - "⑦ (⑥의 구현·검증 조건) ⓓ 정답 경로 `_complete_problem`과 같은 writer(숙달 전파 `record_problem_attempt_mastery`·`collect_assessment_evidence`)를 재사용해 중복 구현 0이 되게 하고, 오답의 증거가 정답 경로와 대칭인지 확인하며 오개념 scan 상태(run/not_run)를 사실대로 싣는다. ⓔ 부수 영향을 실측해 notes에 기록한다: (1) 오답만 있는 문제가 `GET /me/next-problem` 미시도 필터(NOT IN)에서 제외되는가 — 의도인지 판정 (2) 오답 뒤 자가 수정으로 정답 완료된 대화가 원장에 오답 1건 + 정답 1건으로 남을 때 R1·R2 진행과 R5 연속 오답 카운트(정답이 연속을 끊는다 — `_count_consecutive_failures`)에 미치는 영향. R5의 범위 문제(개념 무관·시간 창 부재)는 EOS-145 소유이며 이 태스크가 바꾸지 않는다. ⓕ 변별력 — final incorrect 주입 → 원장 1행 + 상태 머신 전이 / 같은 문제 재제출 오답 → 추가 행 0 / unverifiable → 행 0 / 정답 → 종전 동작 불변 / 신뢰 하한 초과 오개념이 있는 오답 → R3, 없는 오답 → R6이 앱 요청 형태(코치 API)만으로 서는지 EOS-141 프로브의 앱 요청 형태(V1a·V2a)를 오답 원천 포함 형태로 재실행한다. 각 검사는 주입을 빼면 실패함을 뮤테이션으로 확인한다. ⓖ **앱 변경 0 · `/v1/me/attempts` 계약 변경 0 · 모바일 `lib/` 변경 0** — 바뀌는 곳은 백엔드 코치 경로뿐이고 MOB-20이 동결한 '호출 0회' 테스트가 그대로 통과해야 한다. ⓗ 정본화와 집행을 분리한다 — 집행 지점은 코치 서빙 엔드포인트를 경유해 이 적재가 실제로 돈다는 테스트이며 상태 머신 단위 테스트가 아니다. ⓘ 범위 밖: '포기'(풀다 떠남)는 원천 신호가 코치·앱 어디에도 없어 EOS-41-app-abandon-signal-source로 분리했다. ④(R6 제한의 CAT 측정 효율 영향)는 (가) 착지 뒤 그대로 잰다."
  - "⑧ (2026-09-30 · 구현 착지 — ⑥ ⓒ 정정 + ⑦ ⓔ 판정 기록 · 판정 기준 브랜치 `claude/festive-clarke-msoutj`) 구현하며 실측한 다섯 가지다. (1) **⑥ ⓒ의 R3 입력 서술을 정정한다.** \"그 턴에서 이미 확인된 오개념 id를 R3 입력으로 넘긴다\"는 EOS-138 결정(대화 턴 매치는 \"이 답안의 오개념\"이 아니다 — `advance_on_graded_attempt` docstring)과 충돌해 채택하지 않았다. R3 입력은 `/v1/me/attempts`와 같은 **이번 답안의 스캔**(`api/_attempt_misconception_scan.py::scan_attempt_misconceptions` — `api/me.py`에서 옮김)에서만 만든다. 결정 (가)의 결과는 바뀌지 않는다: 실 PG 통합 테스트에서 코치 오답이 `/v1/me/attempts`와 **같은 전이 사슬**(오개념이 걸리면 NEW→LEARNING→ASSESSING→R3 · 원인 미상이면 R6)을 낸다. (2) **⑦ ⓔ(1) 판정**: 오답만 있는 문항은 `GET /me/next-problem` 미시도 필터에서 빠진다 — `/v1/me/attempts` 오답과 같은 동작이며 의도로 본다(시도한 문항은 다시 내지 않는다). (3) **⑦ ⓔ(2) 판정**: 오답 뒤 스스로 고쳐 완료하면 원장에 오답 1건 + 정답 1건이 남고 상태 사슬은 R6 → 평가 → R2로 진행한다(R5 연속 오답 카운트는 정답이 끊는다). (4) 서버 검증기가 `unverifiable`로 판정하는 답(다항식 정답에 대한 \"7\"·\"x=99\" 등)은 오답이 아니라 적재 0이다 — 모른다 ≠ 아니다. (5) 부수 좌석: 스킬 이벤트 `source`에 셋째 라벨 `coach_wrong_submission`(폐쇄 3종 — 완료 경로 분모와 섞이지 않게) · 킬 스위치 `l4_coach_wrong_submission_enabled`(기본 ON · 끄면 종전과 비트동일). 남은 한계: 같은 학생·문항 동시 요청 경합으로 2행이 생길 수 있다(잠금·유니크 인덱스는 마이그레이션이라 미착수) · `used_hint`는 판정하지 않고 NULL · '포기'는 EOS-41."
  - "⑨ (2026-09-30 · 구현 착지 — acceptance 전수 재대조) ④ 승계: \"지금은 앱 도달 0이라 영향 0이다\"라는 ④의 전제가 이 착지로 깨져, R6 제한이 진단 CAT 측정 효율에 주는 영향은 **데이터가 쌓여야 잴 수 있는 사후 측정**이 됐다 — 이 태스크 안에서 끝낼 수 없어 `EOS-42-r6-cat-efficiency-measurement`(P2 · 이 태스크 선행)로 분리했다. ⑦ ⓕ의 \"EOS-141 프로브 V1a·V2a 재실행\"은 그 프로브가 **커밋되지 않은 일회성**(판정문 §9-2)이라 그대로 재실행하지 못했다. 같은 실질(앱 요청 형태 — 파라미터 없는 `GET /v1/me/next-problem` — 만으로 R3·R6 **추천 집행**이 서는가)을 실 PG 통합 테스트 `tests/backend/api/test_eos146_coach_wrong_submission_integration.py`가 대신한다: 코치 오답이 `/v1/me/attempts` 오답과 같은 전이 사슬 **및 같은 추천 집행**(R3 → `learning_state_directive=applied`·`misconception_remediation` · R6 → `same_concept_probe_unsupported`)을 낸다. 이 대체는 프로브의 앱 요청 형태 축을 다시 재는 것이 아니라 **이벤트 원천 축**(코치 오답)이 두 규칙에 닿는다는 것을 재는 것이다."
  - "⑩ (2026-09-30 · CI 실측 — 교수학 상호작용, **판정 대기**) 실 PG 통합 CI가 `tests/backend/api/test_eos133_hint_attribution_integration.py` ⑤를 깨서 발견했다. 코치 오답이 적재되면 숙달이 낮아져(BKT 0.4 미만) 숙달 라벨이 `초보`가 되고, 힌트 단계 규칙 5(`decide_hint_level` — `초보`이면 `min(4, base+1)`)가 좌절 신호의 상승분(1→2)에 한 칸을 더해 같은 대화의 다음 힌트가 1→3(부분 풀이)으로 오른다. 공급 원장은 사실대로 `[1, 3]`이라 가짜 공급이 아니고 기존 정책(규칙 5)의 직접 결과다. 그러나 오답 **한 건**으로 두 칸 도약하는 것이 \"가장 빠른 단계에서 멈춤\"·Polya 우선 원칙에 비추어 허용되는지는 교수학 판정이 필요하다. 이 태스크는 규칙 5를 바꾸지 않았고, 현상을 테스트 ⑥으로 고정했다(⑤는 숙달 미측정 문항으로 격리해 \"재고 유도 턴이 가짜 공급 행을 남기지 않는다\"는 불변식만 계속 검증). 후보: (가) 현행 유지 (나) `초보` 라벨에 최소 표본 수를 요구한다 (다) 코치 오답의 숙달 전파를 미룬다 — 단 R3 추천의 `reason.mastery` 대칭이 깨진다."
