acceptance:
  - "① 실측 사실(2026-09-26 코드 대조) — 모바일 앱은 `POST /v1/me/attempts`를 부르지 않는다(`src/mobile/test/e2e_loop_flow_test.dart`가 호출 0회를 동결 · MOB-20 \"배선 아님 — 계약상 금지\"). 학습 상태 머신(`l2/learning_state_machine.py::advance_on_attempt`)의 호출부는 `api/me.py`의 응답 제출 경로 하나뿐이고, 코치 완료(`api/coach.py::_complete_problem`)는 `ProblemAttempt(is_correct=True)`만 적재하며 상태 머신을 돌리지 않는다. 앱의 오답·포기는 어디에도 적재되지 않는다. 그래서 앱 학생의 원장은 비어 있고, 추천이 상태 머신 결정을 집행하는 두 경로 — R3 오개념 교정(EOS-24)과 R6 원인 미상 오답(EOS-26) — 는 앱 학생에게 **0회** 돈다. 두 경로의 해소는 API 계약 수준(3루프 하네스·`POST /v1/me/attempts` 클라이언트)이다.\n② 경계 — `EOS-134`(todo)는 코치 **정답 완료**만 상태 머신에 태운다. 착지해도 R3·R6의 원천(오답)은 생기지 않는다. 이 태스크는 오답·포기 이벤트의 원천이다.\n③ 처분 판정 선행 — (가) 코치 턴의 오답 신호(검증 결과·오개념 매칭)를 응답 1건으로 적재하고 상태 머신을 돌린다 (나) 앱이 문항 단위 오답을 제출하도록 계약을 바꾼다(MOB-20의 \"계약상 금지\" 재판정) (다) 앱에서는 상태 머신 집행을 쓰지 않는다고 결정하고 게이트·판정문에 범위를 명기한다. 결정 없이 구현하지 않는다 — 코치 대화의 한 턴을 \"오답 1건\"으로 셀지 자체가 교수학 판정이다."
  - "④ (EOS-26 독립 비판 발견 10 · 2026-09-26 — 병기) 오답 원천이 생기면 R6 집행(EOS-26)이 진단 목적 CAT의 측정 효율에 주는 영향을 잰다. 오답 뒤 문항이 제한 후보(선수 탐침 · 같은 개념 연습 — 연습은 학습 밴드)로 바뀌어 정보량 최대 선택에서 벗어나므로 SE 수렴이 늦어질 수 있다 — ASM-03 capture가 `TARGET_SE`(0.3) 대신 `MAX_ADMINISTERED_ITEMS`(20문항) 상한으로 확정되는 비율이 지표다(`l2/next_problem_selection.py`). capture 관측에 R6 제한 문항 비율을 싣거나 배치 진단 구간에서 R6 제한을 끄는 조건을 이 태스크의 처분 판정과 함께 본다. 지금은 앱 도달 0이라 영향 0이다(EOS-26 판정문 §5)."
