# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-173-done-mirror-absence-promotion
title: "done의 CI 미러 부재 경고가 경고에 그친다 — 손 재현이 잡 스텝을 빠뜨려 PR CI red(ci-local-repro-gap 4회차) · block 승격 판정"
track: infra-debt
stage: S3
subject: cross
layer: infra
status: done
priority: 2
eos_priority: P1
owner: claude
