acceptance:
  - "① 실측 확정 — GET /v1/me/next-problem의 *정책 축*(action · target_concept · reason)과 *선택 축*(problem_id)이 독립 계산되고 서로를 보지 않는다. 두 방향 모두에서 어긋난다(2026-09-19 EOS-122 페르소나 여정 실측 · main 433ec9ea):\n\n  (가) Persona A — 현재 개념을 숙달(0.69 → 0.98)한 뒤: action=advance_next인데 target_concept은 **방금 숙달한 현재 개념**이고 돌려준 문항도 현재 개념 것이다. 즉 전진을 선언하면서 전진하지 않는다. 다음 개념으로 실제 이동한 것은 현재 개념 문항을 **전부 소진한 뒤**였다 — 이동이 숙달 기반 선택이 아니라 후보 고갈의 부산물이다.\n\n  (나) Persona B — 선수 결손을 보정해 해소한 뒤(선수 숙달 1.0 · prerequisites?weak_only=true 0건): 돌려준 문항은 원래 개념 것으로 올바르게 복귀했는데 action은 여전히 practice_prerequisite이고 target_concept은 이미 숙달된 선수 개념을 가리킨다. 선수 개념에 미시도 문항이 남아 있었으므로 문항 선택은 고갈이 아니라 선택이었다 — 즉 선택 축은 맞고 설명 축만 낡았다.\n\n② 학생에게 닿는 피해 — 이 두 필드는 Recommendation Explanation(계획서 §8 \"추천 이유\")의 입력이다. (나) 상태에서 학생은 \"선수 개념을 연습하세요\"라는 설명과 함께 원래 개념 문항을 받는다. 설명과 콘텐츠가 어긋나면 추천 이유는 신뢰를 쌓는 대신 깎는다.\n\n③ 무엇을 정본으로 삼을지 먼저 정한다 — 선택 축을 정책 축에 맞출 것인가(정책이 지목한 개념의 문항만 후보로), 정책 축을 선택 축에 맞출 것인가(고른 문항의 개념으로 action·target을 재계산), 아니면 둘을 한 번 더 교차 검증해 불일치 시 정직한 값(none/diagnose)을 낼 것인가. 세 안의 파급이 다르다 — 첫째는 후보 0건 상황을 늘리고, 둘째는 정책 의도를 사후 합리화할 위험이 있다.\n\n④ 집행 지점 별항(정본화≠집행) — 계약을 어디서 강제하는지 적는다. 응답 조립 지점(api/me.py::recommend_next_problem)에서 교차 검증할지, l2/recommendation_policy.py 안에서 resolve_target_concept와 후보 선별을 한 경로로 합칠지. 그리고 그 검증이 실제 서빙 응답을 지나가는지 확인한다.\n\n⑤ 회귀 동결 — tests/backend/api/test_e2e_persona_journeys.py가 현행 불일치를 두 군데서 동결하고 있다(Persona A ⑤-b · Persona B ⑧-b). 해소 시 그 단언들이 실패하며 실패 메시지가 이 태스크 id를 지목한다. 해소 PR은 그 단언을 올바른 값 단언으로 승격해야 한다.\n\n⑥ 범위 밖 명문 — CAT θ 추정·난이도 밴드·persona_fit 필터는 건드리지 않는다. 수능 모드 정책(api/_next_problem_policy.py)은 별도 판정이 필요하므로 이 태스크에서 함께 바꾸지 않는다(같은 결함이 그쪽에도 있는지 조사만 하고 적는다)."
