# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-211-server-merge-probe-merge-driver-off
title: "서버 병합 모사 프로브 상시화 — merge 드라이버를 끈 3-way 병합으로 머지 큐 MERGE_CONFLICT를 enqueue 전에 예측 (로컬 병합 시험의 변별력 결함)"
