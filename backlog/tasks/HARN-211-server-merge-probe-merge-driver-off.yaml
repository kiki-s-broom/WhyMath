acceptance:
  - "① 프로브 CLI 신설 — `scripts/harness/server_merge_probe.py <병합 대상 ref> [--ours <ref>]`: 임시 worktree(detached)에서 `.gitattributes`의 `merge=` 선언 줄을 제거한 뒤(제거한 줄 수를 단언 — 0건이면 로컬 병합과 같아 변별력이 없으므로 측정 실패) 3-way 병합을 시도하고 충돌 파일 목록을 낸다. 종료 코드: 0 충돌 없음 · 1 충돌(파일 목록 출력) · 2 측정 실패. 대상이 이미 ours의 조상이면(`git merge-base --is-ancestor`) 병합이 항상 \"Already up to date\"라 아무것도 예측하지 못하므로 통과가 아니라 exit 2로 멈춘다 — 이 사고의 정정 직후 실제로 그 위장 통과가 한 번 났다(프로브가 exit 0·충돌 0건을 출력했는데 HEAD가 이미 origin/main을 포함하고 있었다)."
  - "② 변별력 동결 — `tests/harness/test_server_merge_probe.py`, 임시 저장소 픽스처로: ⓐ 양쪽이 같은 자리에 덧붙임 + `merge=union` 선언 → 로컬 `git merge`는 충돌 0이고 프로브는 충돌 1건(두 값이 갈리는 것이 이 도구의 존재 이유) ⓑ 떨어진 자리 동시 삽입 → 프로브 통과(대조군 — 전부 충돌로 계상하는 과잉 검출 방지) ⓒ `merge=` 선언이 없는 저장소 → 측정 실패 ⓓ 대상이 조상인 경우 → 측정 실패. 뮤테이션(선언 줄 제거 생략 · 조상 검사 제거 · 충돌 목록 무시 · 양성/음성 판정 뒤집기)으로 각 절의 변별력을 확인하고, 픽스처가 그 절을 실제로 밟는지(절을 지우면 어느 입력이 통과하는가)를 절마다 적는다."
  - "③ 집행 지점(정본화와 별항) — 프로브를 실제로 부르는 곳을 정한다: `.claude/commands/drive.md` 5.5(PR 생성) 직후와 \"pr\" 흐름의 enqueue 직전, 그리고 `backlog.py done`의 PR 증적 안내 중 하나 이상이 최신 main에 대한 프로브 실행을 요구하게 한다. 배선 동결 테스트가 그 문서·코드가 프로브를 가리키는지(그리고 CI 잡이 그 테스트를 돌리는지) 확인한다. 프로브가 저장소에 있어도 아무도 부르지 않으면 이 사고는 되풀이된다."
  - "④ 한계를 도구 출력에 병기 — 머지 큐 그룹의 실제 병합 기준은 enqueue 시점이 아니라 그룹 형성 시점의 tip이라, 프로브는 '지금의 main'과의 충돌만 예측한다. 큐에서 앞서 착지할 PR이 같은 자리를 건드리면 못 본다. 이 한계는 프로브 출력 마지막 줄에도 적는다(통과를 '큐에서도 안전'으로 읽지 않게). 구조 대책은 HARN-210(MEMORY.md 동시 append — PR 1406 계류)이 맡고, 이 태스크는 enqueue 전 사전 검출이다. 두 태스크의 범위가 겹치는지(프로브가 HARN-210 착지 뒤에도 필요한 범위)는 HARN-210 ③ 설계 판정 때 함께 본다."
  - "⑤ 근거 사고(2026-10-02 PR #1419): 머지 큐가 MERGE_CONFLICT로 이탈시켰다(15:01Z, github-merge-queue[bot]). 로컬 병합 시험은 \"Merge made by the 'ort' strategy\"로 충돌 0이었고 merge 드라이버를 끈 서버 방식 모사는 MEMORY.md 1건이었다. 원인: main이 base(28c12104)의 11743행 뒤에 9줄, 이 브랜치가 같은 자리에 27줄을 동시에 덧붙였다. 해소는 내 항목 3건을 상단 결정 로그의 비경합 지점으로 옮겨 main 대비 순수 단일 삽입(+28줄)으로 만든 것이고, 해소 전후로 프로브 결과가 충돌 1건에서 0건으로 갈렸다(양성 대조군: 같은 자리 삽입 시 충돌 / 음성 대조군: 최상단·EOF·멀리 떨어진 중간 삽입은 통과). 이 실측은 HARN-210 ①이 '못 본 것'으로 적은 \"머지 큐가 MEMORY.md 동시 append로 실제 이탈시키는지\"의 첫 증거다."
  - "[정정 2026-10-08 · PR 1526 실측 반영] ⑥ 프로브(임시 worktree)는 작성자 신원을 git config로 쓰지 않는다. 리눅스 linked worktree에서 git config user.email·user.name은 공통 .git/config에 기록되어 이후 메인 작업 트리의 모든 커밋이 그 신원으로 만들어진다(2026-10-08 PR 1526 실측: 병합 커밋 7359edb7과 결정 로그 커밋 1547abc6이 작성자 't <t@t.t>'로 남아 squash 커밋 fb9eff30의 메시지에 'Co-authored-by: t <t@t.t>'가 혼입 — main 히스토리라 되돌릴 수 없다). 신원은 git -c user.name=... -c user.email=... 옵션 또는 GIT_AUTHOR_*·GIT_COMMITTER_* 환경변수로만 준다. 동결: ②의 테스트에 '프로브 실행 전후 공통 .git/config의 바이트 해시가 같다'와 '실행 뒤 git worktree list가 실행 전과 같다'를 단언하고, 뮤테이션(프로브가 git config로 신원을 쓰게 바꿈)이 RED가 됨을 확인한다. ⑦ 실측 증거(이 태스크의 우선순위 판단 자료): PR 1526이 머지 큐에서 MERGE_CONFLICT로 2회 이탈했다(2026-10-08 08:25Z·09:24Z). 두 번째 이탈 직후 상태(내 head cd78fd77 대 main)를 merge=union 줄을 지운 임시 worktree에서 병합하자 MEMORY.md 1구간만 충돌했고(로컬 병합은 충돌 0), 결정 로그 블록이 base 중간에 놓이게 병합한 head는 같은 시험과 'main 끝에 다른 PR이 덧붙인 상황을 합성한 시험'에서 모두 충돌 0이었다(이전 head는 대조군으로 충돌). 첫 번째 이탈은 재현하지 못했다. 이 시험은 즉석 스크립트로만 했고 저장소에 남지 않았다 — ①~③이 구현되기 전까지 같은 계열(memory-md-append-github-dirty)은 사람이 즉석 시험을 만들어야만 잡힌다(사고 대장 3회차)."
