notes: "발견 경위(2026-09-25 · 게이트 G-kg02-review-promotion-llm-session 점검 세션 · 판정 기준 main 3a7a7315 — 실측은 f138f894에서 했고 두 커밋 사이 관련 경로 diff 0). 게이트는 'KG-02 승격이 미검증 AI 콘텐츠의 학생 노출을 막는다'를 전제로 했는데, 로컬 PostgreSQL 16 + pgvector 0.8.0에 코퍼스 846행·원자 2,683행을 적재하고 실제 승격 CLI로 주입해 보니 전제가 두 겹으로 틀렸다. (1) /v1/concepts/search 는 atom_node(전 행 ai_estimated 상수)를 읽어 승격 후에도 reviewed_only=true 결과가 0 그대로였고(양성 대조: 원자 1건을 reviewed로 바꾸면 1건 반환), 승격이 바꾸는 곳은 /v1/concepts/content?reviewed_only=true(0→2)뿐이었다. (2) 학생 대면 /study 공급 경로의 get_concept_dsl 은 review_status를 보지 않는다 — ai_estimated 행에도 DSL이 나온다. 이 태스크는 (2)를 소유한다. 유사 선례: CONT-01(같은 /study 경로의 평가 재료 축 검수 비대칭 — done). 역할 분리: CONT-02는 QA 오케스트레이터의 감사 축 거취, KG-02는 승격 실행, 이 태스크는 공급 경로의 노출 게이트. 판정문 = docs/reviews/kg02_gate_premise_recheck_2026-09-25.md\n\n[정정 2026-09-27] paths ['src/backend/whymath_backend/l4/content_supply.py', 'src/backend/whymath_backend/api/study.py', 'src/backend/whymath_backend/l1/concept_content/review_gate.py', 'src/backend/whymath_backend/harness/concept_content_review_apply.py', 'tests/backend/l4/test_content_supply*.py'] → ['src/backend/whymath_backend/l4/content_supply.py', 'src/backend/whymath_backend/api/study.py', 'src/backend/whymath_backend/l1/concept_content/review_gate.py', 'src/backend/whymath_backend/harness/concept_content_review_apply.py', 'tests/backend/l4/test_content_supply*.py', 'tests/backend/l4/test_catalog_consumption.py', 'tests/backend/api/test_study_endpoint.py', 'docs/reviews/cont05_*.md']: 공급 게이트가 콘텐츠 행의 review_status를 읽으므로 같은 행 대역을 쓰는 기존 테스트 2파일(카탈로그 소비·study 엔드포인트)의 대역에 검수 상태를 넣어야 하고, 서빙 경로 도달 증명 테스트를 study 엔드포인트 파일에 둔다. 판정문 경로 추가(5경로 유지 + 3경로 추가)\n\n[정정 2026-09-27] 판정 결과 기록(acceptance ① 잠복 명기 포함)"
