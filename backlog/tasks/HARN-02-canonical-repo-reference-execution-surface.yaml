acceptance:
  - "① 실패 재현 — 이관 후 harness-audit가 상시 red임을 실측으로 고정한다. 관측: run 34425627951(2026-09-10T01:28Z · event=push · main 28a90846 · actor=github-merge-queue[bot])의 잡 \"통합 흐름 진단\"이 `측정 실패 — 필수 체크 0건(규칙 미조회/권한 부족). 이상 없음이 아니다` + EXIT=1로 종료했다. 원인은 워크플로 156행이 옛 owner 리터럴을 인자로 넘기고(`pr_delivery_audit.py doldori7/WhyMath`), 도구의 curl에 `-L`이 없어 GitHub의 301 응답 본문(dict)을 규칙 목록(list)으로 파싱해 required가 공집합이 되는 것이다. 착수 시 스텁으로 301 응답을 주입해 같은 문구가 재현되는지 먼저 확인한다."
  - "② 저장소 지목을 자기서술로 교체 — .github/workflows/harness-audit.yml이 넘기는 인자를 리터럴 owner에서 `${{ github.repository }}`로 바꾼다. 같은 저장소의 pr-auto-resync.yml이 이미 그 방식을 쓴다(`REPO: ${{ github.repository }}`). 이렇게 하면 다음 이관에서도 자동으로 따라간다 — 이름을 새 owner로 바꿔 적는 것은 같은 사고를 한 번 더 예약하는 것이다."
  - "③ 원인 구분 — 도구가 리다이렉트를 따르게 하고(curl `-L`), 규칙 응답이 list가 아닐 때 \"필수 체크 0건\"으로 뭉개지 않고 HTTP 상태와 응답 본문 앞부분을 남긴다. 현행 문구는 서로 다른 원인 3종(저장소 이동 · 권한 부족 · 진짜 0건)을 같은 글자로 보이게 한다 — CLAUDE.md \"측정·수집 도구를 성공 경로만 보고 설계 금지\" ②(실패 원인이 남는가)의 위반이다. fail-closed 자체는 유지한다(조회 실패를 이상 없음으로 넘기지 않는 설계는 옳게 작동했다 — 그래서 이 사고가 보였다)."
  - "④ 런북 문자열의 정본 갱신 — scripts/harness/ruleset_drift.py·ruleset_pin_plan.py의 docstring이 Kiki에게 안내하는 gh 명령이 옛 owner를 가리킨다. 이 문자열은 사람이 복사해 실행하는 경로이므로(CLAUDE.md 실행용 블록 규칙) 정본으로 고친다. 경계: scripts/ops/pr_merge_readiness.py의 같은 성격 문자열은 HARN-82가 소유한 파일이라 손대지 않는다."
  - "⑤ 변별력 — 뮤테이션으로 각 수정이 실제로 보호가 되는지 확인한다. 최소 4종: ⓐ워크플로 인자를 리터럴 owner로 되돌린다 ⓑcurl의 `-L`을 제거한다 ⓒnon-list 응답의 원인 보존을 제거해 옛 문구로 되돌린다 ⓓ전수 스캔의 대상 수집을 0건으로 만든다(공허한 통과 검출). 각 주입은 적용 실재(`mutated != original`·치환 count)를 단언하고, 원복은 cp 백업으로 하며 바이트 동일을 확인한다(git 계열 원복 금지). 픽스처가 각 절을 실제로 밟는지도 확인한다 — 301 본문이 없는 픽스처로는 ⓑ가 살아남는다."
  - "⑥ 경계 명시 — 이 태스크는 실행 표면(워크플로 인자·도구 코드·런북 문자열)만 다룬다. HARN-96 ⑥(정본 참조 갱신)이 소유하는 docs·README·배지, CODEOWNERS의 개인 계정 지정, merge queue 전제 재판정(HARN-98·HARN-56), pr_merge_readiness.py(HARN-82)는 범위 밖이다. MEMORY.md·backlog·docs/reviews의 옛 owner 언급은 과거 사실의 기록이므로 고치지 않는다 — 이력을 현재로 덮어쓰면 판정 시점이 사라진다."
  - "⑦ **④·⑥의 경계 정정 — 파일 2개를 추가로 건드렸다(구현 중 판단 · 2026-09-10).**\n\n[무엇을] ⓐ scripts/ops/pr_merge_readiness.py 의 사용 예 1줄 ⓑ .github/workflows/pr-auto-resync.yml 의 헤더 주석 1문단.\n\n[왜 뒤집었나] ⑤가 요구한 전수 가드를 만들자 이 두 곳이 마지막 잔여물로 남았다. 남겨 두려면 가드에 면제를 넣어야 하는데, 만료 없는 면제는 이 저장소가 금지하고(CLAUDE.md \"만료 없는 유예·제외 금지\") 만료를 붙이면 아무도 안 고치는 유예가 하나 더 생긴다. 반면 두 곳 다 **사실 정정 1건**이지 판단이 아니다 — ⓐ는 사람이 복사해 실행하는 명령이 사라진 경로를 가리키던 것이고, ⓑ는 \"이 저장소는 개인 계정이라 merge queue를 쓸 수 없다\"는 **지금은 거짓인 서술**이다.\n\n[남의 몫은 건드리지 않았다] ⓐ에서 HARN-82가 소유한 축(필수 체크 6종 vs 16종 docstring)은 손대지 않았다. ⓑ에서도 merge queue 도입·재판정은 하지 않고, 실측 사실(owner.type=Organization · PUT /pulls/{n}/merge가 405 `Changes must be made through the merge queue`)만 병기한 뒤 재판정 주체를 HARN-56으로 명시했다.\n\n[대안을 왜 안 골랐나] \"새 owner 이름으로 바꿔 적기\"는 다음 이관에서 같은 사고를 예약한다. 그래서 워크플로는 `$GITHUB_REPOSITORY`, gh 런북 문자열은 gh가 현재 저장소로 치환하는 `repos/{owner}/{repo}/...` 형태로 바꿨다 — 이름을 쓰지 않는 것이 이 태스크의 요지다."
  - "⑧ **실효 실측 — 고친 것은 고쳐졌고, red는 남았다(원인이 바뀌었다) · 2026-09-10T17:30Z.**\n\n[측정] main 착지분(`54b332ee`)에 대한 harness-audit run `34508612978`(event=push · actor=github-merge-queue[bot]) 잡 「통합 흐름 진단」:\n\n    ❌ 측정 실패 — 규칙 5건은 읽혔으나 required_status_checks 0건(HTTP 200 · repo=kiki-s-broom/WhyMath). '이상 없음'이 아니다\n    EXIT=1\n\n[① ~ ③은 충족됐다] 문구가 바뀐 것 자체가 변별력이다. 착지 전에는 `필수 체크 0건(규칙 미조회/권한 부족)`이었고 지금은 **HTTP 200 · repo=kiki-s-broom/WhyMath · 규칙 5건**을 말한다 — ②(`$GITHUB_REPOSITORY` 자기서술)가 새 owner로 따라갔고, ③(`-L` + 원인 구분)이 301을 데이터로 오독하던 경로를 닫았다. 이 태스크가 약속한 축은 전부 실측으로 확인됐다.\n\n[그러나 잡은 여전히 red다 — 원인이 다른 것으로 교체됐다] 규칙은 **읽혔는데** 그 안에 `required_status_checks` 타입이 없다. 이 축은 이 태스크가 아니라 **`HARN-82`가 이미 소유**하며, 그 태스크는 2026-09-07부터 정확히 이 이유로 blocked다(그 notes ⓐ: `/rules/branches/main`·`/rulesets/16623542` 양쪽 admin 뷰에서 required_status_checks 규칙 자체가 없음 · 그 룰셋 updated_at = 2026-09-07T21:25:48Z).\n\n[새로 확정된 시간선 — HARN-82 해소에 쓰라] 게이트 대장과 대조하면 세 시점이 잡힌다:\n  · 2026-09-03 `G-required-checks-live-drift-fix` cleared — Kiki가 웹 UI로 미강제 10건 등록, 라이브 16건 ↔ 문서 16건 **기계 대조 완전 일치**\n  · 2026-09-05 `G-required-checks-source-pin-cleanup` cleared — 16건 전부 GitHub Actions(15368) pin · 중복 0 · drift EXIT=0\n  · 2026-09-07T21:25:48Z 룰셋 갱신 → **23:56Z 조회에서 required_status_checks 규칙 소멸**(HARN-82 실측)\n  · 2026-09-10T17:30Z 이 실측 — 여전히 0건이고 규칙 수는 4 → **5**로 늘었다(전환 후 켜진 merge queue가 5번째로 추정 — 확정 아님)\n즉 이 소멸은 **조직 이관 때문이 아니다**. 이관(2026-09-09)보다 이틀 앞선 09-07 룰셋 편집 시점에 이미 일어났다.\n\n[반대 방향 신호 — 미해소로 남긴다] 그런데 merge queue는 실제로 게이트 역할을 하고 있다: PR #1063은 큐 진입 후 `merge_group` CI(run `34506570351`)가 17:10:22Z~17:29:45Z 약 19분 55초를 돈 **뒤** 17:30:16Z에 머지됐다(성공 31초 후). 필수 체크가 정말 0건이면 큐는 기다리지 않고 즉시 머지한다. 그러므로 \"보호가 사라졌다\"와 \"보호는 사는데 이 API 창으로 안 보인다\" 중 어느 쪽인지 **이 세션은 가르지 못했다** — 레거시 `/branches/main/protection`은 integration에 403이고(HARN-82 ⓑ), 이 세션에서는 프록시가 리다이렉트 목적지(숫자 ID 경로)를 거부해 조회 자체가 불가하다(`HARN-04`). 추론으로 채우지 않는다.\n\n[남기는 판정] 이 태스크는 done을 유지한다 — 약속한 ①~⑦은 실측 충족됐고, 잔여 red의 원인은 착수 시점에 이 태스크가 지목한 것(301 오독)이 아니라 별 태스크가 이미 소유한 것이다. 다만 제목이 \"harness-audit 상시 red\"라 다음 세션이 \"done인데 왜 red냐\"로 재조사할 위험이 있어 이 항을 남긴다: **red의 잔여 소유자는 `HARN-82`이고, 그 해소 조건은 사람(관리자 권한 조회 또는 Kiki의 룰셋 확인)이다.**"
artifacts:
  - "커밋 a2bb1078 · PR #1063 (같은 브랜치에 누적 — 이 PR이 이미 열려 있어 별도 PR을 열지 않았다).\n\n[결함 재현 → 수정 → 검출] 스텁 curl로 301 본문을 주입해 CI와 **같은 문구**를 재현한 뒤 고쳤다: 수정 전 `측정 실패 — 필수 체크 0건(규칙 미조회/권한 부족)` EXIT=1 → 수정 후 `측정 실패 — 규칙 응답이 목록이 아니다(HTTP 301 · repo=doldori7/WhyMath)` + 응답 본문 앞 300자.\n\n[뮤테이션 6종 전건 RED · 생존 0] M1 워크플로 인자를 옛 owner로 회귀 / M2 curl -L 제거 / M3 원인 보존 제거 / M4 스캔 글롭 무력화 / M5 상태 미상을 200으로 단정 / M6 pr-auto-resync 주석을 거짓 상태로 회귀. 각 주입은 치환 count와 mutated != original을 단언하고, 원복은 cp 백업 + sha256 바이트 동일로 확인했다(git 계열 원복 미사용). M4는 1회차에 **생존**했다 — 합계만 단언하면 한 글롭이 죽어도 나머지가 수를 채우기 때문이다. 글롭별 매치 단언으로 강화하자 RED가 됐고, 그 단언이 곧바로 내 목록의 죽은 글롭(`*.yaml` 매치 0건)을 잡아냈다.\n\n[스위트] tests/infra 1156 passed 1 skipped EXIT=0 · tests/harness 787 passed EXIT=0 · validate green(태스크 607·게이트 41) EXIT=0 · audit-deps 위반 0건 EXIT=0 · ruff/black은 CI 명령 그대로 4회 전부 EXIT=0(black 1회차 EXIT=1로 신규 파일 1건 상환).\n\n[CI 배선] tests/infra는 infra-contracts 잡이 수집한다 — 신규 배선 불요. 워크플로 변경분의 실효(harness-audit가 green으로 돌아오는지)는 main 착지 후 다음 예약 실행에서 확인된다."
