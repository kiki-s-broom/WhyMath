notes: "발견 경위(2026-09-10 · 실측): Kiki가 \"이관에 따른 문제들을 제시하고 해결책을 적용한 후 테스트까지\" 요청해 조사하던 중, harness-audit의 최신 실행(run 34425627951)이 failure임을 확인했다. 잡 로그 전문에 `측정 실패 — 필수 체크 0건(규칙 미조회/권한 부족)`과 EXIT=1이 남아 있다.\n\n[이관 사실 실측] kiki-s-broom은 API에서 owner.type=Organization이고(search API 응답), 저장소 id가 1237870848로 doldori7 시절과 동일하다 — 복사본이 아니라 Transfer다. Actions 워크플로 5종이 전부 state=active로 승계됐고, merge queue가 실제로 켜져 있다(PUT /pulls/1063/merge → 405 `Changes must be made through the merge queue`). 이 세션은 doldori7 스코프에 고정돼 있지만 REST는 리다이렉트로 도달한다 — HARN-96 ⑧이 적은 \"doldori7 고정 세션에서는 집행 불가\"는 git push·REST에 대해서는 성립하지 않는다(GraphQL 스레드 해결만 거부됨).\n\n[왜 별건인가] HARN-96은 이관 전체 계획이고 사람 게이트(G-canonical-repo-cutover-kiki-s-broom)에 막혀 착수가 거부된다(실측: start exit 1). 그러나 harness-audit는 지금 main에서 실패하는 중이고, 상시 실패하는 검사는 습관화돼 소음이 된다(CLAUDE.md 2026-07-27 금기). 게이트 해소를 기다릴 축이 아니라 지금 고칠 축이므로 분리했다.\n\n[겹침 고지] paths가 .github/workflows/harness-audit.yml을 포함해 HARN-96의 glob(.github/workflows/**)과 프리픽스로 겹친다. 다만 HARN-96 ⑥은 정본 참조 표기 갱신이고 이쪽은 실행 인자를 자기서술로 바꾸는 것이라 같은 줄을 다르게 고친다 — 이쪽이 먼저 착지하면 HARN-96 ⑥의 그 줄은 이미 해소된 상태가 된다.\n\n[정정 2026-09-10] paths ['.github/workflows/harness-audit.yml', 'scripts/ops/pr_delivery_audit.py', 'scripts/harness/ruleset_drift.py', 'scripts/harness/ruleset_pin_plan.py', 'tests/infra/test_canonical_repo_reference.py'] → ['.github/workflows/harness-audit.yml', 'scripts/ops/pr_delivery_audit.py', 'scripts/harness/ruleset_drift.py', 'scripts/harness/ruleset_pin_plan.py', 'tests/infra/test_canonical_repo_reference.py', 'scripts/ops/pr_merge_readiness.py', '.github/workflows/pr-auto-resync.yml']: 구현 중 경계 정정 — 전수 가드에 만료 없는 면제를 넣지 않기 위해 잔여 2곳을 사실 정정으로 포함\n\n[정정 2026-09-10] 착지 후 실효 실측 — 고친 축(301 오독)은 확인됐고 잔여 red의 원인은 HARN-82 소유임을 기록"
