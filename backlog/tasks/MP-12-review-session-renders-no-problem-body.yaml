notes: "G-eos-first-run-canary-review 실행 직전 발견. Kiki께 [R2] 대화형 검수를 안내했는데, 코드를 다시 읽어 보니 `_render_item`(review_session.py:300)이 출력하는 것은 `[i/n] slug`·`큐 상태:`·`근거:` 셋뿐이고 문항 본문이 없다. 큐 파일(canary_review_queue.jsonl)에는 본문이 `candidate_payload`로 이미 들어 있으며(canary_slice.py:321이 코퍼스 레코드를 그 자리에 싣는다) `load_review_items`가 그 키를 읽지 않을 뿐이다 — 데이터 공백이 아니라 렌더러 공백이다. 그대로 실행됐다면 눈 감은 판정 15건이 골든셋 승격 원천(MP-03)으로 기록될 뻔했다. ADMIN-14와는 반대 축이다: 그쪽은 `candidate_payload`의 HTTP 응답 노출을 금지 동결하고(관리 웹 표면), 이쪽은 로컬 CLI가 검수자 본인에게 보여주는 축이라 노출이 요건이다 — 두 태스크가 같은 필드를 반대 방향으로 다루므로 구현 시 서로의 테스트를 깨지 않는지 확인한다.\n 병렬 세션의 MP-11(브랜치 claude/wizardly-tesla-2lsb3z · PR #1279)이 2026-09-22 라이브 검수에서 런북 결함 2건을 잡았고 그 태스크는 \"검수 자체는 15건 분모로 정상 진행됐다\"고 적었다 — 즉 본문 없이 진행된 검수가 이미 있을 수 있다. main의 검수 런북(docs/reviews/mp02_canary_review_runbook.md)도 §4 판정 키·F1~F8 표만 주고 문항을 보는 경로를 주지 않는다(grep: 본문/candidate_payload 0건). 따라서 이 결함은 런북 축이 아니라 렌더러 축이며, 이미 기록된 판정이 있다면 그 유효성 재판정이 뒤따른다.\n\n[정정 2026-09-22] ②가 존재하지 않는 힌트 필드를 요건으로 선언한 것을 실측으로 정정(가용성 확인 절차)"
