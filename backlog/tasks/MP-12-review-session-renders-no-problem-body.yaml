acceptance:
  - "검수 화면이 문항 본문을 출력한다 — 큐 행의 `candidate_payload`(문항·정답·해설·힌트·검산 조건)를 `ReviewItem`이 싣고 `_render_item`이 렌더한다. 본문 없이 slug만 보고 F1~F8(정답 불일치·논리 비약·힌트 정답 누설)을 판정하는 것은 판정이 아니므로, 본문 부재는 화면에 그 사실을 명시한다(조용한 공백 금지 — `payload 없음(사유)` 1줄)"
  - "F8(힌트 정답 누설) 판정에 필요한 축이 한 화면에 함께 보인다 — 최종 정답과 L1·L2 힌트를 같은 항목 안에 렌더한다. 이 두 축이 분리돼 있으면 무관용 KPI(누설률 0%)를 사람이 구조적으로 판정할 수 없다"
  - "회귀 동결 — `tests/backend/harness/test_review_session.py`에 본문 렌더 계약 테스트를 추가하고, 뮤테이션으로 변별력을 실측한다: ①`candidate_payload` 렌더 절을 제거하면 RED ②본문 부재 고지 절을 제거하면 RED ③정상 입력 대조군은 GREEN. 렌더 문자열이 아니라 *출력 스트림에 실제로 나타난 내용*을 단언한다"
  - "정정(②의 전제 오류) — ②는 \"L1·L2 힌트를 정답과 함께 렌더한다\"고 적었으나, 이 저장소의 문제 코퍼스에는 힌트 필드가 없다(실측 2026-09-22: `data/corpus/problem_bank_*/problems.jsonl` 전 파일에 `hint` 키 0건 · `schema/problem.py`의 `Problem`에도 힌트 필드 부재 — `common_mistakes`의 `hint` 키는 오개념 축이고 문항 본문 축이 아니다). 있지도 않은 필드를 요건으로 두면 영원히 충족 불가한 acceptance가 되므로 축을 정정한다: F8은 이 회차에서 **정답과 해설(`answer_explanation`)의 대조**로 판정하며, 힌트가 나중에 실리면 `기타 필드(값 있음·미표시)` 고지 줄에 키 이름이 나타나 검수자가 그 사실을 알 수 있게 한다(회귀 동결 = `test_unrendered_nonempty_keys_are_disclosed`). 설계서 §3의 CU 정의(3단계 힌트 포함)와 현행 코퍼스의 간극 자체는 이 태스크가 닫지 않는다 — 저작 스펙 축이다."
