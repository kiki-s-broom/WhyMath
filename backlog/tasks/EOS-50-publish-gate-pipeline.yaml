4 작업이 압축되고 구현은 11/14까지 끝나야 한다. EOS-128 4회차 · 판정 기준 main 1671b9d4\n\n[정정 2026-09-24] depends_on 제거 1건: 기본방침 변경(2026-09-24 Kiki 지정 · build_harness.md §3a): 기간은 목표이지 진도 제한이 아니다. 떼어낸 부착은 주차 경계 대용이었고 Publish 파이프라인의 내용 입력이 아니다. EOS-49 부착은 유지한다\nnotes 치환 — 기본방침 변경(2026-09-24 Kiki 지정 · build_harness.md §3a): 기간은 목표이지 진도 제한이 아니다. 떼어낸 부착은 주차 경계 대용이었고 Publish 파이프라인의 내용 입력이 아니다. EOS-49 부착은 유지한다"
