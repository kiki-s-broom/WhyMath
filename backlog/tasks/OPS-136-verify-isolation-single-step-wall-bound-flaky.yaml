acceptance:
  - "① 결함 고정(증거 보존) — main 머지 큐에서 tests/backend/api/test_verify_isolation.py::TestBudgetMeansUnverifiable::test_slow_step_is_unverifiable_not_correct_nor_incorrect 가 실패했다: PR #1565의 큐 실행(run 38249677879 · job 114812476977 · 2026-10-12 13:04Z · 기반 main d873d064)에서 \"상한 0.5s인데 2.07s — 계산이 끊기지 않았다 / assert 2.072813849000113 < 2.0\"(전체 19,268건 중 1건). 이 테스트는 OPS-127(#1582)·OPS-128(#1588)이 다루지 않았고, OPS-127 PR 본문이 과부하에서 흔들린다고 거명한 test_control_without_isolation_blocks_the_loop · test_normal_step_is_unaffected_by_isolation 과도 다른 테스트다. 이 실패를 재현하는 테스트 호출 조건(부하·반복 횟수)을 PR 본문에 적는다.\n② 원인 실측 — 가설을 사실로 쓰지 않는다(OPS-127은 등록 당시 가설 '앱 기동이 측정에 섞인다'를 실측으로 기각한 선례다). 이 테스트의 elapsed는 with TestClient(_app()) 진입 전부터 종료 후까지를 재므로 앱 기동 · 요청 · 앱 종료(풀 shutdown이 워커를 kill하고 join을 최대 2.0초 기다림 — l3/isolated_call.py _kill · shutdown)를 모두 포함한다. 체인 테스트는 OPS-127에서 요청 한 건만 재도록 바뀌었으나 이 테스트는 그대로다. 코드를 읽어 보이는 후보(미실측): (a) 상한 초과 직후 _prewarm_replacement가 교체 워커를 띄우고 그 import(약 0.8초)가 진행 중일 때 with 종료가 그 워커를 kill·join해 종료 구간이 부푼다 (b) 상한 초과 kill 자체의 join (c) CI 러너 부하로 계산 상한 0.5초 밖의 구간이 늘어난다. 구간을 (진입 / 요청 / 종료)로 분해해 단독 10회 이상 + 4병렬 부하에서 재고, 어느 구간이 2.0초 단언을 밀어 올리는지 수치로 적는다. 가설이 틀리면 기각을 그대로 기록한다.\n③ 해법 — ②의 실측을 따르되 판정 의미(상한 초과 = 판정 불가, 통과·오답 아님, 계산이 끊김)는 바꾸지 않는다. 변별력 보존: 이 단언은 격리·상한이 계산을 끊었는지를 보므로, 상한을 없앤 뮤테이션(격리 off 또는 timeout 무제한)에서 반드시 RED여야 한다. 느린 식의 실제 계산 시간(테스트 docstring은 이 환경 약 3초라 적음 — CI 러너 실측치를 따로 적는다)과 정상 최대 사이에 새 경계가 놓임을 수치로 보인다. 정상 최대와 뮤테이션 최소의 간격이 좁으면(예: 2.07초 대 약 3초) 벽시계 단언 대신 시간 비의존 검증(가짜 시계 + 스텁 풀로 계산 상한 0.5초가 전달되고 BudgetExceededError가 판정 불가로 접힘)을 쓴다 — OPS-127의 test_solution_grants_each_transition_only_the_remaining_budget 선례. 원인이 제품 쪽(예: shutdown의 kill·join 대기)이면 OPS-128 선례대로 테스트 범위 밖이므로 별도 태스크로 분리 등재한다.\n④ 같은 파일 시간 단언 전수 — tests/backend/api/test_verify_isolation.py 안에서 time.perf_counter()로 재는 단언 테스트를 전부 열거하고 각각 (측정 구간 · 상한 · 근거 수치 · 정상 분포 · 뮤테이션 최소)를 표로 남긴다. 근거가 없거나 상한이 정상 최대의 1.5배 미만으로 붙은 단언은 같은 PR에서 고치거나 별도 태스크로 등재한다. 다른 파일의 시간 단언 전수는 범위 밖(필요하면 별도 태스크).\n⑤ 검증 — 이 PR이 닿는 CI 잡을 ci_job_coverage.py scope로 열거하고 로컬에서 그 잡의 해당 스텝을 exit code로 판정한다. 같은 파일을 4병렬 × 5회 이상 반복해 실패 0건을 보이되, 수정 전 코드에서 같은 반복이 RED를 내는지 먼저 확인한다 — 재현이 안 되면 재현 못 했음을 PR 본문에 정직하게 적고 머지 큐 실측으로 갈음한다. 뮤테이션 주입은 cp 백업 · mutated != original 단언 · 원복 sha256 일치로만 하며 git checkout/restore/stash로 원복하지 않는다."
  - "[정정 2026-10-13 — 위 ②의 원인 후보 (a)와 구간 분해를 코드 재확인으로 대체] ②는 'with 종료 시 풀 shutdown이 워커를 kill·join한다'고 적었으나 틀렸다. 워커 풀(api/_isolated_call.py의 _pool)은 프로세스 전역이고 닫히는 곳은 atexit와 reset_pool_for_tests뿐이며 app.py의 lifespan은 풀을 닫지 않는다(grep으로 확인) — 그래서 앱 종료가 교체 워커를 죽이는 경로는 기각한다(읽어서 확인한 것이며 실측은 아니다). 후보를 다음으로 대체한다. 모두 읽어서 세운 가설이며 측정하지 않았다.\n(a') 상한 초과 경로의 응답 전 동기 구간 — l3/isolated_call.py _roundtrip은 계산 상한 초과 뒤 BudgetExceededError를 던지기 전에 _kill(kill + join 최대 2.0초)과 _prewarm_replacement(_spawn → Process.start)를 동기로 실행한다. 둘 다 계산 상한 0.5초 밖이고 응답 전이라 러너 부하에서 늘면 요청 시간에 그대로 더해진다(교체 워커의 import 자체는 응답 뒤에 겹쳐 진행).\n(b') 앱 lifespan 진입·종료 — elapsed가 with 바깥에서 닫히므로 포함된다. 체인 테스트에서는 0.014~0.016초·0.004초로 실측됐으나 이 테스트·큐 부하 조건에서는 미실측.\n(c') 큐 실행의 전체 병렬 부하(pytest -n auto)로 인한 스케줄링 지연 — 요청 경로 전반이 늘어난다.\n(d') _warm_worker 뒤에 워커가 실제로 ready·idle 상태인지 — 아니라면 단건 경로는 워커 기동·복원 대기가 계산 상한 밖이다(OPS-128 ②는 단건 엔드포인트의 이 동작을 바꾸지 않았다).\n구간 분해는 앞의 3분할 대신 (앱 진입 / 워커 확보→ready / 복원 / 계산 / kill+교체 기동 / 앱 종료) 6분할로 잰다. 단독 10회 이상 + 병렬 부하에서 재고 어느 구간이 2.0초 단언을 밀어 올리는지 수치로 적는다. 가설이 틀리면 기각을 그대로 기록한다."
  - "[증거 추가 2026-10-14 — 같은 파일의 세 번째 시간 단언 실패: test_solution_cold_worker_boot_cannot_outlive_chain_budget (PR #1598 머지 큐, 측정 사실과 읽어서 해석한 것을 구분해 적는다)]\n【측정된 사실】 ⓐ 실패: tests/backend/api/test_verify_isolation.py::TestBudgetMeansUnverifiable::test_solution_cold_worker_boot_cannot_outlive_chain_budget — PR #1598(QUAL-13)의 머지 큐 실행 run 38404077280 · job 115319046841(backend — lint·type·test)의 Pytest 스텝, 2026-10-13 13:19Z 시작·13:51Z 종료, 큐 브랜치 gh-readonly-queue/main/pr-1598-ad6fb029…(기반 = PR #1610 머지 ad6fb029). 로그 줄: \"AssertionError: 체인 총 예산 2.0s인데 3.24s — 워커 기동 대기가 마감 밖이다 / assert 3.237565072000052 < (2.0 + 0.75)\" · 요약 \"1 failed, 19621 passed, 646 skipped, 1 xfailed in 1757.97s\". 단언 상한 2.75초를 0.49초, 체인 총 예산 2.0초를 1.24초 넘겼다. 이 실패 하나가 backend 잡의 뒤 21스텝(계층 커버리지·게이트 CLI들)을 skipped로 만들어 큐가 PR을 CI_FAILURE로 뺐다. ⓑ 같은 코드 재실행: 같은 head(17b681b3)가 같은 PR 브랜치의 일반 CI에서 이 테스트를 통과했고(head e1cf0941·17b681b3 두 번 모두 backend 잡 success), 재진입한 큐 실행(13:54Z)은 통과해 14:30Z에 머지됐다(머지로 확인했고 그 큐 실행의 개별 로그는 열람하지 않았다). 즉 같은 커밋·같은 테스트가 실패와 통과를 모두 냈다 — 결정적 결함이 아니라 부하 의존이다. ⓒ 같은 테스트의 이전 관측: PR #1604 본문이 이 테스트가 로컬 미러에서 \"잡 5종 동시 실행 시 2회 실패, backend 잡 단독 실행은 통과, 테스트 단독 2회 통과\"했다고 적었다(그 PR의 변경 파일은 이 테스트를 참조하지 않는다고 적혀 있다). ⓓ 이 PR(#1598)의 변경은 pregenerate/validator.py·신규 테스트·문서·대장뿐이라 격리 워커·api 코드에 닿지 않는다(병합 기준점 대비 변경 6개 파일 중 격리 관련 0건).\n【acceptance ①~⑤에 미치는 영향 — 읽어서 해석한 것, 미실측】 (1) 이 테스트는 ①이 명시한 test_slow_step_is_unverifiable…의 형제가 아니라 별개의 세 번째 테스트다(OPS-127 PR 본문이 거명한 두 테스트와도 다르다). ①의 범위 문장과 ④의 전수 표에 반드시 포함해야 한다 — ④가 \"같은 파일 시간 단언 전수\"이므로 이미 범위 안이다. (2) 이 테스트의 started는 with TestClient(_app()) 안쪽에서 잡힌다(OPS-127이 요청 1건만 재도록 이미 좁혔다 — 파일 256~280행을 읽어 확인). 그러므로 3.24초는 앱 기동·종료 구간(후보 b')이 아니라 요청 자체의 시간이며, b'는 이 실패를 설명하지 못한다. 설명 후보는 a'(상한 초과 뒤 동기 kill+교체 기동)·c'(큐 전체 병렬 부하)·d'(워커 ready 대기)로 좁혀지고, 이 테스트는 워커 기동(import에 4.0초 걸리는 모듈 주입)을 마감 안에서 끊는지를 보므로 d'와 가장 직접 닿는다 — 이 연결도 코드를 읽은 해석일 뿐 측정하지 않았다. (3) ③의 \"정상 최대와 뮤테이션 최소의 간격이 좁으면 시간 비의존 검증으로 간다\" 조건이 이 테스트에 해당할 가능성이 크다: 주입한 기동 지연이 4.0초이므로 마감을 끊지 못하는 뮤테이션은 약 4초 이상이 될 텐데, 정상 경로가 부하에서 3.24초까지 올라갔다(상한 2.75초). 간격(약 0.76초)이 좁다 — 다만 뮤테이션 최소 시간은 측정하지 않았다(추정). ⑤의 \"4병렬 × 5회 이상\" 반복 재현에는 이 테스트도 넣고, 큐 실행처럼 pytest -n auto 전체 부하 조건을 포함하는 것이 좋다(단독 실행은 통과하므로 단독 반복만으로는 재현되지 않을 수 있다). 이 증거를 보탠 세션은 재현 시도·원인 측정·수정을 하지 않았다."
