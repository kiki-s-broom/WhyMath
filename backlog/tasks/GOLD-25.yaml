  - "① 계약 전수 열거 — src/backend/pyproject.toml의 import-linter 계약 6개를 tomllib로 읽어 계약명 · source_modules · forbidden_modules · baseline 존재 여부를 표로 낸다. 개수는 6으로 고정하지 말고 착수 시점 실측값을 적는다(계약이 늘었을 수 있다)."
  - "② 계약마다 위반 1건을 실제로 주입해 lint-imports가 exit 1(BROKEN)을 내는지 확인한다 — 주입 전 cp로 백업하고, 주입 후 파일 내용이 원본과 다름을 단언하고(주입 자체의 실재), lint-imports 종료 코드를 적고, cp로 원복한 뒤 sha256이 원본과 같은지 다시 단언한다. 원복 수단은 cp 백업의 cp 복원뿐이다 — CLAUDE.md 「미커밋 작업분이 있는 트리에서 git 계열 원복 금지」가 지목하는 세 명령은 쓰지 않는다."
  - "③ 함정 형태를 따로 본다 — forbidden_modules가 source_modules 패키지 안에 중첩된 계약(EOS Core → Math Adapter 금지: whymath_backend.l4 소스 + 그 하위 5모듈 금지)이 유일한 해당 사례로 실측됐다. 그 형태에서 BROKEN이 실제로 나오는지, 나오지 않는다면 그것이 import-linter의 한계인지 계약 문면의 문제인지 판정한다."
  - "④ 결과 표 — 계약명 / 주입 위치(파일:줄) / 기대(BROKEN) / 실제 종료 코드 / 판정(막는다·못 막는다·판정 불가). 못 막는 계약은 왜 못 막는지와 대체 집행 수단(예: 그래프 밖 모듈을 AST로 직접 검사하는 기존 보완 경로)을 적는다."
  - "⑤ 성공 방향 대조군 — 주입을 넣지 않은 원본 트리에서 lint-imports가 exit 0(KEPT)인 것을 함께 확인한다. 대조군이 없으면 \"전부 실패\"라는 과잉 판정과 \"전부 통과\"라는 위장을 구분할 수 없다."
  - "⑥ 산출물 — golden/CONTRACT_MUTATION.md(표 + 판정 + 재현 명령). 옛 코드 변경은 0줄이어야 하며, 종료 시 git diff --stat로 src/backend/whymath_backend 변경 0건을 확인해 보고에 적는다. 주입 도중 중단되더라도 백업이 남도록 저장소 밖 임시 폴더에 cp 백업을 둔다."
