  - "② 기존 테스트 **연장**이지 신규 파일 신설이 아니다 — tests/backend/api/test_e2e_vertical_slice_integration.py(현재 온보딩→진단→문제→코치→verify에서 종료)와 src/mobile/test/e2e_loop_flow_test.dart(같은 순서를 앱 계층에서 미러)를 각각 뒤로 늘린다. 두 앵커의 대칭(백엔드↔클라 미러)을 깨지 않는다"
  - "③ (라)의 변별력: '추천이 갱신된 mastery를 반영한다'를 **추천 결과가 실제로 달라지는 것**으로 단언한다 — mastery를 바꾸지 않은 대조군에서 같은 추천이 나오고 바꾼 뒤에는 달라지는지 확인한다. 같은 값을 내는 검사는 검증이 아니라 위장이다(CLAUDE.md 2026-07-17). 추천이 결정론이 아니면 그 사실을 적고 무엇을 대신 단언했는지 명시한다"
  - "④ LearningSession writer 판정 별항(정본화≠집행): 이 E2E가 세션 축을 관통하는지 적는다. 현행 실측은 스키마(schema/activity.py §6.1 DDL)는 정본화됐으나 **writer 0**이고 l2/recommendation_evidence.py가 session_id를 uuid4 placeholder로 발급한다. 배선하거나, 안 할 거면 '기계 집행 없음'을 명시한다(EOS-72 '배선 또는 폐기 판정' 선례 동형)"
  - "⑤ 실행 실재성: 연장된 두 테스트가 **CI에서 실제로 돈다**는 것을 확인한다 — test_e2e_vertical_slice_integration.py는 실 PG 미도달 시 self-skip이므로 '저장소에 존재함'과 '돌아감'이 다르다(OPS-03·OPS-10·OPS-11 반복 선례). 어느 잡이 어느 조건에서 실행하는지 PR에 적는다"
  - "⑥ [완료조건 (가) 정정 2026-09-03 · PR #976 리뷰 P1 수용] acceptance ① (가)의 'Flutter가 실제 attempt를 제출한다'를 **'코치 완료 경로가 attempt를 적재하고 클라가 그 완료 신호를 소비한다'**로 읽는다. 학생 경로의 attempt 생산자는 POST /v1/me/attempts가 아니라 _complete_problem(api/coach.py:983-1030 · S3-32 done)이며, 클라의 직접 호출은 계약상 금지다(중복 적재 — api/coach.py:440-446). E2E도 그 경로를 관통해야 한다: solution_steps 제출 → 서버 verify correct → Polya 돌아보기 1턴 → problem_complete=True + completed_attempt_id → 그 attempt 행 → mastery 변화 → 다음 추천 변화. (나)(다)(라)는 그대로 유효하다"
  - "⑦ [정직 표기] acceptance ②가 말한 '한 트랜잭션' 성격의 가정을 두지 않는다 — api/me.py:745-779와 _complete_problem 둘 다 attempt를 **먼저 commit**한 뒤 숙달·이벤트 헬퍼가 **각자 commit**한다(l2/attempt_skill_event.py:71-97이 교차 원자성 미해결을 자인). E2E가 부분 쓰기(앞 기록만 남는 상태)를 **정상으로 단언하지 않도록** 각 단계를 개별 관측한다"
