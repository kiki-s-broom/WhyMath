notes: "2026-09-22 KG-08 착지(PR #1258) 중 실측. `backlog.py done`이 미러 결과 부재를 warn했고, 지시대로 `ci_mirror.py run`을 돌리자 5잡 전건이 install 스텝에서 죽었다. 원인은 CCR 클라우드 컨테이너의 파이썬이 3.11인데 `korean-math-backend`가 `requires-python = \">=3.12\"`인 것.\n\nHARN-162(셸 불일치)와 다른 축이다 — 그쪽은 스텝이 *돌긴 하는데* 판정이 틀리는 것이고, 이쪽은 **첫 스텝에서 죽어 아무 스텝도 돌지 않는다**. 증상도 반대다: HARN-162는 거짓 실패(없는 회귀를 쫓게 함), 이쪽은 미측정이 실패로 표시되는 것(측정 자체가 불가능한데 회귀처럼 보임).\n\n왜 중요한가: 이 세션은 같은 검사를 전부 수동으로 돌려 exit 0을 확인했고 실제 CI도 19잡 전건 green이었다(run 35797290434). 그런데 미러 결과 JSON에는 5잡 실패가 남는다. 다음 세션이 그 캐시를 보면 이 커밋이 red였다고 읽는다. 그리고 클라우드 세션에서는 이 상태가 **상시**이므로, 경고가 습관화되어 미러 출력 전체가 소음이 된다 — HARN-119가 만들려던 보호가 그 환경에서 무력해진다.\n\n범위: `ci_mirror.py`와 `backlog.py done` 프리플라이트. 컨테이너에 3.12를 까는 것은 해법이 아니다(환경은 세션마다 다르고 우리 통제 밖이다) — 도구가 자기 실행 가능성을 판정해야 한다."
