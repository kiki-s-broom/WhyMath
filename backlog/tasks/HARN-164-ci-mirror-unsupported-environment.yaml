acceptance:
  - "① 진단 — 미러가 `pip install -e`에 의존하는 잡에서 러너 파이썬과 `requires-python`이 어긋나면 **첫 스텝에서 죽어 잡 전체가 미실행**이 된다는 것을 재현한다. 실측(2026-09-22 CCR 클라우드 세션): `korean-math-backend requires a different Python: 3.11.15 not in '>=3.12'`로 backend·harness-integrity·declared-unwired-audit·corpus-authoring·data-pipeline 5잡이 전부 install 스텝 exit 1 → 뒤 스텝 전건 \"앞 스텝 실패로 미실행\". 그 세션은 같은 검사들을 **수동으로는 전건 exit 0으로 돌렸다**(시스템에 이미 설치돼 있었다) — 즉 미러의 실패는 검사의 실패가 아니다.\n② 구분 — 결과 JSON과 화면이 **\"검사 실패\"와 \"미러를 돌릴 수 없는 환경\"을 다른 값으로** 말해야 한다. 지금은 둘 다 `exit 1`·`✗ 실패 잡`으로 나와, 환경 때문에 못 돈 것이 회귀처럼 보인다(「인프라가 죽으면 '측정 실패'가 보여야지 '0건 통과/미달'로 위장되면 안 된다」의 반대 방향 — 여기서는 *미측정*이 *실패*로 위장된다). 환경 부적합은 별도 상태(예: `unsupported_environment`)로 내고 사유(요구 파이썬·현재 파이썬)를 남긴다.\n③ 집행 — `backlog.py done`의 미러 프리플라이트가 ②의 환경 부적합 결과를 **경고로 계상하지 않는다**. 현행은 결과 파일이 없거나 실패면 똑같이 warn을 내므로, 클라우드 세션에서는 이 경고가 항상 뜨고 결코 충족될 수 없다 — CLAUDE.md 「상시 실패하는 fail-open 보호를 '보호 있음'으로 신뢰 금지」가 지목하는 상태다(같은 경고가 2회+ 반복 관측되면 그 보호는 상시 무력). 경고 문면도 바꾼다: 실행 가능한 환경에서만 \"미러를 돌려라\"를 권하고, 아니면 무엇이 대체 증거인지(실제 CI run 참조) 말한다.\n④ 변별력 — 뮤테이션 3종 전건 RED: ⒜ 환경 부적합 판정을 지우면(전부 `failed`로 접음) 테스트가 RED ⒝ `done` 프리플라이트가 환경 부적합을 다시 경고로 계상하면 RED ⒞ **대조군** — 진짜 검사 실패(스텝 하나를 깨뜨림)는 두 경우 모두에서 여전히 `failed`로 계상돼야 한다. ⒞가 필수다 — 실패를 전부 \"환경 탓\"으로 접는 과잉 수정도 ⒜⒝만으로는 통과한다."
  - "⑤ [2026-09-27 추가 · EOS-136 PR #1341 세션 실측] 환경 부적합의 **두 번째 원인** — pip 모듈이 없는 가상환경(uv venv로 만든 venv에는 pip이 기본으로 없다). `ci_mirror.py run --job declared-unwired-audit --prepend-path <그 venv>/bin`이 install 스텝에서 `No module named pip`으로 exit 1 → 뒤 게이트 3스텝 전건 '앞 스텝 실패로 미실행'. 같은 검사들은 설치 스텝을 뺀 수동 재현으로 전건 exit 0이었고 PR CI도 success였다(커밋 b885b960). 즉 ①의 파이썬 버전 불일치와 같은 증상이 다른 원인에서 난다 — ①의 진단과 ②의 판정을 버전 비교 하나로 접지 말고 **설치 도구 부재**까지 원인별로 열거한다. ④ 변별력에 픽스처 ⒟ pip 부재 venv → unsupported_environment 를 더한다(대조군 ⒞는 그대로)."
  - "⑥ [2026-09-28 추가 · G-not-now-v1-release-recheck 전제 재점검 PR 세션 실측 · 기준 커밋 0b186c26] 환경 부적합의 세 번째 원인 — 잡 정의에 없는 서비스가 러너에 떠 있는 경우. backend 잡은 CI에서 postgres 서비스가 없는데, 로컬에 127.0.0.1:5432 PostgreSQL(backend-migrations 재현용)이 떠 있는 상태로 미러하자 도달성으로 skip을 판정하는 테스트(tests/backend/privacy/test_export.py::test_export_attempt_events_scoped_by_user_on_live_pg — integration 마크가 아니라 _pg_reachable() 직접 탐침)가 실행돼 1 failed(21분 31초 실행 폐기)가 났다. DB를 내리고 재실행하자 0 failed · 456 skipped(+1 = 그 테스트). 미러는 잡의 services 정의에 없는 서비스의 기본 포트(적어도 앱 기본 DB URL의 5432)가 로컬에서 도달 가능하면 실행 전에 경고하고 결과 JSON에 기록해, 그 실행의 판정이 CI 조건과 다르다는 사실을 남긴다(차단이 아니라 고지 — 의도적으로 띄운 경우가 있다). 변별력: 포트가 열린 대조군에서 경고 1건 · 닫힌 대조군에서 0건"
  - "⑦ [2026-10-02 재발 · PR 1396 재동기화 세션 실측 · 기준 커밋 main b8fa478a] ⑥의 원인이 **그대로 재발**했다 — 같은 테스트(`tests/backend/privacy/test_export.py::test_export_attempt_events_scoped_by_user_on_live_pg`), 같은 조건(검증용으로 띄운 로컬 PG 16이 앱 기본 URL 127.0.0.1:5432에 도달 가능). 이번에는 그 DB의 스키마가 옛것(alembic `4f7a2c9d6e18` · 이 트리 head `b4d8e2a6c0f3`)이라 `UndefinedColumnError: column \"event_uuid\" of relation \"attempt_event\" does not exist`로 실패했고(1 failed · 15,912 passed · 510 skipped · 1 xfailed · 1207.5초), 뒤 18스텝(계층 커버리지 게이트 · 게이트 CLI 16종 · 업로드)이 미실행이었다. 통제 3종: ①마이그레이션을 head까지 적용한 DB에서 같은 테스트는 `1 passed` ②`WHYMATH_DATABASE_URL=postgresql+asyncpg://whymath@127.0.0.1:1/whymath`(도달 불가)이면 `1 skipped`(CI `backend` 잡의 환경) ③그 URL을 미러 프로세스 환경에 주고 backend 잡을 다시 돌리면 23스텝 전건 ✔ · `MIRROR_RC=0`(869.4초) — 즉 **미러가 잡에 정의되지 않은 서비스를 가려 주면 CI와 같은 판정이 나온다.** ⑥의 '고지만' 설계에 주는 정보: 이번 세션은 로컬 PG를 *스스로 띄웠다는 것을 알고 있었는데도* 미러 전에 닫지 않았다(⑥의 경고는 사람이 읽어야 효과가 있다) — 같은 비용(실행 폐기 20분 안팎)이 두 번 났으므로, ⑥을 고지로 끝낼지 **미러가 `services`에 postgres가 없는 잡에 대해 DB URL을 닫힌 포트로 강제**(잡·스텝이 스스로 정의한 env는 존중)할지를 구현 시점에 판정한다. 별건 후보: 도달성으로 skip을 판정하면서 `integration` 표식이 없는 테스트가 AST 스캔으로 5건 보였다(도달성 skip 판정 182건 중 — `ops/test_pedagogy_content_slot_reach_report.py::test_counts_rise_shift_and_restore` · `harness/test_distractor_signal_dormancy_report.py::test_live_denominator_rises_with_injected_attempt_and_restores` · `harness/test_attempt_grading_shadow_report.py::test_mismatch_counter_rises_and_falls_with_injected_disagreement` · `api/test_devices.py::test_pg_mode_unreachable_raises_runtime_error` · 위 `privacy/test_export.py`). 각각이 실제로 live PG에 쓰는지는 읽어서 확인한 것이 아니다 — 구현 때 읽고 쓰는 것에는 통합 표식을 붙인다. CLAUDE.md의 로컬 DB 지도상 Kiki 기기의 5432는 타 프로젝트 DB 포트이므로 같은 테스트가 거기서 실행되면 무슨 일이 생기는지도 **실측하지 않았다**(추정 금지)."
