# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-164-ci-mirror-unsupported-environment
title: "CI 미러의 환경 부적합 — 러너 파이썬 < requires-python이면 install 스텝에서 전 잡이 죽고, 미측정이 '실패'로 위장된다"
track: infra-debt
stage: S3
subject: cross
layer: infra
status: todo
priority: 2
eos_priority: P2
owner: claude
depends_on: []
