  - "[실행 증적 2026-09-11] 결정 = (c) 스키마 확장, 단 `reason` 자유텍스트는 기존 불변식(\"자유텍스트 필드 금지\")과 충돌해 의도적 제외(엔티티/사유는 resource_type+resource_id+action으로 표현). record_admin_access_audit 자체는 대상 호출부가 없어(ADMIN-06 선행) 그대로 두고, 실제로 감사 0인 CONTENT_ADMIN 갭(api/concepts.py·api/problems.py CUD 6라우터)에 신규 5번째 event_kind `content_mutation`(AuditEventKind)을 배선했다.\n\n구현: PrivacyAuditResourceType(concept/problem)·PrivacyAuditAction(create/update/delete) 신설(schema/enums.py) · PrivacyAudit에 nullable 컬럼 3종(resource_type/resource_id/action, db/models/audit.py) + Pydantic 스키마 동기화(schema/audit.py, extra=forbid) · 마이그레이션 4c6dfb1527a9(down=f2662166a661, alembic --sql 오프라인 양방향 검증) · schema_version.py KNOWN_REVISIONS·probe_prod_schema_revision.sql(97→98) 갱신 · 신규 writer record_content_mutation_audit(privacy/audit.py) · concepts.py/problems.py 6라우터(POST/PATCH/DELETE ×2) 배선 · EventKindFilter 설명에 content_mutation 추가(test_privacy_audit_kind_doc_sync.py 가드 충족).\n\n인가 회귀: \"비관리자/미인증 시 거부\"는 기존 TestAuthGate(SEC-07 D1, test_concepts.py/test_problems.py)가 이미 401/403 검증 중(무회귀). \"관리자 동작 시 감사 이벤트 생성\"은 신규 TestContentMutationAudit(concepts 4건·problems 3건)+TestRecordContentMutationAudit(test_audit.py 2건)이 검증.\n\nRED-before-fix(cp 백업/복원, git 원복 미사용, diff 바이트 동일 확인 3건): ①concepts.py 3개 호출부 제거 → 5건 RED(40건 무회귀) ②problems.py 동일 → 4건 RED(43건 무회귀) ③writer(resource_type=/action= 대입 제거) → test_audit.py 신규 2건 RED(10건 무회귀).\n\n문서: docs/architecture/48_eos_security_access_control.md L827(관리자 접근 감사) 갱신 — content_mutation 축 충족·admin_access(개인정보 열람) 축은 ADMIN-06 대기로 명시 분리. 같은 표 L832(Job 소유권 검사)도 SEC-27 착지분 반영(누락 발견·보정).\n\n검증: ruff·black·mypy 대상 파일 전건 clean. 전체 백엔드 스위트 12819 passed·340 skipped·1 xfailed(0 failed, 18분49초·2차 실행 — 1차는 head 상수 갱신 전이라 폐기). tests/infra 1301 passed·1 skipped(feature_inventory 재생성 후)."
