  - "① CMS 제자리 편집 리소스 7종(교육과정 판·문항·풀이 단계·오개념·교수전략·개념 설명·힌트)마다 CLI 적재 경로(upsert)를 실측해 \"다음 적재가 CMS 편집을 덮어쓰는가\"를 표로 판정한다(적재 코드의 파일:줄 근거 포함 — 이름이 아니라 역할로 검색하고, 0건이면 검색 범위를 명시한다).\n② 덮어쓰는 리소스는 보호 규칙(편집 표지·적재 시 skip·충돌 보고) 중 하나를 판정해 구현한다. 새 교육과정/판·풀이 경로·문항·오개념·교수전략의 **신규 작성을 CMS가 열지 않는** 현행 결정(적재 파이프라인의 저작권·출처 레일 우회 금지)을 유지할지 판정에 포함한다.\n③ 주입 검증: CMS로 편집 → 적재를 다시 실행 → 편집 값이 보존되거나 충돌이 보고됨을 실 DB로 확인한다. 보존을 주장하는 리소스는 이 주입이 RED→GREEN이어야 한다.\n④ 집행 지점과 정본화를 별항으로 둔다: 계약 문서(정본)와 적재 코드가 그 계약을 실제로 경유하는 지점(집행)."
