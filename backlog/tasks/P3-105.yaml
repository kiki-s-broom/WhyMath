  - "① 결손 고정: Phase 3 성공 기준 Q1('내일부터 실제 중·고등학생 100명을 넣어도 …', docs/strategy/phase3_math_eos_completion_plan_source.md §Phase 3의 진짜 성공 기준)은 D2(2026-10-19)가 Gate A의 계정 종류만 '내부 테스트 계정'으로 바꿨고 Q1 문면은 바꾸지 않았다. 학생 참여는 ARCH-66 ⑥으로 12/31 이후라, 문면 그대로면 Q1은 어떤 재판정에서도 NO이고 G-p3-w3-release-merged와 G-internal-completion-2026-12-31 조건 ①이 구조적으로 충족 불가다(P3-17 판정 §3 성공 기준 표가 사실은 적었으나 처분 경로를 등재하지 않았다).\n② 처분안 문서: 선택지 (A) Q1을 D2와 같은 방식으로 내부 테스트 계정 기준으로 바꾼다(표본 수 기준은 G4 ≥20 · EOS-135 소유를 따른다) (B) Q1 원문을 G-student-work-after-internal-completion 이후 판정으로 이관하고 이 게이트의 성공 기준을 Q2·Q3로 한정한다 — 각 선택지가 Gate A·12/31 정의·하류 게이트에 주는 영향을 표로 정리해 Kiki께 올린다. 새 decision 게이트를 만들지 않고, 결정은 G-p3-w3-release-merged notes에 판정 근거로 기록한다.\n③ 완료 판정: Kiki 결정이 게이트 notes에 기록되고, 채택안이 원 문서 해당 줄에 D2와 같은 교체 표기로 반영된다(원문 보존). 결정 전에는 이 태스크를 done 처리하지 않는다."
  - "[Kiki 결정 2026-11-06 — 학생 수 조건 전면 삭제] 성공 기준 Q1의 \"내일부터 실제 중·고등학생 100명을 넣어도\" 문면을 삭제했다. 새 Q1 = 개발자가 학생별 데이터를 직접 만지지 않고, AI가 학습 루프(진단 → … → 다음 추천) 전 과정을 검토·점검해 문제를 분석·해결한 기록으로 학습이 돌아감을 보일 수 있는가(근거: Learning Loop Success·Manual Intervention KPI + AI 관통 하네스 실행 기록 · 학생 수 조건 없음). 이유: WhyMath의 기본 방향은 AI가 검토·점검·해결하는 것이며, 실사용자 수 조건을 연기만 하다 반복해서 판정 불능을 낳았다. 반영 문서: docs/strategy/phase3_math_eos_completion_plan_source.md §Phase 3의 진짜 성공 기준 · phase3_math_eos_completion_instruction_set.md Q1 2곳 · Phase 1 게이트의 \"β 사용자 100명\" 5곳(ROADMAP.md · current_phase_checklist.md · 06_application_modes.md · business_plan_master_v1.md · execution_bridge_2026-07.md). 재판정은 새 Q1로 판정하며 P3-17 판정문(2026-11-05)의 Q1 NO 근거 중 \"문면상 12/31 전 YES 불가\" 부분은 소멸했다(학습 단계 404 · PED-17 근거는 유효)."
