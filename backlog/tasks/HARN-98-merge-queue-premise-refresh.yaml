notes: "출처: 2026-09-09 저장소 조직 이전 + 큐 활성화(Kiki). **HARN-96(정본 저장소 전환)과 경로가 겹치지 않는다** — HARN-96 paths는 .github/workflows/** · docs/** · backlog/**이고 이 태스크는 scripts/harness/ruleset_drift.py · .github/branch-protection-setup.md · tests/infra/test_pr_auto_resync.py다. 다만 **같은 파일의 다른 절을 건드릴 여지**가 하나 있다: HARN-96 acceptance ③이 branch-protection-setup.md에 라이브 required check 개수를 병기하려 하고, 이 태스크는 같은 문서의 merge queue 절을 정정한다. 절이 달라 의미 충돌은 없으나 텍스트 충돌은 날 수 있으므로 나중 착수 쪽이 병합한다. HARN-56(merge queue 도입·claim 중)의 pr-auto-resync.yml:4 낡은 주석은 그쪽 소관이라 손대지 않는다. **분리 이유**: HARN-96은 게이트(G-canonical-repo-cutover-kiki-s-broom) 대기이고 acceptance ⑧이 kiki-s-broom을 초기 소스로 하는 새 세션을 요구해 언제 착수될지 모르는데, 이 태스크가 고치는 것은 지금 살아 있는 보호 공백(감시 축에 큐가 없어 큐가 꺼져도 판정기가 모름)과 거짓을 동결 중인 테스트라 대기시킬 성질이 아니다."
