  - "① 격리 DB 측정 회차: docker-compose.pilot.yml의 파일럿 DB(5434) 또는 일회용 컨테이너에 alembic upgrade head + 문항 코퍼스를 적재하고, attempt_skill_reach_probe --count 20을 태운 뒤 attempt_skill_event_reach_report --since로 해소율을 산출한다. prod DB(whymath-pg:5433)에는 쓰기 0건임을 회차 전후 problem_attempt 카운트 대조로 증명한다\n② 3분류를 뭉개지 않고 보고: writer 미도달 / 기록·해소 0건 / 해소 1건 이상 각각의 건수와 분모를 남긴다. 해소율이 0%로 나와도 그것이 측정값이므로 실패로 처리하지 않는다 - 다만 그 경우 원인 축이 브리지 데이터임을 명시한다\n③ prod 실측 사실의 등재: 이 태스크 notes에 이미 적힌 prod 전수 0건 측정을 EOS-63 착수 세션이 읽을 수 있게 게이트 또는 EOS-63 notes로 전달한다(EOS-63은 타 세션 claim 중이므로 대장 조작 충돌을 피해 게이트 경유를 우선한다)\n④ 정직 고지: 이 회차의 writer 도달률은 프로브가 스스로 만든 표본이라 배선이 살아 있으면 구성상 100%다. 그것이 증명하는 것은 attempt_submit 경로 배선의 실재까지이며 학생 트래픽 통계가 아니라는 점을 보고에 명시한다. coach_completion 경로는 이 프로브가 태우지 않으므로 미측정으로 표기한다"
