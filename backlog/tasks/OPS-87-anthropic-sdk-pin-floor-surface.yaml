notes: "발견 경위: 2026-09-21 게이트 G-eos02-prompt-cache-live-run 실행 준비 중, 런북이 안내할 명령이 기대 산출물을 실제로 내는 코드 경로인지 확인하다가 드러났다(검증 없는 실행 안내 금지). anthropic_prompt_caching=True 가 l3/providers/anthropic.py 에서 messages.create(cache_control=...) 로 나가는데, 그 인자의 실재를 동결하는 것은 tests/backend/l3/test_anthropic_provider.py 의 시임(가짜 클라이언트) 단언뿐이었다 — 가짜 클라이언트는 어떤 키든 받는다. 실물 SDK 를 설치해 재 보니 pin 허용 구간의 상당 부분(0.40~0.82)에 그 인자가 없다.\n\n이것은 CLAUDE.md 가 명시적으로 금지하는 형태다: 외부 SDK 표면을 시임 테스트만으로 정합 선언 금지 — 우리가 호출하는 메서드가 pin 허용 범위의 실물 SDK 에 존재하는지 실측 검증한다. 선례 langfuse>=2.50,<5 는 상한 축이었고 이번은 하한 축이다.\n\nEOS-02 라이브 회차 자체는 이 태스크를 기다리지 않는다 — 런북 v2 의 사전검증 블록이 설치된 SDK 를 실측해 SDK_HAS_CACHE_CONTROL 이 False 면 회차를 거부하므로, 게이트 실행은 pin 수정 전에도 안전하다. pin 수정은 그 방어를 Kiki 머신 1대가 아니라 저장소 전체로 옮기는 일이다."
