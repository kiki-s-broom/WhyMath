acceptance:
  - "① pin 하한 실측 정정 — src/backend/pyproject.toml 의 anthropic 하한을 우리가 실제로 호출하는 표면이 존재하는 최초 버전으로 올린다. 2026-09-21 실측(PyPI 실물 설치 후 inspect.signature): 최상위 cache_control 은 0.83.0 에서 도입됐다(0.81.0·0.82.0 부재 / 0.83.0·0.84.0·0.85.0·0.90.0·0.95.0·0.100.0·0.117.0 존재). output_config(effort)는 0.80.0 에서 이미 존재하고 0.60.0 에는 부재. 현행 하한 0.40.0 은 둘 다 없는 구간을 허용한다.\n② 실패 양태가 무증상이 아님을 확인 — anthropic SDK 의 messages.create 에는 VAR_KEYWORD(**kwargs)가 없다(0.40.0·0.117.0 양쪽 실측). 따라서 구버전에서는 TypeError 로 즉사하며 조용한 무시가 아니다. 그러나 저작 배치는 호출 실패를 generation_failed 로 집계하므로, 회차 전체가 실패해도 리포트는 정상 종료한다 — 즉 사람에게는 무증상에 가깝다. 이 사실을 pin 주석에 남긴다.\n③ 회귀 동결 — 시임 테스트만으로 표면을 선언하지 않는다는 규약의 집행 지점을 만든다. 우리가 최상위 인자로 싣는 키 3종(cache_control·output_config·thinking)이 설치된 실물 anthropic 의 messages.create 시그니처에 존재하는지 inspect 로 검사하는 테스트를 tests/backend/l3/ 에 추가하고, 부재 시 어느 키가 없는지 이름을 내며 RED 가 되게 한다. 뮤테이션 검증: 존재하지 않는 키 이름을 검사 목록에 주입했을 때 RED 가 나오는지 확인한다.\n④ 범위 밖 — 상한(<1)은 건드리지 않는다. 이 태스크는 하한만 다룬다."
