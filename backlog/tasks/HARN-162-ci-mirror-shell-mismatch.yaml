notes: "2026-09-22 ADMIN-06 검증 중 실측. ci_mirror.py의 run_step이 모든 스텝을 bash --noprofile --norc -eo pipefail 로 돌리며 주석에 \"GitHub Actions의 bash 기본과 정확히 맞춘다\"고 적었는데, 그것은 스텝에 shell: bash 를 명시했을 때의 형태다. shell 키가 없는 스텝의 GitHub 기본은 bash -e 이고 pipefail이 없다. 그래서 미러가 CI보다 엄격해지고, 파이프의 마지막이 아닌 명령이 비-0으로 끝날 수 있는 스텝에서 거짓 실패를 낸다.\n\n실측 재현: webapp 잡의 \"공개 산출물 검사\" 스텝이 미러에서 exit 1 (0.01s, stderr 비어 있음)인데 같은 커밋의 실제 CI에서는 success였다. 원인은 그 스텝의 leak=$(grep -rl ... | wc -l) 이 no-match 시 grep exit 1 을 내고 pipefail이 그것을 파이프라인 상태로 삼아 set -e가 스크립트를 죽인 것. 그 스텝 자체는 별건으로 파이프 제거해 고쳤다(두 셸 모두 같은 판정). 그러나 미러의 셸 불일치는 남아 있고, 같은 형태의 스텝이 저장소에 더 있으면 계속 거짓 실패를 낸다.\n\n왜 중요한가: 미러는 측정 도구다. 거짓 실패는 없는 회귀를 쫓게 만들어 통과보다 비싸고(2026-09-07 축), 반복되면 사람이 미러 출력을 무시하게 되어 HARN-119가 만들려던 보호가 상시 무력해진다. 또 미러가 stdout을 보존하지 않아 실패 원인이 남지 않았다 — \"측정·수집 도구를 성공 경로만 보고 설계 금지\" ②(실패 원인이 남는가)에 해당한다.\n\n범위 밖(의도): ci_mirror.py 수정 자체는 HARN-119 소관이라 이 세션이 건드리지 않았다."
