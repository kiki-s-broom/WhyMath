acceptance:
  - "정본화: run_step이 스텝의 shell 키를 읽어 GitHub과 같은 셸을 고른다 — shell 키 없음이면 bash -e (pipefail 없음), shell: bash 면 bash --noprofile --norc -eo pipefail, 그 외 셸은 실행 대상에서 제외하고 사유를 남긴다(모르는 셸을 bash로 돌리면 그 결과는 그 스텝의 것이 아니다)\n집행: 실패 스텝의 stdout 꼬리도 보존한다 — 현재는 stderr만 남아 GitHub 형식 오류 메시지(::error::)가 통째로 사라진다. 실측 2026-09-22: webapp 실패가 exit 1 + stderr 빈 문자열로만 기록돼 원인 판정이 불가능했다\n변별력: 픽스처 4종 전건 검증 — ⒜ pipefail 없이는 통과하고 있으면 실패하는 스텝(grep 파이프)이 shell 키 없음에서 통과 ⒝ 같은 스텝이 shell: bash 선언 시 실패 ⒞ 진짜 실패 스텝은 두 형태 모두에서 실패(과소 검출 방지 대조군) ⒟ 실패 시 stdout 꼬리가 결과 JSON에 실재. ⒞가 필수다 — 셸을 느슨하게 바꾸기만 하면 모든 실패를 놓치는 과잉 수정도 ⒜⒝만으로는 통과한다\n저장소 전수 점검: ci.yml의 run 스텝 중 파이프 마지막이 아닌 명령이 비-0을 낼 수 있는 형태를 열거하고, 각각이 두 셸에서 같은 판정을 내는지 확인한다(이 사고의 원 스텝은 ADMIN-06 후속에서 이미 파이프를 제거했다)"
