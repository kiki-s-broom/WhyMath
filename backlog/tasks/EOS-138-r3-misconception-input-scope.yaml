acceptance:
  - "① 실측 사실(판정 기준 main `bbd7c382` · EOS-24 판정문 §4) — 상태 머신 규칙 R3(`R3-wrong-misconception`)의 입력 `AttemptEvidence.confirmed_misconception_ids`는 `l2/learning_state_evidence.py::_active_misconception_ids`가 채우며, **학생 전체의 활성 가설 전부**를 신뢰 하한 없이 읽는다. 그래서 다른 개념에서 생긴 옛 가설 1건만 남아 있어도 이번 오답에 R3가 발화하고, 제출 응답의 `learning_state.target_misconception_id`는 가장 신뢰가 높은 옛 가설을 가리킨다(교정 대상과 방금 틀린 개념이 어긋난다 — pedagogy-designer 독립 비판 반례 S1).\n② 처분 — R3의 입력을 **이번 회차에 증거를 받은 가설(`turns_since_evidence = 0`)** 중 신뢰가 `MISCONCEPTION_REMEDIATION_FLOOR`(0.7)를 **초과**하는 것으로 좁히거나, 좁히지 않는 근거를 판정문으로 남긴다. 좁히면 EOS-24가 추천 쪽에 둔 방어선(`l2/learning_state_recommendation.py` 안전장치 ①②)은 중복이 되지만 해가 없다 — 그 방어선을 걷어낼지도 이 태스크가 판정한다.\n③ 순서 충돌 판정 — `l2/remediation_policy.py`(MISC-30)의 경로 표는 RT1(숙달<0.4→선수) > RT2(오개념)이고 상태 머신은 R3(오개념) > R4(선수)다. `select_route`는 소비처 0건이다. 둘 중 하나로 정하고 다른 쪽을 그에 맞추거나 폐기한다. 판정 입력: 오답 1회 뒤 숙달 0.15는 BKT 신뢰도 0.17이라 선수 결손의 증거로 약하다(EOS-24 판정문 §4) · 개념 변화 이론의 intelligibility 조건은 RT1 쪽 근거다.\n④ 회귀 — `tests/backend/api/test_week3_gate_remediation_loop.py`(오개념 오답 → REMEDIATE_MISCONCEPTION)와 `tests/backend/api/test_eos24_recommendation_follows_learning_state.py`가 그대로 통과해야 한다. 옛 가설만 남은 학생의 오답이 R3가 아닌 규칙으로 가는 반례 픽스처를 추가한다(실 PG).\n⑤ 인접 경계 — EOS-123(정답 회차가 감쇠 시계를 안 돌림)은 옛 가설이 오래 남는 *원인*이고, 이 태스크는 그 가설이 R3로 *흘러드는* 입구다. 한쪽 처분이 다른 쪽을 자동 해소하지 않는다."
  - "⑥ 정정(2026-09-25 · `EOS-140` 실측) — 처분안 ②의 \"이번 회차에 증거를 받은 가설(`turns_since_evidence = 0`)\"은 **이번 회차가 아니다.** tse는 스캔한 회차에만 움직이고, 정답·답안 없는 오답·지문 없는 문항은 스캔하지 않는다(`api/me.py::_scan_attempt_misconceptions` NOT_RUN). 실 PG 반례: C 오개념 오답(tse 0) → C 정답(미스캔) → P 답안 없는 오답(미스캔) — 옛 가설의 tse가 0으로 남는다. R3 입력을 tse 0으로만 좁히면 이 반례에서 R3가 여전히 발화한다. 좁힐 때는 `EOS-140`이 추천 쪽에 건 **회차 경계**(직전 다른 응답의 마지막 원장 전이 이후에 갱신된 가설 — `l2/learning_state_recommendation.py::_evidence_since_previous_attempt`)를 재사용하거나, 더 정확히는 이번 응답의 스캔 후보 자체를 R3 입력으로 넘긴다(`submit_attempt`가 `misconception_scan_result.candidates`를 이미 들고 있다). 회귀 픽스처: `tests/backend/api/test_eos24_recommendation_follows_learning_state.py::test_stale_hypothesis_does_not_pin_remediation_to_another_concept`."
