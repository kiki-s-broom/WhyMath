acceptance:
  - "① 계약 시그니처 분리 — 계획서 §6의 `update_mastery(learner_state, assessment_evidence) -> mastery_update` 형태로 호출 계약을 세운다. 현행 `l2/mastery_tracking.py:52 compute_mastery_record(prior_mastery, prior_sample_size, correct, model, elapsed_days)`는 입력이 **스칼라**라 상태·증거를 받지 않는다.\n② 교체 가능성을 타입으로 표현한다 — 주석이 아니라 Protocol(또는 동등한 타입)로 추정기를 추상화한다. 현행은 `l2/bkt.py:135 BktModel` 클래스 수준까지만 분리돼 있고 **Protocol·레지스트리가 없으며 구현이 1종**이라, DKT로 교체하려면 호출부를 전수 수정해야 한다. 그 수정 규모가 0에 수렴하는 것이 이 태스크의 성공 판정이다.\n③ 개념 축·스킬 축 통합 — 현행은 `l2/mastery_tracking.py`(개념)와 `l2/skill_mastery_tracking.py:148`(스킬) 두 함수로 갈라져 있다. 계약을 하나로 세우되 **내부 구현은 갈라둬도 된다**. 통합이 재계산을 낳으면 안 된다.\n④ 행동 동결 — 계약만 바꾸고 **숙달 수치는 바뀌지 않아야 한다**. 기존 숙달 전파 테스트가 계약 교체 전후로 같은 값을 내는지 대조한다. 값이 바뀌면 그것은 리팩터가 아니라 정책 변경이므로 별건으로 분리한다.\n⑤ 변별력 — 계약이 실제로 교체 가능한지 **가짜 2번째 구현을 주입해 확인**한다(예: 항상 0.5를 반환하는 스텁을 레지스트리에 꽂아 호출부 수정 0으로 동작이 바뀌는지). 정상 입력에서 초록인 것은 교체 가능성의 증거가 아니다.\n⑥ EOS-63 회피 — 스킬 축 소비 전환은 `EOS-63`(다른 세션 claim 중·선행 SKB-01에 차단)이 소유한다. 이 태스크는 **계약 형태**만 다루고 소비 전환에 손대지 않는다."
