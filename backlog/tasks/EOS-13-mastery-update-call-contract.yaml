notes: "출처: 계획서 300 §6(Mastery Engine v1 — \"반드시 엔진 인터페이스를 분리합니다\") + §2(알고리즘보다 Contract) — 대조표 §4 단위6. 분류(§14): LOOP.\n\n실측(판정 기준 main 2e1220b4): 계약 분리 0건. 현행 입력은 스칼라이고 `assessment_evidence` 타입 자체가 없다. 인접 태스크 MISC-06(todo)은 acceptance가 \"BKT/DKT 비결합 유지\"를 명시하고, SKB-01·PED-14(todo)는 적재·정규화 축이라 계약 형태를 소유하지 않는다.\n\n주의(구현 금지 경계): 이 태스크는 **계약**이지 BKT/DKT 구현이 아니다. §15 동결 13종의 \"복잡한 ML 추천\"에 해당하는 실제 모델 도입은 이 태스크 범위 밖이다 — 계약을 세우되 v1 내부 구현은 현행 heuristic을 그대로 둔다.\n\n착수 전제: 2026-09-03 Kiki 결정(선언 §1.3) 갱신."
