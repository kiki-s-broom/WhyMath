notes: "출처: 2026-09-19 학습 상태 정책 경로 구현 중 발견. CI `backend — 마이그레이션·통합 (실 PG)` 잡 7건 빨강의 근본 원인이며, 실제로 깨진 2파일은 그 PR에서 함께 고쳤다(테스트 정리에 learning_state_transition 삭제 추가). 나머지 약 28개 파일은 현재 전이를 만들지 않아 깨지지 않으므로 손대지 않았다 — 범위 규율.\n\n의존 관계 없음(명시): 이 태스크를 막는 다른 태스크는 없다. 고친 2파일은 이미 착지 경로에 있고, 이 태스크가 다루는 것은 *나머지*와 재발 방지 장치다.\n\n세션이 직접 해소하지 않은 이유: 대책 3택의 파급이 서로 크게 다르다(30여 파일 개조 vs 거버넌스 테스트 1개). acceptance ①의 실태 확정 없이 고르면 규모를 잘못 잡는다."
