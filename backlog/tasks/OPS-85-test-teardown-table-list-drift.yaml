acceptance:
  - "① 실태 확정 — 저장소 전수 스캔으로 \"수기 정리\" 블록의 실제 개수·위치·누락 테이블을 확정한다. 실측 착수 시점: `grep -rl \"DELETE FROM user_profile\" tests/backend/` 기준 약 30개 파일(pycache 제외)이 삭제 대상 테이블을 **손으로 나열**하며, 그중 상당수가 `learning_state_transition`을 포함하지 않는다. 다만 \"포함하지 않는다\"와 \"깨진다\"는 다르다 — 깨지는 것은 그 테스트가 실제로 그 테이블에 행을 만드는 경우뿐이므로, 두 축(누락 여부 / 행 생성 여부)을 분리해 센다.\n\n② 왜 지금 등재하는가 — 2026-09-19 EOS-115에서 이 함정이 실제로 발화했다. `learning_state_transition`은 EOS-105가 만들었으나 그 시점에는 **행을 만드는 서빙 경로가 0건**이라 누락이 잠복했고, EOS-115가 응답 제출마다 전이를 적재하자 CI `backend — 마이그레이션·통합 (실 PG)` 잡이 7건 빨강이 됐다. 즉 이 구조는 \"새 학습자 테이블 + 그 테이블에 쓰는 서빙 경로\"가 만나는 순간마다 재발한다.\n\n③ 피해가 증폭되는 기전을 대책에 반영한다 — 정리 블록이 `engine.begin()` **트랜잭션**이라 마지막 `DELETE FROM user_profile`이 FK로 실패하면 앞서 지운 문항·개념까지 **전부 롤백**된다. 그 잔여 데이터가 *다른 파일*의 추천·후보 단언에 끼어들어 무관해 보이는 실패를 추가로 만든다(실측: CI 7건 중 1건이 그 유형이었고, 로컬 재현에서는 실행 순서가 달라 통과해 **순서 의존**임이 확인됐다). 그러므로 대책은 FK 실패 차단만이 아니라 \"정리 실패가 조용히 다른 테스트를 오염시키지 않게 한다\"까지 다뤄야 한다.\n\n④ 대책 후보 3종을 실측 비교해 하나를 고른다(이 태스크가 정하지 않는다) — (가) **공용 정리 헬퍼**: 학습자 축 테이블 삭제 순서를 한 곳에 정의하고 테스트가 그것을 부른다. 새 테이블은 한 줄 추가로 전파된다. 위험 = 기존 30여 파일 개조 규모 (나) **운영 삭제 경로 재사용**: 테스트가 수기 SQL 대신 `privacy/erasure.py`의 계약을 부른다. 진실 원천이 하나가 되지만 삭제 범위가 테스트 의도보다 넓을 수 있다 (다) **가드**: 학습자 축 테이블 목록과 각 정리 블록의 삭제 대상을 대조하는 거버넌스 테스트를 만들고, 누락을 CI에서 RED로 낸다. 개조 없이 검출만 한다.\n\n⑤ 범위 밖 명시 — **운영 GDPR 삭제 경로는 이 태스크의 대상이 아니다.** 실측(2026-09-19 · EOS-115 조사): `privacy/erasure.py`가 `LearningStateTransition`을 이미 삭제 대상에 포함하며, 운영 삭제 엔드포인트를 호출하는 Week2·Week3 게이트 테스트는 전부 통과했다. 이 태스크는 **테스트 위생** 축이지 법령 준수 축이 아니다. 조사 중 FK 위반만 보고 \"GDPR 삭제가 깨졌다\"로 오독하기 쉬우므로 이 구분을 먼저 확인하고 시작한다.\n\n⑥ 집행 지점 별항(정본화 ≠ 집행) — 어느 대책을 고르든 \"만들었다\"가 아니라 \"**CI에서 실제로 돌고, 누락을 주입하면 RED가 난다**\"까지 확인한 뒤 완료로 친다. (다)를 고르면 가드에 누락을 주입해 RED를 확인하고, (가)·(나)를 고르면 헬퍼를 쓰지 않는 새 정리 블록이 추가됐을 때 검출되는지를 확인한다."
