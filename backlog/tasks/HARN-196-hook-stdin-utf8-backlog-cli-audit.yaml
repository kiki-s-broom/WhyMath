requires_gates: []
acceptance:
  - "① 실측 고정(판정 기준 main `9308cf4c` · CONST-10 acceptance ③ 전수 스캔) — 훅 입력을 로캘 인코딩 텍스트 모드로 읽는 곳이 세 군데 남았다: `scripts/harness/backlog.py`의 `cmd_check_stop`(`json.loads(sys.stdin.read() or \"{}\")`) · `cmd_check_edit`(같은 형태) · `scripts/constitution/audit.py`의 `--hook` 분기(`json.load(sys.stdin)`). `PYTHONIOENCODING=cp949`에 UTF-8 `—`(E2 80 94) 페이로드를 넣으면 `sys.stdin.read()`가 `UnicodeDecodeError`를 낸다 — 앞의 둘은 `except json.JSONDecodeError`만 받아 예외가 그대로 새어 훅이 트레이스백으로 죽고(fail-open이 아니라 **미작동** · exit 1), 셋째는 `ValueError`를 삼키고 `stop_hook_active`를 잃어 Stop 훅 재진입 방지가 꺼진다. 이 세 동작을 서브프로세스 테스트로 재현해 동결한다(수정 전 코드에서 RED)."
  - "② 수정 — 세 곳 모두 바이트로 읽어 UTF-8로 직접 해독한다(`guard_constitution.py`·CONST-10과 같은 방식). `backlog.py`에는 걸림돌이 하나 있다: 이 두 명령을 부르는 테스트가 `monkeypatch.setattr(\"sys.stdin\", io.StringIO(...))`로 stdin을 흉내 내는 곳이 5개 파일 10곳(`test_cli` · `test_amend_cli` · `test_incidents` · `test_jit_rules` · `test_stop_hook_integrity_gate`)이고, `io.StringIO`에는 `.buffer`가 없다. 두 길 중 하나를 판정한다 — (가) 대역을 바이트 계층이 있는 `io.TextIOWrapper(io.BytesIO(...))`로 바꾸는 공용 픽스처 (나) 읽기 헬퍼가 `.buffer`가 없으면 텍스트 읽기로 물러나는 폴백. (나)를 고르면 폴백 분기가 실환경(항상 `.buffer`가 있다)에서 밟히지 않는다는 근거를 적고, 그 분기를 실제로 밟는 테스트를 둔다 — 폴백이 로캘 해독을 되살리는 통로가 되면 안 된다."
  - "③ 열외 만료 — CONST-10이 만드는 `tests/infra/test_hook_stdin_utf8.py`는 `settings.json`에 등록된 훅 스크립트 전수를 스캔하되 이 태스크가 소유한 `scripts/harness/backlog.py`를 이름 붙은 열외로 둔다. 이 태스크가 ②를 이행하면 그 열외를 지운다 — 열외 파일이 더는 위반하지 않으면 그 테스트가 \"면제가 죽었다\"로 실패하도록 CONST-10이 만들어 두었으므로, 지우지 않고는 통과할 수 없다(자기 만료). `audit.py`는 `settings.json`에 등록되지 않은 `--hook` 모드라 그 테스트의 범위 밖이다 — 등록 시점에 같은 스캔에 들어오도록 ②의 수정과 함께 처리한다."
  - "④ 변별력 — ①~③ 절마다 그 절을 끊는 뮤테이션을 두고 전건 RED를 확인한다(주입 적용 단언 · 원복은 `cp` 백업의 바이트 동일). 특히 cp949 서브프로세스 테스트는 페이로드를 `ensure_ascii=False`로 직렬화해 UTF-8 원문을 넣어야 한다 — 기본값(`ensure_ascii=True`)은 한글과 `—`를 전부 `\\uXXXX`로 바꿔 순수 ASCII로 만들어, 로캘 해독 결함이 있는 코드도 통과시킨다(CONST-10이 실측한 기존 테스트의 맹점)."
