# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-196-hook-stdin-utf8-backlog-cli-audit
title: "훅 진입점 backlog.py check-edit·check-stop과 audit.py --hook이 stdin을 로캘 인코딩으로 읽는다 — cp949에서 예외로 훅이 죽거나 재진입 방지를 잃는다 (CONST-10 전수 스캔 승계)"
track: infra-debt
stage: S3
subject: cross
layer: infra
status: in_progress
priority: 3
eos_priority: P2
owner: claude
depends_on:
