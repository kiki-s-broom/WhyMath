acceptance:
  - "① 재확인 발동 조건(만료 기계 — CLAUDE.md 「만료 없는 유예·제외 금지」) — 아래 중 **먼저 오는 것**이 이 태스크의 착수 시점이다: ⓐ OpenRouter 경로가 학생 대면 또는 상시 배치(코퍼스 저작 파이프라인의 정기 실행 포함) 트래픽을 받기로 결정된 때 ⓑ `openrouter_allowed_providers` 기본값을 바꾸려는 판정이 생긴 때 ⓒ 개발 단계 측정에서 `429 engine_overloaded`가 **한 회차 50% 이상**으로 올라간 때. 그때까지 ARCH-55 판정 기준 (d)(지연·가용성)는 **명시 보류**이며, 그 보류가 이 태스크다.\n② 보류된 사실의 정본 — ARCH-55 4회차 실측에서 429 실패율이 30%→15%→0%로 흔들렸고 마지막 0%가 peak 구간이었다(시간대 가설 기각). 실패 원인은 전부 `limit_source=upstream_provider_shared_pool` · `is_byok=false`, 즉 공유 풀이다. 20회 표본으로는 공급사를 가를 수 없고, 실제로 그 분산을 근거로 기본값이 두 번 뒤집혔다. **따라서 표본을 키우는 것이 해답이 아니다** — 공유 풀은 우리가 배포할 구성이 아니므로 그 대기열 통계는 채택 후 상황을 대표하지 않는다.\n③ 판정 선택지 3안(착수 시 실측으로 가른다) — ⓐ BYOK(공급사 자체 키를 OpenRouter integrations에 등록 — 공유 풀 이탈. 공급사 계정·결제수단이 새로 필요하고 청구서가 2장이 된다. OpenRouter 수수료는 정가의 5%이며 월 무료 한도 안쪽이면 실질 0) ⓑ 허용목록 이중화(`(\"deepinfra\", \"baseten\")` — 둘 다 관할 US·정밀도 fp8이라 `jurisdiction_of_slugs`·`precision_of_slugs`가 확정값을 유지한다. 공유 풀은 그대로고 용량만 늘며, 어느 쪽이 응답할지는 OpenRouter가 정하므로 지연·단가가 회차마다 섞인다 — baseten이 deepinfra의 2배) ⓒ 로컬 우선 환원(Phaiakes9 `CostTier.LOCAL`로 해당 배치를 되돌려 클라우드 가용성 축 자체를 제거).\n④ BYOK을 택할 경우의 검증 변별력 — `is_byok`는 **429 오류 본문에만** 실리므로 BYOK가 정상 작동하면 읽을 기회가 없다. 성공/실패 양쪽에서 같은 화면을 내는 무변별 검사이므로 성공 기준으로 쓰지 않는다(CLAUDE.md 「변별력 없는 검증 스텝 금지」). 대신 두 신호를 독립으로 본다: ⓐ 공급사 자체 대시보드의 usage에 토큰이 찍히는가(0이면 안 붙은 것 — 양방향 변별) ⓑ OpenRouter Activity의 건당 청구액이 정가의 5%(또는 면제 구간이면 0)인가. 이중 회계다.\n⑤ 자동 폴백 실측 — OpenRouter 공식 문서는 BYOK 키가 실패하면 같은 모델을 서빙하는 **다른 공급사로 자동 재시도**한다고 명시한다. 우리 세 파라미터 계약(`only` + `allow_fallbacks=false` + `data_collection=deny`)이 그 폴백을 차단할 것으로 **읽히지만**(`l3/providers/openrouter.py` 9~24행) BYOK 상태에서 실측된 적이 없다. ⓐ를 택하면 실패 회차의 응답 `PROVIDER` 필드가 `DeepInfra`인지 확인해 이 추론을 검증하고, 관할 미확인 공급사로 새는 경로가 있으면 차단을 코드로 집행한다 — 조용한 우회는 이 저장소가 금지하는 침묵 실패다."
