acceptance:
  - "① 실측 고정 — NLP-09가 파생 게이트를 미지수 이름에서 개수로 옮기면서 `classify_gradability`의 B버킷(`numeric_short_answer_candidate`)이 7,130 → **154**로 줄었다(HEAD 실물 대조). 우선순위가 A→C→B라 C(symbolic)로 승격된 6,976건이 B에서 빠진 결과이며, 채점 품질로는 개선이다(약한 수치 휴리스틱 → SymPy 검산).\n② 위험 규명 — CI 게이트 `selective_grading_demotion_eval`은 A/B 각 75건을 표본으로 뽑는다(`--n-defective 150 --n-clean 150`을 75/75로 분할). B 모집단이 154건이면 여유는 **2.05배**뿐이다. NLP-09 이전에는 95배였다. 앞으로 파생 가능 범위가 더 넓어질수록(이 저장소가 지향하는 방향이다) B는 더 줄고, 75건 미만이 되는 순간 이 게이트는 통과가 아니라 **표본 부족으로 실행 불가**가 된다.\n③ 판정 — 셋 중 하나를 실측으로 고른다: (ⓐ) 표본 수를 줄여도 Wilson 상한이 규약(오검출 ≤0.02)을 증명하는가 — `anchor_detection_channel_eval`이 이미 \"도달 가능성 자체를 매 실행 재검사\"하는 선례를 갖고 있다 (ⓑ) B버킷 정의를 넓혀 모집단을 회복하는가 (ⓒ) A/B 분할 비율을 모집단 비례로 바꾸는가.\n④ 집행 지점(정본화와 별항) — 판정이 무엇이든 **모집단 부족을 조용한 실패로 두지 않는다**. CLI가 실행 전 B 모집단 크기를 확인하고 표본 요구를 못 채우면 \"게이트 통과\"가 아니라 명시적 exit 1 + 별도 stderr로 구분해 낸다(`anchor_detection_channel_eval`의 도달 가능성 재검사와 같은 패턴). 회귀 테스트로 그 분기를 동결한다 — 모집단을 75 미만으로 주입했을 때 RED가 나는지 확인한 뒤에만 보호로 친다."
  - "[정정 2026-09-10 — 등재 당시 ①②의 수치가 틀렸다] 구현 착수 후 소스를 읽고 실측한 결과, 내가 등재 시 적은 \"요구 75건 · 여유 2.05배\"는 **두 군데가 틀렸다**. ⓐ `build_selective_demotion_set`의 `cursor`는 결함 단계와 무결함 단계에 걸쳐 **공유**되므로(같은 문항을 두 trial에 쓰지 않는다) 버킷당 소비는 75가 아니라 **150**이다. ⓑ 따라서 실제 여유는 2.05배가 아니라 **4건**(가용 154 · 요구 150)이다. 이분 탐색 실측으로 N=155까지 통과하고 N=156부터 `InsufficientPoolError`가 난다 — CI가 쓰는 N=150 기준 여유 5, 배수 1.03x. 등재 시점의 숫자는 소스를 읽지 않고 버킷 분할 산식만 보고 적은 추정이었다. 이 오독 자체를 회귀 테스트로 고정했다(`test_demand_counts_both_phases_not_just_one` · `test_defective_and_clean_phases_share_the_cursor`).\n[③ 판정 결과] ⓐ(표본 축소)는 채택 불가 — n=150은 오검출 상한 0.02 규약에서 역산된 값이라 낮추면 Wilson 상한이 규약을 증명하지 못해 게이트가 공허해진다. ⓑ(모집단 회복)·ⓒ(분할 비율 재설계)는 **이 태스크에서 결정하지 않는다** — 둘 다 게이트의 측정 의미를 바꾸는 설계 변경이고, 지금 red가 아니므로 근거 없이 고를 이유가 없다. 이 태스크가 집행하는 것은 **부족을 판정 불가로 표면화하고 축소를 예고하는 것**까지다. 실제 부족이 닥칠 때 ⓑ/ⓒ 중 무엇을 고를지는 그 시점의 모집단 실측으로 판단한다.\n[④ 집행 결과] `_EXIT_UNMEASURABLE = 2`를 신설해 표본 부족(판정 불가)을 기준 미달(exit 1)과 분리했다(선례 `ops/live_preflight.py`). `InsufficientPoolError`를 전용 예외로 두어 `main()`이 갈라낸다. 셋 구성 **전에** `bucket_headroom`으로 가용·요구·여유를 항상 출력하고(분모 없는 0 금지), 여유가 요구의 10% 미만이면 stderr 경고를 낸다 — 현재 B버킷이 이 경고에 걸린다(여유 4). 실패 메시지는 `--n-*`를 낮추지 말라고 **명시적으로** 막는다(가장 그럴듯한 오답 처방이기 때문). 모듈 docstring의 \"두 버킷 모두 n=75를 압도적으로 넘는 풀\"이라는 이제 거짓인 문장도 정정했다.\n[검증] 뮤테이션 11종 전건 RED(과잉 정지·과잉 관대 대조군 2종 포함). 1차에서 2종이 생존했고 둘 다 CLAUDE.md가 이름 붙인 형태였다 — M2는 픽스처가 그 절을 안 밟았고(answer 없는 *객관식*을 썼는데 그것은 `classify_gradability`가 이미 unclassified로 물려 절에 닿지 않았다 · 단답형이라야 밟는다), M9는 계약만 직접 테스트하고 CLI 집행 지점을 안 봤다(정본화≠집행). 둘 다 반례를 픽스처로 넣어 해소했다. CI 인자 그대로 실행 시 게이트는 여전히 exit 0이고 경고만 추가로 뜬다."
