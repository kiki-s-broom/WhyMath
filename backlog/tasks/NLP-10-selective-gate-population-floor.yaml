notes: "발단: NLP-09(회수 코퍼스 multi_symbol 파생) 작업 중 실측으로 드러났다. 그 태스크의 acceptance ③(영향 범위 명시)이 요구한 대조에서, 영향이 \"unclassified → 분류됨\"(72건)이 아니라 압도적으로 **B → C 이동**(6,976건)이었다는 것이 확인됐다.\n\n이 태스크를 별도로 여는 이유: NLP-09의 변경 자체는 게이트를 깨지 않았다(CI와 동일 인자로 실행 확인 — 검출 150/150 · 오검출 0/150 · EXIT=0). 지금 red가 아니므로 NLP-09에서 고치는 것은 범위 확대다. 그러나 여유가 95배에서 2배로 줄어든 것은 **구조적 변화**이고, 다음에 파생 범위를 넓히는 작업이 아무 경고 없이 이 게이트를 실행 불가로 만들 수 있다. CLAUDE.md \"docstring 속 계획은 백로그를 대신하지 못한다\".\n\n[정정 2026-09-10] 등재 시 추정으로 적은 여유 수치가 실측과 달랐다(2.05배 → 4건) — 정정 및 판정·집행 결과 기록"
