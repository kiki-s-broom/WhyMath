acceptance:
  - "① 지표 7종을 **한 명령**으로 산출한다 — Curriculum Coverage · Concept Completeness · Problem Coverage · Solution QA Pass · Learning Loop Success · Critical Defect · Graph Connectivity Coverage.\n② 각 지표가 **위반 주입에 반응**하는지 확인한다. 전 항목 초록은 증거가 아니다.\n③ 기존 KPI 정본 12종과 **2평면으로 분리**한다 — 저 12종은 생산 공정(CU당 시간·비용·오류율), 이 7종은 제품 완성도다. 정본이 셋이 되지 않게 이름·문서에 평면을 명시한다(Kiki 수용 2026-09-22).\n④ 중복 2종은 신설하지 않는다 — Solution QA Pass 는 저장소 '수학적 오류율 ≤0.5%'(=99.5%)가 더 엄격하고, Critical Defect 0 은 Hard Gate F-Ⅰ~F-Ⅴ 와 같은 뜻이다. 둘은 기존을 흡수해 표기한다.\n⑤ Concept Completeness 는 원 문서 정의 그대로 쓰지 않는다 — 필드 채움 검사는 반증력 0 으로 이미 기각된 방식이다. 재설계 근거를 적는다.\n⑥ 목표 수치(95%·98%·99%)는 원 문서의 '목표 예시'다 — P3-02·P3-10 실측 기준선을 본 뒤 Kiki 가 확정한다(지시문 주의 5).\n⑦ 완료 판정 — 7종이 한 명령으로 산출되고 각각 위반 주입에 반응."
