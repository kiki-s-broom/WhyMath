notes: "사고 경위 2026-09-18 ARCH-57 런북: [A]가 '환경변수를 설정하기 *전에* 재면 기본값'이라는 전제로 짜였는데, Kiki가 직전 실패 회차에서 같은 창에 $env:WHYMATH_CLOUD_PROVIDER=openrouter를 이미 설정한 상태였다. 결과 SEAT_DEFAULT=OpenRouterProvider — 코드가 아니라 창의 상태를 잰 것이고, 성공/오염 양쪽에서 같은 화면을 내므로 변별력이 0이었다. 컨테이너 재현으로 확정: 오염된 셸에서 종전 형태=OpenRouterProvider / os.environ.pop 선행 형태=AnthropicProvider(깨끗한 셸과 동일). 코드는 정상이며 test_default_cloud_provider_is_anthropic이 깨끗한 프로세스에서 계약을 이미 동결하고 있었다. CLAUDE.md 2026-07-17 '변별력 없는 검증 스텝 금지'가 이미 있는데 런북 저자가 또 재생산했다 — 그 규칙이 *런북의 자가검증 스텝*을 겨냥하면서도 '앞 블록이 남긴 환경을 상속한다'는 축은 말하지 않기 때문이다. 붙여넣기 워크플로가 한 창을 계속 쓰는 한 구조적으로 반복된다. 같은 세션의 런북 결함 2회차(1회차 = 미머지 신규 파일을 main 체크아웃에서 안내 — 2a4b6ca3에서 worktree로 정정)."
