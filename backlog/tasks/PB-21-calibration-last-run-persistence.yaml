notes: "출처: PB-10(PR #1542) 정직한 공백 — 마지막 보정 시각은 DB에 저장 좌석이 없다. 실측(2026-10-08): Problem에 calibrated_at 컬럼이 없고 updated_at은 server_default만 있고 onupdate가 없어 보정 UPDATE로 갱신되지 않는다. 그래서 도달 리포트가 last_calibration_at=unrecorded로 모른다를 명시하고 시각은 calibration_run 로그 한 줄에만 있다(컨테이너 로그 3x10MB 회전이라 장기 보존 안 됨). 판정 자체는 시각 없이 성립하므로 P2(12월 검증 이후 가능)로 등재한다. 관련: EOS-154(a 첫 채택 신호)가 이 시각을 소비할 수 있으나 의존하지 않는다."
