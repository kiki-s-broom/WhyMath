  - "① 검수 결과 반영 — 게이트 G-s401-inter-course-edge-review 의 판정(승인/반려/보류)을 137건 각각(또는 과목 쌍 단위)에 대해 확정한다. 반려분은 저작 목록 상수(scripts/build_inter_course_edges_s4_01.py)에서 제거한 뒤 제안 파일을 재생성한다(손편집 금지 — --check 가 바이트 동일을 보증). 부분 승인이 정상이며 전건 승인을 전제하지 않는다.\n\n② 정본 변동 선검사 — 병합 직전 제안 _meta.source_graph_sha256 을 그 시점 graph.json 의 sha256 과 대조한다. 다르면 병합하지 않고 검증기(python -m data_pipeline.atom_graph.inter_course_edges)부터 재실행해 error 0 을 재확인한다. 착지 시점 값은 1821d31c2614dc1b882b3f9b734736f1f4183e1097105675102c3541363b979f 이다.\n\n③ 스키마 처리 — AtomEdge 가 extra=forbid 라 rationale 을 받지 못한다. S4-60 이 고른 안과 같은 안을 쓴다(두 제안은 한 번에 병합하는 것을 권장). 결정하지 않고 병합하면 안 된다.\n\n④ 병합 후 실측 재확인 — university_reachability 로 도달 대학 세부개념을 재측정해 기대값과 대조한다(전건 승인·슬라이스 1 포함 시 466/512). 부분 승인이면 승인 건수로 재계산하며 수치를 사후에 맞추지 않는다. 기존 atom_graph 검증기(validate.py)의 prerequisite_cycle·dangling_edge_endpoint 가 error 0 인지, traversal_load_probe 가 병합 후 부하에서 exit 0 인지 재실행한다.\n\n⑤ 범위 밖 — 대학 문항·K-12 0문 4과목·K-12 입구 엣지(46개 미도달)는 S4-01 본체 소관이다. 이 태스크는 이미 저작·검증된 137건(또는 승인 부분집합)을 정본에 반영하는 한 동작만 다룬다."
