acceptance:
  - "① 실측 — 현재 `CLAUDE.md`의 토큰 수를 실제 토크나이저(API count_tokens 또는 동등 도구)로 측정해 기록(보고서의 4.5만~6.8만은 문자 구성 추정). 세션 시작 고정비 = CLAUDE.md + AGENTS.md + SessionStart 브리핑 합계."
  - "② 재구성안 — (a) 코어: 정체성·7계층·금기 요지·의사결정 우선순위·워크플로·Kiki 안내 규칙 *요지* (b) 규칙 인덱스: 규칙 ID·한 줄·집행 코드 경로 또는 태스크 ID·상태(code/task/prose) — 집행 없는 신규 항목은 린트 실패 (c) 사고 경위 전문 → HARN-118 대장으로 이동(대장 ID 참조만 남김). 목표 코어 ≤ 1.5만 토큰. 재구성안은 문서 초안 + 이동 대조표(규칙 52건 전건 행선지)로 제출하며 **CLAUDE.md 본문 변경은 Kiki 승인 게이트(`gates add`)를 통과한 뒤에만 커밋**한다 — 헌법은 사람 소유."
  - "③ 적시 주입 — `check-edit` 훅(PostToolUse Edit|Write)이 편집 경로를 HARN-118 대장의 paths와 대조해 그 경로에서 난 사고·규칙만 최대 5줄로 stderr 주입(보고서 §6 E1). 주입 0건 경로는 침묵. 변별력: 대장에 경로 X의 사고를 넣고 X 편집 → 주입 1건, Y 편집 → 0건."
  - "④ 산문 규칙 등재 동결의 집행 지점(②의 린트에 편입) — HARN-118 착지 후 CLAUDE.md에 새 \"사고 경위:\" 단락 또는 집행 코드·태스크 참조 없는 규칙 항목이 추가되면 규칙 인덱스 린트가 exit 1. 발효 시점은 HARN-118 착지 시로 통일(MEMORY 2026-09-20 결정 ①·보고서 §5.3과 일치). 이 동결은 CLAUDE.md '실수 관리' 절이 허용하는 대책 형태를 좁히므로 CLAUDE.md 본문 변경과 함께 Kiki 승인 게이트를 통과한 뒤에만 켠다. 변별력: 동결 위반 단락 1건 주입 → RED, 대장 참조를 붙이면 GREEN."
  - "[승인 2026-09-20] Kiki가 \"새 산문 규칙 등재 동결\"을 지정·승인했다(MEMORY 2026-09-20 결정 로그·CLAUDE.md v0.2.30 실수 관리 절). ②·④가 요구하던 CLAUDE.md 본문 변경의 Kiki 승인은 동결 항목에 한해 충족됐다 — 코어·규칙 인덱스·사고 경위 이동(3분리)의 본문 변경은 여전히 이동 대조표를 Kiki에게 보이고 승인받은 뒤 커밋한다."
  - "[ARCH-66 정정 2026-09-24] ① 측정 수단 변경: Kiki 결정으로 Anthropic API를 2026-12-31까지 쓰지 않으므로 count_tokens API 대신 Claude Code /context로 측정한다(게이트 G-harn121-constitution-token-measure-context). /context도 Claude 토크나이저 실측이라 '문자 수 대체 금지'와 양립한다. 한계: AGENTS.md는 /context에 나타나지 않는다(Claude Code 미로드) — AGENTS.md 수치는 API 재개 시 scripts/ops/measure_constitution_tokens.py로 보강하거나 제외 사유를 판정에 적는다."
  - "[정정 2026-09-24] 게이트 G-harn121-constitution-token-measure-context의 clear 주체가 kiki로 기록됐으나 사실과 다르다 — 측정(/context 실행)은 Kiki, clear 행위는 claude 세션(claude/keen-pascal-6b9tz0)이 --as kiki를 잘못 붙여 수행했다. 판정 내용(CLAUDE.md 55.6k 토큰·미측정 2건)은 유효하다. ① 측정 결과: CLAUDE.md 55.6k 토큰 = 목표 코어 15k의 3.71배 — 3분리(②)의 기준선."
