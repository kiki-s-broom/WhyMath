acceptance:
  - "① 추출기 착지 — `scripts/ops/extract_cloud_seat.py` 신설. `problem_corpus_accumulate`의 stdout JSON에서 `cloud_seat` 블록만 뽑아 **ASCII 전용**으로 출력한다(`ensure_ascii=True`). 이유는 인코딩 안전이다 — Kiki가 콘솔 출력을 복사해 회신하는데 한국어(`note`·`unmeasured_reason`·`cost_note`)가 섞이면 PowerShell cp949 디코딩 왕복에서 손상된다(CLAUDE.md 2026-09-14 셸 중계 축). 로그 줄이 앞에 섞여도 `raw_decode`로 첫 JSON 객체를 집는다.\n② 0과 None을 구분해 낸다 — `retries_total`·`calls_with_any_retry`가 None이면 `None`으로, 0이면 `0`으로 낸다. 둘을 같은 글자로 접으면 '계측했고 재시도 0건'과 '아무도 계측 안 함'이 한 화면이 된다(EOS-112가 분모를 따로 낸 이유). `cost_usd_total`도 같은 축이다.\n③ 판정 보조 출력 — EOS-118 acceptance ②의 두 신호를 **각각 별도 키**로 낸다(`SIGNAL_STATE_MEASURED`·`SIGNAL_COMPARABLE_POSITIVE`). 한 줄로 합치지 않는다 — 한 신호로 두 축을 판정하면 선언 축만 살아 있고 관측 축이 죽은 회차가 통과한다(EOS-111 등재를 부른 형태).\n④ 런북 착지 — `docs/ops/eos118_seat_signal_live_runbook.md` 신설. 6항목 브리핑 + 블록 3개([A] 좌석 왕복 조회 · [B] 사전 점검 조회 · [C] 2회차 실행 + 추출). [C]는 쓰기 블록이므로 단일 최상위 `if (…) { … } else { … }` 자가거부 가드를 갖고 else 가지가 **어느 조건이 False였는지** 출력한다(HARN-106). `scripts/ops/check_runbook_blocks.py` exit 0으로 실측 확인한다.\n⑤ 인코딩 경유 제거 — accumulate stdout은 PowerShell 파이프가 아니라 `cmd /c` 리디렉션으로 파일에 받는다(cp949 디코딩 왕복 회피 — 출력 인코딩 명시로는 막히지 않는 축). 캡처 파일은 UTF-8로 남고 콘솔에는 추출기의 ASCII 출력만 나온다.\n⑥ 전제 정정 — 게이트 `G-eos118-seat-signal-live-run` 설명은 'Docker Postgres 가동'을 전제로 적었으나 `problem_corpus_accumulate`는 DB를 임포트하지 않는다(실측: 해당 모듈 import 문에 db·session·sqlalchemy·engine 0건 · ARCH-57 런북도 'Docker·DB·서버 불요'로 적는다). 런북 §5에 'DB 불요'와 그 실측 근거를 명기해 Kiki가 없는 선행 조건을 갖추느라 왕복하지 않게 한다.\n⑦ 회귀 동결 — `tests/infra/test_extract_cloud_seat.py`로 ①~③을 고정하고 뮤테이션으로 변별력을 확인한다(ensure_ascii 제거 · None을 0으로 접기 · 두 신호를 한 키로 합치기 · raw_decode 폴백 제거 — 각각 RED여야 한다).\n⑧ 경계 — 이 태스크는 게이트 실행 자체가 아니다. EOS-118의 라이브 회차는 Phaiakes9·키가 필요해 여전히 Kiki 소유이며 `G-eos118-seat-signal-live-run`이 그것을 막는다. 이 태스크는 그 게이트를 **실행 가능하게 만드는** 도구·런북 축만 소유하고, 관측 결과의 판정은 EOS-118이 소유한다."
