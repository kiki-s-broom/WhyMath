  - "① P3-22 가 phase3_coverage 에 만든 --hints-from-db 를 운영 DB(docker whymath-pg, 호스트 포트 5433)에서 실행해 실제 기준선을 보고한다: DB 검수 통과 힌트 문항 수 · 범위 은행과 겹치는 수 · 적격 문항 수 · hint 연결 linked/missing 개수 · Concept Completeness 값. 출력의 hint_seat 필드(JSON)를 증거로 첨부한다.\n② DB 힌트 문항이 있는데 범위 은행과 겹침이 0이면 ID 공간 불일치(JSONL 은행 problem_id 와 DB problem 행)를 먼저 규명한다 - 힌트 0건으로 보고하지 않는다.\n③ 이 태스크의 실행은 Kiki 머신 작업이다. 런북은 6항목 브리핑·자가검증(DB 응답 확인) 포함, python -m 형태로 안내한다."
  - "[진행 2026-10-16 · 판정 기준 origin/main 419c4e7c] ③ 이행: 런북 docs/ops/p3_42_coverage_hint_baseline_live_measurement_runbook.md (6항목 브리핑·자가검증·python -m 형태·자리표시자 0개, check_runbook_blocks 위반 0건). ①② 미이행: 운영 DB 실측은 Kiki 머신 실행 대기 - 이 세션은 Postgres 가 없어 DB 수치를 재지 못했다. 수치를 추정해 채우지 않는다. 오프라인으로 확정한 것: JSONL 은행의 problem_id 14,690건은 전부 유일한 UUIDv5 정규형이라 형식 불일치로 겹침 0이 될 구조적 이유는 없다. 계측기 적격 판정은 JSONL review_status가 approved인 행뿐이며 그 수는 전체 14,694행 중 2,984건(범위 은행 1,073문항 중 917)이다. 런북 블록 E가 DB problem 과 JSONL 의 problem_id·slug·review_status 를 대조해 ID 공간 불일치와 상태 좌석 불일치를 가른다. 발견: 계측기 exit 1 은 목표 미달과 크래시를 구분하지 못한다(import 실패도 exit 1) - 런북은 exit code 가 아니라 MEASURED 줄로 판정한다. 완료 조건: Kiki 회신(B·D·E 출력)으로 ①② 를 채운 뒤 done."
  - "[실측 2026-10-16 · Kiki 머신 블록 A·B 출력] 운영 DB(whymath-pg 5433) hints 테이블은 존재하나 비어 있다: DB_HINTS_ALL=0, DB_HINTS_VERIFIED=0, DB_HINTED_PROBLEMS=0 (전부 rc=0 - SQL 실패 아님). DB_PROBLEM_ROWS=1703 (JSONL 은행 14,694행 대비 일부만 적재). 클론은 HEAD 5586a087 로 origin/main 674a92b1 보다 뒤처져 PATHS_MATCH_MAIN=False 였고 fast-forward 후 True. 아직 미측정: 계측기 공식 출력(hint_seat · hint linked/missing · Concept Completeness)과 ID 공간 진단 VERDICT - 블록 C~E 회신 대기. 런북 정정: 111줄 Python 붙여넣기가 중간부터 들어가 실패했으므로 사이드카 파일(docs/ops/p3_42_probe.py)을 git 에서 받아 SHA-256 으로 검증하는 방식으로 교체, B2(fast-forward) 신설, 블록 완료 표시줄 추가."
