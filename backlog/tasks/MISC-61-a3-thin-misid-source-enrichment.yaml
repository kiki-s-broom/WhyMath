  - "⑦ [정정 2026-10-09 · ① 결과] Kiki 머신 1회 실행 결과(판정 기준 main `713512bc`, 원천 sha256 `fcf6d333…187e` 일치) 기록 완료 — docs/reviews/m0599_hold_and_provenance_mismatch_2026-10-07.md §2-b. 요지: 세 필드의 원천 키는 대상 90행 전부 값 0건. 비표준 키 중 대상 행에 값이 있는 5개(`출처`·`원본_영역`·`성취기준요약`·`매핑개념명_참조`·`코드정밀도`)는 원천 839행 전부에 있는 공통 메타 열이라 내용 키가 아니다 — 스크립트 verdict `H2_unknown_key`(90/90)는 이 열에 걸린 과장이다. 실질 판정: `distractor 연결됨` 88행(M0599·M0600 포함)=가설 ①(원천 공란) → 경로 ③. `원본`+공란 21행(M0418·M0417 포함)=가설 ② 후보 — 원천 `오개념_원인` 값 21행과 개수 일치(행 일치는 미확인), M0418·M0417에서 실제 확인. 경로 ②는 이 21행 한정이며 `오개념_원인`을 어느 필드로 보낼지는 내용을 본 뒤 정한다(미판정). 후속: ⓐ진단 스크립트 판정 규칙이 전 행 공통 열에 걸리지 않게 정정(행 비율 기준) ⓑ`오개념_원인` 21행의 행 단위 대조·내용 확인(본문 출력이 필요하므로 Kiki 머신 2차 실행 여부는 Kiki 결정)."
