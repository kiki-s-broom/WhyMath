acceptance:
  - "① 사례 카탈로그 정본화 — docs/standards/encoding_safety.md 신설. cp949 손상 7유형(표시 인코딩 오류 / UTF-8을 cp949로 오독 / 잘못 재저장 / U+FFFD 삽입 / ? 치환 / Git 전체 변경 / 콘솔만 깨짐)을 화면 예·원인·복구 가능성 등급과 함께 적고, 이 저장소에서 실제로 난 4회(2026-07-17 logconfig 읽는 파일 · HARN-19 파싱하는 출력 · OPS-53 내는 출력 · 2026-09-14 셸이 중계하는 출력)를 그 표의 어느 행인지 매핑한다. 축이 서로 다르다는 것이 이 문서의 핵심이다 — 하나를 고쳐도 나머지가 덮이지 않는다.\n② 탐지기 신설 — scripts/ops/cp949_guard.py. 추적 파일 전수를 스캔해 4축을 판정한다: ⓐ U+FFFD 포함(복구 불가 등급 — 즉시 위반) ⓑ UTF-8 디코딩 실패(선언 없는 비-UTF-8) ⓒ mojibake 패턴(cp949 바이트를 latin-1로 읽은 형태·UTF-8을 cp949로 읽은 형태를 문자 시퀀스로 검출) ⓓ 선언-실측 불일치(아래 ③). 판정은 exit code로만 한다(0=정합, 1=위반, 2=측정 실패). 스캔 0건은 실패로 처리한다 — 대상을 하나도 못 찾은 전수 가드는 공허하게 통과한다.\n③ 경로 면제 대신 선언 대조 — data/licenses/snapshots/**는 외부 사이트가 서빙한 바이트 그대로가 증거이므로 UTF-8이 아닐 수 있다. 이것을 경로로 통째 면제하지 않고 그 옆 meta.json의 content_type charset 선언과 대조한다: 비-UTF-8 파일은 ⓐ meta가 비-UTF-8 charset을 선언했고 ⓑ 그 선언한 charset으로 실제 디코딩되는 경우에만 통과. 선언이 없거나 선언대로 디코딩되지 않으면 위반이다. (실사례: schoolinfo가 charset=euc-kr 선언 + euc-kr 디코딩 성공으로 정당한 예외다.)\n④ 발견된 실제 손상 처리 — 라이선스 스냅샷 20건 중 5건의 sha256이 기록과 불일치한다(2026-09-14 실측). 원인은 .gitattributes에 .html 규칙이 없어 Git 기본 text auto가 CRLF를 LF로 정규화한 것이며, ncic(차이 1975 = LF 1975)와 schoolinfo(차이 19 = LF 19)는 CRLF 복원 시 기록 sha256과 바이트 동일하게 일치함을 실측했다. 나머지 3건(illustrative-mathematics 1915 vs LF 2667 · kogl-license-types 105 vs 2646 · omnimath 10 vs 995)은 원본이 혼합 줄바꿈이라 어느 줄이 CRLF였는지 알 수 없어 단순 복원이 불가능하다. 조치: .gitattributes에 스냅샷 경로 -text(정규화 금지)를 박고, 복원 가능한 2건은 바이트 복원하며, 불가능한 3건은 '정규화로 훼손됨'을 meta에 기록하거나 재수집 판정을 별도 태스크로 분리한다. 재수집은 원 사이트 내용이 그 사이 바뀌었을 수 있어 해시가 어차피 달라지므로 자동 해결이 아니다.\n⑤ 예방 설정 — .editorconfig(charset=utf-8 · end_of_line=lf · .bat/.cmd는 crlf) 신설, .vscode/settings.json에 files.encoding=utf8 + files.autoGuessEncoding=false 신설. autoGuessEncoding은 대규모 저장소에서 오판이 섞이므로 명시적으로 끈다.\n⑥ CI 배선 — 기존 policy-guard 잡에 스텝으로 추가한다(신규 잡을 만들면 필수 체크 목록·문서 REQUIRED_CHECKS 블록까지 건드려야 하므로 범위가 넓어진다). 배선 후 그 잡이 실제로 이 스텝을 실행했는지 확인한 것까지가 완료다 — '저장소에 존재함'과 '돌아감'은 다르다.\n⑦ 변별력 — 4축 각각에 결함을 주입해 RED를 확인한다. 픽스처는 절마다 그 절의 반례를 둔다: ⓐ U+FFFD 1자 삽입 ⓑ cp949 바이트 파일 추가(선언 없음) ⓒ mojibake 문자열 삽입 ⓓ 스냅샷 meta의 charset 선언을 utf-8로 바꿔 실측과 어긋나게 함. 성공 방향 대조군도 둔다: 정당한 예외(schoolinfo 현행)가 통과하는지, 한글이 정상인 UTF-8 파일이 통과하는지. 주입 적용(mutated != original)과 원복 바이트 동일을 하네스가 단언한다.\n⑧ 정직한 공백 — 자동 인코딩 탐지(chardet 계열)는 ASCII 위주·짧은 파일·한글이 적은 파일에서 오판하므로 판정 근거로 쓰지 않는다. 이 가드는 탐지가 아니라 '선언 대조'와 '결정론적 디코딩 시도'만 한다. 그 한계를 문서에 적는다."
