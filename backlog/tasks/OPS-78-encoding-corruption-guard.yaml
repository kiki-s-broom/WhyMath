notes: "착수 계기(2026-09-14): Kiki가 cp949 손상 사례·대응 문서를 올리고 \"케이스와 대응책을 마련하고 테스트해줘\"를 지시했다. 같은 날 이 세션이 셸 중계 축(PowerShell이 gh 출력을 cp949로 디코딩 왕복시켜 JSON 41자 유실)을 고친 직후이며, 그것이 같은 계열 4회차였다.\n\n[착수 전 실측 — 저장소 현황] 추적 파일 3,511건 전수 스캔: U+FFFD 포함 0건(복구 불가 등급 손상은 아직 없다 — 깨끗한 상태에서 가드를 세울 수 있다), 비-UTF-8 디코딩 실패 1건(data/licenses/snapshots/schoolinfo — 학교알리미가 euc-kr로 서빙한 약관 스냅샷이며 meta.json이 charset=euc-kr을 이미 선언하고 있다. 증거 파일이므로 변환 금지 = 정당한 예외).\n\n[부수 발견 — 이 태스크가 다루는 실제 손상] 라이선스 스냅샷 20건 중 5건의 sha256이 meta 기록과 불일치한다. 전부 바이트가 줄어든 방향이고 .gitattributes에 .html 규칙이 없다. ncic·schoolinfo는 CRLF 복원으로 기록 해시와 정확히 일치함을 실측했으므로 원인은 Git text auto 정규화로 확정. 나머지 3건은 혼합 줄바꿈이라 단순 복원 불가. 라이선스 스냅샷은 저작권 안전의 법적 증거이므로(CLAUDE.md 데이터 원칙·게이트 G-license-snapshot-blocked-sources) 해시가 깨진 상태는 그 자체로 결함이다.\n\n[기존 자산과의 경계] OPS-53은 '우리가 내는 출력'(CLI stdout이 cp949 콘솔에서 크래시)을 소유하며 이 태스크와 다른 축이다. check_ps_scripts.py는 PowerShell 스크립트 품질을, ruleset_drift.py는 룰셋 수집을 다룬다. 이 태스크는 '저장소에 커밋되는 파일 자체의 바이트 무결성'이라는 네 번째 축이며, 앞의 셋 중 어느 것도 U+FFFD가 커밋되는 것을 막지 못한다(실측: 관련 식별자 검색 0건)."
