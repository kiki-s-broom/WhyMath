acceptance:
  - "ADMIN-07 정직한 공백 ③ / ADMIN-16 부수 항목: 검수 판정이 반려코드·HIT 타이머 없이 제출될 수 있다. 현재 POST /v1/admin/review-queue/items/{id}/transitions의 reject는 failure_code를 받지 않고 ReviewTimerEvent도 쓰지 않는다(schema/review_timer.py는 rejected→failure_code 필수를 함수 수준에서만 집행하고 harness/review_session CLI만 생산자다). 집행: ①reject 요청은 failure_code(GenerationFailureCode F1~F8)가 없으면 서버가 422로 거부한다 ②전이 성공 시 같은 트랜잭션에 finished 타이머 이벤트(verdict·failure_code·elapsed_ms·review_session_id)를 ReviewTimerEvent.from_schema로 적재하고 실패하면 상태 변경도 롤백한다 ③검수 화면이 착수 시 started 이벤트를 만들고 판정 시 경과를 보내도록 UI를 잇는다(F1~F8 선택 UI 포함) ④PATCH /v1/problems/{id}는 failure_code를 실을 자리가 없으므로 pending→rejected 변경을 거부하고 POST 경로로 안내한다(ADMIN-16이 PATCH를 전이표에 연결했으므로 그 위에서 닫는다) ⑤ops/hit_cu_metrics가 DB 적재분을 읽어 적재율이 올라가는지 실측하고 어떤 경로로도 타이머 없는 판정이 제출되지 않음을 주입 테스트로 RED 확인."
