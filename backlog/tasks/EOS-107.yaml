notes: "EOS-106 Week 1 Gate 판정 세션이 발견한 별건. 판정 자체와 무관하므로 등재만 하고 넘어간다.\n근거(실측·main d99a4828): tests/backend/api/test_e2e_vertical_slice_integration.py:97 에 pytestmark = pytest.mark.integration 이 있고, .github/workflows/ci.yml 의 backend-migrations 잡이 PR 경로에서 `pytest -m integration` 을 돈다(services: pgvector/pgvector:pg16 · env WHYMATH_RUN_INTEGRATION=1). 따라서 그 관통은 PR에서 실행된다.\n영향: 그 서술이 \"관통이 PR에서 검증되지 않는다\"는 전제를 만들어 불필요한 배선 태스크를 부를 수 있다."
