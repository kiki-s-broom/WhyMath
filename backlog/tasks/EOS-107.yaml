  - "① `docs/strategy/plan300_phase2_backlog_crosswalk.md` §10의 \"관통 테스트가 nightly 전용이라 PR에서 돌지 않으며\" 서술을 실측으로 정정한다 — 해당 테스트에는 pytestmark = pytest.mark.integration 이 달려 있고, PR에서 도는 backend-migrations 잡이 `pytest -m integration --ignore=../../tests/backend/l3`으로 수집한다(실 PG·WHYMATH_RUN_INTEGRATION=1). e2e-nightly 잡은 그 위에 얹힌 *추가* 회차다.\n② 정정은 원 서술을 지우지 않고 병기한다 — 판정은 시점에 종속되므로, 그 서술이 작성된 시점에 옳았는지(그때 marker가 있었는지)를 `git log -S` 로 확인해 함께 적는다.\n③ 같은 문서의 다른 \"PR에서 안 돈다\"류 서술이 더 있는지 전수 확인한다(한 건만 고치면 같은 오해가 남는다)."
