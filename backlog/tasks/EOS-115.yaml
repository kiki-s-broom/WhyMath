acceptance:
  - "① 기본 학습자(전이 이력 없음 = NEW)가 `POST /v1/me/attempts`로 오답을 내면 정책 결정이 실제로 내려진다 — 응답 `learning_state.next_action`이 null이 아니고 `rejected_transition`이 null이다. 지금은 NEW → ASSESSING이 전이표에 없어 전원이 거부된다.\n② 어느 축으로 고칠지 판정하고 사유를 남긴다. 셋 중 하나이며 파급이 서로 다르다 — (가) 서빙 경로가 생애주기 전이를 스스로 적재한다(예: 진단 capture/complete·첫 학습 진입이 DIAGNOSIS_STARTED·DIAGNOSIS_COMPLETED·LEARNING_STARTED를 남긴다) (나) 전이표에 NEW·READY에서 ASSESSING으로 가는 간선을 연다(EOS-105가 의도적으로 닫아 둔 축 — 열려면 \"무엇 대비 평가인가\"의 부재를 어떻게 다룰지 함께 적는다) (다) 클라이언트(Flutter)가 생애주기 전이를 적재하도록 배선한다.\n③ 선택한 축이 **서빙 경로에서 실제로 호출되는지**를 별항으로 확인한다(정본화≠집행). 전이를 적재하는 코드가 생겨도 학생 흐름이 그것을 지나가지 않으면 이 결함은 그대로다.\n④ 고쳐지면 Week 3 게이트 하네스의 xfail 표식을 제거한다 — `tests/backend/api/test_week3_gate_remediation_loop.py::test_policy_directed_remediation_fires_for_a_default_learner`는 strict xfail이라 고쳐지는 순간 XPASS로 빨강이 된다. 그 제거까지가 이 태스크의 완료다.\n⑤ 실측 근거를 남긴다 — 고치기 전/후로 같은 호출의 `learning_state` 블록을 찍어 rule_id가 null에서 R3-wrong-misconception으로 바뀌는 것을 보인다(\"작동한 비율\" 원칙 — 규칙이 실제로 돌았다는 신호)."
