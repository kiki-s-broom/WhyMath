notes: "Week 3 Gate 판정(EOS-113)이 지목한 인접 결함. 게이트의 여섯 마디에는 없어 판정은 통과했으나, 계획서 300 §9 보정 정책(MISC-30)과 §3 상태 머신(EOS-105)이 실제로 도는 유일한 경로가 이것이다.\n\n실측(2026-09-19 · main 0bf7e1b7 · 로컬 실 PG):\n- 기본 학습자의 오답 응답: from_state=NEW · to_state=NEW · rule_id=null · next_action=null · rejected_transition=\"NEW → ASSESSING (UndefinedTransitionError)\".\n- 생애주기 전이 3건(NEW→DIAGNOSING·DIAGNOSING→READY·READY→LEARNING)을 손으로 POST한 뒤 같은 오답을 내면: from_state=LEARNING · to_state=REMEDIATING · rule_id=R3-wrong-misconception · next_action=REMEDIATE_MISCONCEPTION · target_misconception_id=distribution-over-power · rejected_transition=null. 즉 정책 자체는 살아 있고 도달 경로만 없다.\n- 그 전이 3건을 적재하는 서버 경로 0건·클라이언트 호출부 0건(역할 기반 검색: DIAGNOSIS_STARTED·DIAGNOSIS_COMPLETED·LEARNING_STARTED·PRACTICE_STARTED 4종이 schema/learning_state.py의 enum 선언에만 등장). 즉 사람이 손으로 POST하지 않는 한 R3·R5는 영원히 발동하지 않는다.\n\nEOS-105 모듈 docstring이 이 한계를 이미 자인한다(\"상태 이력이 없는 기존 학생(= 전원)은 ... 응답 제출 시 전이가 거부된다\"). 그러므로 이 태스크는 숨겨진 버그의 발견이 아니라 **선언된 한계의 해소**이며, 어느 축으로 해소할지가 설계 판정이다."
