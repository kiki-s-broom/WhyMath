acceptance:
  - "① 기본 학습자(전이 이력 없음 = NEW)가 `POST /v1/me/attempts`로 오답을 내면 정책 결정이 실제로 내려진다 — 응답 `learning_state.next_action`이 null이 아니고 `rejected_transition`이 null이다. 지금은 NEW → ASSESSING이 전이표에 없어 전원이 거부된다.\n② 어느 축으로 고칠지 판정하고 사유를 남긴다. 셋 중 하나이며 파급이 서로 다르다 — (가) 서빙 경로가 생애주기 전이를 스스로 적재한다(예: 진단 capture/complete·첫 학습 진입이 DIAGNOSIS_STARTED·DIAGNOSIS_COMPLETED·LEARNING_STARTED를 남긴다) (나) 전이표에 NEW·READY에서 ASSESSING으로 가는 간선을 연다(EOS-105가 의도적으로 닫아 둔 축 — 열려면 \"무엇 대비 평가인가\"의 부재를 어떻게 다룰지 함께 적는다) (다) 클라이언트(Flutter)가 생애주기 전이를 적재하도록 배선한다.\n③ 선택한 축이 **서빙 경로에서 실제로 호출되는지**를 별항으로 확인한다(정본화≠집행). 전이를 적재하는 코드가 생겨도 학생 흐름이 그것을 지나가지 않으면 이 결함은 그대로다.\n④ 고쳐지면 Week 3 게이트 하네스의 xfail 표식을 제거한다 — `tests/backend/api/test_week3_gate_remediation_loop.py::test_policy_directed_remediation_fires_for_a_default_learner`는 strict xfail이라 고쳐지는 순간 XPASS로 빨강이 된다. 그 제거까지가 이 태스크의 완료다.\n⑤ 실측 근거를 남긴다 — 고치기 전/후로 같은 호출의 `learning_state` 블록을 찍어 rule_id가 null에서 R3-wrong-misconception으로 바뀌는 것을 보인다(\"작동한 비율\" 원칙 — 규칙이 실제로 돌았다는 신호)."
artifacts:
  - "PR #1218 (https://github.com/kiki-s-broom/WhyMath/pull/1218) · CI 전건 green(success 9 · skipped 9 · failure 0 · 커밋 6f56e970). 커밋 구성: 67c741fd 구현 · d13085bf 테스트 정리 회귀 수정 · 6f56e970 OPS-85 등재.\n\nacceptance 이행: ① 기본 학습자(전이 이력 없음)의 오답이 rule_id=R3-wrong-misconception · next_action=REMEDIATE_MISCONCEPTION · rejected_transition=null에 도달 — 실 PG 전후 실측 ② 축 (가) 채택: 전이표의 NEW→ASSESSING 금지는 유지하고 ensure_learning_context가 학습 진입 전이 1건을 적재해 NEW→LEARNING→ASSESSING으로 경유. (나)는 EOS-105가 근거와 함께 닫은 축이라 배제, (다)는 학습 생애주기를 클라에 내리는 것이라 배제 ③ 집행 지점 = advance_on_attempt의 ⓪단계이며 서빙 도달은 api/me.py submit_attempt. POST /v1/me/attempts 1회로 원장 3행 생성 실증 + 집행 지점 제거 뮤테이션(M2)이 RED ④ Week3 게이트의 strict xfail이 XPASS로 빨강이 된 것을 확인한 뒤 표식 제거 ⑤ rule_id가 null에서 R3-wrong-misconception으로 바뀌는 전후 블록 기록.\n\n검증: 회귀 주입 9종 전건 RED(주입 실재·바이트 동일 원복 단언) · 전체 백엔드 스위트 14089 passed · 통합(실 PG) 334 passed · mypy --strict 696파일 · lint-imports 4 kept 0 broken · tests/infra 1546 passed.\n\n부수 발견: R1(정답+높은 확신)으로 ADVANCING에 올라간 학습자의 다음 응답이 전건 거부되던 결함도 같은 함수가 해소. 잔여 취약점(통합 테스트 수기 삭제 목록 드리프트)은 OPS-85로 분리 등재."
