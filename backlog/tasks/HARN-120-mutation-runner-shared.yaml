acceptance:
  - "① `scripts/harness/mutate.py <spec.yaml>` — 뮤테이션 명세(대상 파일·앵커 문자열·치환·기대 RED 테스트 선택자) 목록을 받아 건마다 (a) 앵커 정확히 1건 존재 단언 (b) `mutated != original` 단언 (c) 지정 테스트 실행 → RED 확인 (d) 바이트 동일 원복 단언(sha256)을 수행하고 건별 표(주입됨/RED/원복)를 낸다. 하나라도 단언 실패면 exit 1이며 **\"N passed\"를 검출로 오독할 수 없게** 원복 전 실패도 별도 열로 표기한다."
  - "② 픽스처 접촉 축 — 옵션 `--touch`가 뮤테이션 대상 줄이 RED 테스트 실행 중 실제로 실행됐는지를 coverage(line hit)로 확인해 \"주입은 됐고 가드도 멀쩡한데 픽스처가 그 절을 안 밟은\" 상태를 별도 상태(UNTOUCHED)로 분류한다. UNTOUCHED가 1건이라도 있으면 exit 1."
  - "③ 이관·자기검증 — 뮤테이션 하네스가 인라인(bash heredoc·임시 스크립트)으로 존재하는 기존 파일 중 상위 10건(`grep -rlE \"뮤테이션|mutation\" tests scripts` 101파일에서 선정 근거 병기)을 spec.yaml로 이관. CI `harness-integrity` 잡에 러너 자기검증 1스텝(러너 자신의 단언 4종을 각각 깨뜨린 픽스처 → RED) 배선을 `tests/infra/test_test_suite_wiring.py`가 동결."
  - "④ 집행 지점(정본화 ①~③과 별항) — 러너가 존재하는 것과 쓰이는 것은 다르다. 신규 가드(tests/infra·tests/harness에 추가되는 회귀 테스트, scripts/*의 게이트 CLI)에 대응하는 mutations/*.yaml 명세가 없으면 CI `harness-integrity` 잡이 \"미검증 가드\"로 계상한다(1단계 warn·측정 후 block 승격은 HARN-122 절차). 그 배선을 `tests/infra/test_test_suite_wiring.py`가 동결하고, 뮤테이션으로 \"명세 없는 신규 가드 1건 주입 → 계상 1건\"을 실증한다. (2026-09-20 반박 검증 지적 — 보고서 §3 B ⑤가 약속한 강제 지점이 acceptance에 없었다)"
