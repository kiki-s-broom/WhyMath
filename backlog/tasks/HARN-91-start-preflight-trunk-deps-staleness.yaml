# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-91-start-preflight-trunk-deps-staleness
title: start의 착수 자격 판정이 로컬 사본 기준이라 트렁크에 새로 착지한 의존·게이트를 못 본다
