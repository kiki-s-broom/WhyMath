notes: "출처: MP-03 착수 분석 2026-09-25(판정 기준 main f5db0e68) — golden_promotion_gate ③단(review_status 백필 각인)을 채울 수 있는 유일한 도구가 코퍼스 단위·감사 라벨 근거라 사람 판정 이벤트를 읽지 않고, 축적 회차 코퍼스는 KNOWN_CORPORA 밖이라 대상조차 아니다. 따라서 사람이 승인한 수용 문항은 검수 건수와 무관하게 review_status_not_backfilled로 영구 차단된다. EOS-64 ③(P0)이 규정한 경로 중 판정기만 착지하고 ②→③ 집행 도구가 빠진 상태다. eos_priority는 P0 예산(One In One Out) 때문에 P1로 등재 — P0 승격은 Kiki 판단(amend --eos-priority). 검수 도구의 verdicts 파일({slug, review_status})을 게이트 --backfill-audit에 그대로 넣는 우회는 ②단과 ③단을 같은 증거로 이중 계상하는 위장이라 채택하지 않는다."
