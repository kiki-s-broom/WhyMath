acceptance:
  - "① 각인 CLI — 검수 판정 이벤트(ReviewTimerEvent finished + verdict)를 근거로 축적 회차 코퍼스 JSONL의 review_status를 slug별로 각인하고, 감사로그 JSONL(slug·review_status·근거 이벤트 id·검수자·검수 시각)을 남긴다. verdict→review_status 변환은 schema/review_timer.review_status_for_verdict 단일 정본을 쓴다. 이미 채워진 review_status는 덮어쓰지 않고(수동 재검수 보호 — 기존 백필 바이트 계약과 동형) 판정 없는 slug는 건드리지 않는다. 입력 손상 1행이면 쓰지 않는다(exit 2)."
  - "② 게이트 관통 — 축적 CLI 산출 → 검수 이벤트 → 각인 → golden_promotion_gate(--backfill-audit에 이 감사로그)까지 E2E 테스트로 ③단 통과를 실측한다. 음성 대조: 반려·미판정·손각인(감사로그 없음)·각인 후 손편집(감사값≠코퍼스값)은 여전히 차단된다."
  - "③ ④단 분모 의미 판정 — 반려 제안이 1건이라도 있으면 ②단에서 경로 밖이므로 통과 경로의 결함 수는 항상 0이다(docs/reviews/mp03_canary_threshold_and_promotion_path_2026-09-25.md §4.3). 의도가 '사람이 개별 검증한 문항의 표본 하한'이면 docstring·리포트 문언을, '생성 배치 품질'이면 분모(검수 배치 전체 반려율)를 고친다 — 어느 쪽인지 판정 문서로 남기고 테스트로 동결한다."
  - "④ 기존 코퍼스 단위 백필(problem_corpus_review_status_backfill · KNOWN_CORPORA 7종 · 감사 라벨 n≥200)과의 관계를 계약으로 명문화한다 — 같은 review_status 축을 두 도구가 쓰므로 적용 대상(고정 코퍼스 vs 회차 코퍼스)과 충돌 규칙(이미 채워진 값 불가침)을 한 곳에 적고 CI 드리프트 가드(--all --check)가 회차 코퍼스를 오판하지 않음을 확인한다."
