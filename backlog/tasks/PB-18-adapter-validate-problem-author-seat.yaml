  - "① 배경(PB-15 후속): l4/subject_adapter_math.py의 validate_problem은 ProblemVerifyInput을 만들 때 authored_by를 넘기지 않아 기본값 unknown(UNRECORDED_AUTHOR)이 들어간다. 중립 봉투 ProblemStatement에 저작 서명 좌석이 없기 때문이다. 현재 프로덕션 어댑터는 Verifier()를 cross_verifier 없이 만들어 이 값이 CrossVerifier.verify까지 도달하지 않지만, S4-56이 교차검증기를 어댑터에 주입하는 순간 PB-15의 fail-closed 가드가 모든 호출을 IndependenceError로 거부한다(의도된 동작이나 배선이 없으면 사용 불가).\n② 처분: ProblemStatement에 선택적 저작 서명 좌석을 추가하고 어댑터가 이를 ProblemVerifyInput.authored_by로 전달한다. 서명이 없는 호출은 지어내지 않고 기존처럼 unknown으로 둔다.\n③ 집행 지점: S4-56이 교차검증기를 주입하기 전에 이 좌석이 닿아 있는지 확인하는 계약 테스트(저작 서명이 있는 문항은 통과·없는 문항은 거부)."
