acceptance:
  - "① 1겹 규칙 문장 전환(금지형 → 대체형) — CLAUDE.md의 채팅 펜스 규칙을 \"쓰지 마라\"에서 \"대신 이렇게 하라\"로 고친다. 세 번의 실패 지점마다 대체 형식을 하나씩 지정한다: 커밋 해시·식별자는 **인라인 백틱**, 명령 실행 결과는 **요약 문장 + 인용문**, 구조체(JSON 등)는 **필드명: 값 산문 나열**. 관찰 근거: 3회 전부 \"결과가 이렇게 보입니다\"를 보여주려는 순간이었고, 금지만 있으면 그 순간 쓸 대안이 없어 습관(펜스)으로 돌아간다.\n② 규칙 본문의 틀린 전제 정정 — \"채팅 축은 이 규칙이 유일한 방어선\"은 **사실이 아니다**. Stop 훅이 `transcript_path`로 그 세션의 대화 기록을 읽을 수 있고, 이 저장소는 이미 Stop 훅(`backlog.py check-stop`)을 운영 중이다. 그 문장을 지우고 기계 집행 소유자를 이 태스크로 적는다.\n③ 2겹 UserPromptSubmit 상기 — 대화가 길어질수록 CLAUDE.md의 영향력이 약해진다(3회차 전부 장시간 세션의 후반이었다). `UserPromptSubmit` 훅이 매 턴 대체 형식 한 줄을 주입한다.\n④ 3겹 Stop 훅 탐지 — 마지막 답변에서 위반 펜스를 찾아 exit 2로 종료를 막고 재작성을 요구하며, `.claude/logs/fence_violations.jsonl`에 건수를 남긴다(측정 지표). `stop_hook_active`로 무한 반복을 막는다.\n⑤ **탐지 기준은 \"펜스 유무\"가 아니라 \"실행 의도 태그\"다**(세션이 제안 설계에서 정정한 축) — 규칙 본문이 \"펜스는 실행용 *전용*\"이라고 하므로 실행 블록은 **허용 대상**이다. `^```` 전건을 잡으면 Kiki께 드리는 런북 실행 블록이 전부 막혀 핵심 워크플로가 깨진다. 허용 = 실행 언어 태그(powershell·bash·sh·cmd 등)가 붙은 펜스. 위반 = 태그 없는 펜스 + 비실행 태그(json·text·yaml 등). 3회 위반 전부 태그 없는 펜스였다.\n⑥ 변별력 — 설치 후 **일부러 위반 펜스를 한 번 써서 훅이 실제로 잡는지** 확인한다(transcript 구조는 Claude Code 버전에 따라 바뀔 수 있으므로 형태 가정을 실측으로 검증한다). 대조군: 실행 태그 펜스가 **통과**하는지도 같은 방식으로 확인한다 — 대조군이 없으면 \"전건 차단\"이라는 과잉 수정이 통과한다. 훅이 transcript를 못 읽는 경우 **작업을 막지 않고 통과**시킨다(관측 실패가 작업 실패가 되면 안 된다).\n⑦ 오탐 탈출구 — Kiki가 명시적으로 코드를 요청한 턴은 통과시킨다(사용자 메시지의 마커 검사). 탈출구 사용은 로그에 남긴다 — 남지 않는 탈출구는 게이트를 끄는 것과 같다.\n⑧ 완료 기준(측정) — 설치 후 **2주간 `fence_violations.jsonl`의 `retry:false` 위반 0건**. retry:true(재작성으로 교정된 건)는 위반으로 세지 않되 별도 집계해 \"탐지기가 실제로 일하고 있다\"의 증거로 쓴다. 2주 동안 retry 기록이 0건이면 그것은 \"위반이 없었다\"가 아니라 **\"탐지기가 안 돌고 있다\"일 수 있으므로**, ⑥의 주입 확인을 만료 시점에 한 번 더 한다.\n⑨ 한계 명시 — 이것은 예방이 아니라 **탐지 + 강제 재작성 + 기록**이다. 이미 화면에 나간 답변은 지울 수 없어 위반 답이 한 번 보인 뒤 수정본이 이어진다. 예방은 ①②가, 안전망은 ③④가 맡는 구조임을 규칙 본문에 적는다."
