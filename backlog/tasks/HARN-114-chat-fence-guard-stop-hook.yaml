notes: "사고 경위: CLAUDE.md 「실행용 블록과 증거 블록의 분리」(2026-08-31 신설 · 2026-09-10 v0.2.20 확장)가 **3회 뚫렸다**. 1회차 HARN-38(증거 인용이 복사-실행돼 CommandNotFound 2건) · 2회차 OPS-72(커밋 해시+메시지 줄과 명령+결과 주석을 펜스에 담아 ParserError 1건 + fatal 2건) · 3회차 2026-09-18 이 세션(저작 요약 예상 JSON을 펜스에 담아 ParserError). 셋 다 읽기 전용이라 피해 0이지만 파괴적 명령이었다면 달랐다.\\n\\n세션이 처음에 '채팅 축은 코드가 닿지 않으니 태스크 등재는 알리바이'라고 판단했는데 **그 전제가 틀렸다** — Kiki 지적으로 정정. Stop 훅은 transcript_path로 대화 기록을 읽을 수 있고, 이 저장소는 이미 Stop 훅(backlog.py check-stop)·SessionStart·PostToolUse를 운영 중이다(실측). 즉 측정 가능한 게이트를 만들 수 있으므로 CLAUDE.md '동일 유형 텍스트 규칙 2회 실패 후 코드 착지' 선례가 그대로 적용된다.\\n\\n세션이 제안 설계에서 정정한 축(acceptance ⑤): 탐지 기준을 '펜스 유무'로 잡으면 Kiki께 드리는 런북 실행 블록이 전부 막힌다 — 규칙 본문이 '펜스는 실행용 전용'이라 실행 블록은 허용 대상이다. 실행 언어 태그 유무로 갈라야 하며, 3회 위반은 전부 태그 없는 펜스였다.\\n\\n실패 지점의 공통 형태(세션 관찰): 세 번 다 '결과가 이렇게 보입니다'를 보여주려던 순간이다. 그래서 금지형이 아니라 대체형 규칙이 필요하다.\n\n[차단 2026-09-19] 2주 측정 창 대기 — 작업이 아니라 경과 대기다. 3겹 방어 코드·배선은 main 978d7505(PR #1208)에 착지했고, acceptance ⑧의 완료 기준이 \"설치 후 2주간 retry:false 위반 0건\"이라 그 전에는 done으로 칠 수 없다. 만료(2026-10-02경) 시점 할 일 둘: ① .claude/logs/fence_violations.jsonl에서 retry:false 건수 확인 ② 탐지기 생존 주입 확인(무태그 펜스 transcript로 exit 2가 나는지) — 2주간 기록 0건은 \"위반이 없었다\"일 수도 \"탐지기가 안 돈다\"일 수도 있어 ①만으로는 변별력이 없다. --handover인 이유: 2주 홀드는 stale claim이 되고, 만료 시점 측정은 어느 세션이든 할 수 있다."
