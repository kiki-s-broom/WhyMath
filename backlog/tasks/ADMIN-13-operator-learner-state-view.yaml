  - "① 운영자의 타 학생 학습 상태 조회 축 — 계획서 §22 P2 \"관리자 관찰 기능\". 운영자가 **특정 학생**의 숙달·오개념·진단 상태를 보는 표면이다.\n② 현행 부재의 정확한 형태 — `/v1/admin/*` 라우터가 **0건**(`grep -rn \"v1/admin\" api/ app.py` = 0). 유일한 운영자 게이트 학습 표면 `GET /v1/me/harness-metrics`(`api/me.py:3304-3311`, `RequireContentAdmin`)는 docstring이 \"**본인 스코핑 유지 · 코호트 전체 조회는 admin auth 범위 밖 · user_id는 인증에서 주입**\"을 명시해 **self-scoped**다. `RequireContentAdmin` 소비처 6곳은 전부 콘텐츠 CUD다.\n③ 인접 태스크와의 경계 — ADMIN-05(todo·read-only BFF)의 acceptance '사용자 조회'는 **계정 조회**이지 학습 상태 조회로 특정돼 있지 않다. 이 태스크는 그 구분을 acceptance에 명시하고, ADMIN-05 착수 세션과 표면을 조율한다(중복 라우터 금지).\n④ 미성년 PII 경계가 이 태스크의 본체다 — 학생 학습 상태는 민감 정보다. 반드시 ①조회 감사 로그(누가·언제·누구를) ②PII 마스킹 기준 ③권한 등급(콘텐츠 admin ≠ 학생 데이터 admin)을 함께 설계한다. `docs/standards/security_privacy.md`가 정본이며, 권한 등급 분리 없이 기존 `RequireContentAdmin`을 재사용하면 **콘텐츠 검수자가 전교생 학습 이력을 보게 된다**.\n⑤ 교사·부모 노출은 범위 밖 — COLLAB-03 acceptance ⑦이 명시 제외했다. 이 태스크는 **내부 운영자**만 다룬다.\n⑥ 법령 경계 — 미성년자 개인정보의 분석·마케팅 외부 공유 금지(CLAUDE.md). 이 표면의 데이터가 외부로 나가는 경로가 없음을 확인한다."
