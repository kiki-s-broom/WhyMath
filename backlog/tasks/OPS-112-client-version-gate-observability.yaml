acceptance:
  - "① 426 차단을 요청 회계 안으로 — 현행 app.py의 버전 게이트 미들웨어는 미달 시 started=time.monotonic() 이전에 early-return하므로 차단된 요청이 요청 수·에러율·p95 어디에도 계상되지 않는다. 차단도 관측 대상이 되게 한다(전용 blocked 카운터 신설 또는 _observe_request 경유 — 착수 세션이 택일하되 '차단이 사라지지 않는다'가 계약)."
  - "② 3상태를 읽을 수 있게 — app.state.app_version_unknown_count는 프로덕션 리더가 0이다(테스트 어서션뿐). /health/ready body에 client_version 블록을 추가해 정상/미달(blocked)/미상(unknown)을 서로 다른 값으로 노출한다. 기존 ocr·solution_segmentation 좌석 관용구를 답습하고 새 엔드포인트를 만들지 않는다."
  - "③ 클라 426 판정을 단일 좌석으로 — 현재 diagnosis_controller.dart만 전용 문구를 내고 chat·auth·ocr·onboarding·me_tab·account_security 6개 컨트롤러는 generic catch라 차단이 '일반 실패'로 위장된다. api_client.dart의 Dio 인터셉터 1곳(auth_refresh_interceptor 선례)에서 판정해 앱 전역이 같은 문구를 내게 한다. diagnosis_controller의 기존 분기는 유지·정합(중복 처리 금지)."
  - "④ 임계 상향 트리거 명문화 — min_app_version 기본 0.0.0(게이트 비활성)은 유지한다(fail-open이 옳다). 대신 '언제·누가 올리는가'를 문서에 적는다: ②의 미상 계상이 실제로 관측 가능해지고 미상 비율이 충분히 낮음이 확인된 뒤 Kiki가 올린다. 트리거 없는 영구 무력 상태를 남기지 않는 것이 목적."
  - "⑤ 변별력 실측(양방향·3상태 분리) — 헤더 없는 요청 1건 → unknown +1, 임계 상향 후 구버전 요청 1건 → blocked +1, 임계 하향 → 정상 복귀. 세 값이 서로 다른 값으로 나와야 하며 같은 값이면 검증 실패다. 판정은 exit code로 한다."
  - "⑥ 범위 밖 동결 — 강제 업데이트 유도 UI·스토어 링크·자동 업데이트·릴리스노트·롤백·Canary/Blue-Green·Crash 수집·서명·스토어 업로드(MGMT-02 blocked 선행 미충족)."
  - "⑦ 확인 범위 — 백엔드 소스·테스트를 건드리므로 전체 스위트와 ci_mirror 전 잡 기준으로 확인한다. 모바일 파일을 바꾸면 mobile 잡(Flutter)이 닿으므로 그 환경에서 돌린 결과를 근거로 삼고, 못 돌렸으면 'CI가 판정'으로 명시한다."
