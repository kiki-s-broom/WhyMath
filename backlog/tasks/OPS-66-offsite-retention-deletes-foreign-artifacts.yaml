notes: "출처: G-backup-offsite-move clear evidence(2026-09-06 · #1009) 말미의 승계 미해결 3건 중 ③ — '목적지에 타 도구 산출물 혼재(whymath_db_*.dump.age·whymath_git_*.bundle)로 Step 9 보존이 그것까지 지울 수 있다 — Kiki 확인 대기'. 등재 시 코드 실측으로 범위를 좁혔다: .bundle은 필터에 안 걸리므로 실제 위험은 *.dump.age 공존분뿐이다(evidence 문면은 둘 다 위험한 것처럼 읽힌다).\\n\\n성격: 이것은 관측 갭이 아니라 **데이터 파괴 위험**이다. Step 9는 보존 삭제 실패를 Fail로 다루지만(PIPA 노출 방지) 그 엄격함이 반대로 남의 파일을 지우는 쪽으로 작동한다 — 삭제는 되돌릴 수 없고 클라우드 휴지통도 30일 뒤 비워진다.\\n\\n등재 이유: 2,011자 evidence 말미의 승계 3건 중 ①만 OPS-64로 소유자가 있었고 ②③은 없었다(Kiki 지시로 2026-09-06 등재). 인접: OPS-64(미러 실패가 감시에 안 보임)와 같은 Step 9 축이나 문제가 다르다 — 그쪽은 실패가 안 보이는 것, 이쪽은 성공이 남의 것을 지우는 것. 같은 파일을 건드리므로 착수 시 조율한다.\n\n[정정 2026-09-07] 2026-09-07 재검토 — 등재 시 acceptance ④가 평문 축을 '오탐할 수 있다'로 약하게 적었으나 실측상 하드 실패다. 위험이 한 방향이 아니라 두 방향임을 명시한다."
