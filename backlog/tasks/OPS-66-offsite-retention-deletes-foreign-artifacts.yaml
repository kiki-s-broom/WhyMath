acceptance:
  - "① 실측 확인: backup_whymath_pg.ps1 Step 9의 보존 대상 선정이 $offsiteDumps = Get-ChildItem $OffsiteDir | Where-Object { $_.Name -like '*.dump.age' } 이다(:332). 목적지 폴더에 공존하는 타 도구 산출물 whymath_db_*.dump.age가 이 필터에 걸리고, 최신 1건을 제외한 만료분이 Remove-Item 대상이 된다(:333-334). whymath_git_*.bundle은 확장자가 달라 걸리지 않는다 — 위험 범위는 *.dump.age 공존분으로 한정된다."
  - "② 소유 산출물만 지우도록 좁힌다 — 이 스크립트가 만든 파일만 보존 대상으로 삼는다(파일명 접두 whymath_<타임스탬프> 형태 대조 또는 이 실행이 복사한 목록 기준). '내가 안 만든 파일은 건드리지 않는다'가 계약이다. 넓힌 필터가 만료분을 확실히 지우는 것보다, 남의 백업을 안 지우는 것이 우선한다."
  - "③ 변별력(결함 주입 필수): 목적지에 타 도구 산출물을 흉내 낸 파일(예 whymath_db_20260101_000000.dump.age · LastWriteTime을 보존창 밖으로)을 놓고 현행 코드가 그것을 삭제하는지 RED로 확인한 뒤 수정한다. 정상 입력에서 초록인 것은 보호의 증거가 아니다(CLAUDE.md 2026-09-01) — 수정 후에는 ⓐ타 도구 파일이 남고 ⓑ자기 만료분은 여전히 지워지는지 두 방향을 모두 단언한다."
  - "④ 목적지 공유 자체의 판정을 런북에 적는다 — 백업 목적지를 타 도구와 공유해도 되는가. 공유를 허용하면 이 필터 문제 외에 §4-1b 자가검증 2(평문 *.dump 부재 검사)도 남의 평문 파일에 오탐할 수 있다. 전용 하위 폴더 분리가 더 단순한 해법이면 그쪽을 택하고 그 판단 근거를 적는다."
  - "⑤ [2026-09-07 재검토 정정] 목적지 공유의 위험은 **두 방향**이다. 등재 시 ④는 평문 검사가 '오탐할 수 있다'고 적었으나 실측은 더 세다 — backup_whymath_pg.ps1:342-344는 목적지에 *.dump가 1건이라도 있으면 Fail(=:59-62 exit 1)이고, 이 검사는 우리 회차의 성공 여부와 무관하게 -OffsiteDir가 걸린 매 회차 실행된다. 즉 타 도구가 목적지에 평문 .dump를 두면 **우리 백업이 매일 exit 1로 끝난다**(로컬 산출물은 남지만 무인 스케줄의 LastTaskResult가 계속 비0). 게다가 그 메시지는 운영자에게 '그 파일을 지우고 클라우드 휴지통도 비우라'고 지시한다 — 남의 파일을 지우게 만드는 두 번째 경로다. 요약: ⓐ보존 삭제(:332)는 **남의 것을 지운다** ⓑ평문 검사(:342)는 **우리 백업을 멈춘다**. 해법(전용 하위 폴더 분리 vs 소유 필터 좁히기)은 두 축을 모두 닫아야 한다."
