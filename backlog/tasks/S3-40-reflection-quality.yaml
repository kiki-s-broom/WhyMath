  - "① 회수: 원 커밋 edd0ab3(원 S3-22)의 l4/completion.py 완료 인정 발화 정직화를 이식한다. 종전 발화는 \"좋아, 근거가 분명하네. 스스로 풀어내고 왜 그런지까지 설명했어 — 다음 문제로 가보자!\"인데, 돌아보기 응답은 검증되지 않으므로(rubber-stamp MVP) 이 발화는 검증되지 않은 것을 단언한다. 2026-07-22 실기기에서 학생이 엉뚱한 근거를 내도 그대로 칭찬된 것이 확인됐다. 정직화 발화는 \"좋아, 여기까지 스스로 풀어냈어 — 다음 문제로 가보자!\" — 완료는 정답에서만 나므로 참이고, 설명의 분명함은 주장하지 않는다.\n② 범위 명시: 이것은 응답 품질 검증 로직의 신설이 아니다. 원본은 검증을 붙이는 대신 발화가 검증되지 않은 것을 주장하지 않게 고쳤다(허위 주장 제거 우선). LLM 근거 검증·재유도는 별도 후속 옵션이며 이 태스크의 acceptance가 아니다. 종전 등재본(섀도 S3-40)의 \"응답의 질 검증 로직을 재설계한다\"는 원 스코프의 오해였다.\n③ 회귀 동결: 발화 상수가 검증되지 않은 품질을 다시 주장하면 실패하는 테스트를 둔다 — 상수 문자열 대조가 아니라 금지 주장 어구(근거가 분명·설명했어 등 응답 품질 단언)의 부재를 검사해, 표기를 바꾼 재유입도 잡히게 한다. 결함주입으로 RED를 확인한다.\n④ 검증: 백엔드 전체 pytest 스위트를 경로 인자 없이 실행해 green을 확인한다(부분 스위트 통과를 전체 통과의 근거로 쓰지 않는다). 돌리지 못하면 그 사실을 명시한다.\n⑤ 정서 안전: 정직화한 발화가 부정 강화가 아닌지 확인한다 — 칭찬을 빼는 것이지 지적을 넣는 것이 아니다(CLAUDE.md 금기: 부정적 피드백의 정서적 강화 금지)."
