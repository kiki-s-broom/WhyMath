  - "① 계측 — 상태 머신이 `R3-wrong-misconception`을 낸 응답 직후 같은 개념의 다음 채점 응답 정답률과, `R6-wrong-undiagnosed` 직후 같은 개념 다음 응답 정답률을 학습 상태 원장(전이 기록)과 `problem_attempt`에서 산출하는 읽기 전용 리포트를 만든다. 분모·분자·표본 수를 함께 낸다(분모 0이면 미측정으로 표기하고 0으로 접지 않는다).\n② 판정 — R3 직후 재오답률이 R6 직후보다 높은지를 Wilson 단측 경계로 CLI exit 0/1 판정한다(점추정 판정 금지). 표본 하한 미달이면 exit 0이 아니라 '측정 불가' 상태를 따로 낸다.\n③ 반증 시 처분 — R3 쪽이 유의하게 나쁘면 EOS-138 판정문의 G4·G5 전제가 반증된 것이다. 그 경우 R3 > R4 순서 또는 R3 하한(0.7)을 재판정하는 태스크를 등재한다.\n④ 변별력 — 합성 원장 픽스처 3종(R3가 나쁨·같음·좋음)에서 판정이 각각 1/0/0으로 갈리는지 단언하고, 판정 비교 연산자 뮤테이션이 RED인지 확인한다."
