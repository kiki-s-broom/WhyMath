acceptance:
  - "① 실측 확정 — 채점 경로(POST /v1/me/attempts)는 *정답* 회차에 오개념 감쇠 시계를 돌리지 않는다. _scan_attempt_misconceptions가 correct=True에서 NOT_RUN을 돌려주고(api/me.py:745-746), 호출부가 그 값으로 apply_candidates를 건너뛴다(api/me.py:1110). 그 결과 \"교정 문항을 맞혔다\" 자체는 misconception confidence를 1도 내리지 못한다. 2026-09-19 EOS-122 페르소나 C 여정에서 실측: 오개념 미관측 *오답* 회차는 0.85 → 0.74로 내렸고, 바로 뒤 *정답* 회차는 0.74 → 0.74로 무변화였다.\n\n② 비대칭이 문제의 핵심이다 — 같은 반증을 코치 경로는 이미 반영한다. api/coach.py:1895-1959의 _log_refutation_evidence가 clean verify + 무매치일 때 −1 증거를 적재하고, 다음 턴의 curate_hypothesis가 net_support<0을 보고 archived 처리한다. 즉 \"학생이 그 오개념을 쓰지 않고 맞혔다\"는 신호가 대화에서는 반증인데 채점에서는 무신호다. 두 쓰기 경로가 같은 학습자 상태를 서로 다른 규칙으로 갱신한다.\n\n③ 현행 설계의 자인 주석을 먼저 읽을 것 — api/me.py:1106-1109는 \"훑지 않은 회차(정답·답안 없음)에 부르면 관측하지도 않은 것을 근거로 신뢰를 깎는 셈이라 부르지 않는다\"고 적는다. 이 판단은 *답안 없음*에 대해서는 옳다. 쟁점은 *정답이면서 답안이 있는* 회차다 — 그 회차는 관측이 없는 것이 아니라 반증이 있는 것이다. 따라서 이 태스크는 NOT_RUN 게이트를 통째로 여는 것이 아니라 그 한 갈래만 분리하는 축이다.\n\n④ 교수학 판정이 선행이다(코드보다 먼저) — 교정 문항 정답을 오개념 해소 증거로 셀 것인가, 센다면 반증 가중을 코치 경로의 _REFUTE_WEIGHT(0.5)·_REFUTE_STRONG_WEIGHT(1.0)와 어떻게 맞출 것인가. 문항이 그 오개념을 겨냥했는지 여부(targeted 여부)를 알아야 가중이 정해지는데, 현재 attempts 요청에는 그 정보가 없다. 범위에 포함할지 별건으로 뺄지 함께 판정한다.\n\n⑤ 집행 지점 별항(정본화≠집행) — 계약을 바꾸는 것으로 끝내지 말고 서빙 경로가 그 계약을 실제로 경유하는지 확인한다. 그리고 tests/backend/api/test_e2e_persona_journeys.py의 Persona C ⑥단계가 현행 무변화를 동결하고 있으므로, 해소 시 그 단언을 감소 단언으로 승격해야 한다(실패 메시지가 이 태스크 id를 지목한다).\n\n⑥ 범위 밖 명문 — 코치 경로의 반증 로직 자체는 건드리지 않는다. BKT/DKT 교체·오개념 카탈로그 확장도 범위 밖이다."
