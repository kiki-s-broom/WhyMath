notes: "출처: 2026-09-28 PR #1352 머지 대기 중 실측(판정 기준 main e674f6d7).\n\n[실측] 격리 사본에서 gates.yaml의 G-eos129-prod-response-distribution 블록을 한 번 더 붙여 넣고 validate를 돌렸다 — '백로그 무결성 green · 게이트 87건' exit 0. 중복이 한 건으로 접혀 보고됐다.\n\n[계기] PR #1352(main 머지)와 PR #1358(미머지)이 같은 게이트 ID G-eos129-prod-response-distribution을 서로 다른 정의(title·depends_on)로 따로 추가했다. 두 PR이 같은 자리에 삽입해 git 충돌은 나지만, 충돌을 '둘 다 유지'로 풀면 validate가 통과시키고 뒤 정의가 이긴다. 병렬 중복의 원인 축은 HARN-186(미머지 · 게이트 부착 후 claim 반납 공백)이다. 같은 ⑤에 세 번째 게이트 G-eos129-item-response-census(PR #1346 · 미머지)도 있다 — 이름이 달라 이 검사로는 잡히지 않는 의미 중복이며 HARN-186·187 소관이다.\n\n[정정 2026-09-29] ③ 교차 브랜치 판정 결과 기록 — 시뮬레이션 실측·흡수 여부 결론(HARN-192 acceptance ③ 이행)"
