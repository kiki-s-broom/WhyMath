title: "게이트 ID 중복을 validate가 잡지 않는다 — 같은 ID 블록 두 개면 뒤 정의가 앞 정의를 조용히 덮어쓴다(실측 exit 0) · PR #1352·#1358이 같은 게이트 ID를 따로 추가"
