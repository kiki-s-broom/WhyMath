acceptance:
  - "① 실측 고정(2026-09-29 · 판정 기준 `HARN-173-done-mirror-absence-promotion`의 구현): `done`의 CI 미러 게이트(`ci_mirror_at_done: block`)는 `done`(완료 선언) 시점에만 선다. `/drive` 순서가 커밋 → PR(푸시) → `done`이라 게이트는 미검증 완료 선언을 막지만 **red 푸시 자체는 막지 못한다**. EOS-24 · PR #1316에서 PR CI가 red가 된 경로가 푸시였다 — 미러 결과 없이 푸시했고 신호가 `done`에서 한 번 떴을 뿐이다. 같은 축의 미이행이 하나 더 있다: PR 본문에 변경 파일이 닿는 CI 잡 목록을 싣는 일은 지금 사람 몫이다(`done`은 도달 잡을 stdout·이벤트로만 낸다)."
  - "② 설계 판정(구현 시작 전 판정문 1건): 후보를 비용과 함께 판정한다. ⓐ 푸시 직전 — PreToolUse Bash 훅이 `git push`를 잡아 미러 결과 커밋과 푸시 대상 HEAD가 다르면 고지(차단 아님). ⓑ PR 생성 직전 — `mcp__github__create_pull_request` 호출 전 훅이 같은 대조를 한다. ⓒ 종료 시점 — Stop 훅이 미푸시 커밋과 미러 결과를 대조한다. ⓓ 걸지 않는다. 오탐 비용을 반드시 센다: 대장만 바꾸는 푸시·claim 푸시·이미 재현한 뒤 병합만 하는 푸시가 전부 걸린다 — 코드 변경이 없는 푸시를 어떻게 가려내는가(트렁크 대비 변경 경로가 미러 대상 잡에 닿는가 = `ci_job_coverage scope`). 판정 근거는 `done` 이벤트의 측정 필드(`mirror_state` 분포·`--no-mirror` 사용률)를 최소 2주분 읽은 결과여야 하고, 그 데이터가 없으면 데이터가 없다고 판정문에 적는다. 고지가 소음이 돼 습관화되면 보호가 아니라 위장이라는 점(반복 관측되는 상시 경고)을 기준에 넣는다."
  - "③ 변별력: 픽스처 3종 — 미러 결과 없음 · 다른 커밋의 결과 · 같은 커밋의 결과(대조군은 고지 없음). 코드 없는 푸시(대장·문서만 바뀐 푸시)에서 고지가 나지 않는 대조군을 함께 둔다. 고지 절을 하나씩 제거하는 뮤테이션마다 RED여야 하고, 주입 적용과 바이트 동일 원복을 단언한다. PR 본문 도달 잡 목록은 `tests/backend/` 하위 `integration` 마커 파일 1개를 넣으면 `backend-migrations`가 목록에 나오고 문서만 바꾸면 나오지 않는 픽스처로 변별한다."
  - "④ 집행 지점(정본화와 별항): 고지가 실제로 서는 호출 경로(훅 등록·`settings.json` 배선)와 PR 본문 첨부가 불리는 경로를 배선 테스트로 동결한다. 함수가 존재한다는 것과 그 경로를 실제 도구 호출이 지난다는 것은 다르다. 훅 입력은 UTF-8 바이트로 해독한다(`tests/infra/test_hook_stdin_utf8.py`가 등록된 훅 전수를 검사한다)."
