# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: OPS-76-generated-inventory-conflict-blocks-ci
title: "생성 인벤토리 장부가 PR 충돌을 상시화하고, 충돌한 PR은 CI가 조용히 멈춘다"
