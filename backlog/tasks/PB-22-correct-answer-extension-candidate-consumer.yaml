  - "① 소비처 — 직전 정답 문항을 기준으로 problem_relation 의 심화(어려운 계열)를 후보로 우대하는 경로를 만든다. PB-19 결정(심화는 정답 직후 후보)의 집행 지점이다. 오답 기준 필터(sibling_filter)와 독립된 손잡이로 두고 기본값은 OFF 로 둔다.\n② 방향 — l2/next_problem_selection.py 의 classify_relations 가 이미 오답 문항 기준 harder 집합을 계산한다. 정답 문항에도 같은 분류를 재사용하고 새 방향 규약을 만들지 않는다.\n③ 집행 지점(정본화와 별항) — 새 손잡이가 CAT 와 수능 두 정책 모두에서 후보 쿼리·가중에 실제로 도달함을 테스트로 동결하고, 기본값 OFF 의 쿼리 0회 증가를 유지한다. 결함 주입으로 RED 를 확인한다.\n④ 스코프 밖 — 심화 행이 코퍼스에 들어오는 것은 PB-20 소관이다. 그 전에는 라이브 동작이 바뀌지 않아야 한다."
