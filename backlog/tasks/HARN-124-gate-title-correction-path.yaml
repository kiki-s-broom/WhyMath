notes: "발견 경위(2026-09-21 · HARN-96 종결 세션): 게이트 G-canonical-repo-residual-kiki-checks의 제목에 거짓 3건이 실려 있었다 — (a) \"GitHub API는 시크릿 이름 목록 조회를 제공하지 않는다(의도된 설계)\"(실제로는 해당 엔드포인트가 실재하며 이름을 반환한다) (b) 확인 대상 이름 DEPLOY_SSH_PATH(저장소 워크플로·코드 전수 0건 · 실제는 DEPLOY_PATH) (c) \"존재가 확인된 시크릿\"(확인된 적 없음 — 배포 호스트 미프로비저닝이라 그 5종은 등록된 적이 없고 그것이 정상 상태다).\n\n그 게이트는 이번에 clear됐으므로 evidence에 정정을 기록하는 것으로 수습됐다. 그러나 pending 상태에서 같은 일이 생기면 수습 경로가 없다 — 게이트 제목은 매 세션 SessionStart 브리핑에 그대로 노출되고, 그 제목이 Kiki께 드리는 실행 안내의 원본이 된다. 이번 건에서 (b)가 그대로 실행됐다면 없는 이름을 찾거나 틀린 이름으로 시크릿을 등록하는 결과였다.\n\n범위 확인(중복 아님): 태스크 title 정정은 HARN-57 축 5가 이미 열었고 그 태스크는 done이다(amend 옵션에 실재). 이 태스크가 다루는 것은 **게이트 대장 표면**이며, gates 서브커맨드에는 등재 후 문면을 고칠 경로가 전혀 없다(현행 옵션 title은 add 전용). acceptance 항 폐기 표시는 HARN-76이 소유하는 별개 축이다 — 착수 시 두 곳의 정정 관용어가 갈리지 않도록 그 설계를 함께 읽는다(차단 관계는 아니다).\n\n대책의 형태가 태스크인 이유: 2026-09-20 Kiki 지정 「새 산문 규칙 등재 동결」이 사고 대책을 코드·태스크로만 등재하도록 정했다. 이 사고의 교훈(부재 주장의 재확인은 검색 방법을 바꿔야 한다)은 MEMORY 2026-09-21 결정 로그에 남겼다.\n\n[정정 2026-09-22] HARN-160-gate-remind-reschedule-path(등재 시 HARN-133 → HARN-135 → HARN-160, 번호 충돌 3회로 개명) 중복 취소분 편입 — remind_after_days·독촉 기준일 축을 이 태스크가 소유한다. 근거: 같은 서브커맨드(gates)에 정정 경로를 여는 설계를 이 태스크 acceptance ①이 이미 확정했고, 두 태스크가 각각 경로를 열면 2026-09-08 HARN-88 형태의 중복이 된다. 계기: 2026-09-22 WEB-01 착지 중 등재한 G-web01-landing-legal-review의 독촉일(2026-10-22)이 Kiki의 12/31 내부 앱 완성 방침으로 실제 판정 시점(2027-01 초)과 벌어졌는데, 고칠 CLI가 없어 대책을 태스크로 넘겼다(거부의 우회 금지 ③ 설계 공백).\n\n[정정 2026-09-22] notes 치환 — 번호 참조 정정 — notes의 'HARN-133 중복 취소분'이 이제 다른 세션의 HARN-133-rename-bare-number-backreference-scan(main 266c3d55)을 가리켜 결정 불가가 됐다. 내가 취소한 레코드는 HARN-135-gate-remind-reschedule-path로 개명됐으므로 전체 ID로 명시한다. rename CLI가 '문서 참조는 옮기지 않았다'고 고지한 범위를 손으로 닫는 작업이다.\n\n[정정 2026-09-22] notes 치환 — 번호 참조 정정 2회차 — HARN-135-gate-remind-reschedule-path는 3회차 충돌로 HARN-160-gate-remind-reschedule-path로 개명됐다. 옛 전체 ID는 이제 어느 파일도 가리키지 않는 끊어진 참조이므로 현행 ID로 바꾼다. rename CLI가 '문서·대장의 번호 참조는 옮기지 않는다'고 고지한 범위를 손으로 닫는 작업이며, 같은 이유로 한 번(HARN-133 → HARN-135) 이미 수행했다.\n\n[acceptance 7 전수 재측정 — 2026-09-22 실측] pending 게이트 21건 전건을 독촉일과 실제 판정 시점으로 대조했다. 조정 7건 · 유지 14건이며, 전건 일괄 연장은 하지 않았다(그것은 독촉 자체를 끄는 것과 같다 — 조정한 7건은 각각 대장 안에 판정 시점의 근거가 있다).\n\n조정 7건 (괄호 = 옛값 → 새값 · 새 독촉일):\n (1) G-web01-landing-legal-review 30 → 105 · 2027-01-05 — acceptance 6이 지목한 그 건. Kiki 방침(12/31까지 내부 앱 완성, 변호사 검토는 그 이후)과 옛 독촉일 2026-10-22가 2개월 넘게 벌어져 있었다.\n (2) G-export-prediction-disclosure 30 → 128 · 2027-01-05 — 재측정에서 **추가로** 발견했다. MGMT-06 notes가 2026-09-07 Kiki 판정으로 이 자문을 MGMT-01/02와 같은 배치(공개 베타 준비 착수)로 묶어 보류한다고 명시하는데 옛 독촉일은 2026-09-29로 1주 뒤였다. 등재 당시 acceptance 7이 \"확인된 것은 web01 1건\"이라 적은 것은 그 시점 판정이며, 재측정이 2건으로 늘렸다.\n (3~6) G-p3-g1~g4 60 → 40/47/54/61 · 2026-11-01/08/15/22 — 제목이 명시한 판정 상한과 독촉일(전부 2026-11-21)이 어긋나 있었다. G1~G3은 상한을 넘긴 뒤에야 경고가 뜨는 상태였다. 독촉을 상한 그 날에 맞춘다.\n (7) G-p3-entry-gate2-pass 40 → 14 · 2026-10-06 — Kiki 지시 1(가능한 한 앞당긴다) 반영. P3 태스크 14건 전부를 막는 단일 병목인데 첫 자동 환기가 Week 1 상한과 같은 날이었다.\n\n유지 14건의 근거: G-arch38-verdict-recheck(재확인 지점 2026-10-26 = 독촉일 일치) · G-required-tier-caller-recheck(G1 2026-09-27 일치) · G-arch56-availability-trigger · G-opus5-billing-path-prod-recheck · G-eos02-default-flip-recheck · G-not-now-v1-release-recheck · G-s302-free-use-remeasure-restart 는 각자 제목에 재확인 지점을 적고 있고 독촉일이 그것과 맞는다. G-eos-first-run-canary-review(독촉 초과 2일) · G-harn121-constitution-token-measure · G-kg02-review-promotion-llm-session · G-ruleset-bypass-actors-live-watch · G-s416-round2-live-battle · G-web01-required-check-register 는 **지금 사람이 실행할 수 있는** 대기 항목이라 독촉이 소음이 아니다 — 연장 대상이 아니다. G-s5-subject-expansion 은 remind 미설정(독촉 없음)이라 이 축에 해당하지 않는다.\n\n[변별력 실측 — acceptance 3/5] 첫 대조는 변별력이 0이었다. 오늘 등재한 게이트(remind 60d)의 제목을 고치고 브리핑 전후를 떴는데 \"동일\"이 나왔는데, report.overdue_gates() 는 독촉일이 지난 게이트만 내놓으므로 그 게이트는 전에도 후에도 브리핑에 없었다 — \"동일\"이 정상 동작이었고 내 대조가 그 절을 한 번도 밟지 않았다. 그래서 테스트 픽스처는 requested 를 40일 전으로 주입해 실제 독촉 초과 상태를 만든 뒤 두 축을 각각 잰다(문면 축 = 브리핑 줄 텍스트가 갈린다 · 주기 축 = 독촉 판정 자체가 뒤집힌다). 주기 축은 양방향으로 잰다(늘리면 사라지고 되돌리면 돌아온다) — 한 방향만 재면 \"amend 후 항상 사라진다\"는 구현도 통과한다.\n\n뮤테이션 10종 전건 일치(RED 9 · 대조군 GREEN 1): dump_gates 리스트 분기 제거 / title 덮어쓰기 제거 / remind 덮어쓰기 제거 / 무변경 거부 제거 / reason 필수 제거 / 저장 생략 / corrections append 제거 / 게이트 부재 거부 제거 / 픽스처를 독촉 미초과로 되돌림 → 전부 RED. 출력 접두 문자만 변경(계약 아님) → GREEN. 주입 하네스는 순수 파이썬으로 짜 셸 이스케이프를 배제했고 치환 대상 1건 단언·원복 바이트 동일 단언을 넣었다 — 미적용 주입이 \"통과\"로 위장하는 것을 막는다.\n\n[정정 2026-09-22] notes 치환 — acceptance 5/6/7 이행 기록 편입 — 전수 재측정 결과(조정 7 · 유지 14)·변별력 실측·뮤테이션 10종"
