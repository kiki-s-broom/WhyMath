acceptance:
  - "① `backlog.py gates`에 기존 게이트의 **제목 정정 경로**를 연다. 현재 `--title`은 `add` 전용이라, 한 번 등재된 게이트 문면이 틀리면 고칠 CLI가 없다(대장 손편집은 금지이므로 정정 수단이 0이다). 정정은 덮어쓰기가 아니라 **추가 기록** 형태여야 한다 — `HARN-76`이 acceptance append-only를 의도적 설계로 닫아 둔 것과 같은 근거(HARN-20 사고 이후 이력 보존). 후보 형태: 원 제목을 보존한 채 `title_corrections[]`에 정정 사유·일시를 덧붙이고 표시 시 정정본을 우선 노출.\n② **정정이 리마인드 경로까지 닿는지 확인한다** — SessionStart 브리핑과 `gates list`가 읽는 문자열이 정정본인지 실측한다. 정정 기능이 있어도 사람이 매일 보는 화면이 옛 문면이면 이 태스크는 무효다(정본화를 집행으로 착각한 완료 선언 금지).\n③ **실패 주입으로 검증한다** — 틀린 제목을 가진 게이트를 만들어 정정을 적용하고, 정정 전후로 브리핑·`gates show` 출력이 실제로 갈리는지 확인한다. 성공/실패 양쪽에서 같은 화면을 내면 검증이 아니다.\n④ **범위 밖**: 게이트 *내용*의 사실성 판정(문면이 참인지)은 이 태스크가 다루지 않는다. 여는 것은 \"틀린 것을 알았을 때 고칠 수 있는가\"뿐이다."
  - "⑤ [축 편입 2026-09-22] 정정 대상을 제목에서 **리마인드 주기(remind_after_days)·독촉 기준일**까지 넓힌다. 현행 --remind-after-days도 title과 똑같이 add 전용이라 등재 후 조정 경로가 0이고, waive는 대체재가 아니다 — status를 waived로 바꿔 대기 태스크를 해금하므로 '요건은 살아 있고 시점만 미뤘다'를 표현할 수 없고 죽은 면제를 대장에 남긴다. 정정 기제는 ①이 정한 추가 기록 형태를 그대로 쓰고, 집행 확인은 ②와 같다(브리핑의 독촉 판정이 실제로 갈리는지 실측 — 값이 파일에 들어간 것과 브리핑이 그 값을 읽는 것은 다르다). 변별력은 ③과 같다(정정 로직 무력화 시 독촉 판정이 변하지 않는 것을 RED로 잡는다).\n⑥ [축 편입 2026-09-22] 실측 트리거: G-web01-landing-legal-review(2026-09-22 등재·remind 30d → 독촉 2026-10-22)를 실제 판정 시점에 맞춘다. Kiki께서 12/31까지를 내부 앱 완성 기간으로 설정하고 변호사 검토를 그 이후로 미루셨으므로, 현 설정이면 2026-10-22부터 2027-01까지 두 달 넘게 매 세션 브리핑에 '독촉 초과'가 뜨는데 그 기간 사람이 할 수 있는 조치가 없다 — 고칠 수 없는 경고는 습관화돼 그 브리핑 항목 전체를 소음으로 만든다(CLAUDE.md '상시 실패하는 fail-open 보호' 상태의 신규 생성). 조정 선례 = G-not-now-v1-release-recheck의 remind 100d(독촉 2026-12-29).\n⑦ [축 편입 2026-09-22] 어긋난 게이트 전수 점검 — pending 게이트의 독촉일과 그것이 막는 태스크의 실제 판정 시점이 벌어진 건만 조정한다. 전건 일괄 연장은 금지(그것은 독촉 자체를 끄는 것과 같다). 실측(2026-09-22): pending 15건 중 12건이 미완료 태스크를 막고 있고 독촉일 경과가 2건이며, 판정 시점이 독촉일보다 크게 뒤인 것으로 확인된 것은 G-web01-landing-legal-review 1건이다(G-not-now-v1-release-recheck는 이미 올바르게 조정돼 있다) — 즉 관례는 있고 정정 경로만 없다. 이 범위 판정은 그 시점에 재측정한다."
  - "⑧ [축 편입 2026-09-23] 두 번째 실측 트리거 — Kiki 결정 ⓐ(Phase 3 P3-G3·P3-G4 통합, 2026-09-22) 집행에서 Release 판정일을 11/22에서 11/15로 옮겨 Week 3 게이트와 합쳐야 했는데 이 태스크가 다루는 정정 경로가 없어 gates waive 2건 + gates add 1건으로 우회했다(EOS-128 4회차 · 판정 기준 main 1671b9d4). 결과적으로 요건은 이동인데 대장에는 면제 2건 + 신규 1건으로 보이고 게이트 ID가 3개로 늘어, \"요건이 사라진 것인지 이동한 것인지\"를 대장만으로는 판정할 수 없다 — ⑤가 든 \"waive는 대체재가 아니다\"의 두 번째 확인이며, 이번에는 *날짜 이동*이 사유였다(⑤는 독촉 주기 조정 사례). ①의 정정 기제가 있으면 제목 1건 정정으로 끝났을 일이다.\n\n⑨ [축 편입 2026-09-23] 부재 주장의 재확인 절차를 이 태스크 자신의 사례로 고정한다 — 나는 gates 서브커맨드에 amend가 없음을 실측하고 \"게이트 정정 경로가 없다\"로 결론해 이 태스크를 중복 등재했다(HARN-162 → 즉시 취소). CLI 표면(도구)만 확인하고 태스크 대장(소유자)을 확인하지 않은 것이 원인이다. 이 태스크가 완료 판정에 이르기 전에, 같은 기능을 소유한 다른 태스크가 등재돼 있지 않은지 대장 전수 조회를 선행한다 — 이 태스크가 이미 HARN-160을 중복 취소로 편입한 이력이 있으므로 그 절차를 재사용한다."
