notes: "발견 경위(2026-09-21 · HARN-96 종결 세션): 게이트 G-canonical-repo-residual-kiki-checks의 제목에 거짓 3건이 실려 있었다 — (a) \"GitHub API는 시크릿 이름 목록 조회를 제공하지 않는다(의도된 설계)\"(실제로는 해당 엔드포인트가 실재하며 이름을 반환한다) (b) 확인 대상 이름 DEPLOY_SSH_PATH(저장소 워크플로·코드 전수 0건 · 실제는 DEPLOY_PATH) (c) \"존재가 확인된 시크릿\"(확인된 적 없음 — 배포 호스트 미프로비저닝이라 그 5종은 등록된 적이 없고 그것이 정상 상태다).\n\n그 게이트는 이번에 clear됐으므로 evidence에 정정을 기록하는 것으로 수습됐다. 그러나 pending 상태에서 같은 일이 생기면 수습 경로가 없다 — 게이트 제목은 매 세션 SessionStart 브리핑에 그대로 노출되고, 그 제목이 Kiki께 드리는 실행 안내의 원본이 된다. 이번 건에서 (b)가 그대로 실행됐다면 없는 이름을 찾거나 틀린 이름으로 시크릿을 등록하는 결과였다.\n\n범위 확인(중복 아님): 태스크 title 정정은 HARN-57 축 5가 이미 열었고 그 태스크는 done이다(amend 옵션에 실재). 이 태스크가 다루는 것은 **게이트 대장 표면**이며, gates 서브커맨드에는 등재 후 문면을 고칠 경로가 전혀 없다(현행 옵션 title은 add 전용). acceptance 항 폐기 표시는 HARN-76이 소유하는 별개 축이다 — 착수 시 두 곳의 정정 관용어가 갈리지 않도록 그 설계를 함께 읽는다(차단 관계는 아니다).\n\n대책의 형태가 태스크인 이유: 2026-09-20 Kiki 지정 「새 산문 규칙 등재 동결」이 사고 대책을 코드·태스크로만 등재하도록 정했다. 이 사고의 교훈(부재 주장의 재확인은 검색 방법을 바꿔야 한다)은 MEMORY 2026-09-21 결정 로그에 남겼다.\n\n[정정 2026-09-22] HARN-160-gate-remind-reschedule-path(등재 시 HARN-133 → HARN-135 → HARN-160, 번호 충돌 3회로 개명) 중복 취소분 편입 — remind_after_days·독촉 기준일 축을 이 태스크가 소유한다. 근거: 같은 서브커맨드(gates)에 정정 경로를 여는 설계를 이 태스크 acceptance ①이 이미 확정했고, 두 태스크가 각각 경로를 열면 2026-09-08 HARN-88 형태의 중복이 된다. 계기: 2026-09-22 WEB-01 착지 중 등재한 G-web01-landing-legal-review의 독촉일(2026-10-22)이 Kiki의 12/31 내부 앱 완성 방침으로 실제 판정 시점(2027-01 초)과 벌어졌는데, 고칠 CLI가 없어 대책을 태스크로 넘겼다(거부의 우회 금지 ③ 설계 공백).\n\n[정정 2026-09-22] notes 치환 — 번호 참조 정정 — notes의 'HARN-133 중복 취소분'이 이제 다른 세션의 HARN-133-rename-bare-number-backreference-scan(main 266c3d55)을 가리켜 결정 불가가 됐다. 내가 취소한 레코드는 HARN-135-gate-remind-reschedule-path로 개명됐으므로 전체 ID로 명시한다. rename CLI가 '문서 참조는 옮기지 않았다'고 고지한 범위를 손으로 닫는 작업이다.\n\n[정정 2026-09-22] notes 치환 — 번호 참조 정정 2회차 — HARN-135-gate-remind-reschedule-path는 3회차 충돌로 HARN-160-gate-remind-reschedule-path로 개명됐다. 옛 전체 ID는 이제 어느 파일도 가리키지 않는 끊어진 참조이므로 현행 ID로 바꾼다. rename CLI가 '문서·대장의 번호 참조는 옮기지 않는다'고 고지한 범위를 손으로 닫는 작업이며, 같은 이유로 한 번(HARN-133 → HARN-135) 이미 수행했다.\n\n[정정 2026-09-23] 2026-09-23 EOS-128 4회차 — Kiki 결정 ⓐ(P3-G3·P3-G4 통합) 집행이 같은 벽에 부딪힌 두 번째 실측 트리거 편입 + 이 세션의 중복 등재(HARN-162 취소)를 ⑨로 자기 사례화. 판정 기준 main 1671b9d4"
