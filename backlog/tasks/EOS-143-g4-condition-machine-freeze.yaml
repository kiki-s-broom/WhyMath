notes: "배경(실측 2026-09-25): EOS-135(done·PR #1304)가 G4 차단 조건을 '학생 표본 >=20명'에서 '내부 테스트 계정 표본 >=20건'으로 교체했으나, 그 조건을 읽는 기계 장치가 0건이다 — test_declaration_canon_consistency.py에 G4 관련 검사 0건, 저장소 전체에서 '내부 테스트 계정 표본'을 읽는 코드 0건.\n\n이 공백은 실제로 한 번 사고가 됐다: 선언 §0-2(\"베타 사용자 확보는 전부 2027년 범위\")와 부록 E의 G4(12-13 학생 표본 >=20명)가 8/30 선언 이래 서로 모순인 채였고, 부록 E를 읽는 장치가 없어 3주 넘게 아무도 보지 못했다. 이는 A7(앵커 8 vs 6)과 같은 형태이며 그때의 대책이 바로 이 테스트 파일이었다 — 같은 파일이 같은 문서의 다른 표를 아직 안 보고 있었던 것이다.\n\n경계: 선언 문서를 바꾸지 않는다. 09-24 결정이 정본이고 이 태스크는 그 결정을 지키는 쪽이다.\n\n선행 경위: PR #1264(세션 claude/adoring-newton-8als9u)가 2026-09-22 결정(선택지 ⓐ — 조건 삭제)을 집행했으나 미머지 3일 사이 EOS-135가 다른 답(교체)으로 착지해 대체됐다. 그 PR은 머지하지 않고 닫았고(중복 게이트·역행·CI red를 낳았을 것), 거기서 만든 뮤테이션 하네스만 이 태스크가 재사용한다."
