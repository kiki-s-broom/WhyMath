notes: "출처: HARN-174 v2-9 백필(2026-09-25). 통합 게이트 G-p3-w3-release-merged에는 판정을 수행할 태스크가 대장에 없었다. 이 게이트는 2026-09-23 사고(계열 gate-resolution-path-unlinked 2회차 — 통합 게이트 병합이 만든 자기 전제)의 당사자이고, 그때의 정정은 판정 대상 태스크의 게이트 부착을 떼는 것이었다. 떼고 나서 남은 것은 누가 이 게이트를 판정하는가였다. 이 태스크가 그 게이트의 입력(gate.depends_on)이다.\n\n[입력 범위] 게이트 제목이 적은 두 축의 작업 묶음 전부를 depends_on으로 건다 — Week 3 축은 P3-08·P3-09·P3-10, Release 축은 EOS-50(P3-11 흡수 소유자)·P3-12·P3-13·P3-14. 사슬 끝의 태스크만 걸어도 전이로 막히지만, 두 축의 범위를 대장에서 바로 읽을 수 있게 전부 명시했다. Release 축 태스크가 S4 스테이지라 이 태스크도 S4다(후행 스테이지 의존 금지 규칙).\n\n[게이트 미부착] 이 태스크는 이 게이트를 여는 작업이므로 그 게이트를 requires_gates로 걸면 순환이 된다(HARN-174 이후 CLI가 쓰기 시점에 거부한다 — 2026-09-23 사고의 형태를 그대로 막는다)."
