acceptance:
  - "① 판정 기준 — 판정문 상단에 판정 기준 main 커밋 해시를 박고, 통합 게이트 G-p3-w3-release-merged의 판정 대상 2축을 main 기준으로 실측한다: (가) Week 3 — AI 품질 8종이 합의된 기준을 충족하고 LLM이 학습 상태를 못 바꾸는 것을 재확인 (나) Phase 3 Release — Release Gate A~E 전부 충족과 성공 기준 3문항 전부 YES. 근거는 실파일·명령 출력·태스크 ID 중 하나여야 하고, 문서 언급은 근거가 아니다.\n\n② 판정 회차 분리(지시문 세트 주의 4) — 이 태스크는 판정 전용이며 구현 세션과 다른 세션에서 단독 집행한다. 조건을 충족시키려고 production code를 고치지 않는다. 발견한 결함은 태스크로 등재만 한다.\n\n③ 최종 한 줄은 PASS 또는 FAIL이며 조건부 PASS는 없다. 두 축을 따로 판정하고, 한 축이라도 FAIL이면 최종은 FAIL이다. 미충족 조건마다 끊긴 지점과 남은 작업량 추정을 적는다.\n\n④ 기록 — PASS면 판정문을 근거로 게이트 clear를 Kiki께 요청한다(kind=decision·assignee=kiki이며 에이전트가 --as kiki로 대행하지 않는다). FAIL이면 gates amend G-p3-w3-release-merged --verdict FAIL --evidence <판정문 경로·기준 커밋> --depends <미충족 항목의 소유 태스크>로 기록한다. 소유 태스크를 잇지 않은 FAIL 기록은 CLI가 거부한다(HARN-174 v2-8).\n\n⑤ 완료 판정 — 판정문이 남고, PASS면 clear 요청이 Kiki께 전달되고, FAIL이면 verdict 기록과 소유 태스크 연결이 대장에 남음."
