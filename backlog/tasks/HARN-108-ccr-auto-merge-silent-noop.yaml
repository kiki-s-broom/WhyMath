# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-108-ccr-auto-merge-silent-noop
title: "merge queue 투입 여부를 읽을 경로가 0건 — auto_merge는 null로 남고 GraphQL은 차단이라 세션이 '큐에 안 들어갔다'로 오진한다"
