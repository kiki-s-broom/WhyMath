acceptance:
  - "① 재현: merge queue가 켜진 이 저장소에서 PUT /repos/{o}/{r}/pulls/{n}/ccr/auto_merge 가 HTTP 200 {\"enabled\":true}를 반환하는데 GET /pulls/{n} 의 auto_merge 는 null로 남는 상태를 실측 기록한다(요청·응답·폴링 타임라인).\n② 원인 규명: 라우트가 실제로 무엇을 했는지(무시/부분 적용/권한) 실측한다. 추론으로 단정하지 않는다.\n③ 세션이 쓸 수 있는 큐 투입 경로를 확보하거나, 없으면 \"없다\"를 명시적 오류로 만든다 — 200 OK가 미적용을 감추는 현 상태가 핵심 결함이다(침묵 실패 금지).\n④ 변별력 검증: 무장 실패 상태를 주입해 새 경로/검사가 실제로 RED를 내는지 확인한다. 정상 상태에서 초록인 것은 증거가 아니다.\n⑤ 세션 런북 축: 자동 머지가 무장되지 않았을 때 사람에게 넘기는 절차를 문서화한다(간접 신호 200을 성공 판정으로 쓰지 않는다)."
  - "[정정 후 acceptance — 위 ①~⑤는 틀린 전제(쓰기 실패) 위에 쓰였으므로 폐기하고 아래로 대체한다]\n⑥ 판정 경로 확보: 세션이 \"이 PR이 merge queue에 들어갔는가\"를 REST만으로 읽을 수 있는 경로를 찾아 문서화한다. auto_merge 필드는 merge queue 저장소에서 큐 투입 시 null로 남으므로 그 필드를 판정에 쓰지 않는다.\n⑦ 변별력: 큐에 들어간 PR과 안 들어간 PR 양쪽에서 그 판정 경로가 서로 다른 값을 내는지 실측한다. 한쪽만 확인한 것은 검증이 아니다.\n⑧ 경로가 정말 없으면 \"없다\"를 명시적으로 적고, 세션 런북에 대체 판정(머지까지 기다린 뒤 state 확인 / push 거부 메시지는 부작용이지 조회가 아님)을 기록한다."
  - "[실측 기록 2026-09-19 — 새 완료 조건이 아니다 · PR #1216(EOS-109)] acceptance ⑥⑦이 찾는 \"큐 투입 여부 판정 경로\"에 대해 후보 하나를 **양방향으로 검증해 탈락**시키고, 실효 신호 하나를 확인했다.\n\n[탈락한 후보 — 큐 브랜치 조회] `git ls-remote origin 'refs/heads/gh-readonly-queue/*'`는 세션에서 조회 가능하고 이름에 PR 번호가 박혀 있다(`refs/heads/gh-readonly-queue/main/pr-<번호>-<base sha>`). 조회 경로처럼 보이지만 **큐 소속의 신호가 아니다.** 같은 PR #1216 하나에서 양쪽을 다 관측했다(acceptance ⑦이 요구한 양방향):\n  · 05:50Z 큐 투입 확증 직후 — 큐 브랜치 목록에 `pr-1217-…`만 있고 `pr-1216-…`은 **없었다**. #1216은 대기열에서 #1217 뒤에 서 있었다.\n  · 06:1x Z #1217 머지 후 — 목록이 `pr-1216-3b0e5b9e…`로 바뀌었다(새 base 기준 재검증 시작).\n즉 이 브랜치는 \"큐 소속\"이 아니라 **\"지금 테스트 중인 항목\"**을 뜻한다. 부재를 미투입으로 읽으면 대기 중인 PR을 전부 오판한다 — `auto_merge` 필드와 같은 함정을 다른 얼굴로 반복하는 셈이라 판정에 쓰면 안 된다. (한계: 큐 길이가 1일 때는 두 의미가 우연히 일치해 변별이 안 된다.)\n\n[실효 신호 — webhook 이벤트] 투입을 실제로 알려 준 것은 `pull_request.enqueued` 이벤트였고(05:50Z · actor doldori7), 머지는 `pull_request.closed`(outcome merged · 06:22Z)가 알려 줬다. 다만 이것은 **통지(push)이지 조회(pull)가 아니다** — acceptance ⑥이 찾는 \"세션이 읽을 수 있는 경로\"를 충족하지 못한다. 구독하지 않은 세션이나 이벤트를 놓친 세션은 여전히 판정할 수단이 없다. 그래도 실무적으로는 90초 폴링 공전(2026-09-16 #1179 사고)을 막아 주므로 런북 축(⑧)에 남길 값어치가 있다.\n\n[부수 확인] 직접 머지는 `405 Repository rule violations found — Changes must be made through the merge queue`로 거부된다(2026-09-16과 동일). 큐 경유 시 `mergeable_state`는 blocked → clean으로 바뀌지만, 이것도 큐 소속이 아니라 \"머지 조건 충족\"의 신호다. 머지 완료의 확정 판정은 여전히 **main의 커밋 도달**(`git log origin/main`에서 `(#1216)` 확인)이 가장 견고했다."
