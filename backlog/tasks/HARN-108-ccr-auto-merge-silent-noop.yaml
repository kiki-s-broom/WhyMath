acceptance:
  - "① 재현: merge queue가 켜진 이 저장소에서 PUT /repos/{o}/{r}/pulls/{n}/ccr/auto_merge 가 HTTP 200 {\"enabled\":true}를 반환하는데 GET /pulls/{n} 의 auto_merge 는 null로 남는 상태를 실측 기록한다(요청·응답·폴링 타임라인).\n② 원인 규명: 라우트가 실제로 무엇을 했는지(무시/부분 적용/권한) 실측한다. 추론으로 단정하지 않는다.\n③ 세션이 쓸 수 있는 큐 투입 경로를 확보하거나, 없으면 \"없다\"를 명시적 오류로 만든다 — 200 OK가 미적용을 감추는 현 상태가 핵심 결함이다(침묵 실패 금지).\n④ 변별력 검증: 무장 실패 상태를 주입해 새 경로/검사가 실제로 RED를 내는지 확인한다. 정상 상태에서 초록인 것은 증거가 아니다.\n⑤ 세션 런북 축: 자동 머지가 무장되지 않았을 때 사람에게 넘기는 절차를 문서화한다(간접 신호 200을 성공 판정으로 쓰지 않는다)."
  - "[정정 후 acceptance — 위 ①~⑤는 틀린 전제(쓰기 실패) 위에 쓰였으므로 폐기하고 아래로 대체한다]\n⑥ 판정 경로 확보: 세션이 \"이 PR이 merge queue에 들어갔는가\"를 REST만으로 읽을 수 있는 경로를 찾아 문서화한다. auto_merge 필드는 merge queue 저장소에서 큐 투입 시 null로 남으므로 그 필드를 판정에 쓰지 않는다.\n⑦ 변별력: 큐에 들어간 PR과 안 들어간 PR 양쪽에서 그 판정 경로가 서로 다른 값을 내는지 실측한다. 한쪽만 확인한 것은 검증이 아니다.\n⑧ 경로가 정말 없으면 \"없다\"를 명시적으로 적고, 세션 런북에 대체 판정(머지까지 기다린 뒤 state 확인 / push 거부 메시지는 부작용이지 조회가 아님)을 기록한다."
