notes: "실측 2026-09-16 PR #1179 (정정본): 직접 SQUASH 머지가 405 'Changes must be made through the merge queue'로 거부 → CCR auto_merge PUT이 HTTP 200 {enabled:true} → 그런데 GET /pulls/1179 의 auto_merge 는 6회 폴링(~90초) + 즉시 재확인 전건 null. 세션은 이것을 '쓰기 무증상 실패'로 오진했다. 실제로는 PR이 큐에 정상 투입됐고, 확증은 그 다음 push의 거부 메시지였다 — 'A pull request for this branch has been added to a merge queue. Branches that are queued for merging cannot be updated.' 즉 merge queue 저장소에서 auto-merge는 auto_merge 필드를 세우지 않고 PR을 큐에 넣으며, 그래서 그 필드는 투입 여부의 신호가 아니다. GraphQL enqueuePullRequest·큐 엔트리 조회는 세션에서 차단되고 REST에 대응물이 없어, 세션이 투입 여부를 조회할 경로가 0건이다(push 거부는 부작용이지 조회가 아니다). CLAUDE.md '간접 신호를 성공 판정으로 쓰는 안내 금지'·'침묵 실패 금지'의 하네스 축. 인접 태스크 HARN-56(merge queue 도입)은 타 세션 claim 중 — 이 태스크는 도입이 아니라 세션측 투입 경로·오류 표면 축이다.\n\n[정정 2026-09-16] title 'CCR auto_merge 라우트가 무증상 실패 — HTTP 200 enabled:true인데 primary source의 auto_merge는 null (merge queue 저장소에서 세션이 큐에 넣을 경로 0건)' → 'merge queue 투입 여부를 읽을 경로가 0건 — auto_merge는 null로 남고 GraphQL은 차단이라 세션이 '큐에 안 들어갔다'로 오진한다': 2026-09-16 실측 정정: 최초 등재 전제(CCR auto_merge 라우트가 무증상 실패)가 틀렸다. push 거부 메시지 'A pull request for this branch has been added to a merge queue'가 PR #1179의 큐 투입을 확증했다 — 라우트는 정직했고 세션이 잘못된 필드(auto_merge)를 읽었다. 진짜 결함은 쓰기가 아니라 읽기 축이다.\n\n[정정 2026-09-16] notes 치환 — 전제 정정 — 쓰기 축 결함이 아니라 읽기(관측) 축 결함으로 재정의\n\n[정정 2026-09-18] 2026-09-18 PR #1183 라이브 실측 — auto-merge 활성화 후 35분 무투입·큐 브랜치 0건. 정정 전제(쓰기 성공)를 반박하는 방향"
