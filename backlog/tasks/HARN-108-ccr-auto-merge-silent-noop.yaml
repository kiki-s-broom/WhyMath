acceptance:
  - "① 재현: merge queue가 켜진 이 저장소에서 PUT /repos/{o}/{r}/pulls/{n}/ccr/auto_merge 가 HTTP 200 {\"enabled\":true}를 반환하는데 GET /pulls/{n} 의 auto_merge 는 null로 남는 상태를 실측 기록한다(요청·응답·폴링 타임라인).\n② 원인 규명: 라우트가 실제로 무엇을 했는지(무시/부분 적용/권한) 실측한다. 추론으로 단정하지 않는다.\n③ 세션이 쓸 수 있는 큐 투입 경로를 확보하거나, 없으면 \"없다\"를 명시적 오류로 만든다 — 200 OK가 미적용을 감추는 현 상태가 핵심 결함이다(침묵 실패 금지).\n④ 변별력 검증: 무장 실패 상태를 주입해 새 경로/검사가 실제로 RED를 내는지 확인한다. 정상 상태에서 초록인 것은 증거가 아니다.\n⑤ 세션 런북 축: 자동 머지가 무장되지 않았을 때 사람에게 넘기는 절차를 문서화한다(간접 신호 200을 성공 판정으로 쓰지 않는다)."
  - "[정정 후 acceptance — 위 ①~⑤는 틀린 전제(쓰기 실패) 위에 쓰였으므로 폐기하고 아래로 대체한다]\n⑥ 판정 경로 확보: 세션이 \"이 PR이 merge queue에 들어갔는가\"를 REST만으로 읽을 수 있는 경로를 찾아 문서화한다. auto_merge 필드는 merge queue 저장소에서 큐 투입 시 null로 남으므로 그 필드를 판정에 쓰지 않는다.\n⑦ 변별력: 큐에 들어간 PR과 안 들어간 PR 양쪽에서 그 판정 경로가 서로 다른 값을 내는지 실측한다. 한쪽만 확인한 것은 검증이 아니다.\n⑧ 경로가 정말 없으면 \"없다\"를 명시적으로 적고, 세션 런북에 대체 판정(머지까지 기다린 뒤 state 확인 / push 거부 메시지는 부작용이지 조회가 아님)을 기록한다."
  - "⑨ 라이브 실측 추가 (2026-09-18 · 게이트 G-skb01-resolution-remeasure 세션 · PR #1183) — 이 태스크의 정정 전제(\"쓰기는 성공한다, 읽기만 안 된다\")를 **반박하는 방향의 증거**다. 오늘 회차의 타임라인:\n  - 11:52 auto-merge 활성화 도구가 \"Auto-merge enabled (method: SQUASH)\"를 반환했다. 즉 쓰기 측은 성공을 보고했다.\n  - 11:52~12:02 (10분) 폴링: origin/main 무변화, PR merged=false.\n  - 12:0x 직접 머지 재시도 2회 전부 HTTP 405 \"Changes must be made through the merge queue\".\n  - 12:1x~12:4x (25분) 2차 폴링: origin/main tip이 a036fa6b(10:40)에서 **한 번도 움직이지 않음**, gh-readonly-queue/* 브랜치 **전 구간 0건**, PR updated_at이 11:52에서 정지.\n  즉 auto-merge 활성화 후 35분간 이 PR도, **다른 어떤 PR도** 큐를 통과하지 않았고 큐 작업 브랜치가 한 번도 나타나지 않았다.\n  해석 2갈래이며 세션은 가르지 못한다: (a) 쓰기가 실제로는 큐 투입을 하지 않았다(이 태스크의 정정 전제가 틀렸다) (b) 투입은 됐고 큐 자체가 멈춰 있었다(HARN-112 묶음 크기 병목). 어느 쪽인지 판정하려면 ⑥의 판정 경로가 먼저 필요하다 — 이 사건이 ⑥의 필요성을 실측으로 보강한다.\n  **함께 볼 외부 신호**: gh-readonly-queue/* 브랜치 존재 여부는 REST(git ls-remote)로 읽히고 큐가 *처리 중*일 때만 나타난다. 대기 중인 항목은 안 보이므로 \"0건\"이 \"큐에 없다\"를 뜻하지는 않는다 — ⑦의 변별력 검증에서 이 비대칭을 반드시 다뤄야 한다(한쪽만 보고 판정하면 오진한다).\n  **도구 문서의 단서**: enable_pr_auto_merge 도구 설명이 \"PR이 이미 mergeable(clean)이면 graceful하게 실패한다\"고 적고 있는데, 이 PR은 활성화 시점에 mergeable_state=clean·CI green이었다. 이것이 (a) 가설의 구체적 기전 후보다 — 검증 대상이지 결론이 아니다.\n  피해: 세션이 \"큐에 들어갔다\"고 믿고 35분을 대기했고 머지를 완료하지 못한 채 사람에게 넘겼다. 이 태스크가 경고한 오진의 **반대 방향**(안 들어갔는데 들어갔다고 믿음)이다.\n\n⑩ 부수 관측 — CLAUDE.md 사실 기술의 시점 낙후: CLAUDE.md 「설정 부재를 설정 가능으로 단정 금지」(2026-09-07 등재)의 사고 경위가 \"merge queue는 조직 소유 저장소 전용이라 이 저장소에는 항목 자체가 없다\"고 적고 있으나, 2026-09-18 실측은 merge queue가 **필수 규칙으로 집행 중**임을 보인다(REST 머지 405가 명시적으로 merge queue를 요구). 그 규칙의 교훈(가용성을 1차 자료로 확인하라)은 그대로 유효하고 사실 상태만 바뀐 것이므로 규칙 본문을 고치는 문제가 아니라 표기 시점을 밝히는 문제다. merge queue 도입 축은 HARN-56이 소유하므로 그 태스크가 착지할 때 CLAUDE.md 해당 문장에 \"2026-09-18 기준 도입됨\" 단서를 병기할지 함께 판단한다. 이 항목은 기록이며 이 태스크의 작업 범위가 아니다."
  - "[실측 기록 2026-09-19 — 새 완료 조건이 아니다 · PR #1216(EOS-109)] acceptance ⑥⑦이 찾는 \"큐 투입 여부 판정 경로\"에 대해 후보 하나를 **양방향으로 검증해 탈락**시키고, 실효 신호 하나를 확인했다.\n\n[탈락한 후보 — 큐 브랜치 조회] `git ls-remote origin 'refs/heads/gh-readonly-queue/*'`는 세션에서 조회 가능하고 이름에 PR 번호가 박혀 있다(`refs/heads/gh-readonly-queue/main/pr-<번호>-<base sha>`). 조회 경로처럼 보이지만 **큐 소속의 신호가 아니다.** 같은 PR #1216 하나에서 양쪽을 다 관측했다(acceptance ⑦이 요구한 양방향):\n  · 05:50Z 큐 투입 확증 직후 — 큐 브랜치 목록에 `pr-1217-…`만 있고 `pr-1216-…`은 **없었다**. #1216은 대기열에서 #1217 뒤에 서 있었다.\n  · 06:1x Z #1217 머지 후 — 목록이 `pr-1216-3b0e5b9e…`로 바뀌었다(새 base 기준 재검증 시작).\n즉 이 브랜치는 \"큐 소속\"이 아니라 **\"지금 테스트 중인 항목\"**을 뜻한다. 부재를 미투입으로 읽으면 대기 중인 PR을 전부 오판한다 — `auto_merge` 필드와 같은 함정을 다른 얼굴로 반복하는 셈이라 판정에 쓰면 안 된다. (한계: 큐 길이가 1일 때는 두 의미가 우연히 일치해 변별이 안 된다.)\n\n[실효 신호 — webhook 이벤트] 투입을 실제로 알려 준 것은 `pull_request.enqueued` 이벤트였고(05:50Z · actor doldori7), 머지는 `pull_request.closed`(outcome merged · 06:22Z)가 알려 줬다. 다만 이것은 **통지(push)이지 조회(pull)가 아니다** — acceptance ⑥이 찾는 \"세션이 읽을 수 있는 경로\"를 충족하지 못한다. 구독하지 않은 세션이나 이벤트를 놓친 세션은 여전히 판정할 수단이 없다. 그래도 실무적으로는 90초 폴링 공전(2026-09-16 #1179 사고)을 막아 주므로 런북 축(⑧)에 남길 값어치가 있다.\n\n[부수 확인] 직접 머지는 `405 Repository rule violations found — Changes must be made through the merge queue`로 거부된다(2026-09-16과 동일). 큐 경유 시 `mergeable_state`는 blocked → clean으로 바뀌지만, 이것도 큐 소속이 아니라 \"머지 조건 충족\"의 신호다. 머지 완료의 확정 판정은 여전히 **main의 커밋 도달**(`git log origin/main`에서 `(#1216)` 확인)이 가장 견고했다."
  - "⑪ ⑨의 정정 (2026-09-19 실측 · PR #1183 머지 완료 시점) — ⑨가 제시한 두 갈래는 **둘 다 틀렸다**. 실제 원인은 세 번째, 즉 **그 PR의 CI가 red였던 것**이다.\n\n타임라인 실측:\n  - 2026-09-18 11:52 auto-merge 활성화 → 35분 무변화. ⑨는 이것을 (a)쓰기 미투입 / (b)큐 정체로 갈랐다.\n  - 2026-09-19 08:1x 같은 PR의 CI를 처음으로 다시 확인 — harness-integrity 잡이 failure였다(태스크 ID 번호 충돌 HARN-110: 병렬 세션이 main에 다른 HARN-110을 먼저 착지시킨 결과). 즉 어제 auto-merge를 켠 시점에 이 PR은 이미 red였다.\n  - 08:2x 충돌을 개명(HARN-115)으로 해소 → CI green → 08:25 auto-merge 재활성화 → 08:44 큐 투입 성립(gh-readonly-queue/main/pr-1183-... 브랜치 생성 · merge_group run 35432809045) → 09:0x 머지 완료(main 75f555b8).\n\n즉 auto-merge는 **정상 동작하고 있었다**. \"조건이 충족되면 머지한다\"는 장치이므로 CI가 red인 동안 조용히 대기하는 것이 설계대로다. 35분간의 무변화는 고장 신호가 아니라 **정상 신호**였고, 그것을 이상으로 읽은 것이 오진이었다.\n\n이 태스크에 주는 함의 — acceptance ⑥(판정 경로 확보)의 설계에 **조건 미충족 상태를 구분하는 축**을 넣어야 한다. \"큐에 들어갔는가\"만 읽을 수 있고 \"왜 안 들어갔는가\"를 못 읽으면, 세션은 CI red·승인 부족·충돌 같은 *정상적인 대기 사유*를 전부 인프라 고장으로 오진한다. 실무적으로는 조회 순서를 뒤집는 것이 더 싸다: **큐를 보기 전에 자기 PR의 CI 결론부터 읽는다**. 내 쪽 조건이 미충족이면 바깥(큐·API)을 의심할 이유 자체가 없다.\n\n같은 세션의 부재·무변화 오판 3연속 기록(형태가 같다 — 조용한 신호의 대안 설명을 다 세지 않았다):\n  1. gh-readonly-queue 브랜치 0건을 \"큐에 없다\"로 읽음 → 타 세션 ⑩ 실측이 반증(\"지금 테스트 중이 아니다\"일 뿐).\n  2. 35분 무변화를 \"투입 실패 또는 큐 정체\"로 읽음 → 이 항목이 반증(CI red였다).\n  3. 30분 감시가 머지를 못 잡은 것을 이상으로 읽을 뻔함 → 큐 CI는 backend 전체 스위트를 돌려 15~26분 걸리고 그 실행은 감시 시작 19분 뒤에야 시작됐다. 감시 창이 구조적으로 짧았던 것이지 이상이 아니다(최근 merge_group 소요 실측: pr-1219 26분 · pr-1216 15분 · pr-1217 22분 · pr-1215 24분).\n\n세 번 다 \"내가 보는 신호가 왜 조용한가\"에 대한 대안 설명을 열거하지 않고 가장 먼저 떠오른 고장 가설을 채택했다. CLAUDE.md 「식별자 부재를 기능 부재로 단정 금지」의 *상태 조회* 축 변형이다 — 그쪽이 \"내가 잘못 찾았다\"를 막는다면 이것은 \"조용한 것을 고장으로 읽었다\"를 막는다."
