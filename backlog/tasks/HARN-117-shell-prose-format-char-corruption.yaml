acceptance:
  - "① 사고 형태 — 한국어 산문을 셸의 서식/치환 문자를 해석하는 자리에 넣어 **무증상으로 잘렸다**. 2026-09-19 실측: `git commit -m \"$(printf '... 커버리지 90.45%) ...')\"` 에서 `%)` 가 printf의 잘못된 서식 지정자로 해석돼 그 지점 이후가 통째로 사라졌다. printf는 stderr로만 불평하고 **git commit은 정상 종료**했으므로, 남은 것은 잘린 본문과 **유실된 attribution 트레일러**였다(하네스가 요구하는 `Co-Authored-By`·`Claude-Session` 2줄). 발견은 검증이 아니라 우연히 본문을 다시 읽은 것이다.\n② 기존 규칙과의 관계 — CLAUDE.md의 \"셸 인자에 마크다운 백틱을 담아 CLI에 넘기기 금지\"(2026-09-08)와 **같은 계열의 두 번째 입구**다. 그쪽은 백틱→명령 치환, 이쪽은 퍼센트→서식 지정자이며, 공통 구조는 \"한국어 산문 + 셸/서식 해석기 + 무증상 손실\"이다. 기존 규칙의 처방(인용 heredoc으로 파일에 쓰고 `\"$(cat 파일)\"` 또는 `-F 파일`로 넘긴다)이 이 축에도 그대로 듣는다 — 규칙이 없어서가 아니라 **적용 범위를 커밋 메시지로 넓히지 않아서** 뚫렸다.\n③ 이 태스크가 정하는 것 — 처방을 어디에 고정할지. (가) CLAUDE.md 본문 규칙의 범위를 \"대장 CLI 인자\"에서 \"셸을 거치는 모든 한국어 산문(커밋 메시지·PR 본문·CLI 인자)\"으로 확장하고 대체형을 명시한다(`git commit -F 파일` · `gh pr create --body-file` · `\"$(cat 파일)\"`) (나) 기계 집행을 붙인다 — 커밋 메시지에 attribution 트레일러 2줄이 있는지 검사하는 pre-push 훅 또는 CI 스텝(잘림의 *증상*을 잡는 대리 지표이며 원인을 잡지는 못한다) (다) 둘 다. 텍스트 규칙 2회 실패 후 코드 착지 선례를 따르면 (다)가 유력하나, 이번이 **이 축(서식 문자)으로는 1회차**이므로 판단을 이 태스크에 남긴다.\n④ 집행 지점 별항 — (나)를 고르면 그 검사가 **실제로 실행되는지** 확인하는 것까지가 완료다(저장소에 존재함 != 돌아감). 트레일러가 없는 커밋을 주입해 RED를 확인한다.\n⑤ 범위 밖 — 이미 머지된 과거 커밋의 트레일러 소급 보정은 하지 않는다(히스토리 재작성 금지)."
