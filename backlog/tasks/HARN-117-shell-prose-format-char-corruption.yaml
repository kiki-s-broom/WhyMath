notes: "출처: 2026-09-19 P-15(PR #1228) 정정 커밋에서 실측. CLAUDE.md 「실수 관리」 의무(시스템 실수 또는 동일 유형 반복은 재발방지 등재 의무)에 따른 등재다. 이번 건은 커밋 amend + 파일 경유 재작성으로 즉시 복구했고(트레일러 복원 확인), 피해는 force-with-lease push 1회. 기존 백틱 규칙과 같은 계열이므로 신규 규칙을 만들기보다 **기존 규칙의 범위 확장**이 1순위 후보다. 분류 SUPPORT."
