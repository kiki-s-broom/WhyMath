acceptance:
  - "① 클라우드 슬롯 셀렉터 정본화 — `config.py`에 `cloud_provider` 셀렉터(anthropic|openrouter|deepseek)를 두고 `l3/providers/factory.py`에 `build_cloud_provider(settings)` 단일 팩토리를 신설한다. **기본값은 `anthropic` 불변** — ARCH-55 채택 판정이 \"선택지를 넓힌 것이지 기본값을 옮긴 것이 아니다\"라고 명시했고, (d) 지연·가용성 축이 ARCH-56으로 보류 중이므로 미판정 구성이 기본값이 되면 안 된다.\n② 집행 지점(①과 별항 — CLAUDE.md 「정본화를 집행으로 착각한 완료 선언 금지」) — 저작 경로의 `AnthropicProvider()` 하드코딩이 실제로 팩토리 경유로 바뀐다. 대상(main a036fa6b 실측 8곳): l3/equivalent/llm_generator.py · l3/equivalent/rephrase.py · l3/pregenerate/__main__.py · l3/pedagogy/explanation_generator.py · l3/pedagogy/analogy_generator.py · l3/multi_solution.py · l3/cross_verify.py · harness/problem_corpus_accumulate.py. 전수 가드로 동결한다 — 산출물 검사(AST로 구성된 결과)이며 문자열 금지목록이 아니다. 스캔 0건은 통과가 아니라 RED.\n③ 학생 대면 경로 제외 동결 — `app.py`의 클라우드 슬롯은 이 셀렉터를 타지 않는다. ARCH-56 게이트 `G-arch56-availability-trigger`의 발동 조건 ⓐ(학생 대면 또는 상시 배치 트래픽 투입 결정)를 이 태스크가 실현시키지 않기 위해서다. 회귀 테스트로 고정하고, 그 테스트의 docstring에 \"이 제외를 푸는 것은 게이트 발동이므로 Kiki 판정 사안\"임을 적는다. 상시 스케줄 등재도 같은 이유로 범위 밖이다.\n④ 타입 표면 일반화 — `composite.check_cloud_status()`의 반환 타입이 `AnthropicStatus | None`으로 고정돼 있어 `OpenRouterStatus`를 넣으면 `mypy --strict`가 막는다. 프로토콜 또는 공용 타입으로 일반화하고 `/status` 응답 계약이 깨지지 않음을 회귀로 확인한다.\n⑤ 작동 신호(CLAUDE.md 「작동 신호 없는 알고리즘 부착 금지」) — 저작 실행의 산출물·리포트가 **어느 프로바이더가 몇 건을 실제로 처리했는지**와 재시도 횟수(`retries_in_current_call`)를 말한다. 정상 응답 200은 OpenRouter가 일했다는 증거가 아니다. 셀렉터를 openrouter로 두고도 anthropic이 돌면 그 사실이 보여야 한다.\n⑥ 실패 주입 — 뮤테이션으로 RED를 확인한 것만 \"보호한다\"고 적는다. 최소 4종: ⓐ 기본값을 openrouter로 뒤집기(기본 핀 불변 계약이 RED) ⓑ 저작 경로 1곳을 하드코딩으로 되돌리기(전수 가드가 RED) ⓒ app.py를 셀렉터 경유로 바꾸기(제외 동결이 RED) ⓓ 관할 게이트 우회(openrouter 선택 시 게이트가 실제로 서는지). 원복은 cp 백업에서 하고 주입 적용·원복 바이트 동일을 단언한다.\n⑦ 라이브 실행은 이 태스크의 완료 조건이 아니다 — 키가 Phaiakes9 User 환경변수에만 있고 컨테이너·CI는 egress가 없다. 실행 런북(CLAUDE.md 6항목 브리핑 + HARN-106 쓰기 블록 자가거부)까지가 이 태스크이며, 실제 저작 배치 1회 실행과 산출물 대조는 Kiki 실행분으로 분리한다."
