acceptance:
  - "① 런북 정본화 — docs/reviews/mp02_canary_review_runbook.md 신설. 6항목 사전 브리핑 + 실행 블록(언어 태그 필수·자리표시자 0건·쓰기 블록 자가거부 가드)으로 구성한다. 대상 CLI 2종: harness/canary_slice.py(genlog 적재 순서로 앞머리 canary_size건 절단) → harness/review_session.py(대화형 판정·타이머 이벤트 생산). 판정 키 a/e/r/s/q와 반려코드 F1~F8을 Kiki가 사전에 읽을 수 있게 표로 싣는다.\n② 집행 지점(정본화와 별항) — 런북이 안내하는 명령이 기대 산출물을 실제로 내는 코드 경로인지 저장소에서 먼저 확인한 것까지가 완료다. canary_slice의 필수 인자(--out·--queue-out)·실패 종료 조건(canary_size=None → exit 1 · genlog 손상 1행 → exit 1 · 해결 0건 → 파일 미생성+exit 1)과 review_session의 필수 인자(--queue·--events·--verdicts·--reviewer-id)·0건 입력 시 exit 1을 코드에서 대조해 런북 문면에 반영한다.\n③ 게이트 증적 연결 — 런북 완주 산출물이 G-eos-first-run-canary-review의 clear 증적(이벤트 파일 + 건수 30)이 되는 경로를 명시한다. 검수 분모가 canary_size와 다를 수 있는 두 경우(부분 산출 shortfall · duplicate_slug_rows)를 런북이 먼저 말하게 한다 — 분모가 조용히 줄면 30건 검수 주장이 거짓이 된다.\n④ 선행 관계 명시 — 이 런북은 MP-02 회차가 성공(accepted>0)한 뒤에만 실행 가능하다. 2026-09-10 회차는 두 번 다 accepted=0이라 검수 대상이 0건이며, 그 상태로 실행하면 review_session이 '검수 대상 0건 — 0건 통과가 아니라 측정 실패다'로 exit 1을 낸다. 이 선행을 런북 상단에 차단 조건으로 적는다.\n⑤ 범위 밖(명시) — MP-06(런북 사이드카 경로 정정·저작 프롬프트 conditions/answer_map 경고)은 다른 세션이 claim했으므로 이 태스크가 건드리지 않는다. MP-02 본체의 status도 건드리지 않는다(blocked 유지 — 사람 게이트)."
  - "[정정 2026-09-21 · 자기 실측] 위 ④의 \"accepted=0이면 검수 대상 0건이라 review_session이 exit 1\"은 **틀렸다** — 코드를 읽지 않고 단정한 추론이다. 실측 정정:\n\nⓐ review_session의 load_review_items는 status로 거르지 않는다 — slug 또는 cu_slug가 있는 행이면 전부 검수 대상이다. 따라서 기계 반려분도 검수 큐에 실린다.\nⓑ canary_slice는 각 카나리 슬롯을 ①이번 회차 검수 큐 ②코퍼스 수용분 ③임의 회차 검수 큐 순으로 해결한다. accepted=0이면 반려분이 resolved_from=review_queue_this_run으로 정상 해결되므로 큐 30건이 그대로 만들어진다.\nⓒ 실제 exit 1 경로는 다른 것이다 — genlog 행의 cu_slug가 None이면(생성이 후보 조립에 도달하지 못해 정체성 자체가 없음) MissingCuSlug 미해결이 되고, 30슬롯이 **전부** 미해결일 때만 '해결 0건 — 검수 큐를 만들지 않는다'로 exit 1이다. 즉 2026-09-10 회차가 검수 가능한지는 실패 지점(파싱 이전이냐 SymPy 검증이냐)에 달려 있고, 예측하지 말고 canary_slice가 말하게 해야 한다.\n\n⑥ 따라서 런북이 막아야 할 것은 hard failure가 아니라 **조용히 무용한 검수**다 — 기계가 이미 반려한 30건을 1시간 검수하면 review_timer 이벤트 30건이 남아 게이트 G-eos-first-run-canary-review의 '카나리 30건 검수' 증적은 성립하는데, 골든셋 승격 원천은 0건이다(게이트의 선언된 목적이 '골든셋 승격 원천'이다). 런북은 검수 착수 전에 canary_slice 요약의 resolved_from 3칸을 읽어 corpus 칸이 0이면 그 회차가 승격 원천을 못 낸다는 사실을 먼저 말하고, 검수 진행 여부를 Kiki 판단으로 넘긴다. 이 판정은 산출 요약 JSON만으로 가능하므로 사람이 추측할 자리가 아니다."
