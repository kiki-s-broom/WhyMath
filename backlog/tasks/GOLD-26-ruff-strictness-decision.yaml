  왜 이 태스크인가: 백엔드 ruff select에 BLE(blind-except)·S(bandit)가 없어 오류를 삼키는 코드가 검사되지 않는다. RESCUE_REVIEW는 이번 3주 골든 기간에 린트 설정을 바꾸면 기존 코드가 일괄 red가 되므로 **건수 기록까지만** 하고 결정을 미뤘다(§4 채택 3). 그 결정이 아직 어디에도 없다.

  왜 F-1·F-3는 등재하지 않았나(2026-11-17 실측): F-1(측정 도구에 app 축 추가)은 RS R1 세션이 소유하고 GOLD-24가 지시문을 그 형태로 재작성 중이다. F-3(옛 앱 미도달 모듈 판정표)은 RS D1(모듈 대장)·C1~C8(패키지 카드)·J1(처분표)이 소유한다. 같은 축을 백로그에 또 세우면 이 문서가 스스로 경고한 "같은 일을 하는 구현 2벌"이 태스크 축에서 재현된다.

  선행 산출물: RS G2의 golden/reports_rescue/G2/옛구역_기준선.tsv. 그 세션은 아직 착수하지 않았고 태스크 ID도 발급되지 않았다 — G2 태스크가 생기면 backlog.py amend --depends로 이 태스크에 선행을 걸어야 한다(CLAUDE.md 「선행 조건을 산문에만 적고 대장에 집행하지 않기 금지」 — 그때까지 이 줄은 대장에 집행되지 않은 상태다).
