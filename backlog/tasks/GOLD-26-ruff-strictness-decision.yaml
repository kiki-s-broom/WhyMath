acceptance:
  - "① 현행 실측 재확인 — 착수 시점 main 해시를 적고 ruff select 값과 BLE001·S110·E722 건수를 다시 잰다(2026-11-17 기준: select E,F,I,N,B,W · BLE001 37 · S110 3 · E722 0). 40건은 \"삼키는 코드\"의 상한이 아니라 그날의 검출 수다 — 줄마다 무엇을 삼키는지(대체 문장 반환·로그·아무것도 안 함) 분류해 적는다."
  - "② 결정 축을 셋으로 분리해 각각 비용과 효과를 적는다 — (가) 저장소 전체에 BLE·S를 켠다 (나) golden 구역만 켠다 (다) 켜지 않는다. 각 안의 기존 위반 수, 고칠 양, 억제 비용, 그리고 \"켜지 않으면 무엇이 계속 새는가\"를 적는다."
  - "③ 이 저장소의 「침묵 실패 금지」는 예외 타입명을 로그에 남기는 것까지 요구하는데 BLE001·S110은 \"삼켰는가\"만 본다 — 게이트가 타입명 축을 어떻게 볼지(별도 규칙·AST 검사·수동 검수)를 설계하고, 그 축을 BLE/S로 대신할 수 없다는 한계를 명시한다."
  - "④ 경계 — RS G2 세션이 만드는 조용한 실패 게이트(golden 구역 0건 강제 + 옛 구역 건수 기록, golden/reports_rescue/G2/)와 역할이 겹치지 않게 나눈다. G2는 golden 구역 게이트이고, 이 태스크는 저장소 전체 린트 설정(pyproject)의 선택 여부 결정이다. G2 산출물(옛구역_기준선.tsv)이 있으면 그 수치를 인용하고 다시 재지 않는다."
  - "⑤ 결정은 Kiki 승인 항목으로 올린다 — 세션이 pyproject.toml을 임의로 바꾸지 않는다. 승인 뒤 집행은 별도 태스크로 나누고, 그때 기존 위반 처리 순서(고칠 것·허용 목록에 이유를 적을 것)를 정한다."
  - "⑥ 산출물 — golden/RUFF_STRICTNESS_DECISION.md(세 안 비교표 + 권고 + 승인 요청 목록). 옛 코드 변경 0줄. 종료 보고에 ①완료 기준 충족 여부 ②옛 코드 변경 0줄 확인 ③승인 요청 항목 수를 적는다."
