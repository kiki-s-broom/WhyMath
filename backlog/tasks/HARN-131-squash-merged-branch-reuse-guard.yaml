acceptance:
  - "①실패 모드 고정 — 2026-09-21 실측. PR #1249가 **squash 머지**된 뒤 같은 브랜치(claude/optimistic-johnson-58q3nw)에 후속 커밋을 이어 붙였다. squash는 원 커밋을 main의 조상으로 만들지 않으므로 merge-base가 머지 이전으로 남고, 새 PR #1257이 **이미 머지된 커밋 2건**(54bca184·abd67116)을 커밋 목록에 그대로 담았다. 더 나쁜 증상은 **CI가 20분 넘게 한 번도 트리거되지 않은 것**이다(브랜치의 워크플로 실행 2건이 전부 이전 PR 시절 head SHA였다 — 실측). 해소는 브랜치를 최신 main에서 재시작하고 후속 커밋만 cherry-pick한 뒤 force-with-lease로 재푸시한 것이며, 그 push가 synchronize를 발화시켜 CI가 즉시 돌았다(run 4126).\n②왜 사람 규율로 부족한가 — 이 저장소는 ⓐ squash 머지를 쓰고 ⓑ 세션마다 **지정 브랜치 이름이 고정**돼 재사용 유인이 구조적이다. 지시문에 \"머지됐으면 브랜치를 재시작하라\"가 이미 적혀 있었는데도 발생했다 — 산문이 있는 자리에서 뚫렸으므로 대책은 코드여야 한다.\n③검출 수단(실측 근거) — `git cherry origin/main <branch>`가 patch-id로 upstream에 이미 있는 커밋을 `-`로 표시한다. 즉 \"내 브랜치의 커밋 중 내용이 이미 main에 있는 것\"을 정확히 세는 도구가 이미 존재한다. 구현은 그것을 감싸는 CLI 1개(scripts/harness/*)이며, 0건이 아니면 exit 1과 해당 커밋 목록을 낸다.\n④배선 지점(정본화와 별항) — 만들고 끝내지 않는다. 최소 하나의 실행 지점에 실제로 배선하고 그것이 돌았음을 확인한 것까지가 완료다. 후보: harness-integrity 잡의 스텝(PR 이벤트에서 head 브랜치 대 origin/main 대조) 또는 backlog.py start/done의 선행 검사. CI 잡에 붙이면 tests/infra/test_test_suite_wiring.py 계열로 배선을 동결한다.\n⑤변별력(실패 주입) — 세 방향을 각각 확인한다: ⓐ squash 머지된 커밋을 재포함한 브랜치를 합성해 exit 1 + 커밋 목록 정확 ⓑ 정상 브랜치(최신 main에서 딴 새 커밋만)에서 exit 0 ⓒ **스캔 0건 위장** 방지 — 비교 대상 ref를 못 찾으면 통과가 아니라 측정 실패(exit 2)로 멈춘다. 정상 입력에서 초록인 것은 보호의 증거가 아니다.\n⑥인접 축 경계(실측) — HARN-123은 **머지 큐 squash가 마지막 커밋을 빠뜨리는** 축(머지 결과 diff ↔ PR head diff 대조)이고, 이 태스크는 **브랜치를 재사용해 이미 머지된 커밋을 다시 담는** 축이다. 방향이 반대다(그쪽은 유실, 이쪽은 중복). 부재 판정 범위 명시: `grep`으로 squash·브랜치 재사용·재시작·stale branch를 역할 기반 검색했고 소유 태스크는 **내가 찾은 방법으로는 0건**이다.\n⑦CI 미발화의 인과는 미확정 — 브랜치 재시작으로 CI가 즉시 돌았다는 것은 실측이지만, \"머지된 커밋 재포함이 미발화의 *원인*\"이라고 단정하지 않는다. GitHub 측 이벤트 로그를 보지 못했다. 이 태스크가 막는 것은 **브랜치 상태**이고, CI 미발화는 그 상태에서 동반 관측된 증상으로 기록한다."
