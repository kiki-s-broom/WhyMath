acceptance:
  - "① 측정 구간 교정 — tests/backend/api/test_verify_isolation.py::TestBudgetMeansUnverifiable::test_solution_keeps_other_transitions_and_caps_total_budget 의 elapsed가 검증 요청(POST /v1/verify-solution) 한 건만 잰다. TestClient 진입·앱 lifespan 기동·종료는 측정 밖으로 뺀다. 상한 3.2초와 체인 총 예산 2.0초의 의미는 바꾸지 않는다(완화 금지 — 상한을 올려 통과시키는 것은 이 태스크의 해법이 아니다).\n② 변별력 유지 — 총 예산 상한(캡)을 되돌린 뮤테이션(예: 체인 총 예산 무제한)에서 이 테스트가 여전히 RED임을 실측한다. 주입 적용(mutated != original)과 원복 바이트 동일성을 실행 전후에 단언하고, 원복은 cp 백업으로만 한다.\n③ 재현 근거 — main 머지 그룹·PR #1512 CI에서 이 테스트가 elapsed 3.42~3.45초로 실패한 실측(측정 구간에 lifespan 기동이 포함됨)을 PR 본문에 적고, 교정 후 같은 파일을 반복 실행(최소 20회)해 실패 0건을 보인다.\n④ 검증 — 이 PR이 닿는 CI 잡을 전수 열거하고(backend 잡 등) 로컬에서 그 잡의 해당 스텝을 exit code로 판정한다."
  - "[정정 2026-10-09 — 실측이 원 가설을 기각] 앱 lifespan 기동·종료는 0.014~0.016초·0.004초로 원인이 아니다(측정 구간 분해 4회). 요청 시간 자체가 정상에서 2.21~3.69초(단독 4회·4병렬 12회)로 흔들리며, 값은 상한 초과 횟수와 함께 움직인다(2회 → 2.2~2.7초, 3회 → 3.1~3.7초). 원인 = verify.py의 체인 마감(wall-clock deadline)이 마지막 전이의 워커 재기동 대기(_wait_ready — 계산 상한 밖)를 묶지 못해 요청이 예산 2.0초를 재기동 1회만큼 넘는 설계상 초과분. 그래서 ①의 '측정 구간 교정'은 정확성 보정일 뿐 해법이 아니고, ①의 '상한 완화 금지'는 잘못된 전제 위에 쓴 것이라 이 항으로 대체한다.\n①' 벽시계 상한은 설계상 초과분(예산 + 재기동 1회 + 마지막 전이의 계산)을 덮는 값으로 다시 정하고 근거를 테스트에 적는다. 변별력 실측: 총 예산 제거 뮤테이션(M1) 11.27~11.63초 vs 정상 최대 3.69초 — 새 상한은 그 사이에 있어야 한다.\n②' 벽시계로 구별되지 않는 뮤테이션 — 남은 예산 대신 상한 전체를 주는 M2(timeout_s=cap_s)는 정상과 같은 2.21~3.69초라 기존 테스트가 원래부터 잡지 못했다. 가짜 시계 + 스텁 풀로 '각 전이에 준 상한 = min(상한, 남은 예산)'·'예산 소진 뒤 계산 없음'을 시간 비의존으로 고정하는 테스트를 추가하고, M1·M2 둘 다 RED임을 실측한다(주입 적용·원복 바이트 동일 단언).\n③' 제품 쪽 초과분(재기동 대기가 마감 밖 — 최악 _STARTUP_TIMEOUT_S 60초까지)은 테스트 범위가 아니므로 별도 태스크로 분리 등재한다."
