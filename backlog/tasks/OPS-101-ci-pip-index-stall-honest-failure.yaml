acceptance:
  - "① 실측 근거(2026-09-28 PR #1349 · run 36411340376 · job 108892011942): declared-unwired-audit 잡의 `pip install -e .`가 `https://pypi.org/simple/python-dateutil/` 한 건에서 읽기 시간 초과를 6회 연속 맞았다(경고 줄은 5개 — 마지막 6번째는 재시도가 없어 경고 없이 끝난다). 10:43:18.94 → 10:44:56.77 = 97.83초 = pip 26.2.1 기본값(시간 제한 15초 × 6회 + 재시도 대기 0+0.5+1+2+4초 = 97.5초)과 일치. pip은 이 실패를 debug 수준(\"Could not fetch URL ... - skipping\", -vv에서만 보임)으로만 남기고 python-dateutil을 '버전 없음'으로 처리해 celery 5.6.3→5.4.0 9개 버전을 역추적한 뒤 ResolutionImpossible(\"conflicting dependencies ... no matching distributions available: python-dateutil\")을 냈다 — 실제 버전 충돌이 아니다. 같은 커밋 재실행(attempt 2, job 108901723351)은 설치 48초로 통과했고, 같은 실행에서 같은 시간대(10:43:22~10:44:37)에 백엔드 패키지(celery → python-dateutil)를 설치한 다른 잡 6개(backend·backend-migrations·concept-reach·corpus-authoring·data-pipeline·harness-integrity)도 설치 단계를 통과했다. 로컬 재현(가짜 인덱스에서 /simple/python-dateutil/만 무응답)으로 오류 문구와 시간(97.59초)을 모두 재현했고, 정상 인덱스 대조군은 통과했다."
  - "② 정직한 분류: pip 설치 스텝이 실패하면 그 출력에서 `/simple/<패키지>/`에 대한 ReadTimeoutError·ConnectTimeoutError 재시도 흔적을 찾는다. 흔적이 있으면 \"PyPI 인덱스 무응답(<패키지>) — 의존성 충돌 아님\"을 `::error::` 주석으로 드러내고, 흔적이 없으면 원래 실패를 손대지 않고 그대로 둔다(진짜 충돌을 네트워크 탓으로 돌리지 않는다)."
  - "③ 재시도 범위 제한: 재시도는 ②가 네트워크로 분류한 경우에만, 설치 스텝 안에서 1회(대기 포함)로 한정한다. 테스트·게이트 스텝은 재시도하지 않는다 — 재시도로 빨간 결과를 가리는 용도로 쓰지 않는다. 재시도했다는 사실과 원인 패키지를 로그와 잡 요약에 남긴다."
  - "④ 적용 범위: ci.yml에서 pip 설치 명령을 담은 스텝 전수(2026-09-28 실측 12잡 12스텝)가 같은 래퍼를 쓴다 — 잡마다 다른 구현 금지. 래퍼를 거치지 않는 pip 설치 스텝이 생기면 tests/infra 테스트가 ci.yml을 읽어 RED를 낸다(스캔 0건도 실패로 친다)."
  - "⑤ 변별력: 로컬 가짜 인덱스 픽스처(특정 `/simple/<패키지>/`만 무응답)로 세 상태를 가른다 — 무응답 → 네트워크 분류 + 재시도 1회, 정상 인덱스 → 재시도 없이 통과(대조군), 진짜 버전 충돌(인덱스 정상) → 충돌 그대로 RED·재시도 없음. 뮤테이션으로 각 분기의 반례를 밟고, 주입이 실제로 적용됐는지도 단언한다."
  - "⑥ 관측 범위(2026-09-28 교차 대조 — 10:20~11:20Z에 만들어진 ci.yml 실행 6건 중 설치 단계가 있는 잡 로그를 대조했다. 성공 실행의 나머지 잡과 docker-build 로그는 열지 않았으므로 실제 건수는 이보다 많을 수 있다): 같은 URL(`/simple/python-dateutil/`)의 읽기 시간 초과가 10:25~10:47Z 사이 이 저장소 CI 9잡에서 나왔다. 6회를 다 쓰고 가짜 ResolutionImpossible로 실패한 잡 5개(이 PR 1개 + main 머지 큐 PR #1344 실행 2건의 4개 — run 36410944904의 harness-integrity·backend-migrations, run 36411495784의 corpus-authoring·concept-reach), 3~4번째 시도에 회복한 잡 2개, 재시도 중 실행이 취소된 잡 2개. 관측 리전은 westus2·centralus·northcentralus. 같은 시각 다른 러너들(같은 westus2 러너 포함)은 첫 시도에 받았고, 멈춘 pip 프로세스도 다른 URL은 직전·직후에 바로 받았다 — 러너 전면 장애가 아니라 특정 URL 요청이 간헐적으로 응답을 받지 못한 현상이다. 머지 큐까지 막았으므로 착수 시 ②③을 이 표본(9잡)에 대입해 효과를 먼저 추산한다."
