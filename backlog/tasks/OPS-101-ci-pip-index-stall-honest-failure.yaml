notes: "2026-09-28 PR #1349 CI red(외부 PyPI 인덱스 무응답)의 재발 방지 대책으로 등재(CONST-02 세션). 이 계열(ci-pypi-index-stall)은 사고 대장 기준 1회차라 대책 의무는 없지만, pip이 네트워크 실패를 '의존성 충돌'로 위장해 원인 판정을 오도한다는 점을 재현으로 확인했기 때문에 추적한다. 멈춤이 러너 네트워크·PyPI CDN 가장자리·원본 중 어디에서 났는지는 우리 쪽 로그로 판정할 수 없다(연결은 됐고 응답이 오지 않았다는 것까지만 확인 — ConnectTimeout이 아니라 ReadTimeout). python-dateutil의 마지막 배포는 2024-03-01이라 배포에 따른 캐시 무효화로는 설명되지 않는다. 재현 스크립트는 세션 스크래치에만 있었으므로 착수 시 ⑤의 픽스처로 다시 만든다.\n\n[정정 2026-09-28] 교차 대조 결과 반영 — 같은 URL 멈춤이 main 머지 큐(PR #1344)를 포함해 9잡에서 관측됨"
