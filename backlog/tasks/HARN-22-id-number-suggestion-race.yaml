  - "[이행 판정 2026-10-08 · acceptance 5항 대조] 이 태스크 등재 뒤 HARN-111(done)이 번호 예약(ⓐ)을 선행 착지시켜 새 메커니즘은 만들지 않았다. 판정: (a) 원격 예약 채택 + (c) 머지 시점 검출 채택 · (b) 세션 오프셋·해시 분산 기각(충돌 확률만 낮출 뿐 예방이 아니고 _suggest_number의 연속 번호 규약을 깬다). 집행 지점(별항): (a) = backlog.py의 cmd_add·cmd_rename이 부르는 number_guard.reserve_for · (c) = store._id_number_collisions → backlog.py validate → CI harness-integrity 잡. ①재현 고정·③양방향 변별 = tests/harness/test_id_number_suggestion_race.py — OPS-29 사고를 완화 off/on으로 재생해 갈림을 단언(off: 두 세션 모두 같은 번호 수용 · on: 두 번째 세션 거부 후 다음 번호). 결함 주입 3종(예약 끄기·validate 맹목화·예약 스텁 무력화)이 예측한 테스트만 정확히 RED. ④정직한 경계 = by design 3종(제안은 예약이 아니다 · 예약을 못 남긴 세션은 보호되지 않는다 · TTL 72시간)을 docs/standards/build_harness.md §3b-1a에 문서화하고, 머지 시점 보장을 동결: 동작 = 같은 파일의 TestMergeTimeBackstop(중복이면 validate exit 1 · 번호가 갈리면 exit 0 대조군), 배선 = tests/infra/test_number_collision_backstop_wiring.py(결함 8종 주입 + 실제 ci.yml 주입 4종 전건 RED, 결함마다 맞는 이유로 검출되는지까지 단언). ⑤CI 실행: tests/harness는 harness-integrity 잡의 pytest tests/harness, tests/infra는 infra-contracts 잡의 pytest tests/infra 경로이며 신규 테스트 5건·10건이 디렉터리 단위 수집에 포함됨을 실측. 잡 단위 실행 결과(exit code)는 CI 미러 결과로 done 증적에 남긴다."
