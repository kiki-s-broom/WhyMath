  - "① 수확 CLI — python -m whymath_backend.harness.intent_shadow_harvest <로그...> [--since/--until ISO] [--json 경로]. 레코드는 emit 측 IntentShadowObservation(extra=forbid)으로 검증하고 parsed·skipped·broken(예외 타입명)을 분리 회계한다. 같은 파일(sha256 동일)을 두 번 넣으면 한 번만 센다. 집계 대상 0건이면 exit 2(스캔 0건은 실패), 입력 파일 없음도 exit 2"
  - "② 일치도 표 — 작동 비율(failure 없음/전체)·실패 타입별 건수를 먼저 내고, 성공 레코드로 rule_intent×laya_intent 교차표와 LAYA_TO_RULE_INTENT 기준 일치율(Wilson 단측 95% 하한·상한)·laya 라벨별 일치·확신 구간별 일치·풀이 동반 여부별 일치를 낸다. rule_intent 없음은 분모에서 빼고 따로 센다. 판정선 없음(분포 제시만)"
  - "③ 개인정보 겹침 — pii_prob≥0.5(laya)와 pii_rule(규칙)의 2×2(둘 다·laya만·규칙만·둘 다 아님)와 규칙 종류별 건수. 레코드 v1(규칙 필드 없음)·규칙 판정 실패(None)는 0으로 접지 않고 '규칙 미기록'으로 따로 센다. 지연 중앙값·p95"
  - "④ 실물 표면 — 2026-11-03 Phaiakes9 실측 레코드 15건(v1·원문 없음)을 픽스처로 넣어 파싱·일치 15/15를 동결. 런북 '아직 없는 것' 절을 실행 절차로 갱신. 원문·식별자 미출력(레코드 자체에 없음)"
