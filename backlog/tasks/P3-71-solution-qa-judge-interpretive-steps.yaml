acceptance:
  - "① C4 해석 단계 인정: 이웃 단계가 동치가 아니라 근 선택(후보 집합 → 도메인 제약을 만족하는 원소)·대입(변수 값 → 식의 값)인 경우를 SymPy로 판정한다. 해석 단계가 성립하면 passed, 성립하지 않으면 failed(C4_STEP_INCORRECT 유지), 판정 불가면 unverifiable — 해석 단계를 무조건 통과시키지 않는다.\n② 도메인 제약 읽기: C2(또는 C1 root_selection)가 verify.conditions 안의 도메인 제약(a > 0 · c >= 0, c <= 3 · x > 0 등 부등식)으로 후보 근을 걸러, 남은 후보가 정답과 일치하는지 판정한다. verify_root_selection이 '단일 등식 + 도메인 부등식' 리스트를 받게 한다. 정답에서 역산한 selection으로 순환 통과하지 않는다(P3-24 B3 단서).\n③ 기준 완화 금지 검증: 각 확장마다 주입(잘못된 근 선택·틀린 대입값·제약 위반 근)이 failed로 잡히는 RED 테스트를 둔다. 현행 passed 456건 중 failed로 바뀌는 문항이 생기면 멈추고 보고한다. 분모 total 1,121 불변.\n④ 재측정: 생성기·코퍼스를 바꾸지 않은 상태에서 solution_qa 전·후 표(total·passed·failed·unverifiable·decidable_ratio·사유별)를 docs/reviews/에 남긴다. 생성기 규칙 반영·재생성·새 회차 감사는 P3-62가 이어서 한다."
