acceptance:
  - "① Evidence 중간 객체 신설 — 채점이 `concept_evidence{}`·`skill_evidence{}`·`possible_misconceptions[]` 3종을 묶어 반환하는 계약을 만든다. 계획서 §5.1의 요지는 \"정답/오답에서 끝나면 안 된다 — Answer → Evidence → Learner State로 변환돼야 한다\"이다.\n② 현행과의 차이를 먼저 적는다 — (가) 현행 `AttemptSubmitResponse`(`api/me.py:728-748`)는 개념·스킬을 '증거'가 아니라 **이미 갱신된 mastery delta**로 반환한다. 즉 중간 Evidence 객체 없이 상태 갱신이 먼저 일어난다 (나) 오개념은 채점 응답에 합류하지 않고 **coach 대화 경로에서만** 갱신된다(`l4/misconception/diagnose.py:479` 호출처 `api/coach.py:688,958`) (다) Assessment 조립은 per-answer가 아니라 **CAT 중단 경계 배치**다(`POST /v1/me/assessments/capture`).\n③ 이중 적재 금지 — Evidence 도입이 기존 mastery 전파 경로를 **복제**하면 안 된다. 학생 경로의 attempt 생산자는 `_complete_problem`(`api/coach.py:1099-1140`)이고 `POST /v1/me/attempts` 직접 호출은 계약상 금지다. Evidence는 그 경로의 **중간 산출물**로 끼워 넣거나, 안 되면 왜 안 되는지 적는다.\n④ LLM 비권위 불변식 유지 — Evidence의 `possible_misconceptions[]`는 LLM이 후보를 분류할 수 있으나 **확정은 판정 게이트**(`l4/misconception/match_gate.py:91` `_DEFAULT_CONFIDENCE_FLOOR=0.65`)가 한다. LLM이 LearnerState를 직접 결정하지 않는다는 계획서 §10 제약과 저장소 집행(`harness/wh1_llm_policy.py:496 _enforce_invariants`)을 둘 다 유지한다.\n⑤ 부분 쓰기 갭을 덮지 않는다 — attempt commit과 숙달·이벤트 헬퍼가 각자 commit하는 현행 구조(`EOS-81` acceptance ⑦이 정직 표기로 동결)를 Evidence 도입이 \"한 트랜잭션\"인 것처럼 가리면 안 된다. 각 단계를 개별 관측 가능하게 둔다.\n⑥ 작동 비율 — Evidence가 실제로 채워진 비율을 응답·리포트가 말해야 한다. 200 응답은 알고리즘이 일했다는 증거가 아니다(CLAUDE.md \"작동한 비율\" 원칙). 3종 중 몇 종이 비어 있었는지 표기한다."
  - "⑤ [EOS-100 승계 · 2026-09-16] Assessment 이름 충돌을 이 태스크가 판정한다 — 만료 없는 유예 금지의 재확인 지점. 계획서 300 §5.1의 Assessment(한 답안의 채점 산출·per-answer)와 ARCH-37 #15의 Assessment(진단 평가 세션 컨테이너·per-session)가 같은 이름으로 서로 다른 것을 가리킨다. EOS-100은 임의 개명하지 않고 schema/learning_loop_contract.py의 semantic_collision=True로 충돌을 데이터에 기록만 했다(기계 집행: tests/backend/schema/test_learning_loop_contract.py::test_assessment_name_collision_is_recorded_not_silently_resolved). 이 태스크가 Evidence 계약의 이름을 정하는 순간이 곧 그 판정 시점이므로, 3택(A: 계획서 쪽을 AssessmentEvidence로 / B: 정본 Assessment를 DiagnosticSession으로 개명 / C: 충돌 유지) 중 하나를 근거와 함께 고르고 docs/architecture/learning_loop_contract_v1.md §5를 갱신한다. C를 고르면 다음 재확인 지점을 명시한다(유예에는 만료가 붙어야 한다)."
  - "⑥ [EOS-102 판정 결과 반영 · 2026-09-16] 위 ⑤의 판정이 내려졌다 — Kiki가 A안을 채택했다. 계획서 300 §5.1의 per-answer 채점 산출은 AssessmentEvidence로 부르고, 저장소 정본 Assessment(진단 평가 세션·ARCH-37 #15)는 이름을 유지한다. 근거: ⓐ 두 객체의 의미가 실제로 다르다(채점 결과/근거 vs 평가 세션 자체) ⓑ 파급 비대칭 실측 — 정본 Assessment는 ORM 모델과 테이블 assessment로 백엔드 29파일·테스트 18파일·마이그레이션 4건에 물려 있어 정본 개명은 DB/ORM/API/테스트까지 번진다 ⓒ EOS-79 evidence_layer_boundary.md가 이미 이름이 층을 정하지 않는다·assessment 테이블은 Assessment 층이 아니다를 정본화했고 그 Assessment 층 정의가 이 객체와 일치한다. 따라서 이 태스크는 판정이 아니라 구현만 남았다 — Evidence 3종 묶음 계약의 타입 이름을 AssessmentEvidence로 만든다. 좌석은 전용 좌석 없이 LearningEvent 혼재 흡수(attempt_event·answer_submission·evidence_event)이며 신규 좌석을 만들지 않는다. 판정 기록은 docs/architecture/learning_loop_contract_v1.md 3-1절, 기계 집행은 tests/backend/schema/test_learning_loop_contract.py 3종(충돌 0건·개명 방향·루프 밖 이동)"
  - "⑦ [EOS-13 승계 · 2026-09-16] AttemptOutcomeEvidence 폐기 — EOS-13이 이 태스크의 착지를 기다리며 l2/mastery_contract.py에 임시 증거 어댑터 AttemptOutcomeEvidence를 뒀다. 그것은 AssessmentEvidenceInput Protocol(속성 2개: correct·observed_at)을 만족하는 최소 스텁이며 EOS-12가 만드는 정본 타입이 같은 Protocol을 상속 없이 만족하면 폐기 대상이다. 이 태스크는 ⓐ 정본 타입이 그 Protocol을 실제로 만족하는지 확인하고 ⓑ AttemptOutcomeEvidence를 제거하며 ⓒ Protocol 속성 집합을 동결한 테스트(test_protocol_reads_exactly_two_attributes)가 여전히 유효한지 대조한다. 속성을 늘려야 한다면 그것은 계약 변경이므로 EOS-13 문서(docs/architecture/mastery_update_contract_v1.md)도 함께 고친다"
