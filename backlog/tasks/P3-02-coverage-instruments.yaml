  - "① 지표 4종을 CLI 로 산출한다 — Content Coverage / Curriculum Coverage / Concept Completeness / Graph Connectivity Coverage. 분모는 P3-01 동결 명세다.\n② **사람이 세지 않는다** — CLI 가 계산하고 exit code 로 판정한다.\n③ 변별력 — 각 지표마다 **연결을 끊는 주입에 수치가 실제로 떨어지는지** 확인한다. 정상 입력에서 값이 나오는 것은 증거가 아니다.\n④ Concept Completeness 는 원 문서 정의(필드 채움 검사) 그대로 만들지 않는다 — ARCH-43(done)이 '필드 채움 검사는 배제 선언한 과목도 통과한다(반증력 0)'로 같은 방식을 이미 기각했다. 반증 가능한 정의로 재설계하고 그 근거를 적는다.\n⑤ 완료 판정 — 지표 4종이 CLI 로 산출되고 각각 주입에 수치가 떨어짐."
