acceptance:
  - "① 실측 고정(판정 기준 main 78a8edff) — `api/_next_problem_policy.py::SuneungRecommendationPolicy`는 `l2/learning_state_recommendation.py::route_by_learning_state`를 부르지 않는다. 그래서 수능 응답의 `learning_state_directive`는 항상 null이다(`tests/backend/api/test_me.py`가 그 null을 단언한다). EOS-24 판정문 §7-3이 \"같은 결함이 있으나 별도 판정이 필요하다\"로 넘겼고, EOS-25 판정문도 범위 밖으로 넘겼다 — **서로를 가리키는 순환 이관이라 소유자가 0건**이었다(EOS-25 독립 비판 F5). 이 태스크가 그 소유자다.\n\n② 현재 영향 — EOS-25로 수능 모드는 콘텐츠를 다른 개념으로 옮기지 않으므로(관계 재선택 보류 · mode_withheld) 콘텐츠 수준 충돌은 없다. 남은 충돌은 **설명 수준**이다: 상태 머신이 R5(반복 실패 → 설명·힌트부터)나 R3(오개념 교정)를 결정한 회차에도 수능 추천은 숙달 구간 설명(practice_current 등)을 낸다 — 한 회차에 두 지시(EOS-24가 기본 CAT에서 해소한 형태).\n\n③ 판정 — 수능 모드가 R3 교정 집행(EOS-24)과 R6 탐침(EOS-26 — 미머지 시 그 착지 뒤)을 따를지. 따른다면 개념 제한 후보와 L6 진실 게이트의 상호작용(교정 대상 개념에 수능 적격 문항이 없을 때)을 함께 정한다. 수능 관계 재선택의 재판정(후속 태스크)이 이 판정을 입력으로 쓴다."
