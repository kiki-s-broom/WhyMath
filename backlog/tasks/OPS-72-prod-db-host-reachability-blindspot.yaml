notes: "[사고 경위 2026-09-08~09 · 판정 기준 main 94d1f28a] G-eos63 측정 회차에서 Phaiakes9 prod DB(docker whymath-pg)가 호스트 TCP 5433으로 접속 불가 상태임이 드러났다. 증상은 ConnectionRefusedError(WinError 1225)였고, 최종 원인은 Windows Hyper-V/WinNAT의 동적 포트 제외 범위가 5368~5467을 잡아 Docker가 5433을 게시하지 못한 것이었다(docker run으로 5434를 게시해 봐도 동일 오류 - 컨테이너 문제가 아님을 결정적 실험으로 가름).\n\n[왜 무증상이었나 - 이것이 본 태스크의 존재 이유] 이 고장을 볼 수 있는 도구가 하나도 없다. 백업(backup_whymath_pg.ps1)은 docker exec pg_dump로, 스키마 프로브(probe_prod_schema_revision.sql)는 docker exec psql로 컨테이너 안으로 들어간다. 저장소 전수 검색 결과 호스트 127.0.0.1:5433에 의존하는 스크립트는 0건이다. 즉 감시 사각이 우연이 아니라 구조적이다 - 백업은 계속 성공하고 아무 경보도 울리지 않는 동안 호스트에서 붙는 모든 경로(측정 도구·호스트 uvicorn·호스트 alembic)가 죽어 있었다.\n\n[또 하나의 판별 함정] docker ps의 Ports 칸은 실현된 게시(NetworkSettings.Ports)를 보여주고, docker inspect의 HostConfig.PortBindings는 생성 시 요청한 설정을 보여준다. 이번 사고에서 PortBindings에는 5433이 멀쩡히 있었고 NetworkSettings.Ports는 빈 배열이었다 - 설정만 보고 정상으로 읽으면 고장을 못 본다. 이 세션도 그 함정에 한 번 빠져 오진했다.\n\n[해소 계기] 별도 조치 없이 Docker Desktop 재기동 과정에서 동적 예약이 반납돼 5433이 풀렸다. 즉 근본 해결이 아니며 재부팅·WSL 재시작마다 재발할 수 있다. 영구 조치는 관리자 권한으로 winnat을 내렸다 올리며 5433을 관리 포트 제외로 못 박는 것이다."
