notes: "출처: EOS-57 acceptance ③('집행 별항: 소비 지점 전환은 후속 태스크로 분리'). EOS-57은 영속 좌석+writer까지만 소유한다.\n\n[측정 완료 2026-09-10 · 판정 기준 main 28a90846 · Kiki 실행(docs/ops/eos63_skill_event_reach_sample_runbook.md 그대로) · claude 진단] G-eos63-skill-event-reach-sample 회차 실측 수치(창 2026-09-10T03:33:12.332113+00:00): ATTEMPTS=20 EVENTS=20 · EMPTY=20 NONEMPTY=0 NULL=0 · WRITER_REACH=1.0 RESOLUTION=0.0 E2E=0.0 · PROBE_ACCEPTED=20 PROBE_FAILED=0. 판정(런북 §4 판정표): writer 배선은 100% 작동(기록은 완벽) — 그러나 해소율 0%는 '전환 가능'이 아니라 '전환 보류·대책은 데이터'다. 원인 실측(read-only, whymath-pg): skill_node_total=0·skill_node_estimable=0·concept_total=2683·concept_with_skills=0 — skill_node 테이블이 prod에 전혀 적재된 적이 없고 concept.behavior_skills도 전량 빈 배열이다(코드 결함 아님·prod 미적재). 근본원인 해소를 SKB-01-skill-concept-bridge-prod-populate로 분리 등재하고 depends_on에 추가했다 — SKB-01 done + 해소율이 0%를 벗어남을 재실측하기 전까지 이 태스크는 착수하지 않는다(acceptance②의 '기록 0건 상태에서 소비를 바꾸면 스킬 숙달 전파가 죽는다' 경고가 정확히 이 상태이므로). 참고: 같은 게이트를 겨냥한 EOS-43(미머지 브랜치)의 '격리 DB' 전략은 이번 prod 직접 실측 성공으로 전제가 무효화됐다(prod에 2026-09-09 0건이던 문제 코퍼스가 09-10 기준 실재 확인).\\n\\n[차단 이력 2026-09-01] 선행 실측 불가 — acceptance ②('writer 도달률이 관측 창에서 충분히 쌓인 뒤에만 전환')의 수치를 낼 수 없다. 실측: 컨테이너에 DATABASE_URL 미설정·5432/5433 리스너 0·docker 소켓 부재 → attempt_skill_event_reach_report는 스스로 '수치는 실 PG 채점 이력이 분모'라고 적으므로 빈 DB에서는 전 지표 측정 불가. writer(EOS-57)는 채점 경로 2곳(api/coach.py:1028·api/me.py:771)에 배선 실재하나 착지가 2026-08-30이라 관측 창이 2일이다. 기록 0건 상태에서 소비를 바꾸면 스킬 숙달 전파가 죽는다(EOS-57 writer docstring 명시 경고).\n\n[게이트 집행 2026-09-01] 두 세션이 독립으로 같은 차단 결론에 도달했고, claude/eos-migration-compliance-check-xu50yl(589a4143)이 게이트 G-eos63-skill-event-reach-sample[kiki]를 신설·requires_gates에 부착했다. 산문 조건은 셀렉터가 읽지 않으므로(selector는 depends_on·requires_gates만 본다) 게이트가 없으면 실측 없이 재착수될 수 있다 — EOS-62 notes의 '정본화≠집행 백로그 축' 선례 동형이며 HARN-52가 그 축을 일반화했다. unblock 트리거 = 게이트 clear.\n\n[스코프 정정 — 독립 실측] 소비 전환의 대상인 '스킬 축 분석·롤업' 소비처는 trunk에 아직 없다. 역할 기반 검색으로 concept→skill 런타임 재해소는 _assessed_skill_ids 1곳뿐이고 그 유일 호출자는 채점시점 record_problem_attempt_skill_mastery(=기록되는 사실의 생산자)다. 즉 전환 대상은 '기존 소비처 교체'가 아니라 '기록을 읽는 신규 롤업 신설'이며, 착수 세션은 스코프를 그렇게 잡아야 한다.\n\n[정정 2026-09-01] eos_priority null → P1: 판정표 R/E3 — 12월 검증 관여(KPI·계약·앵커 자산). EOS-80 일괄 백필\n\n[정정 2026-09-10] notes 치환 — G-eos63 실측 완료(2026-09-10, Kiki 실행·claude 진단) — acceptance②가 요구한 실측 수치를 notes에 남긴다. 판정=전환 보류(해소율 0%). 근본원인(skill_node·concept.behavior_skills prod 미적재)을 SKB-01로 분리 등재하고 그 완료를 새 선행으로 건다 — 게이트는 clear하되 착수 후보로 뜨지 않게 depends_on을 갱신한다.\n\n[재측정 완료 2026-09-18 · 판정=전환 가능 · SKB-01 acceptance④ 집행 · 판정 기준 main d99a4828(Kiki 실행 블록의 JUDGED_AGAINST_MAIN 출력 · worktree detached origin/main) · 게이트 G-skb01-resolution-remeasure cleared · 런북 docs/ops/g_skb01_resolution_remeasure_runbook.md] 위 2026-09-10 회차의 '전환 보류' 판정을 갱신한다. SKB-01이 브릿지 데이터 공백(skill_node 0행·concept.behavior_skills 전량 공백)을 해소한 뒤 같은 런북의 attempt_skill_reach_probe + attempt_skill_event_reach_report를 재실행한 실측(창 2026-09-18T05:57:41.637359+00:00): ATTEMPTS=20 EVENTS=20 · EMPTY=0 NONEMPTY=20 NULL=0 · WRITER_REACH=1.0 RESOLUTION=1.0 E2E=1.0 · PROBE_ACCEPTED=20 PROBE_FAILED=0 · CONCEPT_UPDATED_ATTEMPTS=20. 즉 해소율이 0.0에서 1.0으로 전환됐다(0/20 -> 20/20). 런북 §4-2 판정표의 '해소 >=1이 다수' 행이며 이 태스크 acceptance②에 주는 판정은 '전환 가능'이다 — acceptance②가 경고한 '기록 0건 상태에서 소비를 바꾸면 스킬 숙달 전파가 죽는다' 조건은 더 이상 성립하지 않는다(기록·해소 양쪽 100%).\n\n[해소 사슬 확정 2026-09-18] 같은 회차의 읽기 전용 사슬 진단 7행: A_problem_candidates=1703 · B_problem_concept_rows=1705 · C_problems_linked=1703 · D_candidates_resolvable=1655 · E_concept_nonempty_skills=1198 · F_skill_node_estimable=27 · G_concept_with_source_id=0. 해소 경로는 l2/skill_mastery_tracking.py의 _assessed_skill_ids이며 Concept.behavior_skills와 skill_node(mastery_estimable=True)의 조인이다 — atom_node·concept_content는 그 사슬에 등장하지 않는다. 두 테이블의 prod 적재(SKB-03·SKB-04가 각각 소유)는 그래서 이 태스크 착수를 막지 않는다 — 사슬 밖이다. 후보 문항의 97.2%(1655/1703)가 해소 가능 상태다.\n\n[잔여 미측정 — 착수 세션 유의] 이번 회차는 attempt_submit 경로만 태웠다(20/20 100%). coach_completion 경로는 분모 0이라 미측정이며 죽었다는 뜻이 아니다 — 소비 전환 설계 시 그 경로의 도달률은 별도로 확인해야 한다. 또한 스코프 정정 항(소비 전환 대상은 '기존 소비처 교체'가 아니라 '기록을 읽는 신규 롤업 신설')은 이번 측정으로 바뀌지 않았다. 프로브 표본 20건이 prod에 남아 있다(고정 사용자 c5de83b3-9143-58e8-a7a8-cf378801c065 소유 · 런북 §7-2로 정리 가능 · 무해).\n\n[정정 2026-09-21] notes 치환 — SKB-01 acceptance④ 집행 — G-skb01-resolution-remeasure(2026-09-18 cleared) 재측정 수치를 EOS-63 notes에 갱신. 해소율 0.0 -> 1.0 전환으로 2026-09-10 '전환 보류' 판정이 '전환 가능'으로 바뀜 + 해소 사슬 확정(두 테이블은 사슬 밖) + 잔여 미측정(coach_completion 분모 0) 고지"
