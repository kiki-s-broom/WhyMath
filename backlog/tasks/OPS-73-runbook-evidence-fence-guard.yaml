acceptance:
  - "① 규칙 신설 — 실행용 코드펜스에 **출력·주석 혼입 금지**를 `scripts/ops/check_ps_scripts.py`에 추가한다. 검출 대상 3종: (a) 프롬프트 접두(`$ `·`PS>`·`PS C:\\...>`) (b) 화살표 주석(`→`·`←` 뒤에 한국어 판정어가 오는 줄 — `→ 존재`·`→ 성공`) (c) 명령이 아닌 출력으로 보이는 줄(커밋 해시+메시지 형태 `^[0-9a-f]{7,40} `). 대상은 기존 `iter_powershell_blocks`가 이미 훑는 `docs/**/*.md`의 powershell 펜스 + `.claude/commands/*.md`\n② 변별력 양방향 실측 — 규칙마다 위반 샘플이 exit 1, 정상 샘플이 exit 0을 내는지 `tests/infra`로 동결한다. 기존 런북 자산 전건을 먼저 돌려 green인지 확인한 뒤에만 CI 차단으로 승격한다(OPS-57 ③·OPS-60 ⑤와 동일 규약). 정상 입력에서 통과하는 것은 보호의 증거가 아니다\n③ 오탐 우선 — `→`는 한국어 산문에서 흔하다. 주석(`#`) 안의 화살표와 문자열 리터럴 안의 화살표는 면제하고, 좁히는 쪽을 택한 뒤 **놓치는 형태를 도구 출력에 명시**한다(OPS-60 ⑥ 규약). 오탐이 있는 가드는 사람이 끄게 만든다\n④ 판정 범위의 정직한 명시 (필수 · 이 태스크의 핵심 한계) — **이 가드는 이번 사고의 실제 실패 표면을 덮지 못한다.** 사고는 세션이 *채팅으로* 낸 증거 블록에서 났고, CI는 채팅도 PR 본문도 보지 않는다. 이 가드가 덮는 것은 *저장소에 커밋된* 런북·커맨드 문서뿐이다. 그러므로 착지 시 도구 docstring과 리뷰 문서에 \"잡는 것 / 못 잡는 것\"을 표로 적어 과신을 막는다(OPS-57 ⑤⑥ 선례). 채팅 축의 유일한 방어선은 CLAUDE.md 규칙이며, 그 규칙은 이미 2회 실패했다는 사실을 함께 적는다\n⑤ 인접 표면 검토 — PR 본문 템플릿·`docs/reviews/**`에도 같은 형태가 실재하는지 전수 스캔하고(2026-09-10 PR #1093 본문이 그 실례다) 발견분을 같은 규칙으로 정정한다. 스캔 0건이면 \"내가 찾은 방법으로는 0건\"이라고 범위를 밝혀 적는다"
  - "①-정정: `scripts/ops/check_ps_scripts.py`에 규칙 3종을 추가했다(⑩ 셀 프롬프트 접두\n`$ `·`PS>`·`PS C:\\...>`, ⑪ 화살표(→/←) 뒤 한국어 판정어, ⑫ 커밋 해시+메시지 형태의\n줄). 세 규칙 모두 `check_runbook_markdown()`의 기존 row 루프에 편입했다(신규 함수 없이\n기존 `code`(strip_noncode 처리 후) 위에서 검사 — 주석·문자열 안의 화살표는 이미 blank\n처리돼 자연히 면제된다). `main()`의 기본 스캔 대상에 `.claude/commands/*.md`를\n추가했다(디렉터리 부재 시 조용히 skip).\n\n②-정정: 변별력 양방향 실측 — `tests/infra/test_ps_guard_runbook_rules.py`에 신규 클래스\n3개(`TestShellPromptPrefixInCode`·`TestArrowJudgementWordInCode`·`TestCommitHashLineInCode`,\n총 18 테스트)를 추가해 규칙별 위반 샘플 exit 1·정상 샘플 exit 0을 고정했다. 결함 주입\n검증: 세 규칙의 검사 블록을 통째로 제거 → 관련 테스트 7건 RED(3종 각각의 실측 사고\n재현 샘플 포함) → `cp` 백업으로 바이트 동일 복원 후 재확인 GREEN. 기존 자산\n전건(scripts/**/*.ps1 336건 중 .ps1 13건 + docs/**/*.md 33건 + .claude/commands/*.md 2건)이\n새 규칙에서 위반 0건임을 먼저 확인한 뒤 CI 차단으로 승격했다(`TestRepositoryAssetsStayGreen`\n확장 + `TestCommandsDirIsScannedByDefault` 신설로 `main()`의 커맨드 디렉터리 배선까지\n실동작으로 검증).\n\n③ 오탐 방지: 화살표 규칙은 판정어 목록(존재·부재·성공·실패·통과·거부·완료·정상·오류·\n없음·있음·진행중·중단·시작·종료·확인·발견·재현)에 매칭되는 경우만 잡는다 — \"A → B 흐름도\"\n같은 순수 설명 화살표는 통과(`test_arrow_without_judgement_word_passes`). 셀 프롬프트\n규칙은 `$이름`(변수) 형태와 겹치지 않게 `$ `(공백 필수)만 잡는다\n(`test_variable_assignment_passes`). 커밋 해시 규칙은 7자 미만 토큰은 통과시킨다\n(`test_short_token_below_minimum_length_passes`) — 놓치는 형태(백틱 줄바꿈으로 나뉜\n멀티라인 프롬프트·해시가 문자열 리터럴 안에 있지 않은 변형 등)는 도구 docstring에\n명시했다.\n\n④ 판정 범위의 정직한 명시 — 도구 docstring에 \"⑩~⑫가 잡는가\" 표를 신설했다: 커밋된\n`docs/**/*.md`·`.claude/commands/*.md`는 잡음, PR 본문(커밋 안 됨)·세션의 채팅 증거\n블록은 못 잡음(이 사고의 실제 발단이자 유일한 방어선은 CLAUDE.md 산문 규칙이며 이미\n2회 실패했다는 사실을 명기). 리뷰 문서(`docs/reviews/**`)는 `docs/**/*.md`에 포함돼\n잡히지만, PR 본문에서 커밋되지 않고 남는 리뷰 코멘트는 못 잡는다.\n\n⑤ 인접 표면 전수 스캔: `python3 scripts/ops/check_ps_scripts.py`(인자 없이 — 신규\n`.claude/commands/*.md` 포함)를 저장소 전체에 돌려 336건 검사·위반 0건을 확인했다.\n`.github/pull_request_template.md`·`.github/branch-protection-setup.md`도 별도로\n검사해 0건. 정직한 공백: 이것은 \"내가 찾은 방법(이 도구의 3종 정규식)으로는 0건\"이라는\n뜻이다 — PR 본문 자체(2026-09-10 PR #1093 실례)는 저장소 파일이 아니라 도구가\n구조적으로 스캔할 수 없다(acceptance④에 명기)."
