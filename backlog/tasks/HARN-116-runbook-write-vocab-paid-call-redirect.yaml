notes: "등재 경위(2026-09-19): EOS-118 게이트 집행(라이브 런북 작성) 중 발견. 새 런북을 쓰고 CI 잡 3종(`infra-contracts`의 `check_runbook_blocks.py` · `infra-shell`의 `check_ps_scripts.py` · `policy-guard`의 `cp949_guard.py`)을 로컬 재현해 전건 exit 0을 받았는데, CLAUDE.md 「스캔 0건은 실패」·「가드가 막는다는 주장도 주입으로 검증」에 따라 내 파일이 실제로 스캔 대상인지 주입으로 확인하다가 드러났다.\n\n핵심은 통과가 **거짓이 아니라 공허**했다는 것이다 — 파일은 스캔 대상에 들어 있고(글로브 `docs/ops/*runbook*.md` 13건에 포함), 문법·인코딩 축은 진짜로 검사됐다. 다만 자가거부 가드 축만 분류 단계에서 빠졌다. 그래서 \"가드 통과\"를 그 축의 증거로 읽으면 안 되는 상태였다.\n\n이 태스크는 EOS-118의 산출물이 아니다 — EOS-118 런북은 가드 유무와 무관하게 자가거부 블록을 갖고 있다. 여기서 상환하는 것은 **미래의 런북 저자가 가드 없이 유료 호출 블록을 써도 CI가 침묵한다**는 구조다.\n\n[정정 2026-09-21] 2회차 실측 등재 — EOS-02 런북에서 같은 미탐이 재현됐고 소급 범위가 3건으로 늘었다 (게이트 G-eos02-prompt-cache-live-run 실행 준비 중 발견). 중복 등재한 HARN-127 은 취소"
