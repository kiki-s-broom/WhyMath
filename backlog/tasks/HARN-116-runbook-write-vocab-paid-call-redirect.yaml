acceptance:
  - "① 분류 공백의 실측 고정 — `check_runbook_blocks.py`의 `_WRITE_COMMAND_TOKENS`에 유료 외부 호출·파일 리다이렉션 축이 없다. 실측(2026-09-19): `docs/ops/eos118_seat_signal_live_runbook.md`의 [C] 블록은 LLM 호출 10건(유료)을 내고 `cmd /c \"... > 파일\"`로 요약을 덮어쓰며 `--out` JSONL에 append하는데, 스캔은 그것을 쓰기 블록으로 세지 않는다 — 자가거부 가드 `if (...) { }`를 통째로 제거하는 뮤테이션을 넣어도 `위반 0건 / 판정: 통과`였고 집계 수치(`쓰기 블록 18개`)도 변하지 않았다.\n② 가드 자신은 멀쩡하다(대조군 확보) — 같은 세션에서 `docs/ops/skb03_atom_node_populate_runbook.md`의 실제 쓰기 가드(`if ($PathsOk -and $FlagOk) { `)를 제거하자 exit 1 + `[가드] ... 182행 쓰기 명령 populate`로 정확히 잡혔다. 즉 이 태스크가 고칠 것은 탐지 로직이 아니라 **쓰기 어휘의 범위**다.\n③ 최소 수정 후보(구현자 판단) — ⓐ 출력 리다이렉션(`cmd /c \"... > 파일\"`·`>`·`>>`) ⓑ `--out`/`--output` 인자를 받는 모듈 실행 ⓒ 유료 외부 호출을 뜻하는 라우팅 옵트인 동시 등장(`--subscription` + `--budget-krw`). 셋 다 넣을 필요는 없다 — 넣는 축마다 **오탐 대조군**을 픽스처에 함께 둔다(조회 전용 리다이렉션이 위반으로 잡히면 그 가드는 사람이 꺼 버린다).\n④ 실패 주입으로 검증 — 새로 잡게 된 축마다 ⓐ 가드 없는 픽스처에서 RED ⓑ 가드 있는 픽스처에서 GREEN 양방향을 단언한다. 정상 입력의 초록만으로는 보호의 증거가 아니다. 기존 런북 13건이 새 어휘로 무더기 위반이 되면 만료 있는 waiver로만 유예한다(만료 없는 그랜드파더 금지).\n⑤ 소급 적용 범위 명시 — `docs/ops/arch57_authoring_openrouter_runbook.md`의 [C]도 같은 형태(유료 호출 10건)이므로 같은 축에 걸린다. 두 런북 다 실제로는 자가거부 가드를 이미 갖고 있으므로 수정이 아니라 **검증 범위 편입**이다."
  - "⑥ 소급 범위 확장 + 2회차 실측(2026-09-21 · EOS-02 런북) — acceptance ⑤ 가 열거한 두 건(eos118 · arch57)에 docs/ops/eos02_prompt_cache_live_runbook.md 를 더한다. 그 런북 v2 의 회차 실행 블록(Sonnet 10호출 유료 · --out 파일 append · Tee-Object -FilePath 로 리포트 기록)에서 자가거부 가드 if (구Go) 를 제거하는 뮤테이션을 넣었는데 스캐너가 exit 0 통과를 냈고, 집계도 쓰기 블록 19개로 주입 전후 동일했다(런북 14건 전수 · 위반 0건). 즉 유료 저작 배치 런북 3건이 전부 이 축 밖에 있다. 파급: acceptance ③ 후보 중 ⓑ(--out 인자를 받는 모듈 실행)가 세 건을 한 번에 덮으므로 우선 후보다. 추가 어휘 단서: Tee-Object -FilePath 도 파일 쓰기인데 _WRITE_COMMAND_TOKENS 의 out-file 과 별개 토큰이라 잡히지 않는다."
