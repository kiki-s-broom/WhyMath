notes: "S4-57 설계(verifier_v2_domains.md §8 하위호환 검토 C1·C5·C6·C7·C8)의 결과로 등재. 단계 B 도메인 등록의 선행 정리이자 단계 A(S4-53)가 남긴 잠복 결함 정정이다. 2026-10-08 main c322bb9cb 코드 독해 기준이며 C1의 폴백 거동은 미실행이다. sequence_induction 구현(S4-66)은 자기 kind의 관점·DSL 제외 목록 등록을 스스로 하므로 이 태스크에 의존하지 않는다 — 단 둘 다 verifier.py와 cross_verify.py를 건드리므로 병렬 착수 시 파일 겹침을 조율한다. statistical_claim의 float 비교(math.isclose) 자체의 판정은 S4-58 소관이며 이 태스크에 넣지 않는다."
