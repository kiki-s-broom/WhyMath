  - "[정정 2026-09-29 — 기제 교체 · 분기 기준 main 120bd7c5] ①이 전제한 재생성 대상(커밋된 backlog/jit_index.json)이 HARN-130에서 없어졌다 — 사고를 등재한 PR끼리 그 파일에서 충돌했으므로 커밋을 중단하고 적시 주입 후보를 편집 시 대장에서 계산하게 했다. 그래서 ①의 문자 그대로(쓰기 직후 파일 재생성·실패 시 jit build 안내)는 이행할 대상이 없고, ①의 목적 두 가지는 구조적으로 성립한다: (가) 쓰기 뒤 주입이 낡지 않는다 — 읽는 쪽이 대장을 직접 본다 (나) 재생성을 잊어 CI가 red가 되는 경로가 없다 — CI jit check는 이제 커밋 파일 대조가 아니라 '대장에서 계산되는가'(0건·스키마 위반 red)를 보므로 사고 등재가 그 스텝을 red로 만들 수 없다. 옛 안내대로 jit build를 돌려도 파일을 만들지 않고 같은 검사만 한다. ② 변별력은 같은 의도로 재정의했다: tests/harness/test_jit_rules.py::TestLedgerWritesNeedNoRebuild — hermetic 저장소에서 incident add 직후 다른 명령 없이 다음 편집의 주입에 새 사고가 뜨고 jit check가 exit 0이며, 상환 태스크의 paths를 amend하면 주입이 새 경로로 옮겨 가고 옛 경로에서는 사라진다(대조). 훅이 저장된 파일을 읽게 되돌리는 뮤테이션 J01(scripts/harness/verify_incident_shard_discrimination.py)을 주입하면 두 테스트가 모두 RED다(실측: 대조 2 passed · 주입 2 failed · 주입 적용·원복 sha256 단언 통과). ③ 경계 — 훅의 데이터 원천 교체는 HARN-130이 paths 정정 기록과 함께 소유했고, 이 태스크가 더한 것은 쓰기 쪽 관점의 테스트뿐이다."
  - "[추가 2026-09-29 — 규칙 축 · 판정 기준 이 PR head `2b2a4faf`] 규칙의 `enforced_by`가 가리키는 태스크의 paths도 주입 경로다(열린 PR #1377·#1382가 각각 ④로 따로 실측한 축). 편집 시 대장에서 계산하므로 그 태스크의 `amend --path`도 재생성 없이 다음 편집에 반영된다 — `tests/harness/test_jit_rules.py::TestLedgerWritesNeedNoRebuild::test_rule_enforcer_path_amend_moves_the_injection_immediately`가 동결(양성 대조: 옮기기 전 옛 경로에 뜬다). 변별력: 규칙만 첫 스냅숏을 쓰는 주입(M3)과 규칙이 태스크 참조를 풀지 않는 주입(M2)에서 이 테스트가 RED, 같은 M3에서 사고 축 테스트(`test_task_path_amend_moves_the_injection_immediately`)는 GREEN — 규칙 축은 이 테스트만 지킨다"
