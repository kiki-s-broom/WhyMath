  - "ADMIN-16 판정(docs/reviews/admin16_review_status_bypass_judgment_2026-10-08.md §3): privacy_audit의 불변성은 관례일 뿐 DB 장치가 없다(앱 계정이 UPDATE·DELETE 전권). src/에는 UPDATE·DELETE 경로가 0건이고 보존·파기에서도 의도적으로 제외돼 있으므로(retention.py ADMIN-03·보존 연한은 MGMT-02 선행) 합법 변경 경로가 현재 없다. 집행: ①alembic 마이그레이션으로 privacy_audit에 BEFORE UPDATE 트리거(항상 예외)와 BEFORE DELETE 트리거(승인된 파기 경로 GUC가 켜진 트랜잭션만 허용 — 파기 job은 MGMT-02 이후)를 건다. deletion_audit도 같은 판정을 따를지 이 태스크가 결정해 기록한다 ②실 PG 통합 테스트 6곳(test_loop_kpi_gate_integration·test_role_grant_cli_integration·test_operator_token_cli_integration·test_loop_kpi_sample_path_integration·test_privacy_audit_integration·test_admin_review_transitions_integration)의 정리용 DELETE FROM privacy_audit가 트리거에 막히므로 각자 우회 없이 통과하도록 정리 방식을 바꾼다 ③UPDATE·DELETE 주입이 예외를 내는 실 PG 테스트와 마이그레이션 왕복·KNOWN_REVISIONS·prod 스키마 프로브 귀속 ④한계를 문서에 명시: 트리거는 DB 소유자·슈퍼유저가 끌 수 있어 변조 방지가 아니라 사고 방지이며 근본 방어는 앱 계정 권한 분리(REVOKE)다. 헌법 R23-01(이벤트 테이블 추가 전용)·R7-02(DB 수준 전이 집행)와 같은 방향임을 근거로 적는다."
