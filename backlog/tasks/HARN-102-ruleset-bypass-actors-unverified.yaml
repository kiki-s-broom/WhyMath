acceptance:
  - "① 실측 — gh api repos/kiki-s-broom/WhyMath/rulesets/16623542 (룰셋 전문·admin 뷰)를 받아 bypass_actors 배열을 전건 기록한다. 수집은 반드시 cmd /c 경유(파이프 금지 — 2026-09-14 cp949 유실 사고). 빈 배열이면 관리자도 우회 불가 = 클래식 enforce_admins=true와 등가이고 소실은 0이다. 비어 있지 않으면 각 항목의 actor_type·bypass_mode를 적는다.\n② 판정 — ①이 비어 있지 않으면 '클래식 삭제로 관리자 우회가 실제로 열렸는가'를 판정한다. 주의: 룰셋에서 repository admin이 기본 bypass 대상으로 잡혀 있을 수 있는데, 그 경우 2026-09-14 클래식 삭제가 보호를 한 축 낮춘 것이 된다. 그 사실 자체가 이 태스크의 산출물이며, 되돌릴지(룰셋 bypass_actors 비우기)는 Kiki 결정 사항으로 게이트에 올린다 — 세션이 정할 일이 아니다.\n③ 선언 편입 판정 — bypass_actors를 .github/branch-protection-setup.md의 RULESET_POLICY 블록에 선언 축으로 넣을지 정한다. 넣으면 ruleset_drift.py가 기계로 감시한다. 넣지 않기로 하면 '왜 감시하지 않는가'를 문서에 적는다 — 감시 안 하는 축을 조용히 두면 다음 사람이 감시되는 줄 안다.\n④ 판정기 확장(③이 편입이면) — parse_live가 /rules/branches/main 응답만 읽는데 bypass_actors는 거기 없다. 어느 엔드포인트를 정본으로 할지(=런북이 무엇을 수집할지) 함께 정하고, 엔드포인트가 바뀌면 런북·문서·테스트 3곳을 같이 고친다.\n⑤ 변별력 — 어떤 판정을 넣든 결함 주입으로 RED를 확인한다. bypass_actors가 비어 있는 정상 입력에서 초록인 것은 보호의 증거가 아니다(CLAUDE.md 2026-09-01)."
  - "[③④⑤ 종결 2026-09-15] ③ 판정 = **편입한다**. 근거: 이 저장소의 브랜치 보호 사고 3회(2026-07-26 x2 · 2026-09-03)가 전부 *보호가 없는데 화면이 초록인* 형태였고, bypass_actors는 그 중에서도 다른 모든 축을 한 번에 무력화하는 축이다(우회 주체는 required check 16건·리뷰·linear history를 전부 건너뛴다). 2026-09-14 실측은 한 시점의 스냅샷이었고 판정기가 읽지 않는 한 나중에 채워져도 화면은 초록이므로, 스냅샷을 상시 판정으로 승격시킨다. 선언 축 3줄을 RULESET_POLICY 블록에 추가 — `ruleset_bypass_actor_count` = 0 · `ruleset_enforcement` = active · `ruleset_id` = 16623542(대조 축이 아니라 입력 신원 확인용 파라미터, required_check_integration_id와 같은 취급).\n④ 엔드포인트 정본 = **둘 다**. /rules/branches/main은 \"main에 지금 적용되는 규칙\"(체크 목록·정책 파라미터의 정본), /rulesets/16623542는 \"그 룰셋 자체의 정의\"(bypass_actors·enforcement가 여기에만 있음). 질문이 다르므로 한쪽이 다른 쪽을 대신할 수 없다. 판정기가 두 번째 입력을 --ruleset-full 플래그로 받고, **선언은 있는데 입력이 없으면 exit 2(측정 실패)**다 — 빠진 입력을 위반 0으로 접으면 이 도구가 막으려는 형태를 스스로 만든다. 룰셋 id 하드코딩은 감수한다: id가 바뀌면 수집이 404를 받고 gh가 오류 본문을 파일에 쓰므로 판정기가 id 없는 객체를 보고 exit 2를 낸다(조용한 오답이 아니라 시끄러운 실패). /rulesets 목록에서 이름으로 찾는 대안은 cmd /c 안에 --jq를 중첩 따옴표로 감싸야 해 런북 자체가 깨지기 쉬운 반면 얻는 것은 \"id가 바뀌어도 조용히 동작\"뿐이라 미채택. id 변경 시 고칠 3곳(문서 선언·런북 블록·ruleset_drift.RULESET_ID)의 일치는 test_declared_ruleset_id_matches_the_runbook_constant가 기계로 동결.\n⑤ 변별력 = 뮤테이션 13종 전건 RED(셸 배제 순수 Python 하네스 · 주입 적용 단언 + 원복 sha256 동일 단언). 축: 키 부재를 0으로 접음 · id 불일치 무시 · enforcement 부재 무시 · 선언 있는데 입력 없음을 통과로 · 우회 주체 상세 문구 제거 · 시정 순서 제거 · FULL_RULESET_KEYS 비움 · 문서 선언 줄 삭제 · 런북 상수에서 플래그 제거 · 문서 런북 수집 줄 삭제 · merge가 전문 파라미터 폐기 · **과잉 수정 대조군**(parse_ruleset_full 상시 실패 -> 정상 상태가 RED) · 문서 ruleset_id 삭제. 신규 테스트 22건 포함 test_ruleset_drift.py 83건 통과 · tests/infra 1374 passed/1 skipped · tests/harness 831 passed · ruff/black(py3.12) 전건 통과.\n[범위 명시 — 남기는 것] 이 PR은 **판정 경로만** 넓혔고 라이브 재측정은 하지 않았다(세션 토큰은 /rulesets/{id}에 403). 기록 파일 .github/ruleset-check-state.json의 마지막 verdict=ok는 2026-09-14의 단일 입력 실행이 쓴 것이라 지금은 측정하지 않은 축까지 통과로 읽힌다 — 손편집 금지 파일이라 실행 1회로만 닫힌다. 그 범위 불일치를 게이트 `G-ruleset-bypass-actors-live-watch`(kiki/human·14일)가 소유하며, **머지 후** 6항목 브리핑과 함께 실행 블록을 안내한다(미머지 상태에서 안내하면 Kiki 체크아웃에 --ruleset-full 인자가 없어 argparse 오류)."
