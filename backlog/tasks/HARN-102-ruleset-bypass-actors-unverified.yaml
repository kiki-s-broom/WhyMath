notes: "발견 경위(2026-09-14): 게이트 G-strict-policy-and-classic-cleanup의 A안 집행으로 클래식 브랜치 보호를 삭제하기 직전, 원문을 덤프해 룰셋과 축별로 대조했다. 12개 축 중 11개는 룰셋이 덮거나 원래 꺼져 있어 소실이 0이었는데, enforce_admins=true 하나만 대응이 확인되지 않았다.\n\n왜 확인 못 했는가: 룰셋에서 그 역할을 하는 것은 bypass_actors인데, 이번에 수집한 GET /repos/{owner}/{repo}/rules/branches/main 응답에는 *적용되는 규칙 목록*만 들어 있고 bypass_actors가 없다. 그것은 GET /repos/{owner}/{repo}/rulesets/{id}(admin 뷰)에서 나온다. 세션 토큰으로는 둘 다 읽을 수 없어 Kiki 머신 실행이 필요하다.\n\n왜 게이트를 막지 않고 분리했는가: 게이트가 물은 두 축(① strict 정책 결정 ② 클래식 삭제)은 둘 다 완료됐고, 이 축은 게이트가 묻지 않은 새 발견이다. 게이트 등재 세션(2026-09-10)은 필수 체크 목록과 merge queue만 대조했다 — 클래식의 비-체크 축은 아무도 보지 않았다. 그 공백을 게이트 clear 증적에 명시하고 승계 태스크로 분리한다(CLAUDE.md '회수로 태스크 done 선언 시 acceptance 전수 재대조' 축의 게이트판).\n\n위험의 성격: 최악의 경우 '관리자 우회 금지'가 조용히 풀린 상태다. 1인 개발 단계라 실무 영향은 작을 수 있으나, 보호가 줄었는데 아무도 모르는 것과 줄지 않은 것은 다르다 — 그 구분을 짓는 것이 이 태스크다.\n\n인접: HARN-63이 룰셋 드리프트 감시의 선언 축을 소유한다. 이 태스크가 bypass_actors를 선언에 편입하기로 판정하면 그쪽 계약이 넓어진다.\n\n[정정 2026-09-14] acceptance ①(bypass_actors 실측)은 Kiki 머신의 gh 토큰이 있어야 성립한다 — 세션 토큰은 /rulesets/{id}·/branches/main/protection 양쪽 모두 403이다. 산문이 아니라 대장에 집행한다(HARN-52 축) — 그러지 않으면 selector가 즉시 착수 후보로 계산해 착수 세션이 첫 acceptance에서 막힌다.\n\n[정정 2026-09-14] [실측 착지 2026-09-14 · acceptance ①·② 종결] Kiki 머신에서 cmd /c \"gh api repos/kiki-s-broom/WhyMath/rulesets/16623542 > ruleset-full.json\" 실행 → bypass_actors 건수 0 · 배열 []. 빈 배열 = 우회 주체 0명 = 관리자에게도 규칙 적용 = 클래식 enforce_admins=true와 등가. 따라서 **클래식 삭제로 소실된 보호 축은 0개**이고 12축 대조표의 마지막 미확인 칸이 닫혔다(.github/branch-protection-setup.md \"삭제 직전 실측\" 표 갱신 · PR #1161). acceptance ②(되돌림 판정)는 전제(비어 있지 않음) 미성립으로 **해당 없음**이 됐다 — 되돌릴 것이 없다.\n\n[남는 범위 — 이 태스크가 계속 소유하는 것] ③ 선언 편입 판정 · ④ 편입 시 판정기 엔드포인트 정본 결정 · ⑤ 결함 주입 변별력. 핵심은 **지금 안전한 것과 그 상태가 감시되는 것이 다르다**는 점이다: ruleset_drift.py는 /rules/branches/main만 읽고 그 응답에 bypass_actors가 없으므로, 나중에 누군가 bypass_actors를 채워도 기계는 조용하다. 즉 이 실측은 *한 시점의 스냅샷*이지 상시 보호가 아니다.\n\n[④의 실무 제약 — 착수 세션이 먼저 알아야 할 것] 편입하면 런북이 수집할 엔드포인트가 1개에서 2개로 늘어난다(/rules/branches/main + /rulesets/{id}). 룰셋 id 16623542가 명령에 하드코딩되는데 룰셋을 지웠다 다시 만들면 id가 바뀐다 — 그 취약성을 감수할지, /rulesets 목록에서 이름으로 찾을지도 ④에서 함께 정한다. 수집은 어느 쪽이든 cmd /c 경유여야 한다(파이프 금지 — 2026-09-14 cp949 41자 유실 실측).\n\n[범위 명시] 룰셋 enforcement 필드는 이번 출력에 담기지 않았다. /rules/branches/main이 규칙 16건을 반환했고 그 엔드포인트는 활성 룰셋의 규칙만 돌려주므로 enforcement=active는 성립하나, 이는 필드를 직접 읽은 것이 아니라 API 의미를 읽어 추론한 것이다.\n\n[정정 2026-09-15] HARN-102 ③④⑤ 판정·집행 결과 등재"
