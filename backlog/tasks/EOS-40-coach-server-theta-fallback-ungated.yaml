  - "① 실측 고정(2026-09-29 · `EOS-147-all-correct-theta-upper-pin`의 독립 교수학 비판 보고 · **코드를 읽어서 그렇게 보인다 — 주입 실측은 하지 않았다**): `api/coach.py`의 서버 θ 조회(`_server_theta_for` — 1725~1728행 부근)는 개념별 θ가 불신뢰하면(`_theta_reading_reliable` — 응답 3건 이상이고 SE 1.0 이하) 전과목 스냅샷 θ로 폴백하는데, 그 폴백에는 같은 게이트가 없다(`l4_server_theta_enabled` 기본 True). `_ability_level`(618~630행 부근)은 BKT와 θ 프록시를 평균해 힌트 단계·Polya 전이·LTHC 라벨을 정한다 — docstring은 \"이미 게이트를 통과한 θ\"라고 적었지만 폴백 경로는 통과하지 않는다. 전부 정답 학습자가 스냅샷을 갖고 있으면(세션 종료 PATCH·수동 POST 뒤) 발산 경계 θ=4.0(프록시 0.982 — 측정값이 아니라 클램프)이 코치 결정에 들어갈 수 있다. 모바일은 스냅샷 호출이 없어 앱 학생에게는 잠재이고 API 클라이언트에게는 활성이다."
  - "② 재현이 먼저다: 전부 정답 이력 + 개념 θ 불신뢰 + 전과목 스냅샷 보유 상태를 실 PG(또는 hermetic)로 만들어 ①이 실제로 일어나는지 본다. 재현되지 않으면 결함이 아니라는 근거를 남기고 종결한다. 재현되면 처분을 판정한다 — (가) 폴백에도 신뢰 게이트를 건다 (나) 발산 경계 θ(±4.0 — `l2/irt.py::ability_boundary`가 응답에서 판정)를 코치 신호에서 제외한다 (다) 둘 다. 변별력: 전부 정답 스냅샷 픽스처에서 코치 결정이 경계 θ로 움직이지 않는 것, 대조군(혼합 이력 스냅샷은 종전대로 사용)이 함께 서야 한다. 집행 지점은 별항으로 적는다 — 게이트가 `_server_theta_for`의 두 경로 모두에서 실제로 불리는지."
  - "③ [EOS-178 근거 추가 · 2026-10-06 · 주입 없이 추정기 함수 수준에서 확인 — DB 왕복은 하지 않았다] 전과목 θ 스냅샷은 **경계 θ(전부 정답 4.0·전부 오답 −4.0)도 적재된다**: `l2/ability_estimation.estimate_global_ability`는 SE를 정보 0(응답 없음)일 때만 None으로 내고(`math.isinf(se)` → None) 전부 정답 3건의 SE는 4.344(b=0)로 유한하다. 그래서 `l2/ability_snapshot_capture.capture_global_ability_if_due`의 UNRELIABLE 분기(`se is None`)가 경계 이력을 막지 않는다 — 같은 모듈 docstring의 \"전부 정답이면 θ가 극단이고 SE는 None이라\"는 서술은 **클램프된 θ에 거짓**이다. `tests/backend/l2/test_ability_snapshot_capture.py::test_unmeasurable_standard_error_is_not_captured`는 `estimate_global_ability`를 (4.0, None, 3)으로 가짜 주입해 통과하므로 실제 경로를 검증하지 않는다(가짜 시임이 실물과 어긋난 사례). 결과: ①의 \"앱 학생에게는 잠재\"는 EOS-125 이후 활성일 가능성이 높다 — 재현(②)을 실 PG로 하면 이 사실부터 확인한다. 근거: `docs/reviews/eos178_beginner_label_hint_judgment_2026-10-06.md` §1·§9 #8 · `scripts/analysis/eos178_label_trajectory.py`(경계 θ 적재 반영)."
