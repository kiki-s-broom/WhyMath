acceptance:
  - "① 실패 고정 — 세션이 백그라운드로 돌리는 검사 래퍼 셸 스크립트를 실행 중에 편집하면 bash가 파일을 오프셋 기준으로 다시 읽어 잘린 줄을 실행한다(2026-10-09 실측: 편집된 래퍼가 pytest를 한 번 더 깨진 형태로 실행해 exit 127, 첫 pytest 로그를 덮어써 판정 소실). 이 상태를 재현하는 테스트를 먼저 둔다(실행 중 스크립트 편집 → 결과 파일 덮어쓰기·추가 실행이 관측됨).\n② 대책(코드) — 하네스가 제공하는 래퍼 실행 경로가 스크립트를 실행 직전에 고정 사본(내용 해시 이름)으로 떠서 그 사본을 실행한다. 원본이 실행 도중 바뀌어도 사본 실행 결과가 바뀌지 않음을 ①의 재현으로 보인다(대조군: 원본 직접 실행은 ①처럼 오염).\n③ 집행 지점 — 세션이 장기 검사를 돌리는 표준 경로(예: scripts/harness 안 헬퍼 또는 ci_mirror 확장)를 하나 정하고, 실행 중 원본 스크립트가 바뀌면 결과에 '원본 변경됨'을 남긴다(침묵 금지). 뮤테이션 주입 적용·원복 단언 규율과 같은 방식으로 실행 전후 원본 해시를 비교한다."
