  - "① 교란 변수 먼저 배제 — 좌석별 샘플링 파라미터(temperature·top_p 등)가 실제로 같은지 코드·설정에서 실측 확인한다. 다르면 다양성 차이는 모델 특성이 아니라 **설정 차이**이며 그 상태의 비교는 무효다. 맞춘 뒤 재측정한다. 이 항이 ②보다 앞에 오는 이유: 설정 차이를 배제하지 않고 측정하면 어떤 숫자가 나와도 원인을 지목할 수 없고, 그러면 측정 회차를 태우고도 판정이 안 선다.\n② 표본 확대 재측정 — 좌석당 최소 30회 x spec 3종 이상에서 outcome_counts의 rejected_duplicate 비율을 좌석별로 잰다. EOS-118의 n=5 단일 주제 1회차는 **근거이지 결론이 아니다**(그 회차는 좌석 신호 작동 확인이 목적이었고 다양성은 부수 관측이다). spec를 3종 이상 두는 것은 단일 topic_hint·단일 성취기준에서만 나는 현상인지 가르기 위해서다.\n③ 회차 내 중복의 메커니즘 확인 — 관측된 중복이 **회차 내**(orchestrator.py:299가 회차 중 signature_index를 키운다) 발생인지 기존 코퍼스와의 중복인지 구분해 기록한다. 둘은 원인도 처방도 다르다 — 전자는 생성 다양성, 후자는 dedup 인덱스 누적의 정상 동작이다. EOS-118 회차는 seeds 0건·out 파일 부재였으므로 전자로 읽히지만 그것도 확정 기록 대상이다.\n④ 작동 신호 추가 여부는 측정 **뒤에** 판정 — 회차 요약이 이미 outcome_counts로 rejected_duplicate를 내므로 값 자체는 보인다. 좌석별 중복률을 cloud_seat 블록이나 회차 대장에 승격할지는 ②의 결과를 보고 정한다. 미측정 상태에서 지표부터 늘리지 않는다(작동 신호 없는 알고리즘 부착 금지의 지표 축).\n⑤ 판정과 파급 — 차이가 재현되면 저작 배치의 **실효 단가**가 좌석마다 달라진다(호출 5건 중 4건 폐기 = 수용 1건당 비용 5배). 그 경우 ARCH-55 4회차 실측의 비용 비교에 이 축을 병기해야 하며, 상시 채택 판정(ARCH-56 · 게이트 G-arch56-availability-trigger)의 재료가 된다. 재현되지 않으면 '표본 5의 우연'으로 기록하고 닫는다 — 실패도 산출물이며 폐기하지 않는다.\n⑥ 근거(실측) — EOS-118 라이브 2회차, 판정 기준 main 412ccb71, 2026-09-19 Phaiakes9. openrouter: attempted=5 accepted=5 appended=5 outcome_counts={accepted_stored:5}. anthropic: attempted=5 accepted=1 appended=1 outcome_counts={accepted_stored:1, rejected_duplicate:4}. 같은 CLI 인자(--n 5 --subscription premium --budget-krw 5000), 같은 기본 spec(난이도 2.5), 같은 topic_hint. 두 회차 모두 LLM 호출 5건 전건 성공(succeeded=5 failed=0)이므로 중복은 호출 실패가 아니라 **생성 내용**의 문제다."
