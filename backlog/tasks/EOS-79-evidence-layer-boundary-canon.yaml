  - "② 현행 코드 귀속표: 실재 모델(attempt_event·AnswerSubmission·evidence_event·ConceptMasteryHistory·SkillMasteryHistory·verified_solution·student_solution_step 등)을 4층 중 하나로 배정한다. 판정 불가는 '혼재'로 **그대로** 적는다 — 날조 금지(EOS-65 경계표 선례)"
  - "③ 집행 별항(정본화≠집행): 이 문서만으로는 아무것도 강제되지 않음을 머리에 명기한다. 기계 대조 지점이 있으면 그것을 적고, **없으면 '기계 집행 없음'을 명시**한다 — 있는 척 금지"
  - "④ 반례 처리: 4층에 안 들어가는 실재 모델이 나오면 **층을 늘리지 말고** 그 모델이 왜 예외인지 적는다(층 폭발 방지 — 관계 타입 폭발 금지의 동형). 층을 늘려야 한다고 판단하면 그 근거를 별항으로"
