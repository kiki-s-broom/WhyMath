acceptance:
  - "실측(분모와 분자): CI backend-migrations 잡의 통합 스텝은 pytest -m integration --ignore=../../tests/backend/l3 이라 tests/backend/l3 하위 integration 마커 테스트는 어떤 CI 스텝에서도 수집되지 않는다. 2026-10-13 같은 명령의 --collect-only 실측에서 test_publish_gate_integration.py 수집 0건 · l3 하위 수집 0건이었다. 분모 = l3 하위 integration 마커 파일 9개(test_publish_gate_integration · equivalent/test_orchestrator_integration · pedagogy/test_diag_item_projector_integration · test_anthropic_integration · test_celery_integration · test_langfuse_integration · test_ollama_integration · test_redis_integration · test_visualization_live). 이 중 키워드 grep상 외부 서비스 언급이 없어 PG만 필요할 가능성이 있는 것은 앞 3개이나 이는 추정이다 — 파일마다 실제 외부 의존(Ollama·Redis·Langfuse·Anthropic·Celery)을 읽어 확정하고 표로 남긴다."
  - "처분: PG만 필요한 파일은 (가) tests/backend/db 등 CI가 수집하는 위치로 옮기거나 (나) CI 통합 스텝에 해당 파일만 편입한다 — 근거와 함께 하나를 고른다. 외부 서비스가 필요한 파일은 현행처럼 제외하되 제외 사유를 파일 단위로 선언한다(--ignore 디렉터리 일괄 제외가 PG만 필요한 파일까지 가리는 것이 이 결함의 원인이다)."
  - "정정: pipeline.yaml의 concept_version_publish 주석이 test_publish_gate_integration.py를 CI backend-migrations 잡에서 도는 것처럼 적고 있다. 실측과 맞지 않으므로 처분 결과에 맞춰 정정한다. 배선 동결: 편입한 파일이 CI 수집 명령에서 실제로 수집됨을 tests/infra의 배선 테스트(test_gate_harness_marker_reach_wiring.py 계열)가 기계로 고정한다."
