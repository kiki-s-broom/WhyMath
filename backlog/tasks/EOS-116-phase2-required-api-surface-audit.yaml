notes: "출처: 계획서 300 Phase 2 집행 지시문 16/21 [항목 P-11] 필수 API 표면 정리(원 문서 §12) · Week 4(10/19~10/25). 완료 판정 = \"12개 표면의 실측 표가 있고, 5단계 내부 연결이 테스트로 동결됐다\".\n대장 정합: docs/strategy/plan300_phase2_backlog_crosswalk.md §11.2가 P-11을 \"신규 등재(12종 중 유일 갭) → EOS-10\"으로 처분했으나, EOS-10(done·PR #1184)이 소유한 것은 **12종 중 1종(GET /learner-state) 신설**이며 P-11의 두 산출물(12종 전수 실측 표 · 5단계 연결 동결 테스트)은 그 acceptance 5항 어디에도 없다. 즉 P-11은 부분 수렴이며 잔여 2축은 소유자 0건이다.\n인접 착지 구분: EOS-106(done·PR #1194)은 Week 1 Gate **판정**으로 1사이클 완주(tests/backend/api/test_week1_gate_closed_loop.py)를 본다 — 그것은 \"DB 직접 수정 없이 공개 API로 완주하는가\"라는 게이트 축이고, 이 태스크는 \"§12가 지정한 12 표면이 실재하는가 + 5단계 전파가 동결됐는가\"라는 표면·전파 축이다. 중복이면 실측으로 확인해 기존충족을 선언하고 빈 차이만 채운다(새 테스트 중복 생성 금지)."
