acceptance:
  - "① 실측 표: 계획서 300 §12 필수 API 12종(POST /diagnostics · GET /learner-state · GET /learning/next · GET /concepts/{id} · GET /contents/{id} · GET /problems/{id} · POST /attempts · POST /assessments · GET /recommendations/next · POST /tutor/query · GET /sessions/{id} · GET /learning/result)에 대해 \"있음 / 다른 이름으로 있음 / 없음\"을 trunk 실측으로 판정한 표가 저장소에 있다. 판정 기준 커밋 해시를 표 상단에 박는다. 근거는 라우터 경로 실측(추론 금지)이다.\n② 개명 금지: 이름이 다른 것은 개명하지 않고 매핑표(계획서 이름 → 실제 경로)로 처리한다. 개명이 필요하다고 판단되면 근거를 적고 Kiki에게 묻는다(세션이 임의 개명 0건).\n③ 핵심 판정 — 5단계 내부 연결 동결: Attempt → Event → Assessment → LearnerState → Recommendation 이 내부에서 실제로 이어지는지를 개별 API가 아니라 **연결**로 보는 통합 테스트가 실재하고 CI에서 돈다. 각 단계의 산출이 다음 단계의 입력으로 실제 전파되는지를 단언한다(200 응답만으로 통과 금지 — \"작동한 비율\" 원칙).\n④ 변별력 주입: ③의 테스트가 보호인지 확인한다. 5단계 각 연결을 하나씩 끊는 뮤테이션을 주입해 전건 RED를 확인하고, 주입이 실제 적용됐는지(mutated != original)를 단언한다. 정상 입력 GREEN은 증거가 아니다.\n⑤ 빠진 API는 최소 형태로만 채운다. 응답 스키마를 풍부하게 만들지 않는다(없는 것을 새로 만들 필요가 있으면 그 판정 근거를 실측 표에 적는다).\n⑥ 범위 규율: 이 항목 밖 코드를 함께 고치지 않는다. 발견한 별건은 backlog.py add로 등재만 한다."
