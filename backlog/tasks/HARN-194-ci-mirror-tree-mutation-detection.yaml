  - "① `scripts/harness/ci_mirror.py run`이 시작과 끝에 작업 트리 지문(HEAD · `git status --porcelain` · 추적 파일 diff 해시)을 잡고, 둘이 다르면 결과를 **오염(tainted)**으로 표기한다 — 요약 줄에 바뀐 경로를 열거하고, 결과 JSON(`.claude/cache/ci_mirror.json`)에 `tainted: true`를 싣고, 통과와 다른 종료 코드를 낸다.\n② 도구 자신이 만드는 알려진 변경(하네스 테스트의 이벤트 대장 누수 — `HARN-170`)은 오염과 **따로** 분류해 보고한다 — 침묵시키지도, 오염으로 뭉개지도 않는다(상시 발화하는 경고는 소음이 되어 무력해진다).\n③ `backlog.py done`의 미러 신선도 검사가 오염된 결과를 \"측정되지 않음\"으로 취급한다.\n④ 변별력 — 실행 도중 파일을 바꾸는 가짜 실행에서 오염이 잡히고, 바꾸지 않는 실행에서는 잡히지 않는다(양쪽 픽스처 · 주입 확인)."
