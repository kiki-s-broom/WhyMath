  - "① 실측 고정(2026-09-29 · 분기 기준 main 120bd7c5) — 세션 claude/fervent-goldberg-s8y8ws에서 start 3회(HARN-130·HARN-179·HARN-170)가 모두 exit 0으로 같은 세션에 in_progress 3건을 썼고, 그 뒤 amend가 '스키마/무결성 위반으로 정정 거부'(1세션=1태스크)로 막혔다. 해소는 unblock 2회였다. validate·Stop 훅(HARN-50)·SessionStart 브리핑(무결성 경고)은 사후에 잡았지만 start 자신은 쓰기 전에 이 규칙을 보지 않는다 — cmd_start는 store.save_task 전에 같은 세션의 기존 in_progress를 확인하지 않고, 쓰기 뒤 무결성 검사도 거치지 않는다(amend·add·gates 쓰기 경로는 쓰기 전 validate로 거부한다).\n② start가 쓰기 전에 같은 세션의 기존 in_progress 태스크를 검사해 거부(exit 1 · 대장 무변경)하고, 해소 경로(그 태스크의 review·done·unblock 명령)를 함께 낸다. 다른 쓰기 CLI처럼 쓰기 전 validate를 거치게 하는 방안과 비교해 택하고 근거를 docstring에 적는다.\n③ 변별력 — hermetic 저장소에서 두 번째 start가 exit 1이고 대장 바이트가 그대로다. 첫 태스크를 review로 옮기면 두 번째 start가 통과한다(대조군). 검사를 제거하는 뮤테이션에서 RED(주입 적용·원복 단언)."
