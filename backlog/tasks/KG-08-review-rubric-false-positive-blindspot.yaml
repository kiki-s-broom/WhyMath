acceptance:
  - "① 깨끗한 대조군 주입 — `_injected_defects()`가 결함 레코드만 2건 만든다. 여기에 **확실히 통과해야 하는** 대조 레코드를 함께 주입하고, 리포트가 `false_positive`(대조군을 결함으로 찍은 수)를 별도 집계한다. 대조 레코드는 결함 레코드와 같은 경로로 rubric을 통과하되 정답이 반대인 쌍이어야 한다."
  - "② 게이트 판정을 두 방향으로 분리 — 현행 exit 1 조건은 `missed_injected > 0`(오탐지) 또는 결함율 상한 초과 둘뿐이다. 여기에 **오검출 상한**을 더한다. 대조군을 결함으로 찍으면 그것도 exit 1이어야 하며, 리포트가 어느 방향으로 실패했는지 말해야 한다(두 실패를 같은 숫자로 보고하지 않는다)."
  - "③ 해석 가능성 복원 — 2026-09-23 1회차 실측(표본 52건 중 결함 33건 · Wilson 상한 73.5% · 누락 주입 결함 0)이 **콘텐츠 품질인지 rubric 과민인지 가릴 수 없었다**. 이 태스크 완료 후 같은 회차를 다시 돌려 그 63.5%가 어느 쪽이었는지 판정한다. S4-16 측정 이력(오검출이 60% 아래로 내려온 적 없음)과 수치대가 겹치므로 과민 가설이 유력하나, 유력함은 측정이 아니다."
  - "④ 변별력 — 대조군 집계를 지우는 뮤테이션과 오검출 상한 판정을 지우는 뮤테이션에서 전건 RED를 확인한다. 성공 방향 대조도 함께 둔다: rubric이 정상 작동하는 fake provider로 돌렸을 때 오검출 0·누락 0으로 통과해야 한다(대조가 없으면 '전부 실패로 계상'이라는 과잉 수정이 통과한다 — CLAUDE.md 2026-09-08)."
