notes: |-
  등재 경위(2026-10-16): OPS-147(PR #1657 병합) ③ 전수 확인 중 발견한 범위 밖 관측. problem_corpus_accumulate는 --worklist-out이 큐 정본 <out>.review.jsonl과 같은 파일이면 거부하도록 막혔으나(OPS-147), problem_corpus_batch의 --worklist-out은 같은 가드가 없다. 코드 실측(main 51601954): batch는 (1) 코퍼스를 run_corpus_batch 안에서 sink.write(resolved_out)로 기존 파일 전면 교체 방식으로 쓰고(JsonlCorpusSink.write docstring: 기존 파일 전면 교체), (2) 그 뒤 main()이 --worklist-out 경로에 worklist_path.write_text로 마크다운 뷰를 쓴다. 두 경로가 같으면 코퍼스 JSONL이 마크다운으로 바뀐다. --out 생략 시 기본값이 저장소 생성 코퍼스 v0(_default_out_path)이라 --worklist-out에 그 파일을 주면 추적 중인 코퍼스를 덮어쓴다. --dry-run은 코퍼스는 안 쓰지만 뷰 쓰기는 그대로라 기존 파일이 있으면 덮어쓴다. 피해 크기는 OPS-147과 다르다: 이쪽은 결정론 배치의 산출물이고 코퍼스는 git으로 추적되는 경로라 복구 가능성이 높아 보이나(미확인 — 구현자가 실제 복구 경로를 확인해 기록), 소실 위험은 같은 구조다. 현재 실행 명령 사용처가 0건이라 실제 발생 이력은 없다(문서 서술 3곳뿐) — 그래서 P2. 재사용 대상: OPS-147의 worklist_aliases_review_queue(resolve+normcase+samefile)와 test_worklist_out_queue_alias_guard.py의 소스 변형 하네스. 위치 판단은 구현자 몫(accumulate에 두고 batch가 import할지, 공용 모듈로 승격할지 — import 방향이 7계층/lint-imports 계약을 건드리지 않는지 확인).

