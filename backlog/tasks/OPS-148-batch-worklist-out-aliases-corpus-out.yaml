acceptance:
  - "① 가드 — `problem_corpus_batch.main()`이 인자 해석 직후·`run_corpus_batch` 호출 전에, `--worklist-out`의 해석 경로(절대화·`..` 정규화·Windows 대소문자 무시·samefile 동치)가 코퍼스 산출 경로와 같으면 exit 2로 거부하고 두 경로를 사유에 쓴다. 코퍼스 산출 경로는 `args.out`이고, `--out` 생략 시 기본값 `_default_out_path()`(저장소 생성 코퍼스 v0)로 해석한 경로와 비교해야 한다(None끼리 비교하면 기본 코퍼스를 뷰로 지정하는 경우를 놓친다). 거부 시 어떤 파일도 쓰지 않는다(코퍼스 바이트 불변). 동치 판정은 OPS-147이 main에 착지시킨 `problem_corpus_accumulate.worklist_aliases_review_queue`를 재사용하거나 일반화한다 — 두 경로 동치 판정의 이중 구현 금지."
  - "② 실패 주입 — OPS-147 테스트(`tests/backend/harness/test_worklist_out_queue_alias_guard.py`)의 구조를 따른다: 가드를 끄면 같은 경로 테스트가 RED, 뮤테이션은 `mutated != original` 단언·원복 바이트 동일 단언 포함. 대조군 필수: 코퍼스와 다른 경로의 `--worklist-out`은 통과(과잉 차단 금지). 픽스처 4종을 각각 둔다: ⓐ 같은 경로 ⓑ `--out` 생략 + 기본 코퍼스 경로를 뷰로 지정 ⓒ 상대/절대·`..` 동치 ⓓ `--dry-run`과의 조합 — `--dry-run`은 코퍼스를 쓰지 않지만 뷰 쓰기(`write_text`)는 그대로 실행되므로 기존 코퍼스 파일이 있으면 덮어쓴다(dry-run이 면제 사유가 아님을 동결)."
  - "③ 전수 확인 — `problem_corpus_batch --worklist-out`을 쓰는 런북·스크립트·워크플로를 저장소 전수 grep해 코퍼스 경로(`problems.jsonl` 등)를 뷰로 지정한 곳이 있으면 같은 PR에서 정정한다(2026-10-16 착수 시점 grep: 사용처는 문서 서술 3곳뿐이고 실행 명령 사용처는 0건 — 구현 시점에 재확인). 같은 부류의 다른 쓰기 경로(`problem_corpus_accumulate`의 `--generation-log`·`--worklist-out` vs `--out` 자체 동치, `.rounds.jsonl` 대장)에 같은 별칭 결함이 남았는지 확인해 결과를 notes에 기록하고, 남았으면 별도 태스크로 분리 등재한다(이 태스크에 섞지 않는다)."
