acceptance:
  - "① 재료 실측 고정: l4/speech/profiles.py:18-70이 학년밴드 4종 × 도입 구조 12종(introduced_constructs)을 이미 보유하고 거부 없이 unresolved 표시만 함을, l3/notation_coverage.py:64의 _MACRO_RE·is_math_glyph가 토큰 전수 추출을 이미 함을 확인한다. 없는 것은 '토큰 → 구조 키' 매핑 하나뿐임을 주장 확인 또는 반증 — 반증되면(예: 매핑이 이미 어딘가 있음) 범위 재조정"
  - "② 매핑 데이터 신설: data/curriculum_notation_ranges.json에 {token, construct} 폐쇄 표를 둔다. construct 어휘는 profiles.py의 12종을 그대로 쓴다(새 어휘 생성 금지 — 학년 구조 어휘 이원화는 truth source 이중화다). 매핑 없는 토큰은 unmapped로 남기고 판정에서 제외하되 리포트에 건수를 노출한다(침묵 통과 금지)"
  - "③ 게이트 CLI 신설: l3/curriculum_notation_gate.py를 notation_coverage와 동형 규약(exit 0/1 · --json · 베이스라인 래칫 · 대조군 플래그)으로 만들고 ci.yml backend 잡의 notation_coverage 스텝 옆에 배선한다. 초과 표기를 발견해도 콘텐츠를 삭제하지 않는다 — 래칫에 계상하고 사람이 판단한다(notation_coverage 철학 답습)"
  - "④ 학생 경로 차단의 기계화: api/·l4/polya/·l4/socratic/에서 이 모듈의 import가 0건임을 소스 스캔 거버넌스 테스트로 동결한다(tests/backend/의 금지 토큰 방식·no_math_logic_governance_test.dart 동형). 결함 주입 실측 필수 — 금지 디렉터리에 임시 import를 넣어 red가 실측되는지 확인한 뒤 되돌린다(현재도 모듈이 없어 자명하게 green이므로 이 실측 없이는 검사 자체가 무변별하다). 선언으로만 두면 다음 세션이 학생 입력 경로에 배선한다 — 그건 교수학 금기(부정적 피드백의 정서적 강화·앞서 배운 방법으로 푸는 학생을 처벌)의 정면 위반이다"
  - "⑤ 변별력: 같은 코퍼스에 고등 프로파일을 적용하면 exit 0, 초등 프로파일을 적용하면 exit 1이 나오는지 --force-grade-band 대조군으로 실측한다. 두 경우가 같은 값이면 측정기가 학년 축을 실제로 보지 않는 것이다. 그리고 첫 실측에서 초과 표기 0건이면 이 축이 불필요했다는 정직한 신호이므로 그대로 리포트에 기록한다"
  - "⑥ 범위 밖 명시: (a) 학생 입력에 대한 교육과정 범위 거부 — 영구 미채택(math_engine_gap_review.md §2-⑤). (b) 성취기준 코드 자동 태깅 — 교육과정 축이며 curriculum-node-builder 자산의 소관. (c) 생성 프롬프트에 학년 제약을 주입하는 것 — 생성 축·후속. 이 태스크는 회계이지 개입이 아니다"
  - "[범위 재조정 2026-10-08 · acceptance ① 반증 결과] ①의 '없는 것은 토큰→구조 키 매핑 하나뿐' 주장은 부분 반증됐다 — 실측 5건. (a) 매핑이 코드에 암묵 존재: l3/speech.py의 _gate(construct, label) 호출 12곳이 \\frac→fraction, ^→power, _→subscript, \\sqrt→root, 삼각함수→trig, 로그→log, \\int류→integral, \\sum류→sum, \\prod류→product, \\lim→limit, \\binom→binom, '→derivative를 AST 노드 키로 이미 갖는다. 토큰 키의 데이터 표만 없다 → 새 표를 만들되 두 번째 정본이 되지 않도록 표↔음성화 엔진 드리프트 테스트로 묶는다(매크로 항목은 초등 프로파일로 실제 낭독해 unresolved 반응이 표와 일치하는지 대조). (b) 구조 키는 12종이 아니라 14종이다(_ARITHMETIC 4 + 고등 10: fraction power abs factorial root subscript trig log integral sum product limit derivative binom). (c) 추출기는 전수가 아니다: 코퍼스 문항 14,034건에 LaTeX 매크로가 0건이고 표기는 평문·유니코드(x^2, √, ², Σ, ₙ)다. _MACRO_RE+is_math_glyph만 쓰면 초과 표기 0건이 실제 부재인지 측정기의 맹점인지 구분되지 않는다 → 표에 kind(macro|glyph|word)를 두고 ASCII 단어 토큰(sin·cos·tan·log·ln·lim·sqrt 등 비모호 어휘)을 추가 축으로 추출한다. (d) 문항에는 학년 필드가 없다: 학년밴드는 achievement_standard_codes → data/corpus/standards_v1/standards.json의 school_type(초등학교/중학교/고등학교)으로 파생하고, 복수 코드면 최고 밴드를 쓴다(오탐 방향 보수). 코드가 정본에 없는 문항(대학 CALC1 600건)은 미분류로 판정 제외하되 건수를 노출한다. (e) 계층: introduced_constructs는 L4 데이터이고 l3→l4 import는 7계층 계약 위반이다 → 엔진은 l3/curriculum_notation_gate.py에 두고 구조 키 집합을 인자로 주입받으며, L4 PROFILES를 주입하는 CLI는 harness/curriculum_notation_gate_cli.py에 둔다(l3/pedagogy/explanation_checker ↔ harness/explanation_f7_eval 선례). ci.yml 스텝은 이 CLI를 부른다. 판정 단위는 (밴드, 구조, 토큰) 3-튜플이며 베이스라인은 data/curriculum_notation_range_baseline.json. ④의 소스 스캔은 명시 3개 디렉터리(api/·l4/polya/·l4/socratic/) 금지에 더해 엔진·CLI 두 모듈을 import(언급)할 수 있는 파일의 허용 목록(deny-by-default)을 함께 동결한다."
