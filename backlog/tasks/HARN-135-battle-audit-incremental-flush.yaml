notes: "발견 경위(2026-09-22 · 게이트 G-s416-round2-live-battle 실행 준비): 2시간짜리 라이브 회차를 Kiki 머신에 안내하기 직전에 \"중간에 죽으면 무엇이 남는가\"를 확인했고, 답이 **아무것도 남지 않는다**였다.\n\nS4-16 은 현재 다른 세션이 claim 중(in_progress · claude/optimistic-gates-9ef9nm)이며 그 태스크의 acceptance 에는 이 축이 없다(실측: flush·증거·중단·재시작·부분 키워드 0건). 즉 중복 등재가 아니라 미소유 축이다. 다만 대상 파일이 S4-16 과 겹치므로 착수 전 overlap 확인이 필요하고, S4-16은 2026-09-25 기각으로 cancelled되어 그 파일과의 충돌 우려는 해소됐다.\n\n이번 회차에 대한 즉시 완화는 코드가 아니라 운영으로 했다 — 런북 §1-⑥ 이 \"[D] 가 도는 동안 그 창을 건드리지 말 것\"을 명시하고 있고, ⑥ 브리핑에 예상 소요를 적어 두었다. 그것은 예방이 아니라 주의 환기이므로 이 태스크가 필요하다.\n\n주의: 이 결함은 게이트 미달(BATTLE_EXIT)과 무관하다. 게이트 미달은 유효한 측정 결과이고, 이 결함이 만드는 것은 **측정 자체의 소실**이다.\n\n[정정 2026-09-25] depends_on 제거 1건: S4-16이 2026-09-25 기각 판정으로 cancelled — 그 태스크는 더는 residue_gate_demotion_battle.py를 고치지 않으므로 파일 충돌 회피용 의존을 해제한다. 이 태스크의 존재 이유(측정 도중 중단 시 증거 소실)는 강등전 CLI가 남는 한 유효하나, 강등전 경로가 인간 검수 대체 후보에서 제외돼 우선순위 재판정이 필요하다.\nnotes 치환 — S4-16이 2026-09-25 기각 판정으로 cancelled — 그 태스크는 더는 residue_gate_demotion_battle.py를 고치지 않으므로 파일 충돌 회피용 의존을 해제한다. 이 태스크의 존재 이유(측정 도중 중단 시 증거 소실)는 강등전 CLI가 남는 한 유효하나, 강등전 경로가 인간 검수 대체 후보에서 제외돼 우선순위 재판정이 필요하다.\n\n[취소 2026-09-25] Kiki 결정(2026-09-25) — 게이트 G-s416-round2-live-battle 기각(3안)으로 강등전 경로가 인간 검수 대체 후보에서 제외되어 이 CLI를 돌릴 예정 회차가 없다. 이 태스크가 막으려던 위험(531콜 회차 도중 중단 시 판정 원자료 소실)은 회차가 있어야 발생하므로 지금은 상환 가치가 낮다. 강등전 CLI를 다시 돌릴 일이 생기면 그 회차의 선행 조건으로 재등재한다 — 그때는 결함 주입기 정답지 수리와 대조군 사람 검수가 먼저다(이력 문서 §2.4). 결함 분석은 이 태스크 notes에 보존된다. 판정 기준: main f138f894"
