  - "① 정규식을 읽는 지점 전수 열거: TASK_ID_RE(models.py:109)와 같은 형식 가정을 쓰는 곳을 하네스 CLI·selector·CI 스크립트·문서 링크 생성기까지 전수로 찾아 목록화한다. 부재 판정은 역할 기반 검색으로 하고 내가 찾은 방법으로 0건이면 범위를 밝혀 적는다\n② 방향 결정과 근거 기록: 자릿수 확장 / 접두사 분할 / 안전한 공백 재사용 중 하나를 고르고 왜 나머지를 버렸는지 MEMORY 결정 로그에 남긴다. 자릿수 확장을 고를 경우 EOS-43과 EOS-100이 공존할 때 정렬·파싱이 깨지지 않음을 테스트로 동결한다\n③ 실패 주입 검증: 상한 도달 상태와 공백 재사용 시도를 실제로 주입해 CLI가 의도한 대로 거부하거나 안전한 번호를 제안하는지 확인한다. 정상 입력에서 통과하는 것은 보호의 증거가 아니다\n④ 공백 재사용 경로를 만들 경우: 그 번호가 과거 문서·커밋에서 참조된 적 있는지 자동 검색해 0건일 때만 제안한다. 사람이 눈으로 고르는 경로는 ARCH-13·OPS-15 사고의 재생산이다"
