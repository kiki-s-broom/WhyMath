acceptance:
  - "① 짧은 번호 역참조 스캔 — backlog.py rename 이 개명 후 내는 경고를, 전체 ID 검색에서 프리픽스+번호(예: HARN-127) 검색으로 넓힌다. 현행 경고는 \"문서·커밋 메시지의 <전체 ID> 참조는 옮기지 않았다\"고만 말하고 사람이 그 전체 ID로 grep 하게 두는데, 실무의 역참조는 슬러그 없는 짧은 형태가 대부분이라 그 검색은 구조적으로 못 본다. 스캔 범위는 최소한 backlog/tasks/**.yaml 의 notes·acceptance 와 docs/** 로 하고, 찾은 위치를 파일:줄로 열거한다(자동 치환은 하지 않는다 — 문맥에 따라 옳은 새 번호가 다르고, 개명 전 사실을 적은 기록은 바꾸면 안 된다)"
  - "② 결함 주입 검증(①과 별항) — 정상 상태에서 초록인 것은 보호의 증거가 아니다. 픽스처로 ⓐ 짧은 번호만 참조하는 태스크 notes ⓑ 전체 ID로 참조하는 notes ⓒ 참조가 아예 없는 대조군 세 경우를 만들고, ⓐ에서 반드시 열거되는지 확인한다. 특히 ⓐ가 현행 코드에서 누락되는 것을 RED 로 재현한 뒤 수정한다 — 이 태스크가 존재하는 이유가 바로 ⓐ의 미탐이다. 스캔 대상 0건은 실패로 처리한다(공허한 통과 금지)"
  - "③ 이벤트 대장은 스캔 대상에서 제외한다 — backlog/events/**.ndjson 의 과거 참조는 그때의 사실이라 고치면 안 된다(HARN-20 · append-only). 제외를 코드에 명시하고, 제외 사유를 주석으로 남긴다. 제외하지 않으면 매 개명마다 고칠 수 없는 항목이 열거돼 그 경고 전체가 소음이 된다(상시 실패하는 보호를 새로 만드는 셈)"
