notes: "사고 경위: 2026-09-22 이 세션이 PR #1252 를 main 에 병합하며 번호 충돌을 해소했다. HARN-127-runbook-write-detection-allowlist-blindspot 을 HARN-132-... 로 개명한 뒤, CLI 가 낸 경고(\"문서·커밋의 참조는 옮기지 않았다 — 필요하면 손으로 확인하라\")에 따라 git grep 을 돌렸다. 검색어는 전체 ID 였고 결과는 이벤트 대장 2줄뿐이라, 그것을 append-only 라 그대로 두는 것이 맞다고 판정하고 잔여 참조 0건으로 넘어갔다.\n\n실제로는 HARN-116-runbook-write-vocab-paid-call-redirect 의 notes 가 \"중복 등재한 HARN-127 은 취소\"라고 **짧은 번호로** 참조하고 있었다. 개명 후 그 번호는 main 의 다른 태스크(HARN-127-runbook-guard-glob-scope)를 가리키게 됐다 — 같은 번호가 두 주제를 뜻하는 상태이며 HARN-10 이 겨냥하는 바로 그 결함이다.\n\n실측으로 확인한 검증 스텝의 무력함: `git grep -c \"HARN-127-runbook-write-detection\" origin/main -- backlog/tasks/HARN-116-*.yaml` 은 0건이고, `git grep -o \"HARN-127\" ...` 은 1건이다. 즉 내 검사는 실패 상태에서 실패 신호를 내지 못했다 — 변별력 없는 검증 스텝이었다(CLAUDE.md 2026-07-17 축). 더 좁게는 「식별자 부재를 기능 부재로 단정 금지」의 형태다: 내가 고른 한 표기의 0건을 부재로 읽었다.\n\n발견은 내 검증이 아니라 원 브랜치 세션이었다(PR #1270 이 HARN-116 notes 를 정정한다). 즉 이 건의 피해는 0이지만 그것은 설계가 아니라 다른 세션의 주의 덕이다.\n\n왜 산문이 아니라 코드인가: 「새 산문 규칙 등재 동결」(2026-09-20 Kiki 지정)에 따라 사고 대책은 코드·태스크만으로 등재한다. 개명은 CLI 가 이미 소유한 동작이므로 그 경고를 넓히는 것이 정확한 집행 지점이다 — 사람에게 \"짧은 번호도 찾아보라\"고 적어 두는 것은 같은 실수를 반복시킨다."
