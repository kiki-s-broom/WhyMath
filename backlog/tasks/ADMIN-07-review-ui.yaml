notes: "04 §7 Phase B 진입점·§8 ADMIN-REVIEW-UI 제안의 등재. BFF 쓰기 확장(감사 동반) 포함\n\n[정정 2026-09-01] eos_priority null → P0: 판정표 R/F4★ — 검증설계서 §8 집행 지점 명시 지목. EOS-80 일괄 백필\n\n[정정 2026-09-01] 계획서 200 검토 §8 관리자 축 우선도 재검토 — Kiki 지시(2026-09-01). 재검토 결과 승격 0건이며, 실제 임계경로는 EOS-78로 분리 등재. 판정 근거를 대장에 남겨 재질문을 막는다.\n\n[정정 2026-09-01] 머지(EOS-80 백필 ↔ 계획서 200 검토 재검토)로 한 파일에 'P0'과 '판정 대상 아님'이 나란히 놓여 다음 세션의 오독 위험이 생겼다. 두 축의 관계를 명시하고, 백필 인용의 실측 대조 결과(검증설계서에 ADMIN 0건)를 등급 변경 없이 병기한다.\n\n[정정 2026-09-22] ADMIN-06이 셸의 서버 축(프리플라이트가 origin에 따라 갈린다)을 테스트로 동결했으나, 실 브라우저·실 내부망 origin 조합은 사람 실행 사안이라 게이트 G-admin06-browser-menu-call로 분리했다. 검수 큐 화면(ADMIN-07)은 그 셸 위에 올라가므로, 브라우저에서 메뉴가 실제로 렌더된 적이 없는 상태에서 모듈 화면부터 쌓으면 실패 원인이 셸인지 모듈인지 갈리지 않는다."
