acceptance:
  - "① 단일 판정 — store.gate_wait_kind(backlog, gate) 가 미통과 게이트가 지금 무엇을 기다리는지를 셋 중 하나로 낸다: inputs(미종결 입력 태스크가 남았다) · verdict(입력은 끝났는데 그 상태의 판정 기록이 없거나 FAIL 기록이 끊겼다 — gate_judgment_state 가 unrecorded 또는 judged:FAIL) · person(담당자 차례 — 판정 개념이 없는 게이트 또는 PASS 기록). 판정 기록 상태는 gate_judgment_state 를 그대로 쓰고 새로 판정하지 않는다."
  - "② 작업 흐름 그래프 — 게이트 창의 상태를 ①에서 받는다(그래프 자체 판정 금지 · HARN-182 acceptance ②를 게이트 창까지 적용). verdict 게이트는 '사람 차례'(gate_turn)가 아니라 별도 상태 '판정 결과 미기록'으로 그리고, 사이드 패널 '사람 차례' 목록과 --text 요약의 '사람 차례 N' 집계에서 뺀다. inputs 는 종전 gate_wait, person 은 종전 gate_turn 그대로다."
  - "③ 보드·정지 사유 — 보드 카드의 게이트 대기 라벨(종전: 게이트 상태와 무관하게 '사람 게이트 대기')과 next·SessionStart 브리핑의 정지 사유(human_gate '사람 게이트 대기 중')도 ①을 거친다. 막는 게이트가 verdict 면 '사람 게이트'로 부르지 않는다. 보드는 inputs 게이트를 선행 작업 대기로 부른다. /drive 정지 규약(.claude/commands/drive.md)에 새 정지 사유를 적는다."
  - "④ 전 화면 대조 픽스처 — HARN-177 ③의 사고 대장 상태(판정 태스크가 인계 없이 done · 판정 기록 없음) 하나로 next·status(텍스트·JSON)·gates list/show·작업 흐름 그래프(JSON·텍스트)·보드·정지 사유가 전부 '사람 차례/사람 판정 대기'로 부르지 않음을 확인하고, PASS 기록 대조군은 전부 사람 차례로 부른다. 새 화면이 그 목록에서 빠지지 않게, 하네스 모듈 중 사람 차례 문구를 내는 모듈이 목록에 모두 등재됐는지 검사한다(빠지면 RED — 문구 스캔이라 다른 낱말로 사람 차례를 말하는 화면은 못 잡는다는 한계를 테스트에 적는다)."
  - "⑤ 변별력 — 절마다(① 세 갈래 · ② 그래프 상태·집계 · ③ 보드 라벨·정지 사유 · ④ 전수 등재) 그 절을 끊는 뮤테이션을 두고 전건 RED를 확인한다. 주입 적용 단언(mutated != original)과 원복 바이트 동일 단언은 HARN-174 러너를 재사용하고, 앵커 동결 테스트를 CI에서 돌린다(verify_gate_verdict_handoff_discrimination.py 선례)."
