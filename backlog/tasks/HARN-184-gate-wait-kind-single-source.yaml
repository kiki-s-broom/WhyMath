notes: "출처: 2026-09-28 HARN-177 착지 후 정상작동 점검(Kiki 요청 — 태스크 ID 지목) · 판정 기준 main 919865d4.\n\n[점검 결과 — HARN-177 자체] 착지 확인(0e7b4f6b · #1337). main 919865d4 에서 harness-integrity 잡 스텝 8종(validate · audit-deps · rules lint · rules render --check · jit check · ruff · black · pytest tests/harness) 전건 exit 0, pytest 1268 passed · 1 skipped. 실제 대장: pending decision 게이트 14건 중 입력 있는 6건 전부 open(나머지 8건은 입력 없음 → 판정 개념 없음) · unrecorded 0건 · 판정 기록 0건.\n\n[실측 — 이 태스크의 결함] HARN-177 은 next·status·gates list/show 에 판정 기록 상태를 싣고 '판정이 기록되지 않은 상태를 사람 차례로 안내하지 않는다'를 원칙으로 적었다. 그 뒤 착지한 작업 흐름 그래프(HARN-182 · #1345)는 게이트 창의 상태를 '열린 선행이 있는가'로만 가른다(work_graph.build_nodes 의 waits). 합성 대장 재현: 입력이 done 이고 판정 기록이 없는 decision 게이트 → store.gate_judgment_state = unrecorded 인데 그래프 상태 gate_turn · 라벨 '사람 차례' · 텍스트 요약 '사람 차례 1'. PASS 기록 대조군과 상태·라벨·집계가 똑같고 이유 문구만 다르다. 실제 대장은 지금 unrecorded 0건이라 현재 오표시는 없다(잠복).\n\n[같은 축의 옛 화면] 보드 대기 라벨 '사람 게이트 대기'(board.WAIT_LABEL)와 정지 사유 human_gate 도 게이트의 판정 기록 상태를 보지 않는다. 실측: 지금 실제 대장에서 그 라벨이 붙은 카드 21건은 전부 입력 없는 게이트 10개에 걸려 있어 현재는 맞게 읽힌다 — 역시 잠복.\n\n[계열] 공용 판정이 있는데 새 화면이 자체 판정으로 분류한다. HARN-177 ② acceptance 가 화면을 열거(next·status·gates show)했기 때문에 그 뒤 생긴 화면은 계약 밖이었다. ④의 등재 검사가 그 입구를 막는다."
