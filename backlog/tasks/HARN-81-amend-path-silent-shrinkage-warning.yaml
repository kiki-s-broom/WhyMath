acceptance:
  - "① 실측 재현 — amend --path는 append가 아니라 교체다(HARN-57 의도적 설계: 넓은 glob을 좁히는 것이 실사용 절반이라 append로는 좁힐 방법이 없다). 그런데 교체가 무증상이라 신규 경로만 넘기면 기존 경로가 조용히 사라진다. 2026-09-07 SEC-32 구현 중 실제 발생: 신규 6건만 넘겨 원 7건이 소실됐고 구현자가 알아채 13건 전체를 다시 명시해 복원했다"
  - "② 왜 위험한가 — paths는 병렬 세션 겹침 탐지의 유일한 입력이다. 넓어지면 오탐(HARN-59가 다룬 축)이지만 좁아지면 **미탐**이고, 미탐은 경보가 안 뜨므로 사람이 알아챌 기회 자체가 없다. 두 세션이 같은 파일을 모르고 병렬 구현하는 형태(2026-07-27 OPS-07 735줄 폐기·2026-09-06 MP-04 전량 폐기)의 재발 경로다"
  - "③ 대책 — 제거되는 경로가 있으면 그 목록을 stderr에 명시하고, 확인 플래그 없이는 거부하거나(fail-closed) 최소한 제거분을 전건 열거한다. 교체 의미 자체는 유지한다(좁히기가 목적이므로). 어느 쪽(경고 vs 거부)인지는 구현자가 근거와 함께 판단하고 테스트로 동결"
  - "④ 변별력 — 경로를 좁히는 amend를 실제로 주입해 경고·거부가 나는지 확인한다. 정상(경로 유지·확장) 케이스에서 조용한지도 대조군으로 확인한다 — 양쪽에서 같은 화면이면 위장이다"
