  - "① `scripts/harness/ci_mirror.py --job <name>...`이 `.github/workflows/ci.yml`의 지정 잡 스텝(name·run·working-directory·env)을 순서대로 로컬 실행하고 스텝별 exit code와 **뒤따라 skipped된 스텝 수**를 표로 낸다. 잡 열거 0건·스텝 파싱 0건은 exit 1(HARN-109 계약 계승 — HARN-109가 먼저 착지하면 그 열거기를 호출한다). 결과는 `run_id·기준 커밋 해시·잡별 exit` JSON으로 남긴다(측정 도구 실패 경로 설계: 스텝마다 즉시 flush·타임아웃)."
  - "② 배선 2곳 — `.claude/commands/drive.md` 4단계 검증 문구를 \"pytest·ruff green\"에서 미러 호출(backend + 변경이 닿는 잡)로 교체하고, `backlog.py done`이 최근 미러 결과 JSON(같은 커밋 해시)이 없으면 경고를 낸다(1단계 warn·측정 후 block 승격은 HARN-122 절차). 정본화≠집행 분리: 문서 문구 교체가 ①이고 done 프리플라이트 호출이 ②다."
  - "③ 변별력 — 뮤테이션 3종: (a) 스텝 하나를 실패하도록 주입 → 그 스텝 exit≠0과 뒤 스텝 skipped 수가 정확히 계상되는지 (b) 잡 이름 오타 → exit 1 (c) run 블록에 `| tail`·`-q`가 섞인 스텝은 그대로 실행하되 판정은 exit code로만 하는지(출력 억제 축 재현). 주입 실재(`mutated != original`)·원복 바이트 동일 단언 포함."
