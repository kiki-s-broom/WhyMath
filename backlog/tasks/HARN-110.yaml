notes: "사고 경위(2026-09-18 · EOS-106 Week 1 Gate 판정 세션): CCR 컨테이너에서 pypi가 상시 503이라 black 설치가 불가했고, 세션이 Black의 동작을 추측해 두 번 연속 CI red를 냈다. 1회차는 원인 미파악, 2회차는 '조각이 95자니까 한 줄에 들어간다'는 계산이 틀렸다(Black은 표시 폭으로 재므로 한글이 폭 2). 두 회차 모두 Black 스텝이 7번째라 뒤 20스텝이 skipped가 되어 검증 표면 전체가 미실행이었다.\n해결은 포맷 수정이 아니라 오라클 확보였다 — GitHub 소스 조립으로 실물 black 26.5.1을 돌려 CI 실패를 글자까지 재현한 뒤 고쳤다. 먼저 조립한 25.9.0은 기존 11파일을 재포맷하려 해 CI와 불일치였고, 그 버전으로 고쳤으면 3회차 red였다 — 즉 '오라클 정합 확인' 스텝이 실제로 사고를 한 번 막았다.\n이 태스크는 그 절차를 저장소에 고정한다. CLAUDE.md 실수 관리(시스템 실수 또는 동일 유형 2회 이상 → 재발방지대책 등재 의무)에 따른 등재다."
