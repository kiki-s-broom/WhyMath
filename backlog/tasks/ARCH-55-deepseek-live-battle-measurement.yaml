notes: "ARCH-49 회수 분리(CLAUDE.md 「회수로 태스크 done 선언 시 acceptance 전수 재대조 생략 금지」): ARCH-49가 착지시킨 것은 *측정을 돌릴 수 있는 배선*이고, acceptance ①·⑥이 요구한 **라이브 측정 자체**는 Kiki 머신의 유효 키가 필요해 그 세션에서 수행할 수 없었다. 미이행분을 여기로 승계한다 — 산문에만 남기면 만료 없는 유예가 된다.\n\n착수 전제(ARCH-49에서 이미 성립): 키 2종이 Phaiakes9 User 환경변수에 등록·라이브 확인됨(2026-09-16, 벤더 표준 이름 `DEEPSEEK_API_KEY`/`OPENROUTER_API_KEY` — `config.py`가 `WHYMATH_` 접두 이름과 함께 읽는다) · CN 관할 기본 정책이 합성 프로브(`WHYMATH_GENERATED`)를 허용하므로 **추가 opt-in 없이 측정 가능** · OpenRouter 기본 허용목록은 `deepinfra`/`digitalocean` 2곳.\n\n실행 축이 Kiki 머신이므로 런북에는 CLAUDE.md 「Kiki 직접 수행 과제의 사전 브리핑 템플릿」 6항목과 쓰기 블록 자가거부 가드(HARN-106)를 적용한다.\n\n미채택도 결론이다 — 판정은 exit code와 Wilson 경계로 하고 인상 판정을 금한다."
