acceptance:
  - "① 강등전 실측(ARCH-49 acceptance ① 승계) — DeepSeek 경로 2종(공식 API `deepseek-flash` · OpenRouter `deepseek/deepseek-v4-flash`)과 현행 클라우드 핀(`claude-sonnet-4-6`)을 품질·지연·비용 3축으로 비교한다. 측정 대상은 *학생 데이터가 없는 저작 경로*(코퍼스 문항 저작·개념 추출)이며, 정확도 축은 결함 주입 강등전으로 판정한다(`docs/standards/superhuman_verification_standard.md`). 점추정 금지 — Wilson 단측 경계.\n② 요금 구간 분리 집계(ARCH-49 acceptance ⑥ 승계) — 각 호출의 요금 구간을 `l3/providers/deepseek.pricing_window`로 라벨링해 peak/off_peak를 **분리 집계**한다. 단가가 정확히 2배 차이라 한 통에 넣으면 평균에 녹아 비교가 무의미해진다. 시간축 라우팅은 만들지 않는다(ARCH-49 ⑥ 판정 유지) — 대신 저작 배치의 오프피크 스케줄링과 프롬프트 캐싱을 절감 후보로 리포트에 명시한다.\n③ 공급사 고정 확인 — OpenRouter 경유 측정은 응답의 공급사·양자화가 허용목록 1곳으로 고정됐는지 회차마다 기록한다. 고정되지 않은 회차는 폐기한다(양자화가 섞이면 모델이 아니라 잡음을 재는 것이다).\n④ 채택 판정과 MEMORY 결정 로그 — 실측 수치·비교 조건·채택 여부를 적는다. **미채택도 결론이다.** 채택 시에도 기본 라우팅 변경은 별건 판정으로 남긴다(이 태스크는 측정과 판정까지다).\n⑤ 미확정 사실의 재평가 — DeepSeek이 유료 API 입력을 학습에 쓰는지 1차 자료(`cdn.deepseek.com` 약관)로 확인되면 `deepseek_allow_internal_corpus` 기본값(현재 False)을 그 근거와 함께 재평가한다. 확인하지 못하면 \"미확인\"이라고 범위를 밝혀 적고 기본값을 유지한다."
  - "[정정 2026-09-17 · ARCH-49 acceptance ⑨⑩] OpenRouter 축 기록 4건이 전부 틀렸음이 Kiki의 화면 대조로 드러났다 — 모델 slug는 `deepseek/deepseek-v4.1-flash`(점 있음)이고, 엔드포인트는 19곳이며, `open-inference`는 **이 모델을 서빙하지 않는다**(⑩의 배제 논거가 실재하지 않는 사례였다). `deepinfra` 단가도 $0.09/$0.18이 아니라 $0.20/$0.60이다. DeepSeek 공식 단가 축(피크=오프피크 2배)은 맞았으므로 라이브 1회차의 비용 산술은 그대로 유효하다.\n[공급사 근거 2026-09-17] OpenRouter 공급사 패널의 `Provider info › Headquarters`로 US 5곳 확정: deepinfra·fireworks·together·gmicloud(패널 표기) + baseten(표 배지). 같은 패널이 `Prompt training`·`Retention`을 함께 주며, gmicloud는 US인데 Retention=Unknown이라 기본 허용목록에서 제외했다. digitalocean은 재확인 실패로 표에서 뺐다(UNKNOWN=전건 차단). 미확인 9곳: relace(최저가 $0.15/$0.60)·morph·makora·modal·parasail·novitaai·phala·venice·reka.\n[측정 설정 주의] `provider.only`는 **1곳만** 지정한다 — 여러 곳이면 OpenRouter가 골라 주고 양자화가 공급사마다 달라(deepinfra=FP8·다수 미표기) 품질 비교가 성립하지 않는다. config 기본 3곳은 운영 가용성용이다.\n[도구] `harness.deepseek_live_probe`(호출·usage·요금 구간) · `harness.openrouter_endpoints_probe`(--search로 slug 확정 · --model로 공급사·양자화·단가 표). 둘 다 CI 미도달이 의도로 선언돼 있다(키·egress 부재)."
  - "[정밀도 축 2026-09-17 · Kiki 지적] 공급사 패널의 `Specifications › Precision`이 세 번째 축이다 — 관할·데이터 정책과 **서로를 함의하지 않는다**. 실측: `deepinfra`=FP8 · `gmicloud`=FP8 · `fireworks`=`--`(미표기) · `together`=`--`. 즉 ⓐ정밀도를 아는 곳(deepinfra·gmicloud) ⓑ보존 정책이 깨끗한 곳(deepinfra·fireworks·together)의 **교집합은 `deepinfra` 하나**다. 그래서 `openrouter_allowed_providers` 기본값을 `(\"deepinfra\",)` 단일로 좁혔다 — 초판 3곳은 FP8 1곳 + 정밀도 미상 2곳을 섞은 상태였고, 그것이 acceptance ⑨(d)가 경고한 양자화 혼재를 그대로 만들었다(`allow_fallbacks=false`라도 `only`에 여럿이면 어느 곳이 응답할지는 OpenRouter가 정한다).\n집행: `l3/providers/openrouter.PROVIDER_PRECISION` + `precision_of_slugs()`(하나라도 모르거나 섞이면 None) + 회귀 `test_default_allowlist_is_precision_homogeneous`. **`--`는 \"표준 정밀도\"가 아니라 \"미표기\"로 읽는다** — 모름은 같음의 근거가 아니다.\n가용성 비용 명시: 1곳 + `allow_fallbacks=false`면 그곳이 죽을 때 호출이 실패한다(`deepinfra` uptime 99.64%). 채택 미판정 단계에서는 조용한 품질 변동보다 명확한 실패가 낫다는 판단이며, 운영 도입 시 **정밀도가 같은** 곳으로만 이중화한다.\n측정 시 추가 확인 대상: `deepinfra` 패널의 `Max output`이 모델 표기(1.05M)와 달리 131.1K로 보였다(`:exacto` 변형 페이지 기준) — 출력 길이 상한이 공급사마다 다를 수 있으므로 장문 생성 비교 전에 확인한다."
  - "[범위 정정 2026-09-17 · Kiki] 채택 대상 경로는 **OpenRouter**다. DeepSeek 공식 API는 우리가 쓰기로 한 경로가 아니므로 아래 축들을 이 태스크의 판정 기준에서 뺀다:\n - ② 요금 구간(peak/off_peak) 분리 집계 — **무의미**. 피크 2배 단가는 DeepSeek 공식 API에만 있는 개념이고 OpenRouter는 평평하다. 공식 API arm 실측(2026-09-17 off_peak 80회)은 기록으로 남기되 판정 근거에서 제외한다.\n - ① 중 \"품질 강등전(Wilson 경계)\" — **이 단계의 판정 기준이 아니다**. 이것은 개발 단계 오케스트레이션(코퍼스 저작·개념 추출)이고, 오류 검출은 WhyMath 완성 후 **다축 오케스트레이션**이 담당하기로 이미 합의돼 있다. 단일 모델의 결함 검출률·오경보율로 채택을 가르지 않는다.\n판정 기준을 다음 4개로 좁힌다:\n (a) OpenRouter 경유로 라우터·관할 게이트를 통과해 **실제로 도는가**\n (b) 공급사 고정이 성립하는가(집계 제외 0건 — 양자화 혼재 방지, 기존 ③ 유지)\n (c) 회당 비용(토큰 실측 x OpenRouter 단가)\n (d) 지연 p50/p95와 가용성(allow_fallbacks=false의 실패 비용)\n[기록 보존] 공식 API arm 실측은 폐기하지 않는다 — 같은 시험지·같은 하네스로 잰 대조군이라 OpenRouter 수치를 읽을 때 배경이 된다. 다만 \"채택 판정의 근거\"가 아니라 \"배경 대조\"로만 인용한다."
  - "[OpenRouter 실측 2회차 2026-09-18 · 재시도 배선 이후] 판정 기준 4개 중 3개 확정, 1개 불합격.\n (a) 도는가 = 조건부 — 재시도 포함 17/20(85%) · 재시도 없이 1발 성공 12/20(60%). 1회차(재시도 없음)는 14/20(70%)였으므로 이번 상류 상태가 더 나빴고 그 조건에서 재시도가 70에서 85로 올렸다(재시도 자체는 정상 작동).\n (b) 공급사 고정 = 성립 — 1·2회차 모두 불일치 0건. provider.only 1곳 + allow_fallbacks=false가 의도대로 동작한다(deepinfra가 아니면 응답 대신 실패).\n (c) 회당 비용 = 0.00098 USD(입력 460 / 출력 1518 · OpenRouter 단가 0.15/0.60) → Sonnet 4.6의 0.004767 대비 4.9배 저렴. 이 축은 유리하다.\n (d) 지연·가용성 = 불합격 — p50 40,275ms · p95 332,447ms · 재시도 3회를 소진하고도 15% 실패. 재시도 12회가 회차 8건(40%)에서 발생했다.\n[원인 확정] 모델이 아니라 접속 구조다. OpenRouter 오류 본문이 직접 말한다 — is_byok=false · limit_source=upstream_provider_shared_pool · provider_error_code=engine_overloaded. 공유 풀이라 다른 사용자와 rate limit을 나눈다. 재시도를 5회로 늘리면 p95가 10분을 넘으므로 재시도로 풀 문제가 아니다.\n[선택지] ①BYOK(deepinfra 계정 키를 OpenRouter integrations에 등록 — 오류 메시지가 1순위로 권하며 데이터가 이것을 지목) ②공급사 교체(미확인 9곳 — 관할·데이터정책·양자화 3축 재확인 필요) ③현 구성 유지(p50 40초 감수).\n[출력 토큰 가설 갱신] 1회차 회당 634 → 2회차 1,518(2.4배, 같은 시험지·같은 모델). 공식 API 1,985에 가까워졌으므로 가설 ⓒ(OpenRouter가 추론 토큰을 usage에 안 실음)는 약해진다 — 안 싣는다면 회차마다 흔들릴 이유가 없다. 회차별 추론 길이 변동이 더 그럴듯하며 1회차 634가 이상값이었을 가능성이 크다. 표본 14·17로 작아 미확정이고 OpenRouter Activity 청구액 대조가 남아 있다.\n[부수 결함 2건 수정] --concurrency가 세마포어만 있고 실행은 직렬이던 거짓 기록(gather로 실집행) · 동시 쓰기 락이 보호하는 것이 없었음(open~write~close 사이에 await 지점 부재 — 제거)."
  - "[OpenRouter 실측 3회차 2026-09-18 · Baseten 교체 · peak 구간] 선택지 2(공급사 교체)가 실측으로 기각됐다.\n 결정적 발견 — 429는 공급사의 성질이 아니다. Baseten 오류 본문이 deepinfra와 글자 그대로 같다: provider_name=BaseTen · is_byok=false · limit_source=upstream_provider_shared_pool. 공급사를 바꿔도 같은 공유 풀을 통과해야 하므로 교체로는 벗어날 수 없다.\n 수치: 실패 8/20 · 재시도 28회(회차 17건=85%) · p50 5,348ms · p95 23,151ms · 집계 제외 8건(전부 호출 실패).\n[이 세션이 틀린 지점 — 기록] 공급사 선택 근거로 OpenRouter 표의 Uptime 100.00%를 썼는데, 그 열은 \"그 공급사 엔드포인트가 살아 있었는가\"를 재지 \"우리가 공유 풀을 뚫고 거기까지 갔는가\"를 재지 않는다. 다른 것을 재는 지표를 해답으로 읽었고, 6곳 비교 자체가 잘못된 축이었다. 오류 본문이 두 번(deepinfra·baseten) 같은 말을 했는데도 공급사 교체를 먼저 권했다.\n[교란 명시] 이 회차의 구간 라벨이 peak다(이전 둘은 off_peak). 라벨 자체는 DeepSeek 공식 API 시간대라 OpenRouter 과금과 무관하지만 실행 시각이 달랐다는 것은 말해 준다 — 이번은 아시아 낮, 이전 둘은 저녁·밤이라 공유 풀이 훨씬 붐빈다. 따라서 baseten이 deepinfra보다 나쁘다고 이 데이터로 말할 수 없다. 같은 시간대 deepinfra 20회로 교란을 제거해야 한다.\n[교란을 뚫고 살아남은 신호] 더 붐비는 시간대인데도 지연이 훨씬 낫다 — p50 5.3초(vs 40.3초) · p95 23초(vs 332초). 대기열을 뚫고 나면 Baseten 서빙 자체는 빠르다. 교란 방향과 반대라 실재 신호일 가능성이 높다.\n[남은 결론] BYOK이 유일한 구조적 해답이다. 공급사 둘 다 같은 메시지로 1순위로 권한다. 어느 쪽 계정을 만들지는 동시간대 A/B가 정한다 — 지연 우위가 baseten으로 확정되면 baseten, 비슷하면 2배 싼 deepinfra. 기본값은 A/B 전까지 baseten 그대로 두며, 틀린 근거로 정한 값을 교란된 데이터로 또 뒤집지 않는다."
  - "[OpenRouter 실측 4회차 2026-09-18 · 동시간대 A/B] 3회차의 시간대 교란을 없애려 같은 peak 창에서 공급사만 바꿔 재측정. 결과: deepinfra 실패 0/20 · 재시도 0회 · 집계 제외 0건 · p50 36,939ms · p95 212,563ms · 토큰 회당 465/1,935. 같은 창의 baseten은 실패 8/20 · 재시도 28회(17건) · p50 5,348ms · p95 23,151ms.\n[3회차 결론 정정 ①] \"429는 공급사의 성질이 아니다\"는 과했다. 메커니즘은 같지만(공유 풀·is_byok=false) 그 풀 안의 용량은 공급사마다 크게 다르다 — 같은 시간대에 deepinfra 0건 vs baseten 8건. 공급사 선택이 가용성에 영향을 준다.\n[3회차 결론 정정 ②] 시간대 가설도 틀렸다. deepinfra 3회는 off_peak 30% → off_peak 15% → peak 0%로, 가장 붐빌 것이라던 peak에서 가장 깨끗했다.\n[핵심 — 표본 부족] 같은 공급사·같은 시험지로 30%→15%→0%가 나왔다. 이 분산에서 20회 한 회차로 공급사를 고르는 것은 노이즈를 읽는 것이며, 이 세션은 그 노이즈로 판단을 세 번 뒤집었다(deepinfra 유지 → baseten 교체 → 구조 문제 → 재정정). 더 큰 표본을 태우기 전에 짚을 것: 우리는 실제로 돌릴 구성이 아닌 것을 재고 있다 — BYOK을 붙이면 공유 풀을 쓰지 않으므로 지금의 대기열 통계는 채택 후 상황을 대표하지 않는다.\n[가설 ⓒ 기각] 출력 토큰 회당 634 → 1,518 → 1,935(deepinfra) · 1,779(baseten). 공식 API 1,985와 같은 대역이므로 1회차의 634가 이상값이었고 OpenRouter가 추론 토큰을 usage에서 빠뜨린다는 증거는 없다. 청구액 대조 없이 이 축은 닫힌다.\n[비용 확정] claude-sonnet-4-6 회당 0.004767 대비 — deepinfra(0.20/0.60) 회당 0.00125로 3.8배 저렴 · baseten(0.30/1.20) 회당 0.00228로 2.1배 저렴.\n[미결] 기본 허용목록을 deepinfra로 되돌릴지 baseten을 유지할지 — 세션 제안은 되돌리기(baseten 교체 근거였던 Uptime 열이 무효로 확인됐고 deepinfra가 2배 싸며 앞 세 축은 deepinfra도 처음부터 충족). 가용성 축은 둘 다 미판정으로 남긴다(분산이 커서 이 표본으로 못 가르며 BYOK을 붙이면 축 자체가 사라진다). Kiki 판단 대기."
  - "[기본값 결정 2026-09-18 · Kiki] 기본 허용목록을 deepinfra로 되돌린다. baseten으로 옮겼던 근거(OpenRouter 표의 Uptime 100.00%)가 무효로 확인됐기 때문이다 — 그 열은 공급사 엔드포인트의 생존을 재지 우리가 공유 풀을 뚫고 거기 도달하는지를 재지 않는다.\n 되돌린 이유 셋: ①옮긴 근거가 무효 ②회당 비용이 약 절반(0.00125 vs 0.00228 · Sonnet 대비 3.8배 vs 2.1배) ③검증 가능한 세 축(관할·데이터 정책·양자화)은 deepinfra도 처음부터 충족.\n baseten은 대안으로 PROVIDER_JURISDICTIONS·PROVIDER_PRECISION에 남긴다 — 갈아 끼울 때 근거를 다시 모으지 않도록 하며, 그 사실을 회귀 테스트가 계약으로 고정한다(test_the_documented_alternative_satisfies_the_same_axes · 대조군으로 together는 US지만 정밀도 미표기라 축을 통과하지 못함을 함께 단언).\n[가용성 축 보류] 판정 기준 (d)는 BYOK 이후로 미룬다. 네 회차의 429 실패율이 30%→15%→0%로 흔들렸고 마지막(0%)이 peak 구간이라 시간대로 설명되지 않는다. 20회 표본으로 공급사를 가를 수 없고, 실제로 이 분산을 근거로 기본값을 두 번 뒤집었다. 실패 원인이 limit_source=upstream_provider_shared_pool·is_byok=false(공유 풀)이므로 BYOK을 붙이면 축 자체가 사라진다 — 그때까지의 가용성 수치는 우리가 쓰지 않을 구성의 것이며 표본을 키워도 버릴 숫자다.\n[남은 사람 작업] OpenRouter settings/integrations에 공급사 자체 API 키를 등록(BYOK). deepinfra 계정 필요(baseten도 BYOK supported). 붙인 뒤 같은 20회를 다시 돌리면 (d)가 채워지고 채택 판정을 쓸 수 있다.\n[이 PR에서 닫힌 축] (b) 공급사 고정 성립(4회 전부 불일치 0건) · (c) 회당 비용 확정 · 출력 토큰 가설 c 기각(634는 이상값, 정상 1,500~1,950로 공식 API 1,985와 같은 대역) · 공급사 교체안 기각(용량 차이는 있으나 표본 분산에 묻힘) · 시간대 가설 기각."
