# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: SEC-34-phaiakes9-cryptominer-incident-response
title: "Phaiakes9 침해 대응 — 채굴 예약 작업(GoogleUpdateTask 위장) 발견, 자격증명 전량 로테이션·노출 판정·오진 기록 정정"
track: infra-debt
stage: S3
subject: cross
layer: infra
status: todo
priority: 1
eos_priority: P1
owner: kiki
depends_on: []
requires_gates: []
acceptance:
  - "① 침해 범위 실측 — Phaiakes9에서 무엇이 실행됐고 무엇에 접근할 수 있었는지 확정한다. 관측된 사실(2026-09-10 Kiki): `GoogleUpdateTaskSYSTEM`·`GoogleUpdateTask` 예약 작업이 ⓐ보안 검사 예외 추가 ⓑ외부 스크립트 다운로드·실행 ⓒ채굴 의심 파일 실행을 수행했고, 종료 후 공유 커밋 약 152.8 GiB가 회수됐다. 확인할 것: 예약 작업의 등록 시각(최초 감염 시점 추정) · 다운로드 URL·드롭 경로 · 자동시작 잔존물(Run 키·서비스·WMI 구독) · Defender 제외 목록 원복 여부. 이름이 SYSTEM 권한 작업이므로 **관리자 권한 침해로 간주**한다."
  - "② 자격증명 전량 로테이션 — 이 머신에 존재했거나 입력된 시크릿을 **전부 무효화·재발급**한다. 채굴 드로퍼는 자격증명 탈취 모듈을 동반하는 경우가 흔하므로, 유출 증거가 없어도 노출로 간주한다(부분 성공을 전체 정상으로 해석하지 않기). 최소 목록: GitHub PAT(`PR_AUTO_RESYNC_TOKEN` — 저장소 시크릿 재등록 포함) · GitHub 계정 세션·SSH 키 · `DEPLOY_SSH_KEY/HOST/USER/KNOWN_HOSTS/PATH` · `WHYMATH_JWT_SECRET_KEY` · Anthropic/Langfuse 등 `.env`의 API 키 · 로컬 DB 접속정보. 각 항목의 재발급 완료를 체크리스트로 남긴다."
  - "③ 학생 데이터 노출 판정 — prod DB(docker `whymath-pg`)에 미성년자 개인정보가 있었는지 실측으로 확정한다. **현재까지의 실측은 유리하다**: 2026-09-07 `problem_attempt` 총 0행(게이트 `G-attempt-retention-purge-backfill-decision` evidence) · 2026-09-10 `attempt_event`/`attempt` 관련 리포트도 `attempts_total=0 · events_total=0`. 이 두 실측이 침해 기간을 덮는지 시점 대조하고, 덮으면 \"학생 PII 노출 0건\"을 근거와 함께 기록한다. 덮지 않으면 그 구간을 별도로 조회한다. 법령 유래 통지 의무 판단은 기계가 대체하지 않는다 — 노출이 확인되면 변호사 검토 경로로 넘긴다."
  - "④ 오진 기록 정정 — 이 사고는 성능 문서에 **원인 미규명**으로 등재돼 있었다. `docs/ops/amd395_local_llm_performance.md`의 2026-08-22 \"커밋 235GB의 정체 — 무엇이 점유하는지 모른다\"와 2026-09-10 \"약 302 GB가 어느 회계에도 잡히지 않는다 … 재부팅\"이 그것이며, 같은 내용이 `.claude/commands/llm-perf-doctor.md` 카탈로그에도 있다. 원인이 밝혀졌으므로 두 곳을 정정하고 **배제 4단은 방법으로 유지하되 종착점을 \"재부팅\"에서 \"예약 작업·자동시작 항목 점검\"으로 바꾼다** — 재부팅은 증상만 지우고 감염은 남긴다(실제로 08-22 이후 3주 가까이 그렇게 살았을 가능성이 있다)."
  - "⑤ 재발 탐지 — 같은 형태가 다시 생겼을 때 사람이 알아채는 경로를 만든다. 최소안: 커밋 여유가 임계 아래로 내려가면 경고하는 점검을 기존 `scripts/ops/collect_gpu_evidence.ps1`에 붙이고, 프로세스 private 총합과 커밋 점유의 **격차**를 함께 출력한다(이번 사고의 지문이 정확히 그 격차였다 — 커밋 326 GB vs 프로세스 19.4 GB). 이 태스크는 탐지 배선까지가 범위이고, 안티바이러스 정책·재설치 판단은 Kiki 결정이다."
  - "⑥ **봉쇄 실측 기록 (2026-09-10 · 이 태스크 등재 직후 확보)** — ①의 \"확인할 것\" 중 일부가 이미 답변됐다. 이 항이 그 시점의 정본이다.\n\n[사용자 확인] 채굴을 설치·허용한 적이 없다고 확인했고, 확인된 채굴 프로세스 종료를 승인했다.\n\n[16:41 KST · 프로세스 종료] 현재 계정 권한으로 채굴 부모·자식 프로세스를 종료하자 공유 커밋이 **156.699 → 3.854 GiB**로 줄어 **152.845 GiB가 회수**됐다. 이후 5분간 31개 표본에서 약 3.83 GiB로 안정했고 마지막 조회에 알려진 채굴 부모·자식은 없었다. 즉 미설명 공유 커밋의 대부분이 이 무단 채굴 계통에 귀속된다는 **강한 인과 증거**다(회수량이 격차와 자릿수로 일치).\n\n[16:41 시점 잔여] 자동실행 작업 2개 비활성화가 Windows 접근 거부로 **실패**해 재실행 경로가 남아 있었다 — 그 시점 판정은 \"완전 제거 아님\"이었다.\n\n[17:50 KST · 자동실행 차단] 관리자 승인 토큰으로 두 작업을 비활성화했다. 정확한 경로는 `\\Microsoft\\Windows\\Google\\GoogleUpdateTaskSYSTEM`과 `\\Microsoft\\Windows\\Google\\GoogleUpdateTask`이며 둘 다 `Enabled=false · State=Disabled`. 변경 전 경로·이름·실행 파일·명령 인수가 보존 증거와 일치함을 확인했고 원문 XML을 백업했다. 독립 검증 스크립트가 변경 전 FAIL → 변경 후 PASS로 갈랐다(변별력 확인). 17:50 스냅샷: 공유 커밋 3.87550 GiB · 전체 커밋 25.51697 GiB · 채굴 명령 지표 일치 프로세스 0건.\n\n[여전히 미완 — 이것을 부재 판정으로 쓰지 않는다] 백신 검사 · 확인된 악성 파일의 선별 격리 · **채굴이 추가한 보안 검사 예외의 원복** · 추가 침해 조사. 특히 보안 예외를 되돌리지 않으면 재감염이 쉽다. 프로세스 조회 0건은 \"시스템 전체 악성코드 부재\"가 아니다.\n\n[따라서 ②(자격증명 로테이션)가 지금 최우선이다] 머신의 실행은 멈췄지만, 감염 기간 중 유출됐을 수 있는 토큰·키는 **머신 밖에서도 계속 유효**하다. 봉쇄와 로테이션은 별개의 축이며 봉쇄 완료가 로테이션을 대체하지 않는다."
  - "⑦ **선별 격리 완료 — 13개 파일 (2026-09-10 · 검증 스크립트 실측)**\n\n[격리 대상 13종 · 위장 수법이 그대로 드러난다]\n· `C:\\Windows\\svchost.exe` — **정품은 System32에 있다.** Windows 루트의 svchost는 존재해선 안 되는 파일이다\n· `C:\\ProgramData\\KB5019959.exe` — Windows 업데이트 KB 번호로 위장\n· `C:\\ProgramData\\Google\\7z.exe` + `.png.001` — 7-Zip과 **PNG로 위장한 분할 아카이브**\n· `C:\\ProgramData\\Google\\InstallUtil.png.001/.002` — .NET LOLBIN(InstallUtil)을 PNG 확장자로 은닉\n· `C:\\ProgramData\\Google\\MEDIA.png.001/.002`\n· `C:\\ProgramData\\Google\\Locales\\{MA,RO,UN,WI,XM}.pak` — Chrome 로케일 파일로 위장한 분할 조각 5개\n즉 **분할 아카이브를 7z로 풀어 LOLBIN으로 실행**하는 구조이며, 정품 Chrome Remote Desktop·Docs와 **같은 폴더**에 숨어 예약 작업 경로(`\\Microsoft\\Windows\\Google\\`)가 그럴듯해 보이게 만들었다.\n\n[검증 스크립트가 실제로 갈라 주는 것 — 변별력 있음] ⓐ13개 원본 경로가 **실행 위치에서 사라졌는가**(남아 있으면 FAIL·exit 1) ⓑ격리 매니페스트 항목이 정확히 13건이고 각 항목의 `Source`가 예상 목록에 속하는가 ⓒ격리본의 **SHA-256이 매니페스트와 일치**하는가(무결성·복구 가능성) ⓓ각 격리본에 Everyone(S-1-1-0) 대상 **ExecuteFile Deny ACE**가 있는가(재실행 차단) ⓔ정품 경로 6종(System32의 svchost·cmd·powershell 32/64비트·Chrome Remote Desktop·Docs)이 **보존**됐는가(과잉 삭제 검출). 삭제가 아니라 **복구 가능한 격리**라 오탐이었을 때 되돌릴 수 있다.\n\n[이 스크립트가 증명하지 않는 것 — 부재 판정으로 쓰지 않는다] ⓐ**알려진 13경로만** 본다. 전수 검사가 아니다 ⓑ채굴이 추가한 **보안 검사 예외의 원복 여부는 검사하지 않는다** — 예외가 남아 있으면 재감염 경로가 열려 있다 ⓒ자동실행 잔존물 중 **예약 작업 2개 외의 축**(Run 키·서비스·WMI 구독·시작 폴더)은 범위 밖 ⓓ이 13개가 악성의 **전부**임을 뜻하지 않는다.\n\n[따라서 남은 순서] ①보안 예외 원복 ②백신 전체 검사 ③자동실행 잔존물 전수 ④그리고 **②(자격증명 로테이션)은 이 셋과 무관하게 지금 진행한다** — 머신을 아무리 깨끗하게 만들어도 이미 나간 토큰은 머신 밖에서 계속 유효하다."
  - "⑧ **격리 스크립트 리뷰 (2026-09-10 · 코드 정독) — 설계는 견고하다. 다만 백신 스캔이 탐지 전용이다.**\n\n[이 저장소의 기준으로 잘 만들어진 점] ⓐ`-Apply`에 관리자 권한을 요구하고 없으면 이동 0건으로 거부 ⓑ부모 경로 4곳과 격리 루트의 **reparse point(심볼릭 링크·정션) 검사** — 경로 리디렉션 공격 차단 ⓒ정규화 경로를 **대소문자 구분 비교**(`-cne`)해 단축명·케이스 트릭 거부 ⓓ보존된 증거 JSON과 **SHA-256·길이 양쪽 대조**, 어긋나면 \"증거 수집 이후 변경됨\"으로 거부 ⓔ**예약 작업 2개가 Disabled인지 먼저 확인한 뒤에만** 파일을 옮긴다(지속성 차단이 격리보다 앞 — 순서가 옳다) ⓕ이동 직전 재해시(TOCTOU 축소)·이동 후 재해시·원본 부재까지 3중 확인 ⓖ**단계마다 즉시 JSON 저장**이라 중간에 실패해도 증거가 남는다(CLAUDE.md \"실패해도 증거가 남는가\") ⓗ독립 검증기를 **System32 절대경로 powershell.exe**로 호출해 PATH 하이재킹을 피하고 종료 코드를 확인 ⓘ MSERT 실행 전 **Authenticode 서명 Valid + 서명자 Microsoft Corporation** 확인 ⓙ격리 사유를 \"확인된 악성 자동실행 체인이 직접 참조\"(4건)와 \"연관 배포 번들 자료 · 예방적 격리이며 백신 판정이 아님\"(9건)으로 **나눠 기록** — 확정과 예방을 섞지 않았다.\n\n[짚을 것 — MSERT 인자] `-ArgumentList @('/F','/N','/Q')`에서 **`/N`은 탐지 전용(detect only)**이다(제가 아는 한). 즉 이 스캔은 **아무것도 치료·제거하지 않는다** — 결과는 `C:\\Windows\\debug\\msert.log`에 기록될 뿐이다. 보수적 선택으로서는 타당하나, \"백신 검사 완료\"를 **치료 완료로 읽으면 안 된다**. 로그를 읽어 탐지 목록을 확인하고, 치료가 필요하면 별도 판단으로 실행한다.\n\n[여전히 미해결 — 이 스크립트들의 범위 밖] ⓐ**채굴이 추가한 보안 검사 예외의 원복** — 어떤 스크립트도 손대지 않는다. 남아 있으면 재감염 경로가 열려 있다 ⓑ**자격증명 로테이션**(②) — 머신 정화와 무관하게 이미 나간 토큰은 밖에서 계속 유효하다 ⓒ예약 작업 2개 외의 지속성(Run 키·서비스·WMI 구독·시작 폴더) 전수 ⓓ최초 감염 경로·시점."
  - "⑨ **자동실행 전수 스캔 결과 (2026-09-10) — 채굴 계열 0건 · 미상 1건은 오탐 판명**\n\n[스캔] `Get-ScheduledTask`에서 Disabled가 아닌 작업 중 실행 인자에 powershell·curl·wget·bitsadmin·mshta·rundll32·http가 걸리는 것을 전수 조회. 12건 매치.\n\n[결과 ①] `\\Microsoft\\Windows\\Google\\` 아래 작업이 **한 건도 나오지 않았다**. 필터가 Disabled를 제외하므로, 17:50 비활성화가 실제로 유효함을 **독립 경로로 재확인**한 것이다(비활성화를 수행한 스크립트가 아니라 다른 조회가 확인했다는 점이 중요하다).\n\n[결과 ②] Windows 기본 작업 9건(PcaPatchDbTask·StartupAppTask·CleanupTemporaryState·Autochk\\Proxy·capabilityaccessmanager·PCRPF·StateRepository·Sysmain·Windows Filtering Platform)은 전부 `%windir%\\system32\\rundll32.exe` + System32 정품 DLL — 정상. 대조점: 채굴은 `C:\\Windows\\svchost.exe`를 썼는데 정품 svchost는 System32에 있다.\n\n[결과 ③ — 오탐 1건] `WhyMath_Daily_Backup`이 저장소 이력에 없는 스크립트를 숨김 실행(`-WindowStyle Hidden`)해 의심 대상이었다. **오탐으로 판정**했다. 근거 5종: ⓐ파일 헤더가 우리 백업 스크립트(git 번들 → pg_dump → age 암호화 → 회전, 한국어 주석) ⓑ위험 지표 전수 스캔 0건(DownloadString·FromBase64String·Add-MpPreference·ExclusionPath·URL 전부 부재) ⓒ폴더가 2026-07-05자 옛 저장소 클론(CLAUDE.md·MEMORY.md·.claude/agents 포함) ⓓ같은 폴더에 `_cleanup_nested_clone.bat`(2026-09-06 22:53) — 그날 클론 정리 흔적 ⓔ작업 실행 결과가 계속 1(실패)로 조용히 성공해 온 흔적이 없다. 즉 9/6 저녁 옛 클론에서 만든 뒤 정본 저장소로 옮기며 남은 잔재다.\n\n[조치] 그 작업은 제거했다(`Unregister-ScheduledTask` → 잔여 0건). 매일 03:00에 실패를 반복하던 상태였고, 이름 때문에 \"매일 백업이 돈다\"는 착각을 유발했다 — CLAUDE.md \"상시 실패하는 보호를 보호로 신뢰 금지\"가 겨냥하는 상태. 옛 클론 폴더 자체는 남겨 뒀다(정본 착각 위험은 별건).\n\n[오탐도 기록하는 이유] 다음 세션이 같은 이름을 보고 처음부터 다시 조사하지 않게 하기 위해서다. 부재·무해 판정도 근거와 함께 남아야 재사용된다."
  - "⑩ **채굴의 실제 운영 피해 — 백업 1회 유실이 확인됐고, 원인 귀속이 변별력 있게 성립했다 (2026-09-10)**\n\n[관측] 정상 백업 작업 `WhyMath-DB-Backup`이 09-10 10:16:53 실행에서 **exit 1**로 실패했고, 백업 디렉터리에 **9/10자 파일이 없었다**(9/7·9/8·9/9는 각각 04:00에 576,864 bytes로 정상 생성). 세 작업의 LastRunTime이 정확히 같은 초인 것은 04:00·09:00 예정분이 PC 기동 시 `StartWhenAvailable`로 함께 발화한 것이다.\n\n[가설] 10:16은 채굴이 공유 커밋 152 GiB를 쥐고 있던 시각이다(정리는 16:41). 백업은 pg_dump + Docker + age 암호화를 연달아 돌리므로 커밋 여유 2 GB에서는 실패한다.\n\n[검증 — 변별력 있음] 채굴 정리 후 **같은 명령을 같은 환경에서** 재실행: 2회 연속 **exit 0**. `whymath_20260910_233826.dump.age`(784,205 bytes)·`whymath_20260910_233930.dump.age` 생성, age 암호화 성공(평문 삭제 확인), 오프사이트 복사까지 완료. 실패와 성공 사이의 **유일한 차이가 메모리 회복**이므로 원인 귀속이 성립한다.\n\n[의미] 지금까지의 증거는 전부 *메모리 수치*였다. 이것은 채굴이 **실제로 운영 산출물을 망가뜨렸다**는 첫 독립 증거다 — 그리고 그 피해가 하필 **백업**이었다. 신선도 검사(`-MaxAgeHours 48`)가 하루치 실패를 설계상 허용하므로 경고도 뜨지 않았다: 이틀 연속 실패했다면 그때 잡혔겠지만, 그 사이 복구 지점이 하루 비어 있었다.\n\n[덤프 크기 증가는 정상] 576,864 → 784,205 bytes(+36%)는 감염과 무관하다. 같은 날 `G-eos63` 프로브가 prod DB에 ATTEMPTS=20·EVENTS=20을 기록했고(게이트 evidence: WINDOW 2026-09-10T03:33:12Z), 그 20행이 증가분과 정합한다. 이 행들은 런북이 지정한 **고정 합성 사용자** 소유이며 실제 학생 데이터가 아니다 — ③(학생 데이터 노출 판정)의 \"실 학생 PII 0건\"은 유지되되, 이제 DB가 완전히 비어 있지는 않다는 점을 시점과 함께 적는다.\n\n[따라서 ①에 추가] 침해 범위 실측에 **백업 무결성·연속성** 축을 포함한다. 이번엔 1회 유실로 끝났고 기존 백업의 변조 흔적은 관측되지 않았으나(9/7~9/9 파일 크기·시각 정상), 감염 기간 전체에 대해 같은 유형의 조용한 실패가 더 있었는지는 미확인이다."
  - "[교차참조 2026-09-12] acceptance ④가 요구한 문서 정정 중 세션이 실행 가능한 순수 텍스트 정정(docs/ops/amd395_local_llm_performance.md·.claude/commands/llm-perf-doctor.md의 '미규명'·'재시작이 답' 오진 표시)은 OPS-74로 분리해 완료했다(PR #1137) — SEC-34 owner:kiki 때문에 세션이 --as kiki로 본 태스크를 직접 착수하지 않고 스코프를 나눴다. 감염기간과 겹치는 성능 수치의 전면 재측정은 OPS-75(depends_on SEC-34)로 등재했다 — SEC-34의 나머지 acceptance(②자격증명 로테이션·백신 전체 검사·보안 예외 원복 등)가 완결돼야 OPS-75가 착수 후보가 된다."
