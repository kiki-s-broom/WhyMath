  - "② 집행 지점 축(별항·2026-08-04 헌법 별항) — 집행 지점 = 'GET /v1/me/harness-metrics(api/me.py:3063) 호출이 학생 토큰에서 실제로 403이 되는 것'. 라우트를 이름으로 명시한다"
