acceptance:
  - "① 사각 확정 — HARN-106은 스캔 대상을 저장소 런북 파일(docs/ops/*runbook*.md)로 한정하고, HARN-114는 펜스의 실행 의도 태그만 본다. **채팅으로 직접 건네는 실행 블록**의 선행 판정 자가거부 가드는 어느 쪽도 검사하지 않는다는 것을 실측으로 고정한다(두 태스크의 acceptance 인용)."
  - "② 최소 계약 — 채팅 실행 블록이 상태 전환 명령(체크아웃·브랜치 전환·환경 전환)을 담으면, 그 전환이 실패했을 때 뒤 명령이 계속 도는 형태를 금지한다. 전환 직후 실제 상태를 되읽어 출력하고, 기대와 다르면 뒤 단계를 거부하는 가드를 같은 블록에 둔다. 가드 형태는 HARN-106 ①의 단일 최상위 if와 같은 줄 else를 그대로 쓴다(대화형 붙여넣기 파싱 실측 완료된 형태)."
  - "③ 변별력 없는 확인 스텝 금지 — 2026-09-23 사고에서 CLI·코퍼스 파일 존재 확인 3줄이 전부 True를 냈는데, 그 파일들은 **두 트리 모두에** 있어 판정력이 0이었다. 확인 스텝은 잘못된 상태에서 실제로 False를 내는 것만 쓴다. 브랜치·커밋 확인은 존재 검사가 아니라 동일성 검사여야 한다."
  - "④ 기계 집행 경로 판정 — HARN-114의 Stop 훅이 이미 transcript를 읽으므로 그 훅에 이 검사를 얹을 수 있는지 먼저 본다. 가능하면 HARN-114 만료(2026-10-02경) 이후 확장으로 붙이고, 불가하면 별도 훅을 설계한다. 어느 쪽이든 **판정 근거를 적는다** — 훅에 얹을 수 있다/없다를 소스 확인 없이 가정하지 않는다."
  - "⑤ 변별력 — 가드 없는 채팅 블록·가드는 있으나 실패 가지가 침묵하는 블록·판정 변수를 참조하지 않는 위장 가드 3종을 주입해 전건 RED를 확인한다. 정상 블록에서는 GREEN. 탐지기가 transcript를 못 읽는 경우는 작업을 막지 않고 통과시킨다(관측 실패가 작업 실패가 되면 안 된다 — HARN-114 ⑥ 선례)."
