acceptance:
  - "① 형제 관계 실측 — `src/backend/whymath_backend/l3/equivalent/`의 스켈레톤 생성기 전수에서 \"형제 설계를 그대로 재적용\" 관계를 찾는다. 단서는 docstring의 자기서술이다(`highschool_quotient_rule_skeleton_generator`가 \"`calculus_chain_quotient_rule_skeleton_generator`의 몫의 미분법 설계를 K-12 축으로 그대로 재적용한다\"고 적어 둔 것이 QUAL-07의 출발점이었다). 이름·상수명이 아니라 **역할**로 찾는다 — `_A_RANGE`·`_QUOT_A_RANGE`처럼 접두만 다른 동형 상수, 같은 수식 템플릿, 같은 `evaluate_condition` 형태. 찾은 방법과 **찾지 못한 범위**를 함께 적는다(부재 주장은 검색 방법이 옳아야 성립한다)."
  - "② 겹침 판정 기준 설계 — 발문 축은 `problem_duplication_audit`이 이미 0쌍으로 깨끗하다. 문제는 그 **아래 층**이다: QUAL-07에서 발문 동일 71쌍 아래에 조건식 동일 138건이 깔려 있었다. 그런데 조건식 축을 그대로 게이트로 올리면 오탐이 압도한다 — 전 코퍼스 스캔에서 조건식을 공유하는 쌍 6쌍 중 계보 관계를 뺀 228건이 **전부 오탐**이었다(예: `(-1) + (-3) = y`가 복소수 실수부와 다항식 상수항 양쪽에서 나온다). 그러므로 이 태스크의 본체는 \"겹침을 세는 것\"이 아니라 **\"무엇을 겹침으로 셀 것인가\"를 오탐률과 함께 정의하는 것**이다. 후보 축(파라미터 공간 집합 비교 · 조건식 + 개념/성취기준 동시 일치 · 생성 파라미터 튜플 직접 비교)을 각각 오탐 표본으로 측정해 비교하고, 채택 기준과 **버린 축의 오탐 근거**를 남긴다."
  - "③ 전수 판정과 처분 — ②의 기준으로 형제 쌍 전수를 판정한다. 겹침이 나오면 QUAL-07 선례를 따른다: 문항 은퇴가 아니라 **생성기 공간 서로소 분리**가 기본이고(은퇴만 하면 재생성 시 재발한다), 좁히는 쪽의 다양성·난이도 분포가 성취기준 요구를 여전히 만족하는지 측정으로 확인한다. 겹침이 0이면 **0이라는 판정 자체를 증거와 함께 남긴다** — \"안 나왔다\"와 \"안 찾았다\"는 다르다."
  - "④ 집행 지점(정본화와 별항) — ②의 기준을 코드로 만들었다면 그것이 CI에서 실제로 도는지 확인하고 어느 워크플로·잡·스텝인지 실측해 적는다. 도구화하지 않기로 판정했다면(오탐률이 게이트를 세울 수준이 아니라면) **그 판정 근거를 문서에 남기고 태스크로 승계**한다 — 산문에만 남은 \"나중에\"는 추적되지 않는다. 어느 쪽이든 보호 장치를 만들었으면 결함 주입으로 RED를 실측한다(정상 입력 초록은 보호의 증거가 아니다)."
