  - "① 현재 상태 재현 — 2026-10-17 재판정 실측(main e35692ef): [12미적Ⅰ-02-02]의 Content Coverage 연결은 problem_bank_conceptual_v0의 승인 문항 24건(전부 ptype.verify-claim · 한 틀 |x-a|+c · 정답 전부 0)에만 의존한다. 이 24건의 승인을 인정하지 않으면 Content Coverage가 9/10=90%로 내려가 P3-G1 기준(95%)을 못 채운다 — 개념 1개가 10%p다. 같은 개념의 승인 문항 84건 중 나머지 60건(problem_bank_p3_fill_v0: evaluate-expression 36 · solve-for-unknown 24)은 02-02 스킬(deductive-reasoning · graph-reading)에 매핑되지 않아 Content에 기여하지 않는다.\n② 원인 판정 — 60건이 스킬에 닿지 않는 것이 설계(유형↔스킬 매핑이 옳고 슬롯 채우기용 문항일 뿐)인지, 매핑 또는 문항 유형의 결함인지를 가른다. 판정 근거는 type_skills 매핑표와 02-02 스킬 목록이다.\n③ 결정 — (가) 02-02 스킬에 닿는 유형(verify-claim 외 prove-statement · infer-relationship · sketch-graph 등)의 승인 문항을 더 확보하거나 (나) 현 구조를 의도로 확정하고 단일 템플릿 의존을 위험으로 명시 기록한다. (가)의 새 문항은 감사 통과가 필요해 사람 게이트가 걸릴 수 있다 — 착수 시 MP-03 절차를 따른다.\n④ 이 태스크는 대표 과정 범위(미적분Ⅰ 미분) 안의 02-02만 다룬다. 다른 개념·단원은 채우지 않는다."
