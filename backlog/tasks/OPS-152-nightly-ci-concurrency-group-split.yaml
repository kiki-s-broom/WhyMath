acceptance:
  - "① ci.yml 최상위 concurrency.group에 github.event_name을 넣어 schedule 실행과 push 실행이 서로 다른 그룹을 쓰게 한다. 현행 그룹은 ci-${{ github.workflow }}-${{ github.ref }}라 schedule(ref=refs/heads/main)과 main push가 같은 그룹이고, cancel-in-progress: true라 main에 push가 들어오면 진행 중인 야간 실행이 취소된다.\n② cancel-in-progress는 schedule 실행에서만 끈다(기존 PR·push 취소 동작은 유지 — 비용 절감 의도 보존).\n③ tests/infra/test_ci_job_coverage.py 계열에 schedule과 push의 group이 다르다를 ci.yml YAML 파싱으로 단언하는 테스트를 둔다. 그룹 식을 되돌리는 뮤테이션(적용 단언 mutated != original, 바이트 동일 원복)이 RED여야 하고 정상 대조군은 GREEN이어야 한다.\n④ PR 본문에 최근 야간 schedule 실행의 취소 증거(#6067 · #6032 · #5910 · #5763 cancelled)를 인용한다.\n⑤ 머지 뒤 다음 야간 실행 결과 확인은 통합 점검 계획 Step 1-E가 맡는다(이 태스크의 범위 밖).\n범위 밖: backend-serial-nightly 타임아웃 여유 2%는 통합 점검 계획 3-A #12가 소유한다."
