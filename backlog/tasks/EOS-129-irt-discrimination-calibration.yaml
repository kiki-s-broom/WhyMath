acceptance:
  - "① 근본 원인 실측 고정 — CAT 진단 경로는 모든 응답을 Rasch(a=1.0)로 다룬다. `l2/next_problem_selection.py::load_attempt_history_state`가 `IrtItem(difficulty=b)`만 만들고 변별도를 넘기지 않기 때문이다. a=1.0이면 문항당 최대 정보량이 0.25라 SE ≤ `TARGET_SE`(0.3)는 총정보량 11.11을 요구하고, 이는 **이상적 적응 출제에서도 45문항**이다(실측: 난이도 1.0~5.0 균등 코퍼스 + `select_next_item` → 46문항 / EOS-22 프로브 → 67문항). 이 하한을 회귀로 고정한다.\n② 쓰기 경로 부재 확정 — `Problem.irt_a` 컬럼·스키마 필드는 존재하나 저장소 전체에 **쓰기 경로가 0건**이다(2026-09-21 실측: 소비처는 `l1/problem_bank/probe_candidates.py` → `l4/misconception/probe_selection.py`의 오개념 프로브 경로뿐이고, 보정기 `l2/item_calibration.py`는 `fit_jmle`(1PL·a 고정)로 b만 적합한다). 즉 a는 항상 NULL이다.\n③ 2PL 보정 배선 — 문항별 응답이 충분한 문항에 한해 변별도 a를 추정해 `Problem.irt_a`에 영속하고, CAT 진단 경로가 그것을 소비하게 한다(`resolve_item_difficulty_b`의 대칭축). 추정 불안정 구간은 a=1.0 폴백을 유지하되 **폴백 비율을 리포트가 말해야 한다**(CLAUDE.md \"작동한 비율\" 원칙 — 보정이 실제로 작동한 문항 비율).\n④ 도달 비용 재측정 — 배선 후 같은 프로브로 수렴 곡선을 다시 재고, SE 0.3 도달 문항 수가 몇으로 내려갔는지 실측한다(a=1.5면 하한 20문항·a=2.0이면 12문항). 그 수가 `MAX_ADMINISTERED_ITEMS`(현재 20) 이하로 내려가면 2차 중단 규칙이 발화하기 전에 정밀도 축이 먼저 발화하므로, EOS-126의 상한은 자연히 비상구로만 남는다.\n⑤ 선행 조건(데이터 게이트) — ③은 문항당 응답 축적이 선행돼야 한다. 현재 b 보정조차 `_MIN_RESPONSES_FOR_CALIBRATION = 5`이고, a 추정은 b보다 더 많은 응답을 요구한다. 착수 전 운영 코퍼스의 문항당 응답 분포를 실측해 **추정 가능한 문항이 몇 건인지** 먼저 적는다. 0건에 가까우면 이 태스크는 데이터 축적 대기이며, 그 사실 자체가 산출물이다."
  - "[부분 이행 2026-09-28 · 판정 기준 main `45a2144b` · 태스크 미완 — 게이트 `G-eos129-item-response-census` 대기] ① 충족 — a=1.0 하한을 L2 단위 테스트로 동결했다: `tests/backend/l2/test_irt_rasch_information_bound.py`(실제 IRT 함수로 a=1.0→45문항 · a=1.5→20 · a=2.0→12의 n-1/n 경계 · `load_attempt_history_state`가 보정 b=0 이력 44문항에서 SE>0.3, 45문항에서 SE≤0.3 · `TARGET_SE == 0.3` 단언). EOS-126 테스트는 중단 규칙 거동만 동결했고 하한 자체는 동결하지 않았다. ② 재확인 — `Problem.irt_a` 쓰기 경로 0건(main `45a2144b`에서 대입·UPDATE 값·dict 키 검색 결과 0) · 소비처는 오개념 프로브 후보(`l1/problem_bank/probe_candidates.py`)뿐. ⑤ 선행 측정은 운영 DB 읽기라 세션이 할 수 없다 → 읽기 전용 측정 도구 `l2/item_response_census`(모집단은 b 보정기와 같은 `graded_response_stmt()` · 조회 전 READ ONLY 선언 · a 후보는 학생 수와 정답·오답 공존으로 판정 · 임계 30·100·200·500에서 각각 집계 · 식별자 비출력 · 측정 실패 exit 3)와 Kiki 런북 `docs/ops/eos129_item_response_census_runbook.md`를 만들고 게이트를 부착했다(뮤테이션 9/9 RED). ③④는 게이트 결과(추정 후보 문항 수)를 본 뒤 착수 여부를 정한다 — 0에 가까우면 데이터 축적 대기."
  - "[정정 2026-09-28 · 판정 기준 main `45a2144b`] 바로 위 항 ②의 \"쓰기 경로 0건\"은 **이름으로 쓰는 코드** 기준이다(대입·UPDATE 값·dict 키로 `irt_a`를 지목하는 코드 0건). 정확한 사실은 이렇다: a를 **추정해** 쓰는 경로는 0건이고, 쓰기 경로는 스키마→ORM 일괄 복사(`db/models/problem.py::Problem.from_schema` — `model_dump()` 전 필드를 매핑 컬럼으로 옮김) 하나뿐이다. 그 경로는 외부 입력의 `irt_a`를 그대로 옮길 뿐이며, 문제 은행 코퍼스 74파일(`data/corpus/problem_bank*`)에 `irt_a` 비-null 값이 0건이라 적재로도 채워지지 않는다. 그래서 결론(운영의 `irt_a`는 항상 NULL)은 같지만, ③을 구현할 때 이 일괄 복사 경로가 보정값을 코퍼스 재적재로 덮어쓰는지(b 보정의 코퍼스 커밋 문제와 같은 축)를 함께 확인해야 한다."
