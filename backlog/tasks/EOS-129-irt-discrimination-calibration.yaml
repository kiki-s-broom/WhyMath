notes: "출처: EOS-126(CAT 중단 규칙 도달 비용) 해소 중 실측 발견. EOS-126은 문항 수 상한(2차 중단 규칙)으로 학습 진입 차단을 풀었으나, 그것은 도달 비용을 *우회*한 것이지 *줄인* 것이 아니다. 수렴 속도 자체를 올리는 축(EOS-126 처분 3택의 '나')이 이 태스크다.\n\nEOS-126이 (나)를 고르지 않은 이유: a 추정 경로가 저장소에 없고 문항당 응답 축적이 선행돼야 해 그 회차에 실행 불가였다. (가) 임계 완화는 acceptance ③의 금지선(측정 근거 상실)이라 배제했고, 남은 (다)를 집행하며 이 태스크를 근본 원인 후속으로 분리했다.\n\n코드 참조: `l2/next_problem_selection.py`의 MAX_ADMINISTERED_ITEMS 주석이 이 id를 인용한다.\n\n[정정 2026-09-28] paths ['src/backend/whymath_backend/l2/item_calibration.py', 'src/backend/whymath_backend/l2/irt.py', 'src/backend/whymath_backend/l2/next_problem_selection.py'] → ['src/backend/whymath_backend/l2/item_calibration.py', 'src/backend/whymath_backend/l2/irt.py', 'src/backend/whymath_backend/l2/next_problem_selection.py', 'src/backend/whymath_backend/l2/item_response_census.py', 'tests/backend/l2/test_item_response_census.py', 'tests/backend/l2/test_irt_rasch_information_bound.py', 'docs/ops/eos129_item_response_census_runbook.md', 'scripts/analysis/eos_feature_inventory_v2.py']: ⑤ 데이터 게이트 선행 — 운영 DB의 문항당 응답 분포를 재는 읽기 전용 측정 도구(l2/item_response_census)와 Kiki 실행 런북을 만들고, ① 하한(a=1.0에서 45문항)을 L2 단위 테스트로 동결한다. 새 모듈은 EOS 기능 인벤토리(WM-E-203)에 귀속해야 infra-contracts가 통과한다(3경로 유지 + 5경로 추가)\n\n[정정 2026-09-28] ⑤ 데이터 게이트 부착 — 운영 DB 실측 결과가 나오기 전에는 ③(2PL 보정) 착수 판단 불가\n\n[정정 2026-09-28] 부분 이행 기록 — ①② 충족·재확인, ⑤ 측정 도구·런북·게이트\n\n[정정 2026-09-28] 부재 주장 정밀화 — 이름 검색으로는 보이지 않는 일괄 복사 쓰기 경로(from_schema) 병기"
