acceptance:
  - "① 근본 원인 실측 고정 — CAT 진단 경로는 모든 응답을 Rasch(a=1.0)로 다룬다. `l2/next_problem_selection.py::load_attempt_history_state`가 `IrtItem(difficulty=b)`만 만들고 변별도를 넘기지 않기 때문이다. a=1.0이면 문항당 최대 정보량이 0.25라 SE ≤ `TARGET_SE`(0.3)는 총정보량 11.11을 요구하고, 이는 **이상적 적응 출제에서도 45문항**이다(실측: 난이도 1.0~5.0 균등 코퍼스 + `select_next_item` → 46문항 / EOS-22 프로브 → 67문항). 이 하한을 회귀로 고정한다.\n② 쓰기 경로 부재 확정 — `Problem.irt_a` 컬럼·스키마 필드는 존재하나 저장소 전체에 **쓰기 경로가 0건**이다(2026-09-21 실측: 소비처는 `l1/problem_bank/probe_candidates.py` → `l4/misconception/probe_selection.py`의 오개념 프로브 경로뿐이고, 보정기 `l2/item_calibration.py`는 `fit_jmle`(1PL·a 고정)로 b만 적합한다). 즉 a는 항상 NULL이다.\n③ 2PL 보정 배선 — 문항별 응답이 충분한 문항에 한해 변별도 a를 추정해 `Problem.irt_a`에 영속하고, CAT 진단 경로가 그것을 소비하게 한다(`resolve_item_difficulty_b`의 대칭축). 추정 불안정 구간은 a=1.0 폴백을 유지하되 **폴백 비율을 리포트가 말해야 한다**(CLAUDE.md \"작동한 비율\" 원칙 — 보정이 실제로 작동한 문항 비율).\n④ 도달 비용 재측정 — 배선 후 같은 프로브로 수렴 곡선을 다시 재고, SE 0.3 도달 문항 수가 몇으로 내려갔는지 실측한다(a=1.5면 하한 20문항·a=2.0이면 12문항). 그 수가 `MAX_ADMINISTERED_ITEMS`(현재 20) 이하로 내려가면 2차 중단 규칙이 발화하기 전에 정밀도 축이 먼저 발화하므로, EOS-126의 상한은 자연히 비상구로만 남는다.\n⑤ 선행 조건(데이터 게이트) — ③은 문항당 응답 축적이 선행돼야 한다. 현재 b 보정조차 `_MIN_RESPONSES_FOR_CALIBRATION = 5`이고, a 추정은 b보다 더 많은 응답을 요구한다. 착수 전 운영 코퍼스의 문항당 응답 분포를 실측해 **추정 가능한 문항이 몇 건인지** 먼저 적는다. 0건에 가까우면 이 태스크는 데이터 축적 대기이며, 그 사실 자체가 산출물이다."
  - "[정정 2026-09-29 · ⑤ 실측 결과] 게이트 G-eos129-prod-response-distribution을 Kiki 머신 운영 DB(whymath-pg, 5433) 읽기 전용 실측으로 닫았다(판정 기준 main 9308cf4c). problem 1703건 중 채점된 응답이 있는 문항은 80건이며 전부 문항당 1~4건 구간이다. 응답 학생은 1명이다. 5건 이상(b 보정 최소선) 문항 0건 · 100건 이상(a 추정 후보) 문항 0건이므로 a 추정 가능 문항은 0건이다. 결론: ③ 2PL 배선(PR 1358)은 a=1.0 폴백으로 휴면하며 폴백 비율 리포트가 그 사실을 말한다 — 이 태스크의 실효는 데이터 축적 대기다. 재측정 조건: 운영 학생 응답이 축적돼 5건 이상 문항이 생기면 python -m whymath_backend.l2.calibrate_items --dry-run --json으로 재측정한다(날짜 트리거 아님)."
  - "[정정 2026-09-29 · 재측정 조건] 위 정정 항이 재측정 조건을 '5건 이상 문항 발생'이라 적었으나 오기다. 5건(_MIN_RESPONSES_FOR_CALIBRATION)은 b(1PL) 보정 바닥이고, 변별도 a는 응답 50건 이상(_MIN_RESPONSES_FOR_DISCRIMINATION)이면서 SE 0.3 이하일 때만 채택된다(l2/item_calibration.py). 재측정 조건 = a 채택 문항(discrimination_calibrated)이 처음 1건 이상 생기는 것이며, 그 신호는 EOS-154-irt-a-first-adoption-signal이 소유한다."
