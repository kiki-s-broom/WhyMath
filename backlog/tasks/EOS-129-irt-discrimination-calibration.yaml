notes: "출처: EOS-126(CAT 중단 규칙 도달 비용) 해소 중 실측 발견. EOS-126은 문항 수 상한(2차 중단 규칙)으로 학습 진입 차단을 풀었으나, 그것은 도달 비용을 *우회*한 것이지 *줄인* 것이 아니다. 수렴 속도 자체를 올리는 축(EOS-126 처분 3택의 '나')이 이 태스크다.\n\nEOS-126이 (나)를 고르지 않은 이유: a 추정 경로가 저장소에 없고 문항당 응답 축적이 선행돼야 해 그 회차에 실행 불가였다. (가) 임계 완화는 acceptance ③의 금지선(측정 근거 상실)이라 배제했고, 남은 (다)를 집행하며 이 태스크를 근본 원인 후속으로 분리했다.\n\n코드 참조: `l2/next_problem_selection.py`의 MAX_ADMINISTERED_ITEMS 주석이 이 id를 인용한다.\n\n[정정 2026-09-28] acceptance ⑤(착수 전 운영 코퍼스 문항당 응답 분포 실측)는 운영 DB 접근이 필요해 세션이 수행할 수 없다 — Kiki 실측 게이트로 분리하고, 결과가 나오기 전에는 ③(2PL 보정 배선)을 착수하지 않는다(⑤가 0건에 가까우면 데이터 축적 대기가 산출물)\n\n[병합 정정 2026-09-28 · PR #1358] 위 정정과 별개로 ③은 이미 구현·완료됐다(PR #1358). 배선은 a=1.0 폴백이라 응답이 없으면 동작 불변(회귀 0)이므로 ⑤ 결과 전에 착지해도 해가 없다 — ⑤가 0건이면 배선은 휴면하고 폴백 비율 리포트가 그 사실을 말한다. ⑤ 실측은 main 게이트 G-eos129-prod-response-distribution(SQL 런북)이 정본이며, #1358 머지 후에는 `python -m whymath_backend.l2.calibrate_items --dry-run --json`(WHYMATH_DATABASE_URL=5433 지정 필수)도 같은 분포를 낸다.\n\n[정정 2026-09-29] ⑤ 운영 실측 결과 반영(a 추정 가능 문항 0건 · 데이터 축적 대기)\n\n[정정 2026-09-29] 재측정 조건 오기 정정(5건→a 채택 50건+SE 게이트) · 신호 태스크 EOS-154 연결"
