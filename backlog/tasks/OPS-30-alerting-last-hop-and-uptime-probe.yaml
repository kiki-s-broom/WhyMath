  - "③ 변별력 실측(양방향) — 서버를 실제로 내린 상태에서 프로브가 다운을 기록하고 알림이 채널에 도달하는지, 정상 상태에서는 조용한지를 둘 다 실측한다. pid 파일·/health 응답 같은 간접 신호를 성공 근거로 삼지 않는다(CLAUDE.md '간접 신호를 성공 판정으로 쓰는 안내 금지' — 2026-07-17 좀비 uvicorn 사고)."
  - "④ 범위 밖 동결 — 지표 영속화(ClickHouse 적재)·경로별 지연 분해(S5)·다중 워커 합산 스크레이퍼는 포함하지 않는다(incident_response_slo.md §6의 별개 항목·단일 워커 단계에선 무의미). 이 태스크는 '알림이 사람에게 도달하는가'와 '서버 죽음이 관측되는가' 두 홉만 닫는다."
