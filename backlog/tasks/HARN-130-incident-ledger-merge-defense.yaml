# 빌드 하네스 태스크 — 상태 변경은 scripts/harness/backlog.py CLI 사용 권장
id: HARN-130-incident-ledger-merge-defense
title: "사고 대장 머지 충돌 구조적 제거 — incidents.ndjson이 union 드라이버·샤딩 둘 다 못 받았다 (HARN-46 동형 2회차)"
track: infra-debt
stage: S3
subject: cross
layer: infra
status: done
priority: 2
eos_priority: P2
owner: claude
depends_on: []
requires_gates: []
acceptance:
  - "① 진단 고정 — `backlog/incidents.ndjson`이 `.gitattributes`의 union 목록에 없고 샤딩도 안 돼 있음을 실측으로 고정한다. 현행 union 대상은 `MEMORY.md`·`backlog/events.ndjson`·`backlog/events/*.ndjson` 3종뿐이며, HARN-118로 착지한 사고 대장만 두 방어 중 어느 것도 못 받았다. 1회차 실사고 = 2026-09-21 PR #1255가 머지 큐에서 `MERGE_CONFLICT`로 이탈했고 충돌 파일이 정확히 이 파일 하나였다(base 676줄에 양쪽이 각각 2줄·3줄 append)."
  - "② 방어 선택의 근거를 적는다 — union 드라이버 추가만으로는 부족하다. `.gitattributes` 자신의 주석이 이미 \"GitHub 서버는 merge driver를 적용하지 않는다(사고 원인)\"를 적고 있으므로 union은 로컬 머지만 돕고 머지 큐 충돌은 그대로 남는다. HARN-46이 이벤트 대장에서 택한 '충돌 불가능 구조'(세션별 샤드)와 같은 축을 택하거나, 택하지 않는다면 왜 이 대장은 달라도 되는지를 근거와 함께 적는다."
  - "③ 쓰기 경로 이관 — 사고 등재 CLI(`backlog.py incident add`)가 공용 파일이 아니라 세션(=브랜치)별 샤드에 쓴다. 서로 다른 브랜치가 같은 파일을 동시에 append하는 상황 자체가 사라져야 하며, 드라이버에 의존하는 형태로 끝내지 않는다(HARN-46 acceptance 동형)."
  - "④ 읽기 합집합 무손실 — `incident report`·`series`·nth 계산과 `tests/harness/test_incidents.py`의 계약이 레거시 `backlog/incidents.ndjson` + 신규 샤드 전부를 읽어 기존 676+ 기록을 하나도 잃지 않는다. nth는 파일 순서가 아니라 date 순서를 유지한다(`TestNth::test_nth_follows_date_order_not_file_order` 계약 보존). 시드 재계산 계약(`TestSeedRecalculationMatchesReport`, total 676)은 시드 JSONL을 읽으므로 영향받지 않아야 한다."
  - "⑤ 변별력 — 두 브랜치가 각각 사고를 등재한 상태를 실제로 만들어 머지가 충돌 없이 성립하는지 확인한다. 그 전에 **이관 전 상태에서 같은 시나리오가 실제로 충돌을 내는 것을 먼저 재현**해 검사의 변별력을 보인다(정상 입력에서 초록인 것은 보호의 증거가 아니다 — CLAUDE.md 「보호 장치를 실패 주입 없이 '보호 있음'으로 선언 금지」). 샤딩을 되돌리는 뮤테이션에서 그 테스트가 RED여야 한다."
  - "[착지 기록 2026-09-29 · 분기 기준 main 120bd7c5] ① 진단 — 착수 시 .gitattributes union 대상은 MEMORY.md·events.ndjson·events/*.ndjson 3종뿐이었고 사고 대장은 단일 파일·날짜순 통째 재기록이었다. tests/harness/test_incident_ledger_sharding.py::TestTwoBranchMerge::test_pre_migration_layout_conflicts가 이관 전 배치(공용 대장 재기록 + 커밋 인덱스)의 두 브랜치 git 머지가 incidents.ndjson·jit_index.json 두 파일에서 충돌함을 재현해 동결한다(임시 저장소에 merge driver 없음 = GitHub 서버 조건). 1회차 PR #1255(09-21)에 이어 2026-09-28 PR #1363이 같은 충돌로 머지 큐를 이탈했다(계열 incident-ledger-merge-conflict). ② 방어 선택 = 세션 샤드(HARN-46 동형) — 근거는 incidents.py 모듈 docstring과 build_harness.md §2c 「머지 방어」. ③ incident add가 backlog/incidents/<세션>.ndjson에 1줄 append한다(샤드 이름은 이벤트 대장과 같은 store.session_shard_name). 레거시 대장은 바이트 불변. ④ 읽기 = 레거시 → 샤드 이름순 합집합(incidents.ledger_paths). TestNth 날짜순 계약·시드 676 재계산 계약은 무변경 통과. 2회차 강제도 합집합을 본다. ⑤ 이관 후 같은 시나리오를 실제 CLI로 돌리면 충돌 없이 합쳐지고 두 사고가 모두 읽히며 적시 주입에도 뜬다. 샤딩을 되돌리는 뮤테이션 2종(L01 레거시로 쓰기 · L02 모든 세션이 한 샤드)에서 그 머지 테스트가 RED임을 실측했다. [범위 확장 — 인덱스 축] 파생 인덱스 backlog/jit_index.json이 같은 두 PR에서 함께 충돌하므로(main에서 그 파일을 바꾼 커밋 26건 중 25건이 사고 대장도 바꿨다) 대장만 샤딩하면 ⑤가 거짓이 된다. 그래서 인덱스 커밋을 중단하고 적시 주입 후보를 편집 시 대장에서 계산한다 — check-edit 훅이 대장을 한 번 읽어 조율 정책 검사와 공유하며(그 검사가 원래 편집마다 대장을 읽었다 · 실측 1.98초) 추가 계산은 18ms다. 계산 결과 342건은 옛 커밋 인덱스와 동일하다(차이 1건 = 이 태스크의 paths 정정이 바꾼 사고 1건의 경로). jit check는 계산 검사(후보 0건·스키마 위반이면 exit 1)가 됐다. 뮤테이션 16종(대장 10 · 인덱스 6) 전건 RED · 대조군 GREEN · 워크트리 변경 0 · 인덱스 재커밋 주입도 RED. [일반화 판정] 이 태스크의 원인은 교훈의 미승계였으므로 규칙 문장이 아니라 전수 검사로 막는다 — backlog/ 최상위 NDJSON 대장은 머지 방어 결정표에 이름이 있어야 한다(TestNewLedgerMustChooseAMergeDefense · 스캔 0건이면 실패)."
