notes: "근거: 2026-09-21 PR #1255 머지 큐 이탈 실측(`github-merge-queue[bot]` · reason=MERGE_CONFLICT). 판정 기준 main `27db64c4`. 충돌 재현·해소는 임시 워크트리에서 확인했고 합집합 681줄(676+3+2)에서 `backlog.py validate`·`audit-deps`·`incident report --json` 전건 exit 0이었다. 해소 자체는 그 PR 소유 세션에 맡겼다(2026-09-21 Kiki 판단) — 이 태스크는 재발 방지 축만 소유한다.\n\n선례: HARN-46(이벤트 대장 세션 샤딩 · done)이 같은 유형의 1회차이고 이것이 2회차다. 그때의 교훈(드라이버 의존이 아니라 충돌 불가능 구조로 이관)이 신설 대장에 승계되지 않은 것이 이번 원인이다 — 즉 개별 파일의 누락이 아니라 \"append-only 대장을 새로 만들 때 머지 방어를 함께 설계한다\"는 규약의 부재일 수 있다. 그 일반화가 필요한지는 이 태스크가 판단한다.\n\n소유 경계: HARN-118(사고 대장 구조화)은 done이라 여기에 부착할 수 없어 신규 등재한다(만료된 좌석에 매다는 대신 분리 — CLAUDE.md 중복 소유 회피)."
