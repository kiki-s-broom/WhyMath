# 브랜치 정리 워크플로 (HARN-16 후속 — 원격 삭제 경로)
#
# 배경: 컨테이너(Claude Code 웹) 세션은 원격 브랜치를 삭제할 수 없다 — CCR git 프록시가
# ref 삭제 연산 자체를 HTTP 403으로 차단한다(HARN-16 · 2026-08-04 40건 실측 + 2026-08-09
# 프로브 재실측). 기존 위임 경로는 Kiki 로컬 PowerShell뿐이었는데, 이 워크플로는 그
# 세 번째 경로를 연다: 사람이 목록을 확정하고 세션이 workflow_dispatch로 트리거하면
# **GitHub Actions 러너가 저장소 자체 토큰으로** 삭제를 수행한다.
#
# 안전장치(협상 불가):
#   · 수동 트리거 전용(workflow_dispatch) — 자동 실행 경로 없음.
#   · `main` 및 허용 패턴(claude/*, tmp-*, worktree-agent-*) 밖 브랜치는 거부한다.
#     worktree-agent-* 추가(2026-08-11): 하네스 worktree 세션이 만드는 기계 생성 접두라
#     사람 브랜치와 섞이지 않는다. 이 패턴이 없어 `worktree-agent-a6e26595b30efb856`이
#     PR #728로 포팅 완료된 뒤에도 삭제 경로가 없어 잔존했다(실측).
#   · 삭제 직전 각 브랜치의 head SHA를 런 로그에 남긴다 — 삭제 후에도 그 SHA로
#     `commits/<sha>`·`contents?ref=<sha>` API 접근이 가능하다(섀도 브랜치 회수로 실증).
#   · 한 브랜치의 실패가 나머지를 막지 않되, 실패가 하나라도 있으면 잡은 red로 끝난다.
#
# 집행 본체는 `.github/scripts/branch_cleanup.sh`다(HARN-01에서 분리). 인라인 `run:`으로
# 두면 쉘 스크립트를 로컬에서 실행 검증할 방법이 없어, 실패 주입 검증(정상에서 초록인 것만으론
# 보호의 증거가 아니다 — CLAUDE.md 2026-09-01)이 GitHub 러너 전용이 된다. 분리하면
# `tests/infra/test_branch_cleanup.py`가 `gh`를 스텁으로 갈아끼우고 실제로 돌릴 수 있다.
name: branch-cleanup

# 트리거 2경로:
#   ① workflow_dispatch — Kiki가 GitHub UI Actions 탭에서 수동 실행(입력: 쉼표 목록).
#      세션의 MCP 토큰은 dispatch 권한이 없어(403 · 2026-08-10 실측) 세션은 ②를 쓴다.
#   ② push(main) — `.github/branch-cleanup-request.txt`가 main에 *머지*될 때 발동해 그
#      파일의 목록을 처리한다. main은 PR로만 갱신되므로 매 배치가 PR 감사 기록으로 남는다.
on:
  workflow_dispatch:
    inputs:
      branches:
        description: "삭제할 브랜치(쉼표 구분·claude/*, tmp-*, worktree-agent-* 만 허용)"
        required: true
        type: string
  push:
    branches: [main]
    paths: [".github/branch-cleanup-request.txt"]

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 브랜치 삭제 (SHA 스냅샷 동반)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ inputs.branches }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/branch_cleanup.sh
