# WhyMath CI — push·PR마다 린터·타입·테스트 자동 실행
#
# 이 workflow가 생성하는 status check를 GitHub Settings → Branches → Branch
# protection rules 의 "Require status checks to pass before merging" 에 등록하면
# CI 통과 없이는 main 머지가 막힌다 (branch-protection-setup.md 참조).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # merge queue 진입분 재검증 (HARN-56). 큐는 PR을 **main 최신 위에 얹은** 임시 브랜치
  # (refs/heads/gh-readonly-queue/...)에서 검증하므로, 이 트리거가 없으면 required check가
  # 큐 안에서 **한 번도 보고되지 않아** 모든 PR이 큐에서 무한 대기한다.
  # ⚠ 순서 제약: 이 트리거가 main에 착지한 *뒤에* 저장소 설정에서 큐를 켠다. 반대로 하면
  #    켠 시점부터 머지가 전면 정지한다.
  # 잡 게이팅과의 상호작용(실측): 무거운 잡의 if는 전부 `github.event_name != 'pull_request'`
  # 형태라 merge_group에서는 **전건 실행**된다 — 큐에서는 경로 기반 절약이 적용되지 않고
  # 전체 검증이 돈다. 이것이 의도한 동작이다(큐의 목적이 최신 base 위 전체 재검증이므로).
  # 야간 전용 잡(`if: github.event_name == 'schedule'`)은 큐에서 계속 스킵된다.
  merge_group:
  # 야간(KST 03시 = UTC 18시) E2E 안전망 — push/PR 없이도 관통 슬라이스가 도는지 확인.
  # GitHub schedule은 default branch(main)에서만 발화한다. 이 이벤트에선 e2e-nightly만
  # 돌고, 무거운 push/PR 잡들은 `&& github.event_name != 'schedule'` 가드로 스킵된다.
  schedule:
    - cron: "0 18 * * *"

# 동일 PR/브랜치에서 새 푸시가 오면 이전 실행 취소 (비용 절감)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 변경 경로 판별 (슬112·CI 비용 절감) — doc-only PR이면 무거운 잡 skip
  # GitHub는 `if`로 skip된 잡을 required status check *충족*으로 처리하므로
  # branch protection과 호환된다. push(main)는 항상 전체 실행(다운스트림 if가
  # event로 우회). policy-guard·infra-shell은 초 단위라 게이트하지 않는다
  # (특히 policy-guard는 docs 변경이야말로 검사 대상이라 항상 실행).
  # ─────────────────────────────────────────────────────────────────
  changes:
    name: changes — 변경 경로 판별
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      data_pipeline: ${{ steps.filter.outputs.data_pipeline }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
      corpus: ${{ steps.filter.outputs.corpus }}
      authoring: ${{ steps.filter.outputs.authoring }}
    steps:
      - name: Checkout (merge commit + 부모 — PR diff용)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 변경 파일 → 영역 플래그
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push(main) — 전체 실행(다운스트림 if가 event로 우회·이 값은 미사용 안전값).
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "data_pipeline=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "corpus=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # pull_request의 HEAD는 merge commit — ^1(=base tip) 대비 diff가 곧 PR 변경 전량.
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '변경 파일:\n%s\n' "$files"
          be=false; dp=false; mo=false; web=false; dk=false; cp=false; au=false
          # data/ **최상위** *.json = py↔js↔dart 공유 계약 fixture 묶음(access_matrix·
          # notation_contract·render_contract·scene_contract·segmentation_contract·
          # visual_style_contract·notation_support_manifest·notation_missing_baseline).
          # backend·web 골든이 이 파일들을 읽으므로 fixture-only PR이 골든 잡을 skip하면
          # 계약 드리프트가 무검출로 통과한다(schemas/ 교차영역 방어와 동일 원리 ·
          # dsl_integration_gap_review §2-⑦).
          #
          # **개별 나열 → 접두 패턴으로 전환**(COLLAB-04 · r3 §3 D5, 2026-08-11). 개별
          # 나열은 이미 한 번 누락을 낳았다 — 8종 중 notation_contract·render_contract 2종만
          # 등재돼 있어 나머지 6종은 계약 단독 수정 PR에서 잡이 SKIP됐고, 게이트가 막으라고
          # 만들어진 바로 그 드리프트 벡터가 열려 있었다. 새 계약을 추가할 때마다 사람이
          # 이 줄을 기억해야 하는 구조 자체가 결함이므로, 목록이 아니라 **위치**로 잡는다
          # (`^data/[^/]+$` = data/ 최상위 파일 전건). 과트리거(계약 1종 수정에 여러 잡이 다
          # 도는 것)는 비용이지만 미트리거는 사고다 — fail-safe 방향을 택한다. 등재 완전성은
          # tests/infra/test_ci_contract_fixture_trigger_wiring.py가 기계로 동결한다(항상 도는
          # infra-contracts 잡 소속이라 계약 변경 여부와 무관하게 매 PR에서 발화).
          #
          # **COLLAB-07 정정 3건**(r3 §8-③, 2026-08-11) — COLLAB-04가 같은 논리를 끝까지
          # 적용하지 않아 남긴 축을 여기서 닫는다:
          #   (1) `data/[^/]+\.json$` → `data/[^/]+$`: 계약이 늘 json이라는 보장이 없다.
          #       suffix 한정은 최상위 비-json 계약(*.yaml 등)을 계약으로 **인식조차 못 해**
          #       가드 green·CI skip이 성립했다(합성 실증). 위치로 잡으면 그 사각이 없다.
          #   (2) `data/corpus/` **편입**: 이 잡의 *상시* 게이트 스텝(표기 커버리지
          #       notation_coverage)이 data/corpus/problem_bank_*/problems.jsonl을 전수
          #       스캔한다. 코퍼스에 신규 표기가 들어가면 그 게이트가 exit 1을 내는데, 코퍼스
          #       단독 PR은 이 잡을 깨우지 않아 **게이트를 실행조차 하지 않았다**. 게이트가
          #       자기 입력 변경에 안 깨어나는 상태다.
          #       ※ COLLAB-04 주석은 "하위 data/corpus/는 별도 축(corpus 플래그)이 담당"이라
          #         적었으나 **그 전제는 사실이 아니었다** — corpus 플래그는 발화 지점이
          #         data_pipeline 필터로 게이트된 잡 *내부*라 코퍼스 단독 PR에서 잡 통째 skip →
          #         아무것도 제어하지 못하는 죽은 플래그였다(아래 cp 블록·data-pipeline 잡 if의
          #         COLLAB-07 주석 참조). 틀린 정당화를 여기 남겨 두지 않는다.
          #   (3) `schemas/` **편입**: web(:web 블록)·mobile에는 있는데 backend에만 없었다.
          #       그런데 tests/backend/test_failure_prevention_manifest.py가 schemas/v1.1/*.yaml
          #       존재를 하드 단언한다 — 스키마 단독 삭제/이동 PR이 backend 잡을 skip한 채
          #       통과할 수 있었다.
          # 비용 실측(shallow 이력 80커밋·2026-08-07~): data/corpus 변경 7커밋·schemas 변경
          # 1커밋이며 **전건이 이미 다른 경로로 backend를 깨우고 있었다**(마진 과트리거 0건).
          #
          # **G0 동결 입력 2건 편입**(2026-08-30 · PR #910 Codex 리뷰 P1 지적 수용) —
          # `docs/standards/eos_verification_design_v1.md`(실패정의 F-Ⅰ~Ⅴ 정본)·
          # `backlog/gates.yaml`(서명 기록)은 tests/backend/schema/test_failure_definition_freeze.py
          # 가 해시로 동결하는 **입력**이다. 필터 밖이면 그 두 파일만 고치는 PR에서 backend 잡이
          # SKIP되고 skip은 required check에서 충족으로 계상된다 — 즉 **동결 테스트가 방어해야 할
          # 바로 그 벡터(문서·서명 조용한 수정)에서 실행되지 않는다**. data/corpus·schemas 편입과
          # 같은 형태의 사각(COLLAB-07 ①②)이며, 등재 완전성은 위 fixture 가드와 같은 파일
          # (test_ci_contract_fixture_trigger_wiring.py)이 동결 테스트의 FROZEN_INPUT_PATHS를
          # **AST로 파싱해** 강제한다(경로 목록의 하드코딩 두 벌 금지 — 새 동결 입력이 늘면
          # 가드가 자동으로 따라온다). 과트리거는 파일 2건 한정이라 비용이 사실상 0이다
          # (backlog/ 전체가 아니라 gates.yaml 하나 — 태스크 상태 변경 PR은 깨우지 않는다).
          #
          # **엔티티 동결 입력 1건 편입**(ARCH-38 · 2026-09-06) — 같은 형태의 사각이 하나 더
          # 있었고, 이 PR이 **자기 자신으로** 실증했다. `canonical_entity_model_v1.md`는
          # tests/backend/db/test_canonical_entity_model_freeze.py의 검사 ③④가 읽는 입력이다
          # (`_CANON_DOC` — §2-A·§2-B 표를 파싱해 상수와 1:1 대조). 그런데 필터 밖이라 그 문서만
          # 고치는 PR에서 backend 잡이 SKIP됐다 — 즉 **§2-A 표를 조용히 고쳐 좌석 배정을 바꿔도
          # 검사 ④가 실행되지 않는다**. G0 동결 입력(위)·data/corpus·schemas(COLLAB-07 ①②)와
          # 정확히 같은 형태의 네 번째다. 실증: PR #997(이 문서 단독 변경)에서 `backend —
          # lint·type·test`가 conclusion=skipped였고, skip은 required check에서 충족으로 계상된다.
          # ※ 이 입력도 이제 **AST 가드의 강제 범위 안**이다(OPS-62 · 2026-09-06) — 종전에는
          # test_ci_contract_fixture_trigger_wiring.py의 `_FREEZE_TEST`가 동결 테스트 **한 파일**을
          # 하드코딩해 다른 동결 테스트의 입력은 따라오지 않았다(그래서 이 사각이 생겼다). 지금은
          # 가드가 tests/backend/** 전건을 훑어 FROZEN_INPUT_PATHS를 선언한 동결 테스트 **전부**를
          # 대상으로 삼고(선언 0건이면 통과가 아니라 RED), test_canonical_entity_model_freeze.py도
          # 그 상수를 선언한다. 새 동결 테스트는 상수만 선언하면 이 필터 편입이 자동으로 강제된다.
          if printf '%s\n' "$files" | grep -qE '^(src/backend/|tests/backend/|conftest\.py$|data/[^/]+$|data/corpus/|schemas/|docs/standards/eos_verification_design_v1\.md$|backlog/gates\.yaml$|docs/architecture/canonical_entity_model_v1\.md$|\.github/workflows/ci\.yml$)'; then
            be=true
          fi
          if printf '%s\n' "$files" | grep -qE '^(src/data-pipeline/|tests/data_pipeline/|conftest\.py$|\.github/workflows/ci\.yml$)'; then
            dp=true
          fi
          # schemas/(공유 엔티티·계약 명세) 변경은 클라이언트(mobile/web) 잡도 트리거 —
          # 교차영역 계약 드리프트 방어(2026-07-21 정합성 검토: backend-only PR에서 클라
          # 잡이 skip돼 계약 변경이 클라 기대를 깨도 통과 가능했던 사각 보완).
          # data/*_contract.json 4종은 src/mobile/test/의 Dart 골든이 File('../../data/...')로
          # 직접 읽는 fixture다 — 필터에 없으면 fixture만 고친 PR에서 mobile 잡이 통째 skip돼
          # **이미 착륙한 계약 골든이 집행되지 않는다**(MATH-01 ④ 실측: notation=이번 편입,
          # segmentation=NLP-03, scene=MOB-14, render=VIZ-02 골든이 각각 미집행 상태였다).
          # skip은 red도 green도 아니지만 required check에서는 충족으로 계상돼 조용하다.
          #
          # COLLAB-07: mobile도 backend·web과 **같은 위치 패턴**으로 통일한다. 실측(2026-08-11)
          # 상 Dart 골든이 읽는 계약은 지금도 정확히 이 4종이라 **현재 누락은 없다** — 고치는 건
          # 결함이 아니라 *구조*다. 개별 나열은 backend가 겪은 누락 구조 그 자체이고, 새 계약을
          # mobile이 읽기 시작하는 순간 이 줄을 기억할 사람이 필요해진다. 추가 과트리거 비용은
          # shallow 이력 전체에서 2커밋(access_matrix·visual_style·notation_* 계열)뿐이다.
          if printf '%s\n' "$files" | grep -qE '^(src/mobile/|schemas/|data/[^/]+$|\.github/workflows/ci\.yml$)'; then
            mo=true
          fi
          # web도 backend와 **같은 접두 패턴**을 쓴다(COLLAB-04). 오늘 web 골든이 실제로 읽는
          # 계약은 notation_contract·render_contract 2종뿐이지만(실측 2026-08-11:
          # src/web/graphing-calculator/test/*.test.js), 그 2종만 나열하는 형태가 곧 backend가
          # 겪은 누락 구조다 — 새 계약을 web이 읽기 시작하는 순간 이 줄을 고칠 사람이 필요해진다.
          # 두 잡의 규칙을 하나로 통일해 유지보수 지점을 없앤다(과트리거 비용 < 미트리거 사고).
          # COLLAB-07: backend와 함께 `data/[^/]+\.json$` → `data/[^/]+$`(suffix 무관 최상위
          # 전건). 사유는 backend 블록 (1) 참조 — 계약이 json이라는 보장이 없다.
          if printf '%s\n' "$files" | grep -qE '^(src/web/|schemas/|data/[^/]+$|\.github/workflows/ci\.yml$)'; then
            web=true
          fi
          # OPS-03: 배포 산출물(이미지·compose) 변경 또는 백엔드 소스 변경 시 이미지 빌드·
          # 기동 스모크를 돌린다. 백엔드 소스를 포함하는 이유 — 이미지는 그 소스를 굽기 때문에
          # import 오류·기동 실패가 여기서만 잡히는 회귀가 있다(hermetic 유닛은 uvicorn 기동을
          # 하지 않는다). data/는 제외(코퍼스 변경은 매우 잦고 스모크가 그 내용을 판정하지 않음).
          if printf '%s\n' "$files" | grep -qE '^(Dockerfile$|\.dockerignore$|docker-compose\.prod\.yml$|\.env\.prod\.example$|src/backend/|tests/infra/test_deploy_artifacts\.py$|\.github/workflows/(ci|deploy)\.yml$)'; then
            dk=true
          fi
          # ARCH-21: 코퍼스 변경 시에만 QA 파이프라인 오케스트레이터(qa_pipeline)를 트리거
          # (상시 실행 아님 — data/corpus/는 매우 잦게 바뀌고 무거운 3축을 매번 돌리면 비용 낭비).
          #
          # COLLAB-07: 이 플래그는 **죽어 있었다**(r3 §8-③ 실측). 유일한 소비처가
          # data-pipeline 잡 *내부 스텝*의 if인데 그 잡의 if는 dp 플래그만 봤다 → 코퍼스 단독
          # PR에서 잡이 통째 skip돼 스텝이 한 번도 실행될 수 없었다(게다가 continue-on-error).
          # 해소책으로 (가) 이 플래그를 backend 필터에 흡수 (나) 잡 게이트에 OR로 편입 중
          # **(나)를 택했다** — 이유: ⓐ ARCH-21의 설계 의도가 "잡 안에서 코퍼스일 때만 무거운
          # 3축"이라 축 자체는 옳고 빠진 건 잡 레벨 OR 하나뿐이다 ⓑ 이 스텝은 backend+
          # data-pipeline 두 패키지 설치와 working-directory 오버라이드에 의존하는데 그 조합이
          # 갖춰진 잡이 여기다 ⓒ backend 잡으로 옮기는 안은 그 잡이 이미 35분 상한(pytest 단독
          # 22분+)에 붙어 있어 무거운 3축을 얹으면 타임아웃 리스크가 실재한다.
          # 코퍼스 자체의 *상시* 게이트(표기 커버리지)는 별개로 위 be 필터가 담당한다 —
          # 두 축은 대체재가 아니라 서로 다른 게이트다.
          #
          # ARCH-23: 검사기 소스(harness/·provenance_audit.py·l3/equivalent/)만 바뀌고
          # data/corpus/는 무변경인 PR에서는 이 플래그가 안 켜져 qa_pipeline 게이트가 한
          # 번도 안 돈다 — "검사기가 바뀌어도 안 돌던 구멍"(같은 코퍼스에 다른 판정 로직을
          # 적용하는 변경이 게이트를 건너뛴다). 세 경로를 추가해 검사기 변경도 이 플래그를
          # 깨우게 한다.
          if printf '%s\n' "$files" | grep -qE '^(data/corpus/|src/backend/whymath_backend/harness/|src/backend/whymath_backend/ops/provenance_audit\.py$|src/backend/whymath_backend/l3/equivalent/|\.github/workflows/ci\.yml$)'; then
            cp=true
          fi
          # PB-13: 결정론 저작 도구(스켈레톤 생성기·적재 배치)와 그 테스트를 건드리면
          # corpus-authoring 잡을 깨운다. 이 잡은 backend 잡에서 분리된 corpus_authoring
          # 마커 테스트(60파일·9분12초)를 돌린다 — 분리가 곧 비활성화가 되지 않도록,
          # **그 테스트가 지키는 코드를 바꾸는 PR에서는 반드시 실행**되게 하는 배선이다.
          if printf '%s\n' "$files" | grep -qE '^(src/backend/whymath_backend/l3/equivalent/|src/backend/whymath_backend/harness/|tests/backend/l3/equivalent/|tests/backend/harness/|\.github/workflows/ci\.yml$)'; then
            au=true
          fi
          echo "backend=$be" >> "$GITHUB_OUTPUT"
          echo "data_pipeline=$dp" >> "$GITHUB_OUTPUT"
          echo "mobile=$mo" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "docker=$dk" >> "$GITHUB_OUTPUT"
          echo "corpus=$cp" >> "$GITHUB_OUTPUT"
          echo "authoring=$au" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # L1 데이터 파이프라인 (현재 유일하게 패키지화된 영역)
  # ─────────────────────────────────────────────────────────────────
  data-pipeline:
    name: data-pipeline — lint·type·test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # doc-only PR이면 skip(비용 절감·required check는 skipped=충족). push는 항상 실행.
    # COLLAB-07: `corpus`를 OR로 편입한다. 이 잡 안에 코퍼스 전용 게이트 스텝(qa_pipeline)이
    # 있는데 잡 게이트가 그 축을 몰라, 코퍼스 단독 PR에서 잡 통째 skip → 스텝이 영영 실행되지
    # 못했다(죽은 플래그 · r3 §8-③). 스텝의 if는 그대로 두어 "코퍼스일 때만 무거운 3축"이라는
    # ARCH-21 의도를 유지한다 — 여기서 바뀌는 건 *잡이 깨어나는가*뿐이다. 재발 방지는
    # tests/infra/test_ci_contract_fixture_trigger_wiring.py::test_no_dead_changes_flag가 동결.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.data_pipeline == 'true' || needs.changes.outputs.corpus == 'true') && github.event_name != 'schedule'
    defaults:
      run:
        working-directory: src/data-pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # ARCH-21: QA 파이프라인 오케스트레이터(whymath_backend.harness.qa_pipeline)를 이
          # 잡에서 돌리려면 backend 패키지가 필요하다(backend 잡이 역방향으로 이미
          # `pip install -e ../data-pipeline`을 하는 것의 대칭).
          pip install -e ../backend

      # lint(ruff·black)는 src(.)뿐 아니라 tests(../../tests/data_pipeline)도 검사한다
      # (OPS-14 — backend 잡 PR #223 동형). 과거엔 src만 lint해 tests의 포맷 드리프트가
      # 검출 없이 쌓였다(2026-07-28 배선 직전 실측: black 23파일·ruff B007 1건 — 상환 완료).
      # ruff는 이 디렉터리의 pyproject 설정으로 tests까지 검사한다(src와 동일 규칙 —
      # E501 포함. 구 per-file-ignore는 config 밖 경로에 매치 불가한 죽은 설정이라 제거).
      - name: Ruff (lint — src + tests)
        run: ruff check . ../../tests/data_pipeline

      # black은 --line-length 100을 *명시*한다: 두 대상의 공통 조상(레포 루트)에 pyproject가
      # 없어 기본값 88로 폴백하기 때문(backend 잡과 동일 사유). 저장소 표준 root-100이
      # tests/* 배선(backend·infra·harness)의 공통 정본이다 — 2026-07-28 실측에서 src도
      # root-100 컨텍스트로 clean(위반 0)이라 단일 명령으로 통합.
      - name: Black (format check — src + tests)
        run: black --check --line-length 100 . ../../tests/data_pipeline

      - name: Mypy (strict type check)
        run: mypy --strict data_pipeline

      - name: Pytest (with coverage)
        run: |
          pytest \
            --cov=data_pipeline \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-pipeline
          path: src/data-pipeline/coverage.xml
          retention-days: 14

      # ARCH-21: 코퍼스 변경 시에만 트리거되는 옵션 스텝(상시 실행 아님 — changes 잡의
      # corpus 플래그 경유). harness/의 기존 검사 자산 9종(corpus_audit·수식동치·개념그래프·
      # 오개념crosswalk·코치프로즈누설·저작권·결함주입강등전·금칙어PII(ARCH-24)·
      # 학생결함신고수집(RPT-01) + wilson 경계)을 조립해 단일 JSON 리포트 + exit 0/1 게이트를
      # 낸다. 축 9(defect_report_intake)는 DB를 읽는데 이 잡엔 Postgres 서비스가 없어 이
      # 축만 상시 no_snapshot(검사 미수행 — 집계 제외, ARCH-23)으로 보고된다.
      # 이 스텝만 레포 루트로 working-directory를
      # 오버라이드한다 — 잡 기본값(defaults.run.working-directory: src/data-pipeline)에서는
      # `-m whymath_backend.harness.qa_pipeline`이 backend 패키지를 못 찾는다.
      # ARCH-23: S3-28 판정 반영(equivalence_canonicalize 축의 사전 존재 결함/오탐 해소) +
      # 축 9의 환경 판정 분리(DB 도달 불가 → no_snapshot, 위 참조) 완료로 continue-on-error를
      # 제거한다 — 이제 이 게이트는 실제로 PR을 막는 강제 게이트다.
      - name: 게이트 — QA 파이프라인 오케스트레이터 (코퍼스 변경 시만·qa_pipeline)
        if: needs.changes.outputs.corpus == 'true'
        working-directory: .
        run: python -m whymath_backend.harness.qa_pipeline --json qa_report.json

  # ─────────────────────────────────────────────────────────────────
  # L3 백엔드 (LLM 라우터 M1.2 — 결정 로직 + 타입 인터페이스)
  # data-pipeline 잡을 미러링. 라이브 서비스·API 키 없이 단위테스트만.
  # ─────────────────────────────────────────────────────────────────
  backend:
    name: backend — lint·type·test
    runs-on: ubuntu-latest
    # 스위트 성장(초인간 검증 하니스·843 트랜치·원자 축 누적·CACHE-01 content_supply)으로
    # 유닛+커버리지가 25분 경계 초과 → 2026-07-25 boundary 타임아웃 실측(pytest 단독 22분+ 미완).
    # timeout은 상한일 뿐이라 정상 완료 시 낭비 없음(hang 방지 상한만 유지)이므로 여유 상향.
    # 2026-08-21 main 01ff6041에서 이 여유(당시 최대 표본 기준 16%)가 실제로 소진돼
    # Pytest 단계 cancelled 발생(OPS-47). pytest-xdist 병렬화(OPS-58, 아래 Pytest 스텝
    # `-n auto --dist loadfile`)로 소요 자체를 줄이는 축을 채택 — slow 마크 분리는
    # 미채택(여러 축 동시 투입 시 어느 것이 들었는지 판정 불가 — CLAUDE.md 규칙).
    # 재측정(2026-09-10, main push 11표본, scripts/analysis/measure_backend_job_timeout_headroom.py):
    # 소요 최소/중앙/최대 12.7/18.3/19.5분 → 최대 표본 기준 여유 15.5분(44.2%, 목표 30%+ 충족).
    timeout-minutes: 35
    needs: changes
    # doc-only PR이면 skip(비용 절감·required check는 skipped=충족). push는 항상 실행.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') && github.event_name != 'schedule'
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # 교차계층 거버넌스 테스트(tests/backend/l1/test_five_node_connectivity_governance.py)가
          # data_pipeline(L1)을 import한다 → 백엔드 잡에도 설치(수집 ImportError 방지).
          pip install -e ../data-pipeline

      # lint(ruff·black)는 src(.)뿐 아니라 tests(../../tests/backend)도 검사한다(PR #223).
      # 과거 CI는 src만 lint해 tests의 위반(B905·N817·E501·I001 등)이 검출 없이 머지돼 왔다 —
      # 이 가드가 tests 위반의 재발을 막는다. mypy는 tests로 확장하지 않는다(테스트에 --strict
      # 타입 부담 제외 — 기존 정책 유지).
      - name: Ruff (lint — src + tests)
        run: ruff check . ../../tests/backend

      # black은 --line-length 100을 *명시*한다: tests 경로(../../tests/backend)에는 위로
      # pyproject가 없어(레포 루트에 pyproject 부재) black이 기본값 88로 폴백하기 때문이다.
      # 명시하지 않으면 100으로 포맷된 tests를 88로 검사해 거짓 실패한다(src의 [tool.black]
      # line-length=100과 동일 기준으로 통일).
      - name: Black (format check — src + tests)
        run: black --check --line-length 100 . ../../tests/backend

      - name: Mypy (strict type check)
        run: mypy --strict whymath_backend

      - name: Import contracts (import-linter — 7계층 단방향)
        run: lint-imports

      # OPS-58 — 워커 병렬화. 이 잡 29분 41초 중 이 스텝이 26분 53초(90%)였다(run
      # 33387572394 스텝 타임스탬프 실측). 나머지 전 스텝 합이 3분 미만이라 여기 말고는
      # 줄일 곳이 없다. `--dist loadfile`(같은 파일 = 같은 워커)은 이 저장소의 순서 의존
      # 전역 오염 이력(OPS-06/07/09 `db.session._engine`)을 고려한 보수적 선택이면서
      # 실측상 기본 `load`보다 오히려 빠르다(32.0s vs 41.4s) — 안전과 속도가 같은 방향.
      #
      # **실 CI A/B로 검증했다**(이 변경은 런타임 코드를 0줄 바꾸므로 base 커밋과 측정
      # 대상이 같다 — 통제 대조군이 성립한다):
      #   직렬 main 1e2e341d(run 33454551710) 1585.46s / 11268 passed·323 skipped·1 xfailed
      #   병렬 이 스텝  (run 33455108087)      855.75s / 11268 passed·323 skipped·1 xfailed
      # 아래 계층별 커버리지 게이트가 이 산출물을 읽으므로 PASS 여부가 아니라 **수치까지**
      # 대조했고 다섯 계층 전부 한 자리도 다르지 않았다(api 3972/4122 · l1 3777/4334 ·
      # l2 1348/1376 · l3 9100/9747 · l4 3984/4170). 어긋났다면 게이트가 통과하면서도
      # 틀린 판정을 냈을 자리다.
      - name: Pytest (with coverage)
        run: |
          pytest \
            -m "not corpus_authoring" \
            -n auto --dist loadfile \
            --cov=whymath_backend \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=70

      # 계층별 커버리지 게이트 (ARCH-14 ② '강화') — 집계 70%(위)에 더해 서브패키지(l1~l4·api)별
      # 라인 커버리지 바닥선을 강제한다(한 계층이 낮아도 집계 평균에 묻히던 사각 폐색). 바닥선은
      # 실측 ratchet(회귀 방지)·지향치(testing.md L4 90% 등)로 점진 상향. coverage.xml만 읽는
      # hermetic 스텝(위 Pytest 산출물 소비). 무측정 계층은 성공 위장 대신 명시 실패.
      - name: 계층별 커버리지 게이트 (서브패키지 floor — l1~l4·api)
        run: python ../../scripts/coverage/check_layer_coverage.py coverage.xml

      # 초인간 검증 게이트 (hermetic·라이브 0·고정 시드) — ci.yml 상시 배선(ARCH-14 ①).
      # pytest 회귀에 더해 CLI exit 0/1 게이트를 독립 스텝으로 심어 "측정 통과 기계 게이트"가
      # 상시 회귀로 강제되게 한다(초인간 검증 기준 v1 §서열 ②). 임계는 고정 시드 실측 여유값:
      #   defect: 감사기 배선 시 6종 전부 120/120·검출 하한 0.978 → 0.95 게이트 통과.
      #   prose : 프로즈 ON·288 결함셀 노출 0 → 노출 상한 0.0093 → 0.05 게이트 통과.
      # (변별력은 각 harness의 대조군 테스트가 상시 봉인 — control-flag-off exit1 등.)
      - name: 게이트 — 결함주입 강등전 (defect_detection·검출 하한 0.95·오검출 상한 0.05)
        run: |
          python -m whymath_backend.harness.defect_detection_eval \
            --n-defective 120 --n-clean 120 --seed 20260708 --with-auditor \
            --min-detection-lower 0.95 --max-false-alarm-upper 0.05

      # REC-08: 선택형·수치 단답 서버 채점 강등전(옵션 C — Kiki 결정 2026-08-09). 고정 시드
      # 실측 여유값: A/B 각 75건 결함 전건 검출(150/150·검출 하한 0.982) → 0.95 게이트 통과 /
      # 무결함 오검출 0/150 → Wilson 상한 0.018 → 0.02 규약(초인간 검증 S5) 통과.
      # **n=150인 이유**: 오검출 0건이어도 n=100이면 상한이 0.026이라 2% 규약을 증명하지
      # 못한다(작은 표본 거짓 통과 차단 — 표본 수가 규약에서 역산된 값이다).
      # 게이트 PASS는 채점 권위 이관이 아니다 — REC-07(owner=kiki) 결정의 입력일 뿐이다.
      # (변별력은 harness 테스트가 봉인 — 도달 불가 임계·소표본 상한 미증명 양쪽 exit1 대조군.)
      - name: 게이트 — 선택형·단답 채점 강등전 (selective_grading·검출 하한 0.95·오검출 상한 0.02)
        run: |
          python -m whymath_backend.harness.selective_grading_demotion_eval \
            --n-defective 150 --n-clean 150 --seed 20260810 \
            --min-detection-lower 0.95 --max-false-alarm-upper 0.02

      # MISC-25: 학생이 오개념을 **명시적으로 부정**했는데도 확신 진단이 학생에게 도달하는
      # 비율. 착지 직전 실측은 측정 가능 66종 중 **66종(100%)**이었다 — 항목별 결함이 아니라
      # substring 공출현(AND)에 부정 조건이 없던 구조적 공백이었고, 절 경계 근접 반박 축으로
      # 0%가 됐다. 상한을 0.0으로 두는 이유: 이 사각은 "줄이는" 성질이 아니라 카탈로그에
      # 항목이 새로 들어올 때 **다시 생기는** 성질이라 신규 항목이 회귀를 끌고 들어온다.
      # 단위 테스트(`TestExplicitCorrectionNearSignals`)는 대표 항목만 밟으므로 전수는 여기다.
      # hermetic·1.4초(DB 0·LLM 0·네트워크 0). 측정 불가(대조군 전멸)는 exit 2로 따로 낸다 —
      # 기준 미달과 측정 실패를 같은 코드로 내면 무엇을 고쳐야 하는지가 사라진다.
      - name: 게이트 — 명시적 정정 언급 사각 (explicit_correction_gap·사각 상한 0%)
        run: |
          python -m whymath_backend.harness.explicit_correction_gap_eval \
            --max-gap-ratio 0.0

      # MISC-27: **올바른 산문**(자체생성 정답 해설 7,644건)에 오개념 진단이 확신 수준으로
      # 나가는 비율. 맞게 쓴 글에 틀렸다고 말하는 것이라 의사결정 우선순위 #1에 직접 닿는다.
      #
      # 상한 7%는 **ratchet**이다 — 실측 6.5%(497건) 바로 위. 0을 요구하지 않는 이유는
      # 상시 red인 게이트가 사람이 게이트를 끄게 만들기 때문이고(MISC-27 acceptance④),
      # 그렇다고 임계를 안 걸면 회귀가 조용히 들어온다. 그래서 "지금보다 나빠지면 red"로
      # 잡는다. 수치가 내려가면 이 값도 함께 내려 잠근다(계층별 커버리지 floor와 같은 관례).
      #
      # 이력: MISC-25 착지 전 885건(11.6%) → 착지 후 497건(6.5%). 명시적 정정 언급 축이
      # 388건을 걷어 낸 몫이다. hermetic 9초(DB 0·LLM 0·네트워크 0).
      - name: 게이트 — 정답 해설 오진단 ratchet (misconception_false_positive·상한 7%)
        run: |
          python -m whymath_backend.harness.misconception_false_positive_eval \
            --max-fp-ratio 0.07

      - name: 게이트 — 코치 프로즈 유출 (coach_prose_leak·노출 상한 0.05·오차단 상한 0.2)
        run: |
          python -m whymath_backend.harness.coach_prose_leak_eval \
            --n-per-cell 12 --max-leak-upper 0.05 --max-false-block-upper 0.2

      # MISC-07: 앵커 커버 오개념의 정규식 탐지 채널 변별력. 임계는 모듈 상수(검출 하한 0.80·
      # 오검출 상한 0.10)이고 픽스처는 결정론 생성이라 인자가 없다 — 라이브 0·시드 0·DB 0.
      # 이 스텝이 없으면 채널은 "저장소에 존재함"일 뿐 매 PR 회귀로 강제되지 않는다(OPS-22
      # declared-unwired 감사가 정확히 그 상태를 미도달로 잡아냈다).
      # 표본 수가 게이트의 *통과 가능성*을 좌우하므로(Wilson 상한 0/20=0.1192로 완벽한 채널도
      # FAIL) CLI가 도달 가능성 자체를 매 실행 재검사하고 불가면 별도 stderr로 구분해 낸다.
      - name: 게이트 — 앵커 탐지 채널 변별력 (anchor_detection_channel·검출 하한 0.80·오검출 상한 0.10)
        run: python -m whymath_backend.harness.anchor_detection_channel_eval

      # PED-01 ③: 교수법 팩 금지모드 가드 결함주입 강등전. 고정 그리드 실측 여유값 —
      # violating/clean 각 72셀 미검출·오검출 0 → Wilson 상한 0.0362 → 게이트 통과.
      # 팩-프롬프트 GA flip(pedagogy_pack_prompt_enabled 기본 ON)의 선결 게이트다.
      - name: 게이트 — 교수법 팩 금지모드 가드 (pedagogy_pack_fidelity·미검출 상한 0.05·오검출 상한 0.2)
        run: |
          python -m whymath_backend.harness.pedagogy_pack_fidelity_eval \
            --n-per-cell 12 --max-miss-upper 0.05 --max-false-alarm-upper 0.2

      # PED-24(구 PED-09 회수) ③: 비유·예시 결함주입 강등전(04e §6.3). 고정 그리드 —
      # violating 432셀 미검출 0 · clean 144셀 오검출 0 → Wilson 상한 통과(구 브랜치 실측).
      # 생성기(analogy/example_generator) 검수 게이트의 검출력을 상시 봉인한다(게임형 0 검사 포함).
      - name: 게이트 — 비유·예시 결함 검출기 (analogy_fidelity·미검출 상한 0.05·오검출 상한 0.2)
        run: |
          python -m whymath_backend.harness.analogy_fidelity_eval \
            --n-per-cell 12 --max-miss-upper 0.05 --max-false-alarm-upper 0.2

      # NS-03 — 코퍼스 표기 ⊆ 지원 표기(data/notation_support_manifest.json) 커버리지 게이트.
      # hermetic(LLM 0·DB 0)·결정론. 신규 누락 심볼 발견 시 exit 1(베이스라인 래칫) — 변별력은
      # tests/backend/l3/test_notation_coverage_eval.py의 --control-empty-support 대조군이 봉인.
      - name: 게이트 — 표기 커버리지 (notation_coverage·코퍼스 표기 ⊆ 지원 표기)
        run: python -m whymath_backend.l3.notation_coverage

      # ARCH-20: 콘텐츠 출처·라이선스 집행 게이트 — copyright_gradient.md §4.2가 명령한
      # pool 필드 차단을 실제로 CI에 배선(2026-07-29 실측 전 집행 지점 0건 확인 후 신설).
      # 코퍼스 루트는 CLI가 __file__ 기준으로 자가 탐지(cwd=src/backend 무관 — parents[4]).
      - name: 게이트 — 콘텐츠 출처·라이선스 집행 (provenance_audit·pool 필드 + 사이드카 계약)
        run: python -m whymath_backend.ops.provenance_audit

      # EOS-59 ③: 데이터 등급 라우팅 신호 소스 스캔 — 프로덕션 `RoutingRequest(` 생성이
      # `data_licenses=`를 명시하는지 AST로 검사한다. 미명시는 fail-closed 기본값(UNKNOWN)
      # 때문에 *조용히 LOCAL 강등*으로 끝나므로, 이 게이트가 없으면 보수 기본값이 일상
      # 동작이 되어 "게이트가 일해서 로컬"인지 "아무도 등급을 안 적어서 로컬"인지 구분할 수
      # 없다. 위반 시 exit 1. hermetic(LLM 0·DB 0)·cwd 무관(스크립트가 루트 자가 탐지).
      # 변별력은 tests/infra/test_routing_data_grade_scan_wiring.py의 결함 주입이 봉인.
      - name: 게이트 — 데이터 등급 라우팅 신호 (check_routing_data_grade·미명시 0건)
        run: python ../../scripts/ops/check_routing_data_grade.py

      # EOS-77: 라우터 우회 결정 소스 스캔 — 프로덕션 `RoutingDecision(` 직접 생성 중
      # *클라우드 티어 리터럴*(CLOUD_MID/HIGH)을 검출한다. 그런 결정은 `Router.route`의 데이터
      # 등급(법적) 게이트를 지나지 않고 국외 프로바이더에 도달한다(위 EOS-59 게이트는 *입력*의
      # 등급 명시만 보므로 이 우회를 못 본다). 비리터럴 티어는 판정 승계(`data_export_reason=`
      # 표현식)를 요구하고, 유예는 만료·unmatched를 exit 1로 강제한다. hermetic·cwd 무관.
      # 변별력은 tests/infra/test_routing_decision_bypass_scan_wiring.py의 결함 주입이 봉인.
      - name: 게이트 — 라우터 우회 결정 (check_routing_decision_bypass·클라우드 직접 생성 0건)
        run: python ../../scripts/ops/check_routing_decision_bypass.py

      # OPS-16: L3 생성 프롬프트 정본(docs/prompts/l3_*.md)의 3레일 감사 —
      # ⓐ 저작권(평가원·EBS·교과서 본문 복제 금지 지시문) ⓑ 봉인(rephrase 수치·정답 불변)
      # ⓒ 독립성(cross_verify에 생성자 문맥 미주입). 위반 시 exit 1. hermetic(LLM 0·DB 0).
      # 변별력은 tests/backend/harness/test_prompt_asset_audit_l3.py의 결함 주입이 상시 봉인.
      - name: 게이트 — L3 생성 프롬프트 레일 (prompt_asset_audit·저작권·봉인·독립성)
        run: python -m whymath_backend.harness.prompt_asset_audit --axis l3

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: src/backend/coverage.xml
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # 백엔드 alembic 마이그레이션 검증 + 실 PG 통합테스트 (slice 28b·30)
  # 신규 PostgreSQL 16에 전 마이그레이션을 적용(upgrade head)하고 base까지 되돌렸다가
  # 다시 올려(왕복) *적용·역적용 정합*을 검증한다. 이어 실 PG 위에서 통합테스트를 실행한다
  # (그동안 CI 미실행이던 ~50 PG 통합테스트 활성화). 기존 backend 잡은 hermetic이라
  # 마이그레이션·통합테스트를 한 번도 실행하지 않으므로, 이 잡이 스키마·실 DB 동작의 안전망이다.
  # l3 통합테스트(ollama·redis·langfuse·anthropic·celery)는 *라이브 외부 서비스* 필요(도달성
  # hard-assert)라 CI에서 제외(Phaiakes9 전용). DB URL은 Settings 기본값과 동일(trust 인증).
  # ─────────────────────────────────────────────────────────────────
  backend-migrations:
    name: backend — 마이그레이션·통합 (실 PG)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: changes
    # doc-only PR이면 skip(비용 절감·required check는 skipped=충족). push는 항상 실행.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') && github.event_name != 'schedule'
    defaults:
      run:
        working-directory: src/backend

    services:
      postgres:
        # pgvector/pgvector:pg16 = postgres:16 superset(pgvector 프리설치) — 슬105
        # PgVectorIndex 마이그레이션이 `CREATE EXTENSION vector`를 alembic upgrade/왕복에서
        # 성공시키려면 pgvector가 깔린 이미지가 필요하다(드롭인·기존 backend 스키마 무영향).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: whymath
          POSTGRES_DB: whymath
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whymath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Settings 기본값과 동일(asyncpg·자격증명 없음). env.py가 이 값을 읽어 연결.
      WHYMATH_DATABASE_URL: postgresql+asyncpg://whymath@127.0.0.1:5432/whymath

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          # 슬112(비용): [embedding](sentence-transformers→torch 수 GB)은 CI에서 설치하지
          # 않는다 — 라이브 bge-m3 통합은 CI에서 *항상 skip*(HF 미도달·Phaiakes9 전용)이라
          # torch 설치가 분당 과금만 태웠다. 슬110의 find_spec 사전체크가 미설치를 깨끗이
          # skip 처리한다. 라이브 측정은 Kiki가 Phaiakes9에서 .[dev,embedding]으로 실행.
          pip install -e ".[dev]"
          # 교차계층 거버넌스 테스트(tests/backend/l1/test_five_node_connectivity_governance.py)가
          # data_pipeline(L1)을 import한다 → 백엔드 잡에도 설치(수집 ImportError 방지).
          pip install -e ../data-pipeline

      - name: Alembic upgrade head (fresh DB — 전 마이그레이션 적용)
        run: alembic upgrade head

      - name: Alembic downgrade base → upgrade head (역적용·재적용 왕복)
        run: |
          alembic downgrade base
          alembic upgrade head

      # OPS-55: 데이터 무결성 게이트 — orphan concept/skill/problem·dangling curriculum_ref·
      # duplicate canonical_id·event schema_invalid 6종을 실 PG에서 스캔(0건=exit 0). 마이그레이션
      # 직후 DB는 비어 있어 이 스텝 자체는 상시 통과(스모크)이지만, "저장소에 존재함≠돌아감"
      # (OPS-10 선례) — 이 스텝이 CI 배선의 집행 지점이다. 6종 각각의 검출 변별력(주입 성공/실패
      # 양쪽 신호)은 바로 아래 Pytest 통합테스트 스텝이 수집하는
      # test_integrity_violations_gate_integration.py가 검증한다.
      - name: 게이트 — 데이터 무결성 (integrity_violations_gate·orphan·dangling·duplicate 6종)
        run: python -m whymath_backend.ops.integrity_violations_gate

      - name: Pytest (통합테스트 — 실 PG·l3 외부서비스 제외)
        env:
          WHYMATH_RUN_INTEGRATION: "1"
          # 전역 엔진이 테스트마다 다른 이벤트 루프에서 재사용될 때의 asyncpg 루프 바인딩
          # 충돌(another operation is in progress) 회피 — NullPool(매 체크아웃 새 연결).
          WHYMATH_DB_DISABLE_POOL: "1"
        # l3는 라이브 Ollama/Redis/Langfuse/Anthropic 필요(도달성 단정) → CI 제외.
        # api·l2 통합테스트는 PG만 필요(미도달 자원은 각자 graceful skip).
        run: pytest -m integration --ignore=../../tests/backend/l3

  # ─────────────────────────────────────────────────────────────────
  # data-pipeline 실 PG 적재 통합테스트 (슬99) — NCIC load_to_postgres 경로
  # 기본 data-pipeline 잡은 [dev]만 설치(sqlalchemy 없음)·PG 서비스 없으므로
  # load_to_postgres 통합테스트(test_load_postgres_integration)가 한 번도 실행되지
  # 않는다(importorskip + conftest env 게이트 이중 skip). 이 잡이 [postgres] extra +
  # 실 PG로 적재 경로(신규 INSERT·upsert UPDATE·DO NOTHING)를 상시 검증하는 안전망이다.
  # backend-migrations 잡과 동형(실 PG service·trust 인증). data-pipeline은 alembic
  # 미포함(로더가 create_all로 staging 테이블 소유)이라 마이그레이션 단계는 없다.
  # ─────────────────────────────────────────────────────────────────
  data-pipeline-integration:
    name: data-pipeline — 적재 통합 (실 PG)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # doc-only PR이면 skip(비용 절감·required check는 skipped=충족). push는 항상 실행.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.data_pipeline == 'true') && github.event_name != 'schedule'
    defaults:
      run:
        working-directory: src/data-pipeline

    services:
      postgres:
        # pgvector/pgvector:pg16 = postgres:16 superset(드롭인). data-pipeline은 pgvector를
        # 아직 안 쓰지만 두 PG 잡 이미지를 동일하게 맞춰(슬105) 환경 표류를 막는다(무위험).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: whymath
          POSTGRES_DB: whymath
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whymath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 통합테스트가 읽는 DSN(asyncpg·자격증명 없음·trust). load._to_async_dsn이 정규화.
      WHYMATH_DATABASE_URL: postgresql+asyncpg://whymath@127.0.0.1:5432/whymath

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (editable + dev + postgres extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Pytest (NCIC 적재 통합테스트 — 실 PG)
        env:
          # conftest env 게이트 해제(integration 마크 활성화). [postgres] extra가 설치돼
          # importorskip 통과 + 실 PG 도달 → 적재 왕복 검증.
          WHYMATH_RUN_INTEGRATION: "1"
        run: pytest -m integration

  # ─────────────────────────────────────────────────────────────────
  # data-pipeline 실 Neo4j 적재 통합테스트 (슬113-2) — concept_graph load_graph 경로
  # 기본 data-pipeline 잡은 [dev]만 설치(neo4j 드라이버 없음)·Neo4j 서비스 없으므로
  # 적재 통합테스트(test_load_neo4j_integration)가 한 번도 실행되지 않는다(importorskip +
  # conftest env 게이트 이중 skip). 이 잡이 [neo4j] extra + 실 Neo4j로 적재 경로(노드 403·
  # 엣지 541·멱등 §5 #9·제약 §2.3)를 상시 검증하는 안전망이다. data-pipeline-integration(PG)
  # 잡과 동형(실 서비스·healthcheck·서드파티 액션 없이 GitHub 기본 서비스 컨테이너).
  # 접속 자격은 env 전용(NEO4J_*) — 시크릿 하드코딩 금지(CLAUDE.md).
  # ─────────────────────────────────────────────────────────────────
  data-pipeline-neo4j:
    name: data-pipeline — 적재 통합 (실 Neo4j)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # doc-only PR이면 skip(비용 절감·required check는 skipped=충족). push는 항상 실행.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.data_pipeline == 'true') && github.event_name != 'schedule'
    defaults:
      run:
        working-directory: src/data-pipeline

    services:
      neo4j:
        # neo4j:5 — concept_graph.md §6.1 로컬 개발 이미지와 동일 메이저. CONSTRAINT·MERGE
        # (멱등 적재) 검증에 필요. NEO4J_AUTH로 단일 비밀번호 설정(테스트 전용·CI 한정).
        image: neo4j:5
        env:
          # CI 한정 테스트 자격(실 시크릿 아님·로컬 컨테이너). 적재 코드는 NEO4J_* env만 읽는다.
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        # bolt 포트 readiness — cypher-shell로 RETURN 1 성공 시 healthy(드라이버 도달 가능).
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 30s

    env:
      # 통합테스트가 읽는 접속 env(§6.1) — 시크릿 하드코딩 금지(서비스 컨테이너 자격과 일치).
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (editable + dev + neo4j extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,neo4j]"

      - name: Pytest (개념그래프 적재 통합테스트 — 실 Neo4j)
        env:
          # conftest env 게이트 해제(integration 마크 활성화). [neo4j] extra가 설치돼
          # importorskip 통과 + 실 Neo4j 도달 → 멱등 적재(노드 403·엣지 541) 검증.
          WHYMATH_RUN_INTEGRATION: "1"
        run: pytest -m integration

  # ─────────────────────────────────────────────────────────────────
  # L5 모바일 (Flutter 학생 클라이언트 — coach API 통합 + 모델 정합)
  # backend/data-pipeline 잡을 미러링하되 Flutter 툴체인을 쓴다. 이 환경엔 Dart/Flutter
  # SDK가 없어 로컬 검증(codegen·analyze·test)이 불가하므로 *이 잡이 유일한 검증 게이트*다
  # (마이그레이션 슬라이스가 실 PG CI로 검증된 것과 동형). codegen 산출물(*.freezed.dart·
  # *.g.dart)은 커밋하지 않고(.gitignore) 여기서 build_runner로 생성한 뒤 analyze·test한다 —
  # 스텝 순서(pub get → build_runner → analyze → test)가 생성 선행을 보장한다.
  # ─────────────────────────────────────────────────────────────────
  mobile:
    name: mobile — flutter analyze·test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # doc-only/타 영역 PR이면 skip(비용 절감·required check는 skipped=충족). push는 항상 실행.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true') && github.event_name != 'schedule'
    defaults:
      run:
        working-directory: src/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.41.x (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Dart 3.11 — Kiki 머신(Dart 3.11)과 완전 정합(MOB-01·2026-07-20). 구 3.35(Dart 3.9)는
          # test_api 0.7.6 SDK 고정→analyzer<8 강제로 freezed3/retrofit_generator10 격자가 불충족
          # (실측) — pin 완전 제거(freezed3·riverpod3·retrofit 해제)는 이 버전이 바닥선이다.
          # 해석 정본은 커밋된 pubspec.lock — pub get이 lock을 그대로 존중한다.
          flutter-version: "3.41.9"
          cache: true

      # --enforce-lockfile(dart-lang/pub, Dart 2.19+에서 도입되고 flutter_tools의
      # _permissiveArgParser가 그대로 전달 — flutter/flutter PR #117896·2023-01-10 병합,
      # Flutter 3.41.9 pin보다 훨씬 앞서 병합돼 이 pin에서도 유효)로 pubspec.yaml↔
      # pubspec.lock 정합을 CI에서 강제한다. lock이 pubspec.yaml의 정확한 해(exact
      # resolution)가 아니면(의존 제거 후 lock 미갱신·의존 재추가 후 lock 미갱신 등)
      # pub get이 조용히 lock을 고쳐쓰지 않고 즉시 실패한다(MOB-08 — firebase 미사용
      # 의존 제거의 재발방지 게이트).
      - name: Flutter pub get (lockfile 정합 강제)
        run: flutter pub get --enforce-lockfile

      - name: Codegen (freezed·json_serializable·riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test (커버리지 수집)
        run: flutter test --coverage

      # 커버리지 게이트 — testing.md 선언 목표(Flutter UI 60%·§커버리지 목표)를 첫 실측
      # 확인 후 강제로 전환한다(ARCH-14 ④ — "측정 없던 60% 선언"의 미배선 공백 폐색).
      # 첫 실측 86.6%(1818/2100·2026-07-25)로 60% 임계는 26pt 여유 — 정상 변동엔 안전하고
      # 의미있는 회귀만 차단한다. 변별력 자가검증 포함(lcov 미생성·측정 라인 0·임계 미달 시
      # 성공 위장 대신 명시 실패). 목표 상향은 testing.md 개정과 함께(별도 과제) — 이 게이트는
      # 문서화된 바닥선을 그대로 집행한다.
      - name: 커버리지 게이트 (line ≥ 60% — testing.md Flutter UI 목표)
        run: |
          set -euo pipefail
          if [ ! -f coverage/lcov.info ]; then
            echo "coverage/lcov.info 미생성 — flutter test --coverage 산출물 확인 필요"
            exit 1
          fi
          awk -F: -v min=60 '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{
            if (lf==0) { print "측정 라인 0 — lcov.info 비어있음(수집 실패)"; exit 1 }
            pct=100*lh/lf
            printf "mobile line coverage: %.1f%% (%d/%d lines · 게이트 최소 %d%%)\n", pct, lh, lf, min
            if (pct < min) { printf "FAIL — 커버리지 %.1f%% < %d%% 최소선\n", pct, min; exit 1 }
            print "PASS — 커버리지 최소선 충족"
          }' coverage/lcov.info

  # ─────────────────────────────────────────────────────────────────
  # concept-reach 회귀 가드 (OPS-23) — mobile-only PR 사각 봉합·경량 실행
  #
  # 배선 근거(2026-08-08 실측): concept_reach_report 회귀 가드
  # (tests/backend/harness/test_concept_reach_report.py의 test_real_corpus_smoke_...)는
  # 실제 `src/mobile/lib`를 스캔해 모바일의 `/v1/` 호출 표면 도달을 동결한다. 그런데 이 가드는
  # backend 잡 소속이라 `changes` 필터의 backend 조건(src/backend|tests/backend|...)으로만
  # 켜진다 — **src/mobile/-only PR은 backend=false → backend 잡 스킵 → 가드도 스킵**.
  # PATH-05가 정확히 그 경로로 우회했고(모바일만 건드림), 서버·클라를 동시에 건드린 다음
  # PR인 MOB-10에서야 분모 증가가 드러났다(그 경위는 위 테스트 docstring에 기록). 이 잡은
  # **전체 backend 잡을 돌리지 않고** 이 가드 한 파일만 mobile==true에서 경량 실행해 그 공백을
  # 닫는다(backend 잡은 그대로 — 순수 신규 잡). 이 파일은 async 테스트가 없어 명시 경로 실행 OK.
  # ─────────────────────────────────────────────────────────────────
  concept-reach-guard:
    name: concept-reach — mobile 호출 표면 회귀 가드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # mobile 변경 PR에서 발화(사각 봉합) + push(main)는 항상. schedule은 제외(무거운 잡 가드와 동형).
    # backend 잡과 달리 backend 필터가 아니라 **mobile 필터**로 켠다 — 이 가드가 감시하는 표면이
    # src/mobile/lib의 호출 콜사이트라 mobile-only PR에서도 반드시 돌아야 한다(OPS-23 핵심).
    if: (github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true') && github.event_name != 'schedule'
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 이 가드 테스트는 `whymath_backend.harness.concept_reach_report` import 시 harness/__init__
      # → wh1_evaluation → pydantic을 당기므로 backend 설치가 필요하다. 실측(2026-08-08):
      # `.[dev]`만으로 이 파일이 import·17건 전건 통과한다(data_pipeline 불요 — 이 가드 체인은
      # data_pipeline을 import하지 않는다). 무거운 backend 전체 대신 이 최소 설치만 한다.
      - name: Install dependencies (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 실제 src/mobile/lib·src/backend/whymath_backend/api를 스캔하는 회귀 스모크를 실행한다.
      # 모바일이 새 `/v1/` 표면을 호출하기 시작하면 이 파일이 깨져 "가시화 리포트가 낡았다"를
      # 신호한다(회귀 감시). 명시 파일 경로 실행 — 이 파일엔 async 테스트가 없다.
      - name: Pytest (concept_reach 회귀 가드 — 단일 파일 경량)
        # `-c pyproject.toml` 필수 — 위치 인자(테스트 경로)를 주면 pytest가 인자의 공통조상을
        # 상향 탐색해 **저장소 루트**를 rootdir로 잡고, 루트 pyproject.toml에는 pytest 설정이
        # 없어 `src/backend/pyproject.toml`의 ini가 통째로 안 읽힌다(OPS-61 실측). 그러면
        # asyncio_mode=auto·--strict-markers·--strict-config·--import-mode=importlib가 전부
        # 빠진 채 도는데 **화면상 정상으로 보인다** — 이 스텝들은 실제로 그 상태로 돌고 있었다.
        # `-c`로 설정 파일을 못 박으면 bare 호출과 동일해진다(rootdir=src/backend·configfile 동일).
        run: python3 -m pytest -c pyproject.toml ../../tests/backend/harness/test_concept_reach_report.py -q

  # ─────────────────────────────────────────────────────────────────
  # L5 웹 (그래프 계산기 — 격리 Vite + React SPA·국소 비상구)
  # backend/mobile 잡을 미러링하되 Node 툴체인을 쓴다. 수학 코어(src/lib/**) 단위 테스트 +
  # 스모크 렌더(Vitest·jsdom)와 정적 번들 빌드를 검증한다. 커버리지 게이트(70%+)는
  # vitest.config.js가 src/lib/** 한정으로 강제한다(캔버스·three·DOM UI는 분모 제외).
  # 산출물(node_modules·dist)은 커밋하지 않고(.gitignore) 여기서 npm ci로 생성·검증한다.
  # ─────────────────────────────────────────────────────────────────
  web:
    name: web — graphing-calculator test·build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # doc-only/타 영역 PR이면 skip(비용 절감·required check는 skipped=충족). push는 항상 실행.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true') && github.event_name != 'schedule'
    defaults:
      run:
        working-directory: src/web/graphing-calculator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/graphing-calculator/package-lock.json

      - name: Install dependencies (npm ci — lockfile 고정)
        run: npm ci

      - name: Vitest (test + coverage — src/lib 70%+ 게이트)
        run: npm run coverage

      - name: Vite build (정적 번들 회귀)
        run: npm run build

  # ─────────────────────────────────────────────────────────────────
  # 인프라 계약 테스트 (tests/infra) — hermetic·docker 불요·항상 실행
  #
  # 배선 근거(2026-07-26 실측): 이 잡이 생기기 전까지 `tests/infra/`는 **어느 CI 잡도
  # 실행하지 않았다** — backend 잡의 testpaths는 `tests/backend`, harness-integrity는
  # `tests/harness`, infra-shell은 bash 문법 검사뿐이었다(`grep 'tests/infra' ci.yml` 0건).
  # 운영 자산(백업 스크립트·배포 산출물·정리 스크립트·벤치마크)의 계약 동결이 *실행되지 않는
  # 주장*으로 남아 있었다 — CLAUDE.md "측정 없는 기계 게이트를 검수 대체로 선언 금지"에 정확히
  # 해당한다. 이 잡이 그 공백을 닫는다(OPS-02 test_backup_script.py도 함께 살아난다).
  #
  # 의존성은 **실측으로 최소화**했다: pytest·pytest-asyncio(async 테스트)·PyYAML(배포 산출물
  # 파싱)·SQLAlchemy(cleanup_atom_orphans의 text() import). 이 4종으로 196건 전부 통과
  # (2026-07-26 로컬 격리 venv 실측 29초). 백엔드 전체 의존성은 불요 — 무거운 설치를 피한다.
  #
  # 항상 실행한다(doc-only PR에서도): 계약 테스트의 검사 대상에는 런북 문서도 포함돼(예:
  # 배포 런북의 '정직한 공백' 절) 문서 변경이 계약을 깰 수 있다 — policy-guard와 같은 이유.
  # ─────────────────────────────────────────────────────────────────
  infra-contracts:
    name: infra-contracts — 운영 자산 계약 테스트 (tests/infra)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest-randomly(OPS-09) — 순서 의존 조기 노출. tests/infra 204건이 무작위 순서
      # 전건 통과함을 실측하고 배선했다(2026-07-27).
      # ruff·black(OPS-11) — 아래 lint 스텝용. 버전 핀은 backend `dev` extra와 같은 정책
      # (상한을 걸어 메이저 변경 시 재검증을 강제).
      - name: Install deps (실측 최소 7종 — 백엔드 전체 설치 불요)
        run: |
          pip install pytest pytest-asyncio pytest-randomly pyyaml "sqlalchemy>=2.0" \
                      "ruff>=0.7.0,<0.16" "black>=24.10.0,<27"

      # OPS-11 — `tests/infra`를 lint/format하는 잡이 **하나도 없었다**. backend 잡은
      # `../../tests/backend`만 보고, 이 잡은 실행만 했다. 즉 OPS-03이 '실행'은 배선했으나
      # 코드 품질 축은 여전히 무배선이었다("장치는 있는데 일부만 배선됨" — CLAUDE.md
      # '검증 장치를 만들고 배선 확인 없이 완료 선언 금지'가 겨냥하는 부류).
      # 실측(2026-07-27): 배선 직전 `black --check`가 test_backup_script.py 1건에서 실패했다.
      # OPS-13 — 커버리지 전수 검사가 두 곳을 더 찾아냈다(2026-07-28, 둘 다 이 잡이 인접):
      #   · `infra/phaiakes9/benchmark/*.py` — 이 잡의 tests/infra가 *테스트하는* 소스인데
      #     정작 그 소스는 무배선이었다
      #   · 레포 루트 `conftest.py` — OPS-09의 seed 리포트 훅이 사는 파일
      # 둘 다 실측 결과 이미 clean이라 배선 비용은 0이다(막을 것은 앞으로의 드리프트).
      - name: Ruff (tests/infra + infra + conftest.py)
        run: python3 -m ruff check tests/infra infra conftest.py

      - name: Black --check (tests/infra + infra + conftest.py)
        run: python3 -m black --check --line-length 100 tests/infra infra conftest.py

      - name: Pytest (tests/infra — 계약 동결·결함주입)
        run: python3 -m pytest tests/infra -q

  # ─────────────────────────────────────────────────────────────────
  # 배포 이미지 빌드 + 컨테이너 기동 스모크 (OPS-03) — **진짜 게이트**
  #
  # 여기서 검증하는 것(전부 실제 실행·실패 시 잡 실패):
  #   ① Dockerfile이 빌드된다 (의존성 해석·설치 포함)
  #   ② 그 이미지가 *실제로 기동*해 /health/live가 200 + {"status":"ok"}를 준다
  #      — hermetic 유닛테스트는 uvicorn을 띄우지 않으므로 기동 실패(import·엔트리포인트·
  #        레이아웃 파손)는 이 잡에서만 잡힌다.
  #   ③ 컨테이너가 비루트로 돈다 (USER appuser 계약)
  #   ④ 이미지에 시크릿이 구워지지 않았다 (Config.Env 검사)
  #   ⑤ docker-compose.prod.yml이 **빈 env에서 기동을 거부**한다(fail-closed 변별력) 그리고
  #      값이 채워지면 렌더에 성공하며 trust 인증 흔적이 없다
  #
  # 여기서 검증하지 *않는* 것(정직 기술): 실제 배포·마이그레이션·실 DB 연결·성능.
  # 배포 실행 경로는 .github/workflows/deploy.yml(수동 승인) + 런북
  # docs/architecture/deployment_cd_runbook.md 이며, 대상 인프라는 아직 미프로비저닝이다.
  # ─────────────────────────────────────────────────────────────────
  docker-build:
    name: docker-build — 이미지 빌드·기동 스모크(/health/live)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # infra-contracts(30초 hermetic)를 선행시켜 계약 위반이면 5분짜리 빌드를 아예 시작하지
    # 않는다(조기 실패). 선행 잡이 실패하면 이 잡은 skip된다.
    needs: [changes, infra-contracts]
    # doc-only/타 영역 PR이면 skip(비용 절감·required check는 skipped=충족). push는 항상 실행.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true') && github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 빌드 컨텍스트는 레포 루트다 — 런타임이 레포 상대 경로(parents[5])로 data/corpus를
      # 읽기 때문(Dockerfile 헤더). src/backend만 컨텍스트로 주면 교수법 팩 로드가 깨진다.
      - name: 이미지 빌드 (컨텍스트 = 레포 루트)
        run: docker build -f Dockerfile -t whymath-backend:ci-${{ github.sha }} .

      # 의존성(DB·Redis) 없이 띄운다 — 판정치가 *의존성 0인 라이브니스*라서 그래야 변별력이
      # 생긴다(DB를 붙이면 "DB가 떠서 통과"와 "앱이 떠서 통과"가 구분되지 않는다).
      - name: 컨테이너 기동 (의존성 없이)
        run: |
          set -euo pipefail
          docker run -d --name whymath-ci-smoke -p 127.0.0.1:18000:8000 \
            whymath-backend:ci-${{ github.sha }}

      - name: 스모크 — /health/live 200 + status=ok (재시도 30회·2초 간격)
        run: |
          set -uo pipefail
          ok=false
          for _ in $(seq 1 30); do
            code=$(curl -s -o live.json -w '%{http_code}' http://127.0.0.1:18000/health/live || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            # 컨테이너가 이미 죽었으면 더 기다릴 이유가 없다 — 즉시 실패 경로로.
            running=$(docker inspect -f '{{.State.Running}}' whymath-ci-smoke 2>/dev/null || echo "false")
            if [ "$running" != "true" ]; then
              echo "::error::컨테이너가 기동 중 종료됨(재시도 중단)"
              break
            fi
            sleep 2
          done
          if [ "$ok" != "true" ]; then
            echo "----- docker logs (실패 진단) -----"
            docker logs whymath-ci-smoke || true
            echo "::error::/health/live가 200을 주지 못했다 — 이미지가 기동하지 않는다"
            exit 1
          fi
          if ! grep -q '"status":"ok"' live.json; then
            echo "::error::본문 계약 위반 — 받은 본문: $(cat live.json)"
            exit 1
          fi
          echo "PASS — /health/live 200 + status=ok"

      - name: 계약 — 비루트 실행(USER appuser)
        run: |
          set -euo pipefail
          uid=$(docker exec whymath-ci-smoke id -u)
          echo "컨테이너 uid=$uid"
          if [ "$uid" = "0" ]; then
            echo "::error::컨테이너가 root로 실행 중 — Dockerfile USER 계약 파손"
            exit 1
          fi

      - name: 계약 — 이미지에 시크릿 미포함 (Config.Env 검사)
        run: |
          set -euo pipefail
          # 값이 아니라 *키 이름*만 본다(값 출력 금지). WHYMATH_* 또는 시크릿류 키가 이미지에
          # 구워져 있으면 `docker history`로 누구나 읽을 수 있다 → 즉시 실패.
          names=$(docker image inspect whymath-backend:ci-${{ github.sha }} \
                    --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1)
          echo "이미지 env 키: $(echo "$names" | tr '\n' ' ')"
          if echo "$names" | grep -qiE '^(WHYMATH_|.*(SECRET|PASSWORD|TOKEN|API_KEY).*)$'; then
            echo "::error::이미지에 시크릿성 env가 구워져 있다 — 런타임 주입만 허용"
            exit 1
          fi

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f whymath-ci-smoke || true

      # ⑤-a 변별력 검사: 값이 비면 compose가 *실제로* 거부해야 한다. 이 스텝이 없으면
      # `${VAR:?}` 계약은 "그렇게 써 뒀다"는 주장일 뿐이다(측정 없는 게이트 금지).
      - name: 계약 — compose.prod fail-closed (빈 env면 기동 거부)
        run: |
          set -uo pipefail
          : > /tmp/empty.env
          if docker compose --env-file /tmp/empty.env -f docker-compose.prod.yml config \
               > /dev/null 2> /tmp/compose_err.txt; then
            echo "::error::빈 env로도 compose가 통과했다 — fail-closed 계약 파손"
            exit 1
          fi
          echo "PASS — 거부 사유: $(head -1 /tmp/compose_err.txt)"

      # ⑤-b 양성 대조: 값이 채워지면 렌더에 성공하고, demo의 trust 인증이 섞여 있지 않다.
      # 값은 매 실행 무작위 생성 — 리포·워크플로에 상수 시크릿이 존재하지 않는다.
      - name: 계약 — compose.prod 정상 렌더 + trust 인증 부재
        run: |
          set -euo pipefail
          {
            echo "DEPLOY_ENV=citest"
            echo "COMPOSE_PROJECT_NAME=whymath-citest"
            echo "WHYMATH_IMAGE_TAG=citest"
            echo "APP_PORT=18001"
            echo "WHYMATH_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "WHYMATH_REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "WHYMATH_JWT_SECRET_KEY=$(openssl rand -hex 32)"
            echo "WHYMATH_DIALOGUE_CONTENT_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "WHYMATH_DEVICE_SECRET_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } > /tmp/deploy.env
          # 렌더 결과는 *출력하지 않는다*(생성 값이 로그에 남지 않게) — 검사만 한다.
          docker compose --env-file /tmp/deploy.env -f docker-compose.prod.yml config \
            > /tmp/rendered.yml
          if grep -qi 'trust' /tmp/rendered.yml; then
            echo "::error::compose.prod에 trust 인증 흔적 — demo 전용 설정이 운영에 유입"
            exit 1
          fi
          for token in whymath-citest-db-data whymath-citest-redis-data pgvector/pgvector:pg16; do
            if ! grep -q "$token" /tmp/rendered.yml; then
              echo "::error::렌더 계약 누락: $token"
              exit 1
            fi
          done
          rm -f /tmp/deploy.env /tmp/rendered.yml
          echo "PASS — 렌더 성공·trust 0건·영속 볼륨/pgvector 확인"

  # ─────────────────────────────────────────────────────────────────
  # infra 쉘 스크립트 syntax 검사 (Phaiakes9 운영 자산 회귀 방지)
  # ─────────────────────────────────────────────────────────────────
  infra-shell:
    name: infra/phaiakes9 — bash syntax
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check all infra shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find infra -type f -name "*.sh")
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found under infra/. Skipping."
            exit 0
          fi
          for s in "${scripts[@]}"; do
            echo "::group::bash -n $s"
            bash -n "$s"
            echo "::endgroup::"
          done

      - name: PowerShell 스크립트 정적 검사 (BOM·괄호·정의 전 호출)
        # PS 스크립트는 Kiki 머신(Windows)에서만 실행된다 — Linux 러너도 개발 세션도
        # 실행 검증을 할 수 없다. 그 공백에서 반복 발생한 결함 3종을 기계로 고정한다.
        # 차단 게이트다(continue-on-error 없음): 위반 시 exit 1 로 PR 을 막는다.
        run: |
          set -euo pipefail
          python3 scripts/ops/check_ps_scripts.py
          echo "EXIT=$?"

      - name: Shellcheck (warnings only, non-blocking)
        uses: ludeeus/action-shellcheck@master
        # OPS-29 강제 상태 선언(tests/infra/test_ci_enforcement_declaration_contract.py 계약):
        # by-design:severity=warning 전용 권고 린트다 — 스텝 이름 자체가 "non-blocking"으로 설계
        # 의도를 명시하며, 애초에 PR을 막을 목적의 게이트가 아니라 참고용 경고 수집이다
        continue-on-error: true
        with:
          scandir: infra
          severity: warning

  # ─────────────────────────────────────────────────────────────────
  # CLAUDE.md 절대 금기 회귀 가드 — 검정교과서·시크릿 패턴 사전 차단
  # ─────────────────────────────────────────────────────────────────
  policy-guard:
    name: policy-guard — CLAUDE.md 금기 가드
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 검정교과서 출판사명 + "본문" 또는 "예제" 동시 등장 패턴은 사전 차단
      # (코드·문서에 의도적으로 사용된 경우는 # codeowner-ack 주석으로 우회 — OPS-54가
      # 실제로 배선했다. 이전에는 이 주석만 있고 grep이 그 마커를 걸러내지 않아
      # "우회 규약"이 존재하지 않는 기능이었다 — 실측: 매칭 라인에 마커를 넣어도 여전히
      # 적색이었다)
      # ci.yml 자신과 tests/infra/test_policy_guard_source_patterns.py(이 두 스텝의 픽스처·
      # 문서 문자열이 위반 패턴을 그대로 담고 있다)는 정의/픽스처로 패턴 문자열을 포함하므로
      # 제외한다 (자기참조 오탐 방지 — 실측: 제외 없이 돌리면 저 테스트 파일 자체가 걸린다)
      - name: Forbid 검정교과서 본문 patterns
        run: |
          set -e
          patterns='천재교육.*본문|비상교육.*본문|미래엔.*본문|동아출판.*예제|신사고.*예제'
          hits=$(grep -rEn --include='*.py' --include='*.md' --include='*.json' \
              --include='*.txt' --include='*.yaml' --include='*.yml' \
              --exclude-dir='.git' --exclude-dir='node_modules' \
              --exclude='ci.yml' --exclude='test_policy_guard_source_patterns.py' \
              -E "$patterns" . | grep -v '#\s*codeowner-ack' || true)
          if [ -n "$hits" ]; then
              echo "$hits"
              echo "::error::검정교과서 본문/예제 직접 인용 의심 패턴 발견 (CLAUDE.md 절대 금기)"
              exit 1
          fi
          echo "OK — 검정교과서 본문 패턴 없음"

      # EBS·평가원(수능·모평) 본문 직접 인용 의심 패턴 — OPS-54(EOS-53 crosswalk 갭 #7).
      # 기존 검정교과서 패턴과 달리 "EBS"·"평가원"·"수능" 같은 낱말은 *이 저장소 자신의
      # 저작권 준수 docstring*(예: schema/problem.py "평가원·EBS·검정교과서는 본문·문항
      # 미보유")에 극도로 흔해서, 낱말 단순 동시등장으로는 실측 292건 오탐이 났다.
      # 그래서 정책 산문이 아니라 **실제 인용의 공식 표기 형식**만 잡는다:
      #   ① 평가원 공식 출처 표기(연도+학년도+대학수학능력시험/모의평가/모의고사) —
      #      실제 기출 인용에는 항상 붙지만 "평가원 기출 금지" 같은 정책 문장에는 없다
      #   ② EBS 대표 교재명(수능특강/수능완성/만점마무리) + 쪽수 표기 — 구조 메타데이터
      #      (JSON {"book":..,"page":47} 등)는 "쪽"·"페이지"·"p."를 산문으로 쓰지 않는다
      # 실측(2026-09-10 main 기준): 두 패턴 모두 저장소 전수 0건 — 배경 산문과 변별됨.
      - name: Forbid EBS·평가원 본문 patterns
        run: |
          set -e
          patterns='[0-9]{4}학년도.*(대학수학능력시험|모의평가|모의고사)|EBS.*(수능특강|수능완성|만점마무리).*[0-9]+(쪽|페이지|p\.)'
          hits=$(grep -rEn --include='*.py' --include='*.md' --include='*.json' \
              --include='*.txt' --include='*.yaml' --include='*.yml' \
              --exclude-dir='.git' --exclude-dir='node_modules' \
              --exclude='ci.yml' --exclude='test_policy_guard_source_patterns.py' \
              -E "$patterns" . | grep -v '#\s*codeowner-ack' || true)
          if [ -n "$hits" ]; then
              echo "$hits"
              echo "::error::EBS·평가원 본문 직접 인용 의심 패턴 발견 (CLAUDE.md 절대 금기)"
              exit 1
          fi
          echo "OK — EBS·평가원 본문 패턴 없음"

      # 저작권 위험 원본 문서(PDF·hwp·오피스·아카이브)의 커밋 차단 — LIC-07 ④.
      # 위 패턴 검사는 "본문을 옮겨 적었는가"를 보지만, 2026-08-08 KICE 보고서 PDF 2건은
      # 원본 파일 자체가 들어온 사고였다(텍스트 검사가 구조적으로 못 보는 축).
      # 확장자 + 매직 바이트 + .gitignore 1차 방어선 실재까지 본다.
      - name: Forbid source-document binaries (저작권 원본 유입 차단)
        run: |
          set -e
          python3 scripts/ops/check_source_document_binaries.py

      # 시크릿 패턴 사전 차단 (의도된 .env.example 등은 .gitignore로 제외됨)
      - name: Forbid hardcoded secret patterns
        run: |
          set -e
          # 흔한 시크릿 패턴 (API 키·토큰)
          # OpenAI sk-..., Anthropic sk-ant-..., GitHub ghp_..., AWS AKIA...
          if grep -rEn --include='*.py' --include='*.yaml' --include='*.yml' \
              --include='*.json' --include='*.toml' \
              --exclude-dir='.git' --exclude-dir='node_modules' \
              --exclude-dir='tests' \
              -e 'sk-[A-Za-z0-9]{32,}' \
              -e 'sk-ant-[A-Za-z0-9_-]{40,}' \
              -e 'ghp_[A-Za-z0-9]{36}' \
              -e 'AKIA[0-9A-Z]{16}' . ; then
              echo "::error::하드코딩된 시크릿 의심 패턴 발견"
              exit 1
          fi
          echo "OK — 하드코딩된 시크릿 패턴 없음"

  # ─────────────────────────────────────────────────────────────────
  # 빌드 하네스 무결성 + 원격 claim 교차 검증 (항상 실행 — 초 단위)
  # 병렬 세션 중복작업 방지: backlog 무결성·stale claim을 PR마다 감시
  # ─────────────────────────────────────────────────────────────────
  harness-integrity:
    name: harness-integrity — backlog 무결성·claim 교차 검증
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # fetch-depth: 0 — HARN-47 브랜치 스캔은 trunk 히스토리와 ahead count를 읽는다.
      # 기본값(depth=1)이면 `is_shallow_repo` 가드에 걸려 **매 실행 "판정 보류"**가
      # 된다. 그건 보호가 아니라 상시 무력 상태다(CLAUDE.md: 상시 실패하는 fail-open
      # 보호를 "보호 있음"으로 신뢰 금지). 이 잡은 초 단위라 full depth 비용을 감당한다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest-randomly(OPS-09) — tests/harness 153건이 무작위 순서 전건 통과함을 실측하고
      # 배선했다(2026-07-27). 하네스는 backlog 대장을 읽는 코드라 순서 의존이 특히 위험하다.
      # ruff·black(OPS-12) — 아래 lint 스텝용 검증 도구. 버전 핀은 backend `dev` extra와
      # 같은 정책(상한을 걸어 메이저 변경 시 재검증 강제). 하네스 *런타임*은 여전히
      # stdlib+PyYAML만이다(설계 불변식) — 나머지는 전부 검증 도구.
      - name: Install deps (하네스 런타임은 stdlib+PyYAML — 나머지는 검증 도구)
        run: |
          pip install pyyaml pytest pytest-randomly \
                      "ruff>=0.7.0,<0.16" "black>=24.10.0,<27"
          # CUR-09 후속: EOS 단원 구조 관측 리포트가 whymath_backend.harness를 import하므로
          # backend 패키지를 editable 설치한다(dev extra 불요 — CLI는 stdlib+PyYAML만 쓴다).
          pip install -e src/backend

      - name: backlog 무결성 검증
        run: python3 scripts/harness/backlog.py validate

      # HARN-52 — 의존 *선언*과 *집행*의 불일치를 막는다. notes에 "선행: X 착지 후"라고
      # 적어도 selector.py는 notes를 읽지 않으므로(depends_on만 본다) 그 태스크는 사람이
      # "막아 뒀다"고 믿는 동안 다른 세션에 착수 가능 후보로 노출된다(#911 리뷰 P2가
      # EOS-62에서 지적 · 저장소 전수 스캔에서 동일 패턴 6건 실재).
      #
      # 판정은 exit code로 한다 — 출력 문자열로 통과를 선언하지 않는다(CLAUDE.md 2026-08-09).
      # 레거시 6건은 dep_declaration.LEGACY_EXEMPT가 그랜드파더하되 HARN-53을 만료 지점으로
      # 못박았다(만료 없는 유예 금지 — 그 태스크가 done인데 면제가 남으면 이 스텝이 red).
      - name: 의존 선언↔집행 대조 (HARN-52)
        run: python3 scripts/harness/backlog.py audit-deps

      # HARN-66 — ADR 번호 충돌을 **원격 전 브랜치까지** 스캔해 막는다.
      # 작업 트리 `ls docs/architecture/adr/`는 "trunk에 무엇이 있는가"만 말하므로 다음 빈
      # 번호를 알려주지 못한다. 2026-09-05에 그 방식으로 ADR-003을 고른 세션이 같은 날
      # 15:45에 선점된 ADR-003과 충돌했다(ADR-004로 개명 상환) — 태스크 번호는
      # `backlog.py add`가 원격 claim까지 검사해 같은 사고를 거부했는데 ADR 번호에는 그
      # 장치가 없었다. 이 스텝이 그 비대칭을 없앤다.
      #
      # 이 잡의 checkout은 fetch-depth: 0이지만 그것만으로는 **원격 브랜치 ref가 로컬에
      # 오지 않는다**(actions/checkout은 기본적으로 단일 ref만 가져온다). 명시적으로
      # 전 브랜치를 fetch해야 스캔이 성립하며, 성립하지 않으면 검사기가 exit 1로 그
      # 사실을 드러낸다("0건 통과" 위장 금지).
      - name: ADR 번호 충돌 검사 (HARN-66 · 원격 전 브랜치)
        run: |
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          python3 scripts/harness/adr_number_check.py

      # HARN-09 — 이 스텝은 **공전하고 있었다**. claim이 `refs/claims/*`에 있었고 그
      # 네임스페이스 push가 프록시에서 403이라 원격 claim이 단 1건도 존재한 적이 없어,
      # reap이 늘 "stale claim 없음"을 보고했다. 즉 "통과"가 "검사했다"를 뜻하지 않았다.
      # 이제 조회 실패("조회 불가")를 stale 없음과 **구분**한다 — 인프라가 죽으면
      # "측정 실패"가 보여야지 "0건 통과"로 위장되면 안 된다(CLAUDE.md AI·신뢰).
      - name: 원격 claim ↔ backlog 교차 검증 (stale claim은 warning)
        run: |
          set -e
          # reap dry-run은 stale 발견 시에도 exit 0 — 청소 안내이지 실패가 아니다.
          # 다만 *조회 실패*는 exit 1이므로 그 경우만 별도로 드러낸다.
          if ! out=$(python3 scripts/harness/backlog.py claims reap); then
            echo "$out"
            echo "::warning::원격 claim 조회 실패 — 중복 착수 방지가 이 실행에서 검증되지 않았다"
            exit 0   # 게이트가 아니라 관측 — CI를 볼모로 잡지 않되 침묵하지도 않는다
          fi
          echo "$out"
          if echo "$out" | grep -q "조회 불가"; then
            echo "::warning::원격 claim 조회 불가 — stale 판정이 수행되지 않았다"
          elif ! echo "$out" | grep -q "stale claim 없음"; then
            # HARN-27 — 이 경고는 오래도록 **아무도 실행하지 않는 명령을 권하고** 있었다
            # ('--apply로 청소 권장'). 집행 지점이 없으니 상시 경고가 습관화됐고, main에서
            # 이미 done인 태스크의 claim조차 영구히 남았다. 이제 확정 사유(task_done·
            # branch_gone)는 harness-audit.yml이 자동 청소하므로, 여기 남는 목록은
            # **사람 판단이 필요한 잔여**(ttl·task_missing)라는 뜻이다.
            echo "::warning::stale 원격 claim 발견 — 확정 사유는 harness-audit이 자동 청소한다. 위 목록에 ttl/task_missing이 남아 있으면 사람 판단이 필요하다"
          fi

      # HARN-47 — 이 스캔은 SessionStart 훅에서만 돌고 있었다. 즉 사람이 대화형 세션을
      # 열 때만 존재했고 CI에서는 한 번도 실행되지 않았다. "저장소에 존재함"과 "돌아감"은
      # 다르다(tests/infra 199건 미실행·브랜치 보호 미강제와 같은 형태의 반복 실패).
      #
      # 게이트가 아니라 **관측**이다 — 남의 방치 브랜치 때문에 무관한 PR을 red로 만들지
      # 않는다. 다만 침묵하지도 않는다: 고립 N건은 warning으로, *측정 실패*는 그와
      # 구분되는 별도 warning으로 낸다(0건 통과로 위장 금지).
      # HARN-78 — `pr_filed`의 열림/닫힘을 GitHub API로 정밀화하려면 `_fetch_pr_states`가
      # 토큰을 읽어야 한다(Codex 리뷰 지적, PR #1043). 토큰이 없으면 이 스텝에서
      # `pr_closed`가 영구히 "상태 미확인"으로만 남아, 이 잡이 그 분류를 한 번도
      # 실측하지 못한다 — `harness-audit.yml`의 API 소비 스텝과 동일 패턴으로 맞춘다.
      - name: 고립 브랜치 관측 — PR로 노출된 적 없는 미머지 브랜치 (HARN-47)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          out=$(python3 scripts/harness/backlog.py branches) && rc=0 || rc=$?
          echo "$out"
          echo "EXIT=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::고립 브랜치 판정 불가 — 이 실행에서 측정되지 않았다(고립 0건이라는 뜻이 아니다)"
            exit 0
          fi
          n=$(echo "$out" | grep -c '^  \[고립\]' || true)
          if [ "$n" -gt 0 ]; then
            echo "::warning::PR로 노출된 적 없는 미머지 브랜치 ${n}건 — 회수(PR 생성) 또는 삭제가 필요하다. 이 목록이 유일한 존재 증거다"
          fi
          # HARN-78 — 닫힌 미머지 PR은 isolated와 같은 "재작업 또는 폐기 판단 필요"
          # 위계인데, 이 카운트가 없으면 `[PR-닫힘]` 줄이 스텝 로그에 묻혀 아무도 안 본다
          # (Codex 리뷰 지적, PR #1043).
          m=$(echo "$out" | grep -c '^  \[PR-닫힘\]' || true)
          if [ "$m" -gt 0 ]; then
            echo "::warning::PR이 닫혔지만 머지되지 않은 미머지 브랜치 ${m}건 — 재작업 또는 폐기 판단이 필요하다"
          fi

      # CUR-09 후속: EOS 단원 구조 관측 리포트 — 현행 모델/스키마/코퍼스에 EOS 설계 메타데이터가
      # 얼마나 반영됐는지 관측·고정. 게이트가 아니라 리포트(exit 0/2). JSON 산출물까지 결정론 검증.
      - name: EOS 단원 구조 관측 리포트 (CUR-09)
        working-directory: src/backend
        run: |
          python -m whymath_backend.harness.eos_unit_structure_observation_report
          python -m whymath_backend.harness.eos_unit_structure_observation_report --json /tmp/eos_unit_structure_observation.json

      # OPS-12 — `tests/harness`·`scripts/harness`를 lint/format하는 잡이 **하나도 없었다**
      # (OPS-11의 harness 판박이). backend 잡은 `../../tests/backend`만, data-pipeline 잡은
      # working-directory `src/data-pipeline`의 `.`만 본다 — 하네스는 대장(backlog)을 판정하는
      # 코드인데 그 자신의 품질은 아무도 검사하지 않았다.
      # 실측(2026-07-27): 배선 직전 ruff F541 2건(test_cli.py) + black --check 17파일
      # (tests/harness 9 전부·scripts/harness 8/9)이 실패 상태였고 아무도 알지 못했다.
      # OPS-13 — 대상을 `scripts/harness`에서 **`scripts` 전체**로 넓힌다. OPS-12가 harness만
      # 배선한 뒤에도 `scripts/` 직속 4파일·`scripts/coverage`·`scripts/demo` 7파일은 여전히
      # 무배선이었다 — "일부만 배선됨"이 같은 디렉터리 안에서 한 번 더 재현된 형태다.
      # lint는 재귀라 `scripts` 하나로 harness까지 덮는다. 잔여 위반은 1파일뿐이었다
      # (`diagnose_atom_orphans.py` black — 이 PR에서 정리. OPS-12가 8파일을 이미 상환한 결과).
      - name: Ruff (scripts + tests/harness)
        run: python3 -m ruff check scripts tests/harness

      - name: Black --check (scripts + tests/harness)
        run: python3 -m black --check --line-length 100 scripts tests/harness

      - name: 하네스 테스트
        run: python3 -m pytest tests/harness -q

  # ─────────────────────────────────────────────────────────────────
  # 선언≠배선 일반 탐지기 (OPS-22) — HTTP 라우트/EventType/타임시리즈/harness CLI 4축 정적 감사
  #
  # `needs: changes` 게이팅을 의도적으로 쓰지 않는다 — 이 감사가 보는 4축(모바일 dart 호출·
  # 백엔드 테스트 호출·backlog 태스크 상태·ci.yml 자신)은 `changes` 잡의 `backend` 필터
  # (src/backend/·tests/backend/만 봄)가 커버하지 않는 영역을 정확히 건드린다. `backend` 잡에
  # 스텝으로 얹었다면 "dart 호출 삭제 PR"이나 "backlog 태스크를 done으로 바꾸는 PR"에서 이
  # 감사가 skip돼(GitHub는 skipped를 required check 충족으로 센다) 회귀가 그대로 머지된다 —
  # "만들고 켜지 않음을 막는 장치가 정작 안 켜지는" 자기모순이 될 뻔했다(구 설계 문서
  # `docs/architecture/data_platform_module_gap_review.md`가 동일 함정을 기록해 둔 선례를
  # 그대로 따른다). schedule 이벤트에서는 스킵(정적 감사라 커밋 변경 없이 매일 다시 돌 이유가
  # 없다 — 상시성은 push/PR로 이미 충분).
  #
  # OPS-24 — 이 잡에 코퍼스 후처리 백필 드리프트 가드 2종(`--check`)이 함께 탄다. 잡 이름은
  # 바꾸지 않는다(브랜치 보호 required check 이름이 잡 name에 걸려 있다 — 개명은 별건).
  # ─────────────────────────────────────────────────────────────────
  declared-unwired-audit:
    name: declared-unwired-audit — 선언≠배선 4축 정적 감사 (OPS-22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # dev extra 불요 — create_app() 임포트에 필요한 런타임 의존성만(FastAPI·SQLAlchemy·
      # PyYAML 등 전부 base dependencies). lint·mypy·pytest는 별도 backend 잡이 이미 검증한다.
      - name: Install dependencies (editable, base only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 게이트 — 선언≠배선 4축 정적 감사 (declared_unwired_audit)
        run: python -m whymath_backend.ops.declared_unwired_audit

      # ── OPS-24 — 코퍼스 후처리 백필 드리프트 가드 2종 ────────────────────────
      # 위 감사기가 "CI 어디에도 도달하지 않는다"고 잡아낸 harness CLI 2종을 여기에 태운다
      # (신규 잡 증설 0 — 이 잡은 base install만 하는 경량 잡이고, `if: != 'schedule'`이라
      # push/PR마다 돌며, `needs: changes` 게이팅이 없어 코퍼스 파일만 바뀐 PR에서도 반드시
      # 돈다. 같은 "선언≠배선" 계열이라 맥락도 일치).
      #
      # ①분류 판정: 두 CLI는 "일회성 운영자 스크립트라 의도적 미배선"이 **아니다**.
      #   `review_status`가 빈 채로 남은 레코드가 생기면 `l6/_shared.py`의 `is_review_cleared`가
      #   fail-closed로 그 문항의 **노출을 전건 차단**한다 — 백필 누락은 서빙 영향을 갖는 회귀다.
      # ②그러므로 CI에 거는 것은 *변이형*(제자리 갱신)이 아니라 **드리프트 가드**(`--check`)다.
      #   CI가 레포 데이터를 재작성해서는 안 된다 — 백필은 사람이 돌려 커밋하고, CI는 "빠진 게
      #   있다"만 빨갛게 알린다. `--dry-run`은 채울 게 있어도 항상 exit 0이라 게이트로 쓸 수
      #   없다(CLAUDE.md "변별력 없는 검증 스텝 금지").
      #
      # `working-directory`를 워크스페이스 루트로 되돌린다 — 이 잡의 기본값은 `src/backend`인데
      # 두 CLI는 레포 루트 기준 상대경로(`data/corpus/...`·`docs/data/...`)를 읽는다. 절대경로
      # (`${{ github.workspace }}`)로 지정해 잡 기본값과의 상대 해석 모호성을 없앤다.
      - name: 게이트 — 코퍼스 review_status 백필 드리프트 (OPS-24)
        working-directory: ${{ github.workspace }}
        run: python -m whymath_backend.harness.problem_corpus_review_status_backfill --all --check

      - name: 게이트 — 코퍼스 persona_fit 백필 드리프트 (OPS-24)
        working-directory: ${{ github.workspace }}
        run: python -m whymath_backend.harness.problem_corpus_persona_fit_backfill --all --check

  # ─────────────────────────────────────────────────────────────────
  # 야간 E2E 관통 슬라이스 (schedule 전용) — S1 게이트 안전망
  # 온보딩→진단→문제→코치(영속)→verify 관통 테스트(test_e2e_vertical_slice_integration)를
  # push/PR 없이도 매일 실 PG로 돌린다. 본체는 이미 backend-migrations 잡에서 push/PR마다
  # 실행되지만(mock LLM·hermetic), 이 잡은 *스케줄 발화*로 코드 드리프트·의존성 표류를
  # 주기적으로 잡는 별도 안전망이다. schedule 이벤트에서만 돌고(위 무거운 잡들은 schedule
  # 가드로 스킵), push/PR 경로는 완전 무변경이다. backend-migrations 잡과 동형(실 PG·trust).
  # ─────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────
  # PB-13: 결정론 저작 도구 회귀 (backend 잡에서 분리)
  #
  # **왜 분리했나**: PB-13이 회수한 테스트 60파일이 자체로 9분 12초다. backend 잡은
  # 이미 28.5분이었고(pytest 단독 22분+) 합치면 37.5분 > timeout-minutes: 35 →
  # 2026-09-01 PR #969에서 실제로 65% 지점 취소됐다.
  #
  # **분리 ≠ 비활성화**: 두 경로에서 반드시 돈다 —
  #   ⑴ 야간 schedule (전량 안전망)
  #   ⑵ authoring 플래그 — 생성기(l3/equivalent)·배치(harness)·그 테스트를 건드리는 PR
  # 즉 이 테스트가 지키는 코드를 바꾸면 그 PR에서 실행된다. 코퍼스 데이터만 바꾸는
  # PR에서는 안 도는데, 이 테스트들이 검증하는 것은 데이터가 아니라 *생성기 로직*이다.
  # ─────────────────────────────────────────────────────────────────
  corpus-authoring:
    name: corpus-authoring — 결정론 저작 도구 회귀 (생성기·배치)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: github.event_name == 'schedule' || github.event_name != 'pull_request' || needs.changes.outputs.authoring == 'true'
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ../data-pipeline

      - name: Pytest (corpus_authoring 마커 전량)
        run: pytest -m corpus_authoring

  e2e-nightly:
    name: e2e-nightly — 관통 슬라이스 (실 PG·야간)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: src/backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: whymath
          POSTGRES_DB: whymath
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whymath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Settings 기본값과 동일(asyncpg·자격증명 없음·trust) — backend-migrations 잡과 일치.
      WHYMATH_DATABASE_URL: postgresql+asyncpg://whymath@127.0.0.1:5432/whymath

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # 교차계층 거버넌스 테스트가 data_pipeline(L1)을 import → 백엔드 잡에도 설치.
          python -m pip install -e ../data-pipeline

      - name: Alembic upgrade head (fresh DB — 전 마이그레이션 적용)
        run: python -m alembic upgrade head

      - name: Pytest (E2E 관통 슬라이스만 — 실 PG·mock LLM)
        env:
          WHYMATH_RUN_INTEGRATION: "1"
          WHYMATH_DB_DISABLE_POOL: "1"
        # `-c pyproject.toml` 필수 — 위치 인자(테스트 경로)를 주면 pytest가 인자의 공통조상을
        # 상향 탐색해 **저장소 루트**를 rootdir로 잡고, 루트 pyproject.toml에는 pytest 설정이
        # 없어 `src/backend/pyproject.toml`의 ini가 통째로 안 읽힌다(OPS-61 실측). 그러면
        # asyncio_mode=auto·--strict-markers·--strict-config·--import-mode=importlib가 전부
        # 빠진 채 도는데 **화면상 정상으로 보인다** — 이 스텝들은 실제로 그 상태로 돌고 있었다.
        # `-c`로 설정 파일을 못 박으면 bare 호출과 동일해진다(rootdir=src/backend·configfile 동일).
        run: python -m pytest -c pyproject.toml -m integration ../../tests/backend/api/test_e2e_vertical_slice_integration.py

      # 초인간 검증 S6(상시성) — 전 코퍼스 verify 재료로 정답을 매일 밤 전수 재검산.
      # 정본 변경·데이터 오염을 야간에 즉시 잡는다(fail 1건이라도 있으면 exit 1). 순수 계산·
      # DB/LLM 0이라 PG 없이도 돌지만 이 잡(야간)에 얹어 상시 재검증을 보장한다.
      - name: 전 코퍼스 재검증 (초인간 검증 S6 상시성)
        run: |
          python -m whymath_backend.harness.corpus_reverify \
            ../../data/corpus/problem_bank_generated_v0/problems.jsonl \
            ../../data/corpus/problem_bank_rephrased_v0/problems.jsonl \
            ../../data/corpus/problem_bank_killer_v0/problems.jsonl

      # ── EOS-64 ① — 앵커 A4 생성 E2E 관통의 **상시화**(1회 실증 → 야간 계측) ─────────
      # EOS-58(`docs/reviews/eos_anchor_e2e_a4_2026-08-30.md`)은 생성→SymPy 게이트→dedup→
      # 코퍼스 저장→검수 큐 관통을 **1회** 실증했다. 1회 실증은 "그때 됐다"이지 "지금도 된다"가
      # 아니다 — 이 스텝이 그 관통을 매일 밤 다시 돌려 드리프트를 잡는다.
      #
      # 실행 주체 판정(태스크 notes의 미결 사항): **CI 러너**다. 이 관통은 hermetic이라
      # (가짜는 LLM provider 하나뿐 — 생성기·SymPy 게이트·dedup·저장·검수 큐·GenerationLog는
      # 전부 실코드) Ollama·API 키 없이 돈다. 라이브(Phaiakes9 Ollama) 회차는 별개 축이고,
      # 그쪽의 상시 계측은 `<out>.rounds.jsonl` 회차 대장 + 연속 무진전 알람(EOS-64 ④)이
      # 담당한다 — CI에 자격증명·GPU를 들이지 않고도 관통 자체는 매일 검증된다.
      #
      # 실 PG는 이 관통에 불요하지만(hermetic) 이 잡에 얹는다 — 야간 안전망을 한 잡에 모아
      # 신규 잡 증설 0을 유지한다(위 코퍼스 재검증 스텝과 같은 판단).
      # 배선 실재성은 `tests/infra/test_anchor_e2e_nightly_wiring.py`가 동결한다(OPS-10 선례 —
      # "워크플로에 썼다"와 "그 잡이 이 관통을 돈다"는 다르다).
      # 실행기(`pytest`)를 단독 호출하지 않는다 — CLAUDE.md "실행기 단독 호출 금지": 다중
      # 환경에서 `pytest` 런처가 `python`과 다른 인터프리터에 결합될 수 있다. 이 잡의 설치·
      # 마이그레이션·테스트 스텝을 전부 `python -m` 형태로 통일해 한 인터프리터로 못 박는다.
      - name: 앵커 A4 생성 E2E 관통 (EOS-64 상시화 — hermetic)
        # `-c pyproject.toml` 필수 — 위치 인자(테스트 경로)를 주면 pytest가 인자의 공통조상을
        # 상향 탐색해 **저장소 루트**를 rootdir로 잡고, 루트 pyproject.toml에는 pytest 설정이
        # 없어 `src/backend/pyproject.toml`의 ini가 통째로 안 읽힌다(OPS-61 실측). 그러면
        # asyncio_mode=auto·--strict-markers·--strict-config·--import-mode=importlib가 전부
        # 빠진 채 도는데 **화면상 정상으로 보인다** — 이 스텝들은 실제로 그 상태로 돌고 있었다.
        # `-c`로 설정 파일을 못 박으면 bare 호출과 동일해진다(rootdir=src/backend·configfile 동일).
        run: python -m pytest -c pyproject.toml ../../tests/backend/harness/test_eos_anchor_e2e_a4.py

  # ── OPS-58 후속 — 병렬화가 약화시킨 탐지력의 복구 (PR #944 Codex P2 지적 수용) ──────
  # `backend — lint·type·test`는 `-n auto --dist loadfile`로 돈다. `loadfile`은 *같은 파일*의
  # 테스트만 한 워커에 묶을 뿐 **파일이 다르면 다른 프로세스**다. 그래서 파일 A가 프로세스
  # 전역을 남기고 파일 B가 그 전역의 기본값을 단언하는 형태의 오염은, 두 파일이 서로 다른
  # 워커에 배정되는 순간 **격리되어 보이지 않는다** — 직렬 전체 스위트라면 터졌을 빨강이
  # 초록으로 통과한다. AGENTS.md가 "전체 스위트 통과만 회귀 없음의 근거 · 부분 실행은 순서
  # 의존 오염을 못 본다"고 못 박은 바로 그 사각이며, xdist 워커는 구조적으로 그 '부분 실행'이다.
  # (실사고 = OPS-06/07: `db.session._engine` 전역이 파일 경계를 넘어 다른 파일의 단언을 깼고
  # 파일 단위 실행에서는 재현되지 않았다. 그 특정 전역은 conftest의 `_guard_db_session_global_leak`
  # 가 테스트 *자신의* teardown에서 잡으므로 xdist에서도 탐지력이 유지되지만, 가드가 없는
  # 다른 전역은 그렇지 않다 — 이 잡이 그 나머지를 담당한다.)
  #
  # 해법은 병렬화를 되돌리는 것이 아니라 **탐지 축을 옮기는 것**이다: PR 경로는 병렬로 빠르게
  # (26:25 → 14:15) 두고, 직렬 전건은 야간에 돌려 교차 파일 오염을 잡는다. 야간이라 머지
  # 경합에 시간을 되돌려주지 않으면서 "직렬 전체 스위트 통과" 증거는 매일 갱신된다.
  # 커버리지는 켜지 않는다 — 이 잡의 목적은 커버리지 판정이 아니라 오염 탐지이고, 계층
  # 커버리지 게이트는 PR 잡이 이미 상시 집행한다(수치가 직렬과 동일함은 PR #944에서 실측).
  backend-serial-nightly:
    name: backend — 전체 스위트 직렬 (교차 파일 오염 탐지·야간)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # 교차계층 거버넌스 테스트가 data_pipeline(L1)을 import → 백엔드 잡에도 설치.
          python -m pip install -e ../data-pipeline

      # `-p xdist.plugin -n0`이 아니라 **플래그 자체를 주지 않는다** — addopts에 `-n`이 없으므로
      # 이 호출은 단일 프로세스 직렬이다. 순서는 pytest-randomly가 매 회차 무작위화하며, 실패
      # 시 실행 헤더의 `Using --randomly-seed=N`을 되먹이면 그 순서가 재현된다.
      # 실행기 단독 호출 금지(CLAUDE.md) — `python -m pytest`로 인터프리터를 못 박는다.
      - name: Pytest (전체 스위트·직렬·단일 프로세스 — 순서 의존 오염 노출)
        run: python -m pytest
