# 충돌 마커 가드 — **ci.yml과 독립된 파일이어야만 의미가 있는** 워크플로 (HARN-128 ③)
#
# 왜 ci.yml의 policy-guard 스텝만으로 부족한가
# ---------------------------------------------
# 이 가드가 막으려는 사고(2026-09-02 · PR #969 · 6209a8b8)는 **ci.yml 자신에 충돌
# 마커가 남은** 경우다. 그 상태에서는 GitHub Actions가 ci.yml을 파싱하지 못해
# 워크플로가 red가 되는 게 아니라 **아예 뜨지 않는다** — 그러면 그 안에 있는
# policy-guard 스텝도 함께 죽는다. 즉 ci.yml 안의 스텝은 정확히 사고 상황에서만
# 무력하다(실측 2026-09-23: ci.yml에 마커를 주입하면 yaml 파서가 ScannerError).
#
# GitHub는 워크플로 파일을 **파일 단위로 독립 파싱**하므로, 별도 파일에 둔 이 잡은
# ci.yml이 깨져도 그대로 돌아 red + 원인 메시지를 낸다. 반대로 이 파일이 깨지면
# ci.yml의 policy-guard 스텝이 이 파일의 마커를 잡는다 — **상호 엄호**다.
# 두 파일이 동시에 깨지는 경우만 남고, 그때도 required check가 0건 보고되어
# 머지는 막힌다(무단 착지가 아니라 정지).
#
# required check로 걸지 않는 이유(의도적)
# ----------------------------------------
# 이 잡의 일은 **차단이 아니라 설명**이다. ci.yml이 깨진 PR은 required check가
# 하나도 보고되지 않아 이미 머지가 막히는데, 사고의 실제 피해는 무단 착지가 아니라
# *원인을 알 수 없는 정지*였다. 그 화면에 빨간 체크 하나와 사유 한 줄을 띄우는 것이
# 이 잡의 존재 이유다. required로 승격하려면 Kiki의 룰셋 편집(사람 게이트)이
# 필요하고, 그 목록의 현행성 자체는 HARN-82가 보는 축이라 여기서 손대지 않는다.
#
# 정직한 공백: tests/infra/test_required_checks_doc.py의 'required 여부를 판단하도록
# 강제' 계약은 **ci.yml의 잡만** 열거한다 — 별도 워크플로 파일의 잡은 그 판단에서
# 구조적으로 빠진다. 이 파일은 그래서 위 단락으로 판단을 명문화했고, 계약 자체의
# 확장은 HARN-165로 등재했다.
name: conflict-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conflict-guard:
    name: conflict-guard — 커밋된 충돌 마커 전수 차단
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 차단 게이트다(continue-on-error 없음). exit 1=위반 · exit 2=측정 실패
      # (대상 0건·git 조회 불가) — 측정 실패도 통과로 접지 않는다.
      - name: 충돌 마커 가드
        run: python3 scripts/ops/check_conflict_markers.py
